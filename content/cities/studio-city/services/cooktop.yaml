title: "Studio City Cooktop Repair — Gas, Ceramic & Electric Fixed Fast"

intro: |
  Most of the ranch homes tucked between Fryman Canyon Road and Laurel Canyon
  Boulevard were built between 1955 and 1968 — and a surprising number still
  have original gas cooktops, or a Whirlpool or GE replacement that's a decade
  overdue for a tune-up. A burner that won't light, a cracked ceramic surface,
  or a knob that spins freely without clicking — these aren't cosmetic problems.
  On a gas line, they're safety problems. Tujunga Village homeowners tend to
  have older open-concept kitchens where a fouled igniter on one burner makes
  the whole cooktop awkward to use, and the fix usually takes under an hour once
  the right parts are on the truck. Down in the flatlands toward Ventura
  Boulevard, apartments and rental units run compact 30-inch drop-in cooktops
  that need full removal from the counter for most repairs — tight access, but
  nothing we haven't dealt with a hundred times. Call us at (323) 870-4790 and
  we can usually have someone out same day.

localContext: |
  Studio City sits mostly in zip code 91604, with a slice of 91602 covering the
  Cahuenga Pass side near the 101 freeway. The housing stock swings wide — post-war
  bungalows on Whitsett Avenue that haven't seen a kitchen update since the Ford
  administration sit a few blocks from renovated hillside homes near Fryman Canyon
  where someone swapped in a Samsung glass-top three years ago and the ceramic
  surface is already showing thermal stress lines. Apartments along Laurel Canyon
  Boulevard and east toward Cahuenga tend to have compact drop-in cooktops where
  the cutout clearance barely fits two hands, which adds time to any repair
  involving the wiring harness or gas supply connection underneath. San Fernando
  Valley summer heat matters too — cooktops in homes without central AC run hotter
  for longer stretches, and that added thermal load shortens the service life of
  igniters, burner caps, and ceramic surfaces noticeably faster than in a
  beach-cooled kitchen in Santa Monica. Hard LA water also builds up inside sealed
  burner wells and around spark electrodes, especially in homes on older supply
  lines in the 91604 grid, accelerating ignition failures that homeowners usually
  blame on the cooktop being old when the real fix is a $40 igniter and a cleaning.

commonProblems:
  - title: "Gas Burner Won't Light — Fouled Igniters in 91604 Ranch Kitchens"
    description: |
      This is the single most common call we get from Studio City. The spark module
      fires, you hear the click, but the burner just won't catch — or it catches
      weakly on one side and the flame blows out immediately. Nine times out of ten,
      it's a fouled burner cap or a cracked spark igniter electrode, not a gas
      supply problem. On older GE and Frigidaire drop-in cooktops, the igniter
      electrode gets coated with grease and carbon over years of use, and the spark
      can't jump the gap cleanly anymore. Cleaning the electrode and burner cap
      sometimes resolves it on the spot. A corroded igniter assembly usually needs
      full replacement — a new OEM igniter on a GE Profile cooktop runs $35–$65 in
      parts, and the repair itself takes under an hour. If the spark module is the
      culprit instead — which happens on Samsung gas cooktops after 6–8 years of
      regular use — parts run $80–$130 and the job takes about 90 minutes total.

  - title: "Cracked Ceramic Surface — Thermal Shock on Glass-Top Cooktops"
    description: |
      Glass-ceramic cooktops crack from thermal shock: a cold pan dropped onto a
      hot surface, or sustained high-heat cooking on a unit that's already been
      thermally stressed for years. In Studio City hillside homes where Samsung and
      LG glass-tops are common in remodeled kitchens, this comes up more than you'd
      expect. A crack in the ceramic glass isn't just cosmetic — it exposes the
      surface element underneath and creates a real shock hazard if any moisture
      gets in. The wiring harness below can also be damaged if the crack runs along
      a burner zone. Replacement ceramic glass panels for a standard 30-inch LG
      cooktop run $150–$250 for the part alone, and full panel replacement typically
      lands at $280–$420 total including labor. On very old units or discontinued
      models where parts aren't available new, a full cooktop replacement makes more
      financial sense, and we'll say so clearly before ordering anything.

  - title: "Infinite Switch Failure — Uneven Heat on Electric Units in Rental Units"
    description: |
      Electric coil and smooth-top cooktops regulate temperature through an infinite
      switch — a cycling mechanism that pulses the surface element on and off to hold
      the selected heat level. When that switch starts failing, you get uneven heat:
      a burner that locks on high no matter where the dial sits, or one that barely warms
      past the lowest setting. Kenmore and Whirlpool electric cooktops from the late
      1990s through mid-2000s, which are still running in Studio City apartment units
      along Laurel Canyon Boulevard, have infinite switches that are now well past
      rated service life. Replacement switches run $20–$45 per burner depending on
      the model, and swapping them out is straightforward once the cooktop is pulled
      from the counter cutout. Permits aren't required for appliance repair in the
      City of Los Angeles. Budget $150–$220 for a two-burner infinite switch
      replacement including labor and diagnostic time.

  - title: "Gas Valve and Knob Failure — Repair vs. Replace on Aging Cooktops"
    description: |
      Control knobs on a gas cooktop do two jobs: they open a valve and trigger the
      ignition switch. When a knob spins freely, the valve stem is stripped — the
      knob isn't physically engaging the valve anymore. On Frigidaire and Amana gas
      cooktops common in Studio City rental units, plastic knob stems crack and wear
      out well before the cooktop itself is done. OEM replacement knobs run $15–$40
      each, and it's often worth replacing all four at once if one has failed. The
      valve assembly underneath is a different and more serious repair — a gas valve
      that sticks, leaks, or fails to shut fully requires immediate attention. A
      failing gas valve on a standard four-burner cooktop runs $90–$160 in parts
      plus one to two hours of labor. Homes in the 91604 zip code with appliances
      over 12 years old should have the flexible gas connector inspected at the same
      visit — those fittings have a rated lifespan and develop slow leaks that a
      combustible gas detector will catch before the nose does.

  - title: "Constant Clicking Igniter — When to Clean vs. When to Replace the Spark Module"
    description: |
      An igniter that keeps clicking after the burner is already lit is annoying and
      points to one of three things: moisture in the igniter well, a cracked igniter
      tip, or a failing spark module. Studio City sees this call spike after winter
      rain events, when moisture gets into the cooktop body through gaps around the
      burner caps. On GE and Whirlpool gas cooktops, drying out the igniter well and
      cleaning the electrode cap fixes it about 60% of the time. The other 40% is a
      damaged spark module — on most 30-inch gas cooktops, that part runs $45–$90
      and takes under an hour to swap. Left unaddressed, a stuck-on igniter module
      draws power continuously, causes premature module burnout, and can eventually
      take down all four burners at once when the module fails completely. It's a
      cheap fix early and an annoying one later.

faq:
  - q: "How fast can you get to Studio City for cooktop repair?"
    a: |
      Studio City is a regular stop for us — the 101 puts us on Ventura Boulevard
      quickly from either the west or the east side of the Valley. Same-day
      appointments are available most days, and for urgent issues like a gas burner
      that won't shut off or a burning smell from the cooktop, we can usually arrive
      within 2 hours of your call. Evening slots are open for homeowners who can't
      leave work early. We'll confirm a specific arrival window when you book, so
      you're not sitting around all day. Call (660) 999-9960 to check what's open
      today — we'll match you with the technician already running calls in your part
      of 91604.

  - q: "What does cooktop repair cost in Studio City?"
    a: |
      A single igniter electrode swap typically runs $85–$130 total including the
      service call. Infinite switch replacement on an electric cooktop lands at
      $150–$220 for one or two burners. Gas valve repairs are $200–$350 depending on
      parts availability and model. Ceramic glass surface replacement on a glass-top
      unit runs $280–$420 for most standard 30-inch models. We give you a firm
      written quote before any work starts — no surprise charges when the invoice
      comes. The diagnostic visit itself is free when you proceed with the repair.
      Call (660) 999-9960 or book online and we'll confirm pricing after the
      diagnostic, not before we've actually looked at the unit.

  - q: "Do I need a permit for cooktop repair in Studio City?"
    a: |
      Straight appliance repair — swapping igniters, replacing infinite switches,
      fixing a control board or burner valve — doesn't require a permit in the City
      of Los Angeles. Where permits come into play is when work involves modifying
      the gas line itself or hard-wiring a new electric unit with a new dedicated
      circuit. Our technicians operate under contractor license, which
      covers both gas appliance connections and electrical appliance work, so if
      your repair crosses into permitted territory we'll handle the paperwork rather
      than leaving you to figure it out. Condo associations near Ventura Boulevard
      occasionally require documentation for appliance work done inside units — we
      can provide a written service report for HOA records on request.

  - q: "Can you repair induction cooktops as well as gas and electric?"
    a: |
      Yes — gas, electric coil, ceramic glass-top, and induction. Induction cooktops
      are showing up in more Studio City kitchen remodels, and they have their own
      specific failure modes: power board burnout, coil failure beneath the glass
      surface, and control panel lockout errors. A failed induction power board on a
      mid-range unit typically runs $120–$200 in parts alone. We carry common
      components for Whirlpool, GE, Samsung, and Frigidaire units on the truck, and
      can source parts for most other brands within one business day. For induction
      repairs on less common imported units, parts lead time sometimes stretches to
      3–5 days — we'll tell you that upfront so you can plan around it rather than
      discovering it after the technician visits.

  - q: "How long should a cooktop last before I replace instead of repair?"
    a: |
      A gas cooktop with regular burner cleaning and occasional igniter maintenance
      runs 15–20 years reliably. Electric and induction units typically hit 10–15.
      The repair-versus-replace math gets real when estimated repair cost exceeds
      50% of what a comparable new unit costs today. On a 13-year-old Kenmore gas
      cooktop priced at $320 new currently, spending $210 on a gas valve and spark
      module replacement is borderline — we'd probably steer you toward a new unit.
      On a 7-year-old Samsung glass-top that just needs an igniter, the repair
      makes obvious sense. We'll give you that honest read during the diagnostic
      visit. Labor carries a 90-day warranty; OEM electrical parts typically come
      with a 1-year manufacturer warranty, which we pass through directly to you.

  - q: "What cities near Studio City do you cover for cooktop service?"
    a: |
      Studio City is near the center of our San Fernando Valley service zone. From
      here we cover Sherman Oaks, Burbank, Toluca Lake, Valley Village, North
      Hollywood, and Van Nuys to the north and west. South of the hill we run calls
      in West Hollywood, Silver Lake, Los Feliz, and Glendale. We also handle
      Pasadena, Arcadia, and the San Gabriel Valley on the east side. Scheduling
      across all these areas runs same-day or next-day for most calls. Studio City's
      central location makes it one of our faster-response zones — we're typically
      not bouncing across town to get to you. Call (660) 999-9960 to get on today's
      schedule and we'll send a confirmation with your technician's arrival window.
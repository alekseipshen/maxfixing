title: "Hermosa Beach Freezer — Built-Ins, Salt Air, Column Units Fixed"

intro: |
  The Strand-adjacent townhomes along Hermosa Avenue in 90254 are packed with
  Sub-Zero column freezers built into floor-to-ceiling cabinetry — gorgeous
  until the evaporator coil ices over and the unit can't hold temperature.
  Getting a technician into those spaces means tight spiral stairwells, permit
  zones on every residential block, and panel-access that often requires pulling
  cabinetry trim before you even touch the appliance. Most companies skip
  Hermosa Beach because of the logistics. We don't. Call (323) 870-4790 and
  we're usually there within two hours.

localContext: |
  90254 is the only zip covering Hermosa Beach — from the beachfront
  three-story builds near the Pier down to the 1950s bungalows tucked along
  Loma Drive and Ardmore Avenue. The remodeled bungalows and 2000s-era
  townhomes both trended toward panel-ready column units: Thermador Freedom,
  Sub-Zero 700 series, the occasional KitchenAid counter-depth. Tight
  mechanical clearance is the norm, and the marine layer off the Pacific
  pushes humidity into every electrical terminal it can reach — corroding
  condenser fan bearings and control board contacts faster than any
  neighborhood ten miles inland. Add the sand that drifts off the Strand
  and works its way into door gasket channels, and Hermosa Beach puts real
  stress on appliances that in Pasadena would last another decade without issue.

commonProblems:
  - title: "Condenser fan motor seizing from coastal humidity"
    description: |
      The marine layer in Hermosa Beach is relentless year-round, and the
      condenser fan motor on most column freezers sits in an open rear cavity
      pulling ambient air constantly. On a Sub-Zero 700 series unit, that
      bearing can seize within five to seven years of coastal exposure — the
      freezer starts running loud, then slowly loses temperature. A grinding
      noise cycling on and off every few minutes is usually the first sign;
      homeowners often assume the compressor is failing when the fan is the
      actual culprit. Sometimes the motor shorts before the homeowner notices
      anything. Swapping the motor assembly is a same-day fix once we have
      access behind the unit.

  - title: "Frost buildup choking airflow in panel-ready Thermador units"
    description: |
      Panel-ready Thermador and KitchenAid column freezers from the 2010s are
      showing up with heavy frost packed onto the evaporator coil — a sign
      the defrost heater assembly or defrost timer has quit. Once that coil
      ices solid, airflow collapses and cabinet temps climb into the low 20s.
      Thermador Freedom units typically throw an E3 or E7 error code before
      temperatures drop too far, which narrows diagnosis considerably. If the
      display is blank and the interior is warm, the control board or thermal
      fuse is a more likely culprit than the defrost system. Diagnosing takes
      30-40 minutes; the actual repair is usually straightforward after that.

  - title: "Door gasket failure on Sub-Zero built-in columns"
    description: |
      The door gasket on a Sub-Zero 36-inch built-in takes real punishment in
      a beach house — sand tracked in from the Strand, salt in the air, the
      constant open-and-close of a household that lives outdoors half the year.
      Once that magnetic seal weakens, warm air infiltrates continuously.
      The compressor cycles nonstop trying to compensate, frost accumulates
      unevenly along the back wall, and energy bills climb. A simple dollar-bill
      test tells you fast: slide a bill into the closed door and pull — if it
      slides out without resistance, the gasket is gone. Replacing the
      gasket plus realigning the door hinge typically lands well under $200
      in parts and labor.


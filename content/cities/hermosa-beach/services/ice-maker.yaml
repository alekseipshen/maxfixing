title: "Hermosa Beach Ice Maker — Scaled Valves & Frozen Lines Fixed Fast"

intro: |
  Beachfront properties on The Strand and the townhomes backing up to Valley Drive
  share a common headache: LA municipal water runs genuinely hard through 90254, and
  ice maker assemblies take the worst of it. A KitchenAid built-in that was putting
  out a full bin every day will start producing hollow cubes — or nothing at all —
  once mineral scale starts choking the fill valve. That's not a mysterious refrigerator
  failure. It's a predictable water chemistry problem a technician can usually close
  out in a single visit.

localContext: |
  Hermosa Beach's 90254 housing stock runs a wide range: 1950s beach cottages with
  galley kitchens, 1970s duplexes along Prospect Avenue, and newer 3-story townhomes
  near Aviation Boulevard that came pre-fitted with Sub-Zero or Thermador columns.
  Compact kitchens in the older bungalows near 2nd Street can make pulling a
  panel-ready built-in a tight job — sometimes two inches of clearance on each side.
  Parking a service van on the narrow residential blocks between Hermosa Avenue and
  Valley Drive is its own puzzle, but we run South Bay routes daily and factor that in.

commonProblems:
  - title: "Calcium Scale Kills the Water Inlet Valve — Ice Production Drops to Zero"
    description: |
      Hermosa Beach water deposits calcium and magnesium inside the water inlet valve
      until flow drops below what the ice maker needs to complete a cycle. Sub-Zero and
      KitchenAid built-ins are the units we see most often with this failure — the valve
      solenoid strains against scale buildup, then quits. Replacing the valve is the
      correct fix; descaling alone won't hold more than a few months in this zip code's
      water conditions. Most replacements close same day with parts we carry on the van.

  - title: "Frozen Fill Tube Shuts Down Overnight — No Ice by Morning"
    description: |
      A fill tube that ices over between cycles points to one of two things: the
      freezer thermostat is set too cold, or the defrost cycle is failing to clear
      residual moisture. Bosch and Thermador units are frequent offenders here,
      especially in older South Bay homes where the original factory calibration has
      drifted over a decade of use. Catch it early and it's a calibration or defrost
      timer fix. Let it run too long and the ice maker assembly itself takes secondary
      damage from ice pressure.

  - title: "Sensor Malfunction Cuts the Cycle Short — Small, Misshapen Cubes"
    description: |
      Newer column refrigerators use an optical or infrared ice level sensor to detect
      when the bin is full. Viking and Miele built-ins are especially prone to sensor
      drift when mineral film coats the lens — the unit reads a false "full" signal and
      stops the cycle before cubes form completely. The result: undersized, cloudy, or
      hollow ice. A cleaning and recalibration usually resolves it without pulling the
      control board. If the sensor itself has failed, replacement parts are typically
      in stock for common Viking and Miele configurations.


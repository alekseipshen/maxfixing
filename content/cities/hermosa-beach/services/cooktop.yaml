    a: "South Bay is covered daily — Hermosa Beach runs about 20 to 30 minutes from our Redondo Beach and Manhattan Beach routes on a normal weekday. Street parking near The Strand gets difficult on summer afternoons, so we text you 15 minutes out to coordinate a spot. Same-day slots are available most weekdays. Call (323) 870-4790 and we'll check what's open today."
  - q: "Do you repair Wolf, Thermador, and Viking cooktops in Hermosa Beach?"
    a: "Yes — those three are the brands we see most in the 90254 zip. On Wolf gas units it's usually the spark module or igniter electrode. Thermador dual-fuel cooktops tend to develop control board faults or a sticking simmer valve. Viking problems often trace back to the gas valve igniter assembly. We stock common parts for all three and try to avoid a return trip."
  - q: "What does a cooktop repair call typically cost in Hermosa Beach?"
    a: "Diagnostic is $75 and applies toward the repair if you move forward. Most cooktop jobs — igniter replacement, burner cap cleaning, gas valve work, surface heating element swap — run between $150 and $300 parts and labor. Evening and emergency slots available if the cooktop goes out mid-week before a dinner. Schedule online or call (323) 870-4790 for same-day availability."
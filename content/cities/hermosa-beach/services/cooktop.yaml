title: "Hermosa Beach Cooktop — Salt Air Kills Igniters, We Fix Them"

intro: |
  The salt air rolling off The Strand doesn't just affect outdoor furniture — it works into your kitchen too. Corroded spark igniter electrodes are the top cooktop complaint we get in the 90254 zip, especially on the Wolf and Thermador units standard in Hermosa Beach's remodeled cottages and newer townhomes near Pier Avenue. A burner clicking fifteen times before it lights is almost never the knob. Usually it's the igniter electrode, corroded from the inside by sea air working into the assembly over a few years. The ceramic insulator degrades first, then the electrode tip itself oxidizes and loses spark consistency entirely.

localContext: |
  Most of the housing stock along the walk streets west of Valley Drive dates from the 1950s and early 1960s — tight beach cottages that got full kitchen remodels somewhere between 2005 and 2015. A Viking slide-in or Bosch induction cooktop often ends up sitting in a cabinet cutout that wasn't originally sized for it. Reaching the gas valve or spark module in those builds requires the right extension tools. The 90254 zip also skews heavily toward condos and townhomes, so elevator access and permit-restricted parking add real time to every service call. On Hermosa Avenue north of 8th Street, red zones and beach parking enforcement mean we plan the logistics before we even load the van.

commonProblems:
  - title: "Burner Won't Light — Salt Corrosion Attacking the Igniter Electrode"
    description: "Coastal salt air accelerates oxidation on spark igniter electrodes faster than anywhere in the inland Valley. The electrode tip corrodes, the ceramic insulator cracks, and you're clicking a dozen times before the burner catches — if it catches at all. Wolf and Thermador open-burner designs pull ocean air directly across the igniter assembly every time you cook. We carry the replacement electrode in the van for most common Wolf 36-inch models and can usually close it out same visit."
  - title: "Cracked Ceramic Glass Surface — Small Kitchens, Heavy Pans"
    description: "Bosch and KitchenAid smooth-top cooktops share a common failure point: the ceramic glass surface doesn't survive a cast iron skillet dropped from counter height. Even a hairline crack compromises the radiant heating element underneath and creates a real electrical hazard — don't cook on a cracked surface. In compact 90254 beach cottage kitchens, counter space is tight and heavy cookware lands hard. Surface glass replacement is the only correct fix. Patching ceramic looks fine for a week, then fails. We source OEM glass panels directly and match the original thickness spec — aftermarket panels often sit proud of the trim ring and cause secondary cracking."
  - title: "Uneven Flame — Hard Water Clogging Burner Ports in the Cap"
    description: "LA hard water carries the same mineral load in 90254 as anywhere else in the metro — calcium deposits build up inside the burner cap ports regardless of proximity to the beach. On Thermador and Viking gas cooktops, scaled ports cause one side of the flame ring to run hotter than the other. Simmer settings turn unpredictable. Thorough port reaming and a burner cap inspection usually restores even distribution completely without swapping any parts."


title: "Santa Clarita Washer — Hard Water Kills Machines Here"

intro: |
  Valley heat in Santa Clarita runs brutal from June through September — and washers
  in the 91355 zip code work overtime because of it. Valencia tract homes from the
  mid-1990s tend to run LG or Samsung front-loaders tucked into laundry closets off
  the hallway, and those water inlet valves choke on mineral deposits faster than most
  people expect. Hard water here tests in the 350–400 ppm range. The damage is real,
  and it's cumulative.

localContext: |
  Most of the housing stock in Santa Clarita was built between 1990 and 2010 —
  Canyon Country, Saugus, and Stevenson Ranch are full of two-story tract homes with
  standard-depth laundry rooms. The 91351 zip has older Newhall neighborhoods with
  tighter utility spaces and original plumbing. Bosch and KitchenAid stackable units
  show up frequently in the newer Valencia developments near Bouquet Canyon Road, where
  HOA-driven design pushed compact European-style appliances into dedicated closets.

commonProblems:
  - title: "Water Inlet Valve Blockage from Santa Clarita's Hard Water"
    description: |
      Santa Clarita Municipal Water tests around 370 ppm — that calcium load coats
      the water inlet valve screens and restricts flow until the machine throws an
      error or simply won't fill. Seen it repeatedly on Samsung WF45 models in Canyon
      Country. Replacing the inlet valve usually solves it; skipping descaling
      service accelerates the next failure cycle.
  - title: "Drain Pump Failures Mid-Cycle in High-Efficiency Front-Loaders"
    description: |
      LG and Bosch front-loaders in Stevenson Ranch and Valencia homes commonly
      develop drain pump clogs from lint, coins, and debris — the OE or E2 error
      code shows up mid-cycle with the drum sitting full of standing water. The
      pump impeller jams, sometimes seizing entirely. These tract-home laundry
      alcoves are tight; pulling the machine out for access takes care.
  - title: "Door Lock Assembly Wear on Front-Load Washers"
    description: |
      The door latch assembly on KitchenAid and Bosch front-loaders degrades after
      four to six years of daily use — the machine either won't start or holds the
      door shut after the cycle ends. It's a direct part swap, but the latch has to
      be model-specific. A mismatched part pushes fault codes to the control board
      and creates a new problem on top of the original one.


title: "Long Beach Refrigerator Repair — Coastal Air, Narrow Kitchens"

intro: |
  Marine layer humidity from the Pacific doesn't stop at the Bluff Park railing — it gets pulled into
  every condenser coil between 2nd Street and the harbor. A Sub-Zero column in a Naples Island
  waterfront home sees salt aerosol on its compressor cooling fins year-round, and a Bosch counter-depth
  in a Downtown 90802 high-rise condo runs against Long Beach's 280-330 ppm hard water clogging the
  ice maker valve. Most of the warm-fridge calls we get on the Westside are one of these two failures
  catching up after three or four years of quiet wear.

localContext: |
  Long Beach housing splits sharply by zip. Naples Island (90803) is 1920s-1940s waterfront homes with
  doorways narrower than today's 36-inch French door units — getting a fridge in or out without
  scratching original casing is part of the job. Belmont Shore around 2nd Street runs Craftsman and
  Spanish bungalows with the same constraint. Downtown 90802 high-rises (Aqua, West Ocean) handle
  full-depth Bosch and KitchenAid built-ins but suffer water hammer issues on upper floors that wreck
  inlet valves. East Long Beach (90808) and Bixby Knolls (90807) are 1950s-60s tracts — easier access,
  but garages with poor airflow push compressors past spec during late summer.

commonProblems:
  - title: "Ice Maker Inlet Valve Clogged by Long Beach Hard Water"
    description: "Long Beach Water Department runs 280-330 ppm hardness depending on the blend that
      week. That scale builds up inside the dual solenoid valve feeding the ice maker — Samsung
      french-door models with the under-counter ice tray are the most common call. The fill tube
      crusts over, ice cubes come out hollow or stop forming entirely. A full valve replacement plus
      line flush takes under 90 minutes."
  - title: "Salt Air Corroding Condenser Coils on Naples and Belmont Shore Units"
    description: "Within four blocks of the canals, salt aerosol settles on the back-mounted condenser
      coil and accelerates oxidation on the aluminum fins. Sub-Zero 600 series and Viking built-ins
      lose 20-30% of their heat rejection capacity over five years here. The compressor runs longer
      cycles to compensate, food in the fresh-food compartment creeps above 40°F, and eventually the
      compressor windings overheat. Cleaning and re-coating the coil is straightforward when caught
      early."
  - title: "Defrost Drain Freezing Over in Older Wrigley and 90805 Tract Homes"
    description: "North Long Beach and Wrigley fridges — usually Whirlpool or GE side-by-side units
      from the early 2000s — sit in garages or service porches with high ambient humidity. The
      evaporator defrost cycle melts ice as designed, but the drain channel freezes shut between
      cycles. Water backs up under the crisper drawers and eventually onto vinyl flooring. Clearing
      the drain and installing a heated drain clip is a standard fix."

faq:
  - q: "How fast can you get to Long Beach for a refrigerator repair?"
    a: "We cover Long Beach off the 405 and 710 routes daily. Most addresses in 90802, 90803, 90804,
      and 90807 are under 90 minutes from dispatch — sometimes same-hour if a tech is wrapping a job
      in Lakewood or Signal Hill. Call (323) 870-4790 to confirm the window."
  - q: "Do you repair Sub-Zero and Viking refrigerators specifically?"
    a: "Yes — Sub-Zero is the most common premium brand we see in Naples Island and Bluff Park
      (90814). We carry door gasket sets, condenser fan motors, and the most common evaporator parts
      for the 600 and 700 series. Viking built-ins in Bixby Knolls come up less often but we source
      OEM parts directly. Standard brands — KitchenAid, Bosch, Samsung, LG, Whirlpool — are stocked
      on the truck."
  - q: "What does a refrigerator repair typically cost and how does the process work?"
    a: "Diagnosis is flat-rate and applies toward the repair. Most jobs — inlet valve, defrost timer,
      gasket, drain clearance — run $160-$340 in parts and labor combined. Compressor or sealed
      system work runs higher and we quote before opening anything up. Same-day slots are common on
      weekdays. Call (323) 870-4790 to book."

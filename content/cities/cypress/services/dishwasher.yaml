title: "Cypress Dishwasher — Hard Water & Drain Repairs, 90630"

intro: |
  Orange County tap water in the 90630 zip consistently tests above 300 ppm calcium carbonate — among the harder supplies in Southern California — and dishwashers quietly absorb that mineral load until something stops working. That Bosch 500 Series sitting in a Denni Street kitchen accumulates scale inside the spray arm nozzles over 18–24 months, and suddenly the top rack isn't getting clean. Most Cypress calls we handle trace back to hard water damage that started well before the owner noticed anything wrong.

localContext: |
  Cypress was built out primarily between 1960 and 1985 — ranch-style homes and two-story tract houses on aging plumbing along streets like Moody, Grindlay, and Cerritos Avenue. The 90630 zip has tight kitchen footprints in older floor plans that weren't sized for today's 24-inch European dishwashers. Retrofitting a KitchenAid or Bosch into a 1970s cutout is common here, and that means door hinge stress and awkward service access come with almost every repair call.

commonProblems:
  - title: "Spray Arm Clogs from 90630's High-Mineral Water"
    description: "Calcium deposits from Orange County water block the spray arm nozzles on Bosch and KitchenAid units within 1–2 years of regular use. The top rack stops cleaning first — glasses cloud over, food residue sticks. Descaling the arm and inspecting the filter assembly usually fixes it, but heavily scaled units need the arm replaced outright."
  - title: "Standing Water After the Cycle — Drain Pump Failure"
    description: "Pooling water at the tub bottom after washing almost always points to a failing drain pump or a jammed pump filter. LG and Samsung models are especially prone — small food particles bypass the coarse filter and lock up the impeller. An E24 or OE error code means the pump is running but losing flow fast."
  - title: "Detergent Dispenser Stuck or Door Latch Not Catching"
    description: "A dispenser that won't open mid-cycle leaves detergent sitting in the tub — dishes come out dirty with no obvious reason why. On Bosch 300 and 800 series units the dispenser actuator spring fatigues around year five to seven. Door latch failures are separate but just as common, especially on older KitchenAid built-ins where the plastic latch housing cracks under daily use."

faq:
  - q: "How fast can you get to Cypress for dishwasher repair?"
    a: "We run an Orange County route that covers 90630 — usually on-site within 2 hours of your call. Cerritos Avenue and the 91 Freeway keep access clean from most directions. Call (323) 870-4790 to check same-day availability."
  - q: "Do you repair Bosch and KitchenAid dishwashers in Cypress?"
    a: "Yes — Bosch, KitchenAid, and LG are the three brands we see most in Cypress homes. Common fixes: Bosch spray arm and control board replacements, KitchenAid door latch assemblies, LG drain pump swaps. Parts for all three are stocked on the van."
  - q: "What does dishwasher repair cost in Cypress, and how soon can you come?"
    a: "Most repairs run $150–$350 depending on the part. Drain pump and control board jobs sit at the higher end. We diagnose on-site and quote before touching anything — same-day slots are open most weekdays and Saturday mornings. Evening appointments available on request."
title: "Glendora Washer — Hard Water & Foothills Heat Kill Drum Bearings"

intro: |
  Summer in the foothills means laundry piles up fast — families in Glendora run
  washers almost daily through July and August, and that's exactly when drum
  bearings and drive belts start giving out. The San Gabriel Valley Water Company
  feeds 91741 at 300+ ppm hardness, which quietly calcifies water inlet valves on
  Bosch and LG front-loaders inside of two or three years. Two problems compounding
  each other, and most homeowners don't notice until the error codes start flashing.

localContext: |
  Glendora's housing stock runs heavy on 1960s and 1970s ranch-style homes —
  especially along the Sellers Avenue corridor and north toward the foothills.
  Utility closets in those houses are tight, and front-loaders often got installed
  without proper leveling pads years ago. The 91740 zip has more recent
  construction with dedicated laundry rooms, but the older 91741 homes frequently
  have stacked units crammed into spaces that make accessing the drain pump an
  actual job. Bosch and KitchenAid are common throughout; Samsung and LG dominate
  the newer builds near Citrus Avenue.

commonProblems:
  - title: "Mineral Scale Destroying Water Inlet Valves in 91741 Ranch Homes"
    description: "Glendora tap water at 300+ ppm deposits calcium scale inside
      the water inlet valve screens fast. On a Bosch 500 Series or LG front-loader,
      that flow restriction triggers fill errors or complete no-fill symptoms within
      a few years. Replacing the inlet valve assembly usually runs under $150 in
      parts — catching it early keeps the control board from burning out trying to
      compensate for the low flow."
  - title: "Drum Bearing Failure From Unlevel Floors in Older Laundry Closets"
    description: "Older ranch homes near Citrus College frequently have washers
      sitting on slightly sloped garage concrete — that tilt puts constant lateral
      load on the drum bearing. Loud grinding on spin cycle and wobble at high RPM
      are the giveaways. Maytag and Whirlpool top-loaders from the mid-2010s are
      especially prone once the bearing seal wears through. It's a half-day repair,
      not a replacement job."
  - title: "LG OE Error Code From Drain Pump Sediment Buildup"
    description: "LG TurboWash models — common in newer construction on Glendora's
      south side near 91740 — accumulate mineral debris and lint in the drain pump
      filter that most owners never clean. OE error means blocked or failing drain
      pump. The pump impeller itself is usually intact; it's just packed with
      hardwater sediment. Ten-minute flush fixes it. Cracked impeller means a
      full pump swap — still under $200."

faq:
  - q: "How fast can you get to Glendora for washer repair?"
    a: "From our San Gabriel Valley base, Glendora is 25-35 minutes — we cover
      both 91740 and 91741 regularly. Same-day slots are usually available if you
      call before noon. Reach us at (323) 870-4790 and we can confirm a window."
  - q: "Do you repair Bosch and KitchenAid front-loaders in Glendora?"
    a: "Yes — Bosch 300 and 500 Series are probably the most common call in this
      part of the Valley. We handle KitchenAid, LG, and Samsung regularly too.
      On Bosch it's usually the door latch assembly or control board. LG is almost
      always the drain pump or spin basket bearings."
  - q: "What does a washer repair cost, and do you do emergency calls?"
    a: "Most repairs land between $150-$350 depending on the part. Lid switch and
      shock absorber swaps are on the low end; control boards and drum bearing
      replacements are higher. Evening and same-day emergency slots exist for
      mid-cycle failures with a full wet load stuck inside — call (323) 870-4790
      to check availability."

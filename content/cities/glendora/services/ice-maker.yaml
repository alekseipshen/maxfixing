title: "Glendora Ice Maker Repair — Hard Water Fix for SGV Homes"

intro: |
  North of Foothill Boulevard in the 91741 zip, a lot of kitchens got upgraded in the 2010s —
  KitchenAid French-door refrigerators, LG counter-depths, some Sub-Zero columns going into the
  bigger lots near Lone Hill Avenue. Those machines handle the summer heat fine until the water
  catches up with them.

  Glendora pulls from the San Gabriel Basin, and that water runs hard — mineral buildup inside
  the fill valve and water lines is one of the most common service calls we get out here. We run
  jobs in the 91741 and 91740 zips several times a week, and the failure patterns are consistent
  enough that we can often name a likely repair before we even pull the fridge out.

localContext: |
  Post-war homes in the 91740 area — the grid south of Route 66 around Alosta Avenue and
  Grand Avenue — often have tighter kitchen layouts. Getting to a built-in unit sometimes means
  pulling a refrigerator out completely, which adds time to a service call. Plan for it.

  North Glendora closer to the foothills saw heavy renovation from 2012 to 2020. Sub-Zero and
  Thermador columns replaced a lot of original side-by-sides on the larger lots up there. Those
  built-in units need brand-specific tooling — a Thermador column refrigerator is not the same
  job as a Whirlpool side-by-side, and the access points are completely different. We carry the
  right gear for both. Bosch integrated units are also showing up in remodeled Glendora kitchens
  now; the drain pump and inlet valve on those differ from the Korean brands.

commonProblems:
  - title: "Mineral Scale Blocking the Water Inlet Valve"
    description: |
      San Gabriel Valley water commonly tests 240–280 ppm hardness. That mineral load coats
      the water inlet valve solenoid on KitchenAid and LG models — the valve stops opening
      fully, output drops to small misshapen cubes, then production stops entirely. A replacement
      valve plus a full line flush usually resolves it in one visit.

      Cloudy or undersized cubes before the unit cuts out completely? Almost always the inlet
      valve going first. On KitchenAid French-door models, that valve sits behind the rear access
      panel. On LG counter-depth units the access is tighter, but still a same-day repair in
      most Glendora homes.

  - title: "Frozen Supply Line During Summer Heat Cycles"
    description: |
      Sounds backwards, but Glendora summers push refrigerators to overcool. On Samsung
      French-door models, the supply line runs close to the freezer back wall — aggressive
      cooling cycles freeze it solid. The unit throws no error code. Just no output.

      Fixing it means thawing the line, recalibrating the freezer thermostat, and rerouting
      away from the cold zone so it does not refreeze when temperatures hit the 90s on Foothill
      Boulevard. The thermostat recalibration step matters — skip it and you are back to a
      frozen line inside two weeks.

  - title: "Optical Sensor Failure on Sub-Zero and Thermador Units"
    description: |
      Sub-Zero and Thermador use an optical sensor to detect a full bin. Hard water leaves a
      mineral film on the sensor lens — the machine reads "full" even when the bin is empty, and
      production stops. A deep clean of the sensor assembly, the inlet screen, and the module
      usually restores operation without replacing parts. No new components needed, no parts
      markup on the invoice.

      These calls are common in the larger lots off Gladstone Street where Sub-Zero was standard
      on renovated kitchens. Steady green status light but an empty bin? Sensor film is the
      first thing to check on those units.

faq:
  - q: "How fast can you get to Glendora for ice maker repair?"
    a: |
      Most days same-day service is available. From our SGV base it is typically a 20–30
      minute drive to Glendora — usually on-site within 2 hours of your call. Ring us at
      (323) 870-4790 to check the current schedule, or book online. Street parking in
      residential north Glendora is generally easy for the service van, so there is no
      parking surcharge on most calls.

  - q: "Do you service KitchenAid, Sub-Zero, and Samsung ice makers specifically?"
    a: |
      Yes — KitchenAid and Sub-Zero are the two we see most in the 91741 zip. KitchenAid
      usually needs a fill valve swap or a module reset. Sub-Zero requires sensor cleaning
      or a full assembly replacement. Samsung French-door and LG counter-depth units are in
      heavy rotation too; fill valve and supply line issues dominate on both brands.

  - q: "What does repair cost, and do you offer same-day service?"
    a: |
      Most calls run $120–$280 depending on the part. A water inlet valve replacement or
      thermostat adjustment sits at the lower end; a full assembly on a Samsung or LG runs
      higher. Diagnosis happens on-site and we quote before touching anything.

      Same-day slots are standard — evening appointments available for Glendora. Call
      (323) 870-4790 if the freezer section is already empty and you need someone out today.
title: "Glendora Wine Cooler Repair — Foothill Heat & Hard Water"

intro: |
  That Sub-Zero dual-zone built into the kitchen island on Via Verde — impressive unit, brutal operating conditions. Glendora sits at the base of the San Gabriel Mountains where summer temperatures push past 100°F regularly, and the local MWD water supply runs hard enough that calcium deposits coat the evaporator coil and clog the drain tray within two to three years. A wine cooler fighting both peak summer heat and mineral buildup demands more attention than the manual suggests — and fails sooner when it doesn't get it.

localContext: |
  Homes in 91741 span the range from 1950s ranch-style construction along the flat streets west of Grand Avenue to newer custom builds climbing toward Glendora Mountain Road. Older kitchens were designed around standard refrigerators — retrofitting a Bosch or KitchenAid undercounter wine cooler creates tight side clearances that restrict condenser airflow from the start. The hillside homes near Glendora Country Club typically run integrated Sub-Zero and Thermador units. Getting to the compressor on those models requires pulling the unit completely and removing the door panel first.

commonProblems:
  - title: "Not Cooling — Condenser Blocked in Tight Undercounter Installs"
    description: |
      In undercounter setups with under-two-inch side clearances — common in Glendora's older ranch-style kitchens — the condenser fan has almost no fresh air to draw across the condenser coils. Dust and kitchen grease pack in within months. The compressor overheats, trips thermal protection, and cycles off. That LG single-zone built into a wet bar runs this exact pattern. Cleaning the condenser coils and testing the fan motor blade usually resolves it before a full compressor replacement becomes necessary.

      Hard water from the 91741 MWD supply compounds the problem. Calcium scale on the evaporator coil cuts heat exchange further — a packed condenser plus a scaled evaporator means the refrigerant circuit never reaches target pressure, and cooling just stops. Two separate causes, one failed unit.

  - title: "Temperature Fluctuation — Worn Door Gasket in a Dry Inland Climate"
    description: |
      A dried-out or cracked door gasket lets Glendora's 98°F summer air bleed into the cabinet continuously. The thermostat compensates, the compressor runs almost without stopping, and internal temperatures still drift 8-10°F across both zones.

      KitchenAid dual-zone coolers show this failure pattern after five or six years. The foam backing in the gasket dries and cracks faster in dry inland climates than it would at a coastal home — replacing the gasket early prevents a much more expensive compressor job later.

  - title: "Vibration Noise — Compressor Mount and Evaporator Fan Issues"
    description: |
      That low-frequency rattle every time the compressor cycles on is typically a loose compressor mounting bracket or a cracked blade on the evaporator fan motor. Bosch freestanding units have a known clearance issue — the fan blade sits close enough to the housing that minor vibration brings it into contact. Built-in Sub-Zero models installed on tile floors without proper leveling feet adjustment transmit resonance directly through the cabinetry. Sounds worse at 2am simply because ambient noise drops, not because anything changed overnight.

      One more thing worth checking on the Bosch: if the rattle comes with an E15 or E24 error code on the display, that points to a drain pump failure running alongside the fan issue. Two separate repairs, but both are bench-stock parts and we can usually handle both in one visit.


title: "Laguna Beach Dryer — Salt Air Ruins Heating Elements Fast"

intro: |
  Salt air off the Pacific accelerates corrosion inside dryer cabinets — most
  homeowners don't notice until the machine stops heating entirely. Up in
  Bluebird Canyon and the hillside streets near Top of the World, Miele and
  Bosch condensation dryers develop moisture sensor failures years ahead of
  schedule compared to identical units installed 20 miles inland. Add the
  constant cycle of beach towels, wetsuits, and board shorts through these
  machines, and thermal fuses blow at 18 months instead of the usual five years.

  That salt-and-humidity combination does something specific to heating element
  housings: it pits the metal contacts inside the terminal block, which creates
  resistance heat at exactly the wrong spot. The fuse trips. You replace it.
  Six months later, same thing. The cycle repeats because the contacts were never
  cleaned. Laguna Beach dryers fail this way more than almost anywhere else in
  Orange County.

  Viking gas dryers in the hillside builds near Skyline Drive take the coastal
  abuse especially hard — the gas valve igniter corrodes first, well before the
  drum components show any wear. Miele vented models along Pacific Coast Highway
  face a different problem: the moisture sensor coating degrades from repeated
  salt exposure, causing endless cycles that never satisfy the dryness target.

localContext: |
  The housing stock in 92651 runs from 1940s beach cottages near Heisler Park
  to newer canyon builds in Arch Beach Heights and the gated community of
  Emerald Bay. Stacked washer-dryer setups are the norm in older bungalows —
  pulling a unit for drum roller access means moving furniture first, working in
  a closet with zero elbow room. Canyon driveways off Alta Laguna Boulevard add
  parking complications for service vans, so we build extra buffer into Laguna
  scheduling.

  Three Arch Bay and Emerald Bay have newer construction with dedicated laundry
  rooms, but the Bosch and Miele panel-ready units installed in those builds
  require proprietary diagnostic tools most generalist repair companies don't
  carry. Pulling fault codes from a Miele T1 series without the service terminal
  is guesswork. We don't guess.

  The beach cottages off Cress Street and PCH near the village are a different
  story — 24-inch compact dryers tucked into bathroom closets, exhaust vents
  running in strange directions to clear old framing. Access is a puzzle every
  time. The repair itself might take 40 minutes. Getting to the machine and
  getting it back takes the other 90.

commonProblems:
  - title: "Thermal Fuse Keeps Blowing — Coastal Oxidation Is the Root Cause"
    description: |
      Ocean humidity works into the heating element housing and corrodes
      electrical contacts over time. A dryer with no heat at all is often a
      blown thermal fuse — but swapping it without cleaning the oxidized
      contacts means a repeat failure in 6 months.

      Bosch and Miele units in the 92651 zip show this cycle more than any
      other brand we see in Orange County. The fix is cleaning the terminal
      block, replacing the element housing if the pitting is too deep, and
      using a dielectric grease on the contacts before reassembly. That last
      step is what prevents the callback in March.

  - title: "Drum Won't Spin — Worn Rollers in Compact Laundry Closets"
    description: |
      A dryer that hums but the drum stays still points to failed drum rollers
      or a snapped drive belt. Sometimes both, because when a roller seizes the
      belt takes the load and snaps shortly after.

      In Laguna Beach's older beach cottages, getting behind a Samsung or LG
      front-load dryer requires disconnecting power and the exhaust vent just to
      shift it enough for access. Tight clearances turn a 45-minute repair into
      two hours. Budget for that on the phone — we'd rather set accurate
      expectations than surprise you with extra labor on the invoice.

  - title: "Drying Takes 90 Minutes — Lint Chokes the Blower Wheel"
    description: |
      Neoprene wetsuits and heavy beach towels shed fiber at a rate most dryers
      aren't built for. The blower wheel and exhaust vent clog fast, causing the
      moisture sensor to misread cycle completion and keep running.

      Viking and Thermador gas dryers in the hillside homes along Skyline Drive
      hit this constantly — vent cleaning every 6 months is realistic here, not
      annually. When the blower wheel is fully impacted, the motor overheats and
      triggers the high-limit thermostat. You'll see the drum spinning but zero
      heat output. It reads like a heating element failure. It's not.

faq:
  - q: "How fast can you get to Laguna Beach for dryer repair?"
    a: "Routes from Irvine south through 92651 run daily. From the CA-133
      junction we're usually at the door within 2 hours. Evening slots available
      most nights — call (323) 870-4790 or schedule online for same-day
      service."
  - q: "Do you repair Miele and Bosch dryers in Laguna Beach?"
    a: "Both brands show up regularly in Emerald Bay and Three Arch Bay. Miele
      needs proprietary diagnostic software to pull fault codes accurately —
      error codes like F138 or F153 won't display without the service terminal,
      so you're flying blind without it. Bosch heat-pump models often have
      condenser drain pump failures — parts and tools for both are on the van."
  - q: "What does dryer repair cost, and do you quote before starting work?"
    a: "Diagnostic visit is $75, applied to the repair. Most jobs — heating
      element swap, thermal fuse, drum roller replacement — land between $150
      and $280 parts and labor. Gas valve igniter work on Viking or Thermador
      units runs higher because of part cost, usually $220 to $350. Same-day
      emergency slots are available. Nothing starts until you've approved the
      quote."
title: "Laguna Beach Cooktop — Salt Air, Steep Streets, Premium Brands"

intro: |
  Calliope Street and the canyon roads above Heisler Park weren't designed with
  appliance service logistics in mind — but that's where most of our Laguna calls
  come from. A Wolf 36-inch gas cooktop on a hillside property with a tight
  driveway is Tuesday for us. Salt air off the Pacific corrodes igniter electrodes
  and spark modules faster than any kitchen twenty miles inland. A burner that won't
  light here in 92651 is almost always a corroded electrode or a fouled spark module
  tip — not a failed control board. Knowing which part is actually bad saves you
  a couple hundred dollars on the diagnosis alone.

localContext: |
  Laguna Beach housing runs two distinct directions. Near the flatlands below
  Laguna Canyon Road — the 1940s and 1950s beach cottages tucked between Coast
  Highway and the canyon mouth — kitchens are compact, gas lines are original, and
  clearance under the cooktop can be genuinely tight. Up in the hillside neighborhoods
  like Arch Beach Heights and Top of the World, post-2000 rebuilds dropped Thermador
  and Miele cooktops into thick quartz countertops that look beautiful and leave almost
  zero service access. Both present real challenges. The 92651 zip covers all of it,
  and we've worked both ends of that spectrum enough to know what tools to bring
  before we park.

commonProblems:
  - title: "Corroded Igniter Electrodes from Coastal Marine Layer"
    description: |
      Salt air accelerates corrosion on igniter electrodes and spark module contacts
      faster than homeowners expect. Wolf and Viking gas cooktops are the biggest
      offenders — the electrode assembly sits close to the burner cap and traps
      moisture. Symptoms are unmistakable: constant clicking that won't stop, or a
      burner that sparks weakly and never catches flame. Usually a single-visit fix.
      We carry replacement electrode kits for the common Wolf and Viking configurations
      in the van and don't need to order anything.

  - title: "Cracked Ceramic Glass on Induction Cooktops"
    description: |
      Miele and KitchenAid induction cooktops show up in nearly every hillside rebuild
      we visit in Laguna. Drop a cast iron Dutch oven wrong and the ceramic glass surface
      fractures — sometimes hairline, sometimes obvious. A cracked surface isn't just
      cosmetic. The glass is structurally integrated with the heating element circuit
      underneath, and a crack can cause uneven heat zones or eventually short the
      control board. Full panel replacement is the only repair that actually holds.
      Cooking on a cracked induction surface is a real safety issue.

  - title: "Thermocouple Fatigue and Gas Valve Wear on Older Units"
    description: |
      The beach cottages closer to Main Beach sometimes still run GE or Frigidaire
      gas range units from the late 1980s and 90s. Thermocouple assemblies fatigue
      over time — the burner lights, holds a few seconds, then dies as the safety
      valve cuts gas. Gas valve seats also wear, leaving one burner with a weak flame
      no matter where the knob sits. Both are stock repairs with parts we carry.
      Neither requires sourcing anything exotic.

faq:
  - q: "How fast can you get to Laguna Beach for a cooktop repair?"
    a: |
      From our Orange County base, Laguna Beach typically runs 25-40 minutes depending
      on PCH traffic around Aliso Viejo and Laguna Niguel. Same-day appointments are
      usually available if you call before noon. Parking on the canyon streets —
      Arch Beach Heights especially — takes planning, so we factor that in. Call
      (323) 870-4790 and we'll lock in an arrival window before the day fills.

  - q: "Do you repair Wolf, Thermador, and Miele cooktops?"
    a: |
      Those are exactly the brands we see most in Laguna. Wolf gas cooktops commonly
      need spark module or electrode replacements. Thermador induction units throw
      control board error codes — E1 and E3 are the most common — that require
      proper diagnostic equipment to isolate. Miele electric cooktops develop burner
      cap alignment drift that creates hot spots. We carry factory-spec diagnostic
      tools and stock parts for all three brands.

  - q: "What does a cooktop repair typically cost, and is same-day service available?"
    a: |
      Single-burner igniter and thermocouple fixes usually run $150–$280 parts and
      labor combined. Ceramic glass surface panel replacement on induction units ranges
      $220–$460 depending on the model and panel size. Most repairs wrap in 60-90
      minutes on-site. Emergency same-day service is available when a cooktop is
      completely out — evening and Saturday slots exist for working households.
      Schedule online or call (323) 870-4790 directly.
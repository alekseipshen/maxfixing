title: "Laguna Beach Ice Maker — Coastal Salt Air & Hard Water Repairs"

intro: |
  Canyon homes above Bluebird Canyon Drive and the cliffside estates near Arch Beach Heights
  pack some of the most expensive built-in refrigeration in Orange County — Sub-Zero columns
  and Thermador panel-ready units that run year-round. Salt-laden marine air off the Pacific
  accelerates sensor corrosion in ways that don't show up at inland service shops. Add MWD
  water coming into 92651 at roughly 350 ppm TDS, and fill valves here calcify faster than
  most homeowners expect. Call us at (323) 870-4790 — we cover all of Laguna Beach and
  typically arrive within two hours.

localContext: |
  Housing stock here is a genuine mix — 1950s canyon cottages that have been gut-renovated,
  newer hillside construction above PCH, and a cluster of older beach bungalows within blocks
  of Main Beach. Many remodeled homes in the Bluebird Canyon neighborhood have panel-matched
  Sub-Zero or Bosch built-ins where the ice maker assembly sits behind a flush cabinetry panel,
  requiring careful disassembly before any service can start. Both 92651 and 92652 pull from
  the Municipal Water District of Orange County, and the consistent mineral load in that water
  makes scale buildup a scheduled maintenance issue, not a random one.

commonProblems:
  - title: "Fill Valve Calcification from MWDOC Hard Water"
    description: |
      At roughly 350 ppm TDS, Laguna Beach tap water deposits mineral scale inside water inlet
      valves on a predictable schedule — the solenoid screen clogs gradually until restricted
      flow starves the ice maker entirely. Sub-Zero and Miele integrated columns make this a
      more involved repair because the fill valve is buried behind cabinetry that has to come
      out first. Hollow, misshapen cubes are usually the first symptom; zero production follows
      within weeks. Replacing the inlet valve and flushing the supply line at the same visit
      prevents a quick callback.

  - title: "Sensor Malfunction from Coastal Salt Air Exposure"
    description: |
      The marine layer rolling in off Laguna Beach each morning carries salt aerosol — fine
      particles that settle on circuit boards and sensor assemblies inside the ice maker module
      over months. A corroded optical or mechanical sensor reads the bin as full when it's
      empty, so the harvest cycle stops and the unit sits idle. Thermador and KitchenAid column
      refrigerators in this zip code show this failure more often than comparable units we
      service inland. Cleaning rarely resolves it — the sensor module usually needs a full swap.

  - title: "Frozen Water Line Behind the Built-In Panel"
    description: |
      Cabinet enclosures on Sub-Zero and Bosch built-in units trap cold air differently than
      freestanding models. When a thermostat drifts a few degrees low, the water supply line
      feeding the ice maker assembly freezes solid — and because the line runs behind a
      panel-matched door, it isn't visible until symptoms appear. You'll hear the fill valve
      click through a cycle attempt, then nothing. Thawing the line is fast, but the defrost
      timer or thermostat almost always needs recalibration at the same visit, or it refreezes
      within days.

faq:
  - q: "How fast can you get to Laguna Beach for ice maker repair?"
    a: |
      From our South OC coverage area, Laguna Beach runs 30-45 minutes depending on PCH and
      Crown Valley Parkway traffic. Same-day slots are available most days in 92651 and 92652.
      Call (323) 870-4790 in the morning and we typically have someone there by early afternoon.
      Evening slots exist for homes where daytime access is a problem.

  - q: "Do you repair Sub-Zero and Thermador built-in ice makers?"
    a: |
      Yes — Sub-Zero, Thermador, and Miele built-in columns and panel-ready units make up a
      large share of what we service in Laguna Beach. These require specialized panel removal
      tools and access to factory diagnostic modes to pull error codes accurately. We carry
      both and work on these units throughout South OC regularly.

  - q: "What does ice maker repair typically cost, and is same-day service available?"
    a: |
      Most repairs run $150-$380 depending on the part and how accessible the unit is. Fill
      valve and water inlet valve replacements land on the lower end; control board swaps cost
      more. Same-day and evening appointments are both available in Laguna Beach. Schedule at
      (323) 870-4790 — we confirm within the hour.
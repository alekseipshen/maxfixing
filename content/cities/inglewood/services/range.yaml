title: "Inglewood Range Repair — Gas Lines, Old Homes, Real Fixes"

intro: |
  Post-war bungalows off Manchester Boulevard make up a big chunk of the range calls
  we get in Inglewood. Most of those kitchens are still running on gas stub-outs
  installed in the 1950s. A GE or Whirlpool freestanding range sitting in a house built
  in 1958 has seen some miles — and right now it's probably showing you exactly why.
  Burner igniter failures and oven temperature drift are the two issues we fix most
  often in this part of town. Usually there within 2 hours.

localContext: |
  The 90301 and 90303 zip codes run heavy on 1950s and 1960s ranch-style homes —
  kitchens not designed for the 30-inch slide-ins people drop in today. Tight countertop
  clearances, aging gas flex connectors, and decades of residue under the burner caps
  make range work here more involved than in newer construction. Closer to the Kia Forum
  corridor along Prairie Avenue, apartments with compact 20-inch units are common.
  Different parts, different access issues, same same-day turnaround goal.

  Morningside Park and Century Heights tend to have slightly newer mid-range kitchens —
  families who bought in the 1980s and upgraded to a KitchenAid or Bosch slide-in at
  some point. Those units are still 15-plus years old now and starting to show igniter
  wear and control board issues. Over in the 90304 zip, closer to Centinela Avenue,
  there's a mix of rentals and owner-occupied homes that skew toward Samsung and LG
  freestanding ranges bought at big-box stores — solid appliances, but the control
  boards and igniter harnesses on those Korean-brand units don't last forever in
  daily-cooking households.

  The Hollywood Park area added a lot of new construction near SoFi Stadium, but one
  street over you're back in 1960s stucco. That contrast is typical Inglewood — call
  us for a 90305 zip and we genuinely don't know if we're walking into a brand-new
  kitchen or one that hasn't changed since Nixon was president. Gas shutoff locations
  vary. Ventilation varies. We've seen flex connectors so corroded they needed same-day
  replacement before we touched the range itself.

  SoCal Gas runs the distribution through this part of town, but the branch lines into
  pre-1970 structures are a different story. Black iron supply pipes that haven't been
  touched since original installation, old sediment-trap configurations that don't match
  current code — these show up on older Inglewood properties more than almost anywhere
  else in the South Bay. On the economic side, this is a working-family neighborhood.
  People here aren't replacing a range every eight years. A $200 repair on a 12-year-old
  Samsung or GE unit makes more sense than a $1,200 appliance — and that's exactly the
  kind of repair we do. Inglewood also sits close enough to the coast that the marine
  layer keeps temperatures moderate most of the year, but summer afternoons still push
  into the low 90s. That heat load matters for gas valve components and igniter modules
  that run hotter than spec on days when the kitchen already has no airflow.

commonProblems:
  - title: "Burner Clicks but Won't Catch — Clogged or Cracked Igniter"
    description: "The spark igniter on GE and Whirlpool gas ranges gets coated in grease and
      food debris fast — especially in kitchens that cook daily. A cracked ceramic igniter
      body or blocked burner cap orifice stops the spark from reaching the gas stream. This
      is usually a same-day fix. We carry igniters for both brands on the truck. On Whirlpool
      models, the igniter module sits under the cooktop and can corrode if the unit is in a
      kitchen with poor exhaust — common in older 90301 homes with the original hood venting
      into the wall rather than outside."

  - title: "Oven Runs Cold or Bakes Unevenly — Bake Element or Gas Valve Fault"
    description: "An oven reading 375°F that bakes like 300°F is typically a weakening bake
      element on electric models, or a dying gas valve igniter on gas units. Samsung
      slide-ins show this symptom before full shutdown — sometimes preceded by an E-08 or
      SE error code on the display. The oven temperature sensor can also drift and fool the
      control board — we test both before quoting a repair. On LG ranges, a tE error
      usually points to the same sensor issue rather than the valve itself."

  - title: "Gas Odor Near the Range — Valve Seat or Regulator Leak"
    description: "Older ranges in pre-1970 Inglewood homes occasionally develop slow leaks at
      the valve stem or pressure regulator. This isn't something to monitor for a few days.
      Shut off the gas supply, open windows, and call (323) 870-4790 right away. A corroded
      valve seat on a KitchenAid or Whirlpool unit can pass gas even with the knob in the
      off position. We carry a combustible gas detector and check the full supply line
      before marking a repair complete."

faq:
  - q: "How fast can you get to Inglewood for Range repair?"
    a: "Service routes through South Bay run daily. From the LAX corridor, Inglewood is
      typically 20 minutes or less. Call (323) 870-4790 to lock in a time — same-day
      slots usually fill by noon, so earlier in the morning gets you the best window.
      Evening appointments are available most weekdays for 90301, 90303, and 90305 calls."

  - q: "Do you repair Samsung and LG ranges in Inglewood?"
    a: "Both, regularly. Samsung slide-ins frequently need control board replacements and
      igniter harness work — the DG47 igniter assembly is one of the most common parts
      we swap on those units. LG ranges throw F9 or tE error codes tied to the temperature
      sensor or gas valve assembly. Parts for both are stocked on the truck for 90301 and
      90305 zip calls."

  - q: "What does a range repair cost in Inglewood, and is same-day service available?"
    a: "Diagnostic is flat-rate, repair quoted before any work starts. Replacing a burner
      igniter, bake element, or thermostat typically runs $150–$280 parts and labor.
      A gas valve igniter replacement on an LG or Samsung unit usually lands between
      $190–$260 depending on parts availability. Evening slots are available most
      weekdays — schedule online or call (323) 870-4790 and we'll find something that fits."
title: "Inglewood Refrigerator Repair — South Bay's Hard Water Problem"

intro: |
  Hard water off the LA municipal system hits South Bay appliances hard, and
  Inglewood is no exception. The Forum district around 90305 has plenty of
  mid-2000s condos where Samsung french-door units are running mineral-caked
  evaporator coils right now — owners just think the fridge "runs warm."
  Call us at (323) 870-4790 and we can usually get out same day.

localContext: |
  Most of 90301 and 90302 is postwar construction — 1950s and early 60s
  single-family homes with kitchens built for compact, single-door boxes.
  Swapping in a modern GE or LG counter-depth model means tight side clearances,
  sometimes only two inches from the cabinet wall. That matters when a condenser
  fan needs pulling or a compressor swap requires rolling the unit fully out onto
  linoleum floors that can't take a scratch.

commonProblems:
  - title: "Mineral buildup killing the ice maker in postwar Inglewood homes"
    description: "LA tap water runs around 300 ppm hardness — about three times what
      most appliance manufacturers design for. In Samsung and LG ice makers, calcium
      deposits clog the water inlet valve and jam the ice maker assembly within two
      to three years. The fix isn't just descaling; the valve usually needs
      replacing entirely."
  - title: "Compressor overwork from Inglewood's summer heat"
    description: "South Bay gets trapped heat in July and August, and garages or
      side-yard placements in these older homes push ambient temps past 90°F.
      Whirlpool and Maytag units from the mid-2010s start showing compressor
      noise — a rattling hum that means the start relay is failing. Ignore it and
      the compressor seizes. A $35 relay caught early saves a $400 repair later."
  - title: "Evaporator coil icing in Bosch and KitchenAid counter-depths"
    description: "Counter-depth refrigerators popular in the renovated kitchens near
      Hollywood Park run shallower airflow paths. When the defrost timer fails or
      the defrost heater burns out, ice accumulates on the evaporator coil fast —
      sometimes blocking airflow completely within a week. You'll notice the freezer
      stays cold but the fresh food section climbs to 50°F or warmer."

faq:
  - q: "How fast can you get to Inglewood for refrigerator repair?"
    a: "We run routes through the South Bay daily — from Hawthorne down to El Segundo
      and back through 90303. Street parking on most residential blocks is fine for
      the van. Call (323) 870-4790 before noon and we're usually there the same
      afternoon. Evening slots available too."
  - q: "Do you repair Samsung and LG refrigerators in Inglewood?"
    a: "Yes, those are probably 60% of what we see in this zip code. Samsung french-door
      units with the ice maker in the door are the most common call — usually a frozen
      water line or failed inlet valve. LG linear compressor failures are also
      frequent; we carry the replacement compressor kits."
  - q: "What does refrigerator repair typically cost, and do you charge to diagnose?"
    a: "Diagnosis is $75, applied toward the repair if you proceed. Most common fixes —
      door gasket, defrost timer, drain pump on the freezer floor — run $150–$280
      parts and labor. Compressor replacement is $350–$500 depending on the model.
      Same-day emergency service available; schedule online or call (323) 870-4790."

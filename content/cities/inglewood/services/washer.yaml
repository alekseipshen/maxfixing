title: "Inglewood Washer Repair — Hard Water, Old Installs, No Spin"

intro: |
  Blocks near the Forum and SoFi Stadium corridor — zip 90301 and 90302 — have a lot of 1950s
  and 60s homes where washers get squeezed into converted garages or tight utility closets. That
  Samsung front-loader or Whirlpool top-load deals with LA's hard water pushing through aging
  supply lines, and mineral deposits build up fast. Most "not draining" calls we get from
  Inglewood trace back to the same two parts every time.

localContext: |
  The housing stock in 90303 and 90304 runs heavily toward postwar single-family homes and older
  duplexes — built when washing machines were a luxury add-on, not a design consideration. Tight
  laundry closets in the Morningside Park area make drum access tricky. Stack units crammed into
  hallway closets are common here too. These installs put extra stress on drain pumps and drum
  bearings that weren't designed for awkward angles or restricted airflow.

commonProblems:
  - title: "Drum won't spin — lid switch or drive belt giving out"
    description: "A washer that fills but refuses to spin is almost always the lid switch assembly
      on top-loaders, or a snapped drive belt underneath. That LG top-load throwing UE or OE codes?
      Check the shock absorbers first — Inglewood's older floors aren't perfectly level, and the
      machine overcompensates until something gives."

  - title: "Water sitting in the drum after the cycle ends"
    description: "LA hard water leaves calcium deposits in the drain pump filter and impeller. After
      a year or two in a 90302 home, that Whirlpool or GE washer starts stretching cycles longer
      before giving up on draining entirely. The pump usually still works — it's clogged, not dead.
      A diagnostic visit beats a full replacement by several hundred dollars."

  - title: "Leaking from the bottom — gasket failure or cracked inlet valve"
    description: "Front-loaders develop door gasket tears from mold buildup, especially in
      Inglewood's warm climate where humidity lingers in the drum between loads. Samsung and Bosch
      models show up most often with this. Sometimes it's the water inlet valve cracking from
      mineral stress after years of hard-water cycling — both are straightforward fixes."

faq:
  - q: "How fast can you get to Inglewood for washer repair?"
    a: "Usually within 2 hours from our South Bay base. We run 90301 through 90305 regularly.
      Call (323) 870-4790 to grab a same-day slot — evening appointments are available if you're
      working during the day."

  - q: "Do you repair Samsung and LG washers in Inglewood?"
    a: "Yes — Samsung and LG are our two most common calls here. We also handle Whirlpool, GE,
      and KitchenAid. Typical fixes include control board resets, water inlet valve swaps, drain
      pump clogs, and drum bearing replacements."

  - q: "What does washer repair typically cost, and can I get same-day service?"
    a: "Most repairs run $150–$350 parts and labor combined. We diagnose first, quote before
      touching anything. Same-day and emergency slots are available most evenings — call
      (323) 870-4790 or schedule online to lock in a time."

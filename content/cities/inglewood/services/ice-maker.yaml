title: "Inglewood Ice Maker Repair — Hard Water & Fast South Bay Service"

intro: |
  Morningside Park and the streets around Century Boulevard sit on some of the hardest
  municipal water in the South Bay — West Basin water district tests regularly above
  280 ppm, which is aggressive enough to calcify a water inlet valve on a Samsung
  french-door refrigerator inside two years. That's the single biggest reason ice
  makers in Inglewood quit earlier than the same model would in the Valley or up
  in Glendale. Mineral scale isn't dramatic. It just slowly kills the fill valve
  and sensor until one morning you're getting hollow cubes or nothing at all. Most
  Inglewood households aren't looking to replace a working fridge — they want the
  repair done right so it holds for another few years.

localContext: |
  The housing in 90301 and 90302 is predominantly 1950s and 60s construction —
  single-story bungalows and small ranch homes with tight kitchens where the
  refrigerator is wedged between cabinets with maybe two inches of clearance on
  each side. Built-in water lines on these older homes often run through exterior
  walls with minimal insulation. Around Centinela Avenue and Hardy Street, we
  regularly pull out GE side-by-sides that haven't been moved since installation —
  dust packed around the condenser, water line crimped, ice maker assembly sitting
  on a slow drip for months.

  Inglewood sits a mile east of the LAX flight corridor, right next to Hawthorne
  and a short drive from the Kia Forum on Prairie Avenue. The families here have
  been in these homes for decades — working households where the Whirlpool or
  Samsung in the kitchen isn't getting swapped out unless it's absolutely necessary.
  In Inglewood, that means we get called when something is genuinely broken, not
  just slow. The appliances match the homes: functional, mid-2000s to early 2010s,
  pushed to the limit before anyone picks up the phone. Median income in the area
  runs around $58K — repair is always the smarter call here, and residents know it.

commonProblems:
  - title: "Fill Valve Calcification from West Basin Hard Water"
    description: "At 280+ ppm, Inglewood tap water leaves mineral deposits inside the water inlet
      valve faster than most homeowners expect. The valve restricts flow, so the
      refrigerator gets a trickle — or nothing at all. Samsung and LG french-door
      models with in-door dispensers show this first as small, hollow cubes before
      production stops entirely. Replacing the valve plus flushing the supply line
      usually solves it. Skipping the flush means the same problem in 12 months."
  - title: "Frozen Water Line in Uninsulated Exterior Walls"
    description: "Pre-1970 homes in the 90303 zip code often route the refrigerator supply line
      through an exterior-facing wall with no insulation behind the drywall. On cold
      nights — which do happen in Inglewood — the line partially freezes and the
      ice maker sensor reads a blockage, shutting down the cycle entirely. The fix
      is straightforward: thaw the line, add foam insulation sleeve, and verify the
      inlet valve seal didn't crack from the freeze. GE and Whirlpool side-by-sides
      from this era are the most common candidates for this call."
  - title: "Assembly Module Failure on KitchenAid French-Door Models"
    description: "KitchenAid french-door refrigerators from the 2014-2020 range have a documented
      issue with the ice maker control board — harvest signals stop triggering after
      four to six years, so cubes form but don't eject, or come out misshapen and
      fused together. It's not a water issue. The module itself fails. Full assembly
      replacement is the correct repair; resetting the unit temporarily clears the
      error but the fault returns within weeks. Several Inglewood households near
      Prairie Avenue have hit this exact failure on 2016 and 2017 KitchenAid units."

faq:
  - q: "How fast can you get to Inglewood for ice maker repair?"
    a: "Usually within two hours. We run the South Bay corridor daily — coming from
      Hawthorne or El Segundo, Inglewood is a quick shot up the 405 or down
      Century Boulevard. Street parking is generally fine on residential blocks.
      Call (323) 870-4790 and morning calls almost always get a same-day slot.
      Evening appointments are available too, which works for households where
      someone's at work until 5 or 6."
  - q: "Do you repair Samsung and LG refrigerators in Inglewood?"
    a: "Both are extremely common here, and yes. On Samsung french-doors we most
      often replace the water inlet valve or clear sensor faults. LG repairs usually
      involve the fill tube or ice maker assembly module. Whirlpool side-by-sides
      from the mid-2000s are the third most common call we get in 90301. Inglewood's
      hard water hits all these brands the same way — the inlet valve is always the
      first component we check."
  - q: "What does ice maker repair cost in Inglewood, and is same-day service available?"
    a: "Most repairs fall between $140 and $290. Fill valve and inlet valve swaps
      are on the lower end; full assembly replacements run higher. Same-day service
      is standard — evening slots too. Warm holiday weekend with no ice? Call
      (323) 870-4790 and we'll fit you in."
title: "Inglewood Dishwasher — Hard Water, Aging Kitchens, Fast Fixes"

intro: |
  SoFi Stadium brought national attention back to this corner of LA County, but
  the families spreading out from Morningside Park toward Manchester Avenue deal
  with something less glamorous: hard water systematically destroying dishwasher
  components. That Bosch 500 Series in a 90302 kitchen is working against
  300-plus ppm mineral content every single cycle. Spray arms calcify. The
  heating element scales over. Dishes come out cloudy regardless of what
  detergent pod you use.

localContext: |
  Most homes in zip codes 90301 and 90303 went up between the 1940s and 1960s —
  post-war ranch houses and small bungalows where the dishwasher was retrofitted
  into a kitchen not designed for one. Cabinet clearances in the Century Heights
  area can be tight enough that pulling a unit for repair takes twice as long as
  a newer construction job. Original drain lines in some of these builds also
  accelerate drain pump wear over time.

commonProblems:
  - title: "Spray Arm Calcification from LA Metro Hard Water"
    description: "LA Metropolitan Water District supply running through the 90302 and 90303 zip codes
      consistently tests between 300–400 ppm hardness. At those levels, spray arm nozzles
      on Samsung and GE units clog within 18 months of regular use. Pulling both the upper
      and lower spray arms, descaling, and verifying the float switch is reading correctly
      usually clears it — but ignoring it long enough means replacing the wash pump too."

  - title: "Standing Water After the Cycle Ends"
    description: "Puddles left in the tub after a completed cycle are one of the most common calls
      from around the Manchester Avenue corridor. The drain pump impeller gets jammed by
      food debris or mineral buildup and stops moving water. LG dishwashers typically
      throw an OE error code at this point. Left sitting, that standing water warps the
      door gasket and creates mold problems inside the tub that are much worse to fix."

  - title: "Detergent Dispenser Stuck Shut — Dishes Come Out Greasy"
    description: "Whirlpool and KitchenAid units are everywhere in these Inglewood neighborhoods and
      both develop door latch assembly failures around the 5–7 year mark. The actuator
      spring loses tension or the wax motor that triggers the dispenser burns out mid-cycle.
      Soap tablet just sits there undissolved. It's a straightforward swap, but the
      actuator part number varies by model year — ordering the wrong one wastes a week."

faq:
  - q: "How fast can you get to Inglewood for dishwasher repair?"
    a: "South Bay runs are on the schedule most days — typical arrival is within 2 hours of
      your call. Street parking on residential blocks near Morningside Park is usually
      fine for the van. Call (323) 870-4790 to check same-day availability or book online."

  - q: "Do you repair Bosch and Samsung dishwashers in these zip codes?"
    a: "Bosch 300 and 500 series are probably the most common ticket we see in 90301–90305.
      Samsung too, especially drain pump and control board issues. Also handle LG, GE,
      Whirlpool, and KitchenAid — each brand has its own failure patterns on the
      electronics side."

  - q: "What does a dishwasher repair cost and how soon can you come out?"
    a: "Diagnostic visit is flat-rate. Most repairs land between $120–$280 depending on
      parts — heating element and drain pump replacements sit at the higher end. Same-day
      slots available most weekdays, evening appointments too. Call (323) 870-4790 and
      we'll get you on the schedule."
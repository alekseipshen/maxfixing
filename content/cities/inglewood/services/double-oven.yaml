    a: |
      Usually on-site within 2 hours for morning calls in Inglewood — we
      run up the 405 or cut over on La Cienega from the south depending on
      traffic. Evening slots are available Tuesday through Saturday. Call
      (323) 870-4790 to check today's openings; same-day appointments
      typically book out by early afternoon.
  - q: "Do you repair Samsung and LG double ovens in Inglewood?"
    a: |
      Yes — Samsung and LG wall ovens make up a big share of Inglewood
      calls. Samsung jobs most often need control board or bake element
      replacements. LG repairs typically involve the door latch assembly or
      a temperature sensor failure. Whirlpool and GE built-ins are covered
      equally, and we stock common parts for both brands.
  - q: "What does a double oven repair visit cost in Inglewood?"
    a: |
      Diagnostic is $85, applied toward the repair if you move forward.
      Heating element replacement runs $150–$230 parts and labor combined.
      Control board swaps land between $290–$460 depending on brand. Unit
      completely down and you can't wait? Call (323) 870-4790 — we keep
      emergency slots open for same-day service across Inglewood and the
      surrounding South Bay.


title: "San Dimas Wine Cooler — Fast Repair in SGV Summer Heat"

intro: |
  Via Verde neighborhoods in 91773 sit right where the San Gabriel foothills
  trap heat all summer — ambient temps around Lone Hill Avenue regularly hit
  97-100°F in July. That's brutal for any cooling appliance. A KitchenAid
  built-in wine column fighting that heat runs its compressor nearly around
  the clock, while hard LA County water quietly builds mineral scale inside
  the cooling loop at the same time. Most reds need to hold between 55-65°F;
  a single hot weekend with a failing unit can push cabinet temps to 72°F or
  higher, which accelerates aging and ruins a decent bottle in days.
  Call (323) 870-4790 — most calls get same-day service.

localContext: |
  The streets off San Dimas Canyon Road and Foothill Boulevard in 91773
  are lined with 1970s and early-1980s ranch homes that got wine coolers
  added during kitchen renovations — typically shoehorned under a peninsula
  counter or built into a former pantry alcove with minimal rear clearance.
  Condenser airflow is an afterthought in most of these installs. The unit
  heats up, works harder, and fails faster than it ever would in a
  properly ventilated new build.

  Newer homes near the Glendora border and up toward San Dimas Canyon tell
  a different story. Bosch 800 Series and Sub-Zero wine columns installed
  flush into custom cabinetry, owners tracking cellar temps on their phones.
  Those units fail differently — tighter tolerances, proprietary control
  boards, compressors that throw fault codes before they fully quit.

  Either way, the SGV summer is the common enemy.

commonProblems:
  - title: "Compressor Failure Driven by San Gabriel Valley Summer Heat"
    description: |
      Triple-digit Valley temps push a wine cooler's compressor far past its
      rated duty cycle. On LG dual-zone models, that continuous running leads to
      compressor winding failure within 3-5 years — refrigerant pressure drops, the
      cabinet temperature climbs, and eventually the unit stops cooling entirely.
      A loud motor hum that never stops is the warning before the temperature
      alarm finally triggers.

      Diagnosis starts at the start capacitor. On LG units, a weak capacitor
      mimics a dead compressor almost perfectly — that's a $45 fix versus a
      $300 one. Measuring suction pressure at the service port confirms whether
      refrigerant is actually low or the capacitor is just failing to kick the
      motor over. Worth the 10-minute check before condemning the whole compressor.

  - title: "Evaporator Coil Scale from San Dimas Hard Water"
    description: |
      San Gabriel Valley Municipal Water District water is hard — mineral
      deposits accumulate on the evaporator coil of Bosch wine coolers over 2-3
      seasons. The result is reduced cooling capacity before anything else looks
      wrong. Set point creeps from 55°F to 62°F, then the compressor starts
      running nonstop trying to compensate, and eventually the thermal fuse
      blows to protect the motor.

      The drain line clogs with the same scale. Water pools under the wine
      racks, soaks into the cabinet insulation, and turns a simple descale
      job into a longer repair. Catching the temperature drift early — before
      the fuse blows — is the difference between a one-visit fix and two.

  - title: "Cracked Door Gasket Causing Nonstop Temperature Swings"
    description: |
      KitchenAid undercounter units are the most common wine cooler in these
      San Dimas ranch renovations, and the door gasket dries out fast in low-humidity
      San Gabriel Valley air. Once cracked, warm air infiltrates the cabinet
      continuously, forcing the compressor into constant cycling. Most digital
      models throw an E1 or HC error code when temperature swings exceed the
      tolerance range — long before the wine is actually affected.

      The gasket swap takes about 30 minutes. Ignoring it long enough stresses
      the evaporator fan motor, though — a $60 part becoming a $200 repair.
      That fan motor failure also shows up as ice buildup on the back wall of
      the cabinet, which some owners mistake for a refrigerant problem.

faq:
  - q: "How fast can you get to San Dimas for wine cooler repair?"
    a: "The 57 freeway puts us in San Dimas within 40 minutes from most of
      our coverage zone. Via Verde and the Canyon Road corridor are easy reach —
      call (323) 870-4790 before noon and we're usually there same-day.
      Evening slots are available most weekdays too."

  - q: "Do you repair Bosch and Sub-Zero wine coolers in San Dimas?"
    a: "Both, regularly. Bosch 800 Series dual-zone units are common in this
      part of 91773 — evaporator scale and drain pump clogs are the usual
      culprits. Sub-Zero wine columns need refrigerant work and thermostat
      recalibration, which requires specific tools we carry. LG and Samsung
      models come through frequently as well. Thermador built-ins show up in
      the newer Glendora-border homes occasionally — those need factory
      diagnostic cables to pull fault codes properly, which most shops
      don't bother stocking."

  - q: "What does wine cooler repair typically cost, and can you come same-day?"
    a: "Most repairs run $150-$340 parts and labor. A door gasket swap on a
      KitchenAid is the lower end; a compressor replacement on a Bosch 800 Series
      runs higher. Diagnosis is free when we do the repair. Same-day emergency
      slots are available most days — call (323) 870-4790 to check the schedule."
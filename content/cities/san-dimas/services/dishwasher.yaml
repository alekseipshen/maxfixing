title: "San Dimas Dishwasher — Hard Water Kills Spray Arms Here"

intro: |
  Hard water in the 91773 zip tests above 350 ppm most of the year — the SGV is rough on
  dishwashers. Via Verde homes built in the '70s and '80s now house Bosch 500-series units
  that were never designed for this mineral load. The spray arm nozzles clog first, then
  the float switch starts reading wrong, then you're standing in front of a machine that
  runs a full cycle and still smells like yesterday's pasta. Call (323) 870-4790 — we're
  usually in San Dimas within a couple hours.

localContext: |
  San Dimas housing is mostly single-family ranch stock from the 1960s through mid-1980s,
  with kitchen layouts that predate modern dishwasher depth standards. The 91773 corridor
  along Bonita Avenue has seen a lot of appliance upgrades — KitchenAid and LG units
  dropped into cabinets built for older machines, meaning access is tight and water supply
  lines are often original. Calcium-encrusted shutoff valves are practically standard issue
  out here. We account for that on every service call.

commonProblems:
  - title: "Spray Arm Clogging from SGV Mineral Buildup"
    description: "That 350+ ppm calcium carbonate doesn't just leave spots on your glasses — it packs
      the spray arm nozzles until water pressure at the top rack drops to almost nothing.
      Bosch 500-series units are especially vulnerable because of the micro-nozzle design.
      We flush the spray arm assembly and inspect the inlet valve screen, which usually
      carries the same mineral crust. Caught early, it's a cleaning and adjustment. Left
      alone, the inlet valve fails outright."

  - title: "Standing Water After the Cycle — Drain Pump Failure"
    description: "Open the door and find an inch of water sitting in the tub. That's the drain pump
      seizing, or the drain pump filter so packed with debris it can't pass water. LG
      TrueSteam models in this zip frequently throw an OE error code before full pump
      failure — it's the machine telling you something is wrong before it gets worse.
      A pump motor swap runs about 45 minutes. Ignoring the OE code usually means
      replacing the entire lower assembly."

  - title: "Detergent Dispenser Door Stuck Shut"
    description: "Soap pooled dry in the bottom of the tub is the giveaway. The detergent dispenser
      latch or the wax motor actuator behind it has failed — this is common on KitchenAid
      KDTM-series units after four or five years of hard water exposure. Mineral film
      coats the dispenser door, the spring mechanism weakens, and the door stops releasing
      mid-cycle. It's a straightforward part swap, not a reason to replace a machine that
      otherwise runs fine."

faq:
  - q: "How fast can you get to San Dimas for a dishwasher repair?"
    a: "We run the 57 and 210 corridors daily, so San Dimas is a short hop. Call before noon
      at (323) 870-4790 and same-day service is usually available. Evening slots open most
      weekdays for households where someone can't be home during business hours."

  - q: "Do you repair Bosch, KitchenAid, and LG dishwashers in the 91773 area?"
    a: "Those are the three we see most in San Dimas. Bosch 300 and 500 series, KitchenAid
      KDTM and KDTE models, LG TrueSteam units — we carry common parts for all three on
      the van. No waiting a week for a parts order on standard failures."

  - q: "What does a dishwasher diagnosis cost in San Dimas, and how does pricing work?"
    a: "Diagnosis is $65, credited toward the repair if you move forward. Most common fixes —
      drain pump, spray arm assembly, door latch — land between $150 and $280 all-in.
      Emergency same-day slots available seven days a week. Schedule at (323) 870-4790."
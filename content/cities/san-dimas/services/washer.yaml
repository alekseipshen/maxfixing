  - q: "Do you repair Bosch and LG washers in San Dimas?"
    a: >
      Yes — Bosch front-loaders and LG top- and front-loaders are two of the
      most common brands in this area. Samsung and KitchenAid show up constantly
      too. Diagnosis and repair happen in the same visit when the part is already

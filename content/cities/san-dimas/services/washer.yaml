title: "San Dimas Washer Repair — Hard Water, Ranch Homes, Fixed Fast"

intro: |
  Ranch homes along Via Verde and the streets feeding off San Dimas Canyon Road
  pack serious laundry loads into weekends — and San Gabriel Valley water is
  genuinely hard on machines. Mineral scale from the local water supply kills
  water inlet valves years ahead of schedule. That LG front-loader in your
  hallway closet probably started throwing error codes around year three, right
  on cue.

localContext: |
  Most of 91773 was built out between the late 1950s and early 1980s — solid
  ranch-style construction, but laundry hookups that weren't designed for
  today's wider front-loaders. Side-by-side units crammed into hallway niches or
  garages with poor ventilation are everywhere in this zip code. Older supply
  lines feeding those hookups add their own problems: restricted water pressure
  that stresses the drain pump and inlet valve on every cycle.

commonProblems:
  - title: "Hard Water Scale Blocking the Inlet Valve"
    description: >
      San Gabriel Valley water runs 300–400 ppm TDS in places — high enough to
      clog a water inlet valve solenoid in two or three years. The machine fills
      slowly, then stops mid-cycle. On Samsung and LG models, that usually
      triggers an LE or IE error code. Replacing the inlet valve assembly clears
      it, though a whole-house softener is the real long-term fix.
  - title: "Drum Bearing Failure from Heavy Weekend Loads"
    description: >
      Larger ranch homes with three or four bedrooms pile on big loads, and the
      drum bearing takes the punishment. A grinding or rumbling noise during
      spin — especially on Bosch front-loaders — usually means the bearing is
      shot. Left too long, it destroys the spin basket shaft. Catching it early
      cuts repair cost by more than half.
  - title: "Drain Pump Clogged by Pet Hair and Debris"
    description: >
      San Dimas households with kids and dogs run a lot of dirty loads through
      these machines. Lint, coins, and pet hair bypass the drum seal and jam the
      drain pump impeller. Water sits in the tub, the machine refuses to spin
      out, and KitchenAid top-loaders will flash an F9 or E3 fault. A drain pump
      replacement runs about an hour of labor and solves it cleanly.


title: "San Dimas Refrigerator — Hard Water Takes Out Ice Makers Fast"

intro: |
  Homes along Via Verde and the streets backing up against the San Gabriel
  foothills hit 100°F in July and August — that pushes refrigerator compressors
  harder than most manufacturers design for. A KitchenAid french-door in a
  1980s ranch off Covina Boulevard is working overtime when the kitchen wall
  faces west and afternoon sun pours in. San Gabriel Valley hard water averages
  300-plus ppm. Mineral scale in ice maker assemblies builds up fast in this zip.

localContext: |
  Most of the 91773 housing stock is 1970s and 1980s single-family construction —
  standard 36-inch cavities, original kitchen layouts that sometimes make pulling
  a refrigerator out a two-person job. Streets near Lone Hill Avenue are a mix of
  original tract homes and fully remodeled kitchens, some with built-in
  refrigeration. Closer to Puddingstone Lake, recent remodels are installing
  48-inch Thermador column pairs in custom cabinetry — a different repair
  situation than a basic top-mount from Home Depot.

commonProblems:
  - title: "Ice Maker Failure from San Gabriel Valley Hard Water"
    description: "Local tap runs 280-320 ppm hardness. Calcium coats the water inlet
      valve and fill tube inside the ice maker assembly within 2-3 years if the
      filter hasn't been swapped. An LG french-door throwing error code 1F — or
      just producing no ice — is usually this diagnosis. The fix is a valve
      replacement and a full flush of the ice path."

  - title: "Compressor Strain During Valley Summer Heat"
    description: "A garage-adjacent wall in the 91773 zip hits 90°F-plus in August.
      The condenser coil and condenser fan pull heat out of the box into an
      already-hot ambient space, forcing the compressor into longer cycles than
      it should run. Samsung side-by-sides and french-doors show this as warm
      fresh-food sections even when the thermostat reads normal. Cleaning the
      condenser coil alone fixes it about half the time."

  - title: "Frost Buildup on the Evaporator Blocking Airflow"
    description: "Mid-2000s Whirlpool and Maytag units are hitting 20-plus years here.
      A failed defrost timer lets ice layer over the evaporator coil until airflow
      stops. Freezer looks untouched, but the fresh-food section climbs to 50°F.
      The defrost timer itself is a cheap part — getting to the evaporator,
      though, means pulling the back interior panel and thawing the coil first,
      which adds a couple hours to the job."

faq:
  - q: "How fast can you get to San Dimas for refrigerator repair?"
    a: "Same-day availability in the 91773 area — usually within 2 hours. Routes off
      the 57 Freeway get us there from most dispatch points without bad mid-day
      traffic. Call (323) 870-4790 to check what slots are open today."

  - q: "Do you repair LG and Samsung refrigerators in San Dimas?"
    a: "Both brands are common in this area. LG french-doors with ice maker failures
      and Samsung side-by-sides with cooling issues are the calls we get most.
      Common inlet valves, control boards, and fan motors ride on the truck
      already."

  - q: "How much does refrigerator repair in San Dimas typically run?"
    a: "Depends on the part. A defrost timer or thermostat swap is usually $150-250
      parts and labor. A compressor replacement on a Sub-Zero or Thermador
      built-in runs $400-700 range. Same-day service is available, and evening
      slots open on weekdays — call or schedule online."
title: "San Dimas Freezer Repair — SGV Heat, Old Garages, Real Work"

intro: |
  Bonelli Regional Park sits at the eastern edge of town, and the ranch neighborhoods spreading off Lone Hill Avenue and San Dimas Canyon Road have been running garage freezers through San Gabriel Valley summers for 30 to 40 years without much service.

  Ambient temps in an uninsulated, west-facing garage stay above 90°F from June through September — that's outside most compressors' rated operating range. The LG upright we serviced near Baseline Road last July had a blown start relay from exactly that heat exposure. The owner hadn't realized nothing was actually frozen for two weeks. That's a $200 relay job that turned into tossed meat and a Saturday emergency call.

localContext: |
  Most of 91773 housing dates to 1965-1982.

  Three-bedroom ranchers line streets like Arrow Highway, Gladstone Avenue, and Puente Street — detached garages are the norm, and that's where the secondary freezer usually ends up: wedged in a corner with poor airflow and a roll-up door that traps summer heat. Newer builds near Puddingstone Drive run wider kitchen footprints with panel-ready column units — KitchenAid and Sub-Zero show up frequently in those homes. Either way, appliances here typically go 12 to 15 years between service calls. San Dimas tap water runs hard, which accelerates mineral scale buildup in ice maker assemblies and kills water inlet valves on Samsung and LG models faster than most owners expect.

commonProblems:
  - title: "Compressor Failure from Sustained Garage Heat"
    description: |
      Continuous high-ambient operation shortens compressor life in ways most people don't notice until the unit fails completely. San Dimas garages regularly hit 88°F to 95°F for two to three months straight — the start relay burns out first, then the overload protector follows. Samsung and LG upright models are the most common cases here; their compressors run narrow thermal tolerances and handle heat-soaked installations poorly.

      A unit humming nonstop but staying warm usually needs a relay swap, not a full replacement. Diagnosis takes about 15 minutes on-site. Call (323) 870-4790 if that hum started this week.

  - title: "Frost Packing Solid Around the Evaporator Coil"
    description: |
      Heavy frost accumulation isn't a thermostat issue — it's the defrost system failing.

      Either the defrost timer stops advancing or the defrost heater burns out, and ice packs around the evaporator coil until airflow through the cabinet drops to nothing. The unit reads cold but stops circulating — food near the back freezes solid while things near the door start to thaw. KitchenAid chest freezers from the early 2000s in original San Dimas tract homes are a consistent case. Manual defrosting provides temporary relief, but without replacing the failed component — timer, heater, or limit thermostat — the frost comes back within a week.

  - title: "Door Gasket Failure Letting Warm Air In Constantly"
    description: |
      Dry Southern California heat hardens rubber door gaskets faster than humid climates do. Garage units get hit hardest.

      UV exposure, temperature cycling, and low humidity crack the seal within 8 to 10 years on most units. Once the gasket fails, warm air infiltrates continuously and the compressor compensates by running nonstop, which drives up your electricity bill and accelerates burnout. Sub-Zero column freezers in the newer custom homes near Via Verde need OEM replacement gaskets — the door tolerances on those units are too precise for aftermarket seals to seat properly, and we stock the right parts on the truck.


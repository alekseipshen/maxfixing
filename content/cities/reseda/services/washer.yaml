title: "Reseda Washer Repair — Same-Day Fixes for Hard Water Damage"

intro: |
  GE top-loaders have been the default washer in Reseda rental units since the mid-1980s —
  landlords spec them because parts are cheap and any appliance tech knows the platform cold.
  The problem is that even a well-built GE starts throwing F7 E1 codes or refusing to spin
  once the lid switch assembly cracks, which typically happens between years six and nine in
  this neighborhood. The homes near Reseda Park on Baird Avenue see this constantly, and so
  do the denser rental blocks along Reseda Boulevard closer to Sherman Way — the mix of older
  GE units and newer Samsung front-loaders tenants brought in themselves creates a wide repair
  range in a fairly small area. Reseda's tap water runs 300–370 ppm hardness, enough to
  calcify a water inlet valve screen in under three years. Call (323) 870-4790 and we can
  get someone there the same day for most calls received before 1 PM.

localContext: |
  The bulk of single-family homes in the 91335 zip were built between 1952 and 1969 —
  laundry rooms sized for the top-loaders of that era, with nothing close to the side
  clearance a modern front-loader wants. Installing a Frigidaire Gallery or Samsung WF series
  into one of those spaces often means the machine runs with zero wall clearance on both
  sides, which accelerates wear on the shock absorbers and drum bearings faster than
  manufacturers account for. Move east toward the 91406 boundary near Victory Boulevard and
  the housing shifts to denser apartment blocks where stacked washer-dryer combos are
  standard — and accessing a failed drain pump on a stacked unit in a 30-inch laundry closet
  requires knowing the exact disassembly sequence for each brand, not improvising. San
  Fernando Valley summers regularly push garage temperatures above 100°F from June through
  September, which degrades control board capacitors on Samsung and LG front-loaders faster
  than the warranty period suggests anyone should worry about.

commonProblems:
  - title: "Water Inlet Valve Clogging from 91335 Hard Water"
    description: |
      The mesh screens inside a water inlet valve start restricting flow within three to
      five years on Reseda's tap supply. Calcium and magnesium deposits pack the screens
      until the machine fills at a fraction of normal speed — or stops filling entirely.
      GE and Kenmore top-loaders typically don't throw an error code for this; the cycle
      just runs long until the control board times out and kills the fill. Samsung
      front-loaders show a 4E or IE code. Replacing the valve is the right fix — cleaning
      the screens buys a few months at best before they restrict again. A new OEM water
      inlet valve for a GE or Kenmore runs $35–$65; Samsung OEM valves cost closer to
      $55–$85. Total with labor lands at $145–$210 for most Reseda calls. Adding a
      sediment filter to the supply line after the repair costs about $20 and protects
      the new valve from the same failure cycle.

  - title: "Drain Pump Failure and Mid-Cycle Standing Water"
    description: |
      Standing water left in the drum after a cycle points directly to the drain pump —
      either a failed impeller, a blocked pump housing, or a burned-out pump motor.
      Whirlpool and Amana top-loaders flag this with an F9 E1 error code when drain time
      exceeds the control board's threshold. Samsung and LG front-loaders throw 5E or OE
      for the same problem. The pump on Whirlpool and Kenmore direct-drive machines is
      accessible from the front panel; Samsung front-loader pumps require removing the
      lower access panel and often the door boot seal to get real working clearance.
      Pump assemblies run $40–$90 in parts depending on the model. Total repair with
      labor lands between $150 and $225 for most jobs in Reseda. If you're seeing the
      F9 code repeatedly across multiple attempts, book the repair before the motor
      overheats — at that point the pump housing often cracks and the cost goes up.

  - title: "Drum Bearing Wear from Uneven Floors and Heavy Spin Loads"
    description: |
      The original slab floors in Reseda's early-1960s tract homes are rarely perfectly
      level, and front-loaders are far more sensitive to this than top-loaders. A machine
      running even slightly off-level puts asymmetric load on the drum bearing every spin
      cycle. Once the bearing starts failing, the spin noise escalates from a low rumble
      to a metal-on-metal grinding that makes the whole house aware of laundry day.
      Samsung WF-series front-loaders show this failure pattern often between years four
      and six. Replacing the drum bearing means pulling the front panel, removing the
      door boot seal, and pressing the new bearing into the rear drum housing — a
      two-hour job. Parts run $65–$130; total repair with labor typically lands at
      $210–$300. Delaying it risks cracking the drum spider arm, which is a $150-plus
      part that turns a manageable repair into a much larger one.

  - title: "Lid Switch and Door Latch Assembly Failures"
    description: |
      A washer that fills with water but refuses to spin is almost always a lid switch
      problem on top-loaders or a door latch assembly failure on front-loaders. GE
      top-loaders from the mid-2010s have a documented weak point in the plastic lid
      switch bracket — the bracket cracks, the switch loses contact, and the machine
      reads the lid as permanently open. The repair is a lid switch assembly swap: $25–$45
      in parts, $100–$140 total with labor. Frigidaire and Kenmore front-loaders in
      Reseda see door latch assembly failures fairly often around the five-year mark —
      the latch solenoid wears out or the door hook deforms just enough that the sensor
      can't confirm a full seal. Door latch jobs run $130–$200 all-in. Both repairs
      are faster than they sound — typically done within 90 minutes of arrival, which
      makes same-day scheduling realistic.

  - title: "Control Board Failures from SFV Summer Heat Exposure"
    description: |
      Samsung and LG front-loaders have control boards that were not designed for garage
      installations in climates that hit 100°F every summer. Capacitors swell and lose
      function gradually, producing a rotating cast of error codes — LE one day, nF
      the next, or a machine that powers on but won't start a cycle. The diagnostic
      pattern that points to the board specifically: error codes that change between
      power cycles, or multiple unrelated codes appearing in sequence with no consistent
      single component match. A replacement OEM control board for a Samsung WF45 or
      WA50 series runs $130–$280 depending on production year. Total repair with labor
      lands between $260 and $390. Long-term, the most effective prevention in a hot
      Reseda garage is adding a ventilation fan or relocating the machine indoors —
      ambient temperature has a measurable effect on how far past warranty these
      boards actually run.

faq:
  - q: "How fast can you get to Reseda for washer repair?"
    a: |
      Reseda is close to both the 101 and the 405, which makes routing straightforward
      from anywhere in our service zone. For calls received before 11 AM on weekdays,
      same-day afternoon slots are available most days. Evening appointments until 7 PM
      are open for households that can't do daytime. You get a specific 2-hour arrival
      window — not a vague half-day block. Call (323) 870-4790 to check same-day
      availability; if the slot exists, we'll lock it in on the call.

  - q: "What does washer repair typically cost in Reseda?"
    a: |
      Lid switch and door latch repairs run $130–$200 all-in. Drain pump replacements
      land at $150–$225. Drum bearing jobs come in at $210–$300. Control board
      replacements are the upper end — $260–$390 depending on brand and generation.
      Diagnosis is $75, credited toward the repair if you proceed. Samsung and LG parts
      run higher than Whirlpool or GE equivalents for the same repair type — that's
      an OEM pricing reality, not a markup. You get a firm quote before any work starts.

  - q: "Do you repair Kenmore, GE, and Samsung washers in Reseda?"
    a: |
      Those three cover the majority of machines we see in the 91335 zip. GE and Kenmore
      top-loaders in the older homes, Samsung front-loaders in newer units, Whirlpool and
      Amana in mid-range rentals along the main corridors. Frigidaire and LG come up
      regularly too. Common parts — drain pump assemblies, lid switches, inlet valves —
      ride on the truck so most jobs don't require a return trip to source components.
      Less common parts we can usually get within 24 hours.

  - q: "Can you fix stacked washer-dryer combos in Reseda apartments?"
    a: |
      Stacked combos are a regular part of what we handle in the rental buildings near
      Victory Boulevard and Sherman Way. The critical difference with stacked units is
      disassembly order — accessing the drain pump or water inlet valve without
      disturbing the dryer on top requires knowing exactly how each brand's cabinet
      separates. Whirlpool, GE, and LG stacked combos in tight Reseda laundry closets
      are not unusual jobs for us. If access is genuinely difficult — zero side clearance,
      no pull-out room — we tell you before starting, not partway through.

  - q: "What warranty do you provide on washer repairs?"
    a: |
      Parts carry a 90-day warranty; labor carries a 30-day warranty. Same failure within
      that window, we come back at no charge. For control board replacements and drum
      bearing jobs, we use OEM or OEM-equivalent parts — aftermarket versions on those
      repairs fail too quickly to be worth installing. Every job gets logged, so there's
      no ambiguity later about what was replaced and when. The warranty doesn't extend
      to unrelated failures like power surge damage to a new board, but it fully covers
      the repair work itself.

  - q: "Do you cover Tarzana, Canoga Park, and other areas near Reseda?"
    a: |
      Reseda sits at the center of our San Fernando Valley coverage zone. Tarzana (91356),
      Canoga Park (91303), Northridge (91324), Winnetka (91306), and Van Nuys (91401) are
      all regular stops — no added travel fees. Same scheduling rules apply: same-day
      service for most calls received by early afternoon. Two technicians cover this
      stretch of the Valley directly, no third-party dispatch. Call (323) 870-4790 or
      book online and you'll hear back within the hour.
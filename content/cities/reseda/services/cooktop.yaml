title: "Reseda Cooktop Repair — Same-Day Gas & Electric in 91335"

intro: |
  Vanowen Street splits Reseda in half east to west, and most of the blocks
  spreading north and south from it were built out between 1954 and 1972.
  Those kitchens are old.

  A lot of them still run the original gas stub-outs, feeding Kenmore four-burner
  cooktops that have outlasted two rounds of cabinet refacing and at least one
  kitchen paint job. Closer to the Reseda Recreation Center on Lindley Avenue,
  the housing mix shifts to two-story apartment buildings where landlords swapped
  gas for electric sometime in the 1990s — now those units have GE or Frigidaire
  smooth-top electrics showing hairline cracks or intermittent burner failures.

  The San Fernando Valley's summer heat is hard on appliances in general, but
  cooktops take a specific kind of abuse here: residue from hard tap water bakes
  onto gas burner caps, grease works into igniter ports, and ceramic surfaces
  crack from thermal shock when a cold pan lands on a hot glass top. MaxFixing
  covers Reseda with same-day cooktop repair — gas or electric, doesn't
  matter which you have.

localContext: |
  The 91335 zip covers the core of Reseda — Vanowen to Roscoe, Reseda
  Boulevard to Corbin — where the housing stock is predominantly 1950s and
  60s ranch-style with original gas lines running to the kitchen. Landlords
  in the apartment corridors along Sherman Way have updated appliances more
  recently, but single-family homes on the quieter cross streets often still
  have gas cooktops that haven't been serviced in a decade.

  LA's hard water is a real problem at this address. Reseda tap water regularly
  tests above 300 mg/L calcium carbonate, and that mineral load leaves a baked
  white crust around gas burner heads that chokes ignition over time. Over the
  border into 91356, the Tarzana crossover blocks see the same story: post-war
  single-family homes where a GE or Whirlpool gas cooktop is doing work it was
  never designed to handle at age 35 or 40.

  The Valley's summer highs, routinely hitting 105°F on Reseda Boulevard by late
  July, also stress cooktops more than most homeowners realize: cooking indoors
  with the AC running puts the cooktop on almost constant duty, accelerating wear
  on igniter modules and control knobs faster than in cooler coastal climates.

commonProblems:
  - title: "Gas Burner Igniter Failure on Older Kenmore and GE Cooktops"
    description: |
      The most common service call from Reseda is a gas burner that clicks
      continuously but won't catch a flame. Usually the spark igniter
      electrode has cracked or the igniter port is packed with grease and
      food debris — both block the spark from jumping correctly to the
      burner head.

      On older Kenmore 4-burner gas cooktops that have been sitting in the
      same Sherman Way apartment since the late 1990s, the spark module
      itself often fails after years of moisture and grease exposure.
      Replacing the igniter electrode runs $85–$130 in parts and labor
      combined. Swapping the full spark module on a GE Profile gas cooktop
      is closer to $150–$200 depending on the model year.

      We stock common OEM igniter parts for GE and Kenmore in the truck, so
      most jobs are diagnosed and fixed in a single visit. If the burner cap
      is warped from a boilover, that's a $15–$35 part swap we handle at the
      same time.

  - title: "Cracked Ceramic Glass on Frigidaire and Samsung Electric Cooktops"
    description: |
      Smooth-top electric cooktops are common in the apartment buildings
      along Reseda Boulevard and Etiwanda Avenue — and cracked ceramic
      glass is the repair we see most on those units. A heavy cast-iron
      skillet dropped from counter height, or a rapid temperature swing
      from a cold stockpot hitting a hot burner, can fracture the glass
      surface completely.

      On a Frigidaire FFEC3024L or similar model, the ceramic glass panel
      runs $150–$250 in parts; Samsung glass-top replacements are in the
      same range. Labor to swap the panel is typically 45–60 minutes once
      the part is on hand.

      The repair makes financial sense if the cooktop is under 10 years old
      — new replacement units run $400–$700 installed, so a $280–$320
      repair pencils out clearly. The radiant heating element underneath
      the glass sometimes survives the crack completely intact, meaning only
      the surface needs replacing. We check the element and wiring
      connections during the same visit.

  - title: "Gas Cooktop Replacement and City Permit Requirements in Reseda"
    description: |
      Swapping out a gas cooktop in Reseda is not a weekend DIY job. The
      City of Los Angeles requires a permit for any gas appliance
      installation or replacement, and the work must be performed by or
      directly supervised by a licensed contractor. MaxFixing holds
      California Contractor License #1136541, covering gas appliance work
      throughout LA County including 91335.

      The permit process for a straight cooktop replacement typically takes
      1–2 weeks for LADBS approval; we handle the application paperwork and
      schedule the city inspection. Upgrading from a 4-burner Amana gas
      cooktop to a higher-BTU 5-burner model sometimes requires enlarging
      the gas supply feed valve — that work is also covered under the same
      permit.

      Reseda homeowners who skip the permit process routinely hit problems
      at resale. Unpermitted gas work can stall or kill an escrow. Getting
      it done correctly the first time costs less than correcting it under
      deadline pressure two years later.

  - title: "What Cooktop Repair Actually Costs in Reseda vs. Buying New"
    description: |
      A new gas cooktop — Whirlpool or GE at a big-box store — runs
      $350–$600 for a standard 30-inch 4-burner model. Add installation
      and permit fees and the total lands between $550 and $850.

      Most targeted repairs, by contrast, run $120–$300 depending on the
      failed component. A worn-out igniter module on a Whirlpool gas
      cooktop is typically a $155–$175 repair. A bad gas valve runs
      $200–$320. The math shifts when a cooktop is over 15 years old and
      multiple components are failing simultaneously — at that point,
      replacement is the smarter call. For units under 10 years old with
      a single identifiable failure, repair almost always wins on cost.

      Pricing also shifts based on access: tight kitchen layouts in
      Reseda apartment units, combined with street parking logistics for
      a service van on narrow residential blocks, can add a $25–$50
      access surcharge. Exact quotes are given on-site before any work
      starts — nothing added after the fact.

  - title: "Knob Failures and Control Board Issues on Frigidaire and Amana Cooktops"
    description: |
      Control knobs feel like a minor component until the plastic shaft
      cracks and a burner becomes impossible to regulate accurately.
      Frigidaire and Amana gas cooktops from the mid-2000s in Reseda
      kitchens commonly develop hairline shaft cracks that aren't visible
      until the knob starts spinning freely without engaging the gas
      valve beneath it.

      Replacement OEM knobs run $22–$48 each; aftermarket knobs are cheaper
      but frequently don't seat tightly on the valve stem, which creates a
      gas control safety issue. If the valve stem itself is stripped, that
      repair runs $90–$160 per burner.

      Electronic-ignition models have a separate problem: the control board
      runs continuous low-voltage current to the spark igniters and
      eventually burns out. On a Samsung or GE slide-in cooktop, control
      board replacement is $180–$280 with parts. Non-stock boards typically
      carry a 3–5 day lead time, and we'll tell you that upfront rather than
      after you've already committed to the repair.

faq:
  - q: "How fast can you get to Reseda for a cooktop repair?"
    a: |
      Reseda sits right off the 101 Freeway at Reseda Boulevard, which
      puts us 20–35 minutes away from most of our Valley starting points.
      On a same-day call, expect us at your door within 90 minutes to
      2 hours. Morning calls before 10 AM have the best shot at a
      same-afternoon visit.

      Parking can be tight on the residential streets off Vanowen, so
      mention if you have driveway space or alley access — it helps us
      get parts from the truck faster. The diagnostic and repair usually
      happen in the same visit if we have the part on hand, which we do
      for most common GE, Kenmore, Frigidaire, and Whirlpool failures.
      Call (323) 870-4790 to check today's open slots. Evening
      appointments are available Tuesday through Saturday.

  - q: "What does cooktop repair typically cost in Reseda?"
    a: |
      Most cooktop repairs in Reseda fall between $95 and $320, depending
      on what failed. A single igniter electrode swap is usually $85–$130
      all in. Control board failure on a Samsung or GE electric smooth-top
      lands at the higher end — $200–$320 with parts included. Gas valve
      replacement sits in the middle at $190–$280.

      What drives the price up: the brand (Thermador or Wolf parts cost
      significantly more than Frigidaire or Whirlpool), whether the part
      needs to be special-ordered, and how accessible the unit is in your
      kitchen layout. Diagnostic is free when we do the repair. On-site
      quotes are exact — no additional line items get added after you
      approve the work. Call (323) 870-4790 or schedule online for a
      same-day window.

  - q: "Do you need a city permit to replace a gas cooktop in Reseda?"
    a: |
      Yes, the City of Los Angeles — which governs Reseda — requires a
      permit from LADBS (the LA Department of Building and Safety) for any
      gas appliance replacement. The permit fee typically runs $75–$150
      depending on the scope, and the city schedules a follow-up inspection
      after the work is complete.

      MaxFixing handles all of that under California Contractor License
      #1136541; you don't need to navigate the LADBS portal yourself. For
      homeowners in HOA-governed properties near the Reseda Boulevard
      corridor, appliance swaps inside the kitchen typically don't require
      board approval — but we can confirm what applies to your specific
      address when we come out for the estimate.

  - q: "Do you repair both gas and electric cooktops, or only one type?"
    a: |
      Gas, electric smooth-top, and induction — all covered. Gas cooktop
      work involves the spark igniter system, burner caps and heads, gas
      valve, and thermocouple, with parts in stock for the major brands.
      Electric smooth-top repairs center on the radiant heating element,
      ceramic glass panel, and control board. Induction repairs require
      diagnosing the inverter board and coil assembly beneath the glass,
      which takes specialized test equipment we carry in the truck.

      In the 91335 area, roughly 70% of our cooktop calls are gas, about
      25% are electric smooth-top, and the remaining 5% are induction —
      so gas parts are where our truck inventory is heaviest. Either way,
      call (323) 870-4790 and describe what yours is doing; we'll tell you
      exactly what to expect before we arrive.

  - q: "What warranty covers the cooktop repair work?"
    a: |
      Parts and labor carry a 90-day warranty on all cooktop repairs. A
      replaced igniter electrode or control board that fails within 90 days
      gets fixed on a return visit at no charge. Ceramic glass panel
      replacements often carry a separate 1-year manufacturer's warranty on
      the panel itself — we pass that through to you in writing.

      The warranty covers the specific component replaced, not new failures
      on unrelated parts, which we'd flag separately if spotted during the
      initial visit. Cooktops in the Valley generally have a 15–20 year
      useful life with reasonable maintenance; most units we repair in
      Reseda are 8–18 years old and have plenty of functional life left.
      A targeted repair almost always extends that life meaningfully without
      the disruption of a full appliance replacement.

  - q: "What other neighborhoods near Reseda do you cover for cooktop repair?"
    a: |
      Tarzana, Winnetka, Canoga Park, Northridge, and Van Nuys are all
      in our regular service rotation with no additional travel fee.
      Encino and Sherman Oaks are also covered. For same-day service, we
      handle most of the 818 area code.

      Scheduling is straightforward: call (323) 870-4790 and we confirm a
      window in a few minutes. Same-day slots are typically available for
      calls placed before noon. Saturday appointments book fast during
      summer — Valley kitchens run hard in the heat and cooktop issues
      pile up — so calling ahead by a day or two helps. Gas safety
      concerns jump to the front of the queue; call us and we sort out
      timing from there.
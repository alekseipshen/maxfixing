title: "Reseda Dishwasher Repair — Hard Water Wears Them Fast"

intro: |
  Sherman Way through the heart of 91335 is lined with stucco apartment blocks from the
  1960s — two and three-story buildings where the kitchens are small, the plumbing is
  aging, and Kenmore or Whirlpool dishwashers get cycled twice a day by families who rely
  on them completely. LADWP supply water in Reseda tests consistently above 270 mg/L total
  dissolved solids. That calcium load doesn't announce itself — it quietly coats the spray
  arm holes, jams the detergent dispenser, and silts up the drain pump filter until the
  machine just stops cleaning right. South of Victory Boulevard, the neighborhood shifts to
  1950s-era owner-occupied ranch homes near Reseda Park, where a GE or Frigidaire unit
  might be twelve years old and throwing an error code the homeowner has never seen before.
  Both situations — the rental with standing water pooled in the tub and the family home
  with a door latch that won't seal — need the same thing: a technician who shows up same
  day, knows the machine cold, and fixes it on the first visit.

localContext: |
  The housing in 91335 runs from dense rental corridors along Sherman Way and Saticoy
  Street to quiet owner-occupied blocks south of Victory Boulevard where 1,100-square-foot
  ranch homes still have original cabinet layouts. In those ranches, dishwashers are often
  installed in cabinetry with almost zero side clearance — pulling a Whirlpool unit to
  access the drain pump means careful extraction to avoid tearing thirty-year-old laminate
  that nobody wants to replace. The 91337 pocket, covering the slice of Reseda near Wilbur
  Avenue and the Northridge border, trends toward 1980s construction where plumbing was
  often roughed in economically. Water hammer stress on the inlet valve is common there,
  and connections worked loose over decades. San Fernando Valley summer heat is a real
  variable too: inside a west-facing Reseda kitchen in August, ambient temps can easily
  hit 90°F, forcing the heating element to run longer on every drying cycle and shortening
  its service life compared to an identical unit running in a coastal zip like Santa
  Monica. Hard water plus Valley heat adds up to faster wear on the control board, spray
  arm bearings, and door gasket seal than most manufacturers' rated specs account for.

commonProblems:
  - title: "Spray Arms Clogged with Calcium — Dishes Come Out Dirty Every Cycle"
    description: |
      The spray arm holes on most residential dishwashers are roughly 2mm in diameter.
      With Reseda water running around 275 mg/L TDS, those holes can narrow to near-pinhole
      width within 18 to 24 months of regular use. Dishes come out looking untouched — water
      barely reached them. On Kenmore 665 series and Whirlpool WDF units, both extremely
      common in Reseda apartment buildings, we pull both the upper and lower spray arm, soak
      them in citric acid descaler, and inspect the mounting post for stripped threads. If
      the arm itself is cracked or the post anchor is broken, replacement parts run $20-45
      depending on model. The float switch usually picks up a calcium coat at the same time
      and is worth cleaning in the same visit. Full cleaning and inspection takes under an
      hour on site. Total cost for this repair typically runs $85-125 parts and labor
      combined — far cheaper than a new unit.

  - title: "Standing Water in the Tub After a Cycle — Drain Pump Failure"
    description: |
      Water pooling at the bottom of the tub at cycle end usually traces to one of two
      things: a plumbing blockage at the disposal connection or a failed drain pump. In
      Reseda kitchens with garbage disposals — which is most of them — the first check is
      whether the disposal's knockout plug was ever removed when the dishwasher was
      connected. It is a common installation error in older apartment buildings along the
      Saticoy Street corridor. If plumbing is clear, the drain pump is the likely culprit.
      A debris slug gets past the filter, jams the impeller, and the pump burns out. On GE
      GDT series and Frigidaire FFCD units, the pump assembly runs $40-80 in parts. Samsung's
      5C or 5E error code and the Kenmore "clean" light flashing seven times are both direct
      indicators of drain pump failure. We carry common pump assemblies on the truck — call
      (323) 870-4790 and same-day service is usually available within two hours.

  - title: "Door Latch Won't Engage — Rental Units Have a Legal Clock on This One"
    description: |
      A broken door latch assembly means the door switch never closes the circuit, so the
      wash cycle will not start at all — the machine just sits there silent. On Samsung DW80
      series units, the plastic latch housing is known to crack at the mounting tab around
      year five or six. Whirlpool's equivalent part has a similar failure rate in high-use
      rental kitchens. For Reseda landlords, this matters beyond the inconvenience —
      California Civil Code 1941 treats a functioning dishwasher as a required amenity if it
      was part of the unit at move-in, and a documented repair timeline protects against
      tenant complaints. Our contractor license (#1136541) covers residential appliance repair
      across all of LA County, and we provide written service records for property managers
      who need them. Latch replacement costs $65-110 parts and labor. Most latch jobs are
      done in 45 minutes on site.

  - title: "Detergent Dispenser Stuck Shut — A $20 Fix Disguised as a Bigger Problem"
    description: |
      Dishes coming out cloudy or with an undissolved pod still sitting in the compartment
      after the cycle ends almost always points to one thing: the detergent dispenser door
      spring or bimetal actuator has failed. In Reseda's hard water environment, calcium
      deposits lock the actuator in the closed position so it never fires mid-cycle. On
      Whirlpool and Maytag dishwashers — two of the most common brands in Reseda's older
      housing stock — the dispenser assembly is $20-35 in parts and under an hour to replace.
      The mistake that costs homeowners money is assuming the problem is the control board.
      On GE Profile units specifically, a stuck dispenser can trigger a fault code that
      mimics a board failure, and some shops quote $300-400 for a board swap that is not
      needed. Diagnostic first, always. Total fix for a dispenser actuator replacement is
      usually $95-130, and the machine runs cleanly afterward.

  - title: "Recurring Error Codes — How to Tell If the Machine Is Worth Fixing"
    description: |
      Samsung dishwashers flash 5C or 5E for drain issues. Frigidaire Gallery units throw F7
      when the water temperature sensor fails. Older Kenmore models just beep repeatedly
      with no display at all. These codes point to specific components, and repair cost varies
      significantly depending on which one. A thermal fuse on a Frigidaire is $12 in parts
      and thirty minutes of labor. A main control board on the same machine runs $150-220 in
      parts alone — at that point, a ten-year-old unit is rarely worth fixing. In Reseda, the
      most common error we actually diagnose is a fill timeout caused by a mineral-clogged
      water inlet valve. The valve is $30-50 in parts, the fix takes an hour, and the machine
      runs fine for years after. Hard water is the real driver behind most of these codes.
      Schedule a diagnostic at (323) 870-4790 — we identify the exact part before quoting
      a price, so there are no surprises.

faq:
  - q: "How fast can you get to Reseda for a dishwasher repair?"
    a: |
      Reseda sits near the 101 and 405 interchange, so we reach most addresses in 91335
      within 20-30 minutes from our Valley base. Parking a service van on residential streets
      near Reseda Park or along the Sherman Way rental corridor is generally straightforward —
      no tight structure parking or permit-zone blocks to navigate. Call (323) 870-4790 in the
      morning and we can confirm a same-day arrival window most days. Evening slots are
      available for households where someone needs to be home after work hours. We do not
      give vague four-hour windows — you get a two-hour range and a text when we are ten
      minutes out.

  - q: "What does dishwasher repair in Reseda typically cost?"
    a: |
      Diagnostic runs $65-85 and gets credited toward the repair if you move forward. Most
      common fixes — drain pump replacement, spray arm cleaning, door latch assembly swap,
      detergent dispenser actuator — land between $95-175 total parts and labor. Control
      board replacement is the expensive end of the range: $220-350 depending on brand, with
      Samsung and LG running higher than Whirlpool or GE. Water inlet valve swaps, thermal
      fuse replacements, and float switch fixes all come in under $130. The exact price gets
      quoted before we touch anything. Free on-site estimates are available if you are unsure
      whether repair makes financial sense versus just replacing the unit.

  - q: "Does dishwasher installation in Reseda require a permit?"
    a: |
      Standard repair work — parts replacement, diagnostics, drain clearing — requires no
      permit. Swapping one dishwasher for another using the same drain and electrical
      connections also does not require a permit in LA. New installation to a location that
      did not previously have a dishwasher does require a plumbing permit from LADBS (LA
      Department of Building and Safety). We handle that paperwork directly. Our contractor
      license (#1136541) covers residential appliance installation throughout LA County, and
      the application process for a standard residential install is routine. Approval typically
      comes through in one to two business days, and we coordinate the inspection scheduling
      as well.

  - q: "Can you fix Samsung or LG dishwasher error codes the same day?"
    a: |
      Most of the time, yes. Samsung's 5C and 5E drain error codes, LG's E1 water inlet
      fault, and the LE motor error are all diagnosable on the first visit. Drain pumps,
      water inlet valves, door latch assemblies, thermal fuses, and float switches for the
      most common Samsung and LG models ride on the truck with us. Control boards are the
      exception — if the diagnostic points to a board failure, there may be a one to two day
      parts wait depending on model year. That gets communicated upfront after the diagnostic,
      not after disassembly. Most error codes we find in Reseda trace back to water-related
      component failures rather than board failures, so same-day resolution is the common
      outcome, not the exception.

  - q: "What warranty do you offer on dishwasher repairs in Reseda?"
    a: |
      Labor is warranted for 90 days — same issue returns within that window, we come back at
      no charge. Parts carry the manufacturer warranty, typically one year on OEM components.
      Original manufacturer parts are used on Samsung, GE, Frigidaire, and Whirlpool repairs
      wherever possible, not aftermarket substitutes. For Reseda's hard water environment
      specifically, a monthly citric acid rinse cycle does a lot to slow calcium buildup on
      spray arms and the inlet valve — that single habit can significantly extend the time
      between service calls. Dishwashers in the Valley typically run 8-12 years for budget
      brands. Machines over ten years old with major component failures get an honest
      repair-versus-replace assessment from us before we quote any work.

  - q: "Do you cover neighborhoods near Reseda, or just the 91335 zip code?"
    a: |
      Reseda is a central stop in our daily San Fernando Valley route. Coverage runs north to
      Granada Hills and Porter Ranch, east to Van Nuys and North Hollywood, west to Canoga
      Park and Woodland Hills, and south toward Sherman Oaks. We also run down to Irvine and
      up to Santa Clarita for urgent calls — two technicians cover that full range daily.
      Same-day availability in both the 91335 and 91337 zip codes is common, not a special
      case. Call (323) 870-4790 any morning and we will confirm whether a same-day slot is
      open — for most of the Sherman Way corridor and the blocks around Reseda Park, the
      answer is usually yes.
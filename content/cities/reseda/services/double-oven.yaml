title: "Reseda Double Oven Repair — When One Cavity Quits on You"

intro: |
  Plenty of the postwar tract homes between Vanowen Street and Sherman Way were built
  with kitchens designed for families who actually cooked — double wall ovens included.
  Those units, or the Kenmore and GE replacements dropped in during the '80s and '90s
  remodels, have been running hard ever since. Multi-generational households throughout
  the 91335 use their ovens daily, not just on Thanksgiving. The failure pattern we see
  most: the lower cavity goes completely dark while the upper one works fine, which
  throws off every cooking plan until someone figures out which element burned out.
  Double oven ranges from Whirlpool and Samsung have their own headaches — F-codes
  on the display, an igniter that glows orange but never opens the gas valve, a control
  board that reboots mid-bake. Families near Reseda Park don't have time to wait weeks
  for a part. Call (323) 870-4790 — same-day slots are usually open.

localContext: |
  Reseda's housing stock is mostly post-WWII construction — flat-roofed stucco ranches
  along Etiwanda Avenue and Gault Street, with denser apartment blocks closer to the
  101 corridor. The 91335 zip code shares kitchen DNA with northern Northridge (91324):
  built-in double wall ovens that were aspirational spec in the '60s, now aging in
  kitchens that haven't been remodeled since the Clinton years. The San Fernando Valley
  summer heat — consistent 100°F-plus days from June through September — stresses
  appliance control boards in a way coastal neighborhoods don't experience. A gas double
  oven sitting along an exterior-facing kitchen wall in August is fighting ambient heat
  while trying to hold 375°F; that accelerates igniter wear and gas valve cycling. Older
  homes in Reseda also carry original 1950s-era 240V panel work, which can cause
  intermittent voltage supply issues that mimic control board failure. Worth ruling out
  the electrical side before ordering a $300 board.

commonProblems:
  - title: "Lower Oven Dead, Upper Still Works — Bake Element Burnout in GE and Kenmore Units"
    description: |
      The most common call we get from Reseda double oven customers: one cavity stopped
      producing heat, the other is completely normal. In electric double wall ovens —
      particularly the GE Profile and Kenmore Elite models installed in 91335 homes
      between 1995 and 2010 — the culprit is almost always the bake element burning
      through. Pull the oven rack, look at the element coil: you'll usually see a
      visible break or a blistered section. Replacement runs $30-$60 in parts and
      under an hour of labor, total bill typically $140-$220. Gas double ovens are
      different — the igniter weakens over years of heat cycling, eventually drawing
      too little current to trigger the gas valve solenoid. You get a glow, you smell
      gas briefly, but the burner never lights. Igniter swap on a Whirlpool or Amana
      double range runs $150-$200 parts and labor. We stock common igniters on the truck.

  - title: "Upper and Lower Ovens Running at Different Temps — Oven Sensor Drift"
    description: |
      Both cavities heat, but one consistently runs 25-35 degrees hotter or cooler than
      the set point. Food on one rack burns while the other rack undercooks. The cause
      is almost always a drifted oven temperature sensor — a thin RTD probe mounted to
      the back wall of the oven cavity. Samsung and LG double oven ranges, which became
      popular in Reseda over the last ten years, use sensors that are inexpensive to
      replace ($20-$40 in parts) but require a calibrated thermometer to diagnose
      accurately rather than just trusting the display reading. Some models let you
      manually offset the temperature setpoint through the settings menu without touching
      hardware. If both cavities are running off, that points upstream to the control
      board rather than individual sensors. We confirm the diagnosis on the first visit
      and won't quote a sensor replacement if the board is actually the problem.

  - title: "F-Code Errors and Dead Displays — Control Board and Relay Failure"
    description: |
      Control board failure in a double oven usually announces itself clearly: an F1,
      F2, or F3 error code on GE units; an SE error or C-21 code on Samsung ranges;
      a completely dark display that won't respond to button presses. In older Reseda
      homes with 1960s-era 240V wiring, voltage fluctuations from aging panels can
      fry control boards that would otherwise last decades. Frigidaire double oven ranges
      are particularly susceptible to relay board failures — the relays that switch the
      broil element are usually the first components to burn out. Replacing a control
      board runs $200-$400 in parts depending on model, plus labor. Before ordering
      a board, we always check the thermal fuse and door latch switch — both can produce
      symptoms identical to a dead board. Contractor license #1136541. We diagnose
      before recommending parts, not the other way around.

  - title: "Oven Door Sags or Won't Seal — Broken Hinge Assembly and Worn Door Gaskets"
    description: |
      A double oven door that hangs crooked, won't close flush, or lets heat leak around
      the edges is a real problem — oven temps drift, cook times extend, and the edge
      of the door frame gets hot enough to burn. The spring-loaded hinge assembly on
      double wall ovens — common in older Whirlpool and KitchenAid built-ins from
      Reseda's 1980s and '90s remodel era — fatigues with thousands of open-and-close
      cycles. When the hinge lock fails, the door lists to one side. Replacement hinges
      are model-specific; discontinued parts for older units require sourcing, which
      adds a day or two. Beyond hinges, a hardened or cracked door gasket on a GE double
      wall oven leaks 15-20% of cavity heat, causing uneven bakes and longer preheat
      times. Gasket replacements run $25-$60 in parts, about 30 minutes of labor.
      We carry common gasket sizes on the van.

  - title: "Double Oven Heating Slowly or Running Loud — Repair vs. Replace Math"
    description: |
      A double oven that takes 25 minutes to preheat to 350°F, or that rattles from
      the upper cavity during convection mode, is usually dealing with a failing
      convection fan motor. The fan blade in most Kenmore and Frigidaire double wall
      ovens is plastic; after years of heat cycling it warps slightly, creating
      vibration and uneven air circulation. Fan motor assembly replacement runs
      $100-$175. Past the 15-year mark, though, the repair math starts shifting.
      Parts become harder to source, and a second failure within 18 months often
      costs more than a new unit would have. A new Whirlpool or GE double wall oven
      in the standard 30-inch format runs $1,200-$2,500 installed in Reseda; a Samsung
      double oven range typically lands $1,000-$1,800. We'll give you the straight
      breakdown on whether repair pencils out. Call (323) 870-4790 and describe
      what you're seeing before committing to anything.

faq:
  - q: "How fast can you get to Reseda for double oven repair?"
    a: |
      Reseda sits right off the 101 — the Reseda Boulevard exit puts us in the
      neighborhood within 20-30 minutes from most of our service area, depending on
      Valley freeway conditions. Morning appointments before 9am usually beat the worst
      of it. For the 91335 zip code, same-day service is available most days; we
      typically arrive within 2-3 hours of booking if you call before noon. Evening
      slots run Tuesday through Saturday for households where nobody's home during the
      day. Call (323) 870-4790 to check today's openings. We provide a 1-hour arrival
      window — not a vague 4-hour block that leaves you waiting all afternoon.

  - q: "What does double oven repair cost in Reseda?"
    a: |
      It depends heavily on which part failed. A bake element replacement on a GE or
      Kenmore double wall oven — parts and labor combined — typically runs $140-$220.
      Oven sensor swaps land around $120-$175. Door hinge repairs are $150-$250
      depending on parts availability for older models. Control board replacement sits
      at the expensive end: $300-$500 depending on the unit. A $75 diagnostic fee
      applies on arrival, and that gets credited toward the repair if you move forward.
      For jobs where the failure is visually obvious — a burned element, a broken
      hinge — we can often quote on the spot. The price you get before we start
      is the price you pay.

  - q: "Do I need a permit to replace a built-in double oven in Reseda?"
    a: |
      Straight part repairs on an existing appliance don't require a permit. If you're
      swapping a built-in double wall oven for a new unit that needs new 240V wiring
      or a gas line modification, the City of Los Angeles Department of Building and
      Safety does require a permit for that electrical or gas work. We handle the
      appliance installation side under contractor license #1136541; any wiring or gas
      line changes that cross the permit threshold get coordinated with a licensed
      electrician or plumber. Most direct oven-to-oven replacements in Reseda — same
      cutout dimensions, same fuel type — don't trigger that requirement. We'll clarify
      exactly where your project lands during the estimate visit.

  - q: "Can you repair gas double ovens, or only electric?"
    a: |
      Both fuel types. Gas double oven ranges are common throughout Reseda — a lot of
      homes in the 91335 stayed on gas appliances through decades of kitchen updates
      because the infrastructure was already there. The most frequent gas oven issues
      are igniter failure, gas valve solenoid faults, and thermostat drift. We stock
      igniters for Whirlpool, GE, Frigidaire, and Kenmore gas ovens on the truck for
      same-visit repairs. Gas valve replacement is less routine but we handle it.
      After any gas-side repair, we check for leaks with a combustible gas detector
      before closing up — that's non-negotiable. If you're smelling gas from your
      oven right now, call (323) 870-4790 immediately and we'll prioritize your slot.

  - q: "What warranty do you offer on double oven repairs in Reseda?"
    a: |
      Parts we supply carry a 90-day warranty; labor is guaranteed for 30 days. If the
      same failure recurs within that window, we return at no charge. For control board
      replacements, we use OEM or OEM-equivalent boards — not the $40 off-brand units
      that fail within a season. Bake elements and igniters from reputable suppliers
      typically last 5-10 years under normal use. We're direct about limits: a 20-year-old
      double oven may have a second unrelated failure after we fix the first one, and
      that second issue wouldn't fall under the original warranty. We say that during
      the estimate rather than after the fact — because the alternative is you feeling
      blindsided, and that's not a good outcome for either of us.

  - q: "Do you cover neighborhoods near Reseda, or just the 91335?"
    a: |
      Reseda is a central stop for us in the Valley. From there we regularly cover
      Northridge, Canoga Park, Winnetka, West Hills, Woodland Hills, Tarzana, and
      Encino. Further out, we service customers from Santa Clarita down through the
      Valley to Burbank and Glendale — and south through the Westside when scheduling
      allows. Most Valley appointments go on the calendar within 24 hours. Early morning
      and mid-afternoon weekday slots tend to have the most availability for same-day
      service. Call (323) 870-4790 or schedule online — we'll confirm a specific
      arrival window rather than a general "morning or afternoon" guess.
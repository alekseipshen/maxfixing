title: "Aliso Viejo Refrigerator — Hard Water & Ice Maker Repairs, 92656"

intro: |
  Most of Aliso Viejo's housing went up between 1990 and 2006 — a development window
  that filled these kitchens with KitchenAid French-door and Samsung side-by-side models
  that are now hitting the 20-year mark. That's exactly when evaporator coils start icing
  over and ice maker assemblies begin failing. South Orange County's summer heat doesn't
  help either — refrigerators near the 73 corridor run harder than they were rated for.

localContext: |
  The 92656 zip covers Aliso Viejo's master-planned neighborhoods — Glenwood, Pacific
  Ridge, the town center condos along Enterprise — homes built between 1992 and 2005.
  Newer construction doesn't mean easier repairs. Orange County Municipal Water District
  tap water averages 300-400 ppm hardness, and that mineral load hits ice maker water
  lines and inlet valves hard, regardless of how new the refrigerator is.

commonProblems:
  - title: "Ice Maker Failures Caused by South OC Hard Water"
    description: "That mineral-heavy tap water slowly chokes the water inlet valve and
      clogs the ice maker's fill tube on Samsung and LG French-door models. The result
      is no ice production, or a slow trickle that refreezes into a solid block. We
      see this constantly in Glenwood — usually a valve swap under $180 all-in, done
      same visit."

  - title: "Compressor Overheating in Inland Summer Heat"
    description: "Aliso Viejo sits inland enough that summer temps regularly push past
      90°F — hotter than coastal Laguna or Dana Point. In a poorly ventilated kitchen,
      the condenser fan works overtime. On KitchenAid bottom-freezer models, a clogged
      condenser coil makes the compressor run hot, trips the thermal overload, and the
      whole unit stops cooling."

  - title: "Freezer Ice Buildup on Sub-Zero and Bosch Built-Ins"
    description: "Higher-end homes near Aliso Peak Open Space tend to have Sub-Zero or
      Bosch counter-depth units. Classic symptom: ice forming at the back of the freezer,
      then the refrigerator section slowly warms. That's a defrost timer or defrost
      heater failure — the evaporator coil frosts over completely and blocks airflow.
      Both brands use proprietary parts that most generalist techs can't source."

faq:
  - q: "How fast can you get to Aliso Viejo for refrigerator repair?"
    a: "Usually within 2 hours. Service routes run daily from Irvine through Mission Viejo,
      and 92656 sits right in that corridor. Parking is straightforward in most Aliso
      Viejo residential areas — no permit headaches. Call (323) 870-4790 to grab a
      same-day slot."

  - q: "Do you repair KitchenAid and Samsung refrigerators in Aliso Viejo?"
    a: "Both, regularly. KitchenAid bottom-freezers with ice maker assembly problems and
      control board errors are our most common call here. Samsung French-door models
      come in close second — usually a failed water inlet valve or a worn door gasket
      letting warm air in. LG, Bosch, and Sub-Zero too."

  - q: "What does a refrigerator repair cost, and can you come out same day?"
    a: "Depends on the part — a water inlet valve on a Samsung usually runs $130-180
      all-in. Compressor work on a Sub-Zero is a bigger job. We diagnose same-day and
      give a firm quote before touching anything. Evening slots are available. Schedule
      online or call (323) 870-4790."

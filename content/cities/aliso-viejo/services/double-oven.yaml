title: "Aliso Viejo Double Oven — Same-Day Repair, 92656 Covered"

intro: |
  Soka University marks the western edge of town; Aliso Viejo Town Center anchors
  the commercial strip to the north. The residential builds in between — most
  completed between 1994 and 2007 — are sitting squarely in that 18-to-30-year
  window where double wall ovens start failing in predictable ways. The KitchenAid
  or Bosch unit that came with a 2002 kitchen remodel is aging on a documented
  schedule: heating elements burning out, control boards losing accuracy, hinge
  assemblies fatiguing from daily use. Orange County's hard water accelerates
  mineral buildup in any oven with a steam feature, compounding the wear. Two
  technicians cover Aliso Viejo from our OC routes, and same-day availability
  in 92656 is the norm, not a sales pitch.

localContext: |
  Townhome clusters off Aliso Creek Road — especially the denser complexes near
  the 73 Toll Road interchange — often have 27-inch built-in double ovens set into
  cabinet runs with almost no access clearance. Getting a unit out for service takes
  30-45 minutes more than a standard open-kitchen install. Detached single-family
  homes in the Glenwood and Pacific Ridge neighborhoods lean toward premium brands
  from the 2004-2012 remodel era: Thermador 30-inch double wall ovens and Bosch
  Series 8 units with glass touchscreen controls. Those control boards degrade faster
  than the mechanical components do — board failures are the most common fault type
  we see on service calls in 92656.

commonProblems:
  - title: "Upper Cavity Not Heating — Burned-Out Heating Element in 2000s-Era Double Ovens"
    description: |
      The upper oven in a double wall unit runs harder cycles and burns out first —
      that's not a defect, just how usage patterns work. Symptom is always the same:
      the lower cavity bakes normally while the upper barely reaches 200°F. On
      KitchenAid double ovens, the bake heating element needs replacement, but the
      oven temperature sensor gets tested too. A drifting thermostat produces
      identical symptoms and gets misdiagnosed as an element failure constantly.
      Most of these wrap up same-day.

  - title: "Temperature Running Off — Control Board and RTD Probe Failures"
    description: |
      A Thermador double wall oven displaying 375°F but actually running 40-50
      degrees hotter is the most frequent complaint we hear from Aliso Viejo
      homeowners. The fault is almost always the RTD temperature probe — a narrow
      sensor on the rear oven wall that drifts out of calibration after years of
      heat cycling. On gas-line homes, which covers most of Aliso Viejo east of
      Moulton Parkway, we also test the gas valve igniter, because weak igniter
      output causes irregular cycling that mimics sensor failure on initial
      diagnostics.

  - title: "Sagging Door and Broken Hinge Assembly — Bosch Double Ovens"
    description: |
      Bosch double wall oven door hinges are a documented failure point between
      years 12 and 16 of daily use. The spring-loaded hinge assembly loses tension
      gradually; the door starts to hang lower on one side. Once that happens, the
      door gasket seal lifts away from the frame and heat escapes from around the
      cavity edge — typically 15-25 degrees of loss on a gas double oven, enough
      to ruin a bake without any obvious warning sign. Bosch-specific hinge kits
      aren't on the shelf at Home Depot. We carry them.

faq:

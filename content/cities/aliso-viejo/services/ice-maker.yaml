title: "Aliso Viejo Ice Maker Repair — 92656 Hard Water Kills Fill Valves"

intro: |
  Three or four years into normal use, the water inlet valve on a Samsung or LG
  french-door fridge starts losing flow. Not broken — restricted. Moulton Niguel
  Water District supply in 92656 tests above 300 ppm total dissolved solids in
  many areas, and that mineral load calcifies the solenoid port gradually until
  the ice maker stops producing entirely. No error code. The unit just goes quiet.
  Vantis and Pacific Ridge homeowners tend to notice this later than most because
  their refrigerators run in climate-controlled condos where nothing else seems wrong.
  Call (323) 870-4790 — same-day service available in 92656.

localContext: |
  Aliso Viejo's housing stock is entirely post-1990, built in planned phases through
  the early 2000s. That means most refrigerators are 15-25 years old now — deep enough
  into the product lifecycle that ice maker assembly failures are no longer edge cases.
  The larger single-family homes on the east side of 92656, particularly around Pacific
  Ridge Drive, run Sub-Zero and KitchenAid built-in columns; service access on those
  requires panel removal before you can even see the ice maker module. Townhome clusters
  near the 73 and along Aliso Creek Road lean toward LG and Samsung freestanding units,
  which are more accessible but fail more predictably at the fill valve and optic sensor.

commonProblems:
  - title: "Fill Valve Calcification — The Most Common Ice Maker Call in 92656"
    description: |
      The water inlet valve is a solenoid-driven port that opens to let water flow
      into the ice mold on a timed cycle. In 92656, Moulton Niguel's high-mineral
      supply deposits calcium carbonate directly inside that solenoid housing. Pressure
      drops incrementally — first smaller cubes, then hollow ones, then nothing. Samsung
      french-door models are the most frequent case we see, but LG and Bosch units are
      not far behind. Flushing the line doesn't clear a calcified solenoid port; the
      valve has to come out. Replacement runs about 45 minutes once confirmed.

  - title: "Optic Sensor or Thermistor Failure Producing Misshapen Cubes"
    description: |
      A failing ice level sensor — either the infrared optic pair mounted on the ice
      maker housing or the thermistor inside the mold — misjudges where the bin stands.
      It signals full when the tray is half-empty, or kicks off a harvest cycle before
      cubes have actually frozen through. KitchenAid bottom-freezer refrigerators show
      this pattern most often in Aliso Viejo: hollow cubes, cubes fused into a block, or
      cubes that jam the dispenser chute and trigger an E5 or F8 error code. The sensor
      components are inexpensive. The risk is paying for a full ice maker assembly swap
      when a single $30 thermistor was the actual problem.

  - title: "Frozen Supply Line in Garage-Adjacent Kitchen Walls"
    description: |
      A quarter of the homes in 92656 position the refrigerator alcove against the
      garage-facing exterior wall — a legacy of how the 1990s-era tract floor plans
      laid out kitchen utilities. In winter, that cold wall can freeze the supply
      line feeding the ice maker inlet before it even reaches the fill valve.
      Sub-Zero and Thermador built-in columns route the water line internally through
      the cabinet structure, which changes how the thaw procedure works compared to a
      freestanding unit. Call (323) 870-4790 before pulling the fridge out — we can
      usually walk you through a phone diagnosis in under five minutes to rule it out.

faq:
  - q: "How fast can you get to Aliso Viejo for ice maker repair?"
    a: |
      The 73 Toll Road puts most of 92656 about 20-30 minutes from our nearest tech.
      Same-day slots book up fast in summer when refrigerators are under heavier load,
      but evening appointments are usually available on weekdays. Call (323) 870-4790
      before noon and we can typically get there the same afternoon.

  - q: "Do you work on LG, KitchenAid, and Sub-Zero ice makers specifically?"
    a: |
      Yes — LG and KitchenAid are the two brands we see most in Aliso Viejo zip code
      92656. Samsung is close behind. Sub-Zero and Thermador built-in columns come up
      less frequently but require OEM ice maker modules and specific service access
      procedures we handle regularly. On LG it's usually the fill valve or ice maker
      assembly. On KitchenAid, the optic sensor and control board fail most often.
      Common parts for all five brands are on the truck.

  - q: "What does ice maker repair cost in Aliso Viejo, and is same-day service available?"
    a: |
      Fill valve replacements run $130-$190 in parts and labor combined. A full ice
      maker assembly swap on an LG or KitchenAid typically lands between $210 and $320
      depending on model. Thermistor and optic sensor jobs are usually under $150.
      Diagnosis is free when we do the repair. Same-day emergency slots are available
      — call (323) 870-4790 or schedule online, and we'll confirm pricing before any
      work starts.
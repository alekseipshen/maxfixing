title: "Aliso Viejo Dishwasher Repair — Hard Water & Aging Bosch Units"

intro: |
  Built out by The Irvine Company starting in the late 1980s, Aliso Viejo reached full buildout around 2002 — which means a lot of original-install dishwashers are now pushing 20-plus years. Kitchens in the Pacific Ridge and Glenwood neighborhoods commonly run Bosch 300 and 500 Series units; the spray arm nozzles on those calcify fast in Orange County's notoriously hard water. We're in 92656 regularly and know these kitchens well.

localContext: |
  Most homes here were built between 1988 and 2002 — newer than much of LA proper, but old enough that original appliance hardware is starting to fail. The 92656 zip covers the bulk of the city, including higher-density townhouse sections near Aliso Viejo Town Center, where kitchen layouts are tighter and dishwasher access means working around cabinetry and narrow passageways.

  The south end of the city edges toward Laguna Hills — single-family homes on those streets run KitchenAid and Bosch dishwashers almost exclusively. Hard water is a persistent issue here: Orange County tap water consistently tests above 250 ppm, and the mineral load in the water supply plumbing shows up inside dishwasher inlet valves and spray arm nozzles faster than most homeowners expect. Calcium deposits in the lines aren't just a cosmetic problem — they restrict flow enough to trigger wash cycle errors.

  The Pacific Ridge neighborhood tends to have older Whirlpool and GE installs from the original build. Newer remodels swapped in Bosch 500 Series or Samsung units. Condo clusters near the Aliso Viejo Community Park often have compact under-counter machines — tighter access, but the repair work is identical.

commonProblems:
  - title: "Calcium Scale Blocking Spray Arms — An OC Hard Water Problem"
    description: "Orange County Municipal Water District water regularly tests at 250–300 ppm mineral hardness. That load gradually chokes spray arm nozzles and coats the float switch, causing wash cycles to skip or run incomplete. Bosch units are especially prone — the narrow arm channels clog faster than on domestic-brand machines. Most fixes involve descaling plus a new inlet valve if restriction is severe."

  - title: "Standing Water After the Cycle — Drain Pump Failure"
    description: "Water pooling at the bottom of the tub after a wash usually means a clogged or failed drain pump. LG and Samsung dishwashers in newer Aliso Viejo remodels throw error codes — OE on LG, 5C on Samsung — when the pump impeller is blocked by food debris or a burned pump motor. Clearing the filter solves it maybe half the time; the other half, the motor needs replacing."

  - title: "Detergent Dispenser Not Opening Mid-Cycle"
    description: "The dispenser door is spring-loaded, triggered by a wax motor partway through the wash. When the wax motor fails — common on KitchenAid and Bosch units after 10–15 years — the pod just sits there untouched and dishes come out greasy. It's a quick part swap once diagnosed. Call (323) 870-4790 and we can usually get out same-day."

faq:
  - q: "How fast can you get to Aliso Viejo for dishwasher repair?"
    a: "Coming south on the 5 or down Aliso Creek Road, we reach 92656 in under 45 minutes from most of our regular service zone. Same-day slots open up frequently — call (323) 870-4790 and we'll confirm availability on the spot."

  - q: "Do you repair Bosch and KitchenAid dishwashers specifically?"
    a: "Yes — Bosch 300/500 Series and KitchenAid built-ins are the two machines we see most in Aliso Viejo. Common work: spray arm assemblies, drain pump swaps, door latch assembly replacements on KitchenAid, control board resets on Bosch. LG and Samsung units too."

  - q: "What does a dishwasher repair typically cost, and how quickly can you come?"
    a: "Most repairs run $150–$350 parts and labor. Drain pump and inlet valve replacements sit on the lower end; control board jobs push higher. Evening slots are available most days — schedule online or call (323) 870-4790 for same-day booking."

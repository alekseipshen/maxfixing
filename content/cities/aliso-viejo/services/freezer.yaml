title: "Aliso Viejo Freezer Repair — Hard Water Hits Ice Makers in 92656"

intro: |
  Most of the housing in 92656 went up during the late 1990s through early 2000s, which means plenty of KitchenAid and LG freezer units are now at or past the 20-year mark. The freezer section usually shows wear first. Evaporator coil frost buildup, ice maker scaling from Orange County's notoriously hard water, temperatures that drift and never quite stabilize — up near the Aliso and Wood Canyons trailheads, these are the calls we see every week.

  Twenty-plus years is a long run for any refrigerant system. Defrost heaters cycle thousands of times. Door gaskets go through a decade of daily pulls. The linear compressor in an older LG bottom-freezer doesn't fail all at once — it just starts losing efficiency until one August afternoon the unit reads 18°F instead of 0°F and you're pulling everything out of the freezer drawer at 6 PM.

localContext: |
  The neighborhoods around Aliso Town Center and along Pacific Park Drive are packed with townhomes and detached single-family homes from the mid-to-late 1990s. Many kitchens still have the original side-by-side or bottom-freezer appliances from that era still in service.

  In the denser complexes near Aliso Creek Road — zip 92656 — parking for a service van takes some coordination. Narrow driveways, shared garages, gated entrances off Alicia Parkway. We account for that. The 73 toll road keeps travel times short from South OC, so getting a technician out same-day is usually straightforward.

  Newer builds near Glenwood and the Westridge area tend to run Bosch and higher-spec KitchenAid configurations. Those kitchens are tighter and the appliances are integrated into cabinetry — pulling a bottom-freezer drawer unit for evaporator access requires removing trim panels before you can even get to the coil. Different job than a freestanding unit in a 1998 Aliso Viejo townhome.

commonProblems:
  - title: "Evaporator Coil Frost Buildup — The Most Common Freezer Call in This Area"
    description: |
      Orange County hard water accelerates mineral deposits inside the ice maker assembly, but a frosted evaporator coil is the part that actually cuts airflow and stops the freeze. A failed defrost timer or burned-out defrost heater lets ice accumulate until the unit can't reach temperature. KitchenAid units from the late 1990s and early 2000s — common all over 92656 — hit this failure mode regularly once the defrost cycle components age out.

      The symptom most people notice first: frost on food in the back of the freezer compartment, or the refrigerator section running warmer than normal. That's the evaporator doing its job until it can't anymore. By the time the display shows an error, the coil is usually completely blocked. On KitchenAid french-door models, that's a two-hour job minimum — pull the rear freezer panel, defrost manually, test the heater continuity, replace the defrost thermostat if it's reading open. Common fix, not complicated, but it has to be done right or it frosts up again in six weeks.

  - title: "Freezer Stops Holding Temperature When South OC Summer Hits"
    description: |
      Canyon temps near Aliso Viejo push into the 90s through July and August, and a freezer with a struggling condenser fan motor falls behind fast. The compressor overheats, trips on thermal protection, and the unit warms up — sometimes 10–15 degrees — before anyone notices the display is wrong.

      Samsung french-door models show this pattern regularly. The fan and compressor share a tight rear compartment with limited heat dissipation. Error code 22E or 8E shows up on some Samsung builds when the fan stalls. Often the motor brushes are worn, not the fan blade itself — a $40 part that turns into an emergency call because nobody caught it before July.

  - title: "Door Gasket Pulling Away from the Frame on Aging Units"
    description: |
      On units installed in the late 1990s, the door gasket material gets brittle and starts separating at the corners. Warm air bleeds in constantly, forcing the compressor to cycle nonstop — and frost accumulating on the freezer compartment's back wall is usually the first visible symptom.

      LG bottom-freezer drawer gaskets wear along the bottom edges first. Easy to miss on a quick look, obvious on a close inspection with a dollar bill — slide it into the closed door seal and pull. If it slips out without resistance, the gasket isn't sealing. A replacement gasket on an LG bottom-freezer runs $60–90 in parts. The install takes under an hour. Skip it and you're running the compressor ragged every day until something bigger gives out.


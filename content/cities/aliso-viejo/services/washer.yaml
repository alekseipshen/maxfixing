title: "Aliso Viejo Washer Repair — Hard Water Fixes, Same-Day"

intro: |
  Most 92656 homes were built during the late 1990s and early 2000s — and the appliances installed then are hitting their failure window right now. That Bosch front-loader in the laundry closet off the main hallway? The drain pump is usually the first component to go. Orange County Municipal Water District supplies this area at roughly 300–350 ppm hardness, and that mineral load accelerates wear on every moving part inside the machine.

localContext: |
  Pacific Ridge and Wood Ranch — both in the 92656 zip — are packed with two-story townhomes and detached single-family homes from 1997–2005. Laundry setups here are typically stacked or side-by-side configurations in interior hallway closets, not the spacious utility rooms you see in older San Fernando Valley homes. That tight clearance makes drum bearing replacements and spin basket work slower and more involved than a standard job.

commonProblems:
  - title: "Mineral Buildup Destroying the Water Inlet Valve"
    description: |
      Orange County hard water deposits calcium scale inside the water inlet valve — the solenoid-operated component controlling your fill cycle. LG and Samsung front-loaders in newer Aliso Viejo homes are especially vulnerable to this failure. Typical symptom: the machine starts but won't fill, or fills so slowly it throws a water supply error and stops mid-cycle.
  - title: "Drum Bearing Grinding in 20-Year-Old Machines"
    description: |
      Loud roaring during the spin cycle almost always means the drum bearing is failing. Bosch and KitchenAid units from that early-2000s build era are now right at the 15–20 year mark — exactly when this becomes inevitable. Heavier weekly loads from larger family homes near Aliso Viejo Town Center push these bearings to failure faster than the manufacturer's typical lifespan estimates.
  - title: "Drain Pump Clogs Triggering Error Codes"
    description: |
      Lint, coins, and calcium deposits from OC hard water combine inside the drain pump impeller and block drainage entirely. Samsung front-loaders signal this with the 5E or SE code — standing water left in the drum afterward. Excessive vibration often pairs with this: a worn shock absorber stops cushioning the spin basket, turning a routine cycle into something that walks the machine across the floor.

faq:
  - q: "How fast can you get to Aliso Viejo for washer repair?"
    a: |
      We run South Orange County routes daily — Aliso Viejo is typically 30–45 minutes from our nearest technician, depending on traffic on the 73 toll road. Call (323) 870-4790 for same-day availability. Evening slots are usually open if you need something after work hours.
  - q: "Do you repair Bosch, LG, and Samsung washers specifically?"
    a: |
      Those three are the most common brands we see in Aliso Viejo. On Bosch, it's usually the door latch assembly or drain pump. LG front-loaders come in frequently with drum bearing noise and control board faults. Samsung units almost always involve the 5E drain error or a worn water inlet valve from hard water buildup.
  - q: "What does a washer repair typically cost here, and how soon can you diagnose it?"
    a: |
      Most repairs land between $150 and $380 parts and labor. Drum bearing replacement on a Bosch or LG is toward the higher end — budget $280–$380. Diagnosis is same-day and we carry common parts on the truck. Call (323) 870-4790 — we can usually be there within 2 hours of your call.

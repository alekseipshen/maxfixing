title: "Aliso Viejo Cooktop — Gas & Induction Repair in 92656"

intro: |
  Planned communities age differently than organic neighborhoods. Most of 92656
  got its Bosch or KitchenAid cooktops installed all at once during the late-1990s
  and early-2000s development phases — which means a lot of Aliso Viejo kitchens
  are hitting failure windows at the same time. Clicking igniters, dead burner
  rings, cracked induction surfaces. We run South OC regularly and get to most
  calls in 92656 the same day. Call (323) 870-4790 — usually there within 2 hours.

  Twenty-five years is a long time for an igniter electrode.

localContext: |
  The 92656 zip is almost entirely post-1990 construction — single-family detached
  homes and attached townhomes across Glenwood, Pacific Park, and the Village
  neighborhoods. Cabinet cutouts and gas line positions are standardized across most
  tracts, which helps with access time. Homes along Aliso Creek Road tend to have
  the larger kitchen footprints where built-in Thermador units were common upgrades.
  Newer condo builds near Town Center skew toward induction — gas lines weren't
  always roughed in on those units.

  That standardization cuts both ways. Faster diagnosis on gas tracts, but it also
  means when a model starts failing in one home, the identical unit two streets over
  usually isn't far behind. We keep common parts stocked for the most frequent
  Aliso Viejo calls — Bosch spark modules, KitchenAid burner caps, LG induction
  control boards — so we're not waiting on shipping after the diagnosis.

commonProblems:
  - title: "Spark Electrode Failure After Years of Gas Cooktop Use"
    description: |
      On a Bosch 800-series gas cooktop, the igniter electrode sits in an open well
      just below the burner cap — close enough to catch every spill, every grease
      splatter. After a decade of use, the electrode ceramic develops hairline cracks
      and the tip oxidizes. Result: clicking that runs nonstop, or a burner that
      needs five attempts to light. The spark module may still be fine; the electrode
      itself is usually the first failure point and a simpler fix.

      One crack in the ceramic and the whole ignition cycle becomes unreliable.
      A lot of technicians replace the spark module first — that's the expensive
      wrong call. Confirming electrode condition before ordering parts saves the
      homeowner $80–$120 and two extra days of downtime.

  - title: "Burner Flame Running Uneven or Orange-Tinted"
    description: |
      Water in Aliso Viejo runs through Moulton Niguel Water District infrastructure
      and sits well above 200 ppm TDS in parts of 92656. Over time, mineral scale
      builds inside the small flame ports drilled around the burner ring. On a
      KitchenAid five-burner cooktop, this shows as an uneven orange flame on one
      side of the ring — the ports caked with calcium, the gas flow uneven.
      Clearing the ports manually and checking the thermocouple restores clean,
      consistent output.

      Orange flame isn't just inefficient. On a gas appliance, that's incomplete
      combustion — and incomplete combustion produces carbon monoxide. Worth fixing
      fast, not scheduling for next week.

  - title: "Induction Zone Not Detecting Pan or Showing Error Code"
    description: |
      LG induction cooktops throw an error on the zone display when the heating
      element coil loses contact with the ceramic panel above it — usually from
      a hairline crack the owner hasn't noticed yet, or a loose connection at
      the control board. The unit shuts itself off as a safety response.

      Diagnosing which zone is affected and whether the board or the coil assembly
      is the actual fault determines the repair cost. On the LG LSIT302ST and
      comparable models, swapping the control board without first confirming coil
      continuity wastes a $200 part. A proper bench test of each induction zone
      takes about 20 minutes on-site. Worth doing before assuming the whole cooktop
      needs replacing. Call (323) 870-4790 for same-day diagnosis.


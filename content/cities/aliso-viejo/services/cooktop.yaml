  - q: "Do you work on Bosch, Thermador, and LG cooktops in this area?"
    a: |
      Yes — Bosch gas and induction units are the most frequent service call in
      92656. Thermador star-burner cooktops show up in the larger Glenwood homes.
      LG and KitchenAid induction models are increasingly common in newer builds.
      We carry igniter electrodes, burner caps, control boards, and heating
      element assemblies for all four brands.

  - q: "How is a cooktop repair diagnosed and what does it cost?"
    a: |
      On-site diagnosis first — we check the igniter electrodes, burner caps,
      gas valve, thermocouple, and control board before quoting. Most igniter
      and burner repairs run $140–$320 including parts. Induction surface or
      control board replacements on premium brands run higher. Same-day emergency

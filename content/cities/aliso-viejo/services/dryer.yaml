title: "Aliso Viejo Dryer — Townhome Closets, Clogged Vents, Real Fixes"

intro: |
  Townhome clusters off Aliso Creek Road pack laundry closets tight — stacked units
  where the dryer vent barely clears the drywall before making a 90-degree turn into
  the exterior wall. That compressed exhaust path is exactly why so many Bosch and LG
  machines in the 92656 zip start taking 90 minutes on what should be a 45-minute
  load. Restricted airflow bakes lint into the blower wheel, and the heat just stops
  moving efficiently.

localContext: |
  Aliso Viejo's housing stock is almost entirely 1990s and early 2000s construction —
  townhome complexes around Aliso Viejo Town Center, single-family tracts off Glenwood
  Drive, newer condos near the 73 toll road. The 92656 zip is dense with stacked
  laundry configurations that were installed during the original build-outs. Vent runs
  in these units are often longer than code-recommended maximums, and nobody's cleaned
  them since the Clinton administration.

commonProblems:
  - title: "Thermal Fuse Failures from Blocked Exhaust Runs"
    description: "Long vent runs in Aliso Viejo townhomes trap lint fast. Once airflow drops,
      the dryer overheats and the thermal fuse blows as a safety cutoff — leaving you
      with a drum that spins but produces zero heat. Samsung electric dryers in these
      stacked setups blow thermal fuses more often than almost any other failure we see
      here. Fix requires replacing the fuse and clearing the exhaust vent completely,
      or it'll blow again within weeks."
  - title: "Drum Rollers Wearing Out on High-Cycle Units"
    description: "A household running 8-10 loads a week will wear through drum rollers in
      4-5 years, especially in the 1990s LG and Whirlpool units still running in older
      Aliso Viejo townhomes. The symptom is a rhythmic thumping or squealing during
      the cycle — gets louder as the load gets heavier. Replacing the drum roller kit
      also means checking the belt tensioner and idler pulley while everything's open,
      since they wear at the same rate."
  - title: "Gas Valve Igniter Failures in Garage Dryers"
    description: "Single-family homes off Glenwood and Canyon Vistas Drive frequently have
      gas dryers installed in garages where summer temps push 95°F. That ambient heat
      forces the gas valve igniter to cycle more frequently, shortening its lifespan.
      KitchenAid gas dryers from the early 2000s are particularly prone to this — the
      igniter glows but the valve coils fail to open, so the burner never lights and
      clothes come out damp after a full cycle."


title: "Covina Freezer Repair — SGV Heat vs. Your Compressor"

intro: |
  Charter Oak and the older blocks along Badillo Street have a lot of 1960s ranch
  homes — and a lot of those garages have a chest freezer sitting in the corner
  that nobody thinks about until August hits 100°F and it stops freezing. That
  Whirlpool upright was not engineered for uninsulated garage air in the San
  Gabriel Valley summer. Compressor overheats, temps climb, food goes bad fast.

  Garage freezers in Covina take more abuse than almost anywhere else in LA County.
  No shade, concrete floors absorbing heat, afternoon temps pushing past 105°F on
  an average July day — it's a brutal environment for a refrigeration compressor
  that was designed for a climate-controlled kitchen.

localContext: |
  Zip code 91722 is mostly post-war residential — rows of 1950s and 1960s
  single-family homes where a second freezer in the garage or back porch is
  practically standard. Over in 91724 toward the Covina Hills area, you get
  1980s construction, which means units pushing 40 years now.

  Hard water runs through the whole SGV corridor. Mineral scale inside ice maker
  assemblies and water inlet valves shows up in both zip codes — the 1958 ranch
  on East Workman and the 1987 split-level up near the hills deal with the same
  calcium buildup. It's a water source issue, not a house age issue.

  The stretch along Citrus Avenue toward the Puente Hills has a mix of 1970s
  apartment complexes with smaller galley kitchens and compact GE and Frigidaire
  refrigerators that double as the household's only freezer. Different failure
  patterns than the garage chest freezers — but the ambient heat factor is
  always there, pushing every unit harder than it would run anywhere near the coast.

commonProblems:
  - title: "Compressor Burnout from Sustained Ambient Heat"
    description: |
      A garage in zip 91722 regularly hits 100–105°F by mid-afternoon in July.
      Older Kenmore and GE chest freezers weren't rated for that kind of sustained
      ambient load. The compressor windings overheat, the thermal overload trips,
      and eventually the unit won't start at all.

      Sometimes it's a start capacitor — a $40 part that's worth replacing before
      condemning the whole unit. Sometimes it's the full compressor, which changes
      the math entirely on an older chest freezer. Either way, it's not a
      wait-and-see situation. The food safety clock starts the moment temps rise
      above 0°F, and a Covina garage in summer gives you very little margin.

  - title: "Frost-Locked Evaporator Coil"
    description: |
      Solid frost buildup on the evaporator coil usually means the defrost heater
      or defrost timer has quit. Samsung and LG upright freezers are especially
      prone to this — the coil ices over completely, airflow dies, and the
      temperature floats up into the mid-20s even with the unit running constantly.

      Most owners notice it as "running all day but nothing's actually frozen."

      On Samsung models, error codes 1E or 14E often show up alongside the
      symptom — the temperature sensor reads an anomaly once the coil is fully
      blocked. LG throws an Er FF code when the evaporator fan motor gets choked
      by the ice. Either code means the defrost system has been failing quietly
      for weeks before it became obvious.

  - title: "Door Gasket Cracking in Dry SGV Heat"
    description: |
      Covina's low humidity dries out rubber door seals faster than coastal cities.
      Once the gasket on a KitchenAid or Whirlpool upright warps or cracks, warm
      air bleeds in nonstop. The compressor overcycles trying to compensate.

      Your electricity bill spikes before food quality even drops — so check the
      seal if your unit sounds like it never shuts off. A dollar-bill test tells
      you in ten seconds: close the door on a bill and pull it out. Slides with no
      resistance? The gasket is done. Replacement on most uprights runs $80–$120
      in parts and labor.

faq:
  - q: "How fast can you get to Covina for freezer repair?"
    a: |
      We run SGV routes daily — Covina is typically 30 to 45 minutes from our
      nearest tech. Call (323) 870-4790 before noon and we can usually have
      someone out same day. Evening slots available Tuesday through Saturday.

      If it's a food emergency — temps above 0°F and the unit won't recover —
      say that when you call. Those calls get prioritized.

  - q: "Do you repair Samsung and LG freezers in the Covina area?"
    a: |
      Yes — Samsung and LG make up a big share of our SGV calls. Samsung
      French-door bottom freezers with ice maker assembly failures, LG uprights
      with control board faults and evaporator coil icing. We stock common
      parts for both and usually fix in one visit.

      The LG French-door bottom freezer drawer is another one we see constantly
      around Covina — the plastic rail guides crack over time, especially in hot
      garages. The drawer stops sealing flush and the unit runs nonstop. Fast fix,
      but easy to misdiagnose as a compressor problem if you're not looking
      for it.

  - q: "What does freezer repair typically cost, and how does the process work?"
    a: |
      We diagnose on-site — usually locked down within 20 minutes. A defrost
      heater swap or door gasket replacement typically runs $120–$200. A
      compressor job on a standalone unit is $250–$450 depending on the model.

      On older chest freezers where the compressor has fully burned out, we'll
      tell you straight if the repair cost doesn't make sense against what a
      replacement unit would run. No point putting $400 into a 25-year-old
      Kenmore that'll overheat again next July.

      Same-day emergency service available. Schedule at (323) 870-4790 or book
      online and we'll confirm within the hour.
title: "Covina Dishwasher Repair — SGV Hard Water Killing Your Machine"

intro: |
  The San Gabriel Valley Municipal Water District delivers some of the hardest tap
  water in the LA basin — and in 91722, that mineral load hits dishwasher internals
  fast. Spray arms clog. Float switches stick. A Bosch 500 Series that worked
  perfectly in Portland will calcify inside a year here. Charter Oak homeowners
  deal with this constantly. Call us at (323) 870-4790 and we can usually be there
  the same day.

localContext: |
  Citrus Avenue and the side streets off Badillo are lined with 1950s and 1960s
  tract homes — standard 24-inch under-counter dishwasher cavities, often tight
  fits when the kitchen hasn't been remodeled. Zip code 91723 has a high density
  of these mid-century builds where the supply line runs through original copper
  plumbing. That older pipe deposits mineral sediment directly into the water inlet
  valve, accelerating failure on newer Samsung and LG units that aren't built for
  it.

commonProblems:
  - title: "Spray Arm and Filter Blockage From SGV Mineral Buildup"
    description: "Calcium deposits from Covina tap water pack into the spray arm ports
      and the mesh filter basket until water pressure drops to almost nothing. Dishes
      come out gritty or still dirty on the bottom rack. On KitchenAid units this
      often triggers a clean light that won't reset — the float switch reads standing
      water because the drain cycle can't finish through the clogged filter assembly."

  - title: "Drain Pump Failure in Older Covina Kitchens"
    description: "Samsung french-door combos paired with matching dishwashers are common
      in the 91724 zip — and when the drain pump goes, you get the 5C or OE error
      code with an inch of standing water at the bottom. The pump impeller seizes up
      from debris or the motor windings burn out. We carry pump assemblies for
      Samsung and LG on the van so it's usually a same-visit fix."

  - title: "Door Latch Assembly and Detergent Dispenser Stuck Shut"
    description: "Whirlpool and GE units in these older Covina homes sometimes have door
      latch assemblies that crack or warp — the door doesn't seal fully, so the
      control board won't start the cycle at all. Separately, the detergent dispenser
      spring mechanism corrodes and stops releasing mid-cycle. Both failures look
      like 'the dishwasher just stopped working' but they're different parts with
      different fixes."

faq:
  - q: "How fast can you get to Covina for dishwasher repair?"
    a: "We run routes through the San Gabriel Valley daily — from the 10 freeway
      corridor we can typically reach Covina addresses in 91722 or 91723 within 2
      hours of your call. Evening slots available most weekdays. Call (323) 870-4790
      or schedule online to lock in same-day service."

  - q: "Do you work on Bosch and KitchenAid dishwashers in this area?"
    a: "Both are common in Covina kitchen remodels. Bosch 300 and 500 Series units
      frequently need drain pump replacements and spray arm cleaning here due to
      hard water. KitchenAid jobs usually involve control board resets or heating
      element failures. We stock parts for both brands on the van."

  - q: "What does a dishwasher repair typically cost in Covina, and do you charge
      for the diagnosis?"
    a: "Diagnostic visit is $65, credited toward the repair if you proceed. Most
      jobs — drain pump swap, inlet valve replacement, door latch fix — run
      $150–$280 parts and labor combined. If we can't source the part same-day,
      we'll tell you upfront rather than leave you waiting. Emergency slots available
      for units with active leaks."

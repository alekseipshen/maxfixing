title: "Covina Refrigerator Repair — Hard Water Kills Ice Makers Here"

intro: |
  The 91722 zip gets some of the hardest municipal water in the San Gabriel
  Valley — calcium deposits clog water inlet valves and ice maker assemblies
  faster than most homeowners expect. Got a call last month from a family off
  Barranca Avenue whose Samsung french-door unit had stopped making ice entirely;
  the inlet valve screen was nearly solid white with mineral scale. Middle Covina
  neighborhoods also run a lot of 1960s-era cabinetry — tight fits that make
  pulling a refrigerator for service a two-person job.

localContext: |
  Most of the housing stock along Cypress Street and Charter Oak Avenue dates
  from the late 1950s through the mid-1970s — ranch layouts with narrower kitchen
  configurations than newer builds. Freestanding GE and Whirlpool units have been
  running in these homes for a decade or more. Up in the 91724 zip near the
  Covina Hills side, you find newer construction with LG and KitchenAid
  counter-depth models set into updated kitchens — different clearance issues,
  different failure patterns.

commonProblems:
  - title: "Scale buildup shuts down ice makers — a Covina-specific headache"
    description: "Covina water tests consistently high for calcium and magnesium. That
      mineral load accumulates inside the water inlet valve until flow drops to near
      zero — the ice maker gets the signal it should fill but can't. Samsung TwinCool
      and LG french-door models see this most often. A thorough descale or valve
      swap fixes it same day in most cases."
  - title: "Compressor running hot during San Gabriel Valley summers"
    description: "Ambient temps in the 100s stress any refrigerator, but a condenser
      coil coated in dust and pet hair makes it worse. GE and Whirlpool top-freezer
      units from the early 2000s are especially prone — the condenser fan slows, the
      compressor overworks, and the fridge compartment starts creeping above 40°F.
      Coil cleaning fixes it sometimes; a failing compressor is a bigger call."
  - title: "Frost packed on the evaporator coil — usually not the defrost timer"
    description: "Older Whirlpool and Maytag side-by-side units throughout the Charter
      Oak corridor frequently show heavy frost on the evaporator coil. Homeowners
      blame the defrost timer, but more often it's a warped door gasket letting
      humid air leak in. Moisture hits the coil, freezes solid, airflow collapses,
      and the fresh-food section warms up while the freezer looks completely normal."

faq:
  - q: "How fast can you get to Covina for refrigerator repair?"
    a: "Usually within 2 hours. We run the San Gabriel Valley corridor daily — Citrus
      Ave to Azusa Ave is a straight shot on the 210. Call (323) 870-4790 and we
      lock in a same-day window right on the call. Evening slots available too."
  - q: "Do you repair Samsung and LG refrigerators in Covina?"
    a: "Both are common in the 91722 and 91723 zips. Samsung french-door models often
      throw a 5E or SE error code tied to ice maker and drain issues. LG units
      frequently need a new evaporator fan motor or drain pump. Parts in stock for
      both — no waiting on special orders in most cases."
  - q: "What does refrigerator repair run in Covina, and is there a diagnostic fee?"
    a: "Diagnostic fee applies and goes toward the repair if you move forward. Most
      jobs fall between $150 and $350 depending on the part. Same-day service is
      standard — if food is at risk, call (323) 870-4790 now and we treat it as
      emergency priority."

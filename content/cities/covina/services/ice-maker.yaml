      up in a single visit because the failure patterns in San Gabriel Valley hard-water
      conditions are predictable once you've seen a few hundred of them.
  - q: "What does ice maker repair usually cost in Covina?"
    a: >
      Diagnostic visit is $65, applied to the repair if you proceed. Most fixes —
      fill valve swap, module replacement, water line reroute — land between $130
      and $260 parts and labor combined. A full ice maker assembly replacement on a
      KitchenAid or GE side-by-side runs toward the higher end of that range.
      Emergency same-day service is available. Schedule online or call (323) 870-4790
      for evening slots.
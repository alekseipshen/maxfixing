title: "Covina Ice Maker Repair — Fast Fix in San Gabriel Valley"

intro: |
  Triple-digit summers in Covina mean that ice maker runs constantly from June through
  September — and that's exactly when it decides to quit. That KitchenAid or GE
  french-door fridge that worked fine all winter starts showing an empty bin by July.
  The Charter Oak neighborhood sees a lot of this. City of Covina water tests around
  280–320 ppm hardness, and that mineral load does real damage to the water inlet valve
  over 18–24 months of regular cycling.

localContext: |
  Most of the housing stock in 91722 dates to the 1950s and 1960s — ranch-style homes
  with kitchens that weren't designed for today's counter-depth refrigerators. Tight
  clearance behind the fridge means water lines get kinked or pinched against the wall.
  Over in the 91724 zip, newer subdivisions near The Vineyards have more LG and Samsung
  bottom-freezer models installed, but the same hard-water problem hits them just as hard.

commonProblems:
  - title: "Mineral Buildup Choking the Water Inlet Valve"
    description: >
      Covina tap water at 300 ppm deposits calcium scale inside the water inlet valve's
      solenoid screens within two years of regular use. The valve doesn't fail all at
      once — it restricts flow first, so you get small or hollow ice cubes before
      production stops entirely. Samsung and LG french-door models show this pattern
      constantly in the 91722 zip. On Samsung units, the display sometimes throws a
      "Check Water Supply" alert before production stops completely — homeowners assume
      the shutoff valve is closed, but it's the inlet screen coated solid with scale.
      Replacing the valve clears it, but flushing the supply line and inspecting the
      saddle valve at the wall matters too. Skip that step and the same problem returns
      in six months.
  - title: "Frozen Water Line Blocking the Fill Cycle"
    description: >
      Push a fridge too tight against a cabinet wall in one of these 1960s ranch
      kitchens and the water supply tube behind it can freeze solid — especially if
      the freezer runs below 0°F. Whirlpool and KitchenAid side-by-sides are prone
      to this when the water line runs through the freezer door hinge path. A frozen
      line looks identical to a dead fill valve until you actually trace it back.
      Easy fix, but you have to find it first. The repair means pulling the unit
      out, thawing the line with a heat gun, and rerouting the tube so it clears
      the hinge bracket — roughly 45 minutes total, most of that spent maneuvering
      the fridge out of a tight Covina kitchen with laminate floors.
  - title: "Ice Maker Module Stops Triggering the Harvest Cycle"
    description: >
      The ice maker assembly — the module that controls the freeze-and-eject sequence —
      has an internal harvest thermostat that loses calibration on older GE and
      Whirlpool top-freezer units. The freezer stays cold, the water supply is fine,
      but the module never sends the signal to fill the ice mold. Usually shows up
      on units 8–10 years old. You can confirm it by manually advancing the module
      with a flat-blade screwdriver on the test notch — if the ejector arm doesn't
      rotate through the cycle, the module is done. A new ice maker module runs
      $60–$100 in parts and takes about 30 minutes to swap out.


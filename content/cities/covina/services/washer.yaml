title: "Covina Washer Repair — Hard Water & Older Homes Fixed Fast"

intro: |
  Citrus Avenue and the surrounding blocks off San Bernardino Road are packed
  with 1950s and 60s ranch homes — solid houses, but the plumbing and
  appliances take a beating from SGV hard water. A Samsung front-loader
  throwing an ND error code or a Whirlpool top-load that quit mid-cycle are
  calls we get constantly out here. We run service routes through Covina daily
  and can usually be at your door the same day.

localContext: |
  Most of Covina's housing stock in the 91722 and 91724 zip codes was built
  between 1945 and 1975. Laundry rooms in these homes are tight — often
  converted garages or closet-size utility rooms with minimal clearance behind
  the machine. That matters when we're pulling a washer out to reach the drain
  pump or shock absorbers. Newer townhome developments near Covina Hills have
  stacked units, which adds another layer of complexity to any repair job.

commonProblems:
  - title: "Mineral Buildup Killing the Water Inlet Valve"
    description: "SGV tap water runs hard — Covina water tests consistently above 250 ppm.
      Over time, calcium scale clogs the water inlet valve screens and restricts
      flow. Your LG or GE top-loader starts filling slowly, then not at all.
      Replacing the valve is straightforward, but if buildup has already reached
      the control board, that's a different conversation. We check both on every
      call."
  - title: "Drain Pump Failures in Heavy-Use Households"
    description: "A washer that won't drain is almost always the drain pump — either a
      blocked impeller or a burned-out motor. Whirlpool and Maytag front-loaders
      in Covina see this regularly because lint and debris collect fast in
      households running 8-10 loads a week. Left too long, the standing water
      triggers mold inside the drum. Catch it early and it's a cheap fix."
  - title: "Drum Bearing Wear in Older Samsung Units"
    description: "That grinding noise during the spin cycle on a Samsung WF45 series?
      Usually the drum bearing. It's common after 5-7 years, especially when
      the machine lives in a hot garage — and a lot of Covina homes converted
      their garages into laundry rooms. A failed drum bearing eventually takes
      the spin basket shaft with it, so don't ignore it."

faq:

title: "Covina Dryer Repair — Ranch Homes, Blocked Vents, Real Fixes"

intro: |
  Post-war ranch houses off Badillo Street and along Grand Avenue make up a big chunk of 91722
  — built between 1950 and 1970, with laundry setups that were clearly tacked on as an
  afterthought. That LG or Whirlpool stuffed into a converted garage corner has been pushing
  hot air through a kinked flex duct for decades. Covina summers regularly hit triple digits,
  so the dryer runs harder than the manufacturer ever intended.

localContext: |
  Covina's 91722 and 91724 zip codes run heavy on single-family homes from the postwar suburban
  boom — garages retrofitted into laundry rooms, original gas lines still in daily use, utility
  closets sized for machines that no longer exist. Exhaust vents in these older homes often
  travel longer-than-code paths through interior walls before exiting. Lint accumulation inside
  those original 4-inch ducts is the single most common reason dryers fail early in this area.

commonProblems:
  - title: "Thermal Fuse Failures Caused by Restricted Exhaust Venting"
    description: "Long duct runs through Covina's older ranch-style walls trap lint fast — especially in
      units pushed back against the wall with zero clearance. Once airflow drops enough, the
      thermal fuse blows as a safety cutoff and the dryer stops heating entirely. Replacing the
      fuse without clearing the full vent path just means it blows again in a month. Whirlpool
      and GE models with electric heating elements are especially prone to this cycle."
  - title: "Drum Stops Spinning — Drive Belt and Drum Roller Wear"
    description: "Dryers running in unconditioned garages age faster than indoor units. A loud snap
      followed by a drum that won't turn almost always points to a broken drive belt or failed
      drum roller. Samsung front-load dryers in the 91723 zip code show this pattern around the
      7-to-9-year mark. Belt tensioner wear usually follows within a few months, so both get
      checked on the same visit."
  - title: "Gas Dryer Won't Stay Lit — Igniter Assembly Breakdown"
    description: "Triple-digit San Gabriel Valley heat stresses gas appliance parts faster than
      manufacturers account for. On older Maytag and Kenmore gas dryers, the gas valve igniter
      glows but doesn't stay on long enough to open the valve solenoid — the burner sparks,
      flickers, then dies. Clothes come out warm but damp after a full cycle. Igniter
      replacement usually resolves it the same day."

faq:

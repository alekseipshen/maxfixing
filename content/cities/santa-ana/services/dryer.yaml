commonProblems:
  - title: "Thermal Fuse Burnout From Continuous Use"
    description: "Run a dryer hard enough — back-to-back loads, poor ventilation, lint screen ignored — and the thermal fuse blows to prevent a fire. On Whirlpool WED5000DW units, this is the number one call we get in Santa Ana. The drum still spins, but there's zero heat. Replacing the fuse is cheap; ignoring the underlying vent blockage means it blows again in three months."
  - title: "Lint Buildup Choking the Exhaust Vent"
    description: "Santa Ana's older homes often have 90-degree vent runs through the wall — sometimes 12 feet of flex duct before air hits outside. Lint accumulates fast in those bends. The blower wheel pushes air, but restricted flow causes the moisture sensor to misread dryness levels, so clothes come out damp after a full cycle. Samsung and LG both log error codes (dE, dF) when airflow drops below threshold."
  - title: "Drum Roller Wear on Gas Dryers"
    description: "That grinding, squealing noise mid-cycle is almost always drum rollers or a worn belt tensioner, not something catastrophic. GE gas dryers from the early 2010s — common in 92701 rentals — show this pattern around the 8-10 year mark. The drum roller bearings flatten, the drum wobbles, and the noise starts quiet then gets worse every week. Parts are under $40; labor takes about an hour."


title: "Santa Ana Refrigerator — Built for OC Heat, Not Against It"

intro: |
  Summer ambient temps in Santa Ana kitchens routinely hit 85°F — and that's before you open
  the oven. The Samsung french-door units in Logan neighborhood homes run their compressors
  harder here than the same model would in San Diego. Floral Park bungalows from the 1940s
  weren't built with modern refrigerator heat loads in mind. MaxFixing covers Santa Ana
  daily — call (323) 870-4790 and we're usually there within 2 hours.

localContext: |
  Most of the housing stock in 92703 and 92704 is 1950s-70s — tract homes with tight
  kitchen layouts, galley-style spaces where a full-depth fridge barely fits. Older
  construction means less ventilation around the condenser coils, which accelerates
  wear on fans and compressors. The Floral Park historic district has larger kitchens,
  but owners there tend to run KitchenAid and Bosch counter-depth models that require
  specific tools to service properly.

commonProblems:
  - title: "Compressor Overload from OC Summer Heat"
    description: "Santa Ana doesn't cool down much at night in July and August. A refrigerator
      compressor cycling nonstop in a warm kitchen wears out faster — you'll hear it running
      constantly, then the cabinet temp drifts to 50°F or higher. On older LG bottom-freezer
      units, the linear compressor is the first thing to go. That's a major repair, not a
      tune-up."
  - title: "Ice Maker Failure from Hard Water Mineral Buildup"
    description: "Orange County tap water carries significant calcium and magnesium load. Over
      time, mineral deposits clog the water inlet valve and coat the ice maker assembly —
      ice production slows, then stops entirely. GE and Whirlpool side-by-side models in
      92701 show this pattern constantly. The inlet valve screen blocks before most homeowners
      notice anything's wrong."
  - title: "Evaporator Coil Ice Buildup Causing Warm Freezer"
    description: "Freezer feels cold but fridge section climbs to 45°F or warmer? Likely a
      failed defrost timer or a defrost heater that stopped firing. Ice accumulates on the
      evaporator coil until airflow is blocked completely. Samsung four-door models see
      this more than most — the defrost cycle runs on a board-controlled interval that
      glitches after a few years in high-ambient environments like Santa Ana summers."


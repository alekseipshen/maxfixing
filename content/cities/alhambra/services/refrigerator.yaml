title: "Alhambra Refrigerator Repair — Hard Water, Old Bungalows, Fast Fix"

intro: |
  Hard water readings in Alhambra regularly hit 350+ ppm — some of the worst
  mineral buildup we see across the San Gabriel Valley. That calcium scale
  clogs the water inlet valve and ice maker assembly on Samsung and LG
  french-door models faster than owners expect, usually within 3-4 years.
  Around Almansor Park, where 1950s bungalows pack tight lots with narrow
  side-yard access, getting a refrigerator out for diagnosis is its own job.

localContext: |
  Most of the housing stock in 91803 dates to the postwar era — compact
  kitchens, shallow cabinet alcoves, and refrigerators shoved hard against
  walls that block condenser airflow. Valley Boulevard and its surrounding
  residential blocks have a mix of original-owner units running ancient
  Whirlpools alongside newer Samsung and LG models bought at the H Mart
  plaza nearby. Zip 91801 trends slightly newer construction, but the
  water quality problem doesn't change by block.

commonProblems:
  - title: "Mineral Scale Killing Ice Makers in 91803"
    description: "Alhambra tap water deposits calcium directly into the ice maker
      assembly — specifically onto the water inlet valve screen and the fill
      tube. The ice maker stops producing, or produces hollow cubes before
      quitting entirely. Samsung ice maker modules are especially sensitive;
      we replace the inlet valve and flush the line more often here than
      anywhere else in SGV."
  - title: "Condenser Fan Failure from Blocked Rear Clearance"
    description: "These older kitchen layouts leave maybe 2 inches behind the unit.
      The condenser fan motor overheats trying to pull air that isn't there.
      GE and Whirlpool top-freezer models from the 2000s show this pattern
      constantly — the fridge stops cooling, you hear the compressor cycling
      on and off every few minutes. Moving the unit out and cleaning the
      condenser coil sometimes buys another year; a failed fan motor needs
      replacing."
  - title: "Evaporator Coil Ice Buildup in Older LG Units"
    description: "LG french-door refrigerators from 2014-2018 have a known defrost
      timer calibration issue — the evaporator coil ices over completely,
      blocking airflow to the fresh-food section while the freezer stays cold.
      Homeowners notice warm shelves but assume the compressor is failing.
      Usually it's a defrost heater or thermistor swap, not a full compressor
      job, which costs a lot less."

faq:
  - q: "How fast can you get to Alhambra for refrigerator repair?"
    a: "We run routes through the 10 and 710 corridors daily — Alhambra is
      typically a 45-minute call from our dispatch point. Same-day slots
      available most weekdays. Call (323) 870-4790 and we'll give you a
      2-hour arrival window."
  - q: "Do you repair Samsung and LG refrigerators in Alhambra?"
    a: "Both are the bulk of what we see here. Samsung french-door ice maker
      failures, LG linear compressor noise, LG evaporator freeze-up — all
      routine. We also carry Whirlpool and GE parts on the van for the older
      units common in this area."
  - q: "What does a refrigerator repair visit actually cost in Alhambra?"
    a: "Diagnostic fee is $75, applied to the repair if you proceed. Most
      jobs — inlet valve swap, fan motor, defrost component — run $150-$280
      parts and labor. Compressor replacements are higher. Evening slots
      available Tuesday and Thursday if daytime doesn't work. Schedule at
      (323) 870-4790."

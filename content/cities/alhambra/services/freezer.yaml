  - q: "Do you repair Samsung and LG freezers in Alhambra?"
    a: >
      Yes — Samsung uprights with ice maker assembly failures and LG models
      with control board or compressor issues are among our most common SGV
      calls. We also handle Whirlpool, GE, and KitchenAid. Have the model
      number ready and we can often pre-order the part before arriving.

  - q: "What does a freezer repair call cost, and is same-day service available?"
    a: >
      Diagnostic is $75–$95, applied to the repair if you move forward.
      Same-day appointments are available most weekdays — call (323) 870-4790
      before noon and we can typically be there the same evening. Weekend
      emergency slots too, no extra trip fee for Alhambra.

  - q: "Is hard water really causing my freezer problems?"
    a: >
      In the SGV — yes, more often than people expect. Alhambra's tap water
      comes out of the San Gabriel Basin at hardness levels that leave visible
      scale inside ice maker assemblies within two to three years of regular
      use. The water inlet valve screens clog first, then the ice mold heater
      starts misfiring because calcium bridges form across the contacts.
      Bosch counter-depth models are particularly sensitive to this because
      the ice maker is tightly packaged and hard to access for cleaning.
      Schedule a same-day appointment and we'll check the inlet valve and
      drain line while we're diagnosing the main issue — no extra charge.
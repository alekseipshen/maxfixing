title: "Alhambra Freezer Repair — SGV Hard Water & Summer Heat"

intro: |
  Hard water from the San Gabriel Basin quietly destroys ice maker assemblies
  and evaporator coils — most homeowners in Alhambra don't notice until the
  freezer stops holding 0°F. That GE upright running in a 91803 garage since
  2008 has mineral scale caked inside the drain line right now. Around
  Almansor Park, summer service calls spike every June: compressors running
  constantly, temps drifting up to 18°F, food starting to soften.

  Mineral deposits accelerate every failure mode. The drain pan fills with
  chalky buildup, the evaporator coil frosts unevenly, and the defrost timer
  starts misfiring — all from water the city delivers at 300+ mg/L hardness.
  Alhambra sits in one of the harder water zones in the SGV, and that matters
  a lot if you've had the same freezer for more than five years.

localContext: |
  Most of Alhambra's residential blocks — 91801 and 91802 especially — are
  1940s and 1950s California bungalows with small kitchens and detached
  garages. Chest freezers and standalone uprights almost always end up in
  those garages, sitting through 95–100°F summers with zero insulation.
  Post-war construction also means aging electrical panels that create voltage
  swings, which burn out control boards on newer Samsung and LG units faster
  than the units were built to handle.

  The stretch along Valley Boulevard near Atlantic Boulevard sees denser
  housing — older apartment stock, shared laundry areas, and kitchens where
  a full-size freezer was never really planned for. Compact units get squeezed
  into tight corners with almost no clearance behind the condenser coil.
  Blocked airflow is the number-one reason those models run hot and cycle into
  thermal cutoff by August. Parking a service van on those narrower residential
  streets takes coordination, but we've been running this area long enough to
  know which blocks have alleys and which ones don't.

commonProblems:
  - title: "Compressor Overload From Garage Heat in 91801"
    description: >
      A freezer parked in an uninsulated garage hits thermal limits fast once
      outdoor temps climb past 90°F. The condenser fan can't pull enough heat
      away, so the compressor runs nonstop and temps drift to 15–20°F instead
      of 0°F. Samsung french-door models with rear-mounted condensers are
      especially vulnerable — dust and garage grime clog that coil within a
      season, cutting airflow by half. Left too long, the compressor start relay
      burns out and the unit won't restart at all. At that stage you're looking
      at a relay swap plus a full coil cleaning, not just a service call — catch
      it early when the freezer is still running but temps are climbing.

  - title: "Frost Buildup That Keeps Coming Back"
    description: >
      Persistent frost walls on the interior almost always point to a failed
      defrost heater or defrost timer, not the thermostat most people assume.
      Whirlpool uprights from the early-to-mid 2000s show this repeatedly —
      the defrost cycle stops firing, the evaporator coil ices over completely,
      and airflow chokes off. The repair is usually a $35–$50 heater element,
      not a full replacement. LG inverter-compressor models throw an Er FF error
      code when the fan is blocked by ice — that's your signal the defrost
      system has already been failing for days. Manually defrosting buys time,
      but the heater element still needs replacing or it comes back in two weeks.

  - title: "Door Gasket Failure Causing Temperature Swings"
    description: >
      Rubber door gaskets on older GE chest freezers crack and pull away from
      the frame after years of compression in the same spot. Warm air gets in,
      the compressor compensates by running almost continuously, and eventually
      the start relay burns out. Test it yourself — close the door on a dollar
      bill and try to slide it free. If there's no resistance, the gasket is gone.
      KitchenAid uprights from the mid-2010s have a similar issue: the magnetic
      strip inside the gasket loses strength before the rubber itself cracks, so
      the door looks fine but seals poorly. A replacement gasket on those runs
      $40–$70 in parts and takes about 30 minutes on-site.


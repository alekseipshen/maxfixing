title: "Alhambra Dishwasher — SGV Hard Water & Same-Day Repair"

intro: |
  Valley Boulevard corridor in the 91803 zip runs through some of the densest housing in Alhambra — tract homes and apartment buildings from the 1960s and 70s, many already on their second or third dishwasher. San Gabriel Valley tap water clocks around 250–300 ppm total dissolved solids, and that mineral load is brutal on spray arm nozzles and float switches. That Bosch 300-series sitting under your granite counter? The spray arm ports clog faster here than the manufacturer's specs ever anticipated.

localContext: |
  Post-WWII bungalows near Almansor Park and along Fremont Avenue (91801) run tight under-counter spaces — not all of them standard-depth. Apartment buildings along Atlantic Boulevard still hide compact 18-inch units in galley kitchens. Those smaller machines, often older Frigidaire or GE models, have drain pump access that requires pulling the lower rack assembly completely before a technician can even see the filter housing.

commonProblems:
  - title: "Spray Arm Calcification from SGV Hard Water"
    description: "Alhambra's 250–300 ppm water turns spray arm nozzles into chalky stubs inside 18 months of daily use. On Samsung and LG units, the upper spray arm feeds from a tower connection — once that calcifies, the top rack comes out gritty every cycle. A thorough descale clears it, but a cracked spray arm from mineral pressure needs full replacement."
  - title: "Drain Pump Failure in Older SGV Homes"
    description: "Standing water after a cycle almost always points to the drain pump or a blocked filter. Whirlpool and KitchenAid units from the early 2000s show up constantly in the 91801 and 91802 zips with worn pump impellers — food debris plus hard water deposits grind the impeller down over time. The F8 E1 or 'Sud' error code on newer Whirlpool models is a reliable diagnostic flag."
  - title: "Door Latch Assembly Wear on High-Cycle Apartment Units"
    description: "Buildings along Valley Blvd run dishwashers hard — two or three loads a day is common. Bosch and GE door latch assemblies degrade faster under that workload. A failed latch trips the door switch and kills the wash cycle mid-run. It is a low-cost part, but reaching the latch bracket means pulling the entire inner door panel."

faq:
  - q: "How fast can you get to Alhambra for dishwasher repair?"
    a: "From the 10 or Huntington Drive, Alhambra is a 20–30 minute run for our closest tech. Same-day slots are available most days — call (323) 870-4790 or schedule online and we'll confirm a two-hour arrival window."
  - q: "Do you repair Bosch and Samsung dishwashers in Alhambra?"
    a: "Both are the most common calls in the SGV. Bosch E24 drain errors, Samsung heavy-cycle error codes, KitchenAid detergent dispenser failures — all standard repairs. Common parts for these brands ride on the van."
  - q: "What does a dishwasher repair cost in Alhambra, and how does the process work?"
    a: "Most repairs run $120–$280 depending on the part needed. We diagnose on arrival, quote before touching anything, and carry components for same-day fixes. Evening slots available — call (323) 870-4790 if it cannot wait."

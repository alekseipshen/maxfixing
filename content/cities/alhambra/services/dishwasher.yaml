title: "Alhambra Dishwasher — Hard Water Kills More Than It Cleans"

intro: |
  Hard water in Alhambra's 91801 zip routinely tests above 350 ppm — among
  the worst in the SGV — and dishwashers absorb the full punishment. That
  calcium scale coats the spray arm first, then works into the heating element,
  until your Samsung or Bosch is leaving a white film on every glass. The unit
  doesn't fail dramatically. It just gets worse, load by load, until nothing
  is actually clean.

localContext: |
  Most of the residential blocks around Almansor Park and east toward Garfield
  Avenue were built between 1945 and 1965. Bungalows and post-war ranches with
  kitchens tight enough that pulling a dishwasher for parts access sometimes
  means moving cabinetry first. In the 91803 zip especially, older copper
  supply lines and corroded shutoff valves mean we often find water inlet valve
  failures tied to plumbing age — not anything wrong with the appliance itself.

commonProblems:
  - title: "Calcium-Choked Spray Arms From SGV Hard Water"
    description: "At 350+ ppm, Alhambra tap water deposits calcium inside the
      spray arm ports faster than most owners realize. A Bosch Series 500 that
      cleaned perfectly at purchase starts leaving grit on the bottom rack
      within a year — sometimes triggering E24 error codes as the blockage
      worsens. The fix is spray arm replacement combined with descaling the
      heating element, not just running a cleaning cycle."

  - title: "Standing Water After Cycles in Older Kitchens"
    description: "Standing water at the bottom of the tub almost always points
      to a failing drain pump or a kinked drain hose. In the 91801 area, older
      kitchen configurations sometimes route the hose at an angle that
      encourages backflow — especially in homes where the dishwasher was
      retrofitted into cabinet space not originally built for one. GE and
      Whirlpool units from the 2010–2016 range hit drain pump failure most
      often around the 8–10 year mark."

  - title: "Detergent Dispenser Stuck Shut — LG and KitchenAid Units"
    description: "A dispenser that won't open mid-cycle is usually a failed
      wax motor inside the dispenser assembly, not a software issue. On LG and
      KitchenAid models, this frequently shows up alongside OE or LE error
      codes. Door latch failures appear separately, typically on machines
      that got jostled during delivery into one of Alhambra's tight older
      kitchens — and a bad latch means the control board never gets the
      signal to start the cycle."

faq:
  - q: "How fast can you get to Alhambra for dishwasher repair?"
    a: "Most Alhambra calls get same-day service — we run SGV routes daily.
      Valley Boulevard and Atlantic Boulevard are easy access for our vans,
      and parking near residential side streets in the 91803 is usually
      straightforward. Call (323) 870-4790 before noon and we can typically
      be there the same afternoon."

  - q: "Do you repair Samsung and Bosch dishwashers in Alhambra?"
    a: "Yes — Samsung, Bosch, LG, KitchenAid, GE, and Whirlpool are all
      regular work for us across the SGV. On Samsung units the most common
      call is a drain pump failure throwing a 5C error code. Bosch tends to
      fail at the inlet valve or spray arm. Parts for both are stocked, so
      most repairs finish in one visit."

  - q: "What does a dishwasher repair typically cost in Alhambra?"
    a: "Diagnosis is a flat-rate visit fee, credited toward the repair if you
      move forward. Most common fixes — drain pump, detergent dispenser, door
      latch — run $150–$280 parts and labor combined. Evening slots are
      available for urgent situations; call (323) 870-4790 to check
      same-day availability."
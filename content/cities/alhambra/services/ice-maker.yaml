title: "Alhambra Ice Maker Repair — Hard Water Kills Fill Valves Fast"

intro: |
  Valley Boulevard runs right through 91801, and the water coming out of San Gabriel Valley
  Municipal taps consistently tests 250–290 ppm dissolved solids — some of the hardest supply
  in greater LA. That mineral load goes straight into the fill valve and ice maker assembly of
  whatever refrigerator sits in your kitchen. Samsung french-door models in particular start
  showing it within two to three years: cloudy cubes first, then undersized ones, then the
  tray stops cycling entirely. It's predictable chemistry, not bad luck.

localContext: |
  Most of Alhambra's residential blocks — especially around Almansor Park in the 91803 zip —
  were built in the 1950s and 60s. Kitchens in those ranch homes and courtyard apartments weren't
  designed around 36-inch counter-depth units. Pulling a KitchenAid or Whirlpool refrigerator far
  enough to access the water line means navigating narrow galley layouts and, in the older buildings
  along Marguerita Avenue, sometimes no elevator access at all. We've done enough service calls in
  these neighborhoods to know what to expect before we even ring the doorbell.

  Alhambra also has a high concentration of multi-unit buildings along Main Street and Atlantic
  Boulevard. Those properties often run shared supply lines with older brass saddle valves — which
  corrode and restrict flow independently of whatever mineral buildup is happening inside the
  refrigerator itself. Low water pressure at the fridge looks exactly like a bad inlet valve until
  you test at the wall connection first. Swapping parts without that check wastes the landlord's
  money and doesn't fix anything.

commonProblems:
  - title: "Calcium-Clogged Water Inlet Valve From SGV Hard Water"
    description: "At 260–290 ppm, Alhambra tap water deposits calcium carbonate inside the
      water inlet valve faster than most of California. The valve partially restricts, the
      refrigerator gets low water flow, and you end up with hollow or misshapen cubes — or
      none at all. Samsung and GE units with dual-inlet valves are especially prone because
      both ports calcify at different rates, making diagnosis tricky if you're not looking
      for it. We clean or replace the valve, then check the braided supply line and saddle
      valve too — both clog quietly and get overlooked."
  - title: "Frozen Fill Tube Behind the Ice Maker Assembly"
    description: "Summer temperature swings in the San Gabriel Valley — 95°F outside,
      heavily air-conditioned inside — create condensation conditions that can freeze the
      fill tube feeding the tray. LG InstaView models with the door-in-door design see this
      more often because the fill tube routing runs close to an exterior wall panel. The fix
      is straightforward, but a frozen tube that keeps coming back usually points to a defrost
      heater not cycling correctly — visible as frost buildup on the evaporator coil behind
      the freezer wall. The defrost timer needs attention in that case, not just the tube."
  - title: "Ice Level Sensor Failure in Older Units"
    description: "Whirlpool refrigerators from the early 2010s — still common in Alhambra
      rentals — use an optical ice level sensor that fouls with mineral dust over time.
      The unit thinks the bin is full when it's empty, so production stops completely.
      Replacing the sensor is a 45-minute job, but we've seen landlords replace the whole
      refrigerator not knowing that's all it was. No cubes, no error codes, and the
      compressor still running — that pattern in a Whirlpool almost always points here first."

faq:
  - q: "How fast can you get to Alhambra for ice maker repair?"
    a: "Alhambra is a straight shot from our Valley and South Bay coverage routes — we
      typically reach 91801 and 91803 within 2 hours of your call. Same-day slots are
      available most weekdays. Call (323) 870-4790 to check what's open today."
  - q: "Do you repair Samsung and LG ice makers specifically?"
    a: "Yes — Samsung french-door and LG InstaView units make up a big chunk of what
      we see in Alhambra. We carry fill valves, assemblies, and control boards for both
      brands on the van. KitchenAid and Whirlpool top-freezers are equally common here
      and we stock parts for those too."
  - q: "What's the typical cost to fix a broken ice maker in Alhambra?"
    a: "A fill valve or sensor swap usually runs $150–$250 parts and labor. A full
      assembly replacement sits in the $280–$380 range depending on the brand.
      We diagnose on-site, quote before touching anything, and carry most parts for
      same-day completion — no second trip needed for the common failures."
  - q: "My fridge is showing an error code and stopped making ice — is that the control board?"
    a: "Depends on the brand. Samsung units often throw a 39E or 40E code when the motor
      stalls — usually a frozen fill tube or a seized tray, not a failed board. LG shows
      an IE error for inlet valve problems. Before replacing electronics, we run a full
      diagnostic cycle to confirm what's actually failing. Control boards are the last
      thing we replace, not the first — they're expensive, and in Alhambra's hard-water
      conditions the real culprit is almost always mineral-related. Call (323) 870-4790
      and describe the code; we can usually narrow it down before we arrive."
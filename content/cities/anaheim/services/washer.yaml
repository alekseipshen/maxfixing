title: "Anaheim Washer Repair — Hard Water Kills Machines Fast"

intro: |
  Orange County water hardness runs 300-400 ppm in parts of Anaheim — that mineral load
  destroys water inlet valves and drum bearings faster than most homeowners expect. Seen it
  firsthand on Samsung front-loaders in the West Anaheim neighborhoods near Brookhurst Street:
  machine's three years old, looks fine, then the drain pump chokes on calcium buildup and
  suddenly you've got standing water and a flashing error code. We cover all of Anaheim and
  can usually be there the same day.

localContext: |
  A lot of the housing stock in zip codes 92804 and 92801 goes back to the 1960s and early
  70s — tract homes with original laundry closets that weren't built for today's larger-capacity
  machines. Tight clearances make drum bearing replacements trickier; you're working around
  drywall on three sides. West Anaheim apartments near Ball Road often have stacked
  washer-dryer combos, which have their own quirks when the lid switch or control board goes.

commonProblems:
  - title: "Drum Won't Spin — Drive Belt or Shock Absorber Failure in Older Units"
    description: "Most spin failures in Anaheim's 1970s-era homes come down to a worn drive belt
      or failed shock absorbers — both degrade faster when machines are overloaded or sitting
      on uneven concrete floors. LG top-loaders throw an LE error code when the motor overheats
      trying to compensate. Replacing the belt and checking the spin basket alignment usually
      gets it sorted in one visit."

  - title: "Water Not Draining — Mineral-Clogged Drain Pump"
    description: "OC hard water leaves calcium deposits inside the drain pump housing over time.
      Whirlpool front-loaders in the 92805 area are notorious for this — the pump impeller
      jams, the machine stops mid-cycle, and you get the F21 error. Clearing the pump filter
      helps short-term, but a replacement drain pump is the permanent fix once the housing
      starts cracking."

  - title: "Excessive Vibration — Drum Bearing and Leveling Issues"
    description: "A Bosch or Samsung machine that sounds like a helicopter during the spin cycle
      usually has a failing drum bearing or worn shock absorbers. In Anaheim's older slab
      foundations, the washer feet also drift out of level over time, which makes the bearing
      wear worse. Catching it early saves the drum assembly — ignoring it turns a $180 repair
      into a $600 one."

faq:
  - q: "How fast can you get to Anaheim for washer repair?"
    a: "We run service routes through Orange County daily — from the 91 corridor down through
      Anaheim Hills and across to West Anaheim. Most calls in 92801-92808 get same-day service,
      usually within 2 hours of booking. Call (323) 870-4790 to check today's availability."

  - q: "Do you repair Samsung and LG front-load washers?"
    a: "Samsung and LG are probably half our Anaheim calls. Common fixes: door lock assembly
      failures on Samsung (dE error), drain pump replacements on LG (OE code), and control board
      resets on both. Also handle Whirlpool and GE top-loaders regularly — water inlet valve
      and lid switch replacements mostly."

  - q: "What does a washer repair typically cost, and do you do same-day fixes?"
    a: "Diagnosis is $75, applied toward the repair. Most jobs — drain pump, drive belt, water
      inlet valve — run $150-$280 parts and labor. Same-day repair slots are available most
      weekdays; evening appointments until 7pm on request. Book online or call (323) 870-4790
      for emergency service."

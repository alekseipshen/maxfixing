title: "Anaheim Freezer Repair — SoCal Heat Kills Units Fast"

intro: |
  Summer in Anaheim hits different when your freezer starts struggling around July — that 95°F
  stretch forces the compressor to run nearly nonstop on anything sitting in an un-air-conditioned
  garage near the 91 freeway. Had a Whirlpool chest freezer call last season off Brookhurst Street
  where the condenser fan had seized and temps inside climbed to 28°F before the owner noticed.
  Twenty-eight degrees sounds cold until you realize ice cream turns soft at 27°F.

  Anaheim's hard water is a real factor too. The Metropolitan Water District supply running
  through 92804 and 92805 tests around 300–400 ppm hardness — well above the 180 ppm threshold
  where mineral scale starts clogging ice maker fill valves and spray nozzles. Units in homes
  without a softener accumulate scale on the evaporator inlet faster than owners expect, usually
  showing up as a drop in ice production before anything else fails visibly.

localContext: |
  Housing stock in west Anaheim — zip codes 92802 and 92804 especially — dates heavily to the
  1960s and early 1970s, when utility spaces were sized for smaller appliances. Sliding a full-size
  upright freezer into one of those narrow laundry closets off the kitchen takes some maneuvering.

  The contrast with Anaheim Hills (92807) is stark. Up off Weir Canyon Road, you're looking at
  1990s and 2000s construction with deeper garages and dedicated utility rooms — homeowners there
  tend to run a standalone chest freezer alongside the main fridge, often a GE or KitchenAid unit
  bought during a Home Depot sale and now eight-plus years old.

  Over toward the Stadium District around Angel Stadium on Katella Avenue, there's a mix of
  condos and older single-family homes where Samsung and LG french-door units with bottom-freezer
  drawers are common — and those drawer rail assemblies fail more often than the manufacturers admit.
  The resort corridor near Harbor Boulevard adds another wrinkle: short-term rental properties
  in 92802 get appliances worked hard year-round, no seasonal downtime.

commonProblems:
  - title: "Freezer Loses Temperature During Anaheim's Summer Heat"
    description: |
      Garage and utility-room freezers in Anaheim take a beating from June through September.
      When ambient temps push past 90°F, a failing condenser fan motor means the compressor
      can't shed heat fast enough — and food starts softening within hours. Seen this repeatedly
      on GE chest freezers in the 92805 area, especially units older than eight years.

      The compressor relay is usually the first casualty. It overheats trying to compensate,
      and once it fails, the unit stops cycling altogether. On Whirlpool and Maytag uprights,
      the overload protector goes next — pull the lower back panel and you'll often find it
      discolored from heat. Parts are cheap; the diagnosis is the part that takes experience.

  - title: "Frost Wall Building Up on the Evaporator Coil"
    description: |
      Heavy frost coating the back wall almost always points to a failed defrost timer or a
      burned-out defrost heater element. On older Whirlpool and Maytag uprights, the defrost
      thermostat fails separately and trips the whole cycle. Left alone, the ice wall chokes
      airflow completely — the unit runs constantly but reads warm inside.

      Samsung's french-door bottom-freezer models have a specific quirk here: error code 22E
      or 8E on the display usually signals the defrost sensor before the heater itself goes.
      Replacing just the sensor saves the heater and cuts repair cost roughly in half versus
      swapping both components blind.

  - title: "Door Gasket Cracking and Letting Warm Air In"
    description: |
      Anaheim's dry inland air makes door seals crack and lose their magnetic grip faster than
      coastal climates. On Samsung and LG bottom-freezer models, a warped gasket lets warm air
      sneak in overnight — the compressor compensates by running 24/7 until the relay or
      control board burns out. Quick test: try pulling a dollar bill from the closed door edge.
      If it slides out easy, the seal's gone.

faq:
  - q: "How fast can you get to Anaheim for freezer repair?"
    a: |
      Anaheim is on our daily route down the 5 and 91 — same-day service is standard from
      our end. Figure 2 hours or less from when you call. Reach us at (323) 870-4790 and
      we'll lock in a morning or evening slot that works.

  - q: "Do you repair Samsung and LG freezers common in Anaheim?"
    a: |
      Samsung french-door bottom-freezers and LG units are easily 40% of our Anaheim calls.
      Stock drain pump assemblies and control boards for both on the van. GE and Whirlpool
      chest freezers, KitchenAid uprights — covered too. If a unit is throwing an error code
      you don't recognize, call (323) 870-4790 and describe what you're seeing — we can usually
      narrow it down before we even arrive.

  - q: "What does freezer repair cost, and how soon can you come?"
    a: |
      Diagnostic runs $65 and applies toward the repair. Most jobs — compressor relay swap,
      door gasket replacement, defrost heater fix — land between $150 and $280 parts and labor.
      Same-day slots are usually open; evening appointments available most weekdays.
      Emergency calls handled case by case — just say it's urgent when you call.

  - q: "Can you handle freezers in Anaheim Hills or just the west side?"
    a: |
      Both. Anaheim Hills calls in 92807 and 92808 are on the same dispatch as west Anaheim —
      the 91 gets us there without cutting across surface streets. Chest freezers in those
      larger Anaheim Hills garages, standalone uprights in utility rooms, LG and Bosch units
      in newer builds — all fair game. Schedule at (323) 870-4790 and mention the zip code
      so we route the right tech.

title: "Calabasas Refrigerator — Sub-Zero & Built-In Repair, 91302"

intro: |
  The estates off Mulholland Highway and through The Oaks at Calabasas run Sub-Zero built-in columns almost exclusively — panel-ready units tucked behind custom cabinetry that require a 3/8" hex just to pull the door assembly for diagnostics. That detail matters when the compressor starts short-cycling on a 106°F August afternoon.

  Getting the right tech to 91302 fast is a different job than fixing a Whirlpool in a tract house. Sub-Zero's sealed system uses a different refrigerant circuit than the standard domestic stack. The diagnostic sequence is longer, the clearances are tighter, and the parts lead time is real if you don't stock them. We do.

localContext: |
  Calabasas built out hard between the mid-1980s and early 2000s, which means full custom kitchen builds are the norm. Thermador columns, Viking French-doors in secondary kitchens, Bosch counter-depth units in the hillside homes off Park Sorrento.

  Zip 91302 covers most of the residential grid. Zip 91372 picks up the upper estates where service vans navigate private gates before getting to the kitchen — and where the KitchenAid or Miele panel-ready unit in the butler's pantry is sometimes harder to reach than the main kitchen fridge. Both areas bake under the same San Fernando Valley heat that makes every refrigeration system in this corridor work overtime from June through October.

  Mulholland Highway access means a longer drive for some techs, which translates to half-day waits. We run out of Woodland Hills specifically because of how frequently we're called into 91302.

commonProblems:
  - title: "Compressor Overload During San Fernando Valley Heat Spikes"
    description: |
      Calabasas regularly hits 105–108°F from late June through September. A Sub-Zero built-in is engineered for a climate-controlled kitchen, not one absorbing radiant heat from a south-facing wall with no HVAC running.

      Condenser coils choked with dust cut airflow, the compressor starts short-cycling, and internal temps drift above 40°F before the homeowner notices. Sometimes the unit throws an alarm code — Sub-Zero's EC error is one of the first indicators of condenser airflow restriction. A condenser cleaning plus a compressor relay swap usually catches this before full failure. If the compressor itself has seized, that's a harder conversation, but it's one we can have on-site with accurate diagnosis rather than guesswork.

  - title: "Water Inlet Valve Scaling Out at 18 Months — Hard Water Is the Culprit"
    description: |
      Calabasas municipal water tests above 340 ppm total dissolved solids. That mineral load hits the water inlet valve inside Thermador and KitchenAid column refrigerators faster than most techs expect — narrow tolerances, high mineral content, and constant cycling are a bad combination.

      First symptom is hollow ice cubes or half-moons. By the time production stops entirely, the fill tube is usually capped solid too. The fix is straightforward — valve swap and fill tube flush — but catching it early saves a full ice maker assembly replacement. Call (323) 870-4790 before it backs up further.

  - title: "Pooling Water Underfoot — Defrost Drain vs. Blown Door Gasket"
    description: |
      Two separate problems, same symptom.

      A blocked defrost drain tube traps meltwater from the evaporator coil freeze-thaw cycle — it has nowhere to go except the floor. A degraded door gasket lets humid Calabasas air in, causing excess frost buildup that eventually overflows the drain pan. Viking and Bosch built-ins see both failure modes depending on model year. On Viking, the drain tube routing runs closer to the compressor bay and picks up heat differently than on Bosch units, which affects how quickly scale or debris causes a blockage. The fix is completely different for each, so diagnosing which one is actually happening matters before ordering parts.

faq:
  - q: "How fast can you get to Calabasas for refrigerator repair?"
    a: "The 101 puts us in Calabasas from Woodland Hills in about 15 minutes outside of rush hour. Same-day slots are available most days — call (323) 870-4790 before noon and we can usually be there that afternoon. Gated community access is no issue, just add our name at the guardhouse. For active failures where food is at risk, we keep evening slots open specifically for that."

  - q: "Do you repair Sub-Zero and Thermador refrigerators in Calabasas?"
    a: "Those are the two we see most in 91302. Sub-Zero compressor and evaporator coil issues, Thermador column control board faults, Viking ice maker assembly replacements — all part of our regular rotation here. Miele and Wolf units come up occasionally in the newer builds off Lost Hills Road. Common parts for these brands travel on the van, so we're not guessing at availability or making a parts run before we can start."

  - q: "What does refrigerator repair typically cost in Calabasas, and is same-day available?"
    a: "Diagnostic visit is a flat fee applied toward the repair if you proceed. Compressor or control board replacements on premium brands typically run $350–$700 in combined parts and labor — panel-ready Sub-Zero units can run higher if the sealed system needs refrigerant work. Evening slots are available for urgent calls. Same-day and emergency service — phone (323) 870-4790 if the fridge is actively failing and food is at risk."
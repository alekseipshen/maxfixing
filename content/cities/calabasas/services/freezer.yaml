title: "Calabasas Freezer — Built-In Sub-Zero & Column Unit Repairs"

intro: |
  Gated communities like The Oaks and Calabasas Park Estates run their kitchens on Sub-Zero column freezers and Thermador refrigerator-freezer combos — and when those units go down, the HOA gate and coded entry points add a real logistics wrinkle for service vans. We run the 101 corridor every day, so 91302 is a familiar stop. Most calls here involve Sub-Zero F-series column freezers showing temperature drift or ice maker assembly failures that look like compressor problems until you actually check the defrost cycle — an easy misread if you haven't worked built-ins before. Thermador Freedom series units throw their own curveballs: the control board interprets a failing evaporator thermistor as a fan fault, so the unit logs a blower error while the actual problem is upstream. Getting the diagnosis right the first time matters here because ordering panel-specific parts for a Calabasas built-in takes longer than stocking a Whirlpool drum bearing.

localContext: |
  Calabasas's residential stock in 91302 and 91372 is mostly 1985-to-2005 luxury construction — custom-built homes and planned HOA communities with appliance alcoves sized for 30- and 36-inch column freezers. Panel-ready Sub-Zero and Thermador units sit flush with custom cabinetry, which means reaching the condenser coil or evaporator assembly requires pulling drawer fronts and disconnecting integrated panels before diagnostics can even start. Add restricted parking near the Las Virgenes Road corridor and you need a technician who has done this specific work before. Some homes near Lost Hills Road have kitchen layouts where the freezer column shares a cabinet run with a full-height wine column — pulling one unit for service means carefully managing both integrated door panels without scratching the finish. Viking built-ins in these homes often date to the early 2000s, putting them squarely in the compressor endurance window where refrigerant leaks and capacitor failures start showing up alongside routine wear parts.

commonProblems:
  - title: "Evaporator Coil Frost Buildup in Sub-Zero Column Freezers"
    description: "Sub-Zero column units in 91302 throw E24 errors or false 'Door Ajar' alerts that have nothing to do with the actual door. A failed defrost timer lets frost pack the evaporator coil until airflow stops completely — freezer temps climb into the 20s and then the drawer stops holding any temperature at all. Manual defrost plus defrost timer replacement handles it in a single visit. If the coil is blocked badly enough, the defrost heater element also needs inspection — a shorted heater can keep the timer cycling without actually clearing the frost buildup behind the back panel."
  - title: "Condenser Fan Failure During Calabasas Summer Heat"
    description: "August and September push daytime temps in the Valley past 95°F, forcing freezer compressors in older Thermador and Viking built-in units to run almost continuously. The condenser fan motor wears out first — without it, the compressor can't shed heat even though it keeps running. You'll see readings bounce between -5°F and 18°F on the same afternoon, which looks random but tracks directly to that fan failure. On Viking units, a worn fan blade occasionally contacts the shroud before the motor fully seizes — listen for intermittent ticking before the temperature swings start."
  - title: "Door Gasket Failure on Panel-Ready Miele and Bosch Units"
    description: "Panel-ready door gaskets on Miele and Bosch column freezers are model-specific parts — no universal seal compresses correctly against an integrated door panel. Once the magnetic strip loses its grip, warm Calabasas air bleeds in constantly and triggers heavy frost buildup on the back wall. Most Bosch units we service in the 91372 zip are 5-8 years old, right at the typical gasket failure window. A secondary sign is the drain pan underneath filling faster than normal — condensate from warm air intrusion overwhelms the standard evaporation rate and you end up with standing water below the unit."

faq:
  - q: "How fast can you get to Calabasas for a freezer repair?"
    a: "Typically within 2 hours of your call. We cover the 101 corridor daily and can coordinate HOA entry with advance notice — just give us your community name when you call. Reach us at (323) 870-4790 to check same-day and evening availability."
  - q: "Do you service Sub-Zero and Thermador built-in freezers?"
    a: "Yes — both are our most common work in Calabasas. Sub-Zero column units need proprietary evaporator components and model-specific door gaskets. Thermador Freedom columns have control board behavior that generic scan tools miss entirely. Viking and Miele built-ins are also in our regular rotation out here."
  - q: "What does a freezer repair diagnostic involve?"
    a: "Flat-rate diagnostic runs 30-45 minutes on most built-in units and is credited toward any repair you approve. Common fixes — defrost timer, condenser fan motor, door gasket — usually run $150-$350 parts and labor. If the compressor is failing on an older Sub-Zero, we'll tell you that before anything is ordered. Same-day and emergency slots available at (323) 870-4790."
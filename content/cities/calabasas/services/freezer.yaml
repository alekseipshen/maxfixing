  - q: "Do you service Sub-Zero and Thermador freezers in Calabasas?"
    a: "Yes — those two brands make up roughly half our Calabasas freezer calls. Common jobs
      include Sub-Zero evaporator coil blockages, Thermador control board failures, and Viking
      compressor diagnostics. All three require specific tooling and model-specific wiring
      diagrams that standard appliance shops don't carry.

      Miele column freezers are less common but not rare in the newer builds near the 101 and
      Lost Hills Road. Fault code retrieval on Miele requires a proprietary interface — we
      carry it."

  - q: "What does freezer repair cost in Calabasas, and how do I book?"
    a: "Diagnosis is $75-95 and applies toward the repair if you proceed. A defrost heater or
      door gasket job typically runs $150-250 all in. Compressor work on a Sub-Zero is quoted
      after diagnosis — it varies significantly by model and refrigerant type (R-134a vs.
      R-600a on newer units).

      Emergency and evening slots are available for food-safety situations. Call (323) 870-4790

title: "Calabasas Range Repair — Wolf & Thermador Specialists, 91302"

intro: |
  Gated communities off Las Virgenes Road — The Oaks, Calabasas Park, the custom builds
  along Park Sorrento — are full of Wolf and Thermador ranges that cost more than most
  used cars. These aren't appliances you hand off to a generalist. A Wolf 36" dual-fuel
  with a failing igniter electrode, or a Thermador Pro Grand where the convection element
  stopped cycling, needs a technician who has actually pulled one apart before showing up
  with a screwdriver.

localContext: |
  The majority of homes in 91302 went up between 1985 and 2005 — custom builds and tract
  luxury where Wolf, Viking, and Thermador were basically the default range spec. Cabinetry
  was framed around built-in dimensions, which means service access behind the range is
  usually tight. Sub-Zero/Wolf stacked configurations are common in kitchen islands,
  especially in the Monte Nido pocket and along Mulholland Highway. Pulling these units for
  a gas line inspection or control board swap takes longer than it would in a standard
  kitchen — that's just the reality of how these homes were built.

  The Parkway Calabasas stretch and the streets branching off El Camino Real tend to have
  the older installs — Thermador and Viking units from the late 1990s still running on
  original control boards. Those boards aren't always in stock anymore; sourcing is part of
  the job. Newer builds near Park Granada and around the Calabasas Commons run Wolf
  dual-fuel and Miele range-tops. Both use proprietary wiring harness connectors that differ
  from standard residential spec — generic parts won't seat correctly on these units.

  Summer in the 91302 zip code is a real variable. The Valley interior runs 10 to 15
  degrees hotter than the coast, and gas valve components in a range that's also fighting
  ambient heat work harder than the manufacturer's design baseline. Thermal expansion in
  valve seats is a legitimate failure mode here, not a fringe scenario. Homes along the
  ridge lines toward Malibu Canyon Road see the worst of it in July and August.

commonProblems:
  - title: "Burner Clicks Continuously But Won't Light"
    description: "On Wolf and Viking professional ranges, the culprit is almost always a fouled
      igniter electrode or a cracked igniter cap — grease from high-heat cooking works into
      the ceramic and disrupts the spark arc. The spark module sends voltage, but the gap
      can't fire consistently. Wiping it down buys you a day or two; the electrode assembly
      usually needs swapping. We stock Wolf-specific igniter components on the truck."

  - title: "Oven Runs 50–70 Degrees Below the Set Temperature"
    description: "Thermador ranges pair an oven control board with a calibrated temperature probe
      mounted inside the cavity. Once the probe drifts — common after a few years of high-temp
      roasting or a self-clean cycle gone long — the board gets bad readings and the oven
      underheats without throwing an error. Most homeowners notice it through burned-bottom,
      raw-center baking results. Probe replacement takes about 30 minutes and restores
      calibration immediately. On older Thermador Pro Harmony units, the probe connector at
      the board also oxidizes; cleaning the terminal pins is part of the same service visit."

  - title: "Persistent Gas Odor Even With Every Burner Off"
    description: "A faint sulfur smell that lingers when the range is completely off typically
      points to a worn gas valve seat or a hairline crack in the flex connector behind the
      unit — not a burner left on. On Thermador and Wolf slide-ins, that supply connection
      sits flush against the back wall and is inaccessible without fully pulling the range.
      This isn't a wait-and-see situation. Schedule the inspection before using the range
      again — call us at (323) 870-4790."

faq:
  - q: "How fast can you get to Calabasas for a range repair?"
    a: "We run the 101 corridor every day, and Calabasas is well inside our regular route.
      From the Valley, we're usually there within 90 minutes of booking — same-day slots
      are available most weekdays. Call (323) 870-4790 and we'll confirm a window within
      the hour."

  - q: "Do you work on Wolf and Thermador ranges, or just standard residential brands?"
    a: "Wolf, Thermador, and Viking make up the majority of what we see in Calabasas. We
      keep Wolf burner assemblies and Thermador oven temperature probes as truck stock.
      KitchenAid and Bosch slide-ins are common here too — both covered without needing
      to order parts."

  - q: "What does a range diagnostic cost, and are evening appointments available?"
    a: "The diagnostic visit is flat-rate and applies toward the repair if you move forward.
      Most igniter and control board repairs land between $180 and $360 depending on the
      part. Evening slots are available, and same-day emergency service is an option for
      gas-related issues. Book at (323) 870-4790."
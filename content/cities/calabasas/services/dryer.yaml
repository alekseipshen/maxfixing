localContext: |
  Homes in 91302 run mostly 1980s to early-2000s construction — large square footage, dedicated laundry rooms, and gas hookups nearly everywhere. That era typically has dryer vent runs stretching 15 to 20 feet through interior walls before reaching an exterior exit.

  Long runs trap lint faster than homeowners expect.

  The stretch of custom homes along Mulholland Highway and up toward Stokes Canyon Road skews older — some built before 1990, with original vent infrastructure that hasn't been touched since. Airflow issues in those houses are routine, not exceptions. Near Calabasas Commons on Agoura Road, newer townhouse clusters from the mid-2000s have utility closets stacked two floors up, which complicates van access and adds 20 minutes to any service call. The 91372 zip covers builds near the 101 interchange, where stacked units tucked into tighter utility spaces add access logistics to every service call. Two very different service environments inside the same city.

commonProblems:
  - title: "Dryer Runs a Full Cycle but Clothes Come Out Damp"
    description: |
      Bosch heat-pump and condenser dryers — common in Calabasas homes renovated or built after 2012 — use a moisture sensor: two small metal strips inside the drum. Fabric softener sheets leave a residue film on those strips over time, and once coated, the sensor reads the load as dry before it actually is. The cycle ends early. Cleaning the sensor bars takes five minutes. If it doesn't clear, the heating element needs bench testing. Both are same-day diagnoses.

  - title: "Thermal Fuse Keeps Blowing — Even After Replacement"
    description: |
      A vent run that stretches 18 feet and bends twice — not unusual in 91302's larger homes with interior laundry rooms — creates back-pressure that traps heat inside the drum. Temperatures climb until the thermal fuse blows to protect the machine from overheating. Replacing the fuse without fixing the airflow restriction means it fails again within a week. We check exhaust pressure at the exterior cap first, before touching any internal component. Some vents in this zip haven't been cleared in over a decade.

  - title: "Loud Thumping or Squealing During the Tumble Cycle"
    description: |
      LG front-load dryers develop worn drum rollers after 5 to 7 years — a rhythmic thump that gets louder as the machine warms up mid-cycle. Samsung models lean toward belt tensioner failure instead: a higher-pitched squeal at startup that fades once running. Neither issue resolves on its own. A drum that drops out of alignment because worn rollers went ignored long enough can crack the drum housing itself, turning a $175 mechanical fix into something three times more expensive.


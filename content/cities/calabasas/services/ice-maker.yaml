title: "Calabasas Ice Maker Repair — Built-In & Sub-Zero Specialists"

intro: |
  The Oaks and Calabasas Park Estates are loaded with Sub-Zero integrated refrigerators — the kind where the ice maker sits behind a panel-matched door and the fill valve is buried in a spot that takes 20 minutes just to access. Las Virgenes Municipal Water District delivers water around 350 ppm TDS, which means mineral scale hits that fill valve and ice maker assembly faster than most homeowners expect. The majority of calls we get from 91302 trace back to two things: hard water and built-in units that need someone who has actually opened one before.

localContext: |
  Most of Calabasas residential falls in 91302 — planned communities built between the late 1970s and early 2000s, many with high-end kitchen renovations layered onto original construction. Gated developments like Mountain View Estates and The Oaks tend to run Thermador Freedom columns or Sub-Zero 700-series built-ins where the ice maker module is not a standard pull-out. Getting into those units for a real diagnosis takes different tools and extra time compared to a freestanding Whirlpool sitting on open kitchen tile.

  The stretch along Las Virgenes Road and up toward Park Sorrento is where we see the densest concentration of panel-ready refrigerators — Miele and Bosch column fridges installed flush with custom cabinetry, no exposed hinge, zero clearance on the sides. Pulling the unit for ice maker access means unclipping cabinet panels and sometimes removing a drawer stack first. Homes near the Leonis Adobe area on Calabasas Road skew older, mid-2000s construction, but those kitchens got full Sub-Zero or Viking package upgrades during remodels. The secondary zip 91372 covers Calabasas business corridor but also some hillside residential — same hard-water issues, same built-in configurations.

  Las Virgenes Unified School District boundary runs right through the middle of 91302. That matters to service scheduling: mornings between 8–10 AM hit school traffic on Parkway Calabasas. We route around it — if you call before 8, we're usually at your door by 9:30.

commonProblems:
  - title: "Fill Valve Calcification from Las Virgenes Hard Water"
    description: "Las Virgenes water runs 300–380 ppm TDS depending on season and the Metropolitan Water District blend. That mineral load precipitates inside the fill valve solenoid over two to four years, restricting flow until the ice maker produces undersized cubes or stops cycling entirely. Sub-Zero and Thermador built-ins are hit harder than freestanding units because the fill valve is recessed behind the door liner, making a simple flush or swap into a half-day job."
  - title: "Frozen Supply Line in Newer Construction Wall Cavities"
    description: "Valley summers push garage and utility-area temps past 90°F, but interior walls in newer Calabasas builds can run cold near poorly insulated stud bays. The water line feeding the ice maker freezes exactly where it passes through that cold pocket. Result: no ice, no dispensed water, refrigerator otherwise fine. Rerouting the supply line or adding a heat cable at the stub-out fixes it permanently — thawing alone just delays the next freeze."
  - title: "Ice Level Sensor Failure in KitchenAid and Thermador Columns"
    description: "The optical or thermostat-type ice level sensor in KitchenAid and Thermador ice makers reads 'bin full' on an empty tray, shutting down production. Mineral film coating the sensor is the usual trigger — but once the sensor board itself fails, cleaning does nothing. KitchenAid's modular ice maker assembly swaps out cleanly in most configurations; Thermador integrated columns require pulling the unit from the cabinet surround, which is not something you do in 30 minutes."

faq:
  - q: "How fast can you get to Calabasas for an ice maker repair?"
    a: "Calabasas is a regular stop on our San Fernando Valley route. From our base, we're typically at a 91302 address within 90 minutes of your call. Same-day slots are usually available — call (323) 870-4790 before noon and we can usually be there that afternoon or early evening."
  - q: "Do you repair Sub-Zero and Thermador built-in refrigerators?"
    a: "Yes. Sub-Zero 700-series integrated units and Thermador Freedom columns are common in this part of Calabasas, and we stock parts for both. KitchenAid built-ins too. These units need specific diagnostic tooling that most general appliance techs don't carry — we do."
  - q: "Is the diagnosis visit charged separately if I decide not to repair?"
    a: "Diagnostic fee applies if no repair is done. Most ice maker jobs — fill valve replacement, sensor swap, line thaw — land in the $150–$350 range. Sub-Zero and Thermador parts run higher. Evening and Saturday slots available if weekday afternoons don't work; schedule online or call us directly."
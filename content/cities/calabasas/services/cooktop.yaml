title: "Calabasas Cooktop Repair — Wolf & Thermador Specialists"

intro: |
  The Oaks and Park Calabasas estates off Lost Hills Road were built with kitchens sized
  for professional-grade equipment. A Wolf 36-inch gas cooktop is standard in half the
  houses we visit in 91302. Burner igniter failures are the most common call we get —
  specifically the spark module cycling without igniting after a burner cap shifts during
  cleaning. These aren't cheap fixes to ignore.

  Calibration matters here. A Wolf or Thermador unit that's misdiagnosed gets a part swap
  that doesn't fix it — and now the homeowner is out $300 and still has a dead burner.
  We bring the OEM wiring diagrams for each brand, not a generic appliance tech's intuition.

localContext: |
  Calabasas zip codes 91302 and 91372 cover neighborhoods built mostly between 1988 and
  2008 — large single-family homes with open-plan kitchens designed around built-in
  cooktops. The Oaks, Mulwood, and the hillside properties near Malibu Canyon Road almost
  always have Wolf, Thermador, or Viking units. LA County municipal water in this corridor
  runs 280–320 ppm hardness. Mineral scale packs into sealed burner ports and under ceramic
  glass faster than most homeowners realize.

  The newer construction along Las Virgenes Road leans toward Bosch induction panels and
  KitchenAid glass-ceramic cooktops — different failure profile than gas, but just as
  dependent on clean ceramic surfaces and intact induction coils. These units throw E-series
  error codes when the control board detects a coil temperature fault or glass discontinuity.
  Most homeowners see "E6" and assume it's catastrophic. Often it's a cracked glass panel
  short-circuiting the sensor, not a dead board.

  Access here is straightforward compared to West LA apartments — detached garages, wide
  driveways, no parking drama. That helps. Jobs move faster when the technician isn't
  circling the block for 20 minutes.

commonProblems:
  - title: "Spark Module Failure on Wolf and Thermador Gas Cooktops"
    description: "The spark module stops firing reliably after years of grease and moisture
      accumulating around the igniter electrode. Wolf ProRanch burners installed in The Oaks
      kitchens see this constantly — the clicking cycles but nothing lights. A corroded burner
      valve seat is the second culprit; gas flows freely but the valve can't seal, so pressure
      drops below ignition threshold.

      Replacing just the electrode without checking the valve is a common shortcut that fails
      within six months. The valve seat corrosion on Wolf dual-stacked burners is subtle —
      it looks fine until you measure the downstream pressure with a manometer. Wolf part
      numbers differ between the 2015 and 2020 series; ordering the wrong igniter means
      a second trip. We pull the serial plate first, every time."

  - title: "Cracked Ceramic Glass on KitchenAid and Bosch Induction Units"
    description: "Heavy cast iron on glass-ceramic surfaces cracks the tempered panel at
      stress points near the element zones. The surface looks intact until there's a hairline
      fracture beneath the burner ring — invisible until it arcs or moisture gets in. A cracked
      cooktop glass requires full panel replacement. Continuing to use it risks a short in the
      induction coil below.

      Bosch 800-series induction panels in 91372 homes are a specific repeat offender. The
      glass spec is thinner than the KitchenAid equivalent, and it doesn't tolerate thermal
      shock from setting a cold cast-iron skillet directly on a hot zone. The coil itself
      usually survives — glass swap, not full unit replacement. That's a $380 repair instead
      of a $1,200 replacement, if you catch it before the coil shorts."

  - title: "Blocked Burner Ports Causing Uneven Heat on Thermador Star Burners"
    description: "LA hard water mineral deposits pack the burner ports on Thermador Star
      Burner cooktops, throttling gas flow to the outer flame ring. Hot center, cold edges,
      ruined sauces. Clearing blocked ports means disassembling the burner cap and cleaning
      the orifice — surface wiping doesn't reach the deposit. Some 91302 homes we visit
      haven't had a port cleaning in over a decade.

      The Star Burner design has 12 individual port holes per burner ring. Scale blocks
      three or four of them, and the flame pattern goes asymmetric immediately. You'll see
      it on a dark pan — one side scorches, the other barely heats. Thermador's recommended
      cleaning interval is 6 months in hard-water areas. Nobody does it. By year three,
      the orifice tube usually needs replacement, not just cleaning. That's a $90 part
      and about an hour of labor."

faq:
  - q: "How fast can you get to Calabasas for cooktop repair?"
    a: "From our San Fernando Valley base, Calabasas is 25–35 minutes via the 101. Same-day
      slots are open most weekdays. Call (323) 870-4790 before noon and we can usually put
      a technician at your 91302 or 91372 address the same afternoon. Evening appointments
      are available for working households — just mention it when you call."

  - q: "Do you repair Wolf and Viking cooktops in Calabasas?"
    a: "Yes — Wolf, Viking, and Thermador are the three we see most in this area. Wolf spark
      module swaps, Viking gas valve assemblies, Thermador Star Burner igniter replacements.
      We stock common parts for these brands, so most jobs wrap in one visit without a
      parts-order delay.

      Miele and Gaggenau units in the higher-end Calabasas custom builds are less common
      but not outside our range — those require manufacturer diagnostic tools we carry.
      Call ahead if you have a Gaggenau so we confirm part availability before the visit."

  - q: "What does cooktop repair cost, and do you handle emergencies?"
    a: "Diagnostics run $85–$120. Most repairs land between $180–$380 depending on the part —
      a Wolf spark module is a different price tier than a Thermador control board. Evening
      and weekend emergency slots are available. Book online or call (323) 870-4790 to get
      on the schedule.

      Gas cooktop emergencies move to the front of the queue. If you're smelling gas near
      a cooktop that won't shut off, that's a valve failure — call immediately, we'll work
      around whatever we have scheduled."
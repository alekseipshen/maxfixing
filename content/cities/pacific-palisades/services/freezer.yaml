title: "Pacific Palisades Freezer — Post-Fire Kitchens, Ocean Air Fixed"

intro: |
  Salt air off Santa Monica Bay does real damage to freezer door gaskets and condenser
  fins — faster than most homeowners expect, and faster than the same unit would wear in
  Northridge or Burbank. The marine layer that sits over Castellammare most mornings keeps
  ambient humidity elevated even when it doesn't feel humid, and that combination of
  moisture and coastal air accelerates rust on the metal components around the compressor
  housing. After the January 2025 fire gutted most of the blocks north of Sunset Boulevard,
  a huge portion of Marquez Knolls and The Huntington got rebuilt kitchens — GE Profile
  and Whirlpool french-door units installed into spaces that are sometimes oddly configured,
  with clearances tighter than the manufacturer specifies. We serve all of 90272, from the
  canyon roads above Via de la Paz to the streets closest to PCH, and same-day freezer
  repair is available most weekdays. Call (660) 999-9960 if yours stopped freezing or
  started running loud.

localContext: |
  The housing in Pacific Palisades doesn't follow a single pattern. Rustic Canyon has
  older bungalows and mid-century cottages that often have compact undercounter freezers
  or older standalone chest units — Kenmore and Frigidaire models from the late 1990s and
  early 2000s that are still running but showing their age. The Riviera and Highlands areas
  have larger custom homes from the 1980s and '90s where built-in or side-by-side
  refrigerator-freezer combos are standard, mostly Samsung and Whirlpool side-by-sides.
  Post-fire rebuilt homes across zip code 90272 introduced a new variable: brand-new units
  installed under building permits in freshly framed kitchens where contractors sometimes
  left less than the required clearance behind the condenser. Those units are already
  running warm. Zip code 90402 covers the Santa Monica border just east of the Palisades,
  and we handle calls in that overlap zone regularly. The ocean proximity here — you're
  sometimes less than a mile from the water on the Sunset Mesa — means door hinge pins
  rust, gasket rubber cracks earlier, and condenser fins corrode in ways that inland
  service techs don't always anticipate.

commonProblems:
  - title: "Freezer Stops Cooling When Marine Layer Burns Off Midday"
    description: |
      Afternoons when the kitchen heats past 80°F and the condenser coils haven't
      been cleaned in a couple of years, a GE or Whirlpool side-by-side simply can't
      shed heat fast enough to keep the freezer below 0°F. The condenser fan motor
      is the first thing to check: if it's seized or slow, the refrigerant cycle
      backs up and the freezer compartment climbs toward 15–20°F while the fridge
      section stays cool. Dirty condenser coils are a $90–$150 service fix. A failed
      condenser fan motor replacement on a GE Profile runs $140–$220 parts and labor.
      Full compressor failure — where the unit runs constantly but never gets cold —
      is the expensive scenario, typically $380–$500 on a GE or Frigidaire, and
      only worth the repair cost if the unit is under seven years old. We carry
      condenser fan motors for the common GE and Frigidaire models on the van,
      so same-day repair is realistic for most calls in the 90272 zip code.

  - title: "Frost Buildup Blocking the Evaporator Coil After Power Interruptions"
    description: |
      Edison outages during Santa Ana wind events — and Pacific Palisades had more
      than its share of those in 2025 — knock the defrost cycle off its schedule.
      The freezer restarts mid-cycle, the defrost heater never completes its run,
      and ice accumulates on the evaporator coil behind the back wall of the freezer
      compartment. Airflow drops, the freezer warms, but the fridge section stays
      cold. That asymmetry is the clear tell. Samsung french-door units have a known
      failure pattern with the defrost sensor on models from 2018–2022, and it shows
      up exactly this way. Replacing the defrost heater and sensor on a Samsung runs
      $160–$240 total. We manually defrost the coil during the visit so the repair
      is effective immediately — you don't wait 24 hours for a slow warmup and
      re-freeze cycle. Most of these jobs take under two hours start to finish.

  - title: "Clicking or Grinding Noise from the Compressor Area"
    description: |
      A clicking sound repeating every two to four minutes — especially common on
      Kenmore and Whirlpool models from 2015–2020 — almost always points to a
      failing compressor start relay. The compressor tries to kick on, can't start,
      and trips off. The relay itself is a $20–$40 part and a five-minute swap. The
      risk is running it that way too long: repeated failed start attempts overheat
      the compressor windings and turn a $40 fix into a $450 compressor replacement.
      Grinding from the back lower section is usually the condenser fan blade
      hitting debris, or a worn evaporator fan motor bearing — both straightforward
      repairs in the $130–$200 range. Any repair involving refrigerant recovery or
      recharge requires EPA Section 608 certification; we hold that credential
       and carry the recovery equipment on every service call.
      Don't let a clicking compressor run more than a day or two before getting
      it looked at.

  - title: "Door Gasket Failure Driving Up Electric Bills"
    description: |
      The rubber door gasket on a chest freezer or upright Frigidaire unit
      deteriorates faster in Pacific Palisades than it does in the Valley — the
      salt air makes the rubber brittle and cracked within six to eight years on
      units stored in garages with ocean-side exposure. A failed gasket lets warm,
      humid air in constantly, forcing the compressor to run almost continuously.
      The effect on the electric bill is real: $15–$25 a month in extra draw before
      the temperature problems become obvious. Replacement gaskets for Frigidaire
      and Whirlpool upright freezers run $45–$90 for the part; with labor the total
      is typically $120–$180. A quick test tells you if the seal is gone: close the
      door on a dollar bill and try to slide it out — if it pulls free easily, warm
      air is getting in. Fixing the gasket is almost always worth doing on a unit
      under 10 years old. We stock common sizes for Frigidaire, GE, and Whirlpool
      and can usually handle the swap the same day we diagnose it.

  - title: "Temperature Fluctuation and Failing Thermostat or Control Board"
    description: |
      A freezer drifting between -5°F and +18°F isn't just food-safety concerning —
      it usually signals one of two things depending on the unit's age. On older
      Kenmore models from the late 2000s, a mechanical thermostat failing is the
      likely cause: testable in about 20 minutes and replaceable for $80–$130 total.
      On newer Samsung and LG french-door models, a faulty thermistor or control
      board that's lost calibration causes the same symptom. Control board
      replacement on a Samsung runs $250–$430 parts and labor depending on the
      model series. Before calling, pull the freezer away from the wall and check
      the condenser coils for dust buildup — caked coils cause temperature
      instability that looks exactly like a thermostat failure and cleaning them
      costs nothing. That alone resolves about 20% of temperature fluctuation
      calls. If cleaning doesn't fix it, call (660) 999-9960 and we'll run a full
      diagnostic before ordering any parts.

faq:
  - q: "How fast can you get to Pacific Palisades for freezer repair?"
    a: |
      We run West LA service routes regularly and can usually reach Pacific Palisades
      within two hours of your call on weekdays. From our main service area, Sunset
      Boulevard is the straightforward route in; PCH works well for calls near
      Castellammare or the Sunset Mesa side. Evening slots are available Tuesday
      through Saturday, which helps if you can't take time off mid-week. The
      hillside streets above Via de la Paz are narrow — we drive compact vans —
      but we've been up there enough times to know the parking situation. Call
      (660) 999-9960 before noon for the best shot at same-day service; afternoon
      calls are usually next-morning.

  - q: "What does freezer repair typically cost in Pacific Palisades?"
    a: |
      Most freezer repairs run between $120 and $500 depending on what failed.
      A start relay swap or door gasket replacement lands at the low end — $120–$180.
      Evaporator fan motor or defrost heater repairs come in at $160–$260. Compressor
      replacement on a GE, Whirlpool, or Frigidaire unit is the expensive end —
      $380–$520, which includes refrigerant recharge. We charge a $75 diagnostic
      fee that gets credited toward the repair cost if you proceed. No parts get
      ordered until you've approved the estimate in writing. Call (660) 999-9960
      or schedule online; same-day diagnostics are available most weekdays.

  - q: "Do I need a permit for freezer repair in Pacific Palisades, and does it affect my post-fire rebuild documentation?"
    a: |
      Standard appliance repair doesn't require a city permit. The exception is
      any sealed-system work involving refrigerant recovery and recharge, which
      requires EPA Section 608 certification — we hold that
      and carry recovery equipment on every van. If your home was rebuilt after the
      2025 Palisades Fire and your appliances were installed under an open building
      permit, we can provide detailed written documentation of any sealed-system
      repair for your permit file or your general contractor. That's a situation
      specific to 90272 right now that we've handled several times, and we know
      exactly what the city's building department needs to see.

  - q: "Can you repair built-in undercounter freezer drawers in Pacific Palisades homes?"
    a: |
      Yes — undercounter and built-in drawer freezers are a regular part of our
      work here. The larger custom homes in The Riviera and The Highlands often have
      Sub-Zero or Thermador drawer units that need different access procedures than
      freestanding models. We carry the torx bits and panel-release tools those
      units require. On drawer-style freezers, the most common failures are the
      drawer seal, the evaporator fan, and the control board — all serviceable
      in place without pulling the unit from the cabinet in most cases. Sub-Zero
      parts can have a 3–5 business day lead time if we don't have the component
      onboard. We'll tell you exactly what the wait will be at the diagnostic visit
      before you commit to anything.

  - q: "How long should a freezer last in Pacific Palisades, and when does replacement make more sense than repair?"
    a: |
      A well-maintained upright or chest freezer — GE, Frigidaire, Whirlpool —
      should last 15–18 years inland. In Pacific Palisades, salt air and elevated
      humidity trim that to maybe 12–15 years for units kept in garages with ocean
      exposure. The honest benchmark: if the repair cost exceeds 50% of a
      comparable new unit's price, replacement usually wins. Compressor replacement
      on a unit older than 12 years rarely makes financial sense. Door gaskets,
      fan motors, thermostats — those are worth fixing at almost any age because
      the parts are cheap and the repair is fast. We'll give you a straight
      replacement-vs-repair assessment at the diagnostic visit, no pressure either
      direction.

  - q: "Do you cover areas near Pacific Palisades, and how do I schedule?"
    a: |
      Pacific Palisades (90272) sits on our regular West LA route. We also cover
      Santa Monica, Brentwood, Malibu, Topanga, Mar Vista, and West Hollywood on
      the same service days. Calls near the PCH corridor or tucked into Topanga
      canyon neighborhoods work best in morning slots before traffic builds on the
      coast road. Same-day appointments typically fill by early afternoon, so
      calling before noon on weekdays is the move. Call (660) 999-9960 or book
      online — we'll confirm a two-hour arrival window by text when the technician
      is en route.
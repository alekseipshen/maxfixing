title: "Pacific Palisades Cooktop — Gas & Electric Repair, 90272"

intro: |
  Rustic Canyon kitchens are some of the oldest in the Palisades — a lot of those
  houses date to the 1940s and '50s, and the gas lines feeding the cooktops have
  seen decades of hard use. A GE or Kenmore four-burner that clicks endlessly
  without igniting usually has a fouled igniter electrode or a cracked burner cap,
  not a gas supply problem — though we test both. Over in Castellammare, the
  hillside homes from the '80s and '90s lean toward Samsung and LG glass-ceramic
  surfaces in remodeled kitchens, and a single impact crack across the cooktop
  isn't cosmetic — the heating element underneath can arc through the fracture
  during use. Pacific Palisades sits entirely in 90272, and we run calls here
  several times a week from our West LA base. Same-day slots are usually open —
  call (660) 999-9960 and we'll give you a straight arrival window.

localContext: |
  The residential streets in 90272 fall into two pretty distinct building eras.
  The flats around Via de la Paz and Swarthmore Avenue carry homes from the 1950s
  through the '70s — gas cooktops are standard there, and age-related failures like
  worn infinite switches and corroded gas valve seats show up regularly. Castellammare
  and the upper Riviera section push into the '80s and '90s, with more electric and
  induction surfaces in renovated kitchens. Coastal proximity is a real factor too:
  salt air accelerates corrosion on burner grates and igniter electrode tips,
  especially on units installed in kitchens with operable ocean-facing windows.
  LA's hard water — the Palisades draws from the same Metropolitan Water District
  supply as the rest of the Westside — leaves calcium deposits inside the small
  ports drilled into gas burner heads, producing uneven flame rings that look like
  a valve problem but are actually just blockage. One scheduling note: street
  parking near Will Rogers State Historic Park gets chaotic on weekends, so we
  default to weekday morning slots for Palisades calls when access is clean.

commonProblems:
  - title: "Gas Burner Won't Light — Igniter Electrode and Spark Module Failure"
    description: |
      The most common call we get out of 90272 is a burner that clicks nonstop but
      never catches a flame. Nine times out of ten it's either a worn igniter
      electrode or a dead spark module — the control board component that sends
      voltage to the igniter. On older GE Profile and Kenmore Elite gas cooktops,
      the spark module sits beneath the surface and is reasonably accessible;
      replacement parts run $40–$80 and the repair usually takes under an hour.
      A cracked or food-clogged burner cap can mimic the same symptom by disrupting
      the air-fuel mix right at the ignition point. We clean the burner ports and
      cap first before condemning the igniter — that saves a parts run half the time.
      Confirmed spark module failure? Same-day repair is almost always possible if
      we have the part on the truck.

  - title: "Cracked Ceramic Glass Surface — Impact Damage on Smooth-Top Electrics"
    description: |
      Glass-ceramic cooktops in the Castellammare and Riviera sections take a beating
      from heavy cookware. A cast-iron skillet dropped from even a few inches can
      spider-crack the surface. That crack on a Samsung or Whirlpool smooth-top
      isn't just cosmetic — moisture reaches the heating element underneath, and the
      element can arc through the fracture during use. The replacement glass panel is
      model-specific and runs $150–$350 for most 30-inch surfaces. Labor to swap it —
      removing the trim ring, lifting the old glass, reseating and sealing the new
      panel — adds another $80–$120 typically. Still cheaper than a new Samsung
      radiant cooktop, which starts around $600 at retail before installation.
      We stock panels for common Samsung and Whirlpool configurations and can usually
      quote availability before the appointment.

  - title: "Uneven Heat Output — Infinite Switch Wear and Burner Port Blockage"
    description: |
      A burner that runs wide-open on high but barely simmers on low usually has a
      failing infinite switch — the rotary control that regulates current to the
      surface element or, on gas units, modulates voltage to the safety valve coil.
      These wear out gradually; the failure is intermittent for months before it
      becomes consistent. LA hard water makes it worse on gas units: calcium deposits
      build up inside the small ports around the burner head, creating an asymmetric
      flame that homeowners read as a valve problem when it's just plugging. Frigidaire
      and GE gas cooktops from the 2010–2018 range see this regularly across 90272.
      Cleaning the ports with a fine-gauge wire tool and swapping the infinite switch —
      parts run $25–$60 depending on brand — resolves it. Full repair typically lands
      at $120–$180 parts and labor. Call (660) 999-9960 to get on the schedule.

  - title: "Electrical Faults and Error Codes — Control Board and Terminal Failures"
    description: |
      Electric and induction cooktops in the Palisades sometimes develop intermittent
      power failures — a surface element that heats on some settings but not others,
      or a display that goes dark mid-cook. The usual culprits are a loose wire harness
      connector at the control board or a burned terminal block on the surface element
      receptacle. Salt air in the coastal section of 90272 speeds up oxidation on
      these connections faster than inland zip codes. Samsung and LG induction cooktops
      throw F-series fault codes (F1, F3) when the board detects an input error — those
      codes don't always mean the board itself is dead; often it's a corroded connector.
      Diagnostic runs $65–$85, credited toward repair. A replacement control board for
      a mid-range Samsung induction surface runs $120–$200 in parts; total repair
      including labor typically lands $200–$320. We carry the most common Samsung and
      LG boards on the van.

  - title: "Knob and Control Assembly Failure — Stripped Shafts on Gas Cooktops"
    description: |
      Surface knobs on gas cooktops wear at the shaft connection point over years of
      daily use. On Kenmore and Frigidaire units, the control knob assembly includes a
      plastic D-shaft insert that strips out, leaving the knob spinning freely without
      engaging the gas valve. Replacement assemblies are model-specific and run
      $15–$40 each — a straightforward swap, but getting the valve stem seated
      correctly matters or the ignition timing is off. Pre-2010 cooktops sometimes
      have discontinued knob configurations that require sourcing aftermarket
      equivalents; we source these regularly for older Kenmore and GE units still
      running in the Palisades. If a stripped knob has left a gas valve stuck open,
      that's a same-day emergency call — don't use the cooktop. Most knob and
      control assembly repairs resolve in under 45 minutes, with a flat-rate
      parts-and-labor quote given before we start.

faq:
  - q: "How fast can you get to Pacific Palisades for a cooktop repair?"
    a: |
      From our West LA base, Pacific Palisades runs 20–35 minutes depending on
      whether Sunset Boulevard or PCH is moving. Morning slots starting at 8 AM
      are the most reliable — midday PCH congestion is real. Most calls booked
      before noon Monday through Friday get a same-day appointment. Weekend slots
      exist but fill faster; call (660) 999-9960 first thing Saturday and we can
      usually fit you in. Street parking in the Village and near the bluffs is
      manageable on weekdays. Estimate to completed repair is typically one visit
      for most single-component failures — we don't usually need a return trip for
      parts unless it's an unusual configuration.

  - q: "What does a cooktop repair in Pacific Palisades typically cost?"
    a: |
      Diagnostic is $65–$85, credited toward the repair if you proceed. Simple fixes —
      a burner cap cleaning, a knob assembly swap on a Kenmore or GE unit — come in
      at $90–$150 total. Mid-range repairs like an infinite switch or spark module
      replacement run $120–$220 parts and labor combined. Control board replacement
      on a Samsung or LG induction cooktop sits at $200–$350 depending on parts
      availability. Glass surface replacement on a smooth-top electric is usually
      $250–$450 all-in. Flat-rate quote before we touch anything — no surprise
      labor charges after the fact. Call (660) 999-9960 for same-day scheduling
      and on-site pricing.

  - q: "Do you need a permit to replace a cooktop in Pacific Palisades?"
    a: |
      Pacific Palisades falls under City of Los Angeles jurisdiction, so permits go
      through LADBS — LA Department of Building and Safety. A like-for-like swap
      (same fuel type, same cutout dimensions) typically doesn't require a permit
      in the City of LA. Switching from gas to electric, or resizing the cutout,
      can trigger a permit requirement through LADBS's over-the-counter process,
      which runs one to two business days for straightforward residential work.
      If your home is in a Palisades HOA, check your CC&Rs — some boards require
      written approval for kitchen modifications. Contractor license #1136541
      covers all residential appliance installation, and we'll walk you through
      what LADBS documentation is needed if your project scope requires it.

  - q: "Can you repair both gas and induction cooktops in Pacific Palisades?"
    a: |
      Yes — gas, electric coil, smooth-top radiant, and induction are all in scope.
      Gas cooktop repairs involve burner components, gas valve assemblies,
      thermocouple testing, and igniter systems; we carry combustion leak detectors
      on every gas appliance call. Induction is a different skill set entirely —
      the inverter board, coil assembly, and control logic vary significantly by
      brand. Samsung and LG induction units are the most common in 90272 remodeled
      kitchens, and we stock their diagnostic cables to pull fault codes directly
      from the control board. An E or F error code on the display doesn't mean the
      unit is dead — many of those faults are sensor or connector issues, not
      full board failures.

  - q: "What warranty do you provide on cooktop repairs in Pacific Palisades?"
    a: |
      Parts carry the manufacturer's warranty — typically 90 days on OEM components,
      30 days on aftermarket. Labor is warranted 90 days from the repair date. Same
      component fails again within that window, we come back at no charge. The
      coastal environment in Pacific Palisades accelerates corrosion on igniter
      electrodes and terminal connections specifically, so we apply dielectric grease
      to all exposed electrical connections during the repair — that meaningfully
      extends service life. We'll also tell you straight if a repair doesn't make
      economic sense relative to replacement cost. No point spending $300 on a
      15-year-old Frigidaire that's going to fail again in six months.

  - q: "Do you cover nearby areas outside Pacific Palisades?"
    a: |
      Regularly. From the Palisades we run calls into Santa Monica (90401–90405),
      Brentwood (90049), Malibu (90265), and Topanga (90290). South Bay coverage —
      Redondo Beach, Manhattan Beach, Torrance — is also on the regular schedule.
      Scheduling is easiest Monday through Friday; same-day availability is common
      if you call before 11 AM. Evening slots until 7 PM are open Tuesday and
      Thursday most weeks. Call (660) 999-9960 or book online — we confirm a
      two-hour arrival window by text so you're not clearing your whole afternoon.
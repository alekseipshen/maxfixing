title: "Granada Hills Range Hood — Fix the Fan Before Valley Summer Hits"

intro: |
  The old tract homes lining Balboa Boulevard between Rinaldi Street and the 118
  Freeway were built during Granada Hills' postwar boom, and most of those kitchens
  are still running their original ventilation setups — or the Kenmore wall-mount
  hoods that replaced them sometime in the 1980s. That works until it doesn't.
  Summer temperatures in the 91344 zip code regularly breach 105°F, and a range
  hood pulling grease smoke and steam through a clogged baffle filter while the
  house is already baking puts serious strain on a blower motor that's already
  decades old. Down near the newer townhome clusters off Chatsworth Street, the
  problem flips: undersized ductwork that can't move the CFMs a modern gas range
  demands. Near O'Melveny Park, we've replaced plenty of GE Profile hoods where
  the control board failed outright — no fan, no light, nowhere for smoke to go
  during a busy dinner. These aren't complicated problems, but they don't fix
  themselves.

localContext: |
  Granada Hills splits roughly along Rinaldi Street. North of it, into the 91394
  zip code, the homes are mostly 1980s and 1990s construction — duct-vented hoods
  that run through attic space and exit at the roofline or a soffit. South of
  Rinaldi, in 91344, you're looking at 1950s and 1960s ranch houses where the
  range hood may be ducted through the exterior wall with a short direct run, or
  where someone at some point installed a recirculating hood with a charcoal filter
  instead of cutting new ductwork. Both setups have distinct failure patterns.
  Charcoal-filter recirculating units get saturated with grease and stop working
  almost silently — no error code, just steadily worse smoke. The ducted ones
  develop damper issues and duct separations inside the wall cavity. Either way,
  valley heat isn't kind: hot attic air forces back-pressure against the exhaust,
  and the blower motor compensates by running harder until it burns out. These
  kitchens see real daily gas cooking, and the ventilation pays for it eventually.

commonProblems:
  - title: "Blower Motor Burnout in 1960s Ranch Kitchens Near Zelzah Avenue"
    description: "The single most common call we get in 91344 is a range hood that
      runs for a few seconds and then cuts off, or one that hums but moves no air.
      Nine times out of ten, the blower motor has seized or the run capacitor
      feeding it has failed — and in older Kenmore and GE units, that capacitor
      costs about $12 at a parts supplier but takes full disassembly to reach.
      Heat cycling in a San Fernando Valley kitchen accelerates insulation
      breakdown on motor windings faster than in cooler climates. Replacing the
      motor assembly on a standard 30-inch under-cabinet hood typically runs
      $150–$220 in parts and labor, depending on how buried the wiring is. We
      carry common replacement blower motors for GE and Whirlpool units in the
      van, so most of these get resolved same day. Letting it go means the kitchen
      fills with grease smoke every time the stove is lit."

  - title: "Excessive Noise From Unbalanced Fan Blades and Loose Housing"
    description: "A range hood that sounds like a box fan duct-taped to sheet metal
      is usually a vibration problem, not a motor problem — though ignored long
      enough, it becomes both. The fan blade on budget Frigidaire and Samsung
      under-cabinet models gets coated with grease over time, throws off its
      balance, and starts wobbling against the housing on every rotation. The fix
      is often straightforward: remove the grease filter, pull the fan blade, clean
      it thoroughly with degreaser, check the mounting screw, and reinstall. If
      the blade has warped from years of heat exposure, a replacement fan wheel
      for most 30-inch models runs $35–$60. We see this constantly in the townhome
      complexes near Chatsworth Street where hoods run at full blast for short
      bursts rather than low-and-slow, which stresses the blade mount faster than
      continuous moderate use."

  - title: "Vent Duct Modifications That Require an LA Mechanical Permit"
    description: "Swapping a like-for-like range hood is a straight appliance
      replacement — no permit needed in Los Angeles. But upgrading from a
      recirculating unit to a ducted hood, or rerouting ductwork to accommodate a
      higher-CFM blower, triggers a mechanical permit requirement from LADBS before
      work starts. In Granada Hills, that means submitting plans showing the duct
      route, exit point, and makeup-air provisions if the hood exceeds 400 CFM.
      We handle that paperwork as licensed contractor #1136541 — pull the permit,
      schedule the inspection, and provide the documentation LADBS needs at
      closeout. The permit typically adds $150–$300 to project cost and a few days
      of lead time. Skipping it creates problems at resale: buyers' inspectors in
      LA County flag unpermitted duct modifications routinely, and the correction
      becomes the seller's problem."

  - title: "Grease Filter Clogs That Kill Airflow Without Warning"
    description: "Baffle filters — the aluminum or stainless mesh inserts that catch
      grease before it reaches the duct — are rated for monthly cleaning under
      normal cooking loads. Most homeowners clean them once a year, if that. After
      six months of daily gas cooking on a Whirlpool or Amana range, those filters
      can be packed solid enough to cut airflow by 60–70 percent, which means the
      motor is running at max effort to move almost nothing. We've pulled filters
      out of 91344 kitchens that weighed three times what a clean filter should.
      A degreaser soak and hot rinse fixes most of them. If the mesh is damaged or
      the grease has polymerized solid, replacement baffle filters for most 30-inch
      units run $20–$45 per set. Budget an hour of cleaning time or about $75–$95
      in labor to have it done properly."

  - title: "Knowing When to Repair a Range Hood Versus Replace It"
    description: "Most under-cabinet range hoods have a realistic service life of
      10–15 years under regular use. Past that point, parts availability gets
      spotty, and a $180 repair today may be followed by a $150 repair six months
      later on something else that's equally tired. For older Kenmore and GE
      models, we run a quick diagnostic — motor draw test, capacitor check,
      control board inspection — and give a straight answer on whether repair
      makes financial sense. If the motor is original and the hood dates to the
      early 2000s, the honest call is usually replacement. A solid Broan-NuTone
      30-inch ducted hood, installed, runs $280–$450 depending on CFM rating and
      whether any ductwork needs modification. That's a better investment than
      chasing failures on a 20-year-old unit. Call us at (660) 999-9960 and we'll
      tell you exactly what you're dealing with after a 15-minute look."

faq:
  - q: "How fast can you get to Granada Hills for range hood repair?"
    a: "From our regular coverage area near the 405/118 interchange, Granada Hills
      is typically a 15–25 minute drive depending on freeway conditions. Same-day
      appointments are available for most range hood issues — blower motor failures,
      grease filter service, and light assembly replacements usually don't require
      pre-ordered parts. Evening slots run Tuesday through Saturday. Call
      (660) 999-9960 before noon and we can usually get someone there the same
      afternoon. For jobs that need a specific part ordered — like a control board
      for an older Samsung or Frigidaire unit — we'll typically schedule within
      2–3 business days once the part is confirmed in stock."

  - q: "What does range hood repair typically cost in Granada Hills?"
    a: "Simple repairs like a capacitor swap or fan blade replacement usually run
      $95–$165 all in. Blower motor replacement on a standard 30-inch under-cabinet
      hood is typically $150–$220 depending on the motor spec and access difficulty.
      Control board replacement on mid-range units can push $250–$350. A firm
      written quote comes before any work starts — no hourly mystery billing. The
      diagnostic visit is $65, applied toward the repair cost if you proceed. Full
      replacement with installation of a new unit runs $280–$500 depending on
      whether ductwork modifications are involved. Call (660) 999-9960 for a
      free ballpark on straightforward issues before booking."

  - q: "Do I need a permit to replace my range hood in Granada Hills?"
    a: "Straight appliance swaps — same duct route, same footprint, same CFM range
      — don't require a permit in the City of Los Angeles. But changing the duct
      routing, adding new ductwork where none existed, or installing a hood rated
      above 400 CFM in a residence puts you in LADBS mechanical permit territory.
      As licensed contractor #1136541, we handle the permit application, inspection
      scheduling, and closeout documentation as part of the project. Permit
      issuance in the San Fernando Valley typically takes 5–10 business days.
      It's worth doing correctly — it protects the installation and keeps your
      records clean for future buyers."

  - q: "Can you fix a range hood that recirculates instead of venting outside?"
    a: "Yes — and this comes up constantly in the older 91344 homes where nobody
      ever ran ductwork to the exterior. Recirculating hoods rely on a charcoal
      filter to absorb odors before pushing air back into the kitchen. That filter
      needs replacement every 3–6 months under regular cooking loads, and most
      homeowners never change it. A saturated charcoal filter makes the hood nearly
      useless even when the blower motor is fine. Replacement charcoal filters for
      common Frigidaire and GE recirculating models run $15–$30 each. If you want
      to convert to a true ducted exhaust, we can assess the wall or ceiling route
      and quote the ductwork addition — usually the smartest long-term move for a
      kitchen with daily gas cooking."

  - q: "How long should a range hood last, and what does the repair warranty cover?"
    a: "Budget under-cabinet hoods — Whirlpool, GE, Amana — are realistically built
      for 10–15 years. Motors and control boards are the weak points; the housing
      lasts indefinitely. Manufacturer warranties on most residential hoods cover
      one year on parts, and they're narrow — grease damage and wear aren't
      included. Our labor carries a 90-day warranty on any repair we perform. If a
      part we install fails within that window, we return and fix it at no
      additional charge. For replacement installs, the new unit ships with whatever
      manufacturer warranty applies, and we document the install date and model
      number for your records."

  - q: "Do you cover neighborhoods near Granada Hills for range hood service?"
    a: "Granada Hills sits between Northridge to the south and Porter Ranch to the
      north, and we cover both without a travel surcharge. Regular runs also go
      into Chatsworth, North Hills, Reseda, and Sylmar. The 118 makes east-west
      coverage across the upper Valley straightforward. Range hood calls are
      typically same-day or next-day — these aren't multi-day projects. Call
      (660) 999-9960 or book online and we'll confirm a window that works for your
      schedule. Evening appointments are available if daytime doesn't."
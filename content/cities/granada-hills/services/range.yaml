title: "Granada Hills Range Repair — Valley Heat, Older Gas Lines"

intro: |
  The kitchen in a 1960s ranch on Zelzah Avenue tells the whole story — a Kenmore gas range
  sitting in the same cutout it's occupied for four decades, fed by a gas line that also runs
  the water heater down the hall. When the igniter stops sparking or the left rear burner
  starts burning orange instead of blue, the gap between a working kitchen and cold cereal
  for dinner is measured in hours, not days. Granada Hills kitchens are overwhelmingly gas,
  and a big share of them are running original or near-original configurations from the 1960s
  and 70s builds that dominate south of Devonshire Street. Knollwood homes near the country
  club skew slightly newer — mid-2000s Whirlpool and GE slide-ins — but on streets like
  Petit Avenue and Chatsworth Street, those older sealed-burner setups show up on nearly
  every service call. We cover the 91344 zip code and surrounding Granada Hills neighborhoods
  and can typically get out same-day.

localContext: |
  Granada Hills runs across two main zip codes — 91344 covers the residential core, while
  91394 handles the newer construction near the 118 corridor and the Porter Ranch edge of
  the neighborhood. Housing breaks down clearly by decade: 1960s and 1970s ranch homes
  dominate south of Devonshire, while the stretches near Rinaldi Street and the Sesnon
  Avenue corridor saw building in the late 1980s through mid-1990s. Both generations cook
  on gas almost exclusively. Valley summer heat is no abstraction here — temperatures near
  El Cariso Regional County Park regularly push past 100°F from late June through September,
  and that sustained load accelerates oven thermostat drift and degrades control board
  components faster than you'd see in a Santa Monica kitchen three miles from the coast.
  LA's hard water adds another layer: Valley tap runs 300–400 ppm mineral content, which
  clogs burner orifices over time — especially on ranges with a steam feature or any
  connection to a water supply line. Slab foundations mean most of these ranges haven't
  moved since installation, which is actually good for service access.

commonProblems:
  - title: "Burner Won't Ignite — Cracked Spark Electrode on Older GE and Kenmore Ranges"
    description: |
      A burner that clicks endlessly but won't light almost always traces to a failed spark
      electrode. The ceramic insulator cracks from thermal cycling — heat expands it, cooling
      contracts it, and after a few years the tip either fractures or gets coated with enough
      grease and mineral residue to kill the arc before it jumps to the burner cap. On GE
      Profile and Kenmore gas ranges common throughout 91344, the left rear burner takes the
      most heat migration from the oven cavity below and tends to fail first. Replacing the
      electrode assembly runs $85–$130 in parts depending on the model; labor on a standard
      appointment slot is about an hour. We stock common GE and Kenmore igniter modules on
      the truck, so this is usually a same-day close. Call (323) 870-4790 — the clicking loop
      won't stop on its own, and it draws power continuously until the part is replaced.

  - title: "Yellow or Lopsided Flame — Clogged Burner Orifice From Hard Water and Grease"
    description: |
      A yellow flame or one that burns unevenly across the burner ring points to a partially
      blocked orifice or a shifted burner cap. The orifice opening on a residential gas burner
      is about 1.5mm — it doesn't take much mineral buildup or grease intrusion to cut flow.
      In Granada Hills, the Valley's high water hardness accelerates this on any burner that
      sees steam or regular boil-overs. Whirlpool and Amana ranges with sealed burners are
      particularly prone because the burner cap traps moisture if it isn't reseated correctly
      after cleaning. The fix involves pulling the burner head, cleaning or swapping the
      orifice insert, and checking gas manifold pressure at the valve. An orifice kit for
      Whirlpool runs $20–$45. The job takes 45 minutes to an hour. Beyond the cooking
      inefficiency, a partial blockage means incomplete combustion — carbon monoxide output
      goes up, so don't treat this one as cosmetic.

  - title: "Oven Won't Reach Temperature — Weak Igniter on Gas Oven Units"
    description: |
      A gas oven that takes 25 minutes to hit 350°F — or cycles off before it ever gets
      there — is a failing oven igniter in 90% of cases. The igniter has to glow bright enough
      to pull sufficient current to open the gas valve's bimetal safety seat; as it ages, it
      draws less current, the valve opens slower, and heat output drops. Samsung and Frigidaire
      gas ranges, which show up regularly in 1980s and 1990s Granada Hills builds, typically
      see igniter degradation after 5–7 years of regular use. The symptom is visible: the
      igniter glows orange but the oven burner takes forever to catch, or the broil cycle
      won't engage at all. Replacement igniter assemblies run $40–$90 depending on the model;
      labor runs about 90 minutes including reassembly and a full temperature-verification
      cycle. Samsung and Frigidaire igniters are standard stock on our service trucks.

  - title: "Control Board Errors — F-Codes and Dead Touch Zones on GE and Frigidaire Ranges"
    description: |
      A control board that throws error codes or has dead buttons is a $200–$500 repair
      depending on the unit. Frigidaire Gallery and GE ranges with glass-touch interfaces —
      both popular in 1990s and early 2000s Granada Hills tract homes — tend to see board
      failures after power surges or extended operation in kitchens with poor ventilation.
      An F3 error on a GE range usually means the oven temperature sensor has gone
      open-circuit; F1 or F7 typically points to the board itself. We test the sensor first —
      at $20–$40 it's worth ruling out before ordering a $150–$300 board. Non-stock boards
      for older GE and Frigidaire models typically arrive within 1–2 business days, so most
      repairs close out within a week of the initial diagnostic visit. Written quote after
      the first visit; no surprise charges at the end.

  - title: "Gas Smell Near the Range — Flex Connector Cracks and Aging Gas Valve Seats"
    description: |
      Gas smell anywhere near the range is a stop-everything call. The two most common
      sources are a cracked flex connector at the wall fitting or a failing internal gas valve.
      On older Kenmore and GE ranges in Granada Hills — many of which still have the original
      corrugated metal flex connector from their 1970s installation — the fitting joint can
      develop hairline cracks, especially if the range has been moved at any point for
      cleaning or flooring work. A new stainless CSST flex connector runs $15–$30 and takes
      30 minutes to swap. An internal valve failure is less common but happens on older
      Whirlpool and Amana units as the solenoid seat wears — that repair runs $150–$250 in
      parts and about 2 hours of labor. Turn off the supply valve behind the range and call
      us at (323) 870-4790 before running the unit again. We treat gas smell calls as
      emergency slots.

faq:
  - q: "How fast can you get to Granada Hills for range repair?"
    a: |
      From our Van Nuys base, Granada Hills is a straight run up the 405 to the 118 —
      typically 20–30 minutes outside peak traffic. Same-day slots open most mornings, and
      evening appointments are available Tuesday through Friday for households where someone
      needs to be home. Parking on residential streets like Petit Avenue or Shoshone Avenue
      is straightforward — we run service vans, not box trucks, so tight driveways aren't
      an issue. Call (323) 870-4790 before noon and we'll put you on the same-day schedule.
      Gas smell calls get emergency priority — usually there within 2 hours regardless of
      current bookings.

  - q: "What does range repair typically cost in Granada Hills?"
    a: |
      The diagnostic visit runs $75, credited toward the repair if you proceed. Most common
      fixes — igniter replacement, burner electrode swap, orifice cleaning — land in the
      $120–$250 range all-in for parts and labor. Control board replacements on mid-tier
      units like GE or Frigidaire run $250–$450 depending on part availability. Gas valve
      work sits in the $200–$350 range. A Whirlpool or Kenmore in otherwise decent shape
      is almost always worth fixing rather than replacing — a comparable new slide-in runs
      $600–$900 at Home Depot or Pacific Sales. Exact written quote after the diagnostic,
      no open-ended estimates.

  - q: "Do I need a permit to have my gas range repaired or replaced in Granada Hills?"
    a: |
      Standard repairs — igniter, control board, burner valve, sensor — don't require a
      permit in the City of Los Angeles. Granada Hills falls under LADBS jurisdiction
      (zip code 91344), and permits only come into play if you're modifying the gas supply
      line beyond the flex connector, or converting from one fuel type to another. That kind
      of work requires a permit through LA Department of Building and Safety and typically
      adds 2–3 weeks to the timeline. On jobs that cross that threshold, we coordinate the
      licensed plumbing side and handle the paperwork — just flag it when you call so we
      can scope it correctly from the start.

  - q: "Can you diagnose and repair a range that's throwing error codes?"
    a: |
      Error codes are actually the fastest path to a diagnosis — they narrow the field
      significantly before we even open the unit. On GE ranges, F3 points to the oven
      temperature sensor; F7 points to the control board. Samsung uses numeric codes —
      E-08 typically flags a door latch issue, SE a shorted keypad. Frigidaire F-codes
      map to specific board zones. We carry a diagnostic tablet with model-specific code
      libraries for all major brands, so the first visit usually ends with a confirmed part
      and a written quote, not a guess. Parts for Samsung and GE board-level repairs
      typically arrive within 1–2 business days of ordering.

  - q: "How long should a gas range last, and when does repair stop making financial sense?"
    a: |
      A well-maintained gas range — GE, Whirlpool, Kenmore — should run 15–20 years. Regular
      burner cleaning, keeping igniters dry between uses, and not letting boil-overs pool
      around the orifice inserts gets you the full service life. The repair-versus-replace
      math is straightforward: if the repair cost exceeds 50% of what a comparable new unit
      costs, we'll say so. On a $700 range, that's a $350 ceiling. Igniter, valve, and
      burner repairs almost always fall well under it. Control board replacements on older
      units sometimes push past that threshold — in that case we tell you upfront and let
      you decide before we order anything.

  - q: "Do you cover Northridge and Porter Ranch in addition to Granada Hills?"
    a: |
      Yes — from Granada Hills we run regular calls to Northridge (91325, 91326), Porter
      Ranch (91326), Chatsworth, and north into Santa Clarita. South covers the full Valley
      floor down to Sherman Oaks and Van Nuys. Two technicians handle this entire corridor,
      so you're not dealing with a dispatch center routing strangers — the same people cover
      this area every week. Evening and Saturday slots fill up fast in summer when Valley
      heat puts extra load on kitchen appliances, so earlier in the week is easier to book.
      Call (323) 870-4790 or schedule online for any of these areas.
title: "Granada Hills Cooktop Repair — Valley Heat Wears Out Burners Fast"

intro: |
  The 91344 zip code runs hot from June through September — triple-digit days
  aren't rare up here near the Simi Hills foothills — and that sustained heat
  accelerates wear on kitchen appliances faster than most homeowners expect. A GE
  gas cooktop's igniter electrode degrades more quickly when the kitchen ambient
  temperature spikes repeatedly through a long Valley summer. The blocks around
  Petit Avenue and the Knollwood area are mostly 1960s ranch-style construction,
  and a lot of those homes are still running on original gas supply lines with
  decades of mineral deposits packed into the flex connectors and burner ports.
  Frigidaire electric cooktops in those older kitchens frequently show surface
  element switch failures that look like a simple "burner won't heat" complaint but
  actually trace back to corroded wiring at the terminal block. We cover all of
  Granada Hills — from the streets near Bee Canyon Park out to the Porter Ranch
  boundary — and we stock the most common igniter modules and ceramic glass panels
  in the van so most repairs happen in a single visit.

localContext: |
  Granada Hills sits between the 118 Freeway and the northern edge of the Valley,
  mostly spread across the 91344 and 91394 zip codes. Housing stock ranges from
  1,200-square-foot tract homes built in the late 1950s near Chatsworth Street to
  larger two-story builds from the 1980s closer to the Porter Ranch border. The
  older kitchens in the 91344 area often have 30-inch drop-in cooktops — Kenmore
  and Whirlpool were the go-to brands for San Fernando Valley builders during that
  era — and those units are now 40-plus years old, well past designed service life
  for burner caps and spark modules. Gas is the dominant fuel type throughout most
  of Granada Hills, though the 1980s builds near the Balboa Boulevard corridor
  switched to 240V electric, which means Samsung and GE ceramic glass units are
  common there. LA's hard water — running around 300–350 ppm calcium carbonate in
  this part of the Valley — accelerates mineral scale buildup inside burner ports
  and around igniter tips, producing a delayed-light or no-light condition that
  gets misdiagnosed as a failed gas valve when a thorough cleaning is all it needs.

commonProblems:
  - title: "Igniter Clicks Constantly but Burner Won't Light — Spark Module Fault"
    description: |
      This is probably the single most common cooktop call we get in Granada Hills.
      The igniter electrode fires — you can hear it clicking — but the burner never
      catches. Nine times out of ten the spark module has shorted, usually from
      grease or moisture working into the module housing over time. On older Kenmore
      and GE gas cooktops, the module is a small white box tucked beneath the
      cooktop surface, and replacements run $35–65 in parts. The swap takes under
      an hour. If the clicking continues after a module swap, the issue may be a
      cracked or coated igniter tip — a $12 part — or a blocked burner port from
      mineral scale, which is a cleaning job, not a parts job. We carry both
      Kenmore-compatible and GE WB13K10014-equivalent modules in the service van so
      there's no waiting on a parts order. Same-day fix on most of these calls.

  - title: "Ceramic Glass Surface Cracked After a Dropped Pan — Repair or Replace?"
    description: |
      A cracked ceramic cooktop surface isn't structural damage — the heating
      elements underneath usually survive intact — but the crack creates a shock and
      fire hazard, so the glass has to be replaced, not patched. Samsung NE-series
      and GE Profile electric cooktops are the most common units we see with this
      problem in the 91344 area. OEM glass panels run $120–280 depending on the
      model, plus labor, and the swap is typically a 90-minute job once the correct
      panel arrives. Aftermarket glass fits poorly and voids manufacturer warranties,
      so we source direct. One thing homeowners don't expect: if the crack runs
      through a radiant heating element zone, that element's circuit may have
      shorted at impact, so we test all four elements before closing the job. A
      cracked surface on a Samsung doesn't automatically mean a new cooktop — most
      are worth repairing.

  - title: "Uneven Heat Across Burners — Surface Element Switch Worn Out"
    description: |
      On 240V electric cooktops, uneven heat almost always traces back to a failing
      surface element switch — also called an infinite switch — which controls power
      cycling to each radiant element. The switch wears out from repeated cycling,
      and the symptom is a burner that either runs full-blast only or refuses to
      reach temperature at all. Whirlpool and Frigidaire drop-in cooktops common in
      the older homes near Petit Avenue use a WP3148950 or 5303935054 switch
      depending on the model; parts run $20–45. The repair requires pulling the
      cooktop surface and accessing the switch bracket from below — about 45 minutes
      of labor. Permits aren't required for appliance component replacement in Los
      Angeles, but any work touching the 240V terminal block must be done by a
      licensed technician. Our contractor license covers all electrical
      appliance repairs in LA County. Don't let a bad switch run at partial heat for
      months — the uneven thermal load stresses the glass surface and shortens its
      life.

  - title: "Gas Flame Burns Orange or Yellow — Burner Cap and Port Mineral Buildup"
    description: |
      A healthy gas burner burns blue. Orange or yellow flame — or an uneven ring
      pattern — means the air-to-gas mixture is off because the burner cap or ports
      are partially blocked. In Granada Hills specifically, the Valley's hard water
      deposits calcium scale inside burner ports even on cooktops that look clean on
      the surface. This is a cleaning and burner cap inspection job more than a
      parts job, typically $85–120 for a full four-burner service on a GE or Amana
      gas cooktop. If discoloration persists after cleaning, the burner head itself
      may be warped from thermal cycling — replacement heads run $15–30. Yellow or
      orange flame is not a cosmetic issue: incomplete combustion produces carbon
      monoxide. This repair should happen fast. Call (323) 870-4790 if you're
      seeing off-color flame on any burner and we can usually get there the same day.

  - title: "Cooktop Knob Spins Freely Without Engaging — Valve Stem Wear"
    description: |
      Plastic knobs on gas cooktops eventually strip at the D-shaft interface — the
      knob spins freely without turning the gas valve stem beneath it. This shows up
      most on Kenmore and Frigidaire gas cooktops that are 15-plus years old,
      especially in kitchens that run warm through the summer. A stripped knob is a
      $10–20 parts fix if the valve stem itself is undamaged. If the valve stem has
      also worn or the gas valve body is cracked, the repair gets more involved — a
      full gas valve assembly runs $45–90 and requires shutting off the gas supply
      and leak-testing after installation. Kitchens in the 91394 zip code near the
      Rinaldi Street corridor tend to have older Frigidaire ranges, and we keep
      common Frigidaire valve stems stocked on the truck. One hard rule: never
      operate a cooktop if the knob is stuck in the ON position or the valve won't
      fully close — that's a same-day safety call, not a callback.

faq:
  - q: "How fast can you get to Granada Hills for a cooktop repair?"
    a: |
      We run service throughout the San Fernando Valley and Granada Hills sits
      squarely in our regular coverage zone — the 118 Freeway makes access easy
      from either direction, and we're typically on-site within two hours for
      morning bookings. Evening slots are available Tuesday through Saturday for
      homeowners who can't take a daytime appointment. Most common cooktop repairs
      — igniter modules, surface element switches, burner cap cleaning — take 45 to
      90 minutes on-site once we're there. Call (323) 870-4790 to check same-day
      availability. Call before noon and we can usually reach you the same afternoon.

  - q: "What does cooktop repair typically cost in Granada Hills?"
    a: |
      Most repairs land between $95 and $260 all-in, parts and labor combined. An
      igniter module swap on a GE or Kenmore gas cooktop typically runs $110–145
      total. Ceramic glass panel replacement on a Samsung or GE electric model runs
      $230–380 depending on whether OEM glass is in stock or needs to be ordered.
      Surface element switch replacement on Whirlpool or Frigidaire electric models
      typically lands at $130–175. A gas valve replacement with leak testing runs
      $185–265. All pricing includes the diagnostic, parts, and labor — no line
      items added at the end. We give exact figures before touching anything, and
      we'll tell you straight if the repair cost approaches what a new unit would
      run.

  - q: "Do I need a permit to repair a cooktop in Granada Hills?"
    a: |
      Replacing a component inside an existing cooktop — igniter module, surface
      element switch, burner cap, ceramic glass panel — doesn't require a permit in
      the City of Los Angeles. If the job involves modifying gas line connections or
      converting fuel types, that work does require a permit through LA Department
      of Building and Safety, and the gas connection must pass inspection. For
      standard appliance repairs, our contractor license covers all work in
      LA County. If a repair does cross into permitted territory — say, relocating a
      supply line — we handle the paperwork and coordinate the inspection schedule.
      Most cooktop calls in Granada Hills never get near that threshold.

  - q: "Can you repair a gas cooktop that smells like gas near the burners?"
    a: |
      A gas odor near the cooktop is a valve or supply line problem until confirmed
      otherwise — don't try to diagnose it yourself. Shut off the gas at the supply
      valve behind or below the unit and call us. We carry combustible gas detectors
      and perform leak tests with a manometer on every gas appliance job. The most
      common sources of gas odor on residential cooktops are a worn valve stem seal,
      a cracked brass valve body, or a loose flex connector at the supply line — all
      repairable. Thermador and Viking built-ins in some of the newer Granada Hills
      homes near the Porter Ranch border use commercial-grade valve assemblies, but
      they're not immune. If we find an active leak, we isolate the supply and won't
      re-light the cooktop until it tests clean. Call (323) 870-4790 — this one
      shouldn't sit overnight.

  - q: "How long should a repaired cooktop last, and what's your warranty?"
    a: |
      Parts we install carry a 90-day warranty covering both the component and the
      labor. Most quality OEM igniter modules, surface element switches, and burner
      caps last 5–8 years after installation under normal use. Ceramic glass on
      electric cooktops is impact-sensitive — we warranty our installation
      workmanship, but a panel cracked by a dropped cast-iron skillet is a new
      service call, not a warranty claim. GE and Whirlpool OEM parts outlast
      aftermarket equivalents by a wide margin, which is why we don't substitute
      aftermarket on structural components. If a repair fails within the 90-day
      window, we return and fix it at no charge. On units 18 years or older, we'll
      tell you honestly if repair cost is creeping toward replacement cost — and
      we'll give you a straight recommendation either way.

  - q: "What nearby cities do you cover in addition to Granada Hills?"
    a: |
      Granada Hills is one of our regular stops throughout the northwest Valley.
      Coverage from here extends to Porter Ranch (91326), Northridge, Chatsworth,
      West Hills, Canoga Park, and Reseda without any additional travel charge.
      South of the 101, we also cover Sherman Oaks, Encino, and Van Nuys regularly.
      Scheduling is straightforward — call (323) 870-4790 and we'll give you a
      two-hour arrival window. Most appointments in the Granada Hills corridor are
      available within 24–48 hours, with same-day slots opening up regularly when
      morning jobs finish early. Gas smell or no-heat situations move to the front
      of the schedule — mention it when you call.
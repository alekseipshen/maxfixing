title: "Granada Hills Ice Maker — Hard Water vs. Your Fill Valve"

intro: |
  O'Melveny Park sits at the northern edge of the 91344 zip, and the ranch homes
  spreading south from Sesnon Boulevard through the heart of Granada Hills are running
  refrigerators in kitchens that were designed before dishwashers were standard — let
  alone icemakers. LADWP water hardness in this corridor runs 200 to 280 parts per
  million depending on the seasonal supply blend, and that mineral load does quiet,
  steady damage to ice maker fill valves over months and years. A Kenmore side-by-side
  that moved in with a family ten years ago is probably producing half the ice it used
  to, or none at all, because calcium has gradually choked the solenoid orifice in the
  water inlet valve down to a trickle. The area near Zelzah Avenue and the Porter Ranch
  boundary sees the same pattern — older GE and Whirlpool units in 1970s homes where
  nobody thought to flush the water line in a decade. Call (660) 999-9960 and we can
  usually be on-site the same day.

localContext: |
  Most of the residential stock in Granada Hills went up between 1955 and 1975 —
  standard postwar San Fernando Valley construction, single-story ranch floor plans
  with tight kitchen alcoves and original copper supply lines that have accumulated
  real mineral deposits. In 91344, those supply lines feed directly into refrigerator
  fill valves that were already working with minimal clearance from the factory. Over
  in 91394, closer to the Chatsworth border off Rinaldi Street, you find a mix of
  slightly later builds — some early 1980s construction — but the water chemistry is
  essentially identical. Ambient kitchen temps during July and August regularly push
  past 90°F in single-story homes without central air conditioning, which forces
  refrigerator compressors to run longer cycles and stresses ice maker thermostats
  that were calibrated for moderate conditions. Tight appliance bays in these homes
  also mean ice maker access requires removing shelving and sometimes the entire
  freezer drawer assembly before a technician can reach the water line connection —
  something to budget time for on older Frigidaire and Amana units.

commonProblems:
  - title: "Mineral-Clogged Water Inlet Valve — The Most Common Granada Hills Ice Maker Call"
    description: |
      Small, hollow ice cubes are the first sign. Then production slows to a few cubes
      per cycle. Then nothing. The water inlet valve — a dual-coil solenoid mounted at
      the back of the refrigerator — has a plastic orifice that calcifies fast under
      91344's water conditions. On a standard Kenmore or GE side-by-side, the orifice
      opening is roughly 1.5mm; mineral deposits can cut that to under 0.5mm over three
      to five years of hard water exposure. Replacement valves for these models run
      $22 to $55 in parts, and the swap takes 30 to 45 minutes once the refrigerator
      is pulled out. We carry the most common GE WR57X10032 and Kenmore equivalent
      valves on the truck, so this usually gets handled in one visit without a parts
      delay.

  - title: "Frozen Fill Tube Blocking the Ice Mold"
    description: |
      The fill tube is the small plastic or rubber line that delivers water from the
      back wall of the freezer into the ice mold. When the freezer thermostat runs a
      degree or two colder than spec — common on older units where the calibration has
      drifted — the standing water in that tube freezes solid between fill cycles. The
      ice maker then tries to fill, gets nothing, and eventually throws an error or
      just stops. Samsung french-door models have a documented pattern of ice bridging
      in this exact spot, especially in warm kitchens where the freezer door gets
      opened frequently. Clearing the blockage takes 20 minutes; fixing the underlying
      thermostat drift or confirming the defrost heater is cycling correctly adds
      another 30. Total repair time is typically under an hour.

  - title: "Optical Sensor Failure Causing False 'Bin Full' Signal"
    description: |
      Newer refrigerators replaced the old wire bail arm with an infrared optical
      sensor that beams across the ice bin and shuts off production when ice interrupts
      the signal. Mineral film from Granada Hills tap water settles on the sensor eye
      and scatters the beam even when the bin is empty — so the ice maker reads
      "full" and stops producing indefinitely. This shows up frequently on Samsung and
      LG units built after 2012 and has a straightforward fix: clean the sensor lens
      with a diluted white vinegar solution and test the cycle. If the sensor housing
      itself is cracked or the emitter has failed, replacement parts run $45 to $90
      depending on the model. Our contractor license number is if your
      property manager needs documentation for the service record. Diagnosis takes
      about 15 minutes.

  - title: "Ice Maker Module Replacement — When Repair Math Doesn't Work"
    description: |
      After eight to twelve years, the ice maker module itself — motor, ejector
      blades, ice mold thermostat — wears to the point where chasing individual
      component failures costs more than a module swap. A replacement module for a
      Whirlpool or Amana side-by-side runs $85 to $150 in parts; installation takes
      50 to 70 minutes. For GE top-freezer units, the modular design makes this
      especially clean — the whole assembly unplugs and drops out in about ten minutes.
      That total repair cost of $150 to $250 pencils out easily against a new
      refrigerator when the rest of the unit — compressor, condenser coil, door
      gaskets — is still in decent shape. If the fridge is under 12 years old and
      cooling correctly, module replacement almost always makes more sense than
      replacement.

  - title: "Auger Motor Failure — Ice Dispenser Grinding or Dead"
    description: |
      The auger motor drives the helical screw that moves ice from the storage bin
      forward to the dispenser chute. When it starts failing, you hear grinding during
      dispenser use, or the dispenser runs but no ice comes out. Whirlpool and Maytag
      side-by-sides from the 2005-2016 production run have an auger motor that's a
      recognized weak point — the bushings wear and the motor eventually seizes.
      Parts for a Whirlpool W10757851 replacement motor run $50 to $80; the repair
      requires removing the ice bin and door inner panel, about 60 to 90 minutes of
      labor. Catching it at the grinding stage matters — a seized auger can strip the
      plastic drive coupling, which turns a $70 motor swap into a $120 parts job.
      Same-day service is usually available for this repair in Granada Hills.

faq:
  - q: "How fast can you get to Granada Hills for ice maker repair?"
    a: |
      Granada Hills sits right in our northwest Valley coverage corridor — we reach
      most of 91344 and 91394 off the 118 in under 25 minutes from our nearest
      technician's position. Call before noon and same-day service is the norm, often
      with a 2-hour arrival window. School traffic on Balboa and Rinaldi can push
      that by 10 to 15 minutes during afternoon hours, but we'll give you a real
      estimate when you call, not a vague half-day range. Dial (660) 999-9960 and
      we'll check the current schedule and confirm your slot.

  - q: "What does ice maker repair cost in Granada Hills?"
    a: |
      Simple fixes — a clogged water inlet valve, a stuck bail arm, sensor
      cleaning — typically run $85 to $150 including parts and labor. A full ice
      maker module replacement on a Whirlpool, GE, or Frigidaire usually lands
      between $150 and $260 depending on the model and how accessible the
      compartment is. We don't tack on a separate diagnostic fee if you move
      forward with the repair on the same visit. Pricing varies based on brand
      and whether the refrigerator needs to be partially disassembled to reach
      the water line connection — which happens more often in the narrow kitchen
      layouts common in 91344's older ranch homes.

  - q: "Do you work with landlords and property managers in Granada Hills?"
    a: |
      Yes — a solid share of our Granada Hills calls come from rental properties,
      particularly in the denser sections of 91344 near Chatsworth Street. We can
      bill management companies directly, document every repair with photos and a
      written service report, and note our contractor license on any
      paperwork the property owner needs for their records. Tenants don't need to
      coordinate the payment — we work that out with the landlord. When scheduling,
      just let us know if a tenant needs to be home and we'll work around their
      availability.

  - q: "My ice maker is still under the manufacturer warranty — can you still help?"
    a: |
      If the unit is within the manufacturer warranty window — typically one year
      parts and labor, sometimes five years on sealed-system components — we'll
      tell you honestly whether to call the manufacturer first. Samsung and GE both
      have extended warranty programs that can cover ice maker components past the
      base period. Outside those windows, we work with most major home warranty
      companies operating in LA County — American Home Shield, Choice, First
      American — and know their documentation requirements. Have your contract
      info ready when you call (660) 999-9960 and we'll confirm the fastest path.

  - q: "How do I know whether to repair or replace the ice maker unit?"
    a: |
      If the refrigerator is cooling correctly and is under 12 years old, repair
      almost always wins the math. Ice maker modules on Frigidaire, Whirlpool, and
      GE units are modular by design — they swap out without touching the rest of
      the appliance. The calculation shifts when the compressor is also struggling,
      the evaporator coil has a refrigerant leak, or the unit is past 15 years.
      We give a straight answer on this when we diagnose — there's no upside for
      us in recommending unnecessary work. If the repair doesn't make economic
      sense, we'll say so.

  - q: "What other neighborhoods near Granada Hills do you cover?"
    a: |
      From Granada Hills we cover Northridge, Porter Ranch, Chatsworth, Sylmar,
      Mission Hills, and San Fernando to the east. To the south we run through
      Reseda and Canoga Park regularly. Evening and weekend appointments are
      available for residents who can't do weekday daytime — call (660) 999-9960
      to check what's open in the current schedule. Most calls across this whole
      northwest Valley corridor stay within our same-day window as long as you
      reach us before early afternoon.
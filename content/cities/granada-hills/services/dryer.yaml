title: "Granada Hills Dryer Repair — Gas Lines, Valley Heat & Real Fixes"

intro: |
  Gas dryers run the show in most of the 91344 zip code. The ranch homes
  around Balboa Boulevard were plumbed for gas back when they were built in
  the 1960s and early 70s, and a lot of them still have Whirlpool or Kenmore
  gas dryers that are 10-20 years deep into their service life. The San
  Fernando Valley heat makes it worse — a dryer exhaust system that's
  partially clogged runs hotter than it should, and the thermal fuse gives
  out faster when ambient temperatures in a garage laundry room are already
  pushing 90°F in July. Down in the residential stretches near Rinaldi Street,
  it's a sea of single-family homes with laundry rooms tucked off the garage
  or in a side hallway — access is usually fine, but old exhaust venting is
  often the culprit behind a machine that "sort of" dries but needs two full
  cycles to finish a load. That's a lint-buildup issue as much as a
  mechanical one, and it's fixable the same day we show up.

localContext: |
  Most of Granada Hills was built out between 1955 and 1975. The homes in
  the 91344 zip — especially around Zelzah Avenue and the streets feeding
  off the 118 Freeway — are three-bedroom ranches with attached garages, and
  the laundry setup is typically a small alcove between the kitchen and
  garage. That tight layout means the dryer exhaust vent often runs a short,
  straight shot to the exterior wall, which is fine. But in older 1960s
  builds on the hillside streets at the north end of 91344, near O'Melveny
  Park, some of those vents were routed up through the attic — a longer run
  that collects lint faster and is harder to clean. A 91343 address near the
  North Hills border might be dealing with an apartment-style laundry setup
  instead — stacked units, different venting rules entirely. Gas hookups are
  overwhelmingly common in both zip codes. Samsung and GE electric models do
  show up in remodeled homes, but if a Granada Hills customer calls about a
  dryer, there's roughly a 70% chance it's a gas machine.

commonProblems:
  - title: "Thermal Fuse Failure Caused by Valley Heat and Clogged Exhaust"
    description: |
      The thermal fuse is a one-shot safety device — once it blows, the
      dryer stops producing heat entirely, full stop. In Granada Hills
      garages during summer, ambient temps push the dryer's internal
      temperature high enough that a partially clogged exhaust vent becomes
      the last straw. Whirlpool and Kenmore gas dryers are especially prone
      to this because their thermal fuse sits close to the burner assembly
      and sees direct heat. The fix is replacing the fuse (usually a $15-25
      part) and clearing the exhaust vent at the same visit — skip the vent
      cleaning and the new fuse blows again within months. Total repair time
      is under two hours for most models. Cost runs $120-185 all-in, and
      parts for common Whirlpool and Kenmore platforms are stocked on
      the van.

  - title: "Worn Drum Rollers Behind That Grinding or Thumping Mid-Cycle"
    description: |
      Rhythmic thumping or grinding during a cycle is almost always the drum
      rollers. These small plastic-and-metal wheels support the drum as it
      spins, and after 8-10 years they develop flat spots or the bearings
      seize. GE and Frigidaire dryers from the mid-2010s are showing up
      regularly with this problem right now — those machines are hitting the
      8-10 year mark in Granada Hills homes. Drum rollers come in sets, so
      all of them get replaced at once rather than just the loudest offender;
      doing half the job leads to a callback in six months. The drum belt
      tensioner pulley often needs to go at the same time — it's right there
      and adds almost nothing to the parts cost. Full roller replacement
      runs $150-220 on most standard GE or Frigidaire units.

  - title: "Gas Valve Igniter Failing to Light the Burner"
    description: |
      A gas dryer that tumbles but blows cold air usually has a failed
      igniter or faulty gas valve solenoid coils. The igniter glows orange
      to light the burner — visible through the inspection panel on most
      units. If it glows but the burner never catches, the solenoid coils
      on the gas valve are the problem, not the igniter itself. This failure
      is specific to gas machines, which dominate the Granada Hills housing
      stock. Whirlpool, Kenmore, and Amana gas dryers all use similar
      igniter assemblies; the part runs $25-45, but labor is the bulk of
      the cost since accessing the burner assembly means partially
      disassembling the dryer. Full repair lands at $160-240 depending on
      model. Igniter and coil kits for the most common Whirlpool and Kenmore
      platforms travel on the van.

  - title: "Lint Buildup in Exhaust Ductwork Stretching Dry Times to 90 Minutes"
    description: |
      A dryer taking 90 minutes to finish what should be a 45-minute load
      is fighting a restricted exhaust duct. Lint accumulates along the
      entire run from the back of the machine to the exterior cap — not just
      at the lint trap. In the 1960s-era homes near O'Melveny Park, original
      aluminum flex duct runs are often crimped or partially crushed behind
      the dryer, which compounds restriction. The moisture sensor bars
      inside the drum also get coated with dryer-sheet residue over time,
      throwing off the auto-dry cycle and causing over-drying or early
      shutoff. Cleaning the full vent run and wiping down the moisture
      sensor usually brings dry times back to normal without any parts
      replacement. This service runs $85-130 depending on vent length and
      wall access. It also cuts fire risk — lint ignition in residential
      dryers is more common than most homeowners realize.

  - title: "Snapped Drive Belt Leaving the Drum Completely Dead"
    description: |
      A drum that doesn't spin at all — motor hums, nothing moves — is
      almost always a broken drive belt. The belt wraps around the drum,
      runs over the motor pulley, and loops through the belt tensioner
      pulley. On Samsung dryers, which are common in remodeled Granada Hills
      homes, it's a thin ribbed design that can snap without warning after
      5-8 years of regular use. The repair takes 45-60 minutes: open the
      cabinet, swap the belt, check the tensioner while you're already in
      there. If the tensioner pulley is worn — and on older machines it
      usually is — adding it to the job costs $20 in parts and 10 minutes
      of labor. Total cost for a belt replacement runs $110-175. On Amana
      and base Whirlpool units, this is one of the most cost-effective
      repairs possible since the machine itself has years of life left.

faq:
  - q: "How fast can you get to Granada Hills for a dryer repair?"
    a: |
      Same-day appointments are available most days. Granada Hills sits
      right off the 118 Freeway, which puts us 20-35 minutes out depending
      on Valley traffic — usually closer to 20 minutes mid-morning or early
      afternoon. Parking on the residential side streets off Balboa and
      Zelzah is almost never a problem. Call (323) 870-4790 and we can
      confirm a same-day window within a few minutes. Evening slots are
      open through 7 PM for customers who can't step away during work
      hours. Parts for Whirlpool, Kenmore, GE, Samsung, and Amana travel
      on the van, so most repairs close on the first visit without a parts
      run.

  - q: "What does a dryer repair in Granada Hills typically cost?"
    a: |
      Basic jobs — thermal fuse replacement, drive belt swap, vent cleaning
      — run $110-185 all-in, parts and labor. More involved repairs like
      gas valve igniter replacement, full drum roller sets, or a control
      board diagnosis land in the $160-280 range depending on the model and
      year. Diagnostic fee is $65, credited toward the repair if you book
      it the same day. Samsung and LG parts tend to run 20-30% more than
      equivalent Whirlpool or Kenmore parts due to supplier pricing. Call
      (323) 870-4790 for a same-day estimate — the full job price gets
      quoted before anything is touched.

  - q: "Do you need a permit for dryer vent work in Granada Hills?"
    a: |
      Standard dryer repair — swapping parts, clearing lint from the duct
      — does not require a permit in Los Angeles. Rerouting or replacing
      ductwork that penetrates an exterior wall is different; that falls
      under LAMC mechanical code and can trigger a city inspection depending
      on scope. Most vent cleaning and flex-duct straightening jobs in 91344
      homes stay well under that threshold. If a more significant vent
      reroute is needed, we can walk through what the city requires and
      whether additional sign-off applies. For the repair calls we handle
      day-to-day in Granada Hills, no permit process is involved.

  - q: "Can you repair gas dryers, or only electric models?"
    a: |
      Gas dryers are the majority of what we see in Granada Hills — the
      91344 and 91343 housing stock was built with gas hookups and most
      of it stayed that way. Gas valve igniter replacement, burner coil
      repair, flame sensor issues — all standard calls. The diagnostic
      approach differs from electric models since the heat circuit runs
      through the gas valve solenoids rather than a heating element, but
      labor time is comparable. Gas line modifications are outside scope
      (that's a licensed plumber or gas fitter), but everything from the
      valve forward on the dryer itself is fair game. Whirlpool, Kenmore,
      Amana, and GE gas units are the most common in this area.

  - q: "How long should a dryer last, and when does repair stop making sense?"
    a: |
      A well-maintained gas dryer should run 12-15 years without major
      issues. Electric models are similar. The repair-vs-replace math shifts
      when the repair cost exceeds 50% of what a comparable new unit runs
      at retail. A $200 fix on a Whirlpool that cost $700 new and is 8 years
      old? Usually worth it. The same $200 fix on a 14-year-old Amana that
      also needs a control board? Probably not — and we'll say so rather
      than take the repair money. Parts coverage on our work is 90 days on
      components, 30 days on labor.

  - q: "Do you cover areas near Granada Hills, or just 91344?"
    a: |
      Granada Hills is a regular stop, and surrounding coverage extends
      to Porter Ranch, Northridge, Chatsworth, Reseda, and Canoga Park.
      Scheduling is same-day or next-day for most of the northwest Valley.
      Calls from further out — Santa Clarita to the north, or out toward
      Simi Valley — are handled too, though same-day availability depends
      on drive time. Call (323) 870-4790 or book online and a window gets
      confirmed quickly. Evening slots through 7 PM are open most days
      for customers who need after-work availability.
title: "Sun Valley Ice Maker — Hard Water Wrecks Ice Makers in 91352"

intro: |
  The tap water coming out of 91352 faucets tests around 300 mg/L total dissolved solids — one of the harder municipal supplies in the San Fernando Valley. That calcium doesn't just spot dishes. Inside a refrigerator ice maker, it coats the fill tube, gunks up the water inlet valve, and gradually chokes off the whole system. GE side-by-sides and Whirlpool french-door refrigerators along Glenoaks Boulevard and in the apartment complexes near Vineland Avenue typically start showing trouble within 3-5 years: cubes get smaller, then hollow, then the tray stops filling entirely. By the time production stops completely, the inlet valve has usually been fighting mineral buildup for months. Ice maker calls in Sun Valley also spike in January, when overnight temps drop enough to freeze the supply line solid. Call us at (323) 870-4790 for same-day service — we run technicians through the San Fernando Valley daily, and 91352 is a short drive from most of our morning starting points.

localContext: |
  Between the 5 freeway and the 210 interchange, Sun Valley absorbs real Valley heat — 100-degree days from June through September push refrigerator compressors hard, which stresses the freezer compartment where the ice maker lives. Homes in 91352 tend to be 1950s and 1960s construction: tight kitchens, original cabinetry, limited clearance behind the refrigerator. Getting to the water supply line behind a Frigidaire or Samsung unit in a narrow kitchen on Tuxford Street can add 20 minutes to a job that would be quick in a newer open-plan house. The western edge of 91352 borders Arleta and Pacoima (91331), where older apartment buildings with compact built-in ice makers are common — units that were never designed to survive LA water without periodic flushing. Both zip codes are in our regular rotation. We know where to park a service van on residential blocks near the Sun Valley Recreation Center, and we carry the most common inlet valves, ice maker modules, and fill tubes for GE, Whirlpool, Frigidaire, and Samsung on every run.

commonProblems:
  - title: "No Ice at All — Mineral Scale Has Blocked the Fill Tube"
    description: |
      The most common Sun Valley ice maker complaint: the unit stops producing entirely, but the refrigerator runs fine otherwise. Usually the fill tube — the small plastic line that carries water from the supply valve into the ice mold — has calcified shut. On GE Profile refrigerators, this tube runs along the back wall of the freezer compartment and is the first component to scale up on LA city water. We see it so often in 91352 that fill tube cleaning tools are on every van. The repair involves flushing the tube and testing the water inlet valve solenoid coil; if it reads outside normal resistance (typically 200-500 ohms), the valve needs replacement. New GE inlet valve: $45-90 for the part. Total repair including labor usually lands $140-220. Most jobs done same day if the part is on the van.
  - title: "Small, Hollow Cubes — The Ice Maker Module's Harvest Cycle Has Slipped"
    description: |
      Undersized or misshapen cubes usually point to the ice maker module rather than the water supply. The module controls the harvest cycle — it heats the ice mold just enough to release the frozen batch, then signals the inlet valve to refill. When the mold heater element or the module's internal thermostat degrades, cycle timing goes off. Whirlpool and Maytag ice maker modules fail this way after 6-8 years of normal use; hard water in 91352 accelerates it by coating the mold surface and making cube release harder. The ice maker works more cycles, the heater runs longer, the thermostat wears faster. Replacing the Whirlpool ice maker module assembly runs $120-200 parts and labor — roughly an hour of work. A quick multimeter check confirms whether it's the module or something further upstream before we order anything.
  - title: "Supply Line Frozen Solid — January Cold Snaps Do This in the Valley"
    description: |
      Sun Valley doesn't get genuinely cold often, but January nights dropping to 36-38°F can freeze the refrigerator's water supply line when a few conditions line up: freezer temperature set too low, a degraded door gasket letting cold air pool at the bottom, or a fill tube positioned in a draft path inside the freezer. Samsung and LG french-door refrigerators are the most common offenders — the fill tube routes through the freezer door on many models, and once the gasket seal starts failing, that tube freezes solid. Symptom is usually an "Ice Off" error code or a harvest cycle that runs but produces nothing. Diagnosis involves carefully thawing the line, then checking the door gasket for gaps or warping. If the gasket needs replacement, expect $40-70 for most Samsung or LG models. We stock common gaskets for both brands.
  - title: "Water Inlet Valve Failure — Cost Breakdown and Why LA Water Speeds It Up"
    description: |
      The water inlet valve is a solenoid-controlled gate that opens on command to let water into the ice maker. In hard-water areas like 91352, mineral deposits build inside the valve body over time — restricting flow, then eventually seizing the solenoid coil until the valve fails completely. Frigidaire and GE both use dual-coil inlet valves: one coil for the ice maker, one for the door water dispenser. The ice maker coil fails first, and most homeowners don't notice until ice production stops entirely. Testing with a multimeter takes about 10 minutes on-site. If the coil is dead or the valve body is scaled shut, replacement is the call. Parts run $45-95 for standard Frigidaire, GE, or Kenmore valves. Labor adds $80-120. Expect $140-200 total. Call (323) 870-4790 — same-day scheduling available when the part is in stock on the van.
  - title: "Sensor Malfunction — Ice Maker Thinks the Bin Is Full When It's Empty"
    description: |
      Modern ice makers use an optical sensor or a mechanical bail arm to detect bin fill level. The optical sensor — an infrared emitter/receiver pair mounted on the ice maker housing — fails two ways: the emitter burns out, or frost bridges across the sensor beam and tricks the unit into shutting off production. Samsung four-door refrigerators see this frequently after 4-5 years; the sensor ices over repeatedly until it reads "full" regardless of actual bin level. Samsung publishes this as error codes 39-E or 40-E. LG refrigerators have a similar optical system with comparable failure rates. A frosted sensor often just needs a targeted defrost cycle plus inspection — no parts at all. If the optical board has failed outright, replacement runs $25-60 depending on model. A stuck or bent mechanical bail arm is simpler still: $15-20 for the part. Diagnosis is usually under 20 minutes.


  - q: "My Sun Valley home has older galvanized pipes — does that affect ice maker repair?"
    a: |
      It can. Galvanized supply lines, common in pre-1970s 91352 homes, corrode from the inside out over decades and shed debris into the water supply. Refrigerator water inlet valves have a small mesh screen at the inlet — in homes with galvanized pipes, that screen clogs with rust flakes and scale, restricting flow until the ice maker slows or stops. We test line pressure as part of every diagnosis; anything below about 20 PSI points to supply issues upstream. The fix is usually cleaning or replacing the inlet screen and flushing the valve body. No plumber visit required for the ice maker side. If pressure is severely restricted at the whole refrigerator connection, that's a separate plumbing call we'll flag for you.
  - q: "Do you repair Samsung and LG ice makers, or just older American brands?"
    a: |
      Both. Samsung and LG have a reputation for finicky ice makers, and it's mostly earned. Samsung's french-door and four-door models use optical sensors that ice over, and the ice maker assembly is often a sealed module requiring full replacement rather than individual component repair. LG's craft ice makers — the round-ball cube units in newer french-door models — have their own failure pattern around the auger motor and ice tray rotation. We work on both platforms regularly. For Samsung units showing error codes 39-E, 40-E, or 22-E, diagnosis is usually clear within 20 minutes. Call (323) 870-4790 and describe what the display shows — we can often narrow the cause before the technician arrives.
  - q: "What warranty do you offer on ice maker repairs?"
    a: |

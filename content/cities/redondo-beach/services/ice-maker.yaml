title: "Redondo Beach Ice Maker Repair — Hard Water Off the Bay"

intro: |
  Salt air rolling in off King Harbor is rough on outdoor hardware — but the Metropolitan
  Water District supply feeding 90277 and 90278 is what quietly wrecks most ice makers in
  Redondo Beach. Mineral scale packs the water inlet valve screen solid within a few years,
  flow drops below what the ice maker module needs to fill a tray, and production just stops.
  The KitchenAid built-in up in the Hollywood Riviera, the LG french-door in a Seaside
  Village condo — both land on our schedule with the exact same failure pattern, usually
  before the appliance hits year four.

localContext: |
  Hollywood Riviera, straddling the Redondo-Torrance border near Palos Verdes Drive North,
  has a dense cluster of 1960s ranch homes that got kitchen remodels in the 2010s — Sub-Zero
  and Thermador built-ins dropped into cabinets that were never dimensioned for them. Tight
  clearances mean ice maker work sometimes requires partial cabinet removal just to reach the
  fill line and inlet valve assembly. Zip 90277 runs right down to the shoreline, where salt
  humidity accelerates corrosion on exposed fittings and line connections. North Redondo in
  90278 leans denser — apartment clusters near Aviation Boulevard mostly run Samsung or LG
  units in galley kitchens where access is tight but workable.

commonProblems:
  - title: "Water Inlet Valve Clogged by South Bay Mineral Scale"
    description: |
      Redondo Beach tap water sits around 250-300 mg/L total dissolved solids most of the
      year. That mineral load coats the inlet valve screen on a KitchenAid or LG refrigerator
      until flow drops below what the ice maker module needs to complete a fill cycle. The
      solenoid also loses stroke from calcification — flushing the line doesn't fix it. The
      valve itself has to come out and get replaced, typically $90-130 in parts.

  - title: "Fill Tube Iced Solid — Motor Cycles But the Bin Stays Empty"
    description: |
      Samsung and LG french-door models route the fill tube close to the freezer back wall.
      If the freezer thermostat drifts even two degrees cold as it ages, that tube freezes
      overnight into a solid plug. You'll hear the ice maker assembly trying to cycle normally,
      but nothing drops into the bin. Manually defrosting buys about a week. Replacing the
      thermostat is the actual fix — and it's a straightforward swap.

  - title: "Optical Sensor Failure in Hollywood Riviera Sub-Zero Built-Ins"
    description: |
      Sub-Zero and Thermador refrigerators use a hall-effect or optical sensor to detect when
      the ice bin is full. Coastal particulate — fine salt dust, humidity — collects on the
      sensor optics and triggers false "bin full" readings. Ice production shuts off even with
      an empty bin. Cleaning the sensor sometimes works. More often the sensor assembly needs
      replacement, which runs about $95-140 in parts and is usually done in a single visit.

faq:
  - q: "How fast can you get to Redondo Beach for an ice maker call?"
    a: |
      Redondo Beach sits right on our South Bay daily route — Manhattan Beach, Torrance, and
      El Segundo are all nearby stops. From your call, expect us there within 1-2 hours.
      Parking near the Riviera Village area or alley-access streets off Catalina Avenue can
      be tricky, but we work around it. Call (323) 870-4790 to get on today's schedule.

  - q: "Do you repair Sub-Zero and KitchenAid ice makers, or only standard brands?"
    a: |
      Both. Sub-Zero built-ins and KitchenAid french-doors are the premium brands we see most
      often in the Hollywood Riviera and Esplanade areas. Samsung and LG are constant too —
      fill valve clogs and sensor faults on those are nearly weekly calls across South Bay zip
      codes. Sub-Zero ice maker modules need specific extraction tools; we carry them.

  - q: "What does an ice maker repair usually cost, and is same-day service available?"
    a: |
      Diagnosis happens at the start of the visit — usually clear within 20 minutes on-site.
      A water inlet valve replacement runs $130-185 in parts and labor. Ice maker assembly
      or control board work lands closer to $200-290 depending on the brand. Same-day
      appointments are available most days, including evening slots. Book at (323) 870-4790
      or schedule online — emergency calls welcome.
title: "Redondo Beach Dishwasher Repair — Hard Water & Coastal Salt Fix"

intro: |
  Salt air off King Harbor does a number on appliances closer to the coast — and
  dishwashers take it quietly until they don't drain or the spray arm stops spinning
  entirely. That Bosch 800 Series built into the kitchen remodel on Prospect Avenue
  handles mineral buildup differently than a standard unit. Redondo Beach runs on
  Metropolitan Water District supply, and the calcium load in 90277 is enough to
  calcify a detergent dispenser in under two years of regular use.

localContext: |
  North Redondo Beach — zip 90278 — is dense with 1960s and 70s tract homes and
  two-story condos where dishwasher access means pulling the unit from a tight
  cabinet with zero wiggle room. South Redondo and the Hill Section skew newer and
  larger, with panel-ready KitchenAid and Miele units installed flush into custom
  cabinetry. Beach-adjacent homes in 90277 get extra humidity cycling through the
  kitchen, which accelerates door gasket wear and corrodes the door latch assembly
  faster than you'd see ten miles inland.

commonProblems:
  - title: "Spray Arm Clogging from Hard Water Mineral Scale"
    description: "MWD water running through Redondo Beach homes deposits calcium
      faster in dishwashers than almost anywhere in LA County. The spray arm ports
      clog first — water pressure drops, the top rack comes out greasy, and most
      homeowners blame detergent. On Bosch units, the lower spray arm snaps off
      for cleaning; on KitchenAid built-ins, you need to pull the filter basket
      assembly first. Descaling helps short-term, but a compromised inlet valve
      will keep the cycle repeating."

  - title: "Standing Water After the Cycle — Drain Pump Failure"
    description: "A pool of cloudy water at the bottom of the tub after a full
      cycle usually points to the drain pump, not a clogged filter. LG dishwashers
      in this area throw an OE error code when the pump can't clear the water;
      Samsung units often just stop mid-cycle with no code at all. Food debris
      combined with LA hard water deposits creates a sludge that kills the impeller
      blade inside the pump housing within three to four years of heavy use."

  - title: "Door Latch Assembly Failure on Coastal-Area Units"
    description: "The humidity cycling near the beach — especially in homes within
      six blocks of the Esplanade — corrodes the door latch assembly on plastic-
      bodied units within a few years. Miele dishwashers handle this better than
      most, but even their door lock mechanism fails when the strike plate warps.
      The symptom: door feels loose, unit won't start, or mid-cycle the door
      pops open. Replacing the full latch assembly is usually a one-hour job."


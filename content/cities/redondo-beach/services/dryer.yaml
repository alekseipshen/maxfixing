    a: "From our South Bay route, Redondo Beach is usually 30-45 minutes out. We have morning, afternoon, and evening slots available. Call (323) 870-4790 and we can often schedule same-day — or book online if you'd rather not wait on hold."
  - q: "Do you repair Bosch and Samsung dryers specifically?"
    a: "Yes — both are common in Redondo Beach and we carry parts for them. On Samsung front-loaders, we most often replace drum rollers and heating elements. Bosch heat-pump dryers need a different diagnostic approach; we have the tools for those."
  - q: "What does dryer repair typically cost in Redondo Beach, and how does the process work?"
    a: "Diagnostic is $75, applied to the repair if you proceed. Most fixes — thermal fuse, drive belt, drum roller — run $150–$280 parts and labor. We quote before touching anything. Emergency same-day calls get priority dispatch; just mention it when you call."

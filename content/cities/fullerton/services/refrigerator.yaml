title: "Fullerton Refrigerator — OC Hard Water Kills Ice Makers Fast"

intro: |
  Raymond Hills and the neighborhoods along Harbor Boulevard have a lot of 1960s ranch
  homes — kitchens just wide enough for a 33-inch fridge, and the LG french-doors that
  replaced the originals barely clear the cabinet trim when the door swings. Orange County
  hard water is genuinely aggressive here: calcium deposits clog ice maker water lines
  inside 18 months. We cover Fullerton every day, including same-day calls to 92835 and
  92831.

localContext: |
  The 92832 zip has older apartment stock near downtown and Fullerton College — compact
  kitchens, closet-style refrigerator alcoves, service vans need street parking. Up in
  92835 near Sunny Hills, KitchenAid and Bosch counter-depth built-ins are common in
  remodeled kitchens, and those require panel removal to reach the condenser fan. Post-war
  bungalows to 1980s tract homes to newer infill — no two calls look alike.

commonProblems:
  - title: "Ice maker stopped — OC mineral buildup clogs the water inlet valve"
    description: "Fullerton's water hardness runs around 300–400 mg/L, high enough to
      calcify the water inlet valve and jam the ice maker assembly solid in under two
      years. The LG french-door models with the bottom-freezer ice maker are especially
      prone. A full descale plus valve swap usually closes it in one visit."
  - title: "Fridge running warm — compressor short-cycling in summer heat"
    description: "Fullerton hits 95°F+ through August and September. A refrigerator
      straining in a hot kitchen can develop a failing start relay on the compressor —
      Samsung 4-door flex units sometimes throw error code 1E or 14E before the
      compressor quits entirely. Catching a bad relay early is a $40 part versus a
      $600 compressor job."
  - title: "Water pooling under the crisper drawer — frozen defrost drain line"
    description: "Ice builds on the evaporator coil, melts, and refreezes in the drain
      tube instead of reaching the drip pan. KitchenAid and Bosch side-by-sides in the
      92835 zip see this regularly, especially units pushing 8–10 years old. Takes about
      an hour to clear, flush, and reseal the drain properly."

faq:
  - q: "How fast can you get to Fullerton for a refrigerator repair?"
    a: "Usually within 2 hours for calls placed before noon. We run Orange County routes

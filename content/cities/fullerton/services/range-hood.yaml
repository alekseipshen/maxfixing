    a: "Same-day coverage for 92831 through 92835 — access through the 91 and
      57 makes Raymond Hills and Downtown Fullerton straightforward from our
      route. Usually on-site within 2 hours of your call. Reach us at
      (323) 870-4790 to check morning or evening availability."
  - q: "Do you repair Bosch and KitchenAid range hoods?"
    a: "Both are common in Fullerton homes. Bosch wall-mounts frequently need
      motor capacitor replacement or duct baffle realignment. KitchenAid
      under-cabinet units usually come in for blower wheel cleaning or control
      board swaps. Thermador inserts in the larger Raymond Hills kitchens —
      those too, with the right tools on hand."
  - q: "What does range hood repair cost, and do you carry parts?"
    a: "Blower wheel cleaning with motor inspection runs $95–$145. Motor or
      control board replacement is $180–$320 depending on brand. Same-day
      completion is standard — we stock common parts for Bosch, KitchenAid,
      and Samsung. Diagnose first, quote before we touch anything. Evening
      slots available; call (323) 870-4790."
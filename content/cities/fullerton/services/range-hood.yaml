title: "Fullerton Range Hood — Old Duct Layouts, Grease Buildup Fixed"

intro: |
  Ranch-style homes along Bastanchury Road and through the Raymond Hills
  neighborhood were built for 1960s cooking — low-BTU burners, minimal
  grease, maybe a basic exhaust fan above the stove. Decades later,
  homeowners drop in a Bosch or KitchenAid wall-mount hood and the
  original ductwork can't keep up. Motor struggles, grease saturates the
  blower wheel, and the ventilation that should pull smoke out just
  doesn't.

localContext: |
  Most of the housing stock in zip codes 92832 and 92835 was built between
  1950 and 1985 — solid construction, but with duct runs that weren't sized
  for modern hood CFM ratings. The older neighborhoods near Downtown
  Fullerton and the streets around Craig Regional Park see compact duct
  configurations, sometimes running up through cabinets, sometimes routed
  sideways through a soffit. Both situations create back-pressure that
  accelerates motor wear over time.

  Fullerton sits in the inland Orange County corridor where summer
  temperatures regularly top 95°F — kitchens in the 92833 zip code and
  along Chapman Avenue heat up fast when the range is running. That heat
  loads the blower motor harder than the manufacturer's specs assumed. The
  mix of gas ranges (common throughout the Raymond Hills and Sunny Hills
  tracts) and tight original ductwork means grease aerosol lingers longer
  before exhausting.

  Homes near Cal State Fullerton — especially the blocks north of Nutwood
  Avenue and east of State College Boulevard, mostly built in the early
  1970s as the student population expanded — tend to have the narrowest
  duct chases. Four-inch round where a 6-inch should be. Upgrading a hood
  there without addressing duct size is a short-term fix at best.

  The Amerige Heights development in 92833, built in the late 1990s and
  early 2000s, tells a different story. Those homes came with recirculating
  hoods factory-installed above glass cooktops — no exterior duct at all.
  Charcoal filter saturation is the main call we get from that area. The
  Orangethorpe corridor, running east from the 57 freeway toward the
  Brea border, mixes older tract homes with 1980s condos; both have
  undersized duct collars that restrict airflow on any hood above 400 CFM.
  Inland OC hard water also accelerates mineral deposits inside the grease
  trap housing — Fullerton's water supply tests consistently hard,
  around 300–400 ppm, which shows up as white calcification on metal
  filter frames and inside the duct collar over time.

commonProblems:
  - title: "Grease-Packed Blower Wheel Killing Airflow"
    description: "Fullerton's older homes often have short duct runs with tight turns,
      which means grease aerosol doesn't fully exit — it coats the blower
      wheel instead. Once the wheel is packed, the motor works harder and
      hotter. On KitchenAid under-cabinet models above gas ranges, we see
      this every few years. A thorough cleaning and motor inspection usually
      catches it before the motor burns out entirely. If the wheel is badly
      fouled, the motor capacitor fails next — that's when the hood hums but
      won't spin up to full speed."
  - title: "Rattling and Humming at High Speed"
    description: "That vibration noise is often a loose duct baffle or a worn motor
      mount — not the blower itself. Bosch wall-mount hoods are popular in
      the 92831 and 92835 zip codes, and the complaints we get usually trace
      back to grease filter tabs that stop holding the filter flat. The
      filter bounces against the housing, resonates, and sounds far worse
      than the actual problem. Catching it early means cleaning and
      reseating the filter; ignored long enough, the vibration walks the
      baffle screws loose and you're looking at a duct baffle replacement."
  - title: "Exhaust Duct Blockage from Roof Vents"
    description: "Fullerton summers run hot, and roof exhausts attract birds and rodents
      looking for nesting spots. A blocked duct backs pressure into the hood
      and the charcoal filter saturates fast. Samsung and LG wall-mount hoods
      with plastic duct collars are especially vulnerable — debris accumulates
      right at the collar connection, and the control board eventually throws
      a fault that reads like an electrical failure. Homes on the east side
      near Brea Canyon Road see this more often because of the mature
      tree canopy; a professional duct flush and damper inspection clears it
      for good."

faq:

title: "Fullerton Dryer Repair — Gas Lines, Old Ducts & Summer Heat"

intro: |
  Fullerton's older neighborhoods near Downtown — think the streets around
  Commonwealth Avenue and the 92832 corridor — have gas dryer hookups that
  haven't been touched since the 1970s. That Bosch condensation dryer or the
  LG front-loader stacked in a tight laundry closet runs into problems fast
  when the exhaust duct hasn't been cleaned in years. Call us at (323)
  870-4790 and we're usually there within 2 hours.

localContext: |
  The housing stock in Fullerton splits pretty cleanly: postwar ranch homes
  from the 1950s-60s in the 92833 zip, and newer tract developments closer
  to Brea Canyon. Older homes near Cal State Fullerton — compact utility
  rooms, sometimes vented into the garage — create real lint traps inside
  the blower wheel and exhaust line. Newer builds further south run Samsung
  and LG stacked units in narrow laundry alcoves with zero clearance behind
  the machine.

commonProblems:
  - title: "Dryer runs but clothes stay damp — blower wheel clogged with lint"
    description: "In older Fullerton homes with short, kinked duct runs, lint
      bypasses the filter and packs directly into the blower wheel. The drum
      spins, heat comes on, but airflow is almost zero. Samsung and LG units
      throw a d80 or d90 error at this point. Cleaning the wheel and
      re-routing the duct usually solves it same visit."
  - title: "No heat at all — thermal fuse blown from overheating"
    description: "A dryer that tumbles but produces zero heat almost always
      means a blown thermal fuse. It's a one-way safety device — once it
      trips, the heating element gets no power. This happens a lot in
      Fullerton during summer when garage temps push past 90°F and the
      machine already runs hot. Bosch and KitchenAid gas models have the
      fuse tucked behind the drum — not a quick swap if you don't know
      where to look."
  - title: "Loud grinding noise during spin — drum roller worn out"
    description: "That metal-on-metal grinding from an LG or Whirlpool dryer
      mid-cycle is almost always the drum roller bearings breaking down.
      Leave it alone and the drum starts dragging, putting load on the
      drive belt until it snaps. Replacing the rollers before the belt goes
      is about half the cost of replacing both. We stock the common sizes
      for LG and Samsung units."

faq:
  - q: "How fast can you get to Fullerton for dryer repair?"
    a: "We cover Fullerton from our Orange County route — Harbor Boulevard
      to Yorba Linda Boulevard is a straight shot. Same-day slots available
      most days, evening appointments too. Call (323) 870-4790 or schedule
      online and we'll confirm your window within the hour."
  - q: "Do you repair Bosch and KitchenAid dryers?"
    a: "Yes — Bosch heat-pump and condensation dryers, KitchenAid gas and
      electric, plus LG, Samsung, Whirlpool, and GE. On Bosch units we
      commonly replace the moisture sensor bars and drain pump; on KitchenAid
      it's usually the heating element or gas valve igniter."
  - q: "What does dryer repair typically cost in Fullerton?"
    a: "Diagnostic is $65, applied to the repair if you proceed. A thermal
      fuse or belt tensioner replacement runs $120–$160 parts and labor.
      Drum roller replacement is $150–$200 depending on the model. We give
      you the exact number before touching anything — no surprises. Emergency
      same-day slots are available at no extra charge."

title: "Fullerton Range Repair — Gas Burners & Oven Issues Fixed"

intro: |
  Historic Downtown Fullerton and the hill neighborhoods climbing into 92835 are packed
  with KitchenAid dual-fuel ranges — homeowners here cook seriously and notice fast when
  something goes wrong. A burner that clicks but never lights, or an oven running 50
  degrees cold, kills dinner and raises safety questions with gas. Call us at (323) 870-4790
  and we cover all of Fullerton, usually same day you call.

localContext: |
  The housing stock swings wide here. Post-war ranches along Harbor Boulevard sit a
  mile from newer subdivisions off Bastanchury Road in 92835. Older homes often have
  gas ranges that haven't been touched in a decade — clogged burner ports, cracked
  igniter ceramics, corroded wiring. Newer builds frequently come standard with Bosch
  or LG slide-ins, which need brand-specific diagnostic tools the moment the control
  board starts acting up.

  Sunny Hills (92835) is its own category. Those larger lots north of Bastanchury pull
  hard toward Thermador and KitchenAid Pro ranges — $4,000 appliances that homeowners
  expect to last 20 years. Parking is easy up there. Downtown Fullerton (92832) is
  different: older bungalows near Chapman University often have tight kitchens with
  freestanding 30-inch ranges jammed under low cabinets, making igniter work awkward.
  Raymond Hills sits in between — 1970s construction, original gas lines, and ranges
  that have never had a service call.

  Cal State Fullerton sits in 92831, and that whole corridor along Nutwood Avenue has
  a mix of rental properties and owner-occupied homes. Rental units tend to have
  mid-range Samsung or LG freestanding ranges that get heavy use. Control boards fail
  faster when tenants don't clean the grease buildup around the burner sockets — moisture
  gets trapped and the spark module shorts. West Fullerton near the 57 freeway skews
  older, with gas ranges from the early 2000s that are worth repairing rather than
  replacing. A $180 igniter swap on a Maytag or GE range beats buying new.

commonProblems:
  - title: "Gas Burner Clicks Endlessly But Won't Light"
    description: "That rapid clicking after the flame dies points to a failed spark igniter
      module or a cracked igniter electrode — moisture or grease gets into the housing and
      the ceramic splits. Very common on KitchenAid six-burner models in Fullerton's older
      kitchens. On dual-fuel units, the igniter wiring harness corrodes near the burner box
      faster than most homeowners expect. Replacing the igniter assembly usually runs under
      an hour once we're on site."
  - title: "Oven Stalls at Low Temperature and Won't Climb"
    description: "A Bosch or Thermador oven that hits 200°F and stops climbing is usually
      a failing bake element or, on gas models, a weak gas valve igniter that can't sustain
      enough glow to light the burner. Ignoring it is a bad idea — a partially working
      igniter can release unburned gas into the cavity. Thermador dual-fuel units in Sunny
      Hills homes sometimes throw an F34 or E1 error code before the oven stops heating
      entirely; that's the control board flagging a temperature sensor fault. Get it
      diagnosed before it gets worse."
  - title: "Touchscreen Control Panel Freezes or Throws Error Codes"
    description: "Samsung and LG ranges with digital controls can lock up or flash codes
      like SE or C-d0 after a power surge or firmware hiccup. Sometimes a hard reset clears
      it; sometimes the control board itself is failing. Fullerton's older electrical panels —
      especially in the 92832 and 92833 zip codes near the older residential blocks off
      Commonwealth Avenue — send irregular voltage that degrades control boards over time.
      If your panel still has the original breakers from the 1980s, that's part of the story."

faq:
  - q: "How fast can you get to Fullerton for range repair?"
    a: "Most days we can be in Fullerton within 2 hours of your call. From our nearest
      technician the drive is 20-30 minutes depending on the 91 freeway. Call (323) 870-4790
      — we have evening slots if daytime doesn't work for you."
  - q: "Do you repair Bosch and KitchenAid ranges specifically?"
    a: "Both are very common in Fullerton, especially in the 92835 zip. We carry KitchenAid
      igniter assemblies and Bosch bake elements on the truck regularly. Thermador dual-fuel
      units and LG slide-ins are in the rotation too. Describe what yours is doing and we'll
      tell you upfront what parts we'll likely need — no guessing once we're on site."
  - q: "What does a range repair usually cost in Fullerton?"
    a: "Most common fixes — igniter swap, bake element replacement, gas valve igniter —
      run $150-$300 parts and labor combined. Control board replacements on Samsung or LG
      units run higher, closer to $250-$400 depending on the part. We quote on-site before
      touching anything. Same-day emergency service available at (323) 870-4790, no surprise
      add-ons after the fact."
  - q: "My oven smells like gas when I try to light it. Is that dangerous?"
    a: "Yes, take it seriously. A gas smell before ignition usually means the gas valve
      igniter is too weak to light quickly — gas is flowing but not burning, so it accumulates.
      Turn the range off, ventilate the kitchen, and don't use it until it's checked. Schedule
      a same-day appointment at (323) 870-4790 — this is one of those calls we prioritize."
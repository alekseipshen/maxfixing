title: "Manhattan Beach Dishwasher — Hard Water vs. High-End Appliances"

intro: |
  Saltwater air and coastal living look great. What it does to your dishwasher, less so. The
  beach cottages and full remodels clustered around The Strand in 90266 all run on the same
  LA municipal water — 300+ ppm calcium carbonate, minimum. That Miele G7000 built flush
  into your custom cabinetry is quietly accumulating mineral scale in the spray arm jets
  every single cycle. Most owners don't notice until the bottom rack stops cleaning.

localContext: |
  Manhattan Beach housing is split between 1940s–1960s original beach cottages on tight
  30-foot lots and newer $4M+ remodels with fully integrated appliances. In the Hill area,
  Bosch and Thermador panel-ready units are standard — flush-mounted behind custom doors,
  requiring specific removal tools to pull for service without damaging cabinetry. Zip code
  90266 covers both: the narrow-lane bungalows near Manhattan Beach Pier where parking a
  service van is its own puzzle, and the broader streets of east Manhattan where access is easier.

commonProblems:
  - title: "Spray Arm Clogging from Calcium Deposits — Fine-Bore Jets, Big Problems"
    description: "LA water here sits between 280 and 320 ppm hardness. Over 12–18 months,
      calcium carbonate fills the small-bore holes in the lower and upper spray arms until
      water pressure drops and the back of the bottom rack stays dirty. Miele and Bosch
      units have precision-machined spray arm assemblies — generic descaling tablets rarely
      clear blockages this deep. Full spray arm replacement plus an inlet valve inspection
      usually solves it."

  - title: "Standing Water After the Cycle — Drain Pump Failures on Panel-Ready Units"
    description: "An inch of cloudy water pooling in the tub after a full cycle almost always
      points to the drain pump impeller or a clogged filter assembly. KitchenAid and Bosch
      models in Manhattan Beach kitchens see this regularly — food debris combines with
      hard-water sediment into a paste that seizes the impeller. Left alone, the control
      board can throw an E24 or E25 error and lock the unit out entirely."

  - title: "Detergent Dispenser Stuck Closed — Wash Cycles That Do Nothing"
    description: "The dispenser door relies on a small wax motor or bi-metal actuator to
      open mid-cycle. Mineral residue from hard water gums up the spring mechanism, and the
      pod or powder just sits undissolved at the bottom. Thermador and Miele units are
      especially prone to this because their dispensers are positioned low on the door
      where rinse water splash deposits buildup fastest. Replacing the dispenser assembly
      fixes it; cleaning rarely does."

faq:
  - q: "How fast can you get to Manhattan Beach for a dishwasher repair?"
    a: "Same-day slots are usually available. From our South Bay coverage area, Manhattan
      Beach is 20–35 minutes depending on time of day — PCH traffic is the main variable.
      We work around beach parking logistics too. Call (323) 870-4790 to confirm a morning
      or afternoon window."

  - q: "Do you repair Miele, Bosch, and Thermador dishwashers?"
    a: "Yes — those three are the bulk of what we see in Manhattan Beach. Miele error codes
      F11/F70, Bosch drain faults (E24/E25), Thermador door latch assemblies and control
      board resets. We carry common parts for all three. Bring the model number if you
      have it and we can often confirm part availability before showing up."

  - q: "What does a dishwasher repair typically cost, and is same-day service available?"
    a: "Diagnosis is a flat fee applied toward the repair. Most drain pump swaps, spray arm
      replacements, or dispenser fixes run $150–$280 in parts and labor. Control board
      replacements on high-end units run higher. Evening and weekend slots are available —
      schedule online or call (323) 870-4790 for emergency same-day service."
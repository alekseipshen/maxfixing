    a: "South Bay routes run through here daily — typically on-site within 2 hours
      of your call. Sepulveda Blvd is the main artery down from Hawthorne; parking
      near the beach is tight in summer but workable most days. Call (323) 870-4790
      or schedule online for same-day slots."
  - q: "Do you service Miele and Bosch dryers in Manhattan Beach?"
    a: "Yes — Miele, Bosch, and Thermador are the machines we see most in this zip.
      Common jobs: moisture sensor replacement on Miele heat-pump models, control
      board faults on Bosch Series 800 units, drum roller wear on Thermador stacked
      pairs. OEM parts carried for all three."
  - q: "What does dryer repair typically cost, and can you come today?"
    a: "Diagnostic visit is flat-rate; most repairs — heating element, thermal fuse,
      drum bearing — finish same visit. Evening slots available for households
      that can't do weekday mornings. Same-day service is usually available;
      call (323) 870-4790 to check today's open slots."
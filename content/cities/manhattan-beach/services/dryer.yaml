title: "Manhattan Beach Dryer Repair — Salt Air, Tight Closets"

intro: |
  Salt air rolling off the Pacific does real damage to appliance internals in the
  90266. The Miele heat-pump dryers and Bosch condensation units in newer builds
  near The Strand develop moisture sensor errors faster than anything you'd see
  inland — machine runs full cycles, clothes come out damp. Call us at
  (323) 870-4790 and we're usually in Manhattan Beach within 2 hours.

localContext: |
  El Porto's original surf cottages and the 1950s–60s bungalows on Manhattan
  Avenue were built before dedicated laundry rooms existed. Dryer venting here
  is retrofitted — short flex duct, a hard 90-degree elbow or two, and an
  exterior wall termination that faces straight into the sea breeze. Lint
  accumulates fast in those bends. North of Manhattan Beach Blvd, newer
  construction packs stacked Bosch or Miele units into utility closets where
  reaching the back panel means disassembling half the setup first.

commonProblems:
  - title: "Thermal Fuse Blows Repeatedly in El Porto's Older Beach Cottages"
    description: "Restricted exhaust ducts in retrofitted bungalows force the dryer
      to run hotter than rated. The thermal fuse — a one-shot safety component —
      trips and the machine goes cold. Samsung and LG gas dryers in 90266 are
      the repeat offenders here. Fix the vent restriction first, or the replacement
      fuse blows within a week."
  - title: "Drum Stops Spinning on Compact Bosch and Miele Stacked Units"
    description: "Drive belt tensioner failures are common in the European-platform
      dryers jammed into Manhattan Beach utility closets. The belt itself looks
      intact, but the tensioner pulley seizes or cracks and the drum stops cold.
      Diagnosis requires full disassembly — not a 20-minute job when a 24-inch
      washer is stacked directly on top."
  - title: "Heating Element Burnout in Viking and Thermador Electric Laundry Pairs"
    description: "Larger homes in the Tree Section and along The Strand run Viking
      and Thermador electric laundry pairs. Heating element failures in these
      machines use proprietary components, not generic hardware-store parts. A
      clogged blower wheel is usually the root cause — it backs up exhaust heat
      until the element cooks itself."

faq:

title: "Manhattan Beach Cooktop — Viking, Wolf & Thermador Service, South Bay"

intro: |
  The Hill Section homes between Manhattan Avenue and Ardmore Avenue run some of
  the nicest cooking setups in the South Bay — 36-inch Wolf and Viking gas
  cooktops buried in custom cabinetry, sealed burners, heavy cast iron grates.
  Salt air off the Pacific corrodes igniter electrodes faster than anywhere
  inland. A burner that clicks but won't catch, or a simmer flame that randomly
  surges — those calls come in constantly from 90266. Usually a fouled spark
  module or a corroded gas valve seat. Both are same-day fixes.

localContext: |
  Manhattan Beach (90266) has two very different kitchen profiles. Near the
  Strand and the Sand Section, gut-renovated beach cottages hold Thermador,
  Miele, and Wolf built-ins — full kitchen buildouts running $80K and up.
  Further east toward Aviation Boulevard and the older blocks near Sepulveda,
  the housing shifts to 1960s ranch homes where KitchenAid and GE gas cooktops
  have been running for twenty-plus years. El Porto kitchens are compact, street
  parking is tight, and rear access often runs through a single-car garage — we
  plan the visit accordingly.

commonProblems:
  - title: "Igniter clicks continuously but burner won't light — marine air corrodes electrode tips"
    description: |
      The igniter electrode on a Wolf or Viking gas cooktop sits millimeters from
      the burner cap. Salt air and cooking grease combine into a conductive film
      on the ceramic tip — the spark fires but grounds out before it can ignite
      the gas. Replacing the electrode tip and cleaning the burner cap ports
      resolves it in most cases. On Wolf dual-fuel units, the spark module itself
      can fail, which means the igniter gets no voltage at all — flipping the
      switch does nothing and the surface igniter control board needs to be
      tested with a multimeter before ordering parts. Misdiagnosing this as an
      electrode problem wastes a trip and the customer's time.

  - title: "Cracked ceramic surface on Miele or Bosch induction tops — thermal shock in beach kitchens"
    description: |
      Induction cooktops with glass-ceramic surfaces see more cracking in coastal
      homes because the kitchen temperature swings from cool marine air to cooking
      heat are sharper. A Miele KM 6000 or Bosch induction unit with a cracked
      glass panel loses heat transfer uniformity and creates real shock risk.
      Sourcing the replacement glass panel is model-specific — we verify part
      availability before scheduling so the repair wraps in one visit, not two.

  - title: "Uneven heat across burners — clogged orifices on older Thermador Pro Harmony units"
    description: |
      Thermador Pro Harmony cooktops installed during the 2010-2015 remodel wave
      around 90266 are hitting the age where burner orifices clog with mineral
      deposits and grease carbon. One burner runs full pressure while the adjacent
      one barely hits medium. This isn't a gas pressure issue — it's a blocked
      orifice and a gas valve needle that's partially fouled. Cleaning the ports
      and recalibrating the valve brings output back to the rated BTU across all
      six burners. On units showing an F2 or E3 fault code on the display, the
      control board may also need a firmware reset after the mechanical work is
      done.

faq:
  - q: "How fast can you get to Manhattan Beach for a cooktop repair?"
    a: |
      South Bay is a daily route for us — Torrance, Redondo, Hermosa, Manhattan
      Beach all in one run. From dispatch to your door in 90266 is typically
      under 45 minutes. El Porto and Sand Section parking doesn't slow us down;
      we've worked those streets before. Call (323) 870-4790 to lock in same-day
      service, including evening slots.

  - q: "Do you repair Viking, Wolf, and Thermador cooktops specifically?"
    a: |
      Yes — those are the three we see most in this zip code. Viking: igniter
      module and sealed burner valve replacements. Wolf: spark module failures and
      dual-fuel control board resets. Thermador: burner orifice cleaning and
      simmer flame calibration. Miele induction glass panels and control boards
      too. We carry parts for most common failures on the truck.


title: "West Hollywood Wine Cooler — Compact Units & Built-Ins Fixed Fast"

intro: |
  Sunset Strip condo conversions in 90069 often have Bosch dual-zone built-ins tucked
  into cabinetry that was retrofitted into 1960s kitchens — beautiful install, terrible
  airflow. The condenser fans in those units run hot all summer. On the apartment side of
  West Hollywood, along Fountain Ave and Laurel Ave in 90046, KitchenAid undercounters
  get squeezed into spaces with barely an inch of rear clearance. Either way, the repair
  call usually comes after a warm bottle, not a weird noise.

localContext: |
  Most of West Hollywood's housing is 1960s to 1970s construction — multi-unit buildings
  between Santa Monica Blvd and Fountain Ave (zip codes 90046 and 90048) with narrow
  kitchens, tight cabinet clearances, and no dedicated ventilation for undercounter
  appliances. Service vans park on side streets like Larrabee or Edindale — underground
  garages with no guest access are the norm here. The buildings along Romaine St and
  Willoughby Ave are a good example: six-unit stucco complexes where every kitchen is a
  galley and the wine cooler sits where a dishwasher would normally go. Newer condo towers
  near the Pacific Design Center on Melrose have built-in wine storage, but the bulk of
  repair calls still come from older multi-unit stock. Access logistics matter — we carry
  basic hand trucks and know how to work in tight hallways without scratching floors.

commonProblems:
  - title: "Compressor Burning Out From Zero Rear Clearance"
    description: "In 90046 and 90069 kitchens, the gap behind an undercounter cooler is
    often under an inch. The condenser fan pulls warm cabinet air across the condenser
    coil with nowhere to exhaust it — the compressor compensates by running nonstop until
    it fails. Samsung and LG freestanding models are especially prone here. Diagnosis
    takes 20 minutes: condenser coil condition, fan motor amperage draw, compressor start
    relay. If the start relay has rattled apart inside — that's the BB-pellet sound some
    owners describe — it's usually a $60-$80 relay swap rather than a full compressor
    replacement. Catching it early matters. A compressor that's been overworked for months
    may still test okay on paper but fail within a year."
  - title: "Temperature Swings Traced Back to a Dead Thermistor"
    description: "A faulty thermistor sends garbage readings to the control board — the
    cooler swings from 44°F to 63°F within the same afternoon. KitchenAid dual-zone
    units develop this fault in the upper zone first, usually around year four or five.
    The giveaway is a display reading that changes while the room temperature hasn't.
    Thermistor replacement and control board recalibration usually runs under two hours."
  - title: "LA Hard Water Scaling the Drain Line and Backing Up the Reservoir"
    description: "West Hollywood tap water sits around 300-400 ppm total dissolved solids.
    Over two or three years, mineral deposits pack the drain tube and coat the evaporator
    coil — the cooler develops standing water in the drip tray, then humidity spikes, then
    erratic cycling. Bosch and GE units both show this pattern. The evaporator coil
    descale is straightforward: pull the unit, flush the drain line, apply a citric acid
    solution to the coil fins, rinse. The job runs about 90 minutes. A drain flush and
    evaporator coil descale usually prevents the bigger repair that follows if it's
    ignored — standing water left long enough corrodes the drain pump housing and turns a
    $95 cleanout into a $200 pump replacement."

faq:
  - q: "How fast can you get to West Hollywood for Wine Cooler repair?"
    a: "From our Van Nuys base, West Hollywood is typically 30-40 minutes via Laurel
    Canyon or the 101 — traffic depending. Same-day slots are available most days for
    90046, 90048, and 90069. Call (323) 870-4790 and we'll tell you exactly what's open
    today."
  - q: "Do you repair Bosch and KitchenAid wine coolers in West Hollywood?"
    a: "Yes — Bosch dual-zone built-ins and KitchenAid undercounter units are the two
    most common models in this area. Samsung and LG freestanding coolers too. Typical
    jobs: thermistor swaps, door gasket reseals, condenser fan motor replacements, and
    drain line cleanouts. Parts for these brands are stocked on the van for the most
    common failure points, so most repairs finish in one visit."
  - q: "What does a wine cooler repair cost, and how quickly can you diagnose it?"
    a: "Diagnosis is on-site, same visit. Door gasket or thermistor replacements usually
    land between $120-$180 parts and labor. Compressor work is more involved — you get a
    firm quote before anything is touched. Evening slots available for residents who can't
    do a weekday call. Schedule at (323) 870-4790 — we're usually there within two hours
    for same-day bookings in West Hollywood."
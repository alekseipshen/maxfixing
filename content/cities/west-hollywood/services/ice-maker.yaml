title: "West Hollywood Ice Maker — Hard Water Kills Valves Here"

intro: |
  Plummer Park sits about four blocks from a dense cluster of 1960s-era apartment
  buildings along Havenhurst Drive and Fountain Avenue — and those buildings are
  full of Samsung french-door refrigerators that residents retrofitted into
  kitchens that were never designed for them. LA Municipal Water through the 90046
  distribution zone consistently tests 290–330 ppm for dissolved minerals. That
  calcium load hits the water inlet valve hard, and the ice maker is the first thing
  to stop working. Most calls we get from West Hollywood's 90046 zip code follow
  the same pattern: the unit produces nothing for a week, someone checks the manual,
  gives up, calls us.

localContext: |
  Most of the housing stock in 90046 and 90069 is multi-unit — two-story courtyard
  apartments from the 1950s and '60s, some Spanish Colonial duplexes on side streets
  off Santa Monica Boulevard, and a stretch of newer condos near the Beverly Hills
  border on the east side. Galley kitchens are the norm in West Hollywood.
  Refrigerators sit flush against cabinetry with maybe two inches of clearance on
  each side. Street parking for a service van on Larrabee or Vista Del Mar usually
  means a 3-4 minute walk from the curb to the unit — we factor that in on every
  call. Older buildings along Fountain Avenue also tend to have the original copper
  supply lines, which corrode at the compression fitting where the refrigerator tap
  connects. That's a separate fix from the appliance itself, but we spot it and
  flag it before it becomes a water damage claim.

commonProblems:
  - title: "Fill Valve Choked by Mineral Deposits"
    description: |
      Hard water at 300+ ppm leaves calcium scale inside the water inlet valve
      solenoid until the orifice narrows enough to restrict flow to a trickle.
      LG and Samsung units are hit worst — their valve tolerances are tighter
      than older GE or Whirlpool designs, so they clog earlier. First symptom is
      undersized cubes that look like half-formed shells. Then nothing at all.
      Replacing the valve clears it, but flushing the supply line first keeps the
      new one from failing in eight months.
  - title: "Frozen Water Line in the Back of the Unit"
    description: |
      In tightly-enclosed kitchen alcoves — common in WeHo apartments where the
      refrigerator is recessed into cabinetry — the plastic supply tube running
      from the wall shutoff to the inlet freezes solid. The assembly keeps
      signaling for water, the thermostat in the ice compartment overreacts,
      and the evaporator coil frosts up entirely. Thawing the tube and adding a
      foam sleeve to insulate it against the cold cabinet wall usually solves
      it without any parts cost.
  - title: "Ice Maker Sensor Arm Failure on KitchenAid Models"
    description: |
      KitchenAid side-by-side and french-door models from the early 2020s have
      an optical ice level sensor — a small infrared emitter and receiver mounted
      inside the ice bucket housing. When the sensor housing cracks or the wiring
      harness behind it gets pinched during installation, the unit either stops
      producing ice because it thinks the bin is full, or runs continuously and
      jams the auger motor. Diagnosing it requires pulling the unit forward, which
      in a galley kitchen takes two people if the fridge is full. West Hollywood
      apartments with narrow doorframes add another variable — sometimes the
      refrigerator can't come out more than a foot before hitting the opposite wall.

faq:
  - q: "How fast can you get to West Hollywood for an ice maker repair?"
    a: |
      Usually 1-2 hours from our closest tech. We run along Santa Monica Blvd
      and Sunset regularly — West Hollywood is a straightforward route from most
      of our other calls. Call (323) 870-4790 and we'll tell you the exact window.
      Evening appointments are available most days if you can't do daytime.
  - q: "Do you repair Samsung and LG units in these older apartment buildings?"
    a: |
      Yes — Samsung and LG are the most common calls we get in WeHo. Fill valve
      replacements, module resets, and control board issues on both brands.
      Also handle GE, Whirlpool, and KitchenAid. We stock the most-requested
      Samsung and LG parts on the van so same-day repair is usually possible.
  - q: "What does ice maker repair cost, and do you charge just to come out?"
    a: |
      Diagnostic fee is $65, which applies toward the repair if you move forward.
      Most fill valve or sensor jobs come out to $130–$230 total parts and labor.
      Same-day and emergency slots are available — schedule at (323) 870-4790
      or book online. We confirm the arrival window by text once you're on the calendar.
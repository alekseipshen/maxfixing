title: "West Hollywood Cooktop — Apartment Kitchens Fixed Same Day"

intro: |
  Fountain Avenue and the side streets off Santa Monica Boulevard are packed
  with 1960s and 70s apartment buildings — a lot of those kitchens still run
  original GE or Whirlpool gas cooktops that haven't been serviced since they
  were installed. Burner igniter won't click? Knob that spins but doesn't
  actually control the flame? We cover 90046 and 90069 and can usually get
  there the same day you call at (323) 870-4790.

  Two technicians. Van stocked for both gas and electric. No waiting a week.

localContext: |
  Most of the housing stock in 90046 runs from prewar bungalows near Plummer
  Park to mid-century apartment complexes with galley kitchens and sometimes
  awkward access for service work. Older gas supply lines in buildings on
  Formosa Avenue and around the Norma Triangle run at lower pressure than
  newer construction, which directly affects igniter performance on Samsung and
  LG slide-in cooktops. Units built before 1975 especially tend to have
  undersized ventilation cutouts that complicate cooktop access during
  diagnostics — sometimes we're working in a 24-inch wide galley with the
  range hood right at eye level.

  Hard water is another West Hollywood reality. The city pulls from the same
  municipal supply as the rest of LA, and mineral deposits collect inside valve
  seats and orifice ports over time. That's not a brand defect — it happens to
  Bosch, Samsung, and GE alike.

  Parking logistics matter here too. Side streets near Santa Monica Boulevard
  and Sunset usually have daytime meter space for the van, but buildings with
  underground garage access sometimes require a bit of coordination before we
  arrive. Worth mentioning when you call.

commonProblems:
  - title: "Igniter clicks constantly but the burner won't actually light"
    description: "The igniter electrode itself is usually fine — the real culprit is either
      a clogged burner cap or a failed spark module. On GE and Whirlpool gas
      cooktops in older WeHo apartments, food debris packs into the burner ports
      over years of use. Clearing the ports helps temporarily, but a cracked
      spark module means replacement, not a clean.

      The other pattern we see in these buildings: moisture gets trapped in the
      igniter wire harness, especially on units near windows that face west.
      Salt air from the coast, plus the heat cycling, degrades the insulation on
      igniter leads faster than the inland Valley. A continuity check on the
      harness takes two minutes and often explains why the clicking won't stop
      even after the burner lights."

  - title: "Ceramic glass surface cracked from heat cycling"
    description: "Bosch and KitchenAid smooth-top electric cooktops show up in a lot of the
      renovated units along Melrose Avenue. A cold pan dropped onto a hot ceramic
      surface — or the reverse — stresses the glass past its limit.

      Cracked ceramic panels are a full surface replacement, not something you
      patch. Surface element swaps run faster if the glass is intact. On
      KitchenAid models specifically, the radiant element sits in a reflector
      bowl that oxidizes after a crack lets in debris — catching it early keeps
      the repair cost from doubling."

  - title: "One or two burners running way hotter or cooler than the setting"
    description: "On Samsung induction cooktops, inconsistent heat traces back to a failing
      induction coil or a damaged control board — the burner ring itself is
      rarely the issue. An E1 or E3 error code on the display confirms a board
      fault. LG gas models get clogged orifices after mineral deposits build up
      from LA hard water steam backing into the valve seat.

      For Whirlpool and GE gas units, a partially closed gas valve orifice
      produces a small, weak flame that looks like a low-BTU burner setting even
      when the knob is maxed out. Orifice cleaning resolves it about 70% of the
      time. The other 30% needs a full valve assembly swap — that part runs
      around $45 to $90 depending on the model year."

faq:
  - q: "How fast can you get to West Hollywood for cooktop repair?"
    a: "West Hollywood sits right on our regular corridor between the 101 and
      Olympic. Side street parking near Santa Monica Boulevard is usually fine
      for the van. Call (323) 870-4790 — same-day slots open most weekdays,
      and evening appointments are available when schedules allow.

      For urgent calls — gas smell or a burner that won't shut off — we
      prioritize those and aim to be on-site within 2 hours."

  - q: "Do you repair Bosch and KitchenAid cooktops in West Hollywood?"
    a: "Both come up constantly in WeHo kitchen renovations. Bosch induction units
      usually need a touch control board or a burned induction coil. KitchenAid
      gas cooktops most often need igniter switch replacements or valve orifice
      cleaning. Common parts stay stocked on the van, which cuts down on
      return visits."

  - q: "How does cooktop diagnosis work, and what does repair typically cost?"
    a: "Everything gets diagnosed on-site — we check the spark module, control
      board, and burner components before quoting anything. Most single-burner
      repairs land between $120 and $220 for parts and labor combined.

      Induction board replacements run higher, typically $180–$350 depending
      on the Samsung or Bosch model. Emergency calls get prioritized. Schedule
      at (323) 870-4790 — we're usually at your door within 2 hours."
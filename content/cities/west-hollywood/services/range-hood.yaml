title: "West Hollywood Range Hood — Clogged Ducts, Noisy Fans, Fixed Same Day"

intro: |
  Apartment kitchens along Santa Monica Boulevard in West Hollywood are notoriously compact —
  1960s and early '70s construction with gas ranges jammed under 30-inch hoods that were
  undersized from day one. A Whirlpool or GE insert hood in that setup builds grease into the
  baffle filter faster than you'd think. Once the blower wheel starts dragging or the exhaust
  duct backs up, smoke just hangs in the kitchen and the landlord starts getting texts.
  Newer builds in 90046 that went with an LG or Samsung under-cabinet hood face a different
  problem — those units use brushless DC blower motors that fail quietly, cutting airflow to
  near zero before the owner notices anything is wrong.

localContext: |
  Zip codes 90046 and 90069 cover most of West Hollywood's apartment corridor, and a lot of
  that housing stock hasn't had its ductwork cleaned since the Reagan administration. The blocks
  near Plummer Park and east toward Fairfax run older recirculating hoods with no exterior vent —
  just a charcoal filter doing the work alone. Those charcoal filter packs saturate in 3–4 months
  of regular cooking and most tenants don't know they need replacing until the smell never fully
  clears. Newer condo conversions along the Sunset Strip sometimes have a KitchenAid or Bosch
  chimney hood, which needs different tools and usually more ceiling clearance to service properly.
  Parking a service van near Larrabee Street or on Havenhurst during the day is its own logistics
  puzzle — mention your building's street situation when you call so we can plan the trip.

commonProblems:
  - title: "Grease-Packed Baffle Filter Choking the Blower Motor"
    description: |
      Cooking over a gas range without pulling and degreasing the baffle filter every month or
      two puts the blower motor under slow, steady stress. Grease restricts airflow, the motor
      works harder, runs hotter, and eventually the fan capacitor or motor winding fails. Whirlpool
      and GE hoods in older WeHo kitchens are the most common victims here — and in most cases
      the motor can be replaced without swapping the entire unit. A seized blower wheel is a
      separate issue from a dead motor — it usually means the grease buildup hardened around the
      wheel shaft. That part takes longer to clean than replace, so we'll tell you up front which
      direction saves money.

  - title: "Backdraft Damper Stuck Shut — Hood Runs but Nothing Exhausts"
    description: |
      Older buildings in 90046 often have sheet-metal duct runs terminating at a backdraft damper
      on the exterior wall. Those dampers corrode, collect grease, and eventually seize shut. The
      hood fan sounds like it's running, but nothing actually moves out of the kitchen. Residents
      notice a faint rattling or stale grease smell even on high. It's a straightforward fix —
      the awkward part is reaching it in a tight apartment kitchen. Some of these duct runs also
      pass through a shared wall cavity, which means we verify the damper location before
      opening anything up. Once the damper clears and the duct is flushed, the difference in
      suction on high speed is immediate and obvious.

  - title: "Range Hood Lights Dead — Usually Not the Bulb"
    description: |
      A KitchenAid chimney hood or mid-grade Bosch wall-mount that stops lighting isn't always a
      bulb issue. The socket assembly cracks from years of heat cycling near the cooktop, the
      wiring harness corrodes, or the control board stops sending voltage to the lamp circuit
      entirely. Swapping the bulb does nothing when the socket itself is burned out. On Bosch
      hoods in particular, the control board failure often shows up as a partial malfunction —
      lights dead, but fan still runs on one speed. Diagnosis takes about 15 minutes on-site;
      the actual repair usually another 20. Control board replacements on these mid-range units
      are typically available same-week from local distributors, so there's rarely a long wait
      for parts.

faq:
  - q: "How fast can you get to West Hollywood for a range hood repair?"
    a: |
      Most West Hollywood calls from 90046 or 90069 get a same-day slot. From our San Fernando
      Valley dispatch, that's typically 30–45 minutes depending on traffic on Laurel Canyon or
      the 101. Evening slots are available for tenants who can't take time off during the day.
      Apartment parking near Santa Monica Boulevard can add a few minutes — just mention
      your building setup when you call us at (323) 870-4790.

  - q: "Do you repair KitchenAid and Bosch range hoods in West Hollywood?"
    a: |
      Yes — both KitchenAid chimney hoods and Bosch wall-mount models show up regularly in West
      Hollywood condo kitchens. We carry replacement blower motors, baffle filter hardware, and
      control board components for both brands. GE and Whirlpool recirculating hoods in the older
      apartment buildings are also common jobs for us. LG and Samsung under-cabinet hoods from
      the past decade are on our regular call list too — the DC motor assemblies in those units
      are a known failure point after five or six years of use.

  - q: "What does range hood repair typically cost in West Hollywood?"
    a: |
      Diagnosis is flat-rate — you get a full quote before we touch anything. A blower motor
      replacement on a Whirlpool or GE unit usually runs $120–$180 parts and labor combined.
      Duct cleaning or a damper swap is typically less. Control board work on a Bosch or KitchenAid
      runs higher — usually $160–$240 depending on part availability. Same-day and evening slots
      are available — call (323) 870-4790 to check what's open today.
title: "West Hollywood Freezer — Compact Kitchens, Hot Summers, Real Repairs"

intro: |
  The 1940s walk-ups along Havenhurst Drive and the mid-century stucco buildings scattered
  off Fountain Avenue weren't built with large kitchen footprints in mind. That means compact
  chest freezers and apartment-size uprights crammed into corners — working harder than
  they should. In 90046, summer heat regularly pushes ambient temps above 85°F inside units
  with poor airflow. That Samsung upright or the older GE combo running 24/7 from June through
  September shows the strain first: inconsistent temps, loud compressor cycles, or frost
  building where it shouldn't be. By August, we're getting calls from Romaine Street and
  Larrabee regularly — the same symptoms, the same overworked freezers.

localContext: |
  West Hollywood's rental housing runs dense and old. Buildings along the Havenhurst and
  Flores Street corridors date from the 1940s through the early 1960s — kitchens designed for
  icebox-era appliances, not modern freezers. Ventilation is tight, clearances minimal. Getting
  a service van parked on Sweetzer or Ogden during business hours takes planning. The
  90069 zip code spans the hills above the Strip, where newer single-family homes and hillside
  condos run KitchenAid and GE Profile units. Those late-1990s and early-2000s builds are now
  hitting the age where compressor wear and door seal failure start showing up regularly.
  Bosch bottom-freezer units show up in the remodeled units closer to Robertson — quieter
  machines, but their drain pump and defrost components still fail on schedule just like
  everything else.

commonProblems:
  - title: "Frost Packed Solid on the Back Wall — Defrost System Gave Out"
    description: "That thick ice crust on the back wall isn't just frost — it's usually a defrost
      heater that burned out or a defrost timer stuck in the off position. The evaporator coil
      gets encased, airflow cuts off, and internal temps climb toward 20°F instead of holding at
      0°F. Happens constantly in older Whirlpool and GE top-freezer units in apartments where the
      door gets opened and closed in warm weather all day. On GE models you'll sometimes see an
      E1 or FF error on the display before the frost cycle fully fails — that's the board flagging
      the defrost sensor. Don't ignore it."

  - title: "Freezer Running Loud and Losing Temperature at the Same Time"
    description: "A condenser fan motor clogged with dust forces the compressor to work harder and
      run louder. In WeHo's older buildings, appliances often sit flush against the wall or inside
      narrow cabinet cutouts with almost no clearance behind them. That trapped heat kills
      compressor lifespan faster than anything else. LG bottom-freezer models are especially prone
      to condenser fan failure by year 5 or 6 — the motor seizes and the drawer slowly warms up.
      The compressor keeps running, but without airflow across the condenser coil, the refrigerant
      can't shed heat properly. You end up with a unit that sounds like it's working and isn't."

  - title: "Door Gasket Letting Warm Air In, Triggering Constant Frost Cycles"
    description: "Gaskets degrade faster in warm kitchens, and West Hollywood apartments get
      warm. A cracked or compressed door seal lets in enough humid air to trigger constant frost
      cycles and temperature swings — you'll notice ice buildup near the door edges first. This
      shows up in Samsung french-door units and standalone uprights alike. Quick test: press a
      dollar bill against the gasket perimeter and close the door. Slides out easy — time to
      replace it before the compressor starts compensating and burns out too. Call (323) 870-4790
      and we can usually get out same-day to confirm whether it's the seal or something deeper."

faq:
  - q: "How fast can you get to West Hollywood for freezer repair?"
    a: "Usually within 2 hours from our dispatch point. Santa Monica Boulevard is the cleanest
      route in — after 4pm, La Cienega backs up badly and adds 30-40 minutes. Morning slots
      reach WeHo fastest and parking is easier before the lunch rush. Call (323) 870-4790 to
      check today's availability."

  - q: "Do you repair Samsung and LG freezers in West Hollywood?"
    a: "Yes — Samsung and LG are the most frequent freezer calls we get in WeHo. Samsung ice
      maker assemblies clog and stop producing entirely. LG bottom-freezer drawers come in with
      evaporator coil frost-over and fan motor failures. Whirlpool and GE top-freezer units also
      come through regularly, almost always defrost system issues. KitchenAid and Bosch units
      from the newer builds on the west side of the city have their own patterns — control board
      faults and water inlet valve failures show up more often than mechanical wear on those."

  - q: "What does freezer repair usually cost, and do you offer same-day service?"
    a: "Diagnostics run $75-$95, credited toward the repair. A door gasket replacement lands
      around $120-$160 depending on model. Defrost heater and timer replacements usually fall
      in the $150-$200 range for parts and labor combined. Compressor swap on a mid-range unit
      usually doesn't pencil out — we'll say so before touching anything. Same-day slots are
      available most weekdays, evening appointments too if work runs late for you."
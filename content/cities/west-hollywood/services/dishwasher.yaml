title: "West Hollywood Dishwasher — LA Hard Water vs. Your Bosch"

intro: |
  The apartment buildings around Plummer Park in 90046 tell the West Hollywood story plainly:
  compact kitchens, daily dishwasher use, and LA municipal water running at 300+ ppm hardness.
  That Bosch 300 Series or Samsung unit installed during a 2014 remodel is now dealing with
  scale-clogged spray arms and a heating element that barely reaches temperature. Hard water
  doesn't respect renovation budgets. Two of our technicians cover West Hollywood — usually
  on-site within 2 hours.

localContext: |
  Most of West Hollywood's housing was built between 1955 and 1980 — three- and four-story
  apartment blocks, not single-family homes. Zip codes 90048 and 90069 have the denser clusters,
  with kitchens running tight: 24-inch dishwashers wedged under low counters, minimal side
  clearance, no room to maneuver. Parking a service van on Larrabee Street or Havenhurst Drive
  takes planning. We've worked these buildings. The access issues don't slow us down.

commonProblems:
  - title: "Mineral Scale Blocking Spray Arms — The Default WeHo Failure"
    description: "LA water at 300+ ppm turns spray arm nozzles into calcite deposits over 18-24
      months of daily use. On a Bosch 500 Series, this surfaces as an E24 error — the drain pump
      is fighting restricted flow, not an actual blockage downstream. Cleaning the filter buys
      time, but if the inlet valve screen is also scaled, both components need replacing to
      actually fix it."

  - title: "Door Latch Assembly Failing on '90s and 2000s-Era Units"
    description: "Older GE and Whirlpool dishwashers in West Hollywood apartments develop a
      familiar fault: the door latch assembly wears down, the machine reads an open door, and
      nothing runs. Landlords defer service calls until the control board logs repeated failures
      and throws a fault code — turning a $25 latch fix into a $200+ board replacement."

  - title: "Detergent Dispenser Stuck Shut — LG and KitchenAid in 90046"
    description: "A stuck detergent dispenser door means soap stays trapped through the entire
      cycle. Dishes come out greasy, not just spotty. On LG and KitchenAid units, the wax motor
      inside the dispenser assembly fails after 5-7 years — earlier in hard water conditions.
      The float switch often goes at the same time. Both parts combined run under $60; the fix
      takes about an hour on-site."

faq:
  - q: "How fast can you get to West Hollywood for Dishwasher repair?"
    a: "WeHo is on our daily route. From the nearest tech, most addresses in 90046 or 90069 are
      20-30 minutes out. Call (323) 870-4790 before noon and same-day service is almost always
      available. Evening slots open too — useful if you're not home during working hours."

  - q: "Do you repair Bosch and Samsung dishwashers in West Hollywood?"
    a: "Both are common in this area. Bosch 300 and 500 Series — mostly drain errors (E24, E25)
      and hard water damage to spray arms and pump filters. Samsung units come in with OE codes
      and door latch problems. We also handle LG, Whirlpool, KitchenAid, and GE."

  - q: "What does dishwasher repair cost in West Hollywood, and do you charge to diagnose?"
    a: "Diagnostic is $89, applied to the repair if you approve it. Most jobs — drain pump swap,
      detergent dispenser, door latch assembly — run $150 to $280 parts and labor. Quote before
      we touch anything. Same-day and emergency slots available; schedule online or call
      (323) 870-4790."
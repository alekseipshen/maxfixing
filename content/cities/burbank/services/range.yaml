title: "Burbank Range Repair — Gas & Electric, 91505 to 91501"

intro: |
  Magnolia Park kitchens on Hollywood Way and those compact bungalows off Olive Avenue were built
  in the 1940s with galley layouts that now hold full-size Bosch and KitchenAid slide-in gas ranges.
  Nobody designed those spaces for a 36-inch appliance, and nobody designed those ranges for LA
  water — Burbank sits above 350 ppm hardness, and that mineral load quietly kills spark electrodes
  within two years of normal cooking. The igniter starts clicking without lighting. The burner cap
  fills with calcium residue and produces a low, lopsided flame. Over in the Rancho Equestrian
  neighborhood, some of the larger homes along Scott Road have Thermador Pro Harmony built-ins where
  the symptoms look similar but the parts are completely different. We cover the 91505 and 91501 zips
  with same-day appointments most days of the week — call (323) 870-4790 and we can usually confirm
  a window within 30 minutes. Gas smell calls get a 2-hour priority response, no exceptions.

localContext: |
  The postwar housing stock in Burbank runs heavy on original gas infrastructure, which means almost
  every kitchen we walk into has a gas range rather than electric. In the 91505 zip — Magnolia Park
  and the surrounding residential blocks — most homes were built between 1940 and 1965 with cast-iron
  gas supply lines that are now 60-plus years old. Freestanding KitchenAid and LG ranges sit on top
  of those original stub-outs. Over in 91504 near Glenoaks Boulevard, there's a denser apartment
  corridor where Samsung and lower-end LG ranges dominate. Apartment calls involve parking logistics:
  side streets off San Fernando Road and around the Downtown Media District are tight for a service
  van, so we ask for the cross-street when booking. The larger properties in Hillside District at the
  north end of 91504 trend toward Thermador and Viking built-ins — these units have sealed burner
  systems with proprietary igniter assemblies that take brand-specific parts, not generic hardware-
  store substitutes. Burbank summers also accelerate oven component wear: running a range in a 95°F
  kitchen pushes the thermal fuse and control board beyond their design comfort zone faster than the
  engineers accounted for.

commonProblems:
  - title: "Burner clicks endlessly without lighting — spark electrode fouled by hard water"
    description: |
      That steady click-click-click after you turn the knob is almost always a contaminated or
      cracked spark electrode. Burbank's water deposits calcium on the electrode tip within 18-24
      months of regular cooking use — even faster if you boil water frequently on the burner. A
      thorough clean with a stiff brush and white vinegar resolves about 60% of these calls. If
      the ceramic insulator around the electrode shows a visible crack, the part needs replacement:
      on a Bosch 800 Series, the electrode assembly runs $45-65, and the job takes under an hour.
      All four burners refusing simultaneously usually means the spark module has failed — that's
      a $90-130 part depending on the model. Call (323) 870-4790 to schedule same-day diagnosis;
      we carry both parts in the van to avoid a return trip.

  - title: "Oven won't heat or takes 30+ minutes to reach temperature — igniter or gas valve failing"
    description: |
      Gas oven igniter failure is the single most common range repair in Burbank. The igniter draws
      electrical current to heat up and open the safety gas valve; as the igniter degrades, it no
      longer draws enough current, and the valve either stays closed or cycles erratically. On a
      KitchenAid freestanding model — extremely common in the 91501 and 91502 zips — a weak igniter
      shows up as a 25-minute pre-heat or a bake cycle that cuts out after 20 minutes. Replacement
      igniter parts run $35-55; with labor, total cost is typically $120-175. Electric range owners
      see a different failure: the bake element burns through, sometimes showing a visible arc mark
      or charred spot. Samsung and LG bake elements are $30-60 in parts; combined with labor, budget
      $100-160 for the full repair.

  - title: "One burner running low or producing an uneven yellow flame — clogged orifice or off-center burner cap"
    description: |
      A single lazy, yellowish flame while the other burners look normal usually comes down to a
      clogged brass orifice or a burner cap that went back on crooked after cleaning. The burner
      cap — the ceramic or cast-iron disc over the flame ports — has to seat perfectly flat. Tilt
      it even slightly and the gas flow pattern goes asymmetric. On a Thermador range (more common
      in the larger Hillside District homes), the orifices are precision-bored and any partial
      blockage from grease or mineral residue shows up immediately as an irregular flame. Cleaning
      the orifice requires a soft wire probe; using a drill bit or toothpick enlarges the hole
      permanently and makes the problem worse. Replacement brass orifice inserts run $15-30 each.
      The full diagnosis and fix wraps up in 45-60 minutes for most models.

  - title: "Control panel unresponsive or throwing error codes — temperature sensor before control board"
    description: |
      Touch-panel Bosch and Samsung ranges pick up particulate on dry Santa Ana wind days in
      Burbank — dust infiltrates the ventilation gap around the display and causes phantom touches
      or a completely dark screen. Before assuming the control board is dead, check the oven
      temperature sensor: error codes like F10 on Samsung models or E1 on Bosch typically point
      to a faulty or shorted sensor rather than a board failure. The sensor is a $30-50 part;
      a control board on a Bosch slide-in runs $250-400 in parts alone. We test the sensor
      resistance with a multimeter on every board-complaint call — about 65% of the time, the
      sensor swap alone resolves it. Full board replacement with labor runs $350-550 on Bosch;
      Samsung and LG boards are cheaper, $180-300 all in.

  - title: "Gas smell near the range — supply line fitting, burner valve, or deteriorated seal"
    description: |
      Gas smell means stop cooking and ventilate — then call us. In Burbank homes built before 1970
      in the 91501 and 91502 zips, the flex connector between the wall shut-off and the range
      develops micro-leaks at the compression fitting over time, especially after the range has been
      moved. On the range itself, a failing gas valve or a deteriorated burner valve seal can allow
      unburned gas to escape. LG freestanding ranges from the 2015-2019 production window had a
      documented pattern of dual-ring burner valve seal degradation. Diagnosis involves soap solution
      on every connection point — smell alone doesn't tell you the source. Valve replacement runs
      $85-160 for the part; supply-line swap is $40-70. Certain gas repairs in Burbank require a
      city inspection sign-off — we coordinate that permit process directly.

faq:
  - q: "How fast can you get to Burbank for range repair?"
    a: |
      From our staging point near the 134/5 interchange, Burbank is 15-25 minutes depending on
      the time of day. Magnolia Park and Rancho Equestrian addresses in 91505 and 91506 are
      straightforward — parking a van on those residential streets is never an issue. Apartment
      buildings near San Fernando Road in 91502 are tighter; a quick heads-up about access helps.
      Same-day slots are available Monday through Saturday, with evening appointments after 4 PM
      most weekdays. Call (323) 870-4790 before noon and we can almost always confirm a same-day
      window. Gas odor calls jump the queue — target response is within 2 hours regardless of
      what else is on the schedule.

  - q: "What does range repair in Burbank typically cost?"
    a: |
      Most single-component repairs land between $120 and $280, parts and labor combined. Igniter
      swaps on gas ranges — our most common Burbank call — run $130-180. Bake element replacements
      on electric Samsung or LG models are usually $100-160. Control board replacements are the
      expensive end: Bosch and Thermador boards run $350-550 all in; Samsung and LG boards are
      $180-300. The diagnostic fee is $75, which gets credited toward any repair we do on that
      visit. We quote the full repair price before starting work, so you know the total before we
      pick up a tool. For ranges where repair cost approaches half the replacement price, we'll
      tell you that directly.

  - q: "Do range repairs in Burbank require a city permit?"
    a: |
      Replacing igniters, heating elements, temperature sensors, and control boards — no permit
      needed. Gas line modifications are different: extending a supply line, replacing the flex
      connector with new rigid pipe, or converting a range from gas to electric requires a City
      of Burbank Building Division permit. Applications go through the city's eTRAKiT online
      portal, and simple residential gas permits typically turn around in 2-5 business days.
      If we discover your existing flex connector needs replacement — common on 1960s homes in
      91501 and 91502 — we flag it before proceeding and walk you through the permit process.
      We file the application and coordinate the inspection scheduling.

  - q: "Can you repair Thermador or Viking ranges in Burbank?"
    a: |
      Yes, though these units need a different approach than a standard freestanding Samsung.
      Thermador Pro Harmony and Viking Professional Series ranges use proprietary star-shaped
      burner caps, precision brass orifices, and model-specific igniter assemblies that don't
      cross-reference with generic parts. Several homes in the Hillside District and along
      Verdugo Road in 91504 have these built-in units with very limited cabinet clearance for
      service access. We stock common Thermador igniter components and Viking gas valve assemblies
      in the van. For certain control board replacements on these models, we source directly from
      the manufacturer, which adds 3-5 days for parts. We tell you upfront when that's the case —
      no surprise delays after we've already disassembled the unit.

  - q: "What warranty do you offer on range repairs in Burbank?"
    a: |
      Labor is warranted for 90 days from the repair date. OEM parts from Bosch, Samsung, KitchenAid,
      and LG carry the manufacturer's 1-year parts warranty, which transfers to you. Aftermarket parts
      — used on older ranges where OEM is discontinued — carry a 90-day warranty. If the same fault
      returns within the warranty window, we come back at no labor charge. On Thermador and Viking
      repairs, we only install OEM parts: aftermarket alternatives for these brands have inconsistent
      tolerances and can cause secondary failures. We keep records of every repair, so there's no
      dispute about what was done or when the warranty period started.

  - q: "Do you cover other cities near Burbank for range repair?"
    a: |
      Glendale, Pasadena, North Hollywood, and La Cañada Flintridge are all standard service areas —
      15 to 30 minutes from Burbank depending on traffic on the 5 or 134. We also run regularly to
      Arcadia, Monrovia, and the Studio City side of the hills. Toluca Lake gets same-day service
      without issue. Weekend slots in the Burbank and Glendale corridor fill faster than weekday
      availability, so booking a day ahead helps if your schedule has flexibility. Call
      (323) 870-4790 or schedule online — we confirm appointment windows by text, typically within
      30 minutes of the request.
title: "Burbank Washer Repair — Hard Water Kills Drain Pumps Fast"

intro: |
  Tap water in Burbank tests above 300 ppm calcium hardness — some of the worst
  mineral content in the San Fernando Valley. That buildup attacks water inlet
  valves and drum seals fast, especially on the front-load LG units popular in
  Magnolia Park homes. Deposits force the machine to overwork until something
  fails. Most calls we get from the 91505 zip start the same way: "it just
  stopped draining."

  Valley heat makes it worse. July and August push laundry room temps above 90°F
  in older Burbank homes that never had good ventilation built in. Samsung
  front-loaders running back-to-back loads in that heat start throwing 5E drain
  errors faster than the same machine would in a cooler climate — and the control
  board runs hot even before anything is actually wrong.

localContext: |
  Most of the residential housing in 91506 and 91501 dates to the 1950s and
  '60s — tract homes with dedicated laundry rooms, though some older units near
  the Rancho district have retrofit closet setups that barely fit a standard
  27-inch machine. Stack washer-dryer combos and Bosch compact units show up
  constantly in the converted garages and ADUs that have multiplied across
  central Burbank over the past decade.

  The newer builds near Olive Avenue and the Media District tell a different story.
  Homeowners there put money into KitchenAid or Bosch front-loaders during kitchen
  and laundry renovations, so the machines are younger — but the supply water is
  just as hard, and most of those installs don't have inline filters on the inlet
  lines. We see mineral-related failures at 18 months on a $900 Bosch the same
  as on a $400 Maytag.

  Parking is straightforward in most of Burbank. Side streets off Hollywood Way
  and Glenoaks have open curb space. The 91502 blocks near Downtown Burbank are
  tighter — we've hauled parts through side-yard gates a few times.

commonProblems:
  - title: "Mineral Scale Blocking the Water Inlet Valve"
    description: |
      Burbank's hard water deposits calcium inside inlet valve mesh screens
      within 18–24 months of normal use. Samsung front-loaders will throw a 4E
      or 4C error code when flow drops below the sensor threshold. Clearing the
      screens buys time, but heavy scale usually means replacing the valve
      assembly — not just cleaning it.

      LG units hit the same failure and log it as an IE error. The valve is a
      $40–$60 part, but reaching it on a front-loader means pulling the machine
      from the wall, lifting the top panel, and disconnecting two water lines plus
      a wiring harness. About 45 minutes of labor if nothing else has failed
      behind the panel.

  - title: "Drum Bearing Wear Turning the Spin Cycle Into a Jackhammer"
    description: |
      A failing drum bearing starts as a low rumble, then gets loud fast. It's
      common in KitchenAid top-loaders after seven or eight years. Pulling the
      spin basket to replace the bearing is a multi-hour job — but skipping it
      means a cracked tub eventually, and that's a full machine replacement
      rather than a $180 fix.

      Noise pattern matters for the diagnosis. Grinding during spin that quiets
      during the wash cycle points to the bearing, not the drive belt or shock
      absorbers. Machines run with oversized loads repeatedly — common in
      households doing bulky comforter washes — wear the bearing race unevenly
      and accelerate the failure. Once it starts going, it goes fast.

  - title: "Drain Pump Clogs Leaving Standing Water in the Drum"
    description: |
      Coins, lint, and sock fragments get past the filter and jam the drain pump
      impeller — Bosch front-loaders are especially prone to this because of how
      the pump filter is positioned below the door seal. The machine stops
      mid-cycle, flashes a drain error, and you're stuck with soaking laundry
      until someone clears the blockage.

      Bosch throws an E18 code. That's the one.

      Clearing it means draining the drum manually through the filter access
      door, pulling debris from the pump housing, and running a diagnostic cycle
      to confirm flow is restored. If the impeller is cracked or the pump motor
      burned out, the full drain pump assembly runs $90–$140 in parts. Most of
      these jobs wrap same day — call (323) 870-4790 and we can usually get there
      within two hours from our San Fernando Valley base.

faq:
  - q: "How fast can you get to Burbank for washer repair?"
    a: |
      From our San Fernando Valley route we're typically in Burbank within 2
      hours of your call. Street parking near most homes off Glenoaks or Pass
      Avenue works fine for the van. Call (323) 870-4790 or schedule online and
      we'll lock in a same-day window. Evening slots are available if your work
      schedule is the issue.

  - q: "Do you repair Bosch and Samsung washers in Burbank?"
    a: |
      Both are regular calls in this area. On Bosch front-loaders we most often
      deal with drain pump clogs and door latch assembly failures. Samsung units
      in Burbank frequently throw 4E or 5E codes tied to inlet valve scale or
      control board issues — both are same-day repairs if parts are on the van.

      LG and KitchenAid are stocked on the van too. Older Whirlpool or Maytag
      top-loaders sometimes need parts ordered overnight, so a second visit is
      possible — but we'll tell you that upfront, not after tearing it apart.

  - q: "What does washer repair cost in Burbank, and how does the process work?"
    a: |
      Diagnosis is $75, credited toward repair if you proceed. A drain pump
      swap typically runs $150–$220; drum bearings run higher depending on the
      model. Evening slots are available if daytime doesn't work. We carry
      common parts for LG, Samsung, KitchenAid, and Bosch on the van so most
      jobs get done in one visit.
title: "Burbank Freezer Repair — Valley Heat Takes a Toll"

intro: |
  Summer temperatures in the San Fernando Valley regularly hit 100°F or higher, and a freezer
  working overtime in a Magnolia Park kitchen — or sitting in a garage on Olive Avenue — is
  under real strain by August. That Samsung upright wasn't rated for ambient heat that intense;
  the compressor runs longer, the evaporator coil struggles to keep up, and suddenly the unit
  holds 15°F instead of 0°F. We cover all of Burbank and can usually get there the same day.

  Garage freezers in 91505 are especially vulnerable. The ambient heat turns what should be a
  straightforward cooling cycle into a marathon — and the first casualty is almost always the
  condenser fan motor, running hot until it seizes.

localContext: |
  The residential blocks between Glenoaks Boulevard and the 5 Freeway in 91502 are heavy with
  1950s ranch homes — kitchens built before 20-cubic-foot uprights were standard. Tight utility
  spaces and narrow hallways are par for the course. Parking the service van on Verdugo Avenue
  during a weekday call means planning around school-hour congestion near John Muir Middle School.
  Over in 91505, closer to the Media District, there's more 1960s construction and some remodeled
  condos where KitchenAid built-in freezer drawers sit in island cabinetry. Hard LA water —
  Burbank runs at roughly 300-400 ppm hardness — accelerates mineral buildup in ice makers across
  both zip codes. That calcification clogs the water inlet valve and eventually kills the ice maker
  assembly if it's not flushed out on a regular schedule.

  Up near the Burbank Hills, the story changes entirely. Larger homes, Sub-Zero and Thermador
  column freezers installed during the kitchen renovations of the 2010s. Different problems,
  different parts, different diagnostic approach.

commonProblems:
  - title: "Frost Buildup From Defrost System Failure"
    description: |
      Burbank's summer heat means the freezer door opens more often, pulling in warm, humid air
      each time. That moisture hits the evaporator coil and freezes solid when the defrost heater
      or defrost timer fails — airflow gets blocked, the unit runs constantly, and temps climb.
      Samsung and LG models from 2018-2022 show this defrost heater failure pattern regularly,
      especially in households that use the freezer heavily through summer.

      LG throws a specific ER FF error code when the evaporator fan motor ices over. Most
      homeowners assume the compressor is dying and brace for a $500+ bill. Usually it's a
      $180 heater assembly swap — done same-day if we have the part on the van, which we
      usually do for the common LG and Samsung configurations.

  - title: "Loud Compressor or Constant Cycling"
    description: |
      A freezer in a Burbank garage is fighting 95-105°F ambient temperatures from May through
      October. If the condenser coils are dusty, the compressor works even harder — louder
      cycling, longer run times, and eventually premature burnout. KitchenAid uprights and
      Sub-Zero column freezers both hit this point here, sometimes after just three or four
      summers in an uncooled space. A condenser cleaning runs about $90; a compressor
      replacement is $400-600. The difference is usually one skipped service call.

      Some homeowners in 91502 notice the unit running 20+ hours a day in July and assume
      that's normal. It isn't. At that load, the start relay and overload protector are next.

  - title: "Door Seal Failure Causing Temperature Swings"
    description: |
      Door gaskets degrade faster when a freezer is near a window or in an unconditioned garage —
      both common setups in Burbank's older ranch homes. A failing magnetic seal lets warm air
      seep in constantly, which forces the compressor to compensate and causes temperature
      fluctuation you'll notice as soft ice cream or frost streaks around the door frame.
      Bosch and Thermador built-in freezer drawers in the Burbank Hills remodels see this
      gasket failure pattern frequently, especially in units installed five or more years ago.

      Gasket replacement on a Bosch built-in is model-specific — the mounting clips differ
      between the 500 and 800 series. Carrying the right seals for both is what separates a
      same-day fix from a return visit. We stock the common Bosch and Thermador door gaskets
      on the van because Burbank Hills calls come up constantly.

faq:
  - q: "How fast can you get to Burbank for freezer repair?"
    a: |
      Burbank sits squarely in our daily Valley route — from dispatch, most calls there are
      reached in under 90 minutes. Same-day appointments are available most days of the week.
      Call (323) 870-4790 to check today's open slots.

  - q: "Do you repair KitchenAid, Samsung, and Sub-Zero freezers?"
    a: |
      All three, plus LG and Bosch. KitchenAid uprights usually come in with defrost heater or
      ice maker assembly problems. Samsung units often throw an FF error code — that's the
      evaporator fan failing. Sub-Zero columns need brand-specific refrigerant handling and
      proprietary diagnostic tools, which we carry on the van.

      Thermador column freezers in the Burbank Hills area sometimes log a temperature alarm
      even when the cooling cycle looks normal. That usually points to a faulty thermistor, not
      the control board — a $120 fix versus $600+. Gets misdiagnosed constantly.

  - q: "What does a freezer repair cost in Burbank, and how quickly can you come?"
    a: |
      Diagnostic visit is $85, credited toward the repair if you move forward. Common fixes —
      door gasket replacement, defrost heater, thermal fuse — typically run $150-300 parts
      and labor combined. Evening slots are available. Call (323) 870-4790 or schedule online;
      same-day windows fill fast in summer.
    a: "From our San Fernando Valley routes, Burbank is a straight shot down the 5 or
      134 — we're typically in 91505 or 91506 within 90 minutes of your call. Same-day
      slots are usually open, and evening appointments until 7pm are available most
      weekdays. Call (323) 870-4790 to check what's available today."

  - q: "Do you work on KitchenAid and Bosch ice makers specifically?"
    a: "Yes — both come up constantly in Burbank's upper-middle neighborhoods. On
      KitchenAid we replace harvest sensors and inlet valves most often. Bosch integrated
      units usually need the fill valve assembly or a control board reset after a sensor
      swap. Samsung and LG are handled routinely too — the IF and 1E error codes on those
      are almost always a clogged inlet valve in hard-water areas like this one."

  - q: "What does ice maker repair typically cost in Burbank?"
    a: "Most jobs run $120–$250 depending on the part. Fill valve swap is on the lower
      end; control board work climbs higher. Sub-Zero and Thermador parts carry a premium
      over standard residential brands, and we'll tell you the exact number before starting.
      You get a firm quote before we touch anything — no surprises. Emergency same-day and
      evening slots are available for urgent calls."
title: "Burbank Range Hood — Ventilation Repairs in Studio-Era Kitchens"

intro: |
  Magnolia Park's post-war bungalows and the 1960s ranch homes spread through the 91505 zip
  code were never designed for the 500-to-600 CFM blower wheels now hanging above their gas
  ranges. Bosch and KitchenAid canopy hoods keep getting fitted into original duct openings
  that are undersized, packed with sharp bends, or coated in decades of grease. Add Valley
  summer temps that push well past 100°F and force every appliance in the kitchen to work
  harder — range hood calls in Burbank aren't random, they cluster from late June through
  September and again whenever someone remodels and inherits old ductwork.

localContext: |
  The residential corridor between Hollywood Way and Pass Avenue — zip codes 91505 and 91506
  — is largely 1940s-to-1960s tract construction with low ceilings and tight duct chases.
  A lot of Rancho-area kitchen remodels dropped a new Thermador canopy hood into the original
  3.25-inch rectangular duct run, which cuts effective CFM nearly in half and pushes condensed
  grease back onto the blower wheel housing. Down in the flats near Olive Avenue we pull hoods
  regularly where the duct collar hasn't been cleared since the unit was installed — sometimes
  a decade ago.

commonProblems:
  - title: "Blower Motor Burned Out — Restricted Ductwork Is Usually to Blame"
    description: |
      Pre-1970 Burbank homes often have duct runs with two or three 90-degree turns inside
      the cabinet, which creates back-pressure the blower motor wasn't rated for. On Bosch
      Serie 800 hoods, that pressure kills the motor capacitor first — the fan spins slowly,
      then quits entirely. KitchenAid wall-mounts show the same failure mode. Swapping just
      the capacitor runs $80-$120; if the full blower assembly needs replacement, add another
      $60-$100 in parts. Worth diagnosing the duct situation at the same visit so it doesn't
      kill the next motor too.

  - title: "Grease Baffle Filters Plugged — Fan Spins, Smoke Stays in the Kitchen"
    description: |
      Stainless grease baffle filters catch airborne grease before it coats the squirrel cage
      and blower wheel — but only if they're cleaned every couple of months. Skip a year and
      the blockage can choke 70-80% of the intake area. LA's hard water compounds the problem:
      at 200-250 ppm TDS across much of the 818, calcium scale bonds to the grease layer and
      turns flexible baffles into something closer to a metal plate. Fan sounds perfectly normal.
      Kitchen fills with smoke anyway. LG under-cabinet hoods see this constantly.

  - title: "Exhaust Damper Seized — Attic Air and Street Noise Backing Into the Kitchen"
    description: |
      The spring-loaded exhaust damper at the end of your duct run is supposed to stay closed
      when the hood is off. Attic installations in 91502 and 91506 tract homes hit 130°F-plus
      in summer, which warps the plastic damper housing or fuses the hinge with oxidized grease.
      Thermador and Viking wall-mounts in the Rancho neighborhood's higher-end builds show this
      failure regularly — damper sticks open, hot attic air and exterior odors back-draft into
      the kitchen, and the hood smells like the soffit cap even when it hasn't been touched.
      Damper assembly replacement usually runs under an hour.

faq:
  - q: "How fast can you get to Burbank for range hood repair?"
    a: |
      Burbank is an easy run — up the 134 from Pasadena or down Cahuenga from North Hollywood,
      both under 20 minutes outside rush hour. Most calls in 91505 and 91502 get same-day
      service. Call (323) 870-4790 and we can typically be on-site within 2 hours of your call.

  - q: "Do you repair Bosch and Thermador range hoods specifically?"
    a: |
      Both are common in Burbank kitchens — Bosch in the mid-2010s remodels, Thermador in the
      higher-end Rancho builds. Bosch calls usually mean a failed motor capacitor or a sensor
      board issue. Thermador work is typically a seized centrifugal blower assembly or a dead
      control board. We stock the most common failure parts for both brands and carry them
      on the van.

  - q: "What does range hood repair cost in Burbank, and is same-day service available?"
    a: |
      A damper swap or capacitor replacement runs $120-$180 all-in. Full blower assembly
      replacement on a built-in Thermador or Viking runs $250-$400 depending on part cost.
      Diagnosis is on-site — we quote before touching anything. Same-day appointments available
      most weekdays; evening slots open too, which matters if you're actually cooking dinner
      that night and need the hood working before you start.
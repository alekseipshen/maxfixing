title: "Burbank Dishwasher — Hard Water & Tight Kitchens, Fixed Fast"

intro: |
  The postwar blocks east of Hollywood Way have some of Burbank's oldest
  plumbing infrastructure — and the city's water supply, drawn from the San
  Fernando Valley Groundwater Basin, tests consistently hard. Mineral deposits
  hit the spray arm and inlet valve of a Bosch 500-series within 18 months of
  daily use around here. We cover 91505 regularly and are usually on-site
  within two hours.

localContext: |
  Housing in 91502 runs from 1940s craftsman bungalows near Downtown Burbank
  to newer condos along Olive Avenue. Older kitchens were never designed around
  a 24-inch KitchenAid or Samsung — under-counter clearance is tight, and drain
  runs are sometimes oddly routed by whoever did the original remodel. The
  Magnolia Park corridor has seen heavy kitchen renovations over the last decade;
  that stretch generates more premium dishwasher calls than anywhere else in
  the city.

  The Media District — the grid between Buena Vista and Pass Avenue, running up
  toward Glenoaks — has a different appliance profile entirely. Most of those
  homes were updated in the 2000s and 2010s, and Bosch and KitchenAid are
  practically the neighborhood standard. A handful of the larger properties on
  Tujunga Avenue have Sub-Zero integrated units or Thermador dishwashers — those
  machines need specific diagnostic tools and proprietary parts that most generalists
  don't stock. Getting a Sub-Zero tech out to 91505 on short notice usually takes
  two to three days through a dealer. We carry the parts and can often get there
  the same afternoon.

commonProblems:
  - title: "Spray Arm Clogs from Burbank Hard Water"
    description: |
      Burbank water hardness sits around 280-320 mg/L depending on the season —
      enough to calcify spray arm nozzles in under two years of regular use.
      LG and Samsung units are especially susceptible; once calcium rings block
      30-40% of the ports, water pressure drops and dishes stop actually getting
      clean. We clear the buildup and inspect the float switch while the machine
      is open.

      The inlet valve filter screens catch the same mineral deposits. On older LG
      models, partial blockage shows up as weak rinse pressure before the machine
      starts throwing errors. Catching it early costs around $40 in labor. Waiting
      until the valve seizes completely runs three times that.

  - title: "Standing Water After the Cycle"
    description: |
      Pooling water at the bottom of the tub almost always traces back to the
      drain pump — either the impeller is jammed with debris or the motor has
      seized. Bosch dishwashers in 91501 sometimes arrive from installation
      already half-broken if a new garbage disposal was connected without
      removing the knockout plug. Same symptom, two very different fixes.
      Diagnosis first, then quote.

  - title: "Detergent Dispenser That Won't Open Mid-Cycle"
    description: |
      KitchenAid units built between 2015 and 2020 have a documented wax motor
      failure inside the door latch assembly of the dispenser. The door stays
      physically closed, detergent never releases, dishes come out greasy — and
      most people blame the wrong detergent brand for months before calling.
      Replacement wax motors run about $35. The whole repair is under an hour
      once we confirm that's the culprit.

  - title: "Bosch E15 or E24 Error Code That Won't Clear"
    description: |
      Bosch throws E15 when water collects in the base tray and trips the flood
      sensor — sometimes a real leak from the door gasket or heating element seal,
      sometimes just condensation after a hot cycle in a tight under-counter cavity.
      E24 means blocked drain, which in older Burbank kitchens often comes down to
      a kinked drain hose behind the unit rather than a failed pump. Both codes lock
      the machine until the root cause is actually cleared, not just reset.

      Tilting the unit forward to drain the base, then tracing the full drain path
      from tub to garbage disposal connection, usually resolves E24 without replacing
      anything. If the drain pump impeller is cracked or seized, we carry the common
      Bosch pump assembly and can swap it same-day. Call (323) 870-4790 and we can
      usually tell you over the phone which code pattern you're dealing with.

faq:
  - q: "How fast can you get to Burbank for dishwasher repair?"
    a: |
      We dispatch from the Valley and Burbank usually takes 15-20 minutes from
      our nearest route stop. Same-day slots are available most weekdays and
      some Saturdays. Call us at (323) 870-4790 to check today's openings —
      evening appointments are also on the table.

  - q: "Do you work on Bosch and KitchenAid dishwashers specifically?"
    a: |
      Both are among the most common brands we see in Burbank. Bosch 300 and
      500-series control board failures, KitchenAid drain pump burnouts, and
      LG inlet valve leaks make up probably 60% of our dishwasher calls. We
      stock parts for all three and carry Samsung components too.

  - q: "What does dishwasher repair typically cost in Burbank?"
    a: |
      Diagnostic fee is $65, which applies toward the repair. A drain pump
      replacement usually runs $160-230 parts and labor. Spray arm or inlet
      valve work tends to be cheaper. If it's urgent, call (323) 870-4790 —
      same-day and emergency slots are available when your kitchen can't wait.

  - q: "Should I repair a dishwasher that's 8-10 years old?"
    a: |
      Depends on the machine. A Bosch 500-series at year nine with a failed
      control board is usually worth fixing — those units routinely run 15 years
      with one or two part swaps. A base-model Samsung with a seized drain pump
      at year eight is a closer call. The $65 diagnostic visit gives you the
      exact failure and a repair quote; most homeowners make the call from there.
      Schedule online or call (323) 870-4790 for a straight answer on-site.
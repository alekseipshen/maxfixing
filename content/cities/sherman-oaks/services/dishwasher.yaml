  - q: "How fast can you get to Sherman Oaks for dishwasher repair?"
    a: |
      Sherman Oaks sits between the 405 and the 101, which puts it roughly 20–35 minutes from our coverage zone depending on traffic. Van Nuys Boulevard is the fastest north-south route through the neighborhood when the freeway is backed up — which is most hours of the day. Call (323) 870-4790 before noon and we can typically have a technician there by early afternoon the same day. Evening slots are available for households that can't take time off during work hours. From Sherman Oaks we also regularly cover Studio City, Encino, Van Nuys, and Tarzana, so scheduling is rarely a problem.

  - q: "What does dishwasher repair typically cost in Sherman Oaks?"
    a: |
      Cost depends on what's actually broken. Clearing a clogged drain pump impeller or replacing a spray arm runs $85–$150 all-in. A door latch assembly replacement is usually $100–$175. Control board replacements on Samsung or Whirlpool models are the priciest repairs — parts alone can reach $200, and total cost lands between $250 and $350. The diagnostic visit is $65 and gets applied toward the repair if you proceed. Call (323) 870-4790 to get a same-day appointment scheduled; we give you an exact quote before any work starts, no surprises.

  - q: "Does replacing a dishwasher in Sherman Oaks require a permit?"
    a: |
      Yes, if the installation involves modifying or replacing existing supply lines or drain connections. LA Building & Safety requires a plumbing permit in those cases — fees run $100–$150, and inspection is typically scheduled within 5–7 business days of permit issuance. A straight appliance swap where nothing moves — same supply valve, same drain stub, same outlet — technically doesn't require a permit, but if your existing setup has code issues, those will surface during any future home sale inspection anyway. We file all permit documentation under contractor license #1136541 and handle LADBS coordination so you don't have to navigate that process yourself.

  - q: "Can you repair my dishwasher if the control board is throwing a code but nothing seems physically broken?"
    a: |
      Yes, and this is actually a common scenario. Error codes on GE, Frigidaire, and Samsung units often point to sensor failures rather than mechanical breakdown — a float switch stuck by mineral deposits, a faulty door latch sensor, or a degraded water inlet valve solenoid all produce error codes that look like board failures on the surface. We run a full diagnostic cycle before recommending any part replacement. If the board itself has failed — usually identifiable by burn marks or failed solder joints on the relay contacts — we source OEM replacements where available. Aftermarket boards for Samsung models have a spotty compatibility record, so we avoid them on anything other than basic sensor-level repairs.

  - q: "What warranty do you provide on dishwasher repairs?"
    a: |
      Parts and labor are both covered for 90 days from the repair date. Same issue recurs in that window — we come back at no charge. For motor-level and control board replacements, we use OEM components wherever the supply chain allows; aftermarket boards introduce compatibility issues on Samsung and Whirlpool models that create callbacks, so that's not a corner worth cutting. Some GE and Frigidaire replacement parts carry their own 1-year manufacturer warranties, which we pass through directly. Realistic lifespan after a major repair on a well-maintained 8–12 year-old unit is another 3–5 years — longer if you address the underlying hard water issue with a filter or softener on the supply line.


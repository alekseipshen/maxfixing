  - q: "Do you repair LG, Samsung, and Bosch dryers in Carson?"
    a: "All three are common in 90745 and 90746. LG dryers: drum roller wear, moisture sensor failure,
      control board faults. Samsung front-loaders: heating element and thermal fuse problems. Bosch
      condensation dryers need a different diagnostic approach but we carry the parts."

  - q: "What does dryer repair cost in Carson, and is same-day service available?"
    a: "Diagnostic visit is flat-rate, credited toward the repair if you move forward. Most thermal

title: "Carson Dishwasher Repair — Hard Water Kills Units in 90745"

intro: |
  Tap water in the 90745 zip hits around 400 ppm total dissolved solids — that's
  enough mineral load to clog spray arm nozzles inside a year on a Bosch 500 Series.
  Near Dominguez Hills, we see it constantly: homeowners think the dishwasher stopped
  cleaning when really the upper spray arm is packed solid with calcium scale. Catching
  it before the heating element burns out saves a few hundred dollars.

localContext: |
  Carson's housing stock skews heavily toward 1960s and 70s ranch-style homes —
  kitchens built before integrated dishwashers were standard, so installation clearances
  are sometimes tight. In 90746 especially, older tract homes along Figueroa Street
  have galvanized supply lines that add iron deposits on top of the hard water problem.
  That combination wrecks float switches and inlet valves faster than anything else
  we see in the South Bay.

commonProblems:
  - title: "Mineral Scale Blocking Spray Arms — 90745's #1 Dishwasher Complaint"
    description: "Carson water leaves calcium deposits inside spray arm nozzles within 12-18
      months of regular use. On a KitchenAid KDTM354, the lower spray arm clogs first
      — water pressure drops, bottom rack dishes come out greasy. The fix is descaling
      the arm assembly and checking the circulation pump impeller for buildup while we're
      in there."
  - title: "Drain Pump Failure After Years of Hard Water Exposure"
    description: "Mineral grit and food debris combine into an abrasive slurry that grinds
      down the drain pump impeller over time. Samsung dishwashers — common in the newer
      Carson Park townhome developments — throw a 5E or OE error code when the pump
      seizes. Pump replacement on these units runs 45-60 minutes; most are same-day fixes."
  - title: "Door Latch Assembly Failure on Older Units"
    description: "Dishwashers in 1970s Carson homes often run 10-15 years before the door
      latch assembly cracks or the micro-switch inside it fails. Bosch units give you
      a door open error on the display; Whirlpool just refuses to start. Latch kits for
      both are stocked on the van — no second trip needed."


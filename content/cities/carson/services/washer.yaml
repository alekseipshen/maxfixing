commonProblems:
  - title: "Drain Pump Clogged by Scale Buildup"
    description: "Carson's municipal water runs high on calcium — that scale
      accumulates inside the drain pump housing over 18-24 months and
      eventually seizes the impeller. LG front-loaders throw an OE code when
      this happens. Clearing the pump filter buys a few weeks, but a full
      pump replacement is usually what it takes. We stock the LG drain pump
      assemblies in the van."
  - title: "Drum Bearing Failure from Concrete Floor Vibration"
    description: "A failing drum bearing starts as a low metallic groan
      during spin — gets louder fast. Bosch and KitchenAid machines bury the
      bearing behind the rear drum assembly, so it's a full teardown to reach
      it. Common in Carson homes where washers sit on concrete garage slabs
      with nowhere to dampen the vibration transfer."
  - title: "Water Inlet Valve Cracking in Samsung Front-Loaders"
    description: "The WF45 series Samsung units — popular in Carson
      households — develop hairline cracks in the water inlet valve after
      years of hard water cycling through the solenoid body. The machine fills
      slowly or not at all, sometimes logging a 4E error. Direct valve
      replacement fixes it; the OEM part runs $45-60 and the job takes under
      an hour."


title: "Carson Washer Repair — South Bay Hard Water Kills Machines Fast"

intro: |
  Hard water in the 90745 zip hits washers especially hard — the mineral
  deposits that clog the water inlet valve and coat the drum seal are some
  of the worst we see anywhere in the South Bay. The 1970s tract homes off
  Avalon Boulevard mostly have dedicated laundry rooms with standard hookups,
  but LA's water quality doesn't care about your setup. That Samsung
  front-loader throwing an E3 error in your garage utility room? Mineral
  buildup is the first thing to check.

localContext: |

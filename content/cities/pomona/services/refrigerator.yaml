title: "Pomona Refrigerator Repair — Hard Water & Summer Heat"

intro: |
  The water coming out of taps in the 91766 zip — older blocks off Garey Avenue and
  Holt Boulevard near downtown — tests above 300 ppm hardness. That calcium load quietly
  destroys ice maker assemblies and water inlet valves within 3-4 years. Whirlpool and
  GE units that came standard in the 1970s-era rental conversions along Mission Boulevard
  are the ones we see most with compressor noise and persistent ice buildup. Call
  (323) 870-4790 — same-day slots available most days.

localContext: |
  Most of the residential stock in the 91767 zip — Phillips Ranch and the neighborhoods
  north of Cal Poly Pomona — went up between the 1960s and early 1980s. These kitchens
  were sized for 30-inch appliances. A lot of homeowners have since wedged in full-size
  french-door Samsung or LG units that barely clear the cabinet opening. Tight clearances
  restrict airflow around the condenser coils, which pushes the compressor harder during
  Pomona's 100-degree summer stretches.

commonProblems:
  - title: "Mineral buildup clogging the ice maker and inlet valve"
    description: "Pomona's hard water leaves calcium deposits inside the water inlet valve
      and fill tube within 2-3 years of normal use. Once the valve partially clogs, water
      drips instead of filling the tray completely — and ice buildup spreads across the
      evaporator coil from there. LG and Samsung french-door models with bottom freezers
      are especially vulnerable to this exact failure sequence."

  - title: "Compressor overheating through San Gabriel Valley summers"
    description: "Ambient temps above 95°F hit refrigerators in Pomona harder than the
      coastal cities ever see. A clogged condenser fan or dirty condenser coils force the
      compressor to run nearly nonstop just to hold temperature. GE and Whirlpool top-freezer
      units in older homes without central air are the ones we find running warm every July —
      sometimes just a coil cleaning fixes it."

  - title: "Water pooling under the unit — frozen defrost drain"
    description: "Standing water under a refrigerator in Pomona is almost always a blocked
      or frozen defrost drain line. The defrost timer cycles normally, but meltwater has
      nowhere to go and overflows onto the kitchen floor. KitchenAid side-by-side models
      have a particularly tight drain path at the back that ices over faster than most
      manufacturers' designs."

faq:
  - q: "How fast can you get to Pomona for refrigerator repair?"
    a: "We run the 10 freeway from our San Gabriel Valley coverage area — usually 45-60
      minutes to central Pomona. Call (323) 870-4790 and we can typically fit a same-day
      appointment, including evening slots after 5pm. Emergency calls usually get a
      technician out within 2 hours."

  - q: "Do you repair Samsung and LG refrigerators in Pomona?"
    a: "Both show up constantly in this part of the SGV. Samsung french-door units mostly
      need drain pump cleaning and ice maker fill tube replacements. LG repairs usually
      involve door gasket failures or control board resets. Whirlpool and GE are covered
      too — pretty much anything common in a Pomona kitchen."

  - q: "What does refrigerator repair cost in Pomona, and do you handle emergencies?"
    a: "Most jobs land between $150 and $350 depending on the part — swapping a thermal
      fuse costs far less than replacing a compressor. If cooling stopped overnight or
      food is already at risk, call (323) 870-4790 directly. Emergency slots are available
      and we're usually on-site within 2 hours on urgent calls."

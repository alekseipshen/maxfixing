title: "Pomona Ice Maker Repair — Hard Water, Valley Heat, Same Day"

intro: |
  Pomona's summer heat regularly pushes past 100°F on the eastern end of the San Gabriel
  Valley, and refrigerators take the hit first. A Samsung french-door unit in a Garey
  Avenue bungalow will typically show fill valve calcification long before the compressor
  or any other component gives out. The municipal water supply here tests consistently
  above 300 mg/L hardness.

  That's enough to clog inlet screens and freeze water lines solid inside six months of
  normal use — sometimes faster if the homeowner hasn't replaced the inline filter since
  installation.

localContext: |
  Most of the housing stock in Pomona's 91766 and 91767 zip codes dates to the 1950s and
  1960s. Ranch-style tract homes with original copper or galvanized supply lines still
  feeding the kitchen. Those older pipes deposit sediment directly into the water inlet
  valve, shortening its lifespan noticeably. In neighborhoods closer to Cal Poly Pomona
  and the Fairplex, side-by-side Whirlpool and GE units that are 15+ years old run hard
  in utility kitchens with limited airflow around the condenser.

  None of that is easy to diagnose over the phone.

commonProblems:
  - title: "Water Line Freezing in Older Ranch Homes"
    description: |
      In 1960s Pomona homes, the supply line to the freezer compartment often runs through
      an exterior wall or near a poorly insulated cabinet panel. When the freezer thermostat
      runs cold — especially in a Whirlpool side-by-side that's been overcrowded — that
      line freezes solid and production stops completely.

      The fix usually involves replacing the water inlet valve and rerouting or insulating
      the supply line. Skip the insulation step and it refreezes the following winter.

  - title: "Fill Valve Failure from Mineral Buildup"
    description: |
      Hard water is the number one appliance killer in this part of the SGV.

      The fill valve's solenoid screen collects calcium scale until water flow drops below
      the threshold the sensor needs to trigger a fill cycle. LG french-door models throw
      an error code and stop producing ice entirely — sometimes with no warning, sometimes
      after a week of making half-size cubes. Swapping the inlet valve takes about 45
      minutes on most units, but the repair only holds if the customer is running a
      whole-house filter or at minimum a refrigerator inline filter on the supply line.
      Skipping that step means the same failure inside a year.

  - title: "Sensor Malfunction on Samsung Units"
    description: |
      Samsung twin-cooling models popular in mid-2010s builds have a known issue with the
      ice level sensor arm getting stuck or the optical sensor fogging over from humidity.
      The unit reads the bin as full and stops even when it's completely empty.

      Cleaning the sensor assembly resolves it about half the time. The other half requires
      replacing the module entirely — still a same-day repair on most of those models.

faq:
  - q: "How fast can you get to Pomona for ice maker repair?"
    a: |
      We run routes through the eastern SGV daily — coming from the 60 or 10 corridor,
      Pomona is usually a 20-30 minute drive. Same-day slots are available most weekdays,
      and evening appointments stay open for residents who can't be home during the day.
      Call (323) 870-4790 to book or check availability online.

  - q: "Do you repair Samsung and LG refrigerators specifically?"
    a: |
      Yes — those two brands make up a big chunk of what we see in Pomona. On Samsung
      french-door units we frequently replace the module and optical sensor. On LG models
      it's usually the water inlet valve or the control board failing first. Whirlpool
      side-by-sides are also extremely common here and parts are always in stock for those.

      KitchenAid and GE are less frequent but we stock parts for both.

  - q: "What does repair typically cost in Pomona, and how do you handle diagnostics?"
    a: |
      Diagnostic visit is a flat fee, applied toward the repair if you proceed. Most
      jobs — inlet valve swap, sensor replacement, frozen line fix — land between $120
      and $220 in parts and labor.

      Emergency same-day service carries no surcharge. Schedule online or call
      (323) 870-4790; we're usually at the door within two hours on urgent calls.


title: "Pomona Range Hood — Grease Clogs, Dead Fans & Duct Fixes"

intro: |
  Cooking smells that linger past midnight are a sign — the hood isn't
  moving air. Around the older blocks near Garey Avenue and the
  residential streets just east of downtown Pomona, households cook
  heavily on gas ranges daily. That KitchenAid wall-mount hood running
  above a six-burner gets loaded with grease faster than most people
  expect, and once the filter packs tight, the motor starts working
  against itself.

  The kitchen suffers for it.

  Range hood work in this part of Pomona is rarely a quick look.

localContext: |
  A large share of Pomona's housing stock is 1960s and 1970s
  ranch-style construction — the 91766 and 91767 zip codes have
  thousands of these homes. The original ducted hoods were sized for
  minimal cooking, not the daily high-heat use people put on them now.
  Duct runs in those builds are often short with tight 90-degree bends,
  which kills airflow even when the fan motor is technically fine.
  Phillips Ranch, built out in the 1980s east of Diamond Ranch Road, has
  slightly better-planned ventilation but the same grease and mineral
  buildup problems as the older blocks.

  Hard water hits this area harder than most homeowners realize.

  Pomona's municipal water supply runs around 350–420 mg/L in dissolved
  calcium — some of the hardest tap water in the San Gabriel Valley.
  Scale accumulates on duct interior walls and around the exhaust damper
  over two or three years of cooking. The passage narrows, the hood
  struggles to clear smoke even with a freshly cleaned filter, and most
  people blame the fan when the real problem is the duct. Homes along
  McKinley Avenue and White Avenue, just west of the Fairplex grounds
  where the LA County Fair runs every September, tend to have compact
  galley kitchens. The under-cabinet hood barely clears the upper
  cabinets in there. Pulling the motor housing for a blower wheel
  replacement means removing the entire unit from the bracket — not
  dangerous, just tight work that adds time.

  Over in the 91768 zip — the corridor running toward Cal Poly Pomona
  along Temple Avenue — you get a different mix: older student rentals,
  converted duplexes, and owner-occupied homes from the 1950s.

  Range hoods in those rentals often go five or more years without
  filter cleaning. The blower wheel accumulates grease until it's
  throwing visible vibration, and by then the motor shaft is usually
  scored too.

commonProblems:
  - title: "Blower Wheel Seizure From Accumulated Grease"
    description: |
      Once the grease filter goes too long without a wash, particulate
      bypasses it and coats the blower wheel directly. That buildup
      throws the wheel off-balance and eventually locks the fan motor.
      Samsung and GE hoods with this problem usually grind for a week
      before going silent entirely.

      Replacing the motor and cleaning the blower wheel at the same
      visit is standard — doing one without the other just delays the
      next failure. On GE Profile models the blower wheel clips onto
      the motor shaft; on Samsung under-cabinet units it's friction-fit,
      which makes cleaning harder without full disassembly. Either way,
      the correct parts for both brands are usually on the truck.

  - title: "Vent Duct Blockage Causing Smoke Backdraft"
    description: |
      Older duct runs in Pomona — particularly in 1970s construction
      near Indian Hill Boulevard — tend to have 90-degree bends that
      trap grease over years of use.

      Exhaust pressure drops, and you start getting smoke pushing back
      into the kitchen even with the hood running full speed. Clearing
      the obstruction or replacing a clogged elbow fitting restores
      proper draw and stops the backdraft completely. The hard-water
      scale on duct walls narrows the passage too — sometimes both
      problems are present in the same run, and fixing just one doesn't
      solve it.

  - title: "Control Board Failure Taking Out Lights and Speed Settings"
    description: |
      In KitchenAid and Bosch under-cabinet hoods, the control board
      tends to fail before the motor does. Usually the lighting circuit
      drops first — the light stops working while the fan still runs
      on one speed only.

      The socket mount corrodes separately in humid kitchens, but the
      board itself is typically the root cause. Swapping it takes about
      45 minutes once the correct replacement is sourced.

faq:
  - q: "How fast can you get to Pomona for range hood repair?"
    a: |
      Coming west on the 10, we're in Pomona within 45 minutes from
      most of our service area. Same-day slots are available most
      weekdays. Call (323) 870-4790 and we'll confirm an arrival
      window within the hour — evening appointments are available too.

  - q: "Do you repair GE and Samsung range hoods in this area?"
    a: |
      Yes — GE Profile and Samsung under-cabinet models are two of
      the most common hoods we work on in the 91766 and 91767 zip
      codes. Whirlpool over-the-range units and older KitchenAid
      wall-mounts are also frequent. Blower motor replacements,
      control board swaps, wiring issues — all covered.

  - q: "What does range hood repair cost, and how does the process work?"
    a: |
      Diagnosis happens on-site first — you get a firm price before
      any work starts. A blower motor or wheel replacement typically
      runs $150–$250. Control board jobs land closer to $200–$300
      depending on the model. Parts for common GE and KitchenAid
      units are usually stocked. Schedule online or call
      (323) 870-4790 — same-day service most days.
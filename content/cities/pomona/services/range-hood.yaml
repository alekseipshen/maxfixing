title: "Pomona Range Hood Repair — Duct Grease, Fan Failures Fixed"

intro: |
  Holt Avenue splits Pomona nearly in half, and on both sides of it you'll find the same story: a kitchen that's been cooking hard for forty years with an exhaust hood that's never been properly serviced. That GE or Whirlpool over-the-range unit above a six-burner stovetop pulls smoke, steam, and grease aerosols all day — and when the blower motor finally quits, it usually quits during dinner. The Fairplex sits a few minutes away, but fixing your hood is more urgent than the fair. Pomona kitchens run hot and run often, and the ventilation equipment above the stove takes the full brunt of that.

localContext: |
  Zip code 91766 covers the older residential core south of Holt Avenue — stucco ranchers and block homes built between 1952 and 1968 with ductwork sized for the low-CFM hoods that were stock in those kitchens. In the Reservoir Hill area and near Ganesha Park, wall ducts often run only 6 feet before hitting an exterior cap that hasn't been inspected since installation. Duct diameter in those runs is frequently 3.25-inch rectangular — undersized even for modern exhaust fans, which accelerates grease accumulation and restricts airflow enough to cause motor overload.

  Phillips Ranch, also 91766, has newer tract construction from the late 1970s and early 1980s. The KitchenAid and Bosch units installed during kitchen remodels there are now aging past their ten-year service window. Over in the 91767 zip — north of the 10 freeway, running up toward Lincoln Park and the streets bordering Cal Poly Pomona — you'll find a different mix: duplexes and rental homes where exhaust fans have been cleaned never, by anyone, in living memory. Those are the calls where the aluminum grease filter is essentially solid. The neighborhood around Garey Avenue and Bonita Avenue has a lot of mid-1960s construction where ductwork exits through a soffit rather than a wall, making access trickier.

  A third zone in Pomona runs along Indian Hill Boulevard into the 91768 zip — 1990s-era tract homes where the original builder-grade Whirlpool or GE unit is still installed and has been running 25–30 years without a bearing replacement. Western University of Health Sciences anchors that corridor, which means the surrounding rental stock gets heavy turnover and almost zero appliance maintenance between tenants. Narrow driveways and older carports off Garey are a logistics consideration for service vans, but we route this area regularly enough to know which blocks need a smaller vehicle.

commonProblems:
  - title: "Blower Motor Burnout From Grease-Choked Aluminum Filters"
    description: "Aluminum mesh grease filters need cleaning every month under active cooking — most go years without it. In 91766 and 91767 homes where the stovetop runs daily, the mesh packs so solid the blower motor is essentially pulling against a wall. GE and Whirlpool motors overheat, the windings burn out, and the fan stops. At that point cleaning the filter is beside the point — the motor itself needs replacement, usually $140–$200 in parts depending on the model. Pomona homes near Garey Avenue with undersized 3.25-inch duct runs see this failure especially often because restricted airflow compounds the thermal load on the motor windings."

  - title: "Loud Rattling or Grinding at Any Speed Setting"
    description: "A blower wheel loose on its motor shaft is the number-one noise complaint on overhead exhaust units. On KitchenAid and Bosch models common in Phillips Ranch renovated kitchens, the plastic fan blades develop hairline cracks after years of heat cycling. The wheel wobbles and the vibration transmits through the cabinet at every speed. Replacing the blower wheel assembly fixes it — but it requires full hood removal from the cabinet mount, which is a two-person job on heavier built-in models."

  - title: "Damper Stuck Shut, Smoke Recirculating Back Indoors"
    description: "Older Pomona homes in the 91767 zip route exhaust through a small wall-mounted exterior damper — usually a plastic or galvanized flap that should swing open when the fan runs. Grease, dust, and occasionally a bird nest seal these shut entirely. Samsung over-the-range models default to recirculating mode with a charcoal filter if the external duct path is blocked, so the homeowner doesn't always notice — the fan runs, the light works, but smoke fills the room."

faq:
  - q: "How fast can you get to Pomona for range hood repair?"
    a: "Pomona is on our daily San Gabriel Valley route — we cover it from La Verne down to Chino Hills. From your call, a same-day appointment is usually available, including evening slots on weekdays. For urgent situations we can often be there within 2 hours. Call (323) 870-4790 and we'll confirm a window before committing you."

  - q: "Do you repair KitchenAid, Bosch, and Samsung range hoods?"
    a: "All three are regular calls in the 91766 and 91768 areas. KitchenAid units typically need blower wheel or motor mount work. Bosch often has control board failures or worn capacitors on the motor circuit. Samsung over-the-range models commonly come in with stuck dampers and clogged charcoal filter assemblies. LG is covered as well."

  - q: "What does range hood repair cost and how quick is the turnaround?"
    a: "Diagnostic is $75, applied toward repair if you proceed. Blower motor replacement runs $150–$250 all in. Damper repair or duct cleaning is usually under $110. Most single-part repairs finish the same visit — we carry common Whirlpool, GE, and Samsung components in the van. Call (323) 870-4790 or schedule online to get on the same-day list."
title: "Pomona Cooktop Repair — SGV Gas Lines & Ceramic Surfaces"

intro: |
  Most homes near the Fairplex and along Garey Avenue date to the 1950s and '60s — original gas plumbing, narrow kitchen layouts, appliances swapped in and out over decades. That GE or KitchenAid gas cooktop installed on an old tile countertop runs fine until one igniter electrode cracks or the burner cap clogs with residue. Hard water in the San Gabriel Valley runs notoriously mineral-heavy, and those deposits accelerate every single failure mode on a gas burner. Pomona sits at the eastern end of the SGV where water hardness can exceed 300 ppm — noticeably worse than West LA — and it shows up fast on burner caps and igniter tips.

localContext: |
  Zip code 91766 covers a dense stretch of older single-story ranch homes west of Garey — kitchens that haven't been remodeled since the '70s, with cooktops sitting in tight cutouts surrounded by original cabinetry. The stretch along Holt Avenue and into the Westmont neighborhood has a lot of this stock: drop-in gas cooktops with yellowed grout around the cutout, original GE or Whirlpool units that have outlasted two or three countertop replacements. Some of the rental stock near Cal Poly Pomona runs compact electric or smooth-top ceramic units from Samsung or LG. Accessing the gas supply shutoff or pulling a drop-in cooktop in these kitchens takes more time than newer construction, but the gas infrastructure itself is usually solid.

  Further north, around the 91767 zip near Garey High School and the older neighborhoods off White Avenue, you see a different mix — more homeowners who've upgraded to mid-range Bosch or KitchenAid slide-in ranges, but the gas lines behind the walls are still original copper from the Eisenhower era. The Indian Hill corridor between Pomona and Claremont has a handful of newer tract homes with induction or dual-fuel cooktops, and those require a completely different diagnostic approach than a 30-year-old gas burner setup.

  The apartment corridors along Towne Avenue and south of the 10 freeway are a different job entirely — multi-unit buildings from the '80s with stacked tenants, shared gas meters, and electric smooth-tops crammed into galley kitchens. Landlords in that corridor often delay repairs until the tenant escalates, which means by the time we show up the heating element has been running damaged for weeks. We've pulled failed LG radiant elements out of units in that stretch where the ceramic surface showed stress fractures along the entire rear burner zone.

commonProblems:
  - title: "Igniter electrode failure from SGV mineral buildup"
    description: "Hard water residue and grease carbonize around the igniter electrode tip on gas cooktops, eventually blocking the spark entirely. On KitchenAid and GE five-burner models, one fouled electrode often triggers a rapid-click loop across all burners even when you're only trying to light one. Cleaning or replacing the electrode and burner cap assembly usually resolves it — but if the spark module itself is gone, that's a board-level fix. In Pomona specifically, minerals bake onto the electrode faster than in coastal cities; homes in 91766 with original tile grout around the cooktop cutout trap moisture that compounds the buildup. We see this constantly in the Westmont and Holt Avenue neighborhoods."
  - title: "Cracked ceramic surface on smooth-top electric units"
    description: "Ceramic glass cooktops crack from thermal shock — a cold pan, a dropped lid, uneven heat expansion. LG and Samsung smooth-top models in Pomona rentals take a beating, and a crack that looks cosmetic can expose live heating elements underneath. The glass surface is structural here, not decorative. Full ceramic panel replacement is the right call; surface patches don't hold under cooking temperatures. On Samsung models specifically, you may also see an E-1 or E-2 error code on the control panel alongside visible cracking — that's the temperature sensor reading incorrectly through the damaged glass. Rental units near Cal Poly Pomona on the south end of 91766 are the most common source of these calls."
  - title: "Knob malfunction and gas valve igniter failure"
    description: "On Bosch and GE gas cooktops, the knob shaft connects directly to a gas valve — when the shaft cracks or the D-post strips, the burner won't turn off cleanly. That's not a cosmetic problem. The gas valve igniter assembly behind the panel controls both gas flow and spark timing, and a worn valve seat can let gas seep even with the knob in the 'off' position. Older kitchens on Holt and White Avenue often have these symptoms compounded by decades of grease accumulation inside the valve body — homes built before 1965 that have never had the valve assembly serviced. Call us at (323) 870-4790 if a burner isn't shutting off cleanly — don't leave it for the weekend."

faq:
  - q: "How fast can you get to Pomona for a cooktop repair?"
    a: "We run service routes through the 10 and 60 corridors daily — Pomona is a regular stop. Same-day appointments are usually available, and we can typically be on-site within 2 hours of your call. Parking on residential streets in 91766 and 91767 is straightforward, and we know the neighborhood layouts well enough to find drop-in cooktop shutoffs in kitchens that haven't been touched since the Carter administration. Call (323) 870-4790 to book, or schedule online if you prefer."
  - q: "Do you repair Samsung and LG cooktops in Pomona?"
    a: "Yes — Samsung and LG are two of the most common brands we see in SGV rentals and mid-range homes. On Samsung smooth-tops, we frequently replace cracked ceramic panels and faulty heating elements; the NE63 and NE58 series are especially common around the Cal Poly Pomona area and the Towne Avenue apartment corridors. LG gas models often need igniter electrode or spark module work. Bosch and GE repairs are also routine for us, including the older drop-in models still sitting in '60s-era kitchen cutouts throughout the Westmont neighborhood."
  - q: "What does a cooktop repair typically cost, and do you offer same-day service?"
    a: "Diagnosis is flat-rate, applied toward the repair. Most igniter, knob, and heating element jobs run $150–$300 depending on parts. Ceramic panel replacements cost more due to parts — the glass alone on a Samsung or LG smooth-top runs $180–$260 wholesale. Same-day and evening slots are available — schedule online or call (323) 870-4790. Emergency service available for gas-related issues, including gas valve failures that can't wait until morning."
title: "Pomona Cooktop Repair — Hard Water, Gas Lines, Fixed Fast"

intro: |
  Mineral buildup in the San Gabriel Valley runs high — Pomona tap water tests around 380-420 ppm hardness, and that calcium scale destroys igniter ports on gas cooktops within a couple of years. A Whirlpool five-burner near the Fairplex area stops lighting on the back burners first, usually from a crusted igniter tip rather than a faulty gas valve. LG gas models show the exact same pattern here. Electric cooktops aren't immune either — scale accumulates around heating element contacts on glass-surface units, causing uneven heating before any visible crack appears.

localContext: |
  Most of Pomona's housing stock dates from the 1940s through the 1970s — ranch-style homes in zip 91767 near Ganesha Park often have original gas connections that reduce flow slightly, making burner ignition sluggish even after basic cleaning. The 91766 zip around older corridors like Garey Avenue tends toward cramped kitchen layouts in smaller homes, meaning we sometimes need to pull a cooktop completely off the counter to reach igniter wiring and the spark module underneath.

  Homes closer to the Cal Poly Pomona campus in 91768 skew toward mid-century construction with 30-amp circuits — enough for most four-burner electric cooktops, but tight if a previous owner swapped in a five-element model without upgrading the breaker. That mismatch shows up as nuisance tripping rather than a failed cooktop component. Worth checking before replacing any parts. Gas-line pressure in some of the older sections near McKinley Avenue also runs low enough that dual-ring burners on KitchenAid models won't hit full BTU output even with clean igniters and open ports.

commonProblems:
  - title: "Mineral Scale Blocking Igniter Ports on Gas Cooktops"
    description: "Hard water at 380+ ppm leaves calcium deposits inside igniter tip housings — a thin white crust builds over two or three years until the spark electrode can't arc cleanly. Bosch four-burner units: the igniter module itself tests fine, but the port needs physical descaling with a brass tool and citric acid solution before reinstalling. That same buildup clogs KitchenAid gas cooktops throughout 91766, usually starting on the high-BTU front burner first. After descaling, we test igniter dwell time to confirm the spark module is still producing adequate voltage — if it's dropping below 15kV on load, the module gets replaced at the same visit."
  - title: "Cracked Ceramic Glass Panel on Electric Cooktops"
    description: "Cold pots hitting a hot glass surface cause thermal shock fractures in the ceramic panel. On GE and Samsung electric cooktops, that crack exposes the heating element underneath — a genuine shock hazard, not cosmetic damage. Glass panels are model-specific; replacement also requires recalibrating the surface temperature sensor to prevent control board error codes from misfiring after the swap. Samsung smooth-top units in particular throw an E1 or E3 fault after a panel swap if the thermistor connection isn't reseated fully. GE ceramic tops tend to crack radially from the element ring outward — if the crack hasn't reached the edge trim, the element itself is usually still intact and doesn't need replacement."
  - title: "Single Burner Dead — Igniter Switch Assembly Failure"
    description: "A single non-sparking burner usually means a failed igniter switch assembly, not the whole control board. Whirlpool gas cooktops use a shared spark module that runs all four burners — one bad electrode switch sometimes trips a fault that kills sparking everywhere. Replacing just the failed switch assembly restores full ignition without touching the gas valve or the supply line. On LG gas cooktops, a dead burner can also trace to a corroded wiring harness connector near the spark igniter rather than the switch itself — the connector oxidizes faster in kitchens where the exhaust hood vents poorly, which is common in the older single-wall houses around Pomona's downtown corridor."

faq:
  - q: "How fast can you get to Pomona for cooktop repair?"
    a: "Coming in from the 10 freeway east, Pomona is usually 35-45 minutes from our main service corridor. Same-day appointments are available most days, evening slots included. Call (323) 870-4790 and we'll confirm what's open today."
  - q: "Do you repair Samsung and LG cooktops in Pomona?"
    a: "Both come up constantly in this area — Samsung glass-top units with cracked ceramic panels, LG gas models with failed igniter modules. Bosch and KitchenAid are regulars too, especially in homes near Phillips Ranch and the Cal Poly Pomona corridor. GE electric cooktops show up frequently in the older 91766 rentals, usually needing a surface element switch or a burned heating coil rather than anything major."
  - q: "What does cooktop repair typically cost in Pomona?"
    a: "An igniter switch assembly swap runs $80-150 in parts plus labor. Ceramic glass panel replacement costs more — typically $200-350 depending on the model. Diagnosis happens on-site before any quote. Same-day emergency slots are available; call (323) 870-4790 to check."
  - q: "Can you repair gas cooktops in older Pomona homes with original gas lines?"
    a: "That's a common situation in 91767 and 91766 — original 1/2-inch black iron supply lines running to 1970s-era cooktops that have since been swapped for modern five-burner units with higher BTU ratings. Low line pressure accounts for at least a third of the 'weak flame' calls we get in Pomona. We test inlet pressure at the cooktop during diagnosis and advise on whether a plumber needs to address the supply side before a new appliance will perform correctly. No point replacing a gas valve if the line upstream can't feed it properly."
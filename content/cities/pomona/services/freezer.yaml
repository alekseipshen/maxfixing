title: "Pomona Freezer Repair — Same-Day Service, SGV Homes"

intro: |
  Triple digits hit the 91766 zip from June through September, and a freezer
  struggling in that heat doesn't give you much warning before everything inside
  thaws. Families near the Fairplex area often run a second chest freezer in the
  garage — that's where an older Whirlpool or GE unit shows compressor stress
  first. Frost buildup, temperature swings, a loud hum at midnight. These aren't
  quirks. They're early warnings.

localContext: |
  A lot of Pomona's residential blocks — especially around Lincoln Park and the
  streets feeding off Garey Avenue in 91767 — date from the 1950s and 1960s.
  Ranch-style homes and older bungalows, compact kitchens, circuits that weren't
  sized for today's larger refrigerator-freezer combos. Upgrading to a Samsung or
  LG french-door model in one of those kitchens sometimes means tight clearances
  and poor ventilation around the condenser coils — which accelerates wear faster
  than the manufacturer's warranty cycle.

  The neighborhoods east of downtown Pomona, out toward the Cal Poly Pomona
  campus and along Temple Avenue in 91768, tend to have a mix of newer tract
  homes and older rentals. Both have their own problems. Rentals often have
  appliances that haven't been serviced in a decade. Newer homes sometimes get
  oversized freezer units crammed into utility closets without proper clearance
  behind the condenser. South Pomona, closer to the 71 freeway interchange, has
  denser multi-family housing — smaller kitchens, shared utility spaces, and
  older Kenmore or Frigidaire chest freezers that have been running continuously
  for fifteen years. By the time the evaporator fan motor starts grinding, the
  owner has no idea when it was last looked at.

  The Ganesha Park area and the blocks running north toward the 210 freeway in
  91767 are mostly mid-century single-family homes with detached garages — that's
  exactly where the second freezer situation plays out. A Whirlpool chest freezer
  sitting in an un-insulated garage in Pomona pulls about 30% harder in July than
  it would inside an air-conditioned kitchen. Compressor lifespan shrinks fast
  under those ambient temps. By August, that unit is running almost continuously.
  The 91766 streets between Holt Avenue and Arrow Highway have the same pattern —
  older wood-frame houses, detached garages, and appliances that get forgotten
  until they fail.

  Hard water is another Pomona-specific factor. The Inland Empire water supply
  runs high in calcium and magnesium — mineral scale builds up inside ice maker
  assemblies and around the water inlet valve faster here than in coastal cities.
  An ice maker that stops producing on a Samsung or LG unit is often a scale
  blockage, not a failed part. That's a $90 flush versus a $300 board replacement
  if you catch it early.

commonProblems:
  - title: "Freezer Temps Creeping Up During Pomona's Hot Months"
    description: >
      A defrost timer that's stuck or a failing evaporator coil can let internal
      temps drift to 18-22°F — still looks cold, but your food is slowly thawing.
      GE and Whirlpool chest freezers sitting in garages along the 10 freeway
      corridor work overtime from June through October. Clogged condenser coils
      trap heat, the compressor runs hot, and the whole refrigeration cycle
      starts breaking down. Garage ambient temps in Pomona can hit 105°F on
      peak summer days — a freezer not rated for that environment will show
      error code first, then fail silently.

  - title: "Thick Frost Layer Coating the Inside Walls"
    description: >
      A worn door gasket is almost always the culprit. Summer humidity in Pomona
      seeps in constantly through even a small seal gap, and that moisture
      refreezes on the evaporator coil into a solid sheet of ice. Samsung
      french-door models tend to develop door seal failures around year four or
      five. Once that gasket fails, no defrost cycle can keep up with the
      incoming moisture load. Defrost heater assemblies in these units also burn
      out when they're cycling more than they should — it's a cascade failure
      that starts with a $60 gasket and ends with a $250 heater replacement if
      it's ignored.

  - title: "Grinding or Clicking Noise Coming From the Freezer"
    description: >
      That sound usually means the condenser fan motor is going, or the
      compressor is working too hard to compensate for something else that's
      wrong. LG and KitchenAid units handle it differently — on LG the fan
      blade often ices over first, on KitchenAid it's usually the motor
      bearings. In the older homes near Cal Poly Pomona with thin interior
      walls, you'll hear it in the next room before the freezer actually fails.
      A failing compressor on a Whirlpool upright freezer will often throw a
      temperature alarm before it fully quits — don't wait on that signal.

faq:
  - q: "How fast can you get to Pomona for freezer repair?"
    a: >
      We run routes through the 91766, 91767, and 91768 zip codes every day.
      Most calls get a tech out same day — usually within 2 hours of booking.
      Call (323) 870-4790 or schedule online and we'll give you a firm
      2-hour arrival window, not a vague all-day slot.

  - q: "Do you repair Samsung and LG freezers in Pomona?"
    a: >
      Yes — those two brands cover probably half our Pomona calls. We carry
      door gaskets, evaporator fan motors, and control boards for both in
      the van. Whirlpool and GE are close behind, especially the older
      standalone chest freezer models that have been running for 10-plus years.

  - q: "What does freezer repair cost, and do you charge for the diagnosis?"
    a: >
      Diagnosis is free when you move forward with the repair. A door gasket
      swap typically runs $120-180; compressor or evaporator coil work is
      more, but you'll get a flat quote before we touch anything. Evening
      slots available — no emergency surcharge for after-hours bookings.

  - q: "My ice maker stopped working — is that a freezer repair or something else?"
    a: >
      Usually it's the freezer. The most common culprits are a clogged water
      inlet valve, a failed ice maker assembly, or mineral scale from Pomona's
      hard water blocking the fill tube. Call us at (323) 870-4790 — if it's
      just a scale buildup we can clear it same visit. If the ice maker module
      itself needs replacing, we stock the common Samsung and LG assemblies in
      the van.


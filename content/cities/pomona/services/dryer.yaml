title: "Pomona Dryer Repair — Hard Water, Long Ducts, Fast Fix"

intro: |
  Hard mineral deposits in San Gabriel Valley tap water aren't just a
  dishwasher problem — they coat moisture sensor bars inside Samsung and
  LG dryers too, making the control board think clothes are dry when
  they're still damp. The neighborhoods around Lincoln Park and the older
  blocks east of Garey Avenue see this constantly. Houses built in the
  '50s and '60s compound the problem with duct runs nobody has cleaned
  in twenty years.

localContext: |
  Most of 91766 and 91767 developed between 1945 and 1975 — ranch-style
  homes where laundry hookups were added as afterthoughts, usually in a
  hallway closet or converted garage. Duct runs in these layouts tend to
  be 15-20 feet with at least one hard elbow, which kills airflow faster
  than lint alone. Homes near Holt Avenue in 91768 often run gas dryers
  on original flex connectors that haven't been inspected in decades.

commonProblems:
  - title: "Thermal Fuse Blown — Usually the Duct, Not the Dryer"
    description: >
      Those long duct runs through Pomona ranch walls — 18 feet with two
      90-degree elbows — are the main reason thermal fuses trip. The fuse
      sits behind the heating element and cuts power when exhaust backs up.
      Whirlpool and GE units are especially vulnerable. Replacing the fuse
      without clearing the blockage upstream means it blows again in weeks.

  - title: "Drum Stops Spinning — Belt or Roller Failure"
    description: >
      A dryer that hums but won't tumble is almost always a snapped drive
      belt or a seized drum roller. LG front-loaders develop flat spots on
      the rollers after five or six years of heavy use — first you hear
      thumping, then the drum stops completely. Swapping both the belt and
      rollers at once avoids a second service call a few months later.

  - title: "Takes Forever to Dry — Mineral-Caked Moisture Sensors"
    description: >
      Clothes coming out of a hard-water wash cycle carry dissolved calcium,
      and tumbling deposits it right on the sensor bars inside the drum.
      The Samsung control board reads "dry" at 80% — clothes come out warm
      but damp. Cleaning the sensor bars with fine steel wool takes five
      minutes and typically cuts dry time by 20-30% immediately.

faq:
  - q: "How fast can you get to Pomona for dryer repair?"
    a: >
      Coming from our SGV base, we're typically in Pomona within 2 hours.
      The 10 and 71 freeways are the usual routes — residential parking in
      most neighborhoods is straightforward. Call (323) 870-4790 or schedule
      online; same-day slots fill by noon most days.

  - q: "Do you repair Samsung and LG dryers in Pomona?"
    a: >
      Both brands, constantly. Samsung moisture sensor and control board
      issues, LG drum roller and drive belt failures — those are the most
      common dryer calls we get in Pomona. Whirlpool and GE units make up
      roughly half the installs in the older 91766 zip, and we stock common
      parts for those too.

  - q: "What does dryer repair cost in Pomona, and do you have evening slots?"
    a: >
      Most repairs land between $150 and $300 — a thermal fuse is cheap, a
      control board costs more. Evening and weekend appointments are available
      if daytime doesn't work. Call (323) 870-4790 and we'll usually confirm
      a same-day window within the hour.

title: "Chatsworth Dishwasher Repair — Hard Water & Drain Fixes"

intro: |
  Hard water is Chatsworth's quiet kitchen enemy. LADWP supply lines feeding 91311 consistently test above 300 mg/L total dissolved solids — some of the highest calcium load in the San Fernando Valley. Inside the late-'60s ranch homes spreading east from Stoney Point Park toward Mason Avenue, that mineral load doesn't stay in the pipes. It packs into spray arm nozzles, coats the heating element, and eventually chokes the inlet valve shut. A Kenmore built-in that ran without complaint for eight years can start leaving white film on glasses, then stop draining entirely — not because it's worn out, but because mineral scale has blocked the wash circuit. Prairie Street and the surrounding Chatsworth residential grid see this pattern constantly. The failure is predictable, the fixes are usually fast, and most of the time a repair makes far more sense than a replacement.

localContext: |
  Chatsworth's housing stock clusters tightly in a roughly 20-year construction window — 1958 to 1978 — when developers platted street after street of 3-bedroom ranches and filled the kitchens with GE and Frigidaire appliance packages. Both 91311 and 91313 carry this same pattern. Kitchens were sized for 24-inch freestanding dishwashers, and that's still what's in most of them. East of Topanga Canyon Boulevard, near the old Chatsworth Reservoir, many homes have aging galvanized supply lines that add iron to the calcium already in the water — a combination that turns float switches and door gasket seals orange-brown inside 18 months. Summer is brutal for appliances in this part of the Valley. Ambient kitchen temps regularly push 90°F or above, which stresses control boards and can cause a thermal fuse to blow mid-cycle — a fault that looks like a dead machine but is almost always a sub-$20 fix. The Reservoir-area streets and the Lassen Street corridor see the most service calls from us every July and August.

commonProblems:
  - title: "Mineral-Clogged Spray Arms — Why Dishes Still Look Dirty"
    description: |
      The spray arm is the rotating plastic disc that jets water at your dishes during a wash cycle. It has roughly a dozen nozzles, each around 2mm wide. One full year of Chatsworth hard water reduces those openings to under 1mm, sometimes blocking them completely. The result looks like a failing machine — glasses still greasy, food still stuck to the bottom rack — but the actual problem is flow restriction, not a bad pump or dying motor. A Whirlpool WDT730PAHZ and a Samsung DW80R9950UG both show the same symptom under these conditions: the upper rack gets almost no pressure because the upper spray arm is essentially plugged. Replacing the spray arm assembly runs $25–45 in parts and takes about 20 minutes. If the inlet valve also has mineral buildup — common in 91311 — that's another $60–90 in parts and brings total repair time to roughly 45 minutes.

  - title: "Standing Water After the Cycle — Drain Pump and Filter Issues"
    description: |
      A puddle sitting at the bottom of the tub after a completed cycle comes down to two culprits: a clogged drain pump filter, or a failed drain pump motor. The filter is a 10-minute owner fix. The motor is not. On a Frigidaire FGID2476SF or a GE GDT665SSNSS, the drain pump sits beneath the wash basin and connects through a rubber hose to the sink drain. When the pump's impeller cracks — often from a shard of glass that made it past the filter — or seizes from hard mineral deposits, you get standing water and sometimes a faint sewer smell from wastewater sitting overnight. Drain pump motors run $55–120 depending on brand and model, with labor adding roughly an hour because the unit needs to slide out from under the counter. Homes with tight cabinet installations in Chatsworth's older kitchens can add 20 minutes just for clearance.

  - title: "Door Won't Latch or Stops Mid-Cycle — Door Latch Assembly Wear"
    description: |
      A dishwasher that starts, runs 3–4 seconds, then cuts out is almost always reading a door-open fault. The door latch assembly includes a mechanical catch, a strike plate, and a microswitch — and the microswitch fails first, usually without any visible damage. Kenmore 665-series units, extremely common in Chatsworth homes from the 1990s, are well-known for this failure mode. Owners typically assume the control board has died — a $200-plus part — when the actual failure is an $18 microswitch. Chatsworth houses built in the '70s sometimes have slightly off-level floors from decades of settling, which puts uneven stress on door alignment and speeds up latch wear. Replacing the full door latch assembly runs $40–75 in parts and takes under an hour. For any permitted electrical work tied to the repair, our contractor license covers the job.

  - title: "Detergent Dispenser Stuck Closed — Bimetal Thermostat Failure"
    description: |
      The detergent dispenser door is spring-loaded and held by a bimetal thermostat that releases it when wash water hits the correct temperature. Chatsworth's hard water deposits calcium on that mechanism, and over time it stiffens or seizes entirely. The giveaway: your pod or powder is still sitting dry in the dispenser cup at the end of a full cycle. A Samsung DW80K5050US showing this symptom almost always needs the bimetal thermostat replaced — a $20–35 part. If the dispenser housing has cracked from years of heat cycling, a full replacement assembly runs $45–80. Turnaround is typically same-day on this repair — common Whirlpool and Samsung dispenser assemblies ride on the van. Call (660) 999-9960 to schedule a same-day Chatsworth appointment. This is one of the faster fixes we do, usually resolved in a single visit under an hour.

  - title: "Error Codes Won't Clear — Inlet Valve and Float Switch Diagnosis"
    description: |
      Two fault codes appear in Chatsworth more than any others: inlet-side errors (Samsung's 'IE', Whirlpool's 'F8E4') and drain-side errors (LG's 'OE', GE's 'E1'). The inlet valve is a solenoid-operated component that opens to let water into the tub — calcium buildup can hold it partially closed, triggering an underfill fault. The float switch, which rises with the water level, gets stuck in the raised position when mineral scale builds up on the float stem, making the machine shut off early as if the tub is already full. Monthly descaling with a cup of white vinegar and a quarterly citric acid tablet pushes a Chatsworth dishwasher's service life from around 9 years to 13 or 14 in a high-mineral-water environment like 91311. When codes keep returning despite regular cleaning, replacing the inlet valve assembly or float switch is the next step — combined parts cost usually runs under $60.


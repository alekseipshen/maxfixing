  - q: "What does wine cooler repair cost in Chatsworth?"
    a: |
      The diagnostic visit is $75, applied toward the repair cost if you move forward.
      Common fixes — thermistor replacement, condenser fan motor, door gasket, start relay
      — typically run $120 to $250 all-in with parts and labor. Control board replacements
      land between $250 and $375 depending on the unit. Refrigerant recharge or compressor
      replacement can exceed $300, and sometimes approaches the cooler's replacement value;
      we'll flag that comparison clearly before doing any work. Pricing is confirmed
      on-site before anything is touched — no surprise invoices at the end.

  - q: "Do built-in wine cooler installations in Chatsworth require a city permit?"
    a: |
      Standard freestanding wine cooler repair and installation doesn't require a permit.
      Built-in conversions involving a new dedicated 20-amp circuit do — Chatsworth falls
      under City of Los Angeles Department of Building and Safety jurisdiction, and any
      panel modification triggers their electrical permit process. Our technician holds
      contractor license #1136541 and can assess on-site whether your specific setup
      crosses that threshold. Simple under-counter slide-in installs using an existing
      outlet rarely require permits. When they do, we coordinate the paperwork and
      scheduling so you don't have to manage the LADBS process yourself.

  - q: "Do you repair thermoelectric wine coolers, or only compressor-based models?"
    a: |
      Both types. Thermoelectric coolers use a Peltier module instead of a compressor —
      no refrigerant, no cycling motor, but much more sensitive to ambient heat.
      The Peltier module itself is replaceable on most units; a swap on a Whirlpool or
      Frigidaire thermoelectric model runs $80–$150 in parts. Fan failures on the hot and
      cold sides of the module are even more common and cheaper to address. The honest
      caveat: when ambient temps exceed 80°F — a regular occurrence in 91311 from May
      through October — thermoelectric units struggle to maintain the 15 to 20 degree
      differential they're rated for. Compressor-based units handle Chatsworth summers
      considerably better long-term.

  - q: "What warranty comes with wine cooler repair in Chatsworth?"
    a: |
      Labor is warranted for 90 days — same issue returns within that window, we come back
      at no additional charge. Parts carry the manufacturer's warranty, which runs 90 days
      to one year depending on the component. OEM or OEM-equivalent parts are used on
      Kenmore, GE, Samsung, and Frigidaire units — not generic substitutes that fail in
      six months. Compressor replacements can be sourced with a one-year OEM warranty.
      Refrigerant work is covered provided there's no new physical damage to the lines.
      Everything that was replaced and what's covered gets documented before we leave.


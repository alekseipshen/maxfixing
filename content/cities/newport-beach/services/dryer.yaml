title: "Newport Beach Dryer — Coastal Vents, Tight Closets, Fixed Fast"

intro: |
  Balboa Island's 1940s beach cottages in 92661 fit dryers into closets barely 30 inches wide — reaching the heating element or drum roller means full front-panel disassembly, not the standard back-access approach. Had a Miele stacked unit on Marine Avenue recently: stone cold after a full cycle, thermal fuse blown, vent blocked solid with two years of lint. Newport Coast runs an entirely different problem set, but we cover both ends of the city.

localContext: |
  Newport Coast's newer construction along Ridge Park Road — homes built in the early 2000s, zip 92657 — leans heavily toward Viking and Thermador gas dryers with proper laundry rooms, but gas valve igniter corrosion shows up after a few years of salt-air exposure through window gaps. Lido Isle and the Balboa Peninsula (92663) are older, tighter. European stacked units, compact vent runs through exterior walls, front-load Bosch machines crammed into hallway closets.

commonProblems:
  - title: "Choked vent runs in 92661 cottages — slow drying, no error code"
    description: "Those Island cottages sometimes run 12 to 15 feet of flex duct with two elbows before hitting outside air. The blower wheel fights that restriction every cycle. Clothes come out damp; the machine runs hot. Thermador units log an airflow fault; others just quietly fry the thermal fuse. Cleaning the full duct run usually restores normal 45-minute dry times."
  - title: "Gas valve igniter failure in Newport Coast Viking dryers"
    description: "Viking gas dryers in 92657 run reliably until the igniter assembly corrodes — common here given how salt air infiltrates laundry rooms. Drum spins fine, no heat, no smell. Swapping the gas valve igniter and testing the flame sensor is typically a same-day fix. We carry the part for most Viking configurations."
  - title: "Drum bearing grind in older Lido Isle Bosch 800-series units"
    description: "Early-2000s Bosch dryers on Lido Isle start announcing bearing wear as a squeal on every rotation. Left alone, the drum shaft scores the rear bulkhead and a $45 drum roller kit becomes a $300 sheet-metal repair. Catching it at the noise stage is the call to make — schedule online or dial (323) 870-4790 before it escalates."

faq:
  - q: "How fast can you get to Newport Beach for dryer repair?"
    a: "Typically 2 hours or less. PCH runs clean in the mornings, and we're routing from South Bay — Balboa Island, the Peninsula, Corona del Mar all land within a predictable window. Call (323) 870-4790 to confirm a same-day slot; evening appointments are usually available too."
  - q: "Do you repair Viking, Miele, and Thermador dryers out here?"
    a: "Those are our most common Newport Beach calls. Viking gas valve igniter swaps, Thermador belt tensioner failures, Miele heat exchanger cleans. European brands need different diagnostic cables than domestic units — we carry them. Bosch 800-series drum bearing kits are stocked on the van."
  - q: "What does a dryer repair cost, and is same-day actually available?"
    a: "Diagnostic runs $75–$90, applied toward the repair if you proceed. Most fixes — thermal fuse, drum roller, heating element — land between $150 and $280 parts and labor combined. Same-day is genuinely available most weekdays; call (323) 870-4790 in the morning and we can usually confirm an afternoon arrival."

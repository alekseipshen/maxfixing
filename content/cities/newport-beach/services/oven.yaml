    a: "Routes through Costa Mesa and Irvine run daily, putting Newport Beach — Balboa Island,
      Corona del Mar, the Peninsula — at roughly a 90-minute response window. The 92657 zip
      up in Newport Coast adds maybe 15 minutes. Call (323) 870-4790 to lock in same-day or
      book an evening slot online."
  - q: "Do you repair Wolf, Thermador, and Viking ovens in Newport Beach?"
    a: "Yes — all three brands make up the majority of calls here. Wolf dual-fuel igniters,
      Thermador oven sensors, Viking broiler elements — we stock the common failure parts and
      carry the specialized diagnostic tools these built-in units require. Miele and Bosch
      wall ovens show up regularly in the 92660 and 92663 zip codes as well."
  - q: "What does oven repair cost in Newport Beach, and how soon can I get a tech?"
    a: "Diagnostic visit is $85, credited toward the repair. Most fixes — element swaps, sensor
      replacements, latch assemblies — land between $150–$350 in parts and labor combined.
      Same-day service most days; evening slots available. Call (323) 870-4790."
title: "Freezer Repair in Newport Beach — Sub-Zero, Bosch & Thermador Service"

intro: |
  That Sub-Zero stopped holding temperature overnight, or the Bosch built-in
  column in your kitchen is icing over the evaporator coil again. Either way,
  call (323) 870-4790 — we're usually at your door within 2 hours. Same-day
  service is available in Newport Beach most days, including evenings.

localContext: |
  Newport Beach homes near Balboa Island and the Back Bay corridor run a lot of
  older Sub-Zero and Thermador units — some of these built-ins are 15 or more
  years old and still worth fixing if the compressor checks out. The ocean air
  here accelerates door gasket wear faster than you'd see in the Valley. Salt
  in the air attacks rubber seals, and once a gasket starts leaking, the
  evaporator coil frosts over within a week.

  The 92660 zip — especially around Fashion Island — has a lot of newer
  construction with panel-ready Bosch and KitchenAid freezer columns. These
  units have finicky control boards that throw error codes instead of failing
  obviously. Our Newport Beach call list includes at least two or three of
  those diagnostic jobs every week.

commonProblems:
  - title: "Freezer Not Cold Enough"
    description: |
      The most common call from Newport Beach. Usually one of three things: the
      condenser fan has seized, the defrost timer is stuck, or the evaporator
      coil is completely frosted over and blocking airflow. On a Sub-Zero 700
      series, a frozen evaporator usually means the defrost heater assembly has
      failed — the unit can't clear frost automatically, so ice builds until
      nothing cold gets through.

      Homeowners usually catch it late. The freezer feels slightly warm, ice
      cream is soft. By then the frost layer can be an inch thick. Defrost cycle
      reset takes about 30 minutes on the bench, but if the heater element is
      burned out, you need a replacement part. Most Sub-Zero and Bosch
      components travel on the van. Most repairs wrap up same visit.

  - title: "Freezer Running Constantly"
    description: |
      A freezer that never cycles off is losing cold air somewhere. Newport
      Beach's 92660 zip has a lot of Thermador and Viking units where the door
      gasket is the culprit. Slam the door and watch the seal — any gap, any
      curl, any spot where you can feel cold air escaping, that's the issue.

      Sub-Zero units in these homes throw error code 14 when condenser
      temperature runs too high. That's the unit telling you the condenser fan
      or coil is dirty. In Newport Beach coastal air, condenser coils collect
      salt and dust faster than inland. A blocked coil forces the compressor to
      work twice as hard. Condenser cleaning and fan testing are part of every
      diagnostic here. Call (323) 870-4790 — evening slots available most
      weekdays.

  - title: "Frost Buildup and Ice Maker Failures"
    description: |
      Ice makers in Newport Beach fail more often than people expect. The water
      supply here runs hard — mineral deposits clog the inlet valve and jam up
      the ice maker assembly lines. Smaller cubes come first, then no cubes,
      then a grinding noise as the harvest fingers try to eject cubes that
      aren't fully formed.

      On Miele and Wolf units, the ice maker module is integrated into the
      freezer door panel. Pulling it requires removing the door — tight access
      in older Newport Beach kitchens with European-style cabinetry. Do the
      dollar bill test on the door gasket first: close the door on a bill and
      pull it out. Slides with no resistance? The seal is shot, and cold air
      is escaping around the ice maker area too. Miele and Viking gaskets are
      stocked on the van for same-day installs.

faq:
  - q: "How fast can you get to Newport Beach?"
    a: "Newport Beach is typically 30–45 minutes from our base, depending on
      55 freeway traffic. Same-day appointments run most days, and getting there
      within 2 hours of your call is usually doable. Call (323) 870-4790 early
      in the day for the best slot availability."

  - q: "Is it worth repairing an older Sub-Zero freezer?"
    a: "Usually yes, if the compressor is still good. Sub-Zero units are built
      to run 20 or more years. Replacing a condenser fan or defrost timer on a
      12-year-old unit makes a lot more sense than swapping out a built-in that
      costs $6,000–$10,000 new. After the diagnostic, an honest answer follows —
      if repair doesn't pencil out, that gets said."

  - q: "Do you work on panel-ready Bosch and Thermador units?"
    a: "Yes. Panel-ready units require pulling the door panel before anything
      else is accessible. The right tools for Bosch, Thermador, and Miele
      column freezers come on every call — no improvising with generic appliance
      equipment. Most panel-ready diagnostics run start to finish the same day."

  - q: "What error codes should I watch for on my freezer?"
    a: "Sub-Zero error code 14 means high condenser temperature — check if the
      coils are dirty or the fan is running. Error 24 points to a defrost system
      failure. Bosch freezer error E2 is usually a sensor fault on the
      evaporator. Screenshot the code before calling — it helps get the right
      part on the van before arrival. Schedule a same-day visit at
      (323) 870-4790."
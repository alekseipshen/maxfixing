title: "Newport Beach Ice Maker — Hard Water Hits Built-Ins Hard"

intro: |
  Balboa Island kitchens don't have a lot of slack. Panel-ready Sub-Zero
  column units, custom cabinetry built flush to the ceiling, zero clearance
  on either side — that's what we walk into in 92662. The ice maker module
  in those built-ins is usually the first component to fail, and the reason
  is almost always OC's Colorado River supply: around 280–300 ppm hardness,
  steady enough to calcify a water inlet valve or pack a fill tube with
  scale in under two years. The appliance looks fine from the outside while
  ice production quietly dies.

  Newport Beach has more panel-ready and built-in refrigerators per block
  than almost anywhere we cover. Accessing the assembly in a flush-mount
  Sub-Zero means removing cabinetry panels before you can even see the fill
  tube. Different job than a freestanding Whirlpool.

localContext: |
  Newport Heights and the side streets off 15th Street in 92660 are a mix
  of original 1950s and 1960s ranch homes — galley kitchens, narrow cabinet
  runs, and older copper supply lines now feeding KitchenAid and Bosch
  counter-depth installs. Over in Corona del Mar (92625), custom 1990s and
  early 2000s builds brought Sub-Zero and Viking built-ins now hitting the
  20–25 year mark. Ice maker assemblies and fill valves that went in without
  any hard-water mitigation are overdue for service.

  Lido Isle's newer construction isn't immune. The water chemistry is the
  same everywhere in the 92663 corridor. That 280 ppm mineral load doesn't
  care how recently the kitchen was renovated.

commonProblems:
  - title: "Water Inlet Valve Clogged by Mineral Scale — Newport Beach's Most Common Failure"
    description: |
      At 280–300 ppm, OC tap water calcifies the water inlet valve screen faster
      than almost anywhere in the region. Sub-Zero and KitchenAid built-ins in the
      92662 and 92625 zip codes are especially prone because they run continuously
      through warm months with no shutoff. Ice output drops gradually — smaller
      cubes first, then cloudy cubes, then nothing at all. The mesh screen inside
      the inlet valve isn't cleanable past a certain point; the entire valve assembly
      needs replacement. Most Sub-Zero and KitchenAid inlet valves we pull out of
      Newport Beach kitchens are so calcified the flow ports are nearly fully blocked.
      We carry the common valve specs on the truck for same-day service — call
      (323) 870-4790 if you're seeing reduced output or small cubes.
  - title: "Frozen Fill Tube Stops Ice Production Completely Overnight"
    description: |
      A thermostat running even 2–3 degrees cold causes condensation to refreeze
      inside the fill tube itself. Thermador column refrigerators are a repeat
      offender — the ice maker compartment sits right against the freezer wall,
      and there's nowhere for the heat to dissipate. Hard stop, not gradual decline.
      Thawing the fill tube and recalibrating the freezer setpoint resolves it in
      most cases. The thermostat occasionally needs replacing too.
  - title: "Optical Sensor Failure in Older Viking Modules"
    description: |
      Viking built-ins from the early 2000s — common in Lido Isle and along
      Bayside Drive — use optical sensors inside the ice maker module that degrade
      with age and ambient humidity.

      A failing sensor either floods the bin by running the unit non-stop, or reads
      the bin as full and kills the cycle entirely. Telling the optical sensor from
      a control board fault requires actual diagnostics, not parts-swapping. Newport
      Beach has a concentration of these older Viking installs past the 20-year mark —
      sensors on that vintage are failing across the board right now.

faq:
  - q: "How fast can you get to Newport Beach for ice maker repair?"
    a: "Newport Beach is a regular stop on our OC route. Most addresses in 92660 or
      92663 are reachable within 2 hours of your call. Same-day slots available most
      days. Call (323) 870-4790 to check availability."
  - q: "Do you repair Sub-Zero, Viking, and Thermador ice makers in Newport Beach?"
    a: "Yes — those three are what we see most in Newport Beach's custom homes. Clogged
      water inlet valves on Sub-Zero column units, frozen fill tubes in Viking built-ins,
      failed modules in Thermador panels. Bosch and KitchenAid counter-depth models come
      up regularly too, especially in the 92660 zip."
  - q: "What does ice maker repair cost, and how quickly can you come out?"
    a: "Most repairs run $150–$350 depending on the part. A water inlet valve replacement
      sits at the lower end; a full module swap in a Sub-Zero or Viking runs higher.
      Diagnostic happens on the first visit — you get a firm quote before we start
      anything. Call (323) 870-4790 or book online for same-day service. Evening
      slots available."
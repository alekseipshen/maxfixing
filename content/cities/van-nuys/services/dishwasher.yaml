title: "Van Nuys Dishwasher Repair — Hard Water Eats These Units Alive"

intro: |
  Apartment complexes along Sepulveda Boulevard between Victory and Sherman Way pack hundreds of dishwashers into aging kitchens — and most of them are running GE or Kenmore models that got installed during a Reagan-era renovation and haven't been touched since. The San Fernando Valley's tap water hits 300-plus ppm of dissolved minerals across most of 91401 and 91405, which is relentless on spray arms, inlet valves, and heating elements year after year. Add in the summer heat — Van Nuys regularly bakes past 100°F from July through September — and a dishwasher runs every cycle under thermal stress it wasn't engineered for. By the time a tenant notices dishes coming out with white film or standing water pooling in the tub, the damage is usually already compounding. We cover Van Nuys daily, from the apartments near Van Nuys Civic Center to the single-family homes south of Oxnard Street. Call (323) 870-4790 — same-day appointments are available most days.

localContext: |
  The housing stock in Van Nuys spans about six decades. Blocks around 91402 near Delano Avenue hold 1960s and early-1970s apartment buildings where original plumbing runs narrower, under-counter spaces stay cramped, and landlords have swapped in budget replacements — Frigidaire Gallery or Amana units — without upgrading the water supply lines or float switch hardware. North Van Nuys, around 91405, mixes postwar single-family homes with larger apartment complexes, and those houses often run older Whirlpool dishwashers with worn door gaskets that no one has replaced. Van Nuys Airport sits just north of the residential core, and the grid of surface streets running off Woodley Avenue means service vans can move without depending entirely on the 405. Hard water is the consistent thread across every zip here — calcium deposits clog spray arm jets, coat the heating element in white crust, and jam detergent dispensers on units that are otherwise mechanically sound. Catching mineral buildup early saves the control board.

commonProblems:
  - title: "Spray Arm Blockage from Mineral Scale — The Van Nuys Hard Water Tax"
    description: |
      Van Nuys tap water leaves calcium and magnesium deposits on everything it touches, and the spray arm jets on a dishwasher are roughly 2mm wide. Once scale builds up inside those holes, water pressure drops and the upper rack stops getting clean — glasses come out cloudy, food debris sticks to the bowls. Kenmore 665 series units are especially prone to this because the upper spray arm uses a bayonet-lock mount that most homeowners never remove to clean. The fix involves soaking the arm in white vinegar for two hours, clearing blocked jets with a toothpick, and running a citric acid rinse cycle monthly going forward. If the arm itself has cracked from thermal cycling, replacement arms for GE Profile and Kenmore run $15–40 and swap in about 20 minutes. Doing this annually in 91401 can realistically add two to three years to the appliance's service life.

  - title: "Drain Pump Failure — Standing Water After Every Cycle"
    description: |
      A dead drain pump leaves an inch or two of grimy water sitting in the tub after the cycle ends. It's one of the more common calls we get from apartments near Van Nuys Civic Center — tenants run the machine at night and wake up to a flooded cabinet floor. The pump motor itself can fail, but more often the issue is a jammed impeller: broken glass, a stray twist-tie, or grease buildup stops the pump and triggers a thermal shutoff. Samsung dishwashers throw an OC or 5C error code when this happens. GE models typically just stall mid-cycle with water sitting in the sump. Clearing a jammed impeller takes about 30 minutes and costs less than $100 in labor. If the motor is burned out, a replacement pump runs $60–120 in parts, and the full repair usually lands between $150 and $220.

  - title: "Door Latch Assembly Worn Out — Won't Start or Leaks Mid-Cycle"
    description: |
      Dishwashers in Van Nuys rentals take a beating. Doors get yanked open and slammed shut dozens of times a week in high-occupancy units, and the plastic door latch assembly — specifically the latch strike and the microswitch behind it — wears out faster than most owners expect. A faulty latch means the control board never receives the signal to start the cycle. Alternatively, a slightly bent strike allows the door to flex during the wash, breaking the door gasket seal and dripping water onto the cabinet floor below. Whirlpool and Frigidaire models from 2010–2019 use a two-piece latch design where the strike replaces without pulling the entire door panel. Parts run $18–35. Microswitch replacement involves a bit more disassembly — figure 45 minutes of labor. Total repair cost generally stays under $175, which makes this one of the better-value fixes on the list.

  - title: "Detergent Dispenser Stuck or Won't Open — Dishes Come Out Half-Clean"
    description: |
      A dispenser that won't pop open during the main wash is easy to miss at first — dishes look almost clean, just not quite right. Scale deposits around the dispenser door hinge are the usual cause in hard-water zip codes like 91406. The wax motor or bi-metal actuator that triggers the door can also fail, particularly on older GE Nautilus and Whirlpool units where the actuator is a lightweight plastic assembly that degrades from heat exposure after years of cycles. Replacing the dispenser assembly runs $40–75 in parts depending on the model. Kenmore units built by Whirlpool — most models with numbers starting in 665 — use an interchangeable part that's easy to source locally. Labor time is 30–45 minutes. Full repair cost: typically $120–185. Skipping this fix means detergent pods are just sitting there dissolving in standing water instead of spraying across your dishes.

  - title: "Samsung and GE Error Codes — What They Actually Mean"
    description: |
      Samsung dishwashers — popular in the newer apartment builds near Van Nuys Boulevard — throw specific codes that make people think the machine is finished. A 9E points to a water level sensor problem; a 1E means the float switch; an LE or LC code usually means the leak sensor tripped on condensation, not an actual leak. Before ordering parts, check whether the float switch is stuck in the raised position from debris — that's a five-minute fix. Actual control board failures do happen on units past seven years, and Samsung boards run $120–250. Full board replacement with labor typically costs $250–380. For a GE unit showing an F2 or F3 fault — that's the drain circuit — check the drain hose for a kink before calling anyone. Sometimes the fix takes 90 seconds and zero parts.

faq:
  - q: "How fast can you get to Van Nuys for a dishwasher repair?"
    a: |
      Van Nuys sits right off the 405 and 101, which puts most zip codes — 91401, 91405, 91406 — within 30 to 45 minutes from our nearest technician, Valley traffic permitting. Same-day service is available most weekdays, and evening slots exist for tenants who can't leave work early. Parking on residential blocks off Van Nuys Boulevard is generally fine; denser complexes near Sherman Way sometimes mean street parking and a short walk to the unit, which we're used to. Call (323) 870-4790 to check current availability — we typically give a two-hour arrival window, not a vague "morning or afternoon" range.

  - q: "What does dishwasher repair cost in Van Nuys?"
    a: |
      Most repairs in Van Nuys land between $120 and $320 depending on what failed. A drain pump replacement runs $150–220 in parts and labor. A spray arm swap or dispenser fix stays under $150. Control board replacement sits at the expensive end — $250–380 for most Samsung or GE models. Diagnostic visits are $75–85, and that fee applies toward the repair if you proceed. You get a firm quote before we touch anything. Pricing doesn't shift based on neighborhood — you're paying for the actual repair, not a zip-code premium.

  - q: "Do I need a permit to repair or replace a dishwasher in Van Nuys?"
    a: |
      Straight repairs — swapping a drain pump, replacing a latch, installing a new control board — don't require a permit in Los Angeles. A full dishwasher replacement involving disconnecting the water supply line and the electrical junction can trigger a requirement depending on scope. The City of LA Department of Building and Safety handles permits for Van Nuys properties; a simple like-for-like appliance swap is usually a straightforward online application with a $50–100 fee and no inspection required. Rental property owners should check their management agreements, since some companies require documentation of licensed work for any appliance replacement. We carry the paperwork you'd need.

  - q: "Can you repair a built-in dishwasher in a tight apartment kitchen without damaging the cabinetry?"
    a: |
      Built-in dishwashers in Van Nuys apartments are almost always secured with two top-mount screws to the underside of the countertop, with the kick plate hiding the leveling legs. Pulling the unit requires sliding it forward after disconnecting the water supply at the valve under the sink and uncapping or unplugging the junction box. Tight kitchens — especially in 1970s builds on Kester Avenue or near the 91411 boundary — sometimes need the kick plate and bottom rack removed just to get clearance. Rubber furniture sliders go under the feet before we move anything, so vinyl and tile floors stay scratch-free. We've extracted units from spaces that looked genuinely impossible without leaving a mark.

  - q: "How long should a dishwasher last in Van Nuys, and when does replacing make more sense than repairing?"
    a: |
      A well-maintained dishwasher runs 10–13 years in most of LA. Van Nuys hard water trims that by a year or two if the spray arms never get cleaned and the heating element never gets descaled. The practical rule: if repair cost exceeds 50% of replacement cost and the unit is over eight years old, replacing usually makes more financial sense. A new Whirlpool or GE unit runs $500–700 installed. Spending $380 fixing a 2013 Kenmore with a cracked tub gasket and a failing control board doesn't pencil out. For a Samsung or LG under five years old, almost any repair is worth doing. We'll tell you honestly which situation you're in before we take your money.

  - q: "Do you cover Reseda, North Hills, and other nearby neighborhoods for dishwasher repair?"
    a: |
      Yes — Van Nuys is centrally located for everything we cover in the mid-Valley. Reseda (91335), North Hills (91343), Panorama City (91402), and Sherman Oaks are all regular service areas. Coverage runs from Irvine up to Santa Clarita, so the entire San Fernando Valley is within range. Scheduling is usually same-day or next morning depending on current call volume. Call (323) 870-4790 or book online, and describe the error code or symptom when you reach out — that lets us load the right parts and skip a second trip.
title: "Van Nuys Range Hood — Valley Heat Demands a Working Hood"

intro: |
  Heavy cooking happens daily in Van Nuys — arroz con pollo, manti, carne asada, stir-fry on a high-output gas burner. The range hood above that burner is supposed to pull grease-laden smoke out before it coats your cabinets, but a lot of units installed in buildings along Sherman Way and in the Delano neighborhood are running on aging blower motors and filters that haven't been serviced in years. GE hoods from the early 2000s are extremely common in the apartment stock here, and when the fan slows or stops entirely, the grease doesn't vanish — it lands on your ceiling tiles and inside your cabinet boxes. Van Nuys regularly hits 100°F in July and August, pushing kitchen temperatures even higher and making a functional vent hood less optional than most people think. A dead hood in that heat means smoke lingers in your kitchen long after you're done at the stove. Call us at (660) 999-9960 and we can usually get someone out same-day.

localContext: |
  The housing stock in Van Nuys runs from 1960s garden apartments along Kester Avenue to postwar duplexes clustered near Van Nuys Boulevard. In zip code 91405, older multifamily buildings have range hoods that were retrofitted into kitchens not originally designed for ducted ventilation — 4-inch flex duct crammed through a cabinet soffit, or a hood terminating into a wall cavity rather than exhausting outside. Over in 91401, single-family homes built in the 1950s and 60s often have undersized hoods that can't keep up with the BTU output of modern gas ranges. LA's notoriously hard water makes things worse: mineral deposits accumulate around the duct damper and inside the collar fitting, choking airflow even when the blower motor itself is still intact. Parking and access are real logistics here — tight alley clearances and carport overhangs are standard, and we bring compact equipment when the kitchen layout doesn't give room to maneuver.

commonProblems:
  - title: "Blower Motor Burnout After Years of Valley Heat and Grease Exposure"
    description: |
      The blower motor is the mechanical core of any range hood, and in Van Nuys apartments that see serious daily cooking, these motors fail faster than manufacturers expect. Heat soaks into the motor windings, grease coats the fan blade and throws rotation off-balance, and eventually the capacitor gives out — you'll hear the motor hum but the fan won't spin. GE and Frigidaire hoods from the 2005–2015 range are especially prone to this because their motor housings weren't sealed well against grease infiltration. Replacing a blower motor on a standard under-cabinet hood runs $150–$250 in parts and labor depending on model; some older Kenmore units need OEM parts that take 3–5 business days to source. We stock common GE and Frigidaire blower assemblies on the van. Most blower motor jobs are a single-visit fix, done in under two hours.

  - title: "Rattling and Grinding Noise That Gets Worse Under Heavy Use"
    description: |
      A hood loud enough to talk over isn't just annoying — it's signaling that the fan blade is out of balance or the motor mount bushings have worn through. In multifamily buildings, grease accumulates on blades asymmetrically, adding weight to one side and sending vibration through the sheet metal housing into the cabinet above. Samsung range hoods, popular in newer Van Nuys apartment renovations, have a known issue with baffle filter tabs vibrating against the housing at medium fan speed. Tightening or replacing the filter retention clips usually resolves that specific noise in about 20 minutes. For worn motor mount bushings, we swap the mount and retest; if vibration continues, we check for bent fan blades. Noise diagnosis and repair typically runs $100–$200 depending on what's causing it.

  - title: "Grease Baffle Filters Clogged Solid — Airflow Drops to Almost Nothing"
    description: |
      A baffle filter that's never been cleaned eventually blocks more air than it passes. This is extremely common in Van Nuys rental units where tenants turn over and maintenance is inconsistent. Whirlpool and Frigidaire hoods use aluminum baffle filters that are dishwasher-safe and should be cleaned every four to six weeks under heavy cooking conditions — in practice, we pull filters that are solid black with hardened grease and haven't been touched in two or three years. That accumulation is also a fire hazard; enough heat from a flare-up can ignite grease inside the duct collar. We clean or replace filters on-site and inspect the duct interior for secondary buildup while we're there. Replacement baffle filters for most standard hoods run $25–$60 depending on size and manufacturer.

  - title: "Duct Runs Installed Wrong — Undersized, Blocked, or Venting Nowhere"
    description: |
      Improper duct installation is one of the more serious range hood issues we find in 91405 and 91401 properties. Some older Van Nuys apartments have hoods that vent into a shared wall cavity or ceiling plenum rather than exhausting outside — that's a code violation and a grease fire risk. Our contractor license covers the ductwork correction work we perform under LA City building guidelines. Properly rerouting a duct run typically means cutting through one or two walls, installing a proper wall cap or roof cap with a functioning damper, and upgrading from undersized 3-inch flex duct to the 6-inch or 7-inch diameter most modern hoods require for rated CFM output. Expect $400–$800 depending on the duct path complexity and how many walls are involved. Permits are filed when structural penetrations are required.

  - title: "Hood Lights Dead — Corroded Sockets and Failed Control Board Relays"
    description: |
      Dead range hood lights usually trace back to one of two causes: a burned-out bulb in a corroded socket, or a failed lighting relay on the control board. In Van Nuys kitchens with heavy steam and daily grease exposure, the light socket contacts corrode faster than in drier environments — especially hoods positioned directly over a boiling stockpot. Kenmore and Amana hoods from the 2010–2018 period have a known control board failure where the lighting relay fails while the fan circuit keeps working. Replacing the control board on these models runs $120–$200 in parts; socket replacement alone is $40–$80. We test the socket contacts first before ordering a board, since that's always the cheaper path. If your Kenmore hood lights flickered before going dark entirely, that's the board relay going. Call (660) 999-9960 — we can usually reach Van Nuys within two hours.

faq:
  - q: "How fast can you get to Van Nuys for Range Hood repair?"
    a: |
      Van Nuys is a central stop on our San Fernando Valley loop — from our LA base, that's typically 20–35 minutes depending on 405 traffic through the Sepulveda Pass. Same-day appointments are available most days, and we stock common parts like blower motors, baffle filters, and control boards on the van to avoid a return trip. For urgent situations — hood completely dead before a family gathering, or a grease fire concern — call (660) 999-9960 directly and we'll prioritize the booking. Scheduling through the website usually gets you a confirmed slot within the hour. Evening appointments are available on most weekdays for tenants who can't be home during business hours.

  - q: "What does range hood repair in Van Nuys typically cost?"
    a: |
      Diagnostic visits run $75–$95, which applies toward the repair if you move forward. Most common repairs fall between $100 and $350: blower motor replacement is typically $150–$250, control board replacement $120–$200, and filter cleaning with a full service call $60–$120. Duct rerouting work starts around $400 and goes up based on the path complexity and how many walls need penetrating. What pushes cost up is parts availability for older units — some Frigidaire and GE hoods from the early 2000s need OEM parts that take 3–5 business days to arrive — and tight soffit access in apartment kitchens. Specific pricing is given on-site before any work begins.

  - q: "Do you need a permit to repair or replace a range hood in Van Nuys?"
    a: |
      Straightforward hood replacement — swapping one unit for another of the same footprint using the existing duct opening — doesn't require a permit in most Van Nuys residential situations. Permits come into play when ductwork is modified: cutting a new exterior wall penetration, rerouting to a different cap location, or upsizing duct diameter. Those jobs require an LA City mechanical permit, and we file the paperwork under contractor license. Permit turnaround for minor mechanical work through LA City's online portal typically runs 3–7 business days. For condo units with HOA oversight, board approval adds time — usually 2–4 weeks depending on how frequently the association meets.

  - q: "Can you repair recirculating range hoods, or only ducted models?"
    a: |
      Both types. Recirculating hoods filter air and push it back into the kitchen through charcoal filters instead of a duct run — and those charcoal filters need replacing every 3–6 months under regular cooking conditions. Most Van Nuys apartments that aren't ducted use recirculating hoods from Whirlpool or Samsung; a spent charcoal filter element is often the reason they stop controlling odors effectively even when the fan is still running. We stock replacement charcoal filter packs for common models on the van. Beyond filters, recirculating hoods share the same fan motor, control board, and light socket components as ducted models, so electrical and mechanical failures get diagnosed and repaired through the same process.

  - q: "How long should a range hood last, and what's covered under warranty?"
    a: |
      A quality range hood should run 10–15 years with basic upkeep — meaning baffle filters get cleaned consistently and the motor isn't fighting a blocked duct run. GE and Whirlpool hoods carry a 1-year manufacturer's warranty on parts; extended coverage varies by model and purchase channel. Labor on any repair we complete carries a 90-day warranty. What shortens lifespan in Van Nuys specifically is thermal stress — kitchens that bake in summer heat and run heavy daily cooking push more thermal cycles through motors and control boards than the manufacturer's rated service life assumes. Any hood over 12 years old that needs a second major repair gets an honest assessment from us on whether replacement makes more financial sense than another fix.

  - q: "Do you cover other San Fernando Valley cities near Van Nuys?"
    a: |
      Van Nuys sits in the middle of our regular service loop, so neighboring cities get the same response times. Coverage extends to North Hollywood, Reseda, Panorama City, Sherman Oaks, Encino, Canoga Park, and Chatsworth. Burbank and Glendale are regular stops as well. Booking for any of these areas works the same way: call (660) 999-9960 or schedule online, and we confirm your slot within the hour. Most appointments run on a 2-hour arrival window. If you have an urgent repair situation anywhere in the Valley, mention it when you call — we reroute when the schedule allows.
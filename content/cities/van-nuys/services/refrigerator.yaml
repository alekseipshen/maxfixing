title: "Van Nuys Refrigerator Repair — Valley Heat Breaks Fridges Fast"

intro: |
  July temperatures in the San Fernando Valley regularly crack 105°F, and refrigerators
  in 91405 feel every degree of it. A unit that runs fine all winter starts short-cycling
  by August — the condenser fan can't shed heat fast enough, and by Labor Day you've got a
  Whirlpool side-by-side that's lukewarm and sweating condensation down the cabinet doors.
  We cover Van Nuys seven days a week with same-day slots almost always open for
  neighborhoods around the Sepulveda Basin Recreation Area and the dense apartment
  corridors along Sherman Way. Most calls cluster in that 90-day stretch after summer
  kicks in: the compressor's been running nearly 24 hours straight for weeks, something
  gives, and suddenly the freezer reads 28°F while the fridge side reads 55°F. That
  split-temperature symptom almost always traces to a failed evaporator fan motor or a
  blocked defrost drain — both parts we carry on the van so the repair doesn't stretch
  into a second visit.

localContext: |
  Van Nuys housing spans postwar 1950s duplexes off Kester Avenue to larger apartment
  complexes along Sepulveda Boulevard in 91411, and each building type creates its own
  refrigerator repair pattern. The older rental stock in 91405 — two-story walk-ups built
  before 1975 — tends to have tight kitchen layouts where the fridge is crammed into a
  30-inch cutout with no side clearance at all. Zero clearance means the condenser coils
  can't vent heat properly, which drives the compressor harder, runs it hotter, and shaves
  years off its life. Newer complexes near Van Nuys Airport on Woodley Avenue sometimes
  have counter-depth or built-in models — LG or KitchenAid units recessed into cabinetry
  — where reaching the evaporator or compressor means removing cabinet panels before the
  actual repair even starts. Parking a service van on the narrower residential blocks east
  of Van Nuys Boulevard in 91402 can add 10-15 minutes to a call, but we account for
  that when we give you the arrival window.

commonProblems:
  - title: "Fridge Running Warm While Freezer Stays Fine"
    description: |
      The most common refrigerator call in Van Nuys during summer: the fridge compartment
      sits at 50-55°F, the freezer is cold, and there's a faint dripping sound from inside
      the back wall. Nine times out of ten, the evaporator coil has iced over completely —
      usually because the defrost heater burned out or the defrost timer stuck mid-cycle.
      LA's hard water makes it worse; mineral deposits clog the defrost drain tube, water
      backs up, and the coil ices from the bottom up rather than thawing on schedule. On a
      Whirlpool WRF535SWHZ or similar French-door model, a replacement defrost heater runs
      $45-70 in parts. With labor, the full repair lands at $150-220 and takes about 90
      minutes once the coil has fully thawed — so plan for a 2-3 hour visit total.

  - title: "Clicking or Rattling Noise on Startup"
    description: |
      A clicking sound — three or four attempts, then silence — almost always means the
      start relay is failing, not the compressor itself. That's a $20-40 part on most GE
      or Frigidaire models and a 30-minute fix. A continuous loud hum or grinding rattle
      is a different story: that's the compressor windings struggling under sustained load,
      often after running near-continuously through a Van Nuys summer with poor kitchen
      ventilation. At that point, compressor replacement on a budget Kenmore or Amana unit
      rarely makes financial sense — the part alone runs $300-500, labor adds another
      $200-300, and the rest of the fridge is still old. We'll tell you upfront if the
      repair cost exceeds 50% of current replacement value, rather than sell you a $400
      fix on a 12-year-old box.

  - title: "Water Pooling Under or Behind the Refrigerator"
    description: |
      Puddles under the fridge in Van Nuys apartments usually trace to one of two causes:
      a clogged defrost drain or a cracked water inlet valve. The defrost drain runs from
      the evaporator pan down to a collection tray near the compressor — Van Nuys municipal
      water runs 300-400 ppm hardness, and that mineral load narrows the drain tube over
      time until water overflows instead of evaporating. Clearing the drain takes about 20
      minutes. A cracked water inlet valve is common on Samsung French-door models after
      the ice maker gets heavy use — the valve lets water seep continuously at the rear
      connection, usually showing up as a slow drip behind the unit. Valve replacement runs
      $85-130 in parts; the full repair typically falls between $120-200. Most calls
      resolve same-day. Reach us at (323) 870-4790 to get someone out.

  - title: "Ice Maker Stopped Producing or Makes Hollow Cubes"
    description: |
      Ice maker failures in Van Nuys often come down to one thing: scale. The water is hard
      enough that the fill valve, the water supply line, and the ice mold thermostat all
      accumulate calcium deposits within 3-5 years of normal use. On LG and Samsung models
      with door-mounted ice makers, the auger motor seizes from scale buildup inside the
      ice bin — the unit tries to dispense, trips a thermal cutout, and shuts down. Full
      ice maker assembly replacement on those models runs $180-280 in parts. On older
      top-freezer Frigidaire or GE units, a $35 water inlet valve swap usually fixes the
      hollow-cube problem completely — the valve's solenoid weakens and doesn't open fully,
      so the mold only partially fills. We carry a descaling kit and can assess mineral
      damage on the first visit before committing to a parts order.

  - title: "Door Gasket Cracked — Fridge Running Constantly"
    description: |
      Refrigerator door gaskets in the San Fernando Valley age faster than in coastal areas.
      The thermal cycling from 105°F kitchen temps in a Van Nuys July down to air-conditioned
      interiors causes the rubber to harden and crack faster than it would in Santa Monica.
      A cracked gasket on a Kenmore or Maytag top-freezer means the compressor never gets
      a real rest cycle — power bills climb noticeably, and eventually the compressor
      overheats from sustained load. Test it with a dollar bill: close the door on it,
      and if the bill slides out easily, the seal has failed. Gasket replacement runs
      $60-120 in parts depending on the model, plus $75-100 in labor. It's a two-hour job
      at most, and the energy savings on a fridge that's been running continuously usually
      pay it back within 6-8 months.

faq:
  - q: "How fast can you get to Van Nuys for refrigerator repair?"
    a: |
      Most Van Nuys calls get same-day service — we're typically on-site within 2-3 hours
      if you call before noon. From our central Valley coverage point, Van Nuys is
      straightforward via the 405 or the 101, usually under 30 minutes even with moderate
      traffic. Parking on tighter residential blocks east of Van Nuys Boulevard adds a few
      minutes but we build that into the arrival estimate. Evening slots run Tuesday through
      Saturday for calls that come in mid-afternoon. Call us at (323) 870-4790 to check
      today's open windows — we'll give you an actual 1-hour arrival slot, not a four-hour
      guess.

  - q: "What does refrigerator repair typically cost in Van Nuys?"
    a: |
      Simple fixes — a start relay, a door gasket, a defrost thermostat — typically run
      $120-180 all-in. Mid-range repairs like a water inlet valve or evaporator fan motor
      land between $180-280. Compressor replacement sits at the high end: $450-650
      depending on the brand and model, and on units older than 8-10 years we'll usually
      say it's not worth it. The diagnostic visit is $65, credited toward the repair if
      you proceed. We quote a flat price before any work starts — parts, labor, and
      applicable tax all included. No line items added after the fact.

  - q: "Do Van Nuys apartment buildings or HOAs require anything special to let repair techs in?"
    a: |
      Refrigerator repair doesn't require a city permit in Van Nuys — it's a residential
      appliance service call, not an electrical or structural alteration, so no permit
      process applies. For apartment buildings, we coordinate directly with building
      managers when access to a service elevator or a gated parking area is needed ahead
      of time. Our technicians carry California contractor license #1136541 and current
      liability insurance, which satisfies most Van Nuys property management companies and
      HOAs that ask for documentation before allowing tradespeople on-site. Just mention
      you're in a multi-unit building when you call and we'll sort out the access details
      before we arrive.

  - q: "Do you repair built-in refrigerators and older models?"
    a: |
      Built-ins are a regular part of the job — the recessed counter-depth KitchenAid and
      LG units common in Van Nuys condo renovations, plus the occasional Sub-Zero in the
      higher-end homes near the Sepulveda Basin. Built-ins take longer because accessing
      the compressor or evaporator often means removing cabinet panels first, so labor runs
      slightly higher on those. On older models — 15-plus years, including vintage Amana or
      Kenmore side-by-sides — we run the full diagnosis but are straightforward about
      whether part availability or refrigerant type makes repair practical. R-22 systems,
      for example, are getting expensive to service. No point charging you for a fix with
      a short runway.

  - q: "What warranty do you offer on refrigerator repairs in Van Nuys?"
    a: |
      Parts carry the manufacturer's warranty — typically 90 days on most components,
      one year on compressors from our parts supplier. Labor is warranted for 90 days: if
      the same failure recurs within that window, we return at no charge. The one caveat
      is pre-existing secondary failures — if a fridge has both a failing compressor and a
      worn condenser fan, repairing just the fan today doesn't extend a warranty to the
      compressor. We walk through every problem we find on the first visit so you can
      decide what to fix now versus monitor, rather than getting surprised by a second
      breakdown two months out.

  - q: "What other Valley cities do you cover, and how do I schedule?"
    a: |
      Coverage extends from Van Nuys north through Panorama City and Granada Hills up to
      Santa Clarita, south into Sherman Oaks and Studio City, east to North Hollywood
      (91606), and west through Reseda and Canoga Park. The entire central and west Valley
      falls within the standard service area — no extra trip charge for any of those ZIP
      codes. Scheduling runs by phone; same-day slots are confirmed by noon for afternoon
      windows. Call (323) 870-4790 and we'll get you a specific arrival window the same
      day — evening appointments available most weekdays too.
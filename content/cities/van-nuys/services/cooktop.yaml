title: "Van Nuys Cooktop Repair — Valley Heat & Hard Water Take a Toll"

intro: |
  The Sepulveda Basin sits right in the middle of Van Nuys, surrounded by rental buildings and tract homes that date back to the 1950s — and most of those kitchens still run gas cooktops plumbed to the original lines. Over the decades, landlords have swapped in whatever was affordable: Frigidaire drop-ins, GE freestanding units, the occasional Kenmore slide-in from Sears. Those appliances are now 10 to 15 years old and failing in predictable ways — igniters that click endlessly without catching, burners that light on one side and not the other, knobs that spin free because the valve shaft beneath them is stripped. The apartment clusters along Van Nuys Boulevard near the Civic Center compound the problem: tight kitchens, deferred maintenance, and Samsung smoothtop models that landlords picked for price rather than longevity. MaxFixing covers Van Nuys and the surrounding Valley with technicians who carry the parts for these specific brands and can usually turn a same-day call into a same-day fix.

localContext: |
  Zip code 91405 — covering the dense corridor along Sepulveda Boulevard — has rental stock built almost entirely between 1950 and 1972, where gas cooktops are standard and the burner assemblies haven't been fully serviced in years. Head a few blocks west into 91406 near Reseda Boulevard and the housing shifts to mid-century single-family homes, some of which have bounced between gas and electric depending on what was cheapest during the last remodel. The San Fernando Valley summer is its own stress factor: sustained 100°F+ days from June through September push kitchen wiring harnesses and control boards through heat cycles that coastal appliances simply don't experience. LA's municipal water supply also leaves its mark — hard water deposits calcify inside burner ports and coat spark electrodes, which is why ignition failure rates in Van Nuys kitchens are noticeably higher than in areas with softened water. Older buildings here also run gas pressure slightly lower than spec, which makes diagnosing flame irregularities require a manometer rather than guesswork.

commonProblems:
  - title: "Igniter Clicks Constantly But the Burner Never Catches"
    description: |
      The spark electrode is the first thing to check — it sits directly under the burner cap, and in Van Nuys kitchens, LA hard water leaves calcium deposits on the electrode tip that insulate it and prevent a reliable arc. On GE gas cooktops, which show up in nearly every apartment building east of Van Nuys Boulevard, this is the most common call we get. Cleaning the electrode and burner cap with a wire brush fixes it roughly 40% of the time. When it doesn't, the spark module driving the electrode has usually failed — a $45–65 part depending on the GE model. Total repair including labor runs $110–160. If the burner still won't catch after a new module, the issue shifts to a partially clogged burner orifice, which needs a calibrated drill bit to clear — not compressed air, which pushes debris deeper into the port. Call (660) 999-9960 and we can usually get there the same day.

  - title: "Cracked Ceramic Glass on a Smoothtop Electric Cooktop"
    description: |
      Samsung's black ceramic smoothtop models are common in Van Nuys apartments built after 2000, and they crack for two main reasons: a heavy pan dropped from even a short height, or thermal shock from setting a cold wet pot on a hot radiant element. Once the ceramic glass surface cracks, the unit becomes a shock hazard — electricity can arc through the fracture to the cooktop frame. Replacing the glass panel is a real repair, not a workaround. OEM ceramic glass for a Samsung 30-inch smoothtop runs $180–280 depending on configuration, plus two to three hours of labor to pull the old panel, transfer the radiant heating elements underneath, and reseal everything correctly. Total cost usually lands at $320–450. For units over 12 years old where that repair cost approaches replacement price, we'll say so directly rather than push the job.

  - title: "Uneven Flame — Burners Running Too Hot or Too Low"
    description: |
      Gas cooktops develop uneven heat for one of two reasons: a partially blocked burner orifice, or a warped burner cap that no longer seats flush against the burner head. In Van Nuys, mineral-laden tap water is almost always the culprit for the first problem — scale builds up inside the small brass orifice that meters gas flow, and the flame burns to one side or runs low regardless of knob position. On Kenmore gas models from the late 2000s — a very common find in older Van Nuys homes — the burner caps also warp from years of heat cycling, breaking the even radial flame pattern that the burner is designed to produce. The fix involves pulling each burner assembly, clearing the orifice with a calibrated drill bit, and testing the cap seating against the burner head. Parts are inexpensive; labor runs 45–75 minutes per burner. A full four-burner service typically costs $95–135 total.

  - title: "Electrical Connection Failures and Error Codes on Electric Models"
    description: |
      Electric cooktops in Van Nuys apartments — especially buildings wired in the 1970s — run into connection problems that aren't always the cooktop's fault. The terminal block connecting the appliance to the building's 240V circuit develops loose or corroded connections over time, causing intermittent heating or error codes on the display panel. On newer Samsung and LG electric cooktops, a bad terminal block connection frequently triggers an E-1 or similar error that mimics a control board failure. Replacing the control board at $200+ when the real fix is a $15–25 terminal block is a common and expensive mistake. We check the connection first. Wiring harnesses inside the cooktop can also burn from heat stress — Valley kitchens that face west in the afternoon are especially hard on internal wiring. When the control board genuinely needs replacement, the cost runs $180–280 depending on the model and part sourcing.

  - title: "Knob Spins Free — Stripped Shaft or Failing Gas Valve"
    description: |
      Cooktop knobs take hard use, and in rentals the wear accelerates. The knob itself is a plastic sleeve fitted over a metal valve shaft — on older Frigidaire and Amana gas cooktops, those sleeves strip out after years of use, leaving the knob spinning without engaging the gas valve. Replacing the knob sleeve is a $20–35 fix that takes about 20 minutes. When the valve shaft itself is worn, or when grease has worked its way into the valve body and caused sticking, the repair escalates. A full gas valve replacement on a Frigidaire 30-inch gas cooktop runs $85–140 for the part, plus 60–90 minutes of labor, for a total of $175–240. Every gas valve job gets a pressure test after installation to confirm a clean shutoff — a sticking valve that doesn't fully close is a safety issue, not something to defer. We carry common Frigidaire and Amana valve assemblies on the truck for most Van Nuys calls.

faq:
  - q: "How fast can you get to Van Nuys for cooktop repair?"
    a: |
      Van Nuys is central Valley — we can typically reach most addresses within two hours of your call on weekdays. The 405 and 101 interchange at Sherman Oaks is the main bottleneck, so morning slots before 9am and afternoon slots after 2pm tend to arrive faster. Parking near apartment buildings on Van Nuys Boulevard can be tight — if your building doesn't have guest spaces, give us a heads-up when you book and we'll plan accordingly. Call (660) 999-9960 to check today's openings across the 91405 and 91406 zip codes; same-day slots are usually available Monday through Saturday.

  - q: "What does cooktop repair cost in Van Nuys?"
    a: |
      Diagnosis runs $65–85 and applies toward the repair if you proceed. Simple fixes — a failed spark electrode, a stripped knob sleeve, a clogged burner orifice — typically land at $95–160 total including parts and labor. Mid-range repairs like a gas valve replacement or a heating element swap run $175–280. Control board replacement on electric models is the most expensive common job, typically $280–380 depending on brand and part availability. Samsung and GE components are usually in stock or available next-day; some older Kenmore configurations take two to three days to source. Pricing is exact after diagnosis — not a range, not an estimate.

  - q: "Do you need a permit for cooktop repair in Van Nuys?"
    a: |
      Standard repair work — replacing a burner, igniter, knob, control board, or heating element — doesn't require a permit in the City of Los Angeles. A permit is required if the scope involves modifying the gas line or electrical rough-in, such as relocating the cooktop or upgrading the circuit for a new 240V electric model. For permitted work, we handle the LA Department of Building and Safety application and coordinate the inspection. Our contractor license is on file with the state and goes on every permit application we pull. Most Van Nuys cooktop repair calls involve no permit at all — we'll confirm that during the initial call.

  - q: "Can you repair both gas and electric cooktops in Van Nuys?"
    a: |
      Both are standard. Gas cooktop work covers spark electrode and spark module replacement, burner orifice cleaning, burner cap seating, and gas valve service. On the electric side, the scope includes radiant heating element replacement, terminal block repair, wiring harness inspection, and control board diagnosis. Induction cooktops are also in scope — they fail differently than radiant electric, usually at the inverter board or coil assembly level, and we carry parts for Bosch and GE induction units. One thing that matters in Van Nuys specifically: pre-1970 buildings sometimes have undersized gas lines or older wiring that affects what's straightforward and what requires a licensed plumber or electrician alongside us — we'll flag that before starting.

  - q: "How long does a repaired cooktop last after service?"
    a: |
      Depends on what was repaired. A new spark electrode and burner cap on a gas cooktop can last five to ten years if the rest of the unit is sound. Gas valve replacement on a Frigidaire or Amana typically adds three to seven years of reliable service. Control board replacement on a Samsung or GE electric cooktop is more variable — OEM boards for mid-2000s models are getting harder to source, and aftermarket alternatives have shorter track records. All parts and labor come with a 90-day warranty: same issue within that window, we come back at no charge. For cooktops over 15 years old, we'll give an honest read on whether repair is worth the cost versus replacing the unit outright.

  - q: "What nearby areas do you cover besides Van Nuys?"
    a: |
      Reseda, North Hills, Panorama City, Sherman Oaks, Encino, and Northridge are all regular stops — no travel premium for anywhere in the central Valley. South along the 170 means Burbank and North Hollywood are also easy same-day coverage. Scheduling runs Monday through Saturday, with evening slots available on Tuesdays and Thursdays for rentals where the tenant can't be home during business hours. Call (660) 999-9960 to book — we confirm the appointment window same-day and send a text when the technician is 30 minutes out.
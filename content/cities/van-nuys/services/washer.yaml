title: "Van Nuys Washer — Hard Water Kills Machines Fast Here"

intro: |
  Hard water in Van Nuys is genuinely brutal on washing machines. The municipal supply
  running through the 91405 zip measures somewhere between 300 and 400 parts per million
  of dissolved calcium and magnesium — enough to coat a Whirlpool water inlet valve in
  mineral scale inside of two years of regular use. Most households in the Delano
  neighborhood near Balboa Park don't realize their washer's slow fill or weak rinse cycle
  traces directly back to that buildup, not a mechanically failing machine. Knock on doors
  along Kittridge Street or over near the Van Nuys Civic Center and you'll find the same
  story: a Samsung front-loader throwing an ND or 5E error code that nobody can explain,
  eventually hauled to the curb and replaced with a new unit that'll hit the same problem
  in 36 months. The scale accumulates inside the detergent dispenser, clogs the drum's
  internal passages, and eventually seizes the drain pump impeller entirely. Diagnosing the
  machine correctly the first time is what actually saves you money.

localContext: |
  Most of the apartment stock in the 91401 zip — especially the blocks east of Van Nuys
  Boulevard toward Woodman Avenue — dates from the late 1960s and early 1970s. Those
  buildings weren't designed with dedicated laundry rooms, so stackable washer-dryer units
  were added into bathroom closets or hallway alcoves later. Tight clearance means a failed
  drain pump doesn't just stop the laundry cycle — it floods the floor and soaks the wall
  behind the unit before anyone notices. Over in 91406, the housing mix shifts toward
  single-family homes, many of which still run original 1970s gas lines and fuse-panel
  electrical. That matters because a Maytag top-loader running on an undersized circuit will
  trip breakers repeatedly — and the homeowner assumes the washer is broken when it's
  actually a wiring issue that also needs addressing. The San Fernando Valley's summer heat
  pushes machines harder too; supply line water temperatures run noticeably warmer from June
  through September, stressing control boards in older units faster than the manufacturers'
  spec sheets account for.

commonProblems:
  - title: "Water Sits in the Drum — Drain Pump Clogged by Van Nuys Mineral Paste"
    description: |
      The drain pump on a Kenmore or Whirlpool top-loader is a small centrifugal pump with
      an impeller — roughly the size of a hockey puck — that pushes water out of the drum
      and through the standpipe. In Van Nuys hard water, dissolved minerals and lint combine
      into a thick paste that coats the impeller vanes over 18 to 24 months of regular use.
      The machine fills, agitates, then just sits there with standing water. Sometimes it
      throws an F21 or 5d error code; sometimes it stops mid-cycle with no indication at
      all. Replacing the drain pump runs $150–$220 total in parts and labor. On a Samsung
      front-loader, the pump is accessed from the front panel — roughly 45 minutes of work.
      On older Kenmore top-loaders it's behind the cabinet, closer to 90 minutes. Either
      way, same-day repair is almost always possible if you call before noon.

  - title: "Won't Spin — Drive Belt Snapped or Drum Bearing Ground Down"
    description: |
      A washer that fills and agitates fine but stops before the spin cycle usually points
      to one of two things: a snapped drive belt or a worn drum bearing. The drive belt on
      a Whirlpool or Maytag top-loader wraps around the motor pulley and transmission — a
      $12 part and a 30-minute swap. Drum bearings are a different story. On a Samsung
      front-loader, the bearing sits inside the rear drum support, and replacing it means
      pulling the full drum assembly — two to three hours of labor. Total cost for a bearing
      job on most Samsung models runs $280–$380. The warning sign is a grinding or rumbling
      noise during spin, similar to a worn wheel bearing on a car. Clothes coming out
      soaking wet after a complete cycle is the other indicator. Don't keep running it — a
      seized bearing can crack the drum spider arm, turning a $300 repair into a machine
      that can't be economically saved.

  - title: "Violent Shaking During Spin — Shock Absorbers Worn Out"
    description: |
      Front-load washers in Van Nuys apartments frequently develop a bone-rattling shake
      during spin cycles — bad enough to walk the machine across the floor or bounce it
      off the vanity cabinet. The usual culprit is worn shock absorbers. The front-load
      drum hangs on two front shocks and two rear suspension springs, and after five to
      seven years those shocks lose their damping entirely. LG models are particularly prone
      to this; they use four shock absorbers and they tend to degrade around the 400-cycle
      mark. New shocks for an LG run $60–$90 in parts, 90 minutes of labor. Before
      replacing anything, though, verify the load isn't the problem — overloading is common
      in apartment units where tenants batch up laundry for a week. Also confirm the machine
      is level; the adjustable feet on older Frigidaire models back out over time, and even
      a quarter-inch of tilt at the front will cause repeatable vibration on every spin
      cycle regardless of shock condition.

  - title: "Door Won't Lock, Machine Won't Start — Door Latch Assembly Failure"
    description: |
      The door latch assembly on a front-load washer is a safety interlock — the control
      board won't release water into the drum until it receives a confirmed door-lock signal.
      On Samsung and LG models, that latch contains a plastic hook and a microswitch that
      corrode or wear over time from repeated use. You'll see an LE or dL error code, or the
      machine simply won't respond when you press start. Replacing the door latch assembly
      typically runs $80–$140 in parts and labor, about 45 minutes of work. Sometimes the
      problem isn't the latch itself but the door strike wearing a groove into the latch
      body — in that case both pieces need replacement. On older GE front-loaders, a sagging
      door hinge can misalign the strike entirely. That's a $45 hinge kit plus 30 minutes —
      a much cheaper fix than replacing a latch that isn't actually broken.

  - title: "Leaking Water — Door Gasket Tear or Water Inlet Valve Cracking"
    description: |
      Leaks on a front-load washer almost always trace to the door gasket or the water
      inlet valve. The door gasket — that thick rubber boot sealing the drum opening —
      tears along the inner fold on LG and Samsung models, usually around year four or five.
      Van Nuys hard water accelerates the deterioration: minerals work into the rubber folds
      and act like fine sandpaper during every spin cycle. A replacement door gasket runs
      $90–$150 in parts; installation takes about an hour because the drum retaining ring
      has to come off. The water inlet valve is the other common leak source — it sits at
      the back where the supply hoses connect, and the solenoid valve body can crack or the
      mesh screen filter can back up enough to cause a pressure-relief drip. Amana and
      Kenmore top-loaders from the 2005–2015 production window are particularly prone to
      inlet valve failure. Parts run $30–$60; it's a 30-minute job once the machine is
      pulled from the wall.

faq:
  - q: "How fast can you get to Van Nuys for a washer repair?"
    a: |
      Van Nuys is almost always same-day from our side. Running the 405 and 101 to the
      Valley, Van Nuys sits centrally — typically 20 to 35 minutes from our usual dispatch
      point depending on afternoon traffic. Street parking on the residential blocks east of
      Van Nuys Boulevard is generally straightforward, so we're not circling for 20 minutes
      before the job starts. Call (323) 870-4790 before noon and there's usually a
      technician at your door by early afternoon. Evening slots are available until 7 p.m.
      on weekdays for people who can't take time off work. The van carries the most common
      replacement parts — drain pumps, water inlet valves, door latch assemblies, drive
      belts — so most repairs wrap up on the first visit.

  - q: "What does washer repair typically cost in Van Nuys?"
    a: |
      Most common washer failures in Van Nuys run $120–$350 all in. A drain pump
      replacement is usually $150–$220. A door gasket on a front-loader runs $160–$240
      depending on brand — LG and Samsung parts cost meaningfully more than Kenmore or
      Amana equivalents because of parts availability. Drum bearing replacement sits at the
      higher end: $280–$380 on most front-loaders due to labor time. The diagnostic visit is
      $75, credited toward the repair cost if you proceed. Pricing on-site is exact — no
      vague estimates that balloon after the job starts. If the repair cost pushes past 55%
      of the machine's current replacement value, that's worth a direct conversation before
      anything gets ordered. Call (323) 870-4790 to set up the diagnostic.

  - q: "My landlord won't fix the washer in my Van Nuys rental — what are my options?"
    a: |
      California law is clear on this: if the washer is provided as part of the rental unit,
      the landlord is required to maintain it under the implied warranty of habitability.
      Plenty of landlords in Van Nuys ignore that obligation, especially in the older
      multi-unit buildings along the Sepulveda corridor in 91405 and 91406. Document the
      failure in writing first — a dated text or email to your landlord creates a paper
      trail. The Los Angeles Housing Department has jurisdiction over rental units here and
      accepts habitability complaints. For property managers who want a fast resolution
      without the paperwork, call (323) 870-4790 — repair invoices are detailed enough for
      reimbursement claims, and same-day service means the machine is running the same day
      the work order is authorized.

  - q: "Do you repair stackable washers in Van Nuys apartment closets?"
    a: |
      Stackable units in apartment bathroom closets are a significant part of what we
      handle. The access situation is tighter than a standard laundry room — typically 28 to
      30 inches of clearance — but most repairs don't require pulling the full stack. Drain
      pump and water inlet valve replacements on LG and Samsung stacked units can be
      completed with the washer in place by removing the front access panel. Control board
      replacements and drum bearing jobs do require pulling the machine out, which sometimes
      means removing a door frame or disconnecting the dryer on top first. Add 30 to 45
      minutes to the standard repair time for stacked configurations. Parking a service van
      in the alley or on side streets near Van Nuys Boulevard is usually manageable — not
      like the permit zones in Santa Monica.

  - q: "Is it worth repairing a washer, or should I just replace it?"
    a: |
      The threshold we use: if the repair cost is under 50% of a comparable new machine,
      fix it. A new mid-range Whirlpool or Samsung washer runs $600–$900 at retail right
      now — so repairs under $350–$400 almost always make financial sense. The exception is
      a machine over 12 years old with a failed control board. Those boards are sometimes
      discontinued, and even when available, the part alone runs $200–$350, which tips the
      math toward replacement. Front-loaders generally last 10–12 years; top-loaders run
      12–15 years with average use. In Van Nuys hard water, expect to shave 1–2 years off
      those estimates unless the inlet valve screens and drum are cleaned annually. An honest
      assessment comes with every diagnostic visit — no pressure to repair if the numbers
      don't add up.

  - q: "What areas near Van Nuys do you cover, and how do I schedule?"
    a: |
      Van Nuys sits near the center of our San Fernando Valley coverage zone. Service runs
      west to Canoga Park and Chatsworth, east to North Hollywood and Burbank, south to
      Sherman Oaks, and north to Panorama City and Arleta. Same-day appointments are
      typically available if you call before noon. Evening slots run until 7 p.m. on
      weekdays — no need to take a full day off. Scheduling is direct: call (323) 870-4790
      and the technician confirms the arrival window by text. Arrival windows are two hours,
      not four — and the tech calls 30 minutes out. For areas outside the Valley, coverage
      extends as far as Irvine to the south and Santa Clarita to the north on most weekdays.
  - q: "Do wine cooler repairs in Van Nuys require permits or landlord sign-off?"
    a: |
      Appliance repair in the City of Los Angeles doesn't require a building permit
      — it's a service repair, not an installation. For rental units in the 91405
      or 91411 zip codes, tenants can schedule directly; if the landlord needs
      documentation for repairs under $500, we provide a detailed invoice with part
      numbers and model information that satisfies most property management companies.
      For larger jobs requiring owner authorization, we can coordinate directly with
      the property manager. We operate under contractor license #1136541. Let us
      know it's a rental when you call (660) 999-9960 and we'll set expectations
      before we show up.

  - q: "Can you repair thermoelectric wine coolers, not just compressor models?"
    a: |
      Yes — and the two types fail completely differently. Thermoelectric units use
      a Peltier module with no moving parts, which means quieter operation but a
      hard ceiling on how much cooling they can deliver in a warm kitchen. When the
      Peltier module fails, the unit stops cooling entirely — no in-between. Modules
      for common Frigidaire and Cuisinart thermoelectric models run $40–$80, and
      replacement is straightforward. Compressor-based units — the GE and Samsung
      models more common in Van Nuys homes — have more failure points but are also
      more repairable long-term. We carry parts for both types on the van.

  - q: "What warranty covers wine cooler repairs in Van Nuys?"
    a: |
      Parts carry the manufacturer's warranty, which runs 90 days to one year
      depending on the component. Our labor is warranted for 90 days — same issue,
      same part, we come back at no charge. For compressor-level repairs, we'll
      always compare the cost to the unit's replacement value before recommending
      the work. A GE or Whirlpool unit under six years old almost always makes
      sense to repair. A $180 budget cooler needing a $160 compressor doesn't,
      and we'll tell you that at diagnosis. No pressure to authorize anything
      before you have the full picture.


title: "Van Nuys Range Repair — Valley Heat, Old Gas Lines, Real Fixes"

intro: |
  Triple-digit days on Sherman Way don't care that your Kenmore 400-series gas range is
  15 years old. The San Fernando Valley bakes from June through October, and ranges in
  Van Nuys kitchens run harder than their coastal counterparts — more cooking cycles,
  more heat stress on igniters and control boards. Around Van Nuys Airport, the
  residential blocks in 91406 are packed with 1970s apartment buildings where landlords
  swapped out original ranges with whatever Frigidaire or Amana unit was cheapest at the
  time. Those replacement units are now 10-15 years old themselves, and the spark igniter
  modules and bake elements are starting to give out. Southern Van Nuys, closer to the
  Sherman Oaks border, has more single-family homes with GE freestanding ranges that have
  been sitting on the same gas hookup since the Carter administration. Call
  (323) 870-4790 — we're typically in Van Nuys within two hours on same-day calls.

localContext: |
  Zip code 91405 covers the core of Van Nuys Boulevard's commercial strip and the dense
  residential blocks to its east — mostly 1960s and 1970s two-story apartment buildings
  with galley kitchens where a 30-inch freestanding range is a tight fit. Landlords in
  these buildings tend to run the same Whirlpool or Amana units for a decade past their
  service life before replacing them, which means we see a lot of deferred maintenance:
  clogged burner ports, cracked door gaskets, and worn valve stems that have been seeping
  gas slowly for months. Over in 91406, the Lake Balboa area has quieter residential
  streets with more owner-occupied homes, and the range problems there skew toward
  control board failures on mid-2000s GE and Samsung units. Valley heat is a real
  factor: thermal cycling from cold nights to 105°F afternoons accelerates gasket
  degradation on oven doors, which means ovens lose calibration and run 25-50 degrees
  off the set temperature. Gas ranges outnumber electric probably 3-to-1 in Van Nuys,
  so our technicians handle gas calls almost exclusively out here.

commonProblems:
  - title: "Igniter Clicks Endlessly But Burner Won't Light — Spark Module Failure"
    description: |
      You turn the burner knob, hear rapid clicking, catch a whiff of gas, and nothing
      ignites. That's a failing spark igniter module — the ceramic electrode tip erodes
      over time, the gap between the electrode and burner cap widens, and eventually the
      spark can't bridge it. On Whirlpool-platform ranges (which includes most Kenmore
      400-series units sold at Sears through the 2000s), the igniter module runs $35-55
      in parts. Grease vapor in the kitchen also coats the electrode tip and kills
      conductivity even before the ceramic fully wears, so the fix sometimes starts with
      a thorough cleaning rather than a replacement. Full igniter replacement with labor
      lands between $120 and $180 depending on how many burners are affected. We stock
      Whirlpool-platform igniters and GE equivalents on the van and can usually close
      this repair on the first visit.

  - title: "Oven Won't Reach Set Temperature — Bake Element and Sensor Problems"
    description: |
      An oven that preheats but stalls 50 degrees short of the target is a common GE
      and Frigidaire complaint in Van Nuys rentals. Two parts are usually responsible:
      the bake element — the visible coil at the oven floor — or the oven temperature
      sensor clipped to the cavity wall. A broken bake element sometimes shows a visible
      burn spot or fracture in the coil, but partial failures can look completely intact
      and only reveal themselves under resistance testing. Sensor failures feed the
      control board wrong readings, so the board never commands full heat output and the
      oven plateaus. On GE freestanding models, a replacement bake element runs $40-80
      in parts; temperature sensor replacement adds $90-140 all-in with labor. We test
      both components during the diagnostic so we're not replacing parts blind. Broil
      element failures show the same symptoms but only affect top heat — mention it when
      you call so we bring the right part.

  - title: "Gas Smell Near the Range — Valve Stem Leaks and What Permits Apply"
    description: |
      A persistent gas odor when burners are off points to a slow leak at the gas valve
      stem — the fitting where the valve body meets the burner supply tube. On older
      Frigidaire and Amana ranges, the valve stems degrade at the o-ring seal after
      10-plus years of thermal cycling. This is not a repair to wait on. The gas supply
      needs to be shut at the shutoff valve behind the unit before work begins, and the
      valve assembly must be pressure-tested after replacement. Gas line work in the City
      of Los Angeles requires a permit through the LA Department of Building and Safety;
      we pull that permit and handle inspection documentation. Our contractor license is
      #1136541. If you smell gas and can't identify a burner left partially open, call
      (323) 870-4790 — we keep evening slots available and treat gas smell calls as
      priority same-day visits.

  - title: "Uneven or Yellow Flame — Clogged Burner Ports and Cap Misalignment"
    description: |
      A burner that flames yellow on one side and blue on the other has either a clogged
      port or a misaligned burner cap. Samsung and LG ranges — common in newer Van Nuys
      apartments along Van Nuys Boulevard — use brass sealed burner assemblies where the
      cap must seat precisely on the burner base. Off by a few millimeters and the
      gas-to-air mixture gets disrupted. Reseating the cap is a $0 fix if that's all it
      is. But if the burner ports are packed with carbonized grease, they need clearing
      with a thin wire tool — using a toothpick risks leaving fragments that worsen the
      clog. Full burner assembly cleaning on a service call runs $80-120 per burner.
      Heavily corroded burner bases on older units may need full replacement, adding
      $60-100 in parts. We'll tell you upfront whether cleaning is enough or whether the
      assembly has degraded past the point of a lasting result.

  - title: "Control Panel Dead or Throwing Error Codes — Board and Touchpad Failures"
    description: |
      Samsung ranges are notorious for F-series error codes mid-cooking — F3 usually
      means the oven temperature sensor is out of range, F9 typically points to a door
      latch assembly fault on self-cleaning models. GE Profile smooth-tops show panel
      failures differently: specific buttons stop registering while others still work,
      which usually means a cracked membrane under the control panel face rather than a
      full board failure. Touchpad-only replacement runs $150-250 all-in on most GE
      models. Full control board replacements run $200-350 in parts alone on GE Profile
      and Samsung ranges. At that price point, we'll give you a straight assessment of
      whether the repair makes financial sense given the unit's age and what a comparable
      replacement would cost. Board availability is also an issue on units over 12 years
      old — we verify parts exist before you commit to anything.

faq:
  - q: "How fast can you get to Van Nuys for range repair?"
    a: |
      Same-day calls placed before noon usually get us to Van Nuys within two hours.
      The 405 northbound can slow things on heavy traffic days, but routing up the 101
      to Sepulveda keeps the drive time predictable from most of our other stops.
      Apartment buildings on the denser blocks near Van Nuys Boulevard sometimes have
      limited street parking — if your building has alley-only access or a gated lot,
      mention it when you call so we can plan accordingly. Evening slots are available
      a few nights a week for after-work appointments, and we do Saturday service on
      a first-come basis. Reach us at (323) 870-4790 to check same-day availability
      or lock in a window.

  - q: "What does range repair typically cost in Van Nuys?"
    a: |
      Diagnostic visits run $75-85, credited toward the repair if you move forward.
      Most common repairs — igniter module replacement, bake element swap, temperature
      sensor — land between $120 and $220 all-in. Gas valve work adds $30-50 over
      standard labor because pressure testing is required after reassembly, and that
      step can't be skipped. Control board replacements are the expensive end, typically
      $250-400 depending on brand and whether the board is still in production. Older
      units with discontinued boards sometimes push those numbers higher because parts
      have to come from secondary suppliers. You'll get an exact number before we touch
      anything — the quote is firm, not an estimate that grows mid-repair.

  - q: "Does gas line work in Van Nuys require a permit from the city?"
    a: |
      Yes. Gas line modifications in the City of Los Angeles — including replacement of
      the flexible connector behind the range or any work on the shutoff valve — require
      a permit through the LA Department of Building and Safety. Straight appliance-for-
      appliance swaps on existing, undisturbed gas lines generally don't trigger that
      requirement, but landlords with rental units should confirm with LADBS for their
      specific address before assuming. We pull permits, coordinate the inspection, and
      handle all documentation for permitted gas work. Our contractor license number is
      #1136541. The permit process for gas work in LA typically takes one to three
      business days to issue, so factor that into scheduling if your timeline is tight.

  - q: "Do you repair electric ranges and glass smooth-top ranges in Van Nuys?"
    a: |
      Yes — gas calls dominate in Van Nuys given the Valley's heavy gas appliance
      penetration, but electric range repairs are a regular part of the rotation. Coil-
      top surface element replacements on older units are straightforward. Glass ceramic
      smooth-top repairs are more involved: the radiant heating element sits beneath the
      ceramic surface and isn't visible from above, so failures require resistance testing
      with a multimeter to confirm. GE and Frigidaire smooth-top elements run $60-120 in
      parts. The ceramic glass surface itself can be replaced if cracked, though on older
      units the part cost sometimes approaches what a new entry-level range costs — we'll
      flag that comparison before you decide. Give us the model number when you call and
      we can usually quote parts availability on the spot.

  - q: "What warranty comes with the range repair work?"
    a: |
      Parts carry the manufacturer's warranty — typically 90 days on OEM and direct-
      equivalent components, which is what we source. Labor is also warranted 90 days:
      if the same problem returns within that window, we come back at no charge. That
      said, a bake element replacement doesn't cover an unrelated control board failure
      the following month — we're warranting the specific repair, not the appliance
      broadly. On units over 12-15 years old, we'll tell you when repair costs are
      approaching what a comparable new unit would run, so you're not putting $300 into
      a range that has two years of life left regardless of what we fix today.

  - q: "What nearby neighborhoods do you cover from Van Nuys?"
    a: |
      Van Nuys sits at the center of our San Fernando Valley route. Daily stops include
      Sherman Oaks, Panorama City, North Hills, Reseda, and Canoga Park. Studio City
      and Burbank are also on the regular schedule with similar two-hour response times.
      Farther out — Santa Clarita to the north, or Thousand Oaks to the west — same-day
      is still often doable if the call comes in early. For addresses south of the 101,
      we handle Studio City and North Hollywood on the same run. Call (323) 870-4790
      to check availability for your specific zip; morning slots fill fastest on
      weekdays, so earlier in the day gives you the best shot at same-day service.
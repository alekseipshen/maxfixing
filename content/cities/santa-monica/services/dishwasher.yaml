title: "Santa Monica Dishwasher — Coastal Hard Water Specialists"

intro: |
  Salt air off the Pacific does something subtle to kitchen appliances in the 90402 and 90403 zip codes — it accelerates mineral deposits inside spray arms and wears down door latch assemblies faster than inland neighborhoods typically see. That Bosch 500 Series running in a Montana Avenue kitchen handles the same hard LADWP water as everywhere else in LA, but coastal humidity adds a layer of wear most technicians overlook. Santa Monica dishwashers fail in predictable patterns once you know what to look for.

localContext: |
  Buildings along Ocean Park Boulevard and the streets north of Wilshire tend to be 1960s apartment complexes with compact kitchens and tight under-counter dishwasher clearances. The 90405 zip mixes these older rentals with newer condo conversions where KitchenAid and Miele units were installed as upgrades. Getting a service van into street parking near Main Street takes planning — we account for that on every Santa Monica dispatch and build it into the arrival window.

commonProblems:
  - title: "Spray Arm Clogging from LADWP Hard Water"
    description: "Santa Monica water runs around 300–350 ppm hardness — enough to pack spray arm nozzles solid within a year or two of normal use. That Bosch or KitchenAid suddenly leaving dishes cloudy and wet? Nine times out of ten it's mineral scale on the spray arm or heating element, not a mysterious electrical fault. A good descale and nozzle clear fixes it without parts."
  - title: "Drain Pump Failures in Older Ocean Park Units"
    description: "The 1970s apartment stock in Ocean Park and Sunset Park puts a lot of miles on dishwashers that rarely get serviced. Drain pump failures show up as standing water at the bottom of the tub after a full cycle. Samsung and LG units in these buildings throw E2 or OE error codes when the pump impeller jams with food debris and calcium scale from the water supply."
  - title: "Door Latch and Detergent Dispenser Issues in Coastal Kitchens"
    description: "Coastal humidity works on plastic components inside dishwasher doors over time. The detergent dispenser spring mechanism on older Bosch and Miele units stiffens and misfires mid-cycle, leaving a detergent puck stuck in the dispenser. Door latch assembly misalignment is another common one — the machine won't start because the door switch never registers a proper close. Small fix, big frustration."

faq:
  - q: "How fast can you get to Santa Monica for dishwasher repair?"
    a: "Most Santa Monica calls get same-day service — we run routes through the 10 freeway corridor and can usually reach 90401–90405 within 2 hours of your call. Parking near the pier and Third Street Promenade is tighter, so we plan ahead. Call us at (323) 870-4790 to schedule."
  - q: "Do you repair Bosch and Miele dishwashers in Santa Monica?"
    a: "Bosch is the most common brand we pull out of Santa Monica kitchens — the 300 and 500 Series are everywhere. Miele units show up frequently north of Montana Avenue. KitchenAid and Thermador built-ins too. Each brand fails differently: Bosch control boards behave nothing like KitchenAid float switches, and we carry parts for both."
  - q: "What does a dishwasher repair typically cost, and how fast can you diagnose it?"
    a: "Drain pump replacement usually runs $150–250 parts and labor. A door latch assembly or detergent dispenser fix comes in under $120 most days. We diagnose on-site — no guessing over the phone. Evening slots are available if mornings don't work. Call (323) 870-4790 for same-day booking."

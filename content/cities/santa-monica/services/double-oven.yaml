intro: |
  Santa Monica double ovens fail in predictable ways. The Thermador double wall units in homes along Montana Ave run into false open-door lockouts — the oven shuts down mid-roast, throws an error code, and won't restart until you pull the control board. It's not the door. It's usually a door latch microswitch worn past its contact threshold. We carry the replacement on the truck.

  Most double ovens in this zip — 90402, 90403 — are 5 to 12 years old. That's exactly when bake elements start cracking at the bend, when thermal fuses blow after a self-clean cycle, and when the control board starts misreading the RTD probe temperature. We diagnose the actual failed component. You get a fixed oven, not a parts-swapped guess.

localContext: |
  Santa Monica kitchens are compact. Most homes west of Lincoln have 30-inch double wall ovens, not ranges — and getting a service van parked on 14th Street or Ocean Park Boulevard during the day takes planning. We account for that.

  The older craftsmans and Spanish colonials near Palisades Park have original cabinet cutouts sized for discontinued 27-inch units. KitchenAid and Bosch both made those sizes, and both still have available parts. The hinge assemblies and door gaskets differ from the 30-inch models, so a technician who hasn't worked on them before will order wrong. We've been in enough of these kitchens to know the difference.

  Coastal air accelerates corrosion on broil elements and igniter connectors. If your oven is within six blocks of the beach — zip 90401 or the west end of 90405 — oxidation is probably part of the problem even if the failure looks purely electrical.

commonProblems:
  - title: "Upper oven not heating, lower oven works fine"
    description: |
      This split failure points to the upper bake element or its dedicated control relay — not a shared component. On Thermador double wall units, the upper and lower cavities run on separate control boards in older models. An element that reads open on a multimeter needs replacement. One that reads correct resistance but still fails to heat usually has a relay stuck open on the board.

      Error code F1 or F3 on the upper display narrows it further. F3 typically means the RTD probe is reading out of range — either the probe drifted or there's a wiring harness issue between the probe and board. The upper cavity of a Santa Monica Thermador built into a 2008-era remodel will have had that harness bent repeatedly during the original install.

  - title: "Self-clean cycle trips the thermal fuse"
    description: |
      Self-clean runs the cavity to 900°F. The thermal fuse is a one-shot safety device rated for a specific cutoff temperature — once it blows, the oven goes completely dead. Bosch wall ovens mount the thermal fuse near the control housing rather than in the cavity, so it's accessible without full disassembly.

      Replacing just the fuse misses the point. If it blew, the cavity exceeded its rating. That usually means a blocked exhaust vent, a failing door gasket letting heat migrate, or a control board that didn't terminate the cycle on time. Fix the root cause or the new fuse blows on the next clean cycle.

  - title: "Door hinge sags — oven won't seal properly"
    description: |
      A sagging oven door is a hinge assembly failure, not a cosmetic issue. On KitchenAid double ovens, the hinge arms are held by a retaining bracket that fatigues after years of the heavy door cycling open and closed. Once that bracket cracks, the door drops 3–5 millimeters. That gap breaks the gasket seal and the oven loses 40–60°F off its actual cavity temperature.

      The door has to come completely off to replace the hinge assembly — it's a two-person job on larger units. Trying to swap hinges with the door in place bends the retaining bracket channel and makes the new hinge fail faster.

faq:
  - question: "Do you repair both gas and electric double ovens?"
    answer: |
      Yes. Gas double ovens have igniter assemblies, gas valve solenoids, and flame sensors that electric units don't — and they fail differently. The igniter on a Viking double range weakens before it fails completely: you'll hear repeated clicking, the burner lights late, then one day it doesn't light at all. Electric units fail at the element or the control board. Both types, covered.

  - question: "Can you get here the same day?"
    answer: |
      Usually yes. Call (323) 870-4790 and we'll tell you what's open. Most Santa Monica appointments in the 90401–90405 area get same-day or next-morning slots. If your oven is completely dead before a dinner, say that — evening slots are available for situations that can't wait.

  - question: "Is it worth repairing a 10-year-old double oven?"
    answer: |
      Depends on the brand and the failure. A Thermador or Bosch double wall oven needing a bake element or thermal fuse is worth fixing — parts are available and these units are built to run 20 years. A Samsung or LG unit with a failed control board at year 10 is closer to a coin flip. We quote the part cost before touching anything so you can make the call yourself.
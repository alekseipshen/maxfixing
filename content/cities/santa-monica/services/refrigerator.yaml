title: "Santa Monica Refrigerator Repair — Coastal Air, Hard Water, Fixed Fast"

intro: |
  Ocean Park apartments near Lincoln Boulevard see this constantly: a KitchenAid
  french-door running warm because the condenser coils are packed with lint and
  salt-air grime. Santa Monica's marine layer keeps temps mild, but humidity
  and LA's notoriously hard municipal water wreak quiet havoc on ice makers and
  water lines year-round. Call us at (323) 870-4790 — we run the 10 Freeway
  daily and can usually be there within 2 hours.

localContext: |
  The 90405 zip code — Sunset Park south of Pico — is dense with 1950s and
  1960s duplexes where kitchens were designed for compact 24-inch refrigerators.
  Newer condo towers on Wilshire near 90403 swing the opposite direction:
  built-in Sub-Zero column units behind cabinet panels that require a panel
  removal just to access the evaporator. Street parking for a service van on
  these blocks is its own puzzle, so we call ahead and plan accordingly.

commonProblems:
  - title: "Mineral Scale Killing Ice Makers in Hard-Water Zip Codes"
    description: "Santa Monica pulls from the same LA DWP supply that averages
      300+ mg/L total dissolved solids. That mineral load coats the ice maker
      assembly — specifically the water inlet valve screen and the fill tube —
      until water flow drops to a trickle or stops entirely. Samsung and LG
      french-door models with in-door ice are especially prone; we clean or
      replace the valve and flush the line in one visit."

  - title: "Compressor Noise in Apartments with No Air Circulation"
    description: "Older buildings in the 90401 and 90404 zip codes often have
      refrigerators wedged into alcoves with zero clearance on the sides and
      back. The condenser fan can't move enough air, the compressor runs hot,
      and you start hearing a rattling hum at 2 a.m. Bosch and KitchenAid
      counter-depth units are particularly sensitive to clearance — the fix is
      sometimes repositioning, sometimes a failing condenser fan motor swap."

  - title: "Frost Buildup and Warm Spots From a Stuck Defrost Timer"
    description: "A refrigerator that's cold on top but warm on the bottom
      shelf — or one growing a glacier on the back wall of the freezer — usually
      traces back to a defrost timer or a shorted defrost heater on the
      evaporator coil. Sub-Zero built-ins in Wilshire Montana homes show this
      failure pattern after 8-10 years. The error often doesn't throw a code,
      so it gets ignored until food starts spoiling."

faq:
  - q: "How fast can you get to Santa Monica for refrigerator repair?"
    a: "We're typically in the area same-day. From our nearest tech on the
      Westside, Santa Monica is a 20-30 minute run depending on the 10. Tight
      parking blocks near the promenade or Main Street — we'll call you before
      arrival to coordinate. Schedule online or call (323) 870-4790."

  - q: "Do you service Sub-Zero and Thermador refrigerators in Santa Monica?"
    a: "Yes — Sub-Zero built-ins and Thermador columns are common in the 90402
      zip (north of Montana). We carry the panel-removal tools these units
      require. Also handle KitchenAid, Bosch, LG, and Samsung regularly.
      Sub-Zero evaporator and thermostat work is our most common call in that
      corridor."

  - q: "What does refrigerator repair usually cost, and do you charge a
      diagnostic fee?"
    a: "Diagnostic runs $75, waived if you book the repair. Most fixes — door
      gasket, water inlet valve, thermal fuse, drain pump — land between $150
      and $350 parts and labor. Compressor replacement on a unit under 8 years
      old we'll quote honestly; sometimes replacement makes more sense. Same-day
      and evening slots available — call (323) 870-4790."

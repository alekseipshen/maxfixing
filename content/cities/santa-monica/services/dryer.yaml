title: "Santa Monica Dryer Repair — Marine Air, Tight Vents, No Heat"

intro: |
  The marine layer off the Pacific pushes ambient humidity into laundry rooms that were never
  designed for it — especially the stacked-unit condos lining 4th and 5th Streets near Ocean
  Park. A Bosch 300 Series compact dryer running 90-minute cycles when it used to finish in 45
  is telling you something specific: restricted airflow or a failing moisture sensor, not just
  age. MaxFixing runs Santa Monica routes daily. Call (323) 870-4790.

localContext: |
  Buildings in the 90405 zip — Ocean Park, Sunset Park — were mostly built between 1950 and
  1975. Laundry was an afterthought: closets tucked off hallways, vent runs hitting two or three
  bends before daylight. That geometry chokes exhaust. North of Wilshire in 90402, the housing
  shifts to larger homes with proper laundry rooms, but the appliances get more complicated —
  Thermador, Bosch, KitchenAid — each needing different diagnostic procedures and parts sourcing.

commonProblems:
  - title: "Thermal Fuse Keeps Blowing in Ocean Park Apartments"
    description: "A thermal fuse blows when exhaust temps spike — usually because lint has packed
      the vent run solid. In buildings off Pier Avenue where vent stacks run through shared walls,
      one clogged section affects every unit above it. Samsung dryers are especially sensitive:
      they throw a tE3 error and shut down completely rather than run hot."
  - title: "Drum Stops Spinning Mid-Cycle in Older Units"
    description: "Drive belt and drum rollers take real abuse in humid coastal laundry rooms where
      condensation cycles daily. LG units from 2015–2019 had a known drum roller bracket failure
      mode — the rollers flatten on one side and you hear a rhythmic thump before the drum seizes.
      Replacing rollers without checking the belt tensioner means a callback in three months."
  - title: "No Heat Even After Resetting — Gas Dryer Specific"
    description: "Gas dryers west of Lincoln Boulevard are usually Whirlpool or KitchenAid. If
      the gas valve igniter glows for two seconds then cuts out before the burner catches, the
      igniter coils are failing. Most people assume it's a heating element — but gas units don't
      have one. Completely different diagnosis, completely different part."

faq:

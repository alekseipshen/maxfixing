title: "Santa Monica Cooktop — Salt Air, Hard Water, and High-End Kitchens"

intro: |
  Montana Avenue's renovation wave hit hard through the 2000s and 2010s —
  Bosch five-burner gas cooktops went into a lot of those kitchens, and now
  those units are pushing 15-20 years. Spark igniters start failing. Gas
  valves get sticky. The marine layer doesn't help: salt air accelerates
  corrosion on electrode tips and burner caps faster than anywhere inland in
  LA County. We run routes through this part of the Westside regularly and
  stock the parts for it.

localContext: |
  The 90402 zip — north of Wilshire, east of 26th Street — is mostly
  1920s-1940s bungalows and Spanish colonials that have been through one or
  two full kitchen gut-jobs. Thermador and KitchenAid cooktops dominate those
  renovations. The 90403 corridor along Wilshire runs into a mix of pre-war
  dingbats and postwar apartment blocks — smaller kitchens, usually 30-inch
  electric or induction cooktops crammed into tight cabinet cutouts.
  Getting to the control board on those without pulling the whole unit
  requires mapping the access point before the appointment.

  South in 90405, Ocean Park mixes 1960s apartment buildings with newer
  condos. Those kitchens often have tighter clearances — harder to pull a
  built-in cooktop for service without disassembling adjacent cabinet panels
  first. The stretch along Lincoln Boulevard between Pico and Rose is dense
  residential — street parking is a real scheduling factor, and we build that
  into the booking window. Properties within a few blocks of the Santa Monica
  Pier and Ocean Avenue consistently show more corrosion on burner components
  than homes farther east near San Vicente or Cloverfield. Salt air is not
  theoretical here. We've serviced everything from ocean-facing condos on 2nd
  Street to the older hillside bungalows up near Montana and 7th.

commonProblems:
  - title: "Spark Igniter Failure Accelerated by Coastal Humidity"
    description: "Constant marine humidity corrodes the spark electrode tips on gas
      cooktops faster than in drier inland cities. On Bosch gas models, the
      igniter module itself can short out — you'll hear constant clicking even
      with all burners off, or get zero spark when you need it. The electrode
      ceramic can also crack from thermal cycling, causing intermittent
      ignition: sometimes it lights, sometimes it doesn't. Replacing the
      igniter module and clearing the burner ports of debris usually resolves
      it completely. Not a difficult fix if you catch it early."
  - title: "Cracked Ceramic Glass on Induction and Electric Cooktops"
    description: "LG induction models are common in the newer Ocean Park builds and
      condos along Ocean Avenue. A crack in the ceramic glass panel doesn't
      always kill the cooktop immediately, but cooking on it risks damaging the
      heating element underneath and is a real safety issue. That glass is a
      direct panel replacement — no patch kits, no workarounds. We source
      panels for LG and Samsung induction units directly."
  - title: "Clogged Burner Orifices From LA's Hard Water"
    description: "Hard water in Santa Monica leaves calcium scale not just in
      dishwashers — mineral deposits build up inside gas burner orifices over
      time, especially on open-burner designs. KitchenAid and Thermador
      rangetops with exposed burner grates are particularly vulnerable. Result
      is uneven flame, one side running hot while another barely lights. The
      fix is disassembly, orifice cleaning, and verifying gas valve flow —
      not just swapping the burner cap and calling it done."

faq:
  - q: "How fast can you get to Santa Monica for a cooktop repair?"
    a: "Same-day service is available most days — we run the West LA and Santa
      Monica corridor regularly. Morning slots work best near the beach because
      parking logistics near Ocean and Main Street take extra time. Call us at
      (323) 870-4790 and we'll lock in a two-hour window."
  - q: "Do you work on Bosch and Thermador cooktops specifically?"
    a: "Both brands show up constantly in the north-of-Wilshire neighborhoods
      and we carry parts for them. Bosch igniter assemblies, Thermador gas
      valve components, KitchenAid burner caps and grate hardware — stocked on
      the van. Premium brands need brand-specific parts, not generic
      substitutes, and we don't cut corners on that."
  - q: "What does a cooktop repair cost, and do you have evening availability?"
    a: "Diagnostic visit is $75 and that fee applies toward the repair if you
      go ahead with it. Most repairs — igniter replacements, ceramic panel
      swaps, burner cleaning — run $150 to $380 depending on parts. Evening
      slots are available. For anything urgent, call (323) 870-4790 — we can
      usually get emergency appointments out same day."
title: "Santa Monica Cooktop — Ocean Park to Montana, Fixed Fast"

intro: |
  North of Montana in 90402, remodeled kitchens ran Thermador and Bosch
  five-burner gas cooktops through most of the 2010s. Hard water from the
  LA Municipal system — well over 300 mg/L calcium carbonate — packs into
  burner crowns and clogs spark igniter ports faster than owners notice.
  Floors below at Ocean Park see the same problem. Pico Boulevard to the
  south, Wilshire to the north — we cover the full Santa Monica grid daily.
  Call (323) 870-4790 for same-day availability.

localContext: |
  Much of 90405 is 1960s and early-'70s apartment and condo stock along
  Pier Avenue and the blocks south of Pico — 24-inch cooktop cutouts, gas
  lines that haven't been touched in 40 years, kitchens where the unit
  sits flush against a tile wall. That layout matters when a technician
  needs to pull a cooktop to reach the igniter module or swap a gas valve
  assembly. Getting a cargo van parked on those residential streets near
  Cloverfield Park during the day takes planning — we account for it.

  The Sunset Park neighborhood, south of Pico between Centinela and Lincoln,
  is dense with 1950s California bungalows that were never built for modern
  appliances. Galley kitchens. Drop-in cooktops sitting on original cabinetry.
  GE and Frigidaire coil units that have been running since the Carter
  administration. Owners in that pocket usually find us when the surface
  element stops heating entirely — often a failed infinite switch, not the
  element itself. A common misdiagnosis.

  Newer single-family homes in 90403 near the Civic Center and up toward
  26th Street skew toward induction — different problem set entirely.
  The mid-century houses along Montana Avenue between 7th and 14th run
  Thermador and KitchenAid induction panels that need control board
  diagnostics, not burner work. Over in 90404, closer to the Bergamot
  Station arts district, there's a mix of newer construction condos with
  Samsung and LG slide-in ranges and older stock with original Frigidaire
  coil cooktops still in service.

  Wilshire Montana — the corridor running from 14th Street toward the
  border with West LA at 26th — has a lot of 1980s and early-'90s condo
  towers, many with gas shut-offs behind the unit that the building
  manager controls. Scheduling around that adds lead time. Same situation
  in the high-rises fronting Ocean Avenue in 90401: doorman buildings,
  freight elevator access, parking validation runs out fast. We factor
  that into the service window so the visit doesn't run long.

  Each block in Santa Monica is its own situation. We've been into enough
  of these kitchens to know what to expect before we even open the toolbox.

commonProblems:
  - title: "Spark Igniters Clogged by Hard Water — Bosch and KitchenAid Gas Units"
    description: "Mineral deposits build up on the ceramic igniter electrode tip over months of
      normal use. The burner clicks constantly but won't catch — a classic symptom on
      Bosch 500-series and KitchenAid five-burner models. Replacing the electrode is
      straightforward, but it's a precise part fit; generic aftermarket igniters rarely
      seat correctly and create the same failure within weeks. On Bosch units, the
      igniter wire harness connector also corrodes from grease and steam — we check
      that too before closing up, because a new electrode on a corroded harness just
      fails again in six months."
  - title: "Cracked Glass-Ceramic Surface After Thermal Shock"
    description: "Splashing cold water onto a hot radiant element causes stress fractures in
      the ceramic glass panel — more common than people expect. Once cracked, the
      surface element below can arc during operation. Thermador induction cooktops
      use a tempered glass panel that's model-specific; a hairline crack means the
      unit is unsafe to run until the panel is replaced. Don't ignore it. The E-series
      Thermador units common in 90402 display error code F7 or F9 when the panel
      sensor loses continuity through a crack — if you're seeing that on the display,
      that's almost always the diagnosis."
  - title: "Gas Valve Sticking on LG Studio-Series Cooktops"
    description: "After years of heavy cooking, the gas valve needle on LG studio-series models
      sometimes sticks slightly open — you get an uneven, lopsided flame or a faint
      hissing at idle. That's not a burner cap issue. The valve body itself needs
      replacement, which requires shutting down the supply line and verifying gas
      pressure after reassembly with a manometer. Attempting to clean around a stuck
      valve doesn't fix the seal. Same failure shows up on Samsung NX-series gas
      cooktops, usually after the five-year mark on heavy-use units."

faq:
  - q: "How fast can you get to Santa Monica for cooktop repair?"
    a: "From West LA dispatch, we're typically in Santa Monica within 45–60 minutes.
      Parking near Ocean Park and the Pico neighborhood runs tight — we use a cargo
      van, not a full truck. Morning slots book fastest for the 90405 zip. Call
      (323) 870-4790 or book online; same-day slots usually fill by noon, but we
      keep emergency openings for gas-related issues — those we prioritize."
  - q: "Do you work on Thermador and Bosch cooktops specifically?"
    a: "Both are common in 90402 and 90403, especially in homes off Montana Avenue.
      Thermador induction units typically come in with control board faults or cracked
      panels — we carry the panel adhesive gasket kit and can usually complete the
      job same visit. Bosch 800-series gas models most often need igniter electrode
      or burner cap work. We stock OEM parts for both lines, which means fewer
      return trips for parts-ordering delays."
  - q: "What does a cooktop repair cost in Santa Monica, and how does the visit work?"
    a: "Diagnostic is flat-rate. Most repairs — igniter replacement, gas valve swap,
      control board — run $150–$350 in parts and labor combined. Complex panel
      replacements on Thermador or KitchenAid induction units run higher depending
      on the model, but you get a firm quote before anything is ordered. Same-day
      emergency service is available; for urgent calls in Santa Monica we're usually
      on-site within 2 hours. Evening slots are available Tuesday through Saturday
      for homeowners who can't be home during the day."
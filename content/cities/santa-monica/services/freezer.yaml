title: "Santa Monica Freezer Repair — Hard Water & Salt Air Fix"

intro: |
  Santa Monica tap water runs around 280-300 ppm dissolved calcium. That mineral load is one of
  the quieter reasons ice makers fail faster here than in drier inland cities. A KitchenAid
  upright near Montana Avenue in 90402 will start making hollow or cloudy ice within two years
  if nobody's descaling the water inlet valve and the ice maker assembly.

  Coastal humidity makes it worse. Door gaskets degrade faster here than anything you'd see in
  the San Fernando Valley — the salt air off the Pacific just eats them. It's a predictable
  repair pattern we run into constantly across the 90401-90405 zip codes.

localContext: |
  The Pico neighborhood in 90404 holds a lot of older rental stock. Apartment buildings from the
  1960s with narrow galley kitchens were not built for modern full-size freezers.

  Around Cloverfield Boulevard and the blocks east of Centinela, units from that era have minimal
  rear clearance. That tight fit accelerates compressor wear over time. Contrast that with the
  90402 corridor along Montana Avenue — remodeled homes with Sub-Zero built-ins and Thermador
  columns that need a completely different service approach. Both types of calls are routine for us.

commonProblems:
  - title: "Ice Maker Assembly Failure from Hard Water Scale"
    description: |
      LA water is hard everywhere. Santa Monica's coastal air keeps humidity elevated year-round,
      slowing evaporation inside ice maker lines and letting mineral deposits build up faster
      than they would inland.

      The water inlet valve is usually the first casualty. Calcium scale restricts flow until
      the ice maker assembly stops cycling entirely. Samsung french-door models and KitchenAid
      uprights in the 90403 zip show this pattern more than almost any other failure we see.
      Descaling the valve and clearing the fill tube usually runs under $180.

  - title: "Evaporator Coil Frost Buildup Through Worn Door Gaskets"
    description: |
      Ocean air off the Pacific is persistently humid. Buildings near Lincoln Boulevard from the
      1960s were not designed with modern gasket materials in mind.

      Worn door seals let moist air into the freezer cabinet overnight. The evaporator coil ices
      over completely, airflow stalls, and the unit stops holding temperature — but the compressor
      is usually fine. A failed defrost thermostat or a blocked defrost drain often compounds the
      problem. New door gasket plus a manual defrost of the evaporator coil typically resolves it
      for under $200.

  - title: "Condenser Fan Motor Failure in Integrated Bosch and Thermador Units"
    description: |
      Bosch and Thermador integrated freezers are common in remodeled kitchens throughout 90402.
      Almost all of them are installed flush with zero rear clearance.

      The cabinetry surrounds them on every side, the condenser fan motor has nowhere to exhaust
      heat, and it burns out early. Every August and September we get a spike in these calls from
      this exact area. The fix means pulling the unit from the enclosure — often a two-person job
      in tight spaces — replacing the fan motor, and walking the homeowner through minimum
      ventilation clearance so it doesn't happen again.

faq:
  - q: "How fast can you get to Santa Monica for freezer repair?"
    a: |
      Santa Monica is on our daily route. The 10 freeway and Lincoln Boulevard put us 20-40
      minutes from most of the area.

      Call (323) 870-4790 and same-day service is available most days. Street parking near 20th
      Street and Pico is easy. Downtown near 3rd Street Promenade adds a few minutes to find a
      spot, but it's not a problem — we carry meters and know the blocks.

  - q: "Do you repair Sub-Zero and Bosch freezers in Santa Monica?"
    a: |
      Sub-Zero built-in freezers are a regular part of our workload in 90402 and 90403.
      Condenser coil cleaning, door gasket replacement, and thermostat calibration are the most
      common jobs on those.

      Bosch integrated units usually need control board diagnostics or drain service. LG and
      Samsung show up constantly in rental units throughout the Pico neighborhood — different
      failure modes, same hard-water root cause.

  - q: "What does freezer repair cost in Santa Monica, and do you carry parts?"
    a: |
      Diagnosis is $75, applied toward the repair if you proceed.

      Most jobs — heating element replacement, thermostat swap, or clearing a blocked drain pump

      (323) 870-4790 and we'll lock in a window — usually within 2 hours for morning requests."
  - q: "Do you repair KitchenAid and Samsung double ovens?"
    a: "Both, regularly. KitchenAid double wall ovens — especially the 27-inch built-in models common in
      remodeled Garden Grove homes — come in with broken door hinge assemblies and failed bake elements.
      Samsung units, more common in newer builds near Trask Avenue and the 92843 zip, usually need control
      boards or temperature sensors replaced. We carry parts for both and quote before touching anything."
  - q: "What does a double oven repair typically cost, and how soon can you come out?"
    a: "A heating element swap or door hinge replacement typically runs $150-$250 depending on the model.
      Control board jobs land between $300-$450. We quote before touching anything. Evening slots are

title: "Garden Grove Washer Repair — Hard Water & Ranch Homes"

intro: |
  The 1960s and '70s tract homes packed along Trask Avenue and near the
  Strawberry Festival grounds tend to run Samsung or LG front-loaders that
  are 8-10 years old — prime age for drum bearing failures and drain pump
  clogs. Orange County's hard water hits 300-500 ppm in parts of 92840, and
  that mineral scale stacks up fast inside washing machine hoses and inlet
  valves. One off-balance load on cracked shock absorbers sounds like a
  bowling alley at 11pm.

localContext: |
  Most of the housing stock here is 3-bedroom ranch houses built between 1955
  and 1975, with tight laundry closets that make repairs trickier than open
  utility rooms. The 92843 zip around Westminster Boulevard has a lot of older
  Whirlpool and GE top-loaders still running — some pushing 15+ years.
  Stackable units in the denser apartment corridors near Euclid Street add
  another layer: you have to pull the dryer first just to reach the washer's
  lid switch assembly.

commonProblems:
  - title: "Standing Water After Every Cycle — Drain Pump Clogged by Mineral Scale"
    description: |
      OC tap water deposits calcium straight into the drain pump filter and
      water inlet valve over time. Samsung HE front-loaders show this as a 5E
      or 5C error — standing water that won't clear even after a reset. Usually
      it's a pump replacement or a thorough flush of the inlet valve screens.
      Either way, the fix is same-day if parts are on the van.

  - title: "Violent Spin-Cycle Shaking in Slab-Foundation Homes"
    description: |
      A top-loader bouncing hard enough to walk across the floor is almost
      always worn shock absorbers or a failing drum bearing — both common in
      Whirlpool and GE units past the 10-year mark. On slab foundations like
      most Garden Grove ranches, the vibration transmits straight through the
      floor. The spin basket gets checked for uneven wear before we condemn
      the bearing outright.

  - title: "Door Lock Errors Stopping the Drum Dead"
    description: |
      LG front-loaders in the 92840-92843 zip codes regularly throw a dE or
      CL error when the door latch assembly starts to fail — the machine
      won't spin at all as a safety lockout. Sometimes it's just the latch
      itself ($45 part), sometimes the control board lost signal from the
      door switch. Diagnosing which takes about 20 minutes on-site.

faq:
  - q: "How fast can you get to Garden Grove for washer repair?"
    a: |
      Garden Grove is a quick run down the 5 or 22 freeways from our regular
      Orange County route. Most calls in 92840 or 92843 get same-day service —
      usually on-site within 2 hours of booking. Call (323) 870-4790 to lock
      in a slot before noon and we'll almost always make it same day.

  - q: "Do you repair Samsung and LG washers in Garden Grove?"
    a: |
      Samsung and LG make up the majority of what we see here. Common jobs:
      drain pump replacements, door latch assemblies, water inlet valves,
      and control board resets. Also handle Whirlpool, GE, KitchenAid, and
      Bosch. Most standard parts are stocked on the van to avoid a second trip.

  - q: "What does washer repair cost, and is same-day service available?"
    a: |
      Diagnosis is $65 and goes toward the repair if you move forward. Most
      common fixes — drain pump, lid switch, drive belt, shock absorbers —
      run $150-$280 total depending on the brand. Evening slots are available,
      and emergency same-day bookings are accepted if you call before noon.
      Schedule at (323) 870-4790.

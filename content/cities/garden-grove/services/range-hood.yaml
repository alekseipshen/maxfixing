title: "Garden Grove Range Hood Repair — Old Ducts, Hard Water, Fixed Fast"

intro: |
  Grease doesn't lie. In Garden Grove's older neighborhoods along Garden Grove Blvd, range hoods in 1960s tract homes are running filters that were last cleaned when gas was under a dollar a gallon. That LG under-cabinet unit above a four-burner gas range — when the blower wheel gets coated thick enough, the motor overheats and shuts down. Then the whole hood smells like burned oil every time you cook. We see this weekly around 92841.

localContext: |
  The residential housing in Garden Grove runs mostly 1955–1975 construction — single-family ranch homes concentrated on the west side of the city, particularly around the Brookhurst and Magnolia corridors in zip 92840. Kitchens in these post-war builds are tight, and original plumbing and electrical rough-ins meant range hood duct penetrations were added as afterthoughts. Duct runs go straight up through dropped ceilings or jog sideways through soffits before hitting the exterior wall. Bosch and KitchenAid chimney hoods show up in the remodeled properties near Main Street; original builder-grade GE units still hang in plenty of kitchens that haven't seen a contractor since the 1980s.

  Garden Grove's mix of long-term homeowners and newer families who've upgraded recently means we see everything on the same block — a 40-year-old Whirlpool wall-mount next door to a Samsung slide-in installed last year. The older stretches along Stanton Avenue and near the Garden Grove Community Center skew toward single-story homes where the exhaust duct terminates through exterior stucco, usually through a plastic damper that stopped closing around 2010. Insects and rodent nesting in those duct runs is more common than people expect. Airflow drops, the fan strains, and the whole exhaust system becomes useless without anyone noticing until smoke stops clearing.

commonProblems:
  - title: "Blower Motor Seizure from Grease Saturation"
    description: "Orange County tap water carries mineral content from the Colorado River system — combined with cooking grease, aluminum mesh filters turn into nearly solid blocks. The blower wheel can't spin freely, the motor strains, and the thermal fuse blows to protect it. GE and LG under-cabinet hoods fail this way constantly in Garden Grove. Cleaning the filter alone won't fix it once the fuse is gone — the blower wheel itself usually needs to be pulled, cleaned or replaced, and the new fuse installed with the correct amperage rating for that specific motor model. Skip that step and just replace the fuse, and it blows again within a month."
  - title: "Duct Blockage Causing Zero Airflow Despite a Running Fan"
    description: "Many 1960s homes here have duct runs that turn 90 degrees inside a soffit before exiting through the exterior wall — that's two elbows of accumulated grease over 40 years. Bosch chimney hoods installed over these original duct paths push air into a partial blockage until the motor overloads. We rod out the duct and inspect the exterior vent cap, which is often corroded completely shut. On Garden Grove's older single-story homes, this usually means accessing the attic or removing a soffit panel — not something a homeowner can handle with a screwdriver and a Saturday afternoon."
  - title: "Control Board Failure Killing Fan Speeds and Lights"
    description: "Newer KitchenAid wall-mount hoods and some Samsung models use a digital control board rather than a simple speed switch. Heat and moisture from years of cooking degrade the solder joints. You get intermittent fan speeds, lights that flicker or go dark, and sometimes the exhaust unit locks onto high with no way to turn it down. Replacing the control board costs a fraction of a new unit. Samsung touch-panel models often show this as one specific speed setting going unresponsive — usually medium — while low and high still work. That's a board fault, not a touch-panel replacement job."


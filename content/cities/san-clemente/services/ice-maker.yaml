title: "San Clemente Ice Maker — South Coast Water & Summer Heat Repairs"

intro: |
  South Coast Water District's supply into 92672 picks up enough dissolved minerals along
  the way to steadily scale up ice maker fill valves — usually before any other part
  in the machine gives out. That KitchenAid counter-depth unit in a Shorecliffs home
  might already be running short fill cycles and dropping hollow crescents because the
  water inlet valve is losing flow. Coastal heat in summer pushes refrigerators harder
  than their specs assume, especially in kitchens without great ventilation. We cover
  San Clemente and stock parts for the brands most common out here.

localContext: |
  Talega (92673) is mostly 2000s–2010s construction — Standard Pacific and Shea homes
  that shipped with Samsung and LG French-door refrigerators, all with built-in ice makers
  now hitting the 15–20 year service mark. The older beach-side streets in 92672, near
  Avenida del Mar and down toward the pier, went through a kitchen remodel surge from
  roughly 2005 to 2015 that brought in a lot of KitchenAid and Sub-Zero built-ins. Both
  generations are showing up on our service calls now, and both fail in predictable ways
  tied to San Clemente's water supply and summer workload.

commonProblems:
  - title: "Mineral Scale Slowly Choking the Water Inlet Valve"
    description: "South Coast Water District's supply isn't the hardest in Orange County, but
      the dissolved calcium content is high enough to gradually deposit scale on the water
      inlet valve solenoid over several years of daily ice production. A partially blocked
      solenoid restricts water flow inconsistently — some fill cycles complete, most don't,
      and you end up with undersized or hollow ice cubes rather than a clean outage. Samsung
      French-door models are especially vulnerable here because their narrow-bore inlet tubing
      clogs faster than the wider inlets on KitchenAid or LG units."
  - title: "Frozen Fill Line Locking Up the Freezer Door Unit"
    description: "Marine layer humidity rolls through San Clemente's beach neighborhoods in 92672
      most nights, and that moisture finds its way into kitchen spaces where refrigerators are
      already working overtime through the summer months. When a fill cycle fails partway through,
      residual water sitting in the supply line freezes solid inside the freezer door and blocks
      the next cycle completely. LG door-mounted ice maker units see this most often — the
      exposed fill line ices over when the thermostat cycles inconsistently across a few days,
      and production stops with no error code to show for it."
  - title: "Optical Sensor Drift in Sub-Zero and KitchenAid Built-Ins"
    description: "Sub-Zero refrigerators installed during Talega's early 2000s build-out are now
      20-plus years into service, and the ice maker's optical sensor is one of the first
      components to drift out of spec. When the sensor fails, the machine reads a full bin
      even when it's empty — production shuts down completely and the unit looks fine from
      the outside. KitchenAid built-ins fail the same way, though their ice maker module is
      a bolt-on swap we carry in the van. Sub-Zero's sensor assembly requires proprietary
      calibration tooling after replacement, so this isn't a parts-store job."

faq:
  - q: "How fast can you get to San Clemente for ice maker repair?"
    a: "From our Orange County base we're in San Clemente within 60–90 minutes depending on
      I-5 through San Juan Capistrano — that corridor can add 20 minutes during afternoon
      commute hours, so morning calls get the fastest arrival. Same-day slots are usually
      open. Call (323) 870-4790 and we'll lock in a window."
  - q: "Do you repair KitchenAid, Sub-Zero, Samsung, and LG ice makers?"
    a: "Yes — all four show up regularly on our San Clemente calls. KitchenAid built-ins most
      often need a water inlet valve or ice maker module swap. Sub-Zero requires proprietary
      parts we stock in advance. Samsung French-door units usually fail at the inlet valve
      or optical sensor. LG door-mounted units typically have a frozen fill line or
      thermostat issue driving the problem."
  - q: "What does ice maker repair cost, and is same-day service available?"
    a: "Diagnostics run $85–95 and credit toward the repair. A water inlet valve replacement
      typically lands between $150–220 all-in. Sensor or module repairs on Sub-Zero and
      KitchenAid built-ins can run higher — we quote before opening anything up. Same-day
      service is available Monday through Saturday. Call (323) 870-4790 before noon or
      schedule online for same-day availability."
title: "San Clemente Wine Cooler Repair — Salt Air, Hard Water, Fixed Fast"

intro: |
  Talega's kitchen builds in 92673 almost always include a Bosch or KitchenAid wine cooler
  integrated into the cabinetry — standard equipment for the neighborhood now. Salt air off
  the Pacific doesn't get enough credit for what it does to door gaskets and condenser
  components over time. Combine that with San Clemente's hard municipal water supply, and
  mineral scale inside the cooling circuit becomes a recurring problem, not a one-off event.
  The calcium doesn't just sit there — it coats evaporator fins, restricts fan blade rotation,
  and eventually forces the compressor to work harder than the manufacturer ever intended.

localContext: |
  The older Spanish Colonial homes near El Camino Real and Avenida Del Mar in 92672 have
  compact kitchens — undercounter wine coolers often occupy gaps that barely clear minimum
  ventilation specs. Talega's planned development in 92673 runs the opposite: full-size
  built-in columns integrated into cabinetry renovations from the mid-2000s onward. Both
  housing types show up regularly in our San Clemente calls, and each presents different
  access challenges when it's time to pull a unit for compressor or thermistor work.
  The coastal humidity along Calafia Beach and the bluffs above T-Street adds another layer —
  metal condenser fins oxidize faster here than they would 10 miles inland, which tightens
  the service interval on anything running near an exterior wall.

commonProblems:
  - title: "Hard Water Scale Choking Evaporator Fan Airflow"
    description: |
      San Clemente pulls from a supply that tests consistently hard, and calcium deposits
      accumulate on evaporator fan blades faster than most owners notice. When airflow drops,
      the unit can't shed heat and the cabinet temperature climbs. Bosch undercounters are
      particularly prone — the fan housing design traps mineral buildup rather than shedding
      it. Thorough cleaning restores airflow; if the motor has been straining for months,
      replacement is usually the cleaner call. On some Bosch models the symptom shows up as
      an E4 error or an unsteady temperature readout before the fan fully seizes — don't
      ignore either signal.
  - title: "Compressor Running Nonstop Without Reaching Target Temperature"
    description: |
      A compressor cycling continuously and still missing the set point usually means one of
      two things: a failed thermistor sending bad temperature readings to the control board,
      or a degraded door gasket letting warm coastal air infiltrate the cabinet. Sub-Zero wine
      columns in Talega kitchens are durable machines, but after 8–10 years the thermistor
      drifts. Swapping it is a one-hour fix; a new door gasket adds maybe 30 minutes more.
      Left alone, a compressor running at full load indefinitely will eventually overheat and
      trip the overload protector — at that point the repair cost jumps considerably, so
      early diagnosis matters.
  - title: "Vibration and Low-Frequency Hum From Built-In Cabinet Installations"
    description: |
      KitchenAid wine coolers are engineered to run quietly with proper clearance and
      ventilation. Retrofit them inside a closed cabinet with undersized gaps and the
      compressor vibration resonates through the cabinetry. Worn rubber isolation mounts make
      it worse. We check mounting hardware and clearances before ordering any parts — half
      the time the fix is mechanical, not electrical, and the compressor itself is fine.
      In the 92673 new-builds where cabinetry was done as part of a remodel, the builder's
      trim kit sometimes leaves less than the required side clearance, which compounds the
      problem significantly.

faq:
  - q: "How fast can you get to San Clemente for Wine Cooler repair?"
    a: |
      We run a regular route down I-5 through South Orange County. From our nearest tech,
      addresses in 92672 and 92673 are typically 45–60 minutes out — same-day service is
      standard. Call (323) 870-4790 to get on today's schedule; evening slots are available
      most weekdays.
  - q: "Do you repair Bosch and Sub-Zero wine coolers specifically?"
    a: |
      Yes — those two brands are the most common calls we get in South OC. Bosch undercounter
      units usually need evaporator fan cleaning or door gasket replacement from scale buildup.
      Sub-Zero wine columns more often need thermistor calibration or a compressor assessment.
      We stock parts for both and carry the specialized tools Sub-Zero built-ins require.
      KitchenAid integrated units come up regularly too, mostly vibration and control board
      issues — same-day diagnosis is the norm on those.
  - q: "What does wine cooler repair typically cost and how long does it take?"
    a: |
      Most repairs — gasket swap, thermistor replacement, fan cleaning — finish in a single
      visit. We diagnose first, quote before touching anything. Same-day turnaround is typical
      when parts are in stock. For a fast estimate or to book an emergency slot, call
      (323) 870-4790 or schedule online. If the compressor needs replacement on a higher-end
      unit, we'll give you an honest comparison against replacement cost so you're not sinking
      money into something that doesn't make financial sense.
title: "San Clemente Wine Cooler — Coastal Built-Ins Repaired Same Day"

intro: |
  Spanish tile rooftops and open-plan kitchen renovations define the residential character from downtown San Clemente to Forster Ranch. Bosch dual-zone units and Sub-Zero undercounter models get built into cabinetry during those kitchen remodels — and when they stop cooling correctly, they're not a simple swap. Salt air off the Pacific accelerates door gasket degradation, corrodes condenser contacts, and introduces humidity levels that can ice up an evaporator coil in a matter of weeks. These units work harder here than anywhere further inland, and they fail in specific ways. The condenser fan in a coastal installation has to push through air that carries salt particulate — fan blade deposits build up gradually and cut airflow before any warning light appears.

localContext: |
  Homes in 92673 around Talega and Rancho San Clemente went up between the late 1990s and mid-2000s. Wine coolers built into those original kitchen layouts are now hitting 18-25 years of service. The compressor and thermostat from the original install were never rated for the ambient heat a south-facing kitchen generates during an Orange County July. Older coastal stock in 92672, near Avenida Pico and the downtown canyon streets, presents a different challenge — undercabinet clearance so tight that a KitchenAid or LG unit barely fits with the door removed. Parking the service van on those narrow canyon roads near El Camino Real adds time to any call; we account for it when setting the appointment window so the tech isn't rushing the job.

commonProblems:
  - title: "Door Gasket Failure Driven by Marine Humidity"
    description: |
      Salt-laden coastal air stiffens the door gasket and causes it to pull away from the frame — usually starting at the bottom corners. Warm air seeps in steadily, forcing the compressor to cycle harder and longer than it's rated for. Bosch dual-zone units often throw a high-temp warning on the display before the homeowner notices that bottles on the upper shelf are warmer than the set point. Replacing the gasket early prevents premature compressor burnout. The replacement itself takes about 30 minutes on most Bosch and KitchenAid models — the part is stock, and the new seal restores the door's thermal barrier immediately. Skipping it means the compressor runs hot until it fails outright, which turns a $90 gasket job into a $400 compressor call.
  - title: "Evaporator Coil Icing in Summer Heat on Inland Homes"
    description: |
      South-facing kitchens in Talega and Rancho San Clemente get significant heat load during July and August — especially in homes with tight clearance around the wine cooler cabinet. The evaporator coil runs continuous frost cycles and eventually ices solid. The compressor keeps running but never recovers the set temp. LG and Samsung undercounter models show this most clearly — the display reads 6-8 degrees above target while the coil underneath is completely frozen. The fix involves a controlled defrost, checking the defrost timer or defrost heater circuit depending on the model, and inspecting the thermostat calibration. If the cabinet clearance is the root cause, we flag that during the visit so it doesn't repeat next summer.
  - title: "Vibration Rattle from Frame Movement in Older Homes"
    description: |
      Wood frame movement in older San Clemente homes — particularly in 92672 near El Camino Real — shifts cabinet alignment over years of settling. A built-in wine cooler that was perfectly level at install can be off by a quarter-inch a decade later. The compressor mounting bolts start vibrating against the cabinet floor. Sometimes the condenser fan blade clips an insulation panel or wiring harness, producing a low rattle that gets distinctly louder at night. Diagnosis means pulling the unit partially from the cabinet to access the compressor compartment and checking the fan blade clearance directly. Loose mounting hardware is a fast fix; a chipped or warped fan blade requires a replacement part, typically ordered and installed within one follow-up visit.


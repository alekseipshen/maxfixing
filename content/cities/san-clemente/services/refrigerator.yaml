title: "San Clemente Refrigerator — Talega to the Pier, Same-Day"

intro: |
  Talega homes in 92673 — most built between 2002 and 2010 — are hitting that
  15-year window where KitchenAid counter-depths and Samsung french-doors start
  showing strain on the compressor and ice maker assembly. Marine layer humidity
  rolling in off the coast pushes moisture into condenser coils and water lines
  faster than anything you'd see 20 miles inland. Call (323) 870-4790 and we
  can usually get to San Clemente the same day.

localContext: |
  The older beach-side blocks in 92672 — especially the streets closest to the
  San Clemente Pier — have 1960s and 1970s bungalows with tight kitchens where
  getting a full-size refrigerator out for service requires some planning. Rancho
  San Clemente and upper Talega run Sub-Zero and Thermador built-ins that need
  brand-specific tools most general shops don't stock. Hard water here averages
  around 300 ppm — that mineral load hits ice makers and water dispensers hard
  over time.

commonProblems:
  - title: "Compressor Wear on Talega's 15-Year-Old Samsung and KitchenAid Units"
    description: |
      The 2004-2011 Samsung and KitchenAid models common throughout 92673 are
      squarely in compressor-failure territory. Symptoms: clicking or buzzing from
      the rear, temps creeping above 45°F, condenser fan running nonstop. We carry
      direct-replacement compressors for both brands and can usually complete the
      swap in a single visit.

  - title: "Evaporator Coil Ice Buildup Driven by Coastal Humidity"
    description: |
      Every time a door opens in a 92672 beachside home, humid air gets in. Over
      months that moisture turns into heavy frost on the evaporator coil, blocking
      airflow and warming the fresh-food compartment. The defrost heater or defrost
      timer is almost always the failed component. Bosch and Sub-Zero units in
      coastal zip codes see this more often than most — and Sub-Zero's defrost
      heater placement makes it a two-technician job on some configurations.

  - title: "Ice Maker Failure from Hard Water Scale in the Inlet Valve"
    description: |
      San Clemente tap water at ~300 ppm hardness clogs the water inlet valve and
      fill tube of an ice maker within a couple of years if it's never been flushed.
      LG french-door refrigerators are especially susceptible — they'll throw an
      error code (typically CF or IS) before stopping ice production entirely. We
      clear the mineral deposits, replace the inlet valve, and do a full test cycle
      before leaving.

faq:
  - q: "How fast can you get to San Clemente for refrigerator repair?"
    a: |
      We run a regular Orange County route — usually 45 to 60 minutes from
      dispatch. Same-day appointments are available most days. Call (323) 870-4790
      or schedule online; morning slots go fast but evening availability is
      typically open.

  - q: "Do you repair Sub-Zero and Thermador refrigerators in San Clemente?"
    a: |
      Yes. Sub-Zero built-ins and Thermador columns show up regularly in the
      higher-end Talega and Rancho San Clemente properties. We also service
      KitchenAid, Samsung, LG, and Bosch. For Sub-Zero we stock the door gasket
      and condenser fan components that fail most often on the 48-inch models.

  - q: "What does refrigerator repair cost in San Clemente, and how long does it take?"
    a: |
      Diagnostic is $65 — credited toward the repair if you move forward. Most
      jobs (thermostat, drain pump, ice maker assembly replacement) land between
      $150 and $350 all-in. Compressors run more; we'll quote you a flat number
      before we start. Emergency same-day calls are available — just mention it
      when you call.

title: "San Clemente Dryer — Coastal Air, Fast Repairs in 92672"

intro: |
  Talega subdivisions and the Spanish-style homes near the pier both run a lot of LG and Bosch laundry pairs — and the marine layer that settles over this stretch of south OC most mornings means dryers work harder than inland units just to pull moisture out of fabric. That LG running two cycles where one used to suffice? Usually a moisture sensor coated in lint film. Coastal humidity accelerates buildup and belt wear in ways that don't show up in drier climates.

localContext: |
  Homes in 92672 near the beach tend to be 1960s–1980s ranch and cottage styles with tight utility closets — getting a dryer out for drum bearing access sometimes means moving the washer into the hallway first. Newer Talega developments in 92673 have stacked units in dedicated laundry rooms, which limits airflow to the exhaust vent. Salt air here oxidizes metal components faster than most OC zip codes. Either setup has its own access headache.

commonProblems:
  - title: "Dryer Takes Two Cycles — Lint-Clogged Exhaust in Beach-Adjacent Homes"
    description: "Coastal humidity makes lint clump and stick inside exhaust ducts faster than in dry inland areas. The blower wheel gets coated, restriction builds, and suddenly two full cycles aren't enough for one load. Samsung and LG models throw venting error codes when airflow drops below threshold — that's usually the first sign homeowners notice before calling."
  - title: "Thermal Fuse Blown After Back-to-Back Loads"
    description: "Restricted airflow from lint buildup forces the dryer to overheat, and the thermal fuse blows to prevent fire — it's a one-shot device, not resettable. Bosch and KitchenAid units in Talega homes see this when exhaust runs are long and uncleaned. Replacing the fuse without clearing the restriction just burns out the next one within weeks."
  - title: "Drum Not Spinning — Drive Belt Failure on Aging Units"
    description: "A cracked or snapped drive belt leaves the motor running with the drum stationary — nothing moves, clothes sit wet. LG front-load dryers in 92672, many installed during the last round of renovations on beach-adjacent homes, are hitting that 10-year failure window now. Belt replacement requires full drum disassembly but finishes same visit."

faq:
  - q: "How fast can you get to San Clemente for a dryer repair?"
    a: "We run down the 5 into San Clemente daily. Most calls in 92672 and 92673 get same-day service, typically within 2-3 hours of booking. Call (323) 870-4790 or schedule online to lock in a slot — evening appointments are available."
  - q: "Do you repair Bosch and LG dryers out here?"
    a: "Yes — Bosch, LG, Samsung, and KitchenAid are the brands we see most in this area. Common jobs include heating element swaps on LG, moisture sensor cleaning on Samsung, and control board failures on Bosch condensation models."
  - q: "What does a dryer repair cost, and how quickly can you come out?"
    a: "Diagnostics run $65–85 and apply toward the repair. Most jobs — thermal fuse, drum roller, drive belt — wrap up same visit. For urgent calls, reach us at (323) 870-4790; emergency slots are available and we're usually on-site within 2 hours."

title: "San Clemente Dishwasher — Coastal Hard Water & Drain Specialists"

intro: |
  Talega and Forster Ranch homes were built in the 2000s with Bosch and KitchenAid
  dishwashers standard in most kitchen packages — solid machines that are hitting
  their first serious service window right now. San Clemente's Municipal Water
  District supply runs around 350–400 ppm TDS at the tap, and that mineral load
  calcifies spray arm jets and inlet valve screens faster than most homeowners
  expect. Cloudy dishes and E24 drain errors are the two most common calls we get
  from the 92673 zip.

localContext: |
  Most of 92672 and 92673 is newer Spanish-colonial tract construction — Talega,
  Marblehead, Sea Summit near the bluffs. Tight under-counter clearances in the
  townhouse layouts mean panel-ready Bosch 800 Series units need the decorative
  door panel pulled before any diagnostic work even starts. Down closer to Avenida
  Del Mar and the older beach-side streets, the kitchens run GE and Frigidaire
  built in the 1980s — totally different parts inventory, but both service areas
  get the same hard water abuse.

commonProblems:
  - title: "Mineral scale blocking spray arms and starving the wash cycle"
    description: "San Clemente's water deposits calcium carbonate straight into spray arm
      jets and around the inlet valve screen within a few years. Lower rack comes
      out dirty first — that's the lower spray arm losing pressure. Descaling
      alone won't fix a partially blocked inlet valve; low flow into the tub means
      the whole wash cycle underperforms regardless of how clean the arm looks."
  - title: "E24 drain fault — clogged filter or worn drain pump"
    description: "Bosch dishwashers in Talega and Forster Ranch throw E24 when the drain
      pump can't clear standing water fast enough. Usually it's the filter basket
      packed with debris. Sometimes it's the drain pump itself — grinding or
      humming without moving water is the tell. Either way, leaving it sitting
      means the float switch triggers a lockout on the next cycle."
  - title: "Detergent dispenser door stuck on KitchenAid and Samsung units"
    description: "The detergent dispenser door uses a spring-loaded latch that corrodes in
      coastal humidity. KitchenAid and Samsung models both see this — door stays
      closed mid-cycle, detergent never releases, dishes come out greasy. Replacing
      the dispenser assembly and the door latch mechanism together is the right
      fix; they wear as a matched pair and swapping just one usually means a
      callback in six months."

faq:
  - q: "How fast can you get to San Clemente for a dishwasher repair?"
    a: "Service routes through 92672 and 92673 run most weekdays. From South OC
      dispatch, San Clemente is typically 20–30 minutes out. Call (323) 870-4790
      and same-day appointments are usually available, including evening slots
      for working households."
  - q: "Do you repair Bosch and KitchenAid dishwashers specifically?"
    a: "Both are the most common brands on service calls in this area — Bosch
      800 Series panel-ready units in the newer builds, KitchenAid KDFE and KDTE
      series in mid-range remodels, plus LG and Samsung throughout. Common boards,
      pumps, and spray arm assemblies for all four ride on the van."
  - q: "What does a dishwasher repair typically cost, and how does the process work?"
    a: "Drain pump replacement runs $180–$280 depending on brand. Spray arm and
      inlet valve service usually comes in under $150. Diagnosis happens on-site
      and a flat price is quoted before any parts are touched. Emergency same-day
      slots are open most days — call (323) 870-4790 or schedule online to lock
      in a window."

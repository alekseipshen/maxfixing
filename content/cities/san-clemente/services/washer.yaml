title: "San Clemente Washer Repair — Coastal Hard Water Kills Machines Fast"

intro: |
  Hard water in San Clemente runs around 350-450 ppm — close to what you see in Laguna Niguel,
  and it does a number on front-loaders over time. That KitchenAid or Bosch 500 series sitting
  in a Talega home? The water inlet valve and drum bearings take the worst of it. We cover
  92672 and 93673 daily, usually on-site within 2 hours of your call.

localContext: |
  Talega's planned community (built mostly 2000-2010) is full of laundry closets with stacked
  units and tight utility access — more complicated than a standard side-by-side setup in a
  garage. Older homes near downtown San Clemente and the 92672 zip, some dating back to the
  1950s and 60s, often have original plumbing that creates pressure issues for modern washers.
  Las Palmas and Marblehead track homes lean heavily toward LG and Samsung front-loaders.

commonProblems:
  - title: "Mineral Scale Clogging the Water Inlet Valve (Hard Water Problem)"
    description: "San Clemente's calcium-heavy water coats the water inlet valve screens over 2-3
      years, slowing fill times or stopping them entirely. Bosch front-loaders throw an E17 or
      E23 error when restricted flow triggers the flood protection. Replacing the inlet valve
      valve assembly usually runs 45-60 minutes and fixes it permanently — until scale builds
      again without a filter."
  - title: "Drum Bearing Failure in High-Use Households"
    description: "Loud rumbling during spin cycles is almost always the drum bearing going out —
      especially on LG and Samsung machines past the 5-year mark. Ignore it and the spin basket
      shaft damages the rear tub, turning a $180 bearing job into a $600+ repair or replacement
      decision. We see this constantly in Talega homes with large families running 8-10 loads
      a week."
  - title: "Drain Pump Failure Causing Standing Water"
    description: "Standing water after a cycle usually points to a clogged or failed drain pump.
      KitchenAid top-loaders accumulate lint and small debris in the pump filter — something
      most owners never clean. Samsung front-loaders show an ND or 5E error code when the pump
      motor burns out. Drain pump replacement is a same-day fix; call (323) 870-4790 and we
      can usually get there before the mildew smell sets in."

faq:
  - q: "How fast can you get to San Clemente for washer repair?"
    a: "From our Orange County route, San Clemente is typically 25-35 minutes depending on the
      5 freeway. Same-day slots are available most weekdays — call (323) 870-4790 before noon
      and there's a good chance we're at your door by late afternoon. Evening appointments
      available Tuesday through Thursday."
  - q: "Do you repair Bosch and LG front-loaders specifically?"
    a: "Both are bread-and-butter machines for us in this area. Bosch 500 and 800 series, LG
      TurboWash, Samsung FlexWash — we stock common parts for all three. KitchenAid top-loaders
      too. If your machine is throwing a specific error code, mention it when you call and we
      can confirm parts availability before the visit."
  - q: "What does washer repair cost in San Clemente, and is there a diagnostic fee?"
    a: "Diagnostic is $75, applied toward any repair. Most drain pump and inlet valve jobs land
      between $150-$250 parts and labor. Drum bearing replacements run higher — $250-$400
      depending on the model. Emergency same-day service carries no extra surcharge. Schedule
      online or call (323) 870-4790 for an honest estimate before we start anything."

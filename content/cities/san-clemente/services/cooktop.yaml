title: "San Clemente Cooktop — Salt Air Repairs, Same-Day Service"

intro: |
  The hillside homes in Talega and the Spanish colonial builds down near Avenida del
  Mar share one problem nobody talks about: salt air off the Pacific corrodes ignition
  components faster than inland kitchens. That Bosch five-burner gas cooktop in your
  92673 kitchen clicks all day but never lights? Nine times out of ten it's the spark
  electrode, not the gas line. We drive the I-5 South OC corridor daily and can usually
  be in San Clemente within two hours of your call.

localContext: |
  Housing in San Clemente splits into two very different repair scenarios. The Shorecliffs
  and Pier Bowl areas have 1950s and 1960s Spanish ranch homes — original cabinetry, tight
  countertop cutouts, and cooktops that were retrofitted rather than installed from the start.
  Getting the old unit out sometimes takes longer than the actual repair. Up in 92673, the
  Talega master-planned community built through the early 2000s standardized on KitchenAid
  and Thermador built-in cooktops as part of their kitchen packages. Those units are now
  15-20 years old, which puts them squarely in control board and igniter failure territory.
  San Clemente's hard water — calcium carbonate levels well above the regional average —
  also accelerates mineral scale buildup inside burner ports and around heating elements on
  electric models. That's a factor inland cities simply don't deal with at the same rate.

commonProblems:
  - title: "Salt Air Corrosion Killing the Spark Electrode on Coastal-Facing Homes"
    description: |
      Homes within a mile of the San Clemente shore — Shorecliffs, the streets off El
      Camino Real near the pier — see spark electrode corrosion in 7-10 years, sometimes
      faster. The electrode tip oxidizes, the wire harness cracks at the connector, and the
      spark module keeps firing but never produces a reliable arc. Bosch cooktops are the
      most common victim we see, followed by KitchenAid. Replacing the electrode and
      reseating the harness solves it permanently; costs about $90-$140 in parts. On some
      Bosch models the ignition switch itself corrodes internally and needs replacement
      alongside the electrode — we check both before closing out the job.
  - title: "Cracked Ceramic Glass on LG and Samsung Induction Cooktops"
    description: |
      Newer construction in 92673 leans heavily toward induction — LG and Samsung slide-in
      models in particular. Tempered ceramic glass can crack from thermal shock or from
      setting a heavy cast-iron pan down too fast. A hairline crack along the induction
      coil zone isn't cosmetic: it can arc to the coil beneath and trip the internal fuse
      or fry the control board. Full glass panel replacement is the only fix — patching
      doesn't hold and creates a shock risk. LG units will throw an F9 or LE error code
      when the coil detects an abnormal current path through a compromised panel. If you're
      seeing that code and the glass looks intact, run your hand slowly across the surface
      under light — hairline cracks are easy to miss until they're pointed out.
  - title: "Gas Valve Pressure Drop Causing Uneven Flame on Older Talega Units"
    description: |
      Thermador and KitchenAid gas cooktops installed in early Talega construction around
      2001-2004 are now showing gas valve wear. The symptom is a flame that's strong on
      one side of the burner and nearly out on the other, even with a clean burner cap.
      Hard San Clemente water also clogs the burner ports with mineral scale — scrubbing
      the ports fixes surface buildup, but a degraded gas valve needs full replacement
      before the unit is safe to use daily. On Thermador Pro Harmony models, the gas
      valve sits behind the front fascia and requires removing the burner assembly
      completely to access. It's a two-hour job minimum, but the part is reliable once
      replaced — we haven't seen a comeback on a gas valve swap in this zip code yet.

faq:
  - q: "How fast can you get to San Clemente for a cooktop repair?"
    a: |
      We run I-5 through South OC every day. From our nearest tech, Shorecliffs and Talega
      are typically 30-45 minutes out. Call us at (323) 870-4790 — same-day slots are usually
      available, and we hold evening appointments for jobs that come in after noon.
  - q: "Do you repair Bosch, Thermador, and KitchenAid cooktops in San Clemente?"
    a: |
      All three are bread-and-butter for us in this part of Orange County. On Bosch, we
      most often replace spark modules and igniter harnesses. Thermador built-ins usually
      need gas valve service or burner cap cleaning. KitchenAid ceramic cooktops come in
      for control board failures and surface cracks. We stock parts for all three on the van.
  - q: "What does a cooktop repair cost in San Clemente, and how does the process work?"
    a: |
      Diagnostic visit is flat-rate — we identify the failed component, price the repair
      on-site, and you decide before any work starts. Igniter and electrode jobs typically
      run $120-$200 total. Control board replacements on Bosch or LG induction units land
      $280-$420 depending on part availability. Gas valve swaps on Thermador models run
      $220-$350 including labor. Emergency same-day calls are available; most appointments
      get a technician to you within two hours. Schedule online or call (323) 870-4790
      directly — if you're in 92672 or 92673, we can usually confirm a same-day window
      before you hang up.
title: "Irvine Dryer Repair — Master-Planned Homes, Real-World Fixes"

intro: |
  Turtle Rock condos near 92603 pack laundry closets into spaces so tight the dryer exhaust
  duct makes a 90-degree turn before it's even two feet long. That sharp bend is where lint
  collects, and it's usually what kills a thermal fuse prematurely. Saw it last month in an LG
  DLE3500 — homeowner thought the machine was done. Cleaned the duct, swapped the fuse, back
  running same day.

localContext: |
  Irvine Company-built homes across 92620 and 92618 range from late-1980s Northwood tract
  houses to Portola Springs builds from the mid-2000s. Older Northwood units often have
  original laundry setups — tight alcoves, flexible foil ducting that collapses over time.
  Newer Great Park neighborhood homes stack Bosch or LG units in upstairs hallway closets,
  making drum access a two-person job without the right tools.

commonProblems:
  - title: "Thermal Fuse Failure from Crushed or Kinked Exhaust Ducts"
    description: "Flexible foil duct behind dryers in Irvine's built-in laundry closets
      collapses under the weight of the machine being pushed back. Airflow drops, the heating
      element overheats, and the thermal fuse blows as a safety cutoff. Samsung electric
      dryers — especially the DV series — are frequent victims. No heat at all is usually
      the first symptom."
  - title: "Worn Drum Rollers Causing Loud Thumping During Every Cycle"
    description: "That rhythmic banging every rotation is almost always drum rollers that
      have flattened on one side from sitting idle too long — common in vacation homes and
      secondary units near UCI. LG and Bosch front-loaders both use similar roller designs.
      Ignoring it long enough and the drum shaft wears too, which turns a $80 repair into
      a $300 one."
  - title: "Gas Valve Igniter Failure in Older Irvine Tract Homes"
    description: "Many Northwood and Westpark homes still have the original gas dryer
      connections. The gas valve igniter on a Maytag or Whirlpool gas dryer typically lasts
      8-12 years before the coils fail to open the valve. Dryer runs, tumbles, but produces
      zero heat — cycle after cycle of damp clothes. Orange County hard water doesn't help;
      mineral deposits on the igniter assembly accelerate wear."


title: "Irvine Washer Repair — Hard Water & Drum Failures Fixed Fast"

intro: |
  Stacked LG front-loaders in Woodbury townhomes and Samsung units crammed into
  Quail Hill laundry alcoves share one persistent enemy: Irvine Ranch Water District
  water, which typically tests 300–350 ppm calcium hardness. That mineral load
  quietly calcifies water inlet valves and clogs drain pump housings over 18–24
  months. We cover all of Irvine from our South OC route — same-day slots available
  most weekdays, call (323) 870-4790.

localContext: |
  Irvine's master-planned villages — Woodbury, Northwood, Turtle Rock — were built
  mostly between 1990 and 2015. Laundry closets in 92620 condos run tight: stacked
  configurations, 2-inch side clearances, sometimes the original flexible drain hose
  that shipped with the machine and has never been swapped. Zip code 92618 (Great Park
  area) has a lot of newer construction with Bosch Serie 800 front-loaders and LG
  WashTower units tucked into utility niches.

commonProblems:
  - title: "Water Not Draining — Mineral-Clogged Drain Pump Impellers"
    description: "Hard water scale accumulates inside the drain pump impeller chamber
      over time, slowing or fully blocking drainage. LG front-loaders throw an OE
      error code when flow drops below threshold. We stock replacement drain pump
      assemblies for LG and Samsung on the truck, so most fixes happen in one visit
      without waiting on parts."
  - title: "Excessive Vibration on Spin Cycle"
    description: "Worn shock absorbers are usually the culprit — not the drum bearing,
      which homeowners commonly assume first. Concrete slab foundations in Irvine's
      newer builds transmit every vibration straight through the floor. A failing
      shock absorber on a Bosch WAT series sounds like a bowling ball loose inside
      the utility closet during the 1000 RPM spin cycle."
  - title: "Door Lock Failure and dE or F5 Error Codes"
    description: "Front-load door latch assemblies use a thermal actuator that
      degrades after several hundred heat cycles. Samsung units throw dE; LG throws
      F5. Both mean the door latch assembly can no longer confirm a sealed door before
      the cycle starts. Replacement parts run $35–60; the job takes under an hour once
      we have clear access to the machine."


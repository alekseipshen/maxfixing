title: "Irvine Wine Cooler Repair — Built-In Units, Same-Day Service"

intro: |
  The Great Park neighborhoods around 92618 have seen a wave of new construction — and
  a lot of those homes came with built-in wine coolers already spec'd by the builder.
  A Bosch 30-bottle dual-zone unit running warm in a Portola Springs kitchen is a
  different animal than a freestanding unit; access is tight, and the compressor sits
  behind a fixed panel. We cover all of Irvine, usually there within 2 hours of your call.

  Orchard Hills and Shady Canyon — different story. Larger custom builds, often
  Sub-Zero 427 wine columns integrated into full butler's pantries. Those take longer
  to diagnose because the control board isn't where you'd expect it.

localContext: |
  Irvine's master-planned communities from Woodbridge to Quail Hill skew toward late
  1990s and 2000s builds — layouts that often included dedicated wine storage nooks in
  kitchen islands or butler's pantries. Zip codes 92603 and 92620 are packed with these
  setups.

  Sealed cabinet designs mean heat has nowhere to go.

  That puts serious strain on the condenser fan and thermostat when July temps push into
  the low 90s. Woodbury and Stonegate neighborhoods in 92620 see this constantly — newer
  homes with tight cabinetry tolerances where even a 2mm warp in the door gasket frame
  throws off the whole seal. Sand Canyon Road corridor in 92603, closer to the Irvine
  Spectrum, has a stretch of 2004-2010 custom builds where Sub-Zero and Thermador columns
  were installed during original construction — most of those units are now hitting
  compressor-fatigue territory.

  Northpark (92606) has a mix of 2002-2008 builds where the original KitchenAid units
  are hitting the 15-year mark. Compressor fatigue and dried-out door seals — not a
  question of if, but when.

  The UCI Research Park corridor along Jamboree has a different mix: condo conversions
  and smaller townhomes with 24-inch undercounter units from LG and Samsung. No side
  clearance, and the parking situation on Harvard and Michelson makes hauling tools
  interesting. Over in Turtle Rock near 92604 — older hillside homes off Turtle Rock
  Drive — we see a lot of freestanding units retrofitted into cabinetry that wasn't
  built for them. Ventilation is always the problem there.

  92614 along the Culver corridor tends to be early-2000s multifamily, mostly LG and
  Samsung undercounter units. Repair access is its own puzzle in those complexes.

commonProblems:
  - title: "Temperature Creeping Up — Usually the Condenser Fan Motor"
    description: |
      In Irvine's sealed built-in installations, the condenser fan motor is the first
      thing to go. When it slows or seizes, heat builds up around the compressor and the
      unit stops hitting its target temp. We see this constantly on Sub-Zero 424 series
      wine columns in Turtle Rock — the fan assembly is a straightforward swap, but
      requires fully pulling the unit from the cabinetry first.

      A warm upper zone while the lower zone holds temp is the classic symptom.

      On dual-zone Bosch units, the upper evaporator coil can ice over independently
      from the lower — that's a different repair path than just swapping the fan. Don't
      let anyone quote you a compressor replacement until the fan motor and evaporator
      have both been ruled out. That misdiagnosis costs homeowners real money.

  - title: "Vibration Noise Rattling Through the Cabinet Run"
    description: |
      Compressor vibration in a freestanding unit is annoying. In a built-in, it
      resonates through the whole cabinet run. Worn vibration dampeners or a loose
      compressor mounting bracket are usually the culprits — common on KitchenAid
      46-bottle models around the 5-7 year mark. A rattling unit in a quiet Irvine
      kitchen at midnight is not subtle.

      Sometimes it's simpler: a bottle touching the back wall, or a loose shelf clip
      resonating at a specific compressor RPM. Worth eliminating the obvious before
      assuming it's mechanical. We check both.

  - title: "Moisture Inside the Cabinet — Door Gasket Failing"
    description: |
      A failing door seal lets warm air sneak in. The temperature sensor then reads
      ambient instead of interior air, the compressor runs nonstop trying to compensate,
      and moisture pools on the lower shelf. We replace door gaskets on Liebherr and
      Bosch units regularly across 92612 and 92614 — it's a repair that's easy to ignore
      until a bottle of Pinot gets ruined.

      The condensation pattern matters for diagnosis. Water pooling on one side of the
      lower shelf usually means the gasket is failing at a corner joint, not the full
      perimeter. That changes what parts get ordered and how long the repair takes.

faq:
  - q: "How fast can you get to Irvine for wine cooler repair?"
    a: |
      Most Irvine calls get a same-day slot. We run a route through the 405/5 corridor
      daily — from the Spectrum area up through Woodbridge and into north Irvine near
      92620. Call (323) 870-4790 and we'll give you an exact arrival window, not a
      4-hour guessing game. Evening slots available most weekdays if daytime doesn't work.

  - q: "Do you repair Sub-Zero and Bosch wine coolers in Irvine?"
    a: |
      Both, regularly. Sub-Zero wine columns — the 424 and 427 series — need specific
      tools for evaporator coil access. Bosch dual-zone units have a distinct control
      board layout that trips up general repair shops. We also handle Liebherr and
      KitchenAid. Have your model number ready when you call.

      The Sub-Zero 427 has a known thermistor drift issue after 8-10 years — it reads
      colder than actual interior temp, so the compressor short-cycles and the unit
      never stabilizes. Easy to misdiagnose as a refrigerant problem. It's not.

  - q: "What does a wine cooler repair typically cost, and how quickly can you come?"
    a: |
      A door gasket replacement runs $150-200. A condenser fan motor swap is usually
      $220-290. Compressor replacement on a premium Sub-Zero or Liebherr is where costs
      climb significantly — worth a diagnostic conversation before committing to parts.
      Call (323) 870-4790 for a same-day appointment; no trip fee if you book the repair
      on the spot.
title: "Irvine Dishwasher Repair — Hard Water & Bosch Specialists"

intro: |
  Woodbridge and Northwood homes built in the '80s and '90s are hitting the age where hard water from the Colorado River aqueduct has taken a real toll on dishwashers. That Bosch 300 Series throwing an E24 code? Usually a clogged drain pump or packed filter housing — not the control board everyone fears. We run calls across 92604 and 92620 constantly and can usually get there same-day.

localContext: |
  Most of Irvine's housing stock dates from the 1970s through 2000s — Irvine Company master-planned communities with tight kitchen layouts and nearly identical cabinet configurations across entire neighborhoods. Portola Springs in 92618 has newer construction where KitchenAid and Samsung dishwashers were installed as builder upgrades. Older Quail Hill units in 92603 are still running original machines, some pushing 18-20 years and well overdue for drain pump or heating element work.

commonProblems:
  - title: "Spray Arm Blockage and Float Switch Coating from Hard Water Scale"
    description: "Orange County water ranks among the hardest in Southern California. Mineral deposits pack the spray arm holes tight, drop water pressure mid-cycle, and leave dishes streaky no matter the detergent dose. The float switch gets coated too, sometimes triggering false overfill signals. Bosch and LG units feel this fastest — usually shows up around year four or five in Irvine homes."
  - title: "E24 and OE Drain Errors Caused by Garbage Disposal Backflow"
    description: "Irvine homes built in the '90s often have dishwasher drains tied directly into the disposal — no high loop, no air gap installed. When the disposal slows, backflow pressure throws E24 on Bosch models and OE codes on LG. The drain pump strains against the back-pressure and can seize up entirely. Diagnosing it takes five minutes once you know what to look for."
  - title: "Detergent Dispenser Stuck Shut on KitchenAid and Samsung Units"
    description: "The dispenser door latch assembly warps over time from repeated heat cycling. KitchenAid dishwashers hit this regularly after seven or eight years — the wax motor inside weakens and stops releasing the door mid-cycle. Samsung's detergent cup uses a plastic hinge that cracks under sustained heat. Result is the same: dishes come out greasy, pod sitting untouched at the bottom."

faq:
  - q: "How fast can you get to Irvine for dishwasher repair?"
    a: "We run the south OC corridor daily — 92612, 92618, 92620, and the surrounding zip codes. Most Irvine calls get a technician out within 2 hours. Call us at (323) 870-4790 or book online for a same-day slot before noon."
  - q: "Do you repair Bosch and KitchenAid dishwashers specifically?"
    a: "Both are our most common Irvine calls. Bosch 300 and 500 Series drain pump replacements, filter housing clogs, and control board resets. KitchenAid door latch assemblies, heating elements, and detergent dispenser wax motors. LG and Samsung are regular too."
  - q: "What does dishwasher repair usually run in Irvine, and how does the process work?"
    a: "Drain pump replacement is typically $150–$220 parts and labor. Control board swaps on Bosch or KitchenAid can reach $300 depending on the model. Full quote before any work starts. Evening slots available — call (323) 870-4790 if daytime doesn't work."


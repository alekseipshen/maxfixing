title: "Irvine Ice Maker Repair — Hard Water & Fill Valve Fix"

intro: |
  Turtle Rock and Quail Hill homes run KitchenAid and Sub-Zero refrigerators at higher rates
  than almost anywhere else in Orange County. These units fail quietly — cubes shrink first,
  then the fill valve stops opening entirely, then nothing comes out. By the time most Irvine
  homeowners realize something is wrong, the water supply line is already frozen solid and the
  ice maker's optical sensor has been misreading an empty bin for weeks. Hard mineral water
  through most of Irvine's supply zones accelerates every stage of this failure. Getting ahead
  of it is almost always cheaper than waiting.

localContext: |
  Most of Irvine's residential housing was built between 1975 and 2005. Woodbridge and
  University Town Center — zip codes 92604 and 92612 — have the city's oldest homes: 1,800–2,400
  sq ft tract builds where the original kitchen appliances have never been replaced. Newer
  developments like Portola Springs and Great Park neighborhoods in 92618 run Bosch and LG
  built-ins under five years old. Even new ice makers fail early in Irvine when supply lines
  weren't properly flushed during construction, or when water pressure at the refrigerator
  line exceeds the fill valve's rated limit.

commonProblems:
  - title: "Calcium Buildup Blocking the Fill Valve"
    description: |
      Irvine's municipal water registers 280–340 ppm mineral hardness. That calcium load goes
      straight to the water inlet valve — specifically the solenoid inside KitchenAid ice makers,
      which has tighter tolerances than most mid-range brands. Scale deposits build up on the
      valve seat until it can't open fully. Cubes come out hollow, undersized, or fused together
      in the bin. Sometimes the ice maker throws a fill error mid-cycle and just stops. Replacing
      the fill valve and flushing the supply line fixes this in one visit — no refrigerator door
      removal required.

  - title: "Frozen Water Supply Line in LG French-Door Models"
    description: |
      LG french-door units in 92618 show up with frozen fill tubes more than any other failure
      in Irvine. The water supply line runs directly through the freezer door hinge — when the
      defrost cycle timing drifts even slightly out of spec, that line ices over completely.
      Production stops. The ice maker itself is working fine; it's just getting no water. Ordering
      a new control board because the unit looks dead is the most common misdiagnosis on this model.
      The actual repair is thawing the tube and recalibrating the defrost cycle.

  - title: "Sensor Malfunction Causing No Ice or Overflow"
    description: |
      Samsung and KitchenAid ice makers both track bin fill level using an optical sensor or a
      mechanical bail arm. A failed sensor produces one of two symptoms: the unit runs nonstop
      and floods the bin until it jams, or it shuts down entirely and logs a sensor fault on the
      display. Both look like a dead ice maker — but the water inlet valve, heating element, and
      motor are all intact. Sensor module replacement takes about 45 minutes and can be done
      the same day you call.

faq:
  - q: "How fast can you get to Irvine for ice maker repair?"
    a: |
      Irvine falls on the daily route along the 405 and 5 corridors. Woodbridge, Northwood,
      Turtle Rock, and the Great Park neighborhoods are all regular stops — no extra travel fees
      for any Irvine address. Most calls in 92604 or 92618 get same-day service. Call
      (323) 870-4790 and we'll lock in the earliest available slot, evening appointments included
      if daytime doesn't work.

  - q: "Do you repair Sub-Zero and Bosch ice makers in Irvine?"
    a: |
      Sub-Zero built-ins need specialized panel removal to reach the ice maker module — standard
      socket sets can't access the mounting hardware. Bosch and KitchenAid ice maker calls are
      the most frequent in Irvine: fill valve clogs, inlet valve failures, sensor replacements.
      Parts for all three brands stay stocked on the truck, so the diagnostic and the repair
      usually happen in the same visit.

  - q: "What does ice maker repair cost in Irvine, and how long does it take?"
    a: |
      Fill valve replacement runs $120–180 parts and labor combined. Sensor or control board
      repairs land at $180–280 depending on brand and part availability. The estimate comes before
      any work starts — nothing proceeds without approval. Same-day appointments are available
      most weekdays. Call (323) 870-4790 or book online. If it's urgent and the ice maker failed
      overnight, evening emergency slots are open.

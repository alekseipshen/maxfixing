title: "Dana Point Ice Maker — Coastal Hard Water Kills Fill Valves"

intro: |
  Coastal humidity off Dana Point Harbor is the backdrop, but the real problem inside local ice makers is the water supply. South Coast Water District delivers at 340–380 ppm TDS through most of 92629 — one of the harder water profiles on the OC coast. That calcium load attacks the water inlet valve and clogs fill lines within 3–4 years on a typical ice maker. A KitchenAid french-door in a Lantern Bay condo hits this failure right on schedule. Sub-Zero built-ins up in Monarch Beach follow the same timeline, just with more expensive replacement parts when they finally give out.

localContext: |
  Most of the residential stock in 92629 dates to the 1970s and 1980s — two-story townhomes and condos built during the harbor development boom, with kitchens not designed around counter-depth refrigerators or built-in ice systems. Retrofit ice maker plumbing creates tight clearances behind the unit that make water inlet valve access genuinely difficult. Toward Capistrano Beach, older single-family homes from the 1960s have original copper supply lines that restrict fill tube routing and can produce low-pressure ice output even when the valve itself tests fine.

commonProblems:
  - title: "Fill Tube Icing Over From Coastal Temperature Swings"
    description: "Summer nights in Dana Point can drop 20 degrees from afternoon highs — that temperature cycling inside the refrigerator door section causes the water fill tube to freeze and block ice production with no obvious warning. Samsung french-door models are particularly prone: the fill tube sits directly behind the ice bucket and ices over in place. Thawing it incorrectly cracks the plastic housing; the proper fix involves draining and reseating the full line, not just applying external heat."
  - title: "Water Inlet Valve Blocked by 370 PPM Hard Water"
    description: "South Coast Water District supply tests at 340–380 ppm TDS through most of 92629 — that calcium concentration coats the water inlet valve screens and slowly restricts flow until the ice maker stops cycling altogether. On a heavily-used unit, this surfaces within 3 years. Bosch and KitchenAid models with integrated ice systems show it faster than standalone units: the solenoid valves are smaller-bore, the inlet screens are harder to reach, and replacing the valve requires pulling the refrigerator out from the wall."
  - title: "Ice Level Sensor Failures in Sub-Zero and Thermador Built-Ins"
    description: "Built-in refrigerators common in Monarch Beach homes — Sub-Zero 700 series, Thermador Freedom column units — use optical ice level sensors that misread due to frost accumulation on the emitter lens. Once that happens, the ice maker assembly either cycles constantly or shuts down entirely based on a false full signal. Cleaning the sensor lens is a temporary fix at best. The emitter module typically needs replacement, and the control board often requires recalibration to correctly read the new sensor output."


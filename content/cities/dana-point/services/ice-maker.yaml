    a: "Routing south on the 5 from our South OC coverage zone typically puts us in 92629 within 90 minutes of your call. Street parking near the harbor-area townhomes is manageable most weekdays — we've got the routes figured out. Call (323) 870-4790 to schedule; same-day slots are usually available, and evening appointments run through most of the week."
  - q: "Do you repair Bosch and KitchenAid ice makers in Dana Point?"
    a: "Both are common in local kitchens and we service them regularly. Bosch 800-series fill valve replacements and KitchenAid ice maker assembly swaps are standard repairs for us. Sub-Zero and Thermador built-ins need specialized tools and OEM parts that most generalist shops don't stock — we carry the diagnostic equipment for both lines."
  - q: "What does ice maker repair cost, and can you come the same day?"
    a: "Fill valve replacements typically run $120–$220 parts and labor. Ice maker assembly swaps on premium brands push $280–$450 depending on the unit. Same-day service is available for Dana Point — call (323) 870-4790 to check availability. Emergency slots exist for units that are actively leaking or have stopped producing ice during a heat spell."
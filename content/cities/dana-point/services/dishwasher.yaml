title: "Dana Point Dishwasher — Coastal OC Mineral Buildup Solved"

intro: |
  Niguel Shores and the hillside tracts above PCH run Bosch 800-series dishwashers like clockwork — until they don't. Orange County water from the MWD system tests around 300 ppm hardness in coastal Dana Point (zip 92629), and that mineral load quietly chokes spray arms and detergent dispensers over a few years of daily use.

  Dishes that came out spotless in year one start looking foggy in year three. The hardness here is real — it's not the machine, it's the water. Call us at (323) 870-4790. Same-day appointments are usually available.

localContext: |
  Dana Point splits between newer townhomes and condos near the harbor in 92629 and older single-family homes inland through Dana Hills and Capistrano Beach. Harbor-adjacent units in the Lantern District frequently run built-under dishwashers in tighter kitchen layouts — access matters when pulling a drain pump or swapping an inlet valve. Parking a service van on Del Obispo Street at midday takes planning too.

  Ranch-style homes in Capistrano Beach built in the '60s and early '70s tend to run replacement-generation appliances. The original drain stub-outs in those kitchens can complicate hose routing during a repair. More than once we've had to extend a drain line on a Whirlpool replacement in a kitchen never designed for a modern tub-style dishwasher.

  The hillside communities off Stonehill Drive bring a different set of appliances entirely. Bosch and KitchenAid dominate the mid-range homes; Sub-Zero and Thermador show up in newer custom builds above Del Prado. Different tools, different parts sourcing, different diagnostic steps — but it's all the same zip code.

commonProblems:
  - title: "Spray Arm Clogging from OC Hard Water Mineral Scale"
    description: |
      At 300 ppm, OC tap water deposits calcium carbonate inside spray arm nozzles within 18 to 24 months of regular use. The dishwasher runs full cycles but dishes come out cloudy or gritty.

      Bosch 300 and 500 series units log E24 or E25 error codes when the lower spray arm is blocked — the machine stops mid-cycle and won't restart until the obstruction is cleared or the arm is replaced. Samsung units throw an OC error for the same clog. A full descale and spray arm replacement runs about 45 minutes and solves the problem completely, usually same day.

  - title: "Drain Pump Failure in High-Use Vacation Rental Units"
    description: |
      Dana Point has a dense short-term rental footprint near the harbor and Doheny Beach. Those units run dishwashers hard — daily loads, no pre-rinsing, rotating tenants. That pace burns out drain pump motors well ahead of schedule.

      KitchenAid dishwashers in Monarch Beach homes display a 7-flash clean light sequence when the drain pump fails. Pooling water at the base after a completed cycle is almost always the first sign. Catching it early prevents water damage to the cabinet floor.

  - title: "Door Latch Assembly Wear on LG and Samsung Built-Unders"
    description: |
      Coastal humidity accelerates fatigue on plastic-bracket door latch assemblies — particularly on LG and Samsung built-under models from 2018 through 2022. A worn latch won't seal, which trips the door float switch and prevents the fill cycle from starting.

      The machine just sits silent. No error code, no beep. Most homeowners assume it's the control board and brace for a big repair bill — usually it's just the latch. Replacement runs about 45 minutes on most LG models and is a clean same-day fix when parts are in stock.

faq:
  - q: "How fast can you get to Dana Point for a dishwasher repair?"
    a: "From our South OC route we typically reach 92629 within 2 hours of your call. PCH and Crown Valley Parkway are our standard approaches — I-5 near Camino de Estrella stacks up after 3 PM, so morning slots move fastest. Call (323) 870-4790 to check same-day availability."

  - q: "Do you repair Bosch and Thermador dishwashers in Dana Point?"
    a: "Bosch accounts for roughly half our Dana Point dishwasher calls. Thermador units share BSH Group components with Bosch, so many repairs overlap directly — same control boards, similar spray arm assemblies, same diagnostic sequence. We also service KitchenAid, LG, and Samsung regularly. Common fixes include control board resets, detergent dispenser spring replacements, and inlet valve swaps. Give us the model number and we'll confirm parts availability before the visit."

  - q: "What does a dishwasher repair visit cost, and how does scheduling work?"
    a: "The diagnostic fee is flat-rate and credited toward the repair if you move forward. Most drain pump or heating element jobs land between $150 and $280 in parts and labor. A door latch swap or inlet valve replacement typically comes in under $200. Evening slots are available. Schedule online or call (323) 870-4790 — we confirm a 2-hour arrival window the morning of your appointment."
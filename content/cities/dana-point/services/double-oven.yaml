title: "Dana Point Double Oven — Thermador & KitchenAid Same-Day Repair"

intro: |
  Strand Beach and the Headlands bluffs drove a decade of premium kitchen renovations. Thermador and KitchenAid double wall ovens landed in most of those builds — pressed into custom millwork, some with flush trim kits, two blocks from the Pacific. One cavity stops hitting temperature and the control board gets blamed immediately. Half the time it's a failed heating element. The other half, the board really is gone. Diagnosing it wrong costs a return trip. Dana Point's ocean air accelerates sensor wear in ways you don't see as fast inland. RTD probes in upper cavities here fail faster than the same model in Anaheim or Riverside.

localContext: |
  The 92629 zip runs from the harbor district up through Monarch Beach — newer construction, precision built-ins, tight clearances on everything. Homeowners in that corridor spent serious money on their kitchens and notice immediately when temperature accuracy drifts. Capistrano Beach in 92624 is a different situation. 1970s ranch homes where someone dropped a Bosch double wall oven into original cabinetry never designed for the depth. The Headlands development near Niguel Road adds 20 minutes to any first visit. Entry protocols, limited visitor parking, driveways too narrow for a full service van to reverse into.

commonProblems:
  - title: "Upper Heating Element Burns Out in Thermador Double Wall Ovens"
    description: |
      Thermador double wall ovens installed during the Monarch Beach build-out are hitting the 8 to 12 year mark. The upper cavity heating element burns out at the terminal connections first — sometimes visibly scorched along the element body. Error code F1 or E1 appears on the display before complete failure. Lower cavity stays functional because it runs fewer cycles at cooler average temps. Element replacement takes about 90 minutes once we confirm the correct part number. Thermador changed part numbers mid-generation and ordering by model number alone gets the wrong element roughly 30% of the time.
  - title: "RTD Sensor Drift Creates Temperature Mismatch Between Cavities"
    description: |
      KitchenAid double ovens develop probe drift in the upper cavity over time. Set 375 degrees and the actual cavity temperature reads closer to 325. Salt air from the Dana Point coast gets into the RTD probe housing and shifts its resistance curve — faster degradation than you'd see in an inland installation. Recalibration masks the problem for a week or two at most. Actual fix is sensor replacement. Lower cavity usually holds accurate because it runs fewer cycles and the probe runs cooler.
  - title: "Control Board Relay Failure Leaves One or Both Cavities Dead"
    description: |
      Power fluctuations during Orange County summer heat events fry the relay section on Bosch double oven control boards. Display lights up and shows normal status — that's what throws most homeowners off. They assume it's a door sensor, a timer problem, or a setting. Burned relay contacts mean one or both cavities don't fire regardless of settings or mode. Board replacement is the fix. A factory reset accomplishes nothing when the physical contacts have fused together. Call (323) 870-4790 if your Bosch display looks fine but neither cavity heats — that's a relay failure until proven otherwise.


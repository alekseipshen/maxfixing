  - q: "How fast can you get to Brentwood for oven repair?"
    a: |
      Brentwood is a regular stop on our West LA circuit. From near the 405, we're typically at a 90049 address within 90 minutes of your call. Parking a van on Barrington or near San Vicente isn't an issue. Call (323) 870-4790 by noon and same-day service is almost always doable.
  - q: "Do you repair Thermador, Wolf, and Bosch ovens in this area?"
    a: |
      Yes — those three make up most of what we see in 90049 and the Bel Air adjacent streets. Thermador temperature sensor and control board work, Wolf gas range igniter and valve repairs, Bosch hidden bake element replacements. KitchenAid double wall ovens too — the 2008–2015 models are hitting the age where bake elements and boards start going. Most common parts for these brands are on the truck or sourced next day, which keeps it to one trip.
  - q: "What does oven repair cost, and is same-day service available?"
    a: |
      Diagnostic is $89, applied to the repair if you move forward. Bake or broil element replacements typically land at $150–$250 total, parts and labor. Control board work on Thermador or KitchenAid runs $300–$500 depending on the model. Same-day slots are available most weekdays — call (323) 870-4790 or book online. Evening appointments available for homeowners who can't be home during the day.
    a: "Our West LA base puts us on San Vicente in about 15 minutes on a normal morning —
      Sunset to the 405 is a clean run before noon. Call (323) 870-4790 before 10am and
      same-day morning slots are almost always open. Evening appointments available six
      days a week if daytime doesn't work."

  - q: "Do you repair Thermador and Wolf ranges, or mainly standard brands?"
    a: "Both, plus Viking. Thermador Pro Harmony burner assemblies and Wolf dual-fuel
      control boards are regular jobs on the Westside — we know the part numbers and
      stock the common ones. We also handle KitchenAid, Bosch, Samsung, and LG. Most
      parts ship same-day from our distributor, so two-visit repairs are rare."

  - q: "Is there a diagnostic fee, and what does range repair typically cost in Brentwood?"
    a: "Diagnostic fee applies to the first visit and gets credited toward the repair if
      you approve the work. Range repairs in Brentwood typically run $150 to $380 depending
      on the part and brand — gas valve and control board jobs sit at the higher end.
      Emergency same-day service carries a small trip surcharge. Call (323) 870-4790 or
      schedule online and we give a firm quote before anything gets touched."
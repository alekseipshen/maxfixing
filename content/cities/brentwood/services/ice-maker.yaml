    a: "Routes through West LA run daily — Brentwood typically puts us 30-45 minutes out. Call (323) 870-4790 before noon and same-day service is usually locked in. San Vicente and Barrington are easy access; addresses up in the canyon add a bit of drive time. Evening slots are available for most 90049 addresses."
  - q: "Do you repair Sub-Zero and Thermador ice makers?"
    a: "Yes — those are the most common brands we see in Brentwood. Sub-Zero built-in assemblies need a specific harness tool most generalist shops don't carry. Thermador column units run their own diagnostic sequence before you can access the harvest motor. Bosch counter-depth models handled regularly too, and we stock common inlet valves for KitchenAid and LG on the van."
  - q: "What does ice maker repair usually cost, and is same-day available?"
    a: "Fill valve replacements typically run $150–$260 in parts and labor. Optical sensor or control board work pushes to $270–$390 depending on the brand. Supply line repairs in canyon properties sometimes add a bit for access time. Same-day slots open most days, evening appointments available for Mandeville and upper Brentwood addresses. Call (323) 870-4790 — if you're in Brentwood and calling before noon, we'll usually have a technician out the same day."
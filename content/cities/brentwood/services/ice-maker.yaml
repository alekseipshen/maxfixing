title: "Brentwood Ice Maker Repair — Sub-Zero & Built-In Specialists"

intro: |
  Hard water is the silent killer of ice makers on the Westside. The homes along Mandeville Canyon and off Barrington Avenue see it constantly — that Bosch counter-depth or Sub-Zero built-in you invested in starts producing hollow cubes, then half-size cubes, then nothing at all. Mineral scale from LA's water supply is almost always behind it. The fill valve narrows first. Water can't get through. The unit just sits there, idle, while the bin stays empty. Same-day service available across 90049 most days.

localContext: |
  Brentwood is one of the more varied pockets of the Westside — 1960s ranch homes on the flats below Sunset, canyon properties climbing toward Mandeville, newer custom builds near the Brentwood Country Club on Burlingame Avenue. The 90049 zip tilts premium: Sub-Zero and Thermador column refrigerators appear in roughly half the kitchens we service here. Getting to the ice maker assembly in those units usually means pulling the door panel with specialized tools. Tight canyon driveways and street-parking limits on side streets off San Vicente are just part of the job.

  Brentwood kitchens run serious hardware — KitchenAid counter-depth units in the 1990s remodels, newer LG French-door models in the Saltair Avenue condos, full Sub-Zero columns in the larger estates off Homewood Road. Each brand handles ice production differently. Sub-Zero uses a dedicated module with a separate water circuit; Thermador integrates production into the main refrigeration control board. That distinction matters when diagnosing why output dropped suddenly versus tapered off over weeks.

commonProblems:
  - title: "Fill Valve Failure from LA Hard Water Scale"
    description: "LA's municipal supply regularly tests above 250 mg/L total dissolved solids, and that mineral load hits the water inlet valve first. Scale slowly narrows the orifice until flow drops below what the system needs to complete a full cycle. Sub-Zero built-ins in Brentwood are especially vulnerable — the valve sits near the compressor, and trapped heat accelerates calcification. Hollow ice, then small ice, then nothing. Replacing the inlet valve is usually a 45-minute job on most Bosch and KitchenAid units, but Sub-Zero requires pulling the grille panel and disconnecting the water line at the back — budget an extra 20 minutes on those."
  - title: "Frozen Supply Line Behind the Refrigerator"
    description: "A frozen supply line looks identical to a dead ice maker — zero output either way. On Samsung French-door models, a water inlet valve that sticks slightly open lets a slow drip continue between cycles. That drip reaches the cold zone behind the cabinet and ices the line solid. Thawing it without replacing the valve just means it refreezes in a week. In Brentwood's older canyon homes, supply lines sometimes run through uninsulated cabinet walls — that makes them vulnerable even without a faulty valve. Worth checking the line routing before writing it off as a simple valve swap."
  - title: "Optical Sensor Malfunction on KitchenAid Column Units"
    description: "KitchenAid column refrigerators use an optical sensor to read bin fill level. Frost accumulation or a minor shift in alignment convinces the sensor the bin is full when it's bone dry. The machine stops harvesting — no error code, no warning light, nothing obvious. Pull the bin out and it's empty, but the unit thinks it's done its job. Sensor recalibration or a swap fixes it in one visit. LG models have a similar failure mode but display an error code — usually FF or dH on the panel — which is your first clue it's a sensor or defrost problem rather than a mechanical failure in the harvest motor."


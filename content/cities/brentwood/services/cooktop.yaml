title: "Brentwood Cooktop Repair — Induction, Gas & Ceramic in 90049"

intro: |
  San Vicente Boulevard's median is one of the most photographed stretches in West LA, and the kitchens behind those Spanish colonials and Craftsmans on Gretna Green Way have been going premium steadily — Bosch induction, Thermador five-burner gas, the occasional Wolf range tucked into a full kitchen remodel. Brentwood doesn't get as much appliance attention as Beverly Hills or Calabasas, but the density of high-end cooktops in 90049 is genuinely high. Two technicians cover this part of the Westside daily. Most problems — control board errors, igniter failures, cracked ceramic glass — resolve in a single trip without ordering parts.

localContext: |
  Zip code 90049 runs two very different housing eras side by side. West of Barrington, toward Brentwood Park and the Mandeville Canyon trailhead, the blocks are lined with post-war ranches from 1948–1968 — galley kitchens, older gas rough-ins, cabinet depths that make cooktop replacement tricky. Countertop access on those jobs sometimes takes longer than the repair itself. East toward Westwood, full lot rebuilds from the 2000s brought flush-mount induction cooktops set in custom quartz with zero clearance underneath. Different access challenges, different tools, different parts inventory. The van carries both.

commonProblems:
  - title: "Gas Burner Won't Light: Hard Water Deposits Killing the Spark Igniter"
    description: |
      LA's water hardness runs 300–350 ppm, and in Brentwood's older gas cooktops that adds up fast. Mineral scale and grease collect on the spark igniter tip until the burner clicks without catching — or keeps clicking long after the knob's been turned off. On KitchenAid gas cooktops the igniter module sits recessed in the burner bowl where it's hard to clean. The igniter's ceramic tip can be replaced without swapping the full burner assembly, which keeps the cost reasonable. Usually 45 minutes total.

  - title: "Induction Cooktop Dead After E11 or E15 Error Code Appears"
    description: |
      Bosch 800 Series and Thermador Freedom induction units develop fault codes — E11, E15 — when the control board is failing or a ribbon cable under the glass surface loses contact. No touch response, no heat, nothing. Getting a diagnostic error code often makes homeowners think the cooktop is finished; it usually isn't. Thermador control boards can take three or more weeks to ship from the manufacturer, so we keep common Bosch and Thermador boards in stock to avoid a return trip.

  - title: "Cracked Glass-Ceramic Surface from a Heavy Pan or Thermal Shock"
    description: |
      Dropping a cast-iron skillet on a Samsung smooth-top, or setting something frozen directly on a hot ceramic surface, can fracture the glass-ceramic panel through impact or rapid thermal expansion. A crack running through the heating element area makes the cooktop unsafe to run. Replacement panels are model-specific — we verify the part number before ordering to confirm the glass aligns with the burner cutouts and element positions on your exact unit.


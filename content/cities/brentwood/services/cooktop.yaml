  - q: "Do you repair Bosch induction and Thermador gas cooktops?"
    a: |
      Yes — Bosch and Thermador are the two brands we see most in Brentwood and the broader Westside. Also KitchenAid ceramic flat-top, Wolf five-burner gas, and Samsung induction. The most common repairs are control board replacement, igniter module swaps, surface element repairs, and knob mechanism failures from worn plastic internals. OEM parts for all these brands ride in the van on every Brentwood job.

  - q: "What does a cooktop repair in Brentwood typically cost?"
    a: |
      Diagnostic visit is $85, credited toward the repair if you move forward. A spark igniter swap runs $120–$180 total for parts and labor. Control board replacement on a Bosch or Thermador unit lands between $250 and $450 depending on the model and part cost. Flat quote before any work starts — no surprises. Most jobs finish same-day. Schedule online or call (323) 870-4790 for current availability.
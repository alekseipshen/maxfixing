title: "Encino Range Hood — Repair for San Fernando Valley Kitchens"

intro: |
  Summertime cooking in the San Fernando Valley is its own category. By July, the
  ambient temperature inside a 1960s ranch kitchen near Encino Park can sit at 85°F
  before the stove is even on — and if the range hood blower motor has been dragging
  at half-speed for two months, nobody notices until the backsplash is glazed in
  grease and the smoke alarm goes off during a Sunday pan sauce. Most of the hoods
  in these houses are GE or Kenmore units that were original to the build, running
  on ductwork sized for a time when nobody owned a 15,000-BTU gas burner. The
  Encino Hills crowd up above Mulholland Drive tends to have newer kitchens — some
  rebuilt after Northridge — but even those hoods develop duct damper problems and
  blower-wheel buildup faster than the manufacturer's maintenance schedule expects.
  A hood that's not moving air is just a light fixture with a grease trap attached.

localContext: |
  Central Encino — zip code 91316 — is dense with 1,200 to 1,800 square foot ranch
  homes built between 1955 and 1972. Those kitchens were laid out around 4-inch round
  duct runs, and the original range hoods were low-CFM units to match. Swap in a
  modern gas range and that duct becomes a choke point; the hood runs but the air
  barely moves. Over in 91436, which covers Encino Hills and the slopes above the
  405 corridor, you get larger footprints, cathedral ceilings, and kitchens that
  were often gutted and rebuilt in the 2000s. Those remodels sometimes used flexible
  foil duct instead of rigid galvanized — it's faster to install but collapses at
  bends and accumulates grease faster than sheet metal. Valley summer heat bakes
  grease onto baffle filters at roughly double the rate you'd see in coastal LA.
  A filter cleaning interval that works fine in Culver City won't keep up with the
  cooking environment on Havenhurst Drive in August.

commonProblems:
  - title: "Dead Blower Motor — Fan That Quits Mid-Cook or Won't Start"
    description: |
      GE Profile-series hoods from the late 1980s through early 2000s used a thermal
      cutout fuse mounted to the motor housing. Once it blows — usually from heat
      cycling in a poorly ventilated cabinet — the fan stops entirely and the control
      switch does nothing. Before assuming the control board is dead, that fuse needs
      to be tested. Replacement motor assemblies for these GE and Kenmore hoods run
      $45 to $110 depending on the horsepower rating; labor to swap one is about an
      hour. We stock the most common motor assemblies on the van, so most of these
      calls resolve same-day. If the motor shaft has seized from grease ingestion —
      you'll hear a grinding noise in the days before it stops — the entire motor
      assembly needs replacement, not just the fuse. Budget $130 to $180 all in for
      that scenario.

  - title: "Excessive Noise — Rattling, Grinding, or High-Pitched Whine at Speed"
    description: |
      Three things cause most range hood noise complaints in Encino kitchens: a
      blower wheel coated in uneven grease deposits that throws it off-balance, loose
      motor bracket mounting screws that vibrate against the housing, or a foil flex
      duct transition that resonates with the airflow. Frigidaire hoods are
      particularly prone to blower-wheel imbalance because their wheel geometry traps
      more particulate at lower CFM settings. Samsung hoods develop the same issue but
      faster. Cleaning or replacing the blower wheel runs $60 to $130 depending on
      access. The duct issue is different — if a previous installer used a mismatched
      reducer between the hood collar and the wall duct, vibration travels straight
      into the cabinet above. Replacing that section with rigid galvanized duct and a
      proper reducer collar typically costs $90 to $160 in parts and labor.

  - title: "Clogged Grease Filter — Airflow Drop and Fire Code Concern"
    description: |
      Baffle-style grease filters should be washed monthly under typical conditions.
      In the San Fernando Valley, where gas burners run harder and kitchens stay
      warmer, every three weeks is more realistic. A saturated baffle filter doesn't
      just cut CFM; it sits inches from an open flame with a full grease load. Los
      Angeles fire code Section 609 governs commercial exhaust cleaning requirements,
      and while residential hoods aren't subject to the same documentation rules, an
      insurance adjuster investigating a kitchen fire will ask when the filters were
      last cleaned. Replacement aluminum baffle panels for Whirlpool and Amana hoods
      run $15 to $40 per panel — cheap enough that replacement beats cleaning when
      the metal is warped or corroded. Full replacement installs that require permits
      through the City of LA Department of Building and Safety are handled under
      contractor license #1136541.

  - title: "Disconnected Vent Duct — Grease Vapor Routing Into the Attic Space"
    description: |
      This is the most underdiagnosed range hood problem in 91316. A kitchen remodel
      moves the hood position slightly, the duct collar ends up just resting inside
      the wall pipe with no fastener, and grease vapor goes straight into the attic
      for the next three years. By the time someone smells it or finds the attic
      insulation saturated, the remediation scope has grown well past a duct repair.
      Fixing the connection itself — sheet-metal screws and UL-listed foil tape at
      every joint — takes about an hour. Gray cloth tape from a hardware store dries
      out and delaminiates in Valley heat within two years; it's not an acceptable
      substitute. Full duct re-routes in a single-story Encino ranch run $200 to $450
      depending on the distance from the hood to the exterior wall cap and how much
      cabinetry needs to be temporarily removed for access.

  - title: "Range Hood Light Failure — Sockets, Wiring Harness, and LED Upgrades"
    description: |
      Halogen bulbs in older Kenmore and GE hoods burn out in six months or less when
      kitchen ambient temperatures run high — which they do in any Valley home without
      central air that's actually keeping up. The real failure point is the socket:
      ceramic holders crack from heat cycling, and the wiring harness connector can
      melt just enough to cause an intermittent connection that no bulb swap will fix.
      LED retrofit kits sized for standard G4 and T8 bases cost $12 to $25 and run
      significantly cooler, which extends socket life by years. Whirlpool and
      Frigidaire hoods sometimes use proprietary socket mounts that require OEM parts
      — typically a 2 to 5 day lead time on order. If the lights flicker specifically
      when the blower runs on high, the control board is the next diagnostic step;
      boards on mid-range hoods run $55 to $140.

faq:
  - q: "How fast can you get to Encino for range hood repair?"
    a: |
      From our San Fernando Valley staging point near the 101/405 interchange, Encino
      is 15 to 25 minutes depending on Ventura Boulevard traffic. Same-day
      appointments are available most weekdays, and for urgent calls we can usually
      arrive within 2 hours. Evening slots run Tuesday through Thursday for
      homeowners who can't do daytime appointments. Call us at (660) 999-9960 and
      we'll give you an actual arrival window, not a four-hour block. We'll confirm
      parts availability for your hood model before we show up so the visit doesn't
      turn into a parts run.

  - q: "What does range hood repair typically cost in Encino?"
    a: |
      Most repairs land between $85 and $275 for parts and labor combined. A blower
      motor swap on a GE or Kenmore hood runs $130 to $180 all in. Duct reconnection
      or re-routing is $200 to $450 depending on the distance to the exterior wall.
      Control board replacement sits around $150 to $220. Light socket repair with
      an LED retrofit is usually under $90. There's no diagnostic fee if you approve
      the repair — we give you a firm written quote before touching anything. Call
      (660) 999-9960 or book online to get a same-day visit confirmed.

  - q: "Do I need a permit to replace a range hood in Encino?"
    a: |
      A straight like-for-like swap — same duct size, same location, no electrical
      panel work — generally doesn't trigger a permit requirement under the City of
      Los Angeles building code. If you're changing the duct routing, cutting a new
      exterior wall penetration, or upgrading to a higher-CFM unit that needs a
      dedicated circuit, a permit is required through the LA Department of Building
      and Safety. We handle that paperwork under contractor license #1136541.
      Online permit turnaround for residential kitchen projects in Encino typically
      runs 5 to 10 business days, and we coordinate the inspection scheduling.

  - q: "Can you convert a ductless recirculating hood to a ducted vented installation?"
    a: |
      Yes, and it comes up regularly in Encino apartments and condos along Ventura
      Boulevard where the original builder installed a ductless hood with a charcoal
      filter to avoid running duct to the exterior. Converting to ducted means routing
      a new duct run to an exterior wall cap — straightforward in a single-story home,
      more variable in a multi-story building depending on what's above the kitchen.
      Charcoal filters in recirculating hoods need replacement every 3 to 6 months and
      never fully eliminate cooking odors. A proper vented installation removes both
      the maintenance cycle and the odor problem. We assess routing options on-site
      and give you a firm scope before any commitment.

  - q: "How long should a range hood last, and when does repair stop making sense?"
    a: |
      A properly maintained residential range hood should run 15 to 20 years. The
      tipping point toward replacement is usually a failed control board on a unit
      that's already 12 or more years old — at that point you're putting $150 into a
      board on something that may need a motor next year. GE, Whirlpool, and Kenmore
      parts remain available for most models going back 15 years, so repair is almost
      always viable on younger units. If the sheet-metal housing is warped, the duct
      collar has rusted through, or the unit was never properly vented to the exterior,
      replacement makes more economic sense. We'll tell you which direction is smarter
      — no incentive to sell a new hood if a $90 repair handles it.

  - q: "Do you cover other parts of the Valley for range hood service, or just Encino?"
    a: |
      Encino sits in the center of our Valley service area. Sherman Oaks, Tarzana,
      Woodland Hills, Reseda, and Van Nuys are all within 20 minutes. Calabasas and
      West Hills run about 25 to 30 minutes out and are covered regularly. For range
      hood calls, we carry blower motor assemblies, baffle filter panels, and wiring
      harness components for GE, Kenmore, Frigidaire, and Whirlpool on the van — most
      Valley visits wrap in a single trip. Saturday mornings are available for
      homeowners who need weekend scheduling. Call (660) 999-9960 to check same-day
      or next-day availability.
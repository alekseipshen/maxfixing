title: "Encino Dishwasher Repair — Hard Water, GE Units & Fast Fixes"

intro: |
  Mineral deposits are the silent killer of dishwashers in Encino. Tap water in the
  91316 zip code carries roughly 350 ppm of dissolved calcium and magnesium — hard
  enough that spray arm nozzles on GE and Whirlpool units start restricting flow
  within 18 months of install. That white film on your glasses isn't detergent
  residue. It's calcium carbonate, and it's also coating the float switch housing
  and inlet valve screen inside the machine. The ranch homes between Balboa Knolls
  and the streets around Woodley Avenue tend to have 15-to-20-year-old dishwashers
  still running — original Kenmore or GE units where the door latch assembly has
  gone wobbly and the drain pump groans through the final cycle. These aren't
  write-offs. Most of them have five more years left if the right components get
  swapped before the control board takes damage from the underlying issue. A failing
  drain pump that backs water into the tub will eventually corrode board contacts —
  which turns a $180 repair into a $320 one.

localContext: |
  Encino splits into two pretty different housing situations for appliance work.
  South of Ventura Boulevard — the flat grid through the 91316 zone — you've got
  postwar bungalows and 1960s ranch houses with standard under-counter dishwasher
  installs. Access is usually clean: pull the kick plate, disconnect two hoses and
  the power lead, slide the unit out. The hillside homes above Mulholland in 91436
  are a different job entirely. Custom cabinetry, granite island overhangs, and
  panel-ready dishwashers anchored to cabinet faces can turn a drain pump swap into
  a two-person extraction. Water pressure fluctuates more in the elevation zone too,
  which accelerates wear on the inlet valve solenoid over time. Both areas pull from
  the same Los Angeles Department of Water and Power supply, so the hard water
  problem hits uniformly — dishwashers, ice maker fill lines, washing machine inlets.
  Homes with older galvanized supply lines in the flat streets add sediment to the
  mineral load, which clogs inlet valve screens faster than the hillside homes on
  copper.

commonProblems:
  - title: "Spray Arm Blockage from Mineral Scale — Top Rack Stops Cleaning First"
    description: |
      The upper and lower spray arms on most GE and Whirlpool models have nozzle
      openings around 2mm across. Encino's 350-ppm tap water deposits a calcium ring
      in those holes fast — usually within a year or two if no rinse aid is running.
      The top rack loses cleaning performance first because the upper spray arm
      depends on water pressure coming up through the wash pump, and any restriction
      in the line hits the far end hardest. Pulling both arms and soaking them in
      citric acid solution clears most blockages. If the buildup has reached the
      spray arm bearing or the wash pump impeller itself, those components need
      replacing — typically $40-70 for the pump assembly on a Whirlpool or GE unit.
      Full repair with labor usually runs $120-185. Takes about 90 minutes on-site,
      and we'll test both spray arm positions before leaving.

  - title: "Standing Water in the Tub — Drain Pump Motor or Blocked Hose"
    description: |
      A machine that finishes its cycle with an inch of water sitting flat in the
      bottom has a drain problem. On Samsung dishwashers, the 5E or 5C error code
      points directly at the drain system. The drain pump impeller can crack, the
      motor winding can burn, or the pump filter basket gets packed solid with food
      debris and blocks flow entirely. Before assuming pump failure, check the drain
      hose run behind the cabinet — kinked hoses behind tight dishwasher installs in
      Encino's older kitchens account for maybe 20% of these calls. Also: if the
      dishwasher was installed next to a garbage disposal and the knockout plug was
      never removed from the disposal inlet, water has nowhere to drain from day one.
      Drain pump replacement on a Samsung unit runs $150-225 with parts and labor.
      Same-day appointments are usually available — call (323) 870-4790 to get on
      the schedule.

  - title: "New Dishwasher Installation — Permits and Plumbing Code in Encino"
    description: |
      Swapping out an old Amana or Kenmore for a new unit isn't always a straight
      plug-and-play. Any dishwasher installation in the City of Los Angeles that
      touches the drain connection or relocates the unit requires a plumbing permit
      through LA Department of Building and Safety. Permit fees run $150-200, and
      inspections typically book within 5-7 business days. We file the permit
      application under contractor license — no LADBS portal navigation on
      your end. The install itself takes 2-3 hours: disconnect the old unit, set the
      proper high-loop drain configuration if it's missing, connect the supply line
      and drain hose, check the outlet voltage, and run a full test cycle watching
      for leaks at the inlet valve and hose fittings. Panel-ready dishwashers in
      hillside 91436 kitchens with custom cabinetry add time due to door alignment
      and mounting rail adjustment.

  - title: "Detergent Dispenser Won't Open — Solenoid Failure vs. Warped Door"
    description: |
      The dispenser door on most dishwashers opens via a small spring-loaded latch
      triggered by a solenoid wired to the control board. On GE Profile units, that
      solenoid sits inside the door panel assembly and, when it fails, the dispenser
      stays latched through the entire wash cycle. Dishes come out with hard water
      spots but no real cleaning — because they ran through hot water with no
      detergent at all. Sometimes the failure is mechanical, not electrical: the
      dispenser door itself warps from repeated heat exposure and physically can't
      release. That's a $20-30 part. A failed solenoid or control board signal costs
      more — the board on a GE Profile runs $80-120 for the part, plus an hour of
      labor to seat it and run a diagnostic cycle. Most board swaps on GE and
      Whirlpool machines are completed same-day if the part is in stock, which it
      usually is for these common models.

  - title: "Error Codes That Keep Coming Back After a Breaker Reset"
    description: |
      The breaker-reset trick clears the code display for one cycle and then it
      returns. Samsung, LG, and Frigidaire all use proprietary code systems where a
      single alphanumeric tells you a general area but not the specific failed part.
      Samsung's OC overflow code could mean the float switch tripped from an actual
      water leak under the tub — which means water has been sitting on your
      subfloor. The LE leak code on Samsung models and the E24 drain error on Bosch
      both require physical inspection of the sump area and drain path, not just a
      code reader. Float switches are $15-25 parts. Heating element failures behind
      an HE code on a Frigidaire run $45-65 for the element plus labor. The
      diagnostic visit is $65-85 and applies toward the repair cost if you move
      forward. Calling in with the error code and model number lets us pull the
      likely cause before we arrive.

faq:
  - q: "How fast can you get to Encino for dishwasher repair?"
    a: |
      Encino is a 20-30 minute drive depending on whether we're coming north on the
      405 or cutting through Sepulveda. Same-day appointments are available most
      weekdays, and we can typically be on-site within 2-3 hours of your morning
      call. A few evening slots open up each week for households where daytime
      access is tough. Call (323) 870-4790 before noon and there's a strong chance
      we get to you the same day. We cover all of Encino — the flat residential
      streets, the Mulholland hillside neighborhoods, and the condo buildings along
      Ventura Boulevard — without any travel surcharge.

  - q: "What does dishwasher repair cost in Encino?"
    a: |
      Common repairs — drain pump replacement, spray arm cleaning and part swap,
      door latch assembly — typically land between $150 and $280 all-in with parts
      and labor. Control board replacements on GE or Whirlpool units push $220-320
      depending on model year and parts availability. The diagnostic visit is $65-85
      and gets credited toward the repair if you move forward. Pricing varies by
      brand (Samsung parts cost more than Kenmore), access difficulty (hillside
      installs in 91436 sometimes need extra time to pull the unit), and whether
      two related components failed together. You get a firm number before we touch
      anything — no open estimates that expand on-site.

  - q: "Do you need a permit to replace a dishwasher in Encino?"
    a: |
      For a straight swap — same location, same drain and supply connections — most
      simple replacements fall under the LA Building Code's minor work exemption and
      don't require a permit. If the new unit involves relocating drain lines,
      adding a dedicated circuit, or modifying under-sink plumbing, a permit is
      required through LADBS. We operate under contractor license and
      handle the permit application when it's needed. Inspection windows through
      LADBS currently run 5-7 business days for plumbing work. If your HOA requires
      pre-approval for appliance work in common-wall units — which applies to some
      of the larger condo complexes along Encino's Ventura corridor — that review
      typically takes 1-2 weeks and we can provide the documentation they request.

  - q: "Can you diagnose dishwasher error codes I can't identify?"
    a: |
      Yes — and reading the code is only part of the diagnosis. Samsung's 4E water
      supply error, for example, can mean a kinked inlet hose behind the cabinet, a
      failed inlet valve solenoid, or just low house water pressure during the fill
      cycle. The code narrows the system; physical inspection identifies the actual
      failed component. Same logic applies to LG's AE error and Frigidaire's
      i30 code — both flag water detection in the base pan, which could be a slow
      door gasket leak or a cracked sump. Call (323) 870-4790 with the code and
      model number printed inside your door frame — we can usually tell you the two
      most likely causes before booking, so you know what you're looking at
      cost-wise upfront.

  - q: "What warranty do you offer on dishwasher repairs?"
    a: |
      Parts we install carry the manufacturer's warranty — typically 90 days to one
      year depending on the component. Labor is warranted for 90 days from the
      repair date: same failure returns within that window, we come back at no
      additional labor charge. Unrelated failures that develop after the repair
      aren't covered, and accelerated wear from untreated hard water isn't covered
      under any parts warranty. If you're in Encino and running no water softener
      or rinse aid, a monthly dishwasher cleaning tablet — the citric acid-based
      kind, not the blue dye ones — will extend spray arm and wash pump life
      significantly. We'll flag which components are most likely to follow the one
      we just fixed so you're not surprised six months later.

  - q: "Do you cover cities near Encino, and how far out do you schedule?"
    a: |
      Encino sits in the center of our San Fernando Valley service zone. Sherman
      Oaks, Van Nuys, and Tarzana are on the regular rotation, and we run west to
      Woodland Hills and Calabasas as needed. South Bay and Orange County
      appointments are available but book a day or two further out. Most Encino
      calls get scheduled within 24-48 hours; same-day is common for morning
      requests. Weekend appointments are limited but do exist — call
      (323) 870-4790 or book online and we'll confirm availability the same day
      you reach out.
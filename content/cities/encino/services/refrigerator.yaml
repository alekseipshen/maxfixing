title: "Encino Refrigerator Repair — Built for Valley Heat & Hard Water"

intro: |
  Balboa Park side of Encino — the blocks between Hayvenhurst and White Oak,
  zip 91316 — sits in a heat pocket that regularly hits 103°F through July and
  August. A Samsung french-door refrigerator running in a west-facing kitchen
  starts working harder than the compressor was ever rated for. That sustained
  thermal load is one reason refrigerator calls spike in Encino every summer:
  the units aren't always broken, they're overwhelmed. The 1960s ranch homes
  along Zelzah Avenue weren't built with modern fridge clearances in mind —
  there's often barely an inch behind the unit, which chokes the condenser fan
  and produces the same "not cooling" symptoms as an actual compressor failure.
  Encino Hills homes in 91436 have their own set of issues: many were remodeled
  with built-in Whirlpool or GE Profile refrigerators, and when the control board
  starts throwing codes, most local appliance shops don't stock those parts on
  the shelf.

localContext: |
  The housing stock in 91316 runs mostly 1950s and 1960s ranch builds, with
  some 1970s tract houses and a handful of newer teardown-rebuilds on the
  north-facing streets above Ventura Boulevard. Older kitchens were designed
  around 24-inch-deep refrigerators; today's standard 36-inch french-door units
  barely fit, which stresses the door gasket from day one and cuts off the rear
  airflow the condenser coil needs. In 91436, Encino Hills properties skew
  larger, and Frigidaire Gallery and Samsung four-door flex models are common in
  kitchens redone in the 2010s. Harder to service than basic top-freezers, but
  they share one vulnerability with every refrigerator in the Valley: LA's hard
  water. This part of the San Fernando Valley runs 300–380 ppm hardness — that
  mineral load destroys ice maker assemblies faster than anywhere near the coast,
  clogs water inlet valves within two or three years, and leaves scale deposits
  on the evaporator drain line that back up into ice buildup on the evaporator
  coil. It's the single most predictable failure pattern we see in this
  neighborhood.

commonProblems:
  - title: "Not Cooling in Valley Heat — Encino's Most Common Summer Call"
    description: |
      A refrigerator that runs but won't cool in July is almost always one of
      three things: a clogged condenser coil, a failed condenser fan motor, or a
      refrigerant leak. In Encino's tight ranch-home kitchens, condenser coils
      collect dust fast — especially on Kenmore and GE top-freezer units pushed
      against the wall with zero clearance. A unit that hasn't had its coils
      cleaned in two years will struggle to hold 37°F when ambient temps are
      triple digits. The fix starts with a coil cleaning and condenser fan check;
      a cracked fan blade or seized fan motor gets replaced same visit — parts
      run $40–80 for Kenmore and GE models, and the job takes under two hours.
      A refrigerant leak is a different scope: that requires EPA 608 handling and
      typically runs $300–500 depending on how much charge was lost. Either way,
      the diagnosis tells you exactly what you're dealing with before any repair
      starts.

  - title: "Ice Maker Failure — Hard Water Kills the Inlet Valve First"
    description: |
      Encino's water supply tests around 350 ppm hardness, and ice maker
      assemblies absorb the full impact. The water inlet valve — a $25–40 part
      on most Whirlpool and Samsung units — builds up mineral deposits in its
      solenoid screen until flow drops below the minimum threshold and the ice
      maker stops cycling. Most homeowners assume the entire ice maker assembly
      is dead, but 60–70% of the time it's just the inlet valve or a blocked
      fill tube. Samsung french-door models common in 91316 remodels sometimes
      throw a "39E" or "84C" error code when the ice maker sensor fails
      separately from the valve — two different parts, two different fixes. We
      stock inlet valves for Whirlpool, GE, Samsung, and Frigidaire in the
      van, so most ice maker calls in Encino are resolved on the first visit.
      A $30 inline filter installed before the ice maker line can extend valve
      life by three to four years in this zip code.

  - title: "Ice Buildup on Evaporator Coil — Defrost System Gone Wrong"
    description: |
      A refrigerator that's warm inside while the freezer has thick ice packed
      against the back wall has a defrost system failure — not a compressor
      problem, despite how it sounds. Either the defrost timer, the defrost
      thermostat, or the defrost heater has failed, and the automatic cycle
      that should clear ice every 8–12 hours isn't running. Ice builds on the
      evaporator coil until the airflow to the fresh food section is completely
      blocked. This is one of the most misdiagnosed calls in the Valley. On GE
      and Frigidaire models from the 2000s through the 2010s, the defrost timer
      and thermostat are inexpensive: $15–45 each, with the full repair typically
      landing under $200. Newer Samsung models with electronic boards are more
      involved — a main control board replacement runs $150–250 in parts alone.
      The job requires manually defrosting the coil with a heat gun before the
      new component goes in, so plan on clearing out the freezer before we arrive.

  - title: "Loud Compressor Noise — Start Relay Swap Before You Give Up"
    description: |
      Compressor noise breaks into two categories. Rattles and vibrations from a
      loose drain pan or a condenser fan blade ticking the housing are minor —
      usually a five-minute fix once the source is located. A clicking or hard-
      starting sound that repeats every few minutes is a different situation.
      The start relay — a small, $10–20 part that clips onto the compressor — is
      what kicks the unit on, and it fails more often than the compressor itself.
      On Amana and Whirlpool top-freezer models from the 2010s, swapping the
      start relay resolves the clicking issue roughly 80% of the time. If the
      relay is fine and the compressor itself has failed, the economics shift: a
      replacement compressor for a mid-range Whirlpool or Frigidaire runs
      $300–500 installed. At that point, if the unit is over 10 years old, we
      walk through a straight cost comparison so the decision makes sense
      financially — not just as a repair bill handed over without context.

  - title: "Water Leaking Onto the Floor — Drain Line Blockage and Gasket Wear"
    description: |
      Water pooling under or inside a refrigerator traces back to two main
      causes: a clogged defrost drain line or a deteriorated door gasket. The
      drain line issue is extremely common in Encino — hard water deposits and
      mold plug the tube that runs from the evaporator pan to the drip tray,
      water backs up, freezes, and eventually overflows onto the floor or into
      the fresh food section. The fix is flushing the drain tube with hot water,
      and in stubborn cases a low-pressure air purge clears it completely.
      For door gaskets on GE and Kenmore models, the paper-slip test tells the
      story: slide a sheet of paper into the closed door seal — if it drops out
      without resistance, the gasket needs replacing. Gaskets run $30–80
      depending on model and take about 30 minutes to swap. A leaking gasket
      left unaddressed forces the compressor to run continuously, which shortens
      its life and adds real money to the monthly electric bill.

faq:
  - q: "How fast can you get to Encino for refrigerator repair?"
    a: |
      Same-day service is available for Encino seven days a week. From our
      Valley base, reaching 91316 or 91436 takes 20–35 minutes depending on
      Ventura Boulevard traffic — we usually take the 101 to avoid surface
      street congestion during midday. Morning calls before 10am nearly always
      land a same-day slot. Afternoon calls typically get a 2–3 hour arrival
      window the same day, and evening slots run until 7pm on weekdays. If your
      refrigerator has completely stopped cooling and food is at risk, call
      (323) 870-4790 and explain the situation — we prioritize no-cooling calls
      over routine service visits.

  - q: "What does refrigerator repair typically cost in Encino?"
    a: |
      The diagnostic visit runs $75–95 and applies toward the repair if you
      proceed. Most common repairs — condenser fan motor, start relay, door
      gasket, defrost thermostat — total $150–300 including parts and labor.
      Ice maker inlet valve replacements usually land at $120–180. Control board
      replacements on Samsung and GE models are the priciest common fix:
      $280–420 depending on part availability. Exact pricing is given before
      any work starts — no surprise totals at the end. There's no separate trip
      fee; the diagnostic covers the visit. Call (323) 870-4790 or schedule
      online for a same-day estimate.

  - q: "Do you service built-in refrigerators in Encino Hills?"
    a: |
      Built-in refrigerators — the flush-mounted kind common in Encino Hills
      kitchen remodels — require removing cabinet panels and sometimes the trim
      kit to reach the compressor or evaporator components. That's a different
      job than pulling a freestanding unit away from the wall. Service is
      performed under contractor license #1136541, and we carry panel-removal
      tools specific to Sub-Zero and Thermador built-ins found in 91436
      properties. For built-in calls, a morning appointment works better —
      these jobs typically run 2–3 hours versus 45–60 minutes for freestanding
      units. Parts for built-in models sometimes require a next-day order from
      our supplier in Chatsworth, but common components are usually available
      same-day.

  - q: "Can you diagnose my Samsung refrigerator's error code?"
    a: |
      Samsung's error code system is actually useful once you know the mapping.
      Code "22E" points to the freezer evaporator fan motor; "33E" is the
      refrigerator compartment fan; "40E" or "41E" usually indicates the ice
      maker sensor or ice fan assembly. "84C" is a compressor communication
      error that can mean anything from a loose wire connector to a board
      failure — that one needs hands-on diagnosis. We carry Samsung-specific
      diagnostic tools and stock OEM parts for the french-door and four-door
      flex models that are standard in Encino remodels. Mentioning your error
      code when you call helps us confirm parts availability before we arrive,
      which usually means fixing it on the first visit.

  - q: "What warranty do you offer on refrigerator repairs in Encino?"
    a: |
      Parts carry the manufacturer warranty — typically 90 days to one year
      depending on the component and brand. Labor is warranted for 90 days on
      the specific repair performed. If the same part fails within that window,
      we return at no additional labor charge. Refrigerant work covers the
      recharge for 90 days, but a new leak developing at a different point in
      the sealed system is a separate failure and not covered under the original
      repair. A refrigerator under 10 years old that gets a start relay, defrost
      component, or inlet valve replaced should realistically run several more
      years without issue. If a unit isn't worth repairing, we say so before
      collecting any payment.

  - q: "Do you also cover Tarzana, Sherman Oaks, and Reseda near Encino?"
    a: |
      Tarzana (91356), Sherman Oaks (91403, 91423), and Reseda (91335) are all
      regular service areas — usually 15–20 minutes from our typical Valley
      starting point. Woodland Hills, Calabasas, and Northridge are covered with
      the same same-day availability. Scheduling works identically to Encino:
      call (323) 870-4790 or book online and pick a window. Studio City and
      North Hollywood are also covered, though same-day availability on peak
      summer days is slightly tighter for those areas. If you're unsure whether
      your address falls in range, call — we'll give you a straight answer on
      timing.
title: "Encino Range Repair — Gas & Electric, Same-Day Service"

intro: |
  Gas smell from the kitchen is never something to sit on. A failing gas valve igniter
  on a Kenmore or GE range — common in the 1960s and 70s ranch homes packed into the
  91316 zip — can leak unburned gas long before a burner ever catches. Encino's housing
  stock runs old. Havenhurst Drive, the Amestoy Estates streets between Ventura Boulevard
  and the 101 — a lot of these kitchens still have the original range, sometimes 30 or
  40 years in service with nothing more than a coil swap. Families near Encino Park call
  us when the rear burner clicks endlessly and never lights, or the oven display throws
  an error code at 6 p.m. on a Tuesday. We cover Encino and the surrounding Valley
  cities with same-day appointments most days. Call (323) 870-4790 if your range won't
  ignite, smells like gas with the burners off, or the oven simply stopped getting hot.

localContext: |
  Encino sits in one of the hotter pockets of the Valley — the 91436 zip around Encino
  Hills sees summer temperatures that push every appliance harder than they'd work two
  miles from the coast. Gas ranges are the default here. Most of the postwar construction
  along Haskell Avenue and Zelzah Avenue was plumbed for gas at the range, dryer, and
  water heater simultaneously, and those same lines are still feeding 50-year-old
  appliances. The flatlands between Ventura Boulevard and the 101 hold a dense stretch
  of 1950s and 60s ranch homes where GE and Whirlpool ranges haven't moved since
  installation. Up in the Encino Hills area (91436), you start seeing more remodeled
  kitchens with Samsung or KitchenAid slide-ins — and those bring their own electronic
  control board headaches. Hard water from LADWP runs around 300–400 ppm in this part
  of the Valley, and it quietly clogs sealed burner ports and ice maker inlets alike
  if nobody's cleaning them regularly.

commonProblems:
  - title: "Burner Won't Ignite — Cracked Igniter or Dead Spark Module"
    description: |
      Clicking endlessly but no flame is almost always a spark igniter issue. On older
      GE gas ranges, the ceramic spark igniter sits right next to the burner cap and
      collects grease and food debris over time. When grease bridges the gap between
      the igniter tip and the burner head, the spark short-circuits and the burner
      stays dark. Cleaning the igniter ceramic with a stiff dry brush sometimes fixes
      it. If the ceramic itself is cracked, or if the spark module isn't sending
      voltage at all, you need a part swap — not a cleaning. The GE WB13K21 igniter
      runs about $25–$40, and with labor, most igniter repairs land between $120 and
      $165. We carry the common GE and Kenmore spark modules on the van. Same-day
      resolution is the norm for this job.

  - title: "Uneven or Lazy Flame — Clogged Burner Ports From Hard Water and Boilovers"
    description: |
      One side of the burner flaring while the other barely catches is a burner port
      clog, almost without exception. LADWP water in the 91316 area runs hard —
      mineral deposits pack into the small holes around the burner cap rim over months
      of use, and food boilovers accelerate it. On a Whirlpool or Frigidaire gas top,
      the burner caps lift straight off — soak them in white vinegar for a few hours,
      clear the ports with a toothpick or thin wire, and the flame evens out. If the
      ports are physically damaged, or the burner base has warped from a sustained
      high-heat spill, the full burner assembly needs replacing. Replacement assemblies
      for Whirlpool WFG505M-series ranges run $45–$80 depending on BTU rating. Labor
      for a two-burner swap with cleaning typically runs $95–$130.

  - title: "Oven Not Heating — Bake Element Burnout or Weak Gas Igniter"
    description: |
      Electric ranges in Encino apartments — the compact Frigidaire and Samsung models
      common in the smaller units off Ventura near White Oak Avenue — often throw an
      F3 or F10 error code right before the bake element fails completely. The element
      sits on the oven floor and burns out in a visible arc spot. On gas ranges, the
      oven igniter (the flat silicon carbide glow bar type) weakens with age — it glows
      orange but never reaches the 2500°F threshold needed to open the gas valve, so
      the burner never lights. Both are clean, same-day swaps. A Samsung bake element
      (DG47-00017A) runs about $30 in parts; gas oven igniters for Kenmore models are
      similar. Total repair including diagnostic and labor: $140–$195 for most units.
      We stock both on the van.

  - title: "Control Panel Dead or Locked — Membrane Keypad or Control Board Failure"
    description: |
      Digital touchpads on Samsung and LG ranges are the most frequent call we get from
      the remodeled kitchens in Encino Hills (91436). The display shows an SE error or
      E-08 and locks the entire range out — sometimes mid-cook. First step is always
      checking whether a power surge or tripped GFCI breaker is mimicking a board
      failure; that costs nothing to rule out. If the membrane keypad itself has
      delaminated, that's a $40–$70 part. A full main control board on a Samsung
      NE59R4321SS or similar slide-in runs $150–$300 depending on model year, plus
      labor — total typically $280–$420. If the board replacement cost exceeds 50% of
      what a comparable replacement range sells for used, we'll say so plainly before
      any parts are ordered.

  - title: "Gas Smell at the Range — Valve Stem Seal or Flex Connector Leak"
    description: |
      Gas odor at the range is the one call treated as an emergency. A faint smell only
      when a burner knob is turned slightly usually points to a worn valve stem seal —
      the brass stem inside the burner valve develops micro-gaps and lets a trace of gas
      pass through. On Kenmore and Amana freestanding ranges from the early 2000s, the
      valve stems are a documented wear point. Gas smell present with all burners off
      shifts the diagnosis to the supply regulator or the corrugated stainless flex
      connector behind the range — the line connecting the range to the hard pipe in
      the wall. That requires a licensed gas technician, not a DIY fix. We carry common
      valve assemblies for GE and Kenmore models and handle regulator replacement in
      the same visit. Call (323) 870-4790 immediately if the smell is strong — don't
      wait for a scheduled slot.

faq:
  - q: "How fast can you get to Encino for range repair?"
    a: |
      Most Encino calls get same-day service. Running the 101 or the 405 from our
      Valley base, Encino is typically 20–35 minutes out depending on traffic. Morning
      slots fill faster, but evening appointments are available most weekdays if you
      can't leave work early. Parking on residential streets in 91316 is straightforward
      — the service van fits without blocking driveways. Call (323) 870-4790 before
      noon and same-day is almost always possible. After noon, next-morning appointments
      are typically open. We confirm the arrival window by text.

  - q: "What does range repair typically cost in Encino?"
    a: |
      Diagnostic visit runs $65–$85, applied to the repair if you move forward. Simple
      fixes — a spark igniter, a bake element, a burner port cleaning — land at
      $120–$180 all-in. Mid-level repairs like a gas valve replacement or a control
      board swap on a Samsung or Frigidaire usually run $220–$380. Gas line work
      (flex connector, regulator) is priced after inspection since access and fitting
      size vary by installation. No number gets added after the estimate — you approve
      the exact figure before any work starts. Schedule an on-site estimate by calling
      (323) 870-4790.

  - q: "Do gas range repairs in Encino require a city permit?"
    a: |
      Standard appliance-level repairs — igniter swaps, bake element replacements,
      burner valve work — don't require permits in the City of Los Angeles. Permit
      requirements apply to gas line modifications: replacing a flex connector with
      rerouting, extending a gas line, or installing a range in a new location. The
      LA Department of Building and Safety (LADBS) requires a mechanical permit for
      new gas appliance installations, including rough-in inspections. Our technicians
      are licensed (contractor #1136541) and handle permitted gas work when the scope
      requires it — we pull the permit, schedule the inspection, and manage the LADBS
      paperwork from start to finish.

  - q: "Can you repair a range that's been converted from natural gas to propane?"
    a: |
      Yes. Propane conversion uses smaller orifices to compensate for propane's higher
      pressure, and the regulator is set to 10–11 inches WC instead of the natural gas
      standard of 7 inches. We see propane-converted ranges occasionally in Encino
      homes with detached guesthouses or outdoor kitchens on a separate tank supply.
      The repair process is the same, but before reassembly we verify orifice size and
      regulator pressure — installing a natural gas part on a propane-converted range
      creates a dangerous overpressure condition. We carry conversion kits and orifice
      sets for GE, Whirlpool, and Kenmore models. Mention the propane setup when you
      call so we bring the correct parts.

  - q: "How long should a gas range last, and when does it make sense to repair vs replace?"
    a: |
      A well-maintained gas range — Whirlpool, GE, Frigidaire — realistically runs
      15–20 years. The repair-vs-replace threshold most technicians use: if the repair
      costs less than 40–50% of a comparable new unit, fix it. A $350 control board
      on a 14-year-old Kenmore is a legitimate gray area and we'll tell you that during
      the diagnostic. Parts availability matters too — most major brands support parts
      out to 10–12 years, some GE and Whirlpool models stretch to 15. After that,
      availability drops sharply and repair costs climb even when the fix is simple.
      We give you an honest assessment before ordering anything.

  - q: "What other cities near Encino do you cover for range repair?"
    a: |
      Coverage runs from Irvine up to Santa Clarita, so the entire Valley is well
      within reach. Sherman Oaks, Tarzana, Woodland Hills, Reseda, Northridge — all
      same-day territory out of the 91316 and 91436 zones. We also cover West LA,
      the Westside cities, South Bay, and Orange County. Scheduling is typically
      1–2 days out at most, often same day for calls that come in before noon. Call
      (323) 870-4790 or schedule online — we'll confirm the appointment window by
      text within the hour.
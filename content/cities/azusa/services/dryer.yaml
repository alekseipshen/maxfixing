title: "Azusa Dryer Repair — San Gabriel Valley's Mountain Foothills"

intro: |
  Hard against the San Gabriel Mountains, Azusa's older ranch-style homes along
  Azusa Avenue pack laundry setups into narrow utility closets where airflow is
  already compromised before the vent even leaves the wall. Add the valley heat
  and a Whirlpool gas dryer that's been running since 2008, and a blown thermal
  fuse is almost inevitable. Call us at (323) 870-4790 — same-day appointments
  available in the 91702 zip most weekdays.

localContext: |
  Most of the housing in 91702 dates from the 1960s and 1970s — single-story
  stucco homes with laundry rooms added as afterthoughts, sometimes in garages
  where summer temps routinely hit 95°F by afternoon. That heat load destroys
  drum roller bearings and belt tensioners faster than anywhere else in the San
  Gabriel Valley. Newer townhome clusters near Citrus Avenue have stacked units
  where vent runs are short but make three or four turns before exiting — a lint
  trap waiting to happen.

commonProblems:
  - title: "Thermal Fuse Failure from Garage Heat (91702 Summer Problem)"
    description: "Garage laundry setups in Azusa's older homes turn into kilns from June
      through September. That ambient heat pushes the dryer's heating element harder
      than it was rated for, and the thermal fuse — the one-shot safety cutoff — blows
      first. Samsung electric dryers are especially common here and their fuses are
      not resettable; replacement is the only fix. We carry them on the truck."
  - title: "Drum Not Spinning — Belt and Tensioner Wear on Older Units"
    description: "A Whirlpool or GE dryer that hums but won't tumble usually has a snapped
      drive belt or a seized belt tensioner pulley. These parts wear out faster in
      high-cycle households, and Azusa's family-oriented neighborhoods run a lot of
      laundry loads. The fix is straightforward — under an hour — but you need the
      right belt spec for the model or it slips again within weeks."
  - title: "Takes Forever to Dry — Lint Buildup in Kinked Vent Runs"
    description: "Townhomes near Azusa Pacific University and along Foothill Boulevard often
      have 90-degree vent bends inside the wall that collect lint faster than straight
      runs. An LG dryer showing a 'd80' or 'd90' vent blockage error code is
      telling you exactly this. Beyond wasted electricity, a clogged blower wheel
      and restricted exhaust vent is a fire risk — not a problem to schedule
      for next month."

faq:
  - q: "How fast can you get to Azusa for a dryer repair?"
    a: "From our San Gabriel Valley base, Azusa is usually 20-30 minutes depending on
      the 210 freeway. Same-day slots are available most days — call (323) 870-4790
      before noon and we can almost always get there that afternoon. Evenings work too."
  - q: "Do you repair Samsung and LG dryers in Azusa?"
    a: "Yes — Samsung and LG are the two brands we see most in this zip. Common fixes
      include heating element replacements on Samsung electrics and moisture sensor
      calibration on LG units that stop mid-cycle. We also work on Whirlpool, GE,
      and KitchenAid regularly."
  - q: "What does a dryer repair typically cost, and is a same-day visit possible?"
    a: "Most dryer repairs in Azusa fall between $120-$250 depending on the part. Thermal
      fuse and belt jobs are on the lower end; control board replacements cost more.
      Emergency same-day service is available — call us and we'll give you a
      straight estimate before touching anything."

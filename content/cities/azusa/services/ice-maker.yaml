title: "Azusa Ice Maker Repair — Hard Water Kills Ice Makers in 91702"

intro: |
  The tap water in 91702 runs around 250 ppm hardness — among the highest readings in the
  San Gabriel Valley. That mineral load doesn't fail an ice maker overnight. It coats the
  water inlet valve's filter screen gradually over two or three years of normal use, cutting
  flow until the module can't fill its mold tray. A Whirlpool or GE that cycled perfectly
  last year starts dropping hollow cubes, then smaller ones, then stops completely. Most
  homeowners assume the refrigerator itself is dying. Usually it's the inlet valve — a $15
  part, plus an hour of labor.

localContext: |
  Much of residential Azusa — the tracts east of Citrus Avenue and the blocks running toward
  San Gabriel Canyon Road — was built in the 1950s and 1960s. Kitchens in those homes are
  tight, and a lot of the original GE and Frigidaire refrigerators have been replaced with
  Samsung French-door or LG counter-depth units that barely clear the original cabinet
  openings. Near Azusa Pacific University along Alosta Avenue, apartment density picks up —
  smaller top-freezer units with basic built-in modules running under heavy daily use.
  Hard water hits both ends of that spectrum equally. We run calls through 91702 several
  times a week, so the local water chemistry and cabinet constraints aren't a surprise.

commonProblems:
  - title: "Scale-Clogged Inlet Valve from 250 ppm Mineral Load"
    description: |
      Azusa municipal water consistently tests around 250 ppm total hardness. Over time,
      calcium builds up inside the water inlet valve — first coating the mesh filter screen,
      then narrowing the solenoid orifice until flow drops below what the ice mold needs.
      Hollow or undersized cubes appear before full stoppage. Whirlpool and GE side-by-side
      models show this failure earlier than Samsung because their valve orifices run narrower
      by design.

  - title: "Frozen Supply Line in Uninsulated 1960s Utility Areas"
    description: |
      Ranch-style homes north of Arrow Highway often have garages or utility alcoves with no
      climate control. On January nights — when Azusa temps occasionally drop to the mid-30s
      — the plastic refrigerator water supply line can freeze solid. Samsung French-door models
      are especially vulnerable because the line routes through the door hinge area. Once
      frozen, the fill valve solenoid fires repeatedly with no water moving through it, burning
      out the solenoid coil within a day or two.

  - title: "Optical Sensor Failure in LG and KitchenAid Assemblies"
    description: |
      LG counter-depth refrigerators and KitchenAid French-door units built between 2016 and
      2021 have a documented issue with the optical ice-level sensor inside the freezer
      compartment module. The sensor falsely reads the bin as full when it's empty, so the
      unit shuts down production entirely — no error code on the display, no obvious symptom
      except the ice stopping. The sensor itself is a $25-40 part, but reaching it means
      pulling the full assembly out of the freezer compartment.

faq:
  - q: "How fast can you get to Azusa for ice maker repair?"
    a: |
      Azusa is on our regular San Gabriel Valley route. From our nearest tech, the drive to
      91702 runs roughly 25-40 minutes depending on traffic on the 210. Same-day slots open
      most mornings. Call (323) 870-4790 to check — if you're near Foothill Boulevard or the
      APU area, we can usually give you a two-hour arrival window the same day.

  - q: "Do you repair Samsung and LG ice makers in these older Azusa kitchens?"
    a: |
      Yes — Samsung and LG are the most common brands we see in the Valley right now, including
      91702. Samsung French-door units usually need inlet valve work or a full module swap.
      LG counter-depth models most often have the optical sensor issue. KitchenAid calls
      come up regularly too, typically the assembly or an inlet screen packed with
      mineral scale from the local water supply.

  - q: "What does ice maker repair cost in Azusa, and is same-day service available?"
    a: |
      Diagnostic visit is $75, credited toward the repair. Inlet valve replacement runs
      $120-190 parts and labor. Full assembly swap is $200-320 depending on brand and
      model year. Samsung and Whirlpool parts typically ride on the van, so same-day repair
      is realistic for most calls in the 91702 area. Emergency same-day slots exist — mention
      it when you call (323) 870-4790 and we'll prioritize accordingly.
title: "Azusa Cooktop Repair — Fixed Before Dinner, 91702"

intro: |
  The kitchens along Azusa's older Rancho-area blocks and the houses climbing toward the San Gabriel foothills run hard every night. Those GE and Samsung cooktops get used — really used — and grease-caked igniter electrodes, burner caps that won't seat right after cleaning, and ceramic tops cracked by a dropped skillet are exactly what we see on repeat. LA hard water makes it worse; mineral scale builds inside gas orifices over time. Call us at (323) 870-4790 and we're usually at your 91702 door within 2 hours.

localContext: |
  Most of 91702 was built between the 1950s and early 1970s — solid ranch-style homes on blocks threading off Azusa Avenue and Foothill Boulevard, kitchens that have been through one or two full remodels but still run on the original gas rough-ins. Counter space tends to be tighter than in newer San Gabriel Valley developments, and cooktops often sit closer to the back wall than the service manual expects. That changes how we access the control valve or the wiring harness — slower to get in, but we know these layouts.

commonProblems:
  - title: "Gas Burner Won't Light — Igniter Electrodes Caked with Grease and Carbon"
    description: |
      Azusa kitchens cook hard, and after months of daily use, grease and carbon pack into the igniter electrode tips and around the ceramic burner caps on GE and Whirlpool gas cooktops. The spark module keeps firing voltage, but the fouled electrode can't produce a clean arc. Cleaning the electrode and cap sometimes buys more time. If the burner still won't light after a proper scrub, the igniter electrode assembly needs to come out — it's past the point of cleaning.
  - title: "Uneven Heat on Electric Cooktops — Failed Surface Element or Infinite Switch"
    description: |
      A Samsung or KitchenAid electric cooktop where one zone runs too hot and another barely warms usually has a degraded surface element or a failed infinite switch controlling that zone. Older homes in 91702 add a second layer — corroded wiring terminals behind the cooktop from years of kitchen heat and steam cycling mean the element gets reduced current even when the switch is fine. The zone never hits full power even cranked to maximum.
  - title: "Cracked Ceramic Glass Top — A Safety Issue, Not Just a Cosmetic One"
    description: |
      Bosch and LG smooth-top cooktops in Azusa crack from thermal shock more often than impact — cold water splashing onto a hot ceramic glass surface is the most common culprit. A hairline crack near a surface element is a live safety risk once the glass panel integrity is compromised. It has to come out and be replaced entirely, not patched. The surface element underneath gets inspected while the panel is off, since it often takes collateral heat damage during the same incident.

faq:
  - q: "How fast can you get to Azusa for a cooktop repair?"
    a: "Service routes cover the San Gabriel Valley every day. Azusa is right off the 210 Freeway — our nearest technician can typically reach your 91702 address within 2 hours of your call. Same-day slots fill up fast, so calling earlier in the day is better. Dial (323) 870-4790 to check availability. Evening appointments are open most weekdays for anyone who can't be home during the day."
  - q: "Do you work on Samsung and GE cooktops, or only higher-end brands?"
    a: "All of them. Samsung, GE, Whirlpool, KitchenAid, Bosch, LG — these are the brands we see most in Azusa. On Samsung glass-top electric models we frequently replace the power control board or the touch panel ribbon connector. GE gas units almost always need igniter electrode work or a control valve cleaning. Bosch ceramic tops usually come down to a surface element swap. Parts for these brands are typically on the van."
  - q: "What does cooktop repair cost and how does the process work?"
    a: "Diagnosis first, quote second, fix third — nothing starts without your sign-off on the price. Common repairs like an igniter electrode replacement, a surface element swap, or a new ceramic glass panel typically run well under $300 parts and labor combined. Same-day service is standard. Call (323) 870-4790 or book online; we'll confirm your 91702 address and get a technician on the schedule."
title: "Azusa Range Hood — Exhaust Repair for Older SGV Kitchens"

intro: |
  Homes along Alosta Avenue and the ranch tracts tucked below the San Gabriel foothills run gas cooktops hard — and the range hoods above them are usually original equipment. That GE or Whirlpool unit from the late 1980s has a blower motor that's never been touched, a grease filter packed solid, and a vent duct that may be partially blocked at the wall damper. Grease smoke doesn't just disappear when the exhaust fails — it goes into your cabinets and walls. The smell lingers for weeks. MaxFixing runs a daily route through 91702 and can usually get there the same day you call.

localContext: |
  Most of the housing stock in Azusa dates from the 1960s and 1970s — ranch-style construction in the flatlands near Azusa Pacific University, postwar bungalows closer to downtown on Azusa Avenue. Kitchens in those homes were built compact, with short duct runs and 6-inch round exhaust paths not designed for modern high-CFM hoods. The original ductwork in zip code 91702 accumulates grease at the bends faster than a straight vertical run, and a blocked duct chokes airflow even when the motor itself is fine.

  Newer builds near the Rosedale development and along Todd Avenue have larger kitchens but often come with mid-range Samsung or KitchenAid hoods installed during construction — equipment that gets heavy use and skips the maintenance cycles it actually needs. The SGV heat doesn't help. Summer temps in Azusa regularly push into the mid-90s, and a hood working against hot ambient air runs its motor harder than it was rated for. That accelerates wear on the capacitor and motor windings faster than you'd see in a coastal zip.

commonProblems:
  - title: "Blower Motor Failure After Years of Grease Contamination"
    description: "Grease doesn't stop at the filter — it migrates past and coats the blower motor windings. On older GE and Broan units common in 1970s Azusa kitchens, that buildup causes the motor to overheat and eventually seize. A cleaning won't fix it at that stage; the motor needs replacement. Most residential hood motors run $90–$160 in parts depending on the model. The symptom is straightforward: the hood turns on, the light works, but the blower either won't spin or makes a brief hum and stops. That hum is the motor trying to start against a seized shaft."
  - title: "Grinding or Rattling Noise That Gets Worse at High Speed"
    description: "A metallic scrape or rattle usually points to the blower wheel — either it's come loose on the motor shaft or the wheel is deformed from heat cycles. Samsung and KitchenAid under-cabinet models both develop this after 8–10 years of use. The noise always gets louder at higher fan speeds, which makes it easy to isolate from other issues. Swapping the blower wheel assembly takes under an hour on most makes. Left alone, a loose wheel eventually damages the motor shaft itself, turning a $60 part replacement into a full motor swap."
  - title: "No Airflow Despite the Motor Running — Blocked Backdraft Damper"
    description: "The backdraft damper at the exterior wall is a common failure point that gets ignored entirely. Grease coats the flap, it stops seating properly, and debris starts building up behind it. Bosch and Whirlpool wall-mount hoods from the 1990s and early 2000s see this constantly in the Valley heat. The hood sounds like it's working but barely moves air — that's the damper, not the motor. Homes on the older blocks near Foothill Boulevard are especially prone to this because the original exterior penetrations were cut at slight downward angles that trap grease before the damper flap. Cleaning or replacing the damper assembly is usually a one-visit fix."

faq:
  - q: "How fast can you get to Azusa for range hood repair?"
    a: "Usually same-day — the SGV route hits Azusa most weekdays, and from Covina it's under 15 minutes. Street parking on residential streets here is easy for the van. Call (323) 870-4790 to check today's open slots; evening appointments are available too. If you're near Azusa Pacific or off Alosta, we can often fit you in before noon."
  - q: "Do you repair Samsung and KitchenAid range hoods?"
    a: "Both are regular jobs in Azusa homes. Samsung slide-in models usually need a control board or fan motor capacitor; KitchenAid under-cabinet units tend to need the blower wheel or the grease filter housing replaced. Bosch, GE, and Whirlpool are on the list too. If the hood is 20-plus years old and needs a motor, we'll tell you honestly whether a repair makes sense versus a replacement — some of the older Broan and NuTone housings are no longer worth sourcing parts for."
  - q: "What does range hood repair typically cost, and do you charge a diagnostic fee?"
    a: "The diagnostic visit is $75, applied toward the repair if you move forward. Most hood jobs — motor swap, damper replacement, light socket repair, or a control board — land between $150 and $280 parts and labor. A full blower wheel and motor replacement on a Bosch or KitchenAid unit runs toward the higher end of that range; a damper cleaning or capacitor swap is usually on the low end. Same-day slots open up most days; call (323) 870-4790 or schedule online and we'll confirm your Azusa window."
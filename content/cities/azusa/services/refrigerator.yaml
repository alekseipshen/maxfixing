title: "Azusa Refrigerator Repair — When Hard Water Kills Ice Makers"

intro: |
  Hard water from the San Gabriel Valley municipal supply does real damage
  to refrigerator ice makers in the 91702 zip — mineral scale deposits inside
  the water inlet valve until it restricts flow completely. That LG french-door
  model sitting in a 1970s kitchen off Alosta Avenue probably started making
  grinding noises six months before the ice maker quit. Azusa summers regularly
  hit 100°F, which means the condenser fan on these units runs nonstop from
  June through September — and components fail faster because of it.

localContext: |
  Azusa's housing stock splits pretty clearly: older ranch-style homes from
  the 1950s and 1960s near the Azusa Canyon Road corridor, and apartment
  buildings plus newer townhomes clustered around Azusa Pacific University.
  The 91702 zip has both — compact kitchens with counter-depth refrigerators
  jammed against tile walls, and full-size side-by-sides in detached homes
  with more room to work. Pulling a unit in one of those older ranch kitchens
  takes extra time because the floor plan wasn't built with appliance
  clearance in mind.

commonProblems:
  - title: "Ice Maker Failure from San Gabriel Valley Hard Water"
    description: "Azusa tap water runs hard — high mineral content that deposits
      calcium scale inside the water inlet valve and ice maker assembly over
      time. Samsung french-door models are especially prone because the ice
      maker sits in the door and the water line runs a longer path. Once the
      valve is blocked, flushing rarely fixes it — the valve needs replacing."
  - title: "Refrigerator Not Cooling When Temps Spike in the SGV"
    description: "When ambient temperatures hit 95°F in the valley, the
      compressor runs almost continuously. Whirlpool side-by-sides from the
      mid-2000s frequently develop condenser fan motor failure under sustained
      load — the fan stops, the compressor overheats, and cooling drops off
      entirely. Cleaning condenser coils every six months extends the life of
      these units significantly."
  - title: "Water Pooling Under the Refrigerator"
    description: "Most leaks trace back to two places: a cracked door gasket
      letting warm air in and creating excess condensation, or a blocked
      defrost drain backing up onto the floor. GE Profile and KitchenAid
      models with bottom freezer drawers are frequent culprits for defrost
      drain clogs here, especially in older homes where daily temperature
      swings are more pronounced."


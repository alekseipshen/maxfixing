title: "Azusa Freezer Repair — Built for San Gabriel Valley Heat"

intro: |
  Summers up against the San Gabriel Mountains hit hard — by July, outdoor temps
  around Azusa push 95°F and anything with a compressor is working overtime. That
  Samsung chest freezer sitting in the garage isn't engineered for that kind of
  sustained ambient heat load. Once it starts struggling to hold 0°F, the evaporator
  coil is usually the first thing to ice over or quit entirely.

  Freezers fail differently here than they do in San Diego or even Pasadena. The
  combination of valley heat, dusty condenser coils, and older garage wiring creates
  failure patterns that show up on a predictable schedule — late July through
  September is when call volume spikes. If the food's soft and the cabinet's warm,
  don't wait it out.

localContext: |
  Most of Azusa sits in the 91702 zip, with housing that ranges from 1950s bungalows
  near Azusa Avenue to 1980s and 90s tract homes climbing the hillside streets toward
  the 210 freeway. Older properties tend to park standalone freezers in detached,
  uninsulated garages — spaces that regularly hit 110°F in August. That compressor
  and condenser fan take the abuse first, and units fail two to three years earlier
  than the same model would in a climate-controlled kitchen.

  The Citrus Crossing corridor and older neighborhoods off Foothill Boulevard tend to
  have original kitchen layouts — compact galley kitchens with freezers shoved into
  utility rooms or tight garage alcoves. Access isn't always easy. Built-in KitchenAid
  French-door units from the early 2010s are common in the newer hillside developments
  and require a full door panel removal just to reach the evaporator housing. We carry
  the right tools for those jobs. Condensate drain clogs are another headache specific
  to this area — the limestone content in San Gabriel Valley water accelerates mineral
  deposits inside drain tubes faster than almost anywhere else in LA County.

commonProblems:
  - title: "Freezer stops holding temperature during summer heat spikes"
    description: "Garage-stored units in Azusa hit their thermal limits when outdoor temps
      climb past 90. The compressor runs continuously, overheats, and eventually trips
      a thermal cutout. Whirlpool chest freezers are especially common in this area —
      if yours is warm to the touch but not cooling, the compressor or condenser fan
      motor is the likely failure point, not a refrigerant leak. Condenser coils caked
      with garage dust compound the problem significantly; a coil clean-out alone
      sometimes restores normal operation without any parts replaced."
  - title: "Heavy frost buildup choking airflow inside the cabinet"
    description: "Azusa's summer humidity plus a cracked door gasket lets warm air sneak in
      on every cycle. That moisture freezes in layers directly on the evaporator coil
      until airflow stops completely. LG upright freezers with bottom-mounted evaporators
      see this constantly — the defrost timer or defrost heater needs replacement before
      the coil can clear and the unit recovers normal temps. Some LG models throw an
      FF error code on the display before the frost buildup becomes critical. If you're
      seeing that code, the evaporator fan motor is likely already seized."
  - title: "Compressor clicking and failing to start"
    description: "Older GE and Frigidaire freezers from the late 2000s show up regularly
      with start-relay failures. The relay itself is inexpensive, but repeated clicking
      with no cooling usually means the compressor is at end-of-life. A shorted start
      relay will sometimes leave a burn smell near the back panel — that's a different
      failure path than a compressor seize and worth distinguishing before parts are
      ordered. First visit includes a full diagnostic — you'll know exactly what failed
      and what the repair cost looks like before anything is committed."

faq:
  - q: "How fast can you get to Azusa for a freezer repair?"
    a: "Coverage on the 91702 zip is solid — Azusa sits right on our San Gabriel Valley
      route off the 210. Most calls get same-day service, usually within 2 hours of
      booking. Call (323) 870-4790 and we'll confirm a window on the spot. Evening
      slots are available for households that can't be home during the day."
  - q: "Do you repair Samsung and LG freezers in this area?"
    a: "Samsung and LG are two of the most common brands we pull calls for in Azusa.
      Samsung units frequently need drain pump replacements or ice maker assembly work —
      the DA97 ice maker kit is one of the parts that rides in the van daily. LG
      freezers usually come in with failed evaporator fans or a burned control board.
      Both brands are stocked for same-day repair in most cases."
  - q: "What does a freezer diagnostic cost, and can you fix it the same day?"
    a: "Flat-rate diagnostic on the first visit. Most repairs — door gasket swap,
      defrost heater, start relay — run $120–$250 parts and labor combined. Common
      Whirlpool, GE, Samsung, and LG parts ride in the van daily, so same-day fix
      is realistic for the majority of calls. Schedule at (323) 870-4790."
  - q: "My freezer is in a hot garage — is that repairable or should I replace it?"
    a: "Depends on the unit's age and what failed. A condenser fan motor swap on a
      5-year-old Whirlpool chest freezer makes sense. A compressor replacement on a
      12-year-old Frigidaire in a garage that hits 110°F every August probably doesn't.
      The diagnostic visit gives you the real numbers — repair cost versus replacement
      cost — so you're not guessing. Most Azusa homeowners want that honest answer
      before spending anything, and that's the conversation we have on every first call."
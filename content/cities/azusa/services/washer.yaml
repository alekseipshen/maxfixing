title: "Azusa Washer Repair — Hard Water & Heat Kill These First"

intro: |
  Azusa sits right at the base of the San Gabriel Mountains, and the water here
  runs hard — consistently above 300 ppm through the Azusa Light & Water system.
  That mineral load destroys water inlet valves and door gaskets on Samsung and LG
  front-loaders faster than most homeowners expect. Families near Foothill Boulevard
  are often shocked to find their 4-year-old machine already failing a component
  that should last eight.

localContext: |
  Most of the housing stock in the 91702 zip code was built between the 1950s and
  1980s — think post-war ranch homes and older apartment complexes along Azusa
  Avenue and Alosta Avenue. Laundry rooms in these buildings are often tight,
  sometimes off a hallway or in a converted garage. That means front-loaders get
  pushed against walls with poor ventilation, and top-loaders on uneven concrete
  slabs vibrate harder than they should. The combination of age, heat, and
  compressed spaces accelerates wear on drum bearings and drive belts.

commonProblems:
  - title: "Mineral Buildup Killing Water Inlet Valves"
    description: "Azusa's hard water deposits calcium inside the water inlet valve screens
      over time, restricting flow until the machine won't fill or fills too slowly.
      Samsung top-loaders and LG front-loaders both show this — the machine throws
      an IE or 4E error code. Replacing the valve solves it, but the root cause is
      the water quality, not the machine."
  - title: "Spin Cycle Failure from Worn Drum Bearings"
    description: "Older Whirlpool and GE top-loaders in these 1960s and 70s-era homes have
      spin baskets that have been running for decades. The drum bearing wears out
      and the machine starts making a grinding noise before the spin cycle stops
      working entirely. Left too long, a bad bearing can destroy the outer tub —
      turning a $150 repair into a $600 one."
  - title: "Drain Pump Clogs from San Gabriel Valley Dust"
    description: "The foothills bring real dust — especially during dry Santa Ana wind
      events. That fine particulate gets into laundry and eventually clogs the drain
      pump filter on front-loading KitchenAid and Bosch units. The machine stops
      mid-cycle with standing water in the drum. Most owners don't know the pump
      filter exists, let alone that it needs cleaning every few months."

faq:
  - q: "How fast can you get to Azusa for washer repair?"
    a: "From our San Gabriel Valley coverage area, Azusa is typically a 20-30 minute
      drive. Same-day appointments are available most days — call us at
      (323) 870-4790 before noon and we can usually get there the same afternoon.
      Evening slots available too."
  - q: "Do you repair Samsung and LG washers in Azusa?"
    a: "Yes — Samsung and LG front-loaders are the most common calls we get in the
      91702 area. On Samsung units we frequently replace control boards and water
      inlet valves. On LG, it's usually the drain pump or door latch assembly.
      Whirlpool and GE top-loaders as well."
  - q: "What does a washer repair cost in Azusa, and how does the process work?"
    a: "Most repairs fall between $120-$280 depending on the part. Diagnostic is
      $65 and goes toward the repair if you proceed. For emergencies — like a
      flooded laundry room from a cracked inlet hose — we have priority slots.
      Schedule online or call (323) 870-4790."

title: "Azusa Dishwasher Repair — Hard Water & Aging Pipes, Fixed"

intro: |
  Foothill Boulevard cuts right through the older residential blocks of 91702, and a
  lot of those mid-century homes are still running original plumbing that leaves heavy
  mineral deposits in every appliance connected to the water line. That calcium
  buildup is the number-one reason a Bosch 300 Series or a Whirlpool tub-style unit
  stops cleaning glasses properly here. We fix dishwashers across the San Gabriel
  Valley, including Azusa, usually same-day.

localContext: |
  Most of the housing stock in zip code 91702 dates to the 1950s and '60s — post-war
  tract homes with kitchens that were retrofitted once or twice since. Tight under-counter
  clearances are common, especially near Dalton Avenue and the older blocks south of
  Foothill. Samsung and LG slide-in units popular with homeowners who upgraded in the
  last decade sit in cabinets that weren't built for their footprint, which causes
  alignment problems with the door latch assembly over time.

commonProblems:
  - title: "Clogged Spray Arms From San Gabriel Valley Hard Water"
    description: "Azusa's municipal water tests at hardness levels that leave calcium crust inside
      spray arm nozzles within a few years of regular use. The jets lose pressure, dishes
      come out with white film or food still stuck on. On a Bosch 500 Series, the lower
      spray arm is a common first failure point — it takes about 20 minutes to clear or
      replace if you have the right tool to unthread it."
  - title: "Water Not Draining — Drain Pump Failures in Older Installs"
    description: "Standing water at the bottom of the tub usually means the drain pump has seized
      or the filter housing is so packed with debris it can't pass water. GE and Frigidaire
      units from the mid-2010s are especially prone to this in homes with older garbage
      disposal connections — the knockout plug never got removed during the original install,
      and the pump fights against back-pressure for years until it burns out."
  - title: "Detergent Dispenser Stuck or Not Opening Mid-Cycle"
    description: "A stuck detergent dispenser almost always comes down to either a failed bi-metal
      release or a warped door spring — both cheap parts, but the diagnosis matters. On
      KitchenAid units, this often throws no error code at all, so homeowners assume the
      dishes just need a different soap. The real fix is replacing the dispenser door
      assembly, which runs about 30 minutes of labor. Call us at (323) 870-4790 and we
      can confirm the part is in stock before we drive out."

faq:
  - q: "How fast can you get to Azusa for dishwasher repair?"
    a: "We run the 210 corridor regularly and can usually reach Azusa within 2 hours of
      your call. Parking is straightforward in most residential areas off Azusa Avenue.
      Schedule online or call (323) 870-4790 — we have evening slots available most
      weekdays."
  - q: "Do you repair Samsung and LG dishwashers in the Azusa area?"
    a: "Yes, both are common in the 91702 zip and we stock parts for them. Samsung
      LC and 4C error codes usually point to a faulty water inlet valve or a float switch
      stuck in the raised position. LG units often come in with control board failures
      after power surges — we carry replacement boards for the most common models."
  - q: "What does a dishwasher repair typically cost in Azusa?"
    a: "Diagnostic visit is a flat fee, applied toward the repair if you proceed. A drain
      pump swap or spray arm replacement usually runs $120–$180 in parts and labor. Door
      latch assemblies are on the lower end. We give you the full quote before touching
      anything — same-day service available, including emergency calls if the unit is
      leaking."

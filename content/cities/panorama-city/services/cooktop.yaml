title: "Panorama City Cooktop Repair — Gas Igniters, Ceramic Glass & More"

intro: |
  The block pattern in 91402 tells you a lot about what's inside the kitchens. Panorama City's
  residential grid — built out mostly between 1952 and 1968 — holds thousands of gas cooktops
  that have been clicking, lighting, and sometimes stubbornly not lighting ever since. Near
  Roscoe Boulevard and east toward Van Nuys Boulevard, it's common to find Kenmore and GE gas
  units original to the build, or swapped in during the 90s and never serviced again. That
  Samsung freestanding range in the apartment off Nordhoff Street might flash an error and
  refuse to spark — nine times out of ten that's a failed igniter electrode or a cracked burner
  cap, not a reason to buy a new range. Cooktop problems in this neighborhood get deferred
  longer than they should, partly because finding a tech who'll actually show up same-day in
  the Valley is harder than it sounds. We cover Panorama City regularly, and most repairs wrap
  in a single visit.

localContext: |
  Panorama City sits almost dead center in the San Fernando Valley, and the housing mix in zip
  code 91402 leans heavily toward post-WWII tract homes and mid-century apartment complexes
  running along Van Nuys Boulevard and Arleta Avenue. A lot of these kitchens haven't been
  fully remodeled since the Carter administration — drop-in Whirlpool and Frigidaire cooktops
  from the late 70s and early 80s are genuinely common, especially in the rentals south of
  Parthenia Street. The Valley's summer heat is brutal on appliances: gas cooktops near poorly
  ventilated kitchen windows accumulate grease buildup faster than you'd expect, clogging
  burner ports and starving the flame. Older units in multi-family buildings — 91402 has a high
  density of duplexes and fourplexes, and the block pattern continues into neighboring 91331
  toward Arleta — often share gas lines with dated shutoff valves, which complicates any repair
  if the tech isn't familiar with the neighborhood's plumbing vintage. Kaiser Permanente's
  Panorama City campus on Roscoe sits about a mile from some of the densest residential blocks
  we service.

commonProblems:
  - title: "Gas Burner Won't Ignite — Electrode Failure on Kenmore and GE Units"
    description: |
      The most frequent call out of Panorama City is a gas burner that clicks but won't catch
      a flame. The igniter electrode — a small ceramic-tipped component that generates the spark
      to light the gas — either cracks outright or gets coated in grease and carbon so the arc
      can't jump. On Kenmore and GE gas cooktops from the late 1980s through the early 2000s,
      this is almost a scheduled failure at the 15-to-20-year mark. Fix is straightforward:
      swap the electrode assembly and clean the burner cap and burner head while access is open.
      Parts run $15–$40 depending on model, and the repair takes under an hour on-site. Ignoring
      it means lighting manually until someone forgets and lets gas pool — not a risk worth
      taking in a crowded apartment kitchen.

  - title: "Cracked Ceramic Glass Surface on Samsung and Frigidaire Electric Cooktops"
    description: |
      Ceramic glass cooktops are standard in the newer apartment stock along Van Nuys Boulevard,
      and that smooth glass surface cracks more easily than most renters expect. A heavy cast-iron
      pan dropped from even six inches can do it. On Samsung and Frigidaire smooth-top models, a
      cracked surface isn't just cosmetic — moisture entering the crack can cause the heating
      element below to arc, which is a genuine hazard. Replacement ceramic glass panels for
      common models run $120–$250 for the part; labor adds $80–$120. Total on-site time is
      roughly 90 minutes. One honest caveat: if the crack runs through the primary heating
      element zone and the cooktop is over ten years old, a full replacement may pencil out
      better than a repair — we'll tell you straight when that's the case.

  - title: "Uneven Heat Output — Clogged Burner Ports and Failing Gas Valves"
    description: |
      A lopsided or lazy flame usually isn't a gas pressure problem. In Panorama City kitchens —
      where real, daily cooking is the norm — grease builds fast inside the small ports ringing
      the burner head. A thorough port cleaning and burner cap soak fixes it about 70% of the
      time. The other 30% points to a failing gas valve, specifically the valve seat that meters
      flow to that individual burner. Whirlpool and Amana gas cooktops from the 2005–2015 range
      develop this pattern regularly. Replacement gas valves run $45–$90 for the part. Work
      touching the gas valve falls under contractor license #1136541, and we pull the LADBS
      permit when the scope requires it. Budget $150–$250 all in for a gas valve replacement,
      done correctly.

  - title: "Knob Malfunction — Stripped Shafts and Dead Ignition Switches"
    description: |
      Cooktop knobs take daily abuse. On Frigidaire and Whirlpool gas cooktops, the plastic knob
      shaft strips or the D-shaped valve stem snaps clean, leaving a knob that spins freely
      without doing anything. Sometimes the fix is a $12 replacement knob. If the valve stem
      itself broke inside the body, that means pulling the cooktop — add an hour of labor. The
      ignition switch, the component the knob physically depresses to fire the spark module, also
      wears out on its own timetable. Replacing just that switch runs $30–$60 in parts. On older
      Kenmore units with mechanical ignition, a failed spark module causes all burners to click
      continuously even with knobs at off — that's a $40–$70 part fix. Knob and ignition switch
      repairs generally land between $95 and $200 total.

  - title: "Burnt Terminals and Loose Wiring in Drop-In Electric Cooktops"
    description: |
      Drop-in electric cooktops in Panorama City's older housing — buildings from the 1960s
      where 240V wiring may not have been touched since Nixon — sometimes develop burnt or
      corroded terminal connections behind the unit. On GE and Frigidaire drop-in models, the
      heating element terminal blocks degrade over decades, causing one or more burners to work
      intermittently or fail completely. This isn't always the cooktop's fault; sometimes the
      issue originates at the junction box upstream. We test both before quoting anything. A
      burnt terminal block on the cooktop itself runs $50–$90 in parts plus labor. If the wall
      wiring needs attention, that becomes a separate electrical scope. Either way, 240V
      connections are not a DIY diagnostic — the risk is real and the failure mode is fast.

faq:
  - q: "How fast can you get to Panorama City for a cooktop repair?"
    a: |
      Same-day service is available most days. From our San Fernando Valley base, Panorama City
      is a 20–35 minute drive depending on traffic on the 405 or Van Nuys Boulevard. The van
      carries common parts for Kenmore, GE, Whirlpool, Frigidaire, and Samsung cooktops, so
      most repairs wrap on the first visit without a parts run. Evening slots are available for
      households that can't manage a midday window. Call (323) 870-4790 to check today's
      opening — we can usually place you same-day or first thing next morning.

  - q: "What does cooktop repair in Panorama City typically cost?"
    a: |
      Most cooktop repairs fall between $95 and $370 depending on the failure. A gas igniter
      electrode swap runs $100–$150 all in. Ceramic glass surface replacement on a Samsung or
      Frigidaire electric model lands at $200–$370. A gas valve replacement is typically
      $150–$250. The on-site diagnostic visit is $65, which gets credited toward the repair cost
      if you proceed. No quote is given until we've diagnosed the actual problem — no guessing,
      no surprise line items. Call (323) 870-4790 or schedule online to book a diagnostic slot.

  - q: "Do cooktop repairs in Panorama City require a permit from the City of LA?"
    a: |
      Like-for-like component repairs — swapping a burner, electrode, heating element, or control
      knob — don't require a permit under LADBS rules. Permits come into play when work involves
      modifying a gas line, rerouting wiring, or changing the electrical service configuration.
      We handle all of that paperwork under contractor license #1136541 and coordinate the LADBS
      inspection so you're not chasing the city yourself. Permit fees for appliance-related gas
      or electrical work in Los Angeles typically run $75–$150 depending on scope.

  - q: "Can you repair both gas and electric cooktops, including induction models?"
    a: |
      Both gas and electric, yes — including induction. Gas work covers igniter electrodes, spark
      modules, gas valves, burner caps, and sealed-burner head assemblies common on mid-2000s
      Whirlpool and Kenmore models. Electric and induction diagnostics are a different skill set:
      we test heating elements, surface sensors, control boards, and terminal connections
      separately. Induction cooktops — like the GE Profile or Samsung induction units throwing
      an E1 or E6 error code — require inverter board diagnostics that most general appliance
      shops skip entirely. We carry the test equipment for it.

  - q: "What warranty covers a cooktop repair from MaxFixing?"
    a: |
      Parts carry manufacturer warranty — typically 90 days to one year depending on the
      component. Labor is warranted for 90 days from the service date. Same failure recurs
      within that window, we come back and handle it at no charge. On ceramic glass surface
      replacements, the new panel carries the OEM warranty against manufacturing defects.
      Realistically, a correctly repaired gas cooktop in a Panorama City home should run another
      8–12 years before you're genuinely weighing end-of-life — especially on the heavier
      Kenmore and Whirlpool units from the late 90s and early 2000s that were overbuilt by
      today's standards.

  - q: "Do you service areas near Panorama City — Arleta, North Hills, Van Nuys?"
    a: |
      Panorama City is central to our San Fernando Valley coverage zone. Arleta (91331), North
      Hills (91343), Van Nuys (91405), and Pacoima are all regular stops. Scheduling in this
      corridor is typically same-day or next-morning. If you're near the 118 or closer to
      Mission Hills, call (323) 870-4790 and we'll confirm a slot — no travel surcharge for
      anywhere in the Valley. Coverage runs from Irvine up through Santa Clarita, so the
      mid-Valley cities are never a stretch for us.
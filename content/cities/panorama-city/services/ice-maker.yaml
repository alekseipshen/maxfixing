title: "Panorama City Ice Maker — Hard Water Kills Fill Valves Fast"

intro: |
  Van Nuys Boulevard runs right through the heart of 91402, flanked by
  apartment complexes and stucco duplexes built in the 1960s — a lot of
  those kitchens are still running older Frigidaire side-by-sides or GE
  top-freezer units with ice makers that haven't been touched since the
  appliances were installed. Hard water is a real problem here; LADWP
  mineral content for this part of the Valley runs high enough that water
  inlet valves and fill lines clog within 18-24 months if nobody's
  flushing the system. Over near the Arleta border along Dronfield Avenue,
  the pattern repeats — Samsung french-door models throwing hollow or
  misshapen ice, not because the compressor is failing, but because a
  partially blocked fill valve can't push enough water into the ice mold
  to form a complete cube. Most of the time that's a $120-180 fix, not a
  refrigerator replacement. Call us at (323) 870-4790 and we can usually
  be there the same day.

localContext: |
  The bulk of housing in 91402 and the adjacent 91401 zip (Van Nuys east
  side) went up between 1950 and 1975. That era of construction means
  compact kitchens, tight refrigerator alcoves with minimal clearance, and
  in many of the older apartment buildings near Osborne Street, no
  dedicated ice maker water line — just a saddle valve tapped onto the
  nearest cold supply. Saddle valves are slow failures waiting to happen;
  they restrict water flow progressively until your Whirlpool or Kenmore
  ice maker produces half-size cubes or quits altogether. The single-family
  homes off Roscoe Boulevard closer to Panorama Mall tend to run larger
  25-27 cubic foot refrigerators with full dispenser systems and more
  components in the ice-making circuit. On top of the hard water problem,
  Panorama City temperatures regularly hit 100-104°F through July and
  August — that sustained heat pushes freezer compartments to work harder,
  which stresses the ice maker assembly and the mold thermostat that
  controls harvest cycle timing. None of this is unusual; it's just what
  the environment does to these machines.

commonProblems:
  - title: "Fill Valve Clogged by 91402's Hard Mineral Water"
    description: |
      Panorama City tap water runs around 280-320 parts per million in
      dissolved minerals — calcium and magnesium deposits build up inside
      the water inlet valve over 12-24 months until flow drops below the
      threshold needed to fill the ice mold completely. The result is small,
      hollow, or crescent-shaped ice instead of full cubes. On a Whirlpool
      or Maytag side-by-side, the inlet valve is typically a dual-solenoid
      unit — one port for the ice maker, one for the door water dispenser —
      and OEM replacements run $35-65 for the part itself. Total repair
      including labor usually lands at $110-160. Adding an inline water
      filter upstream of the valve extends the next one's life considerably;
      we can install one at the same time for another $25-35 in parts.

  - title: "Frozen Water Supply Line Inside the Freezer Compartment"
    description: |
      It sounds counterintuitive, but frozen water lines are more common in
      hot climates, not less. A refrigerator pushed against a warm exterior
      wall — which describes a lot of 1960s Panorama City stucco construction
      — runs its freezer colder than the set temperature trying to compensate
      for ambient heat gain. The thin plastic supply line feeding the ice
      maker freezes solid inside the freezer door mullion or at the rear
      compartment wall. GE and Samsung french-door models route that line
      through the door frame, which is exactly where it freezes first.
      Thawing takes about 20 minutes with a heat gun and patience, but if
      it refreezes within a week, the freezer temperature control board or
      thermostat needs calibration or replacement. Diagnostic visit plus
      thaw runs $85-110; if a part needs swapping, add $40-80.

  - title: "Ice Maker Module Failure — Harvest Cycle Stops Completely"
    description: |
      The ice maker module controls the harvest cycle, mold heater, and ice
      level arm sensor. When it fails, ice production stops entirely — the
      arm sensor reads "full" with an empty bin, or the mold thermostat
      never triggers a harvest sequence. Frigidaire ice makers in Panorama
      City apartments without central AC cycling all summer wear these
      modules faster than the same unit in a cooled house; the electronics
      run hotter and the harvest cycles are more frequent. Replacement
      modules for common Frigidaire and GE platforms run $45-90 for the part;
      full repair with labor typically comes to $130-195. Parts for most
      common platforms are available same-day or next morning through our
      Pacoima supply contact. Our contractor license covers all repair
      work in LA County.

  - title: "Water Pooling Under the Fridge — Ice Maker Drain Issue"
    description: |
      Standing water under or behind the refrigerator often has two sources
      working together: a slow ice maker fill line leak and a clogged defrost
      drain. In older Panorama City apartments where kitchen flooring isn't
      level, even a small drip migrates toward the cabinet base or the
      adjacent unit. Samsung and LG french-door models with bottom-mount
      freezers are particularly prone — the defrost drain sits low and
      accumulates debris, and when it backs up, overflow water routes into
      the ice maker compartment. A cracked fill cup, a loose compression
      fitting on the water supply line, or a fouled drain tube all look the
      same from the outside. Diagnosis takes 30-45 minutes. Parts for the
      drain assembly or fill cup are inexpensive ($15-40); labor to pull the
      unit out of a tight apartment kitchen alcove adds time. Budget $95-165
      total.

  - title: "Auger Motor Grinding — Ice Forms but Won't Dispense"
    description: |
      Ice production is normal, but nothing comes out of the door dispenser.
      That's usually the auger motor or the ice chute flap assembly — not the
      ice maker itself. The auger is a spiral drive that pushes ice from the
      storage bin to the dispenser chute; when it seizes from a long idle
      period or a chunk of fused ice jams the mechanism, you hear grinding
      or complete silence instead of dispensed ice. Kenmore and Whirlpool
      side-by-sides from the 2010s are the most common culprits in Panorama
      City rental units. Auger motor replacement runs $65-100 for the part;
      total repair $150-220. Worth diagnosing before assuming the entire ice
      maker assembly needs replacing — in many cases the ice-making components
      have years of life left and only the drive side is failed.

faq:
  - q: "How fast can you get to Panorama City for ice maker repair?"
    a: |
      Same-day service is the standard for 91402 calls. Panorama City sits
      right off the 405/118 interchange, close to our regular Van Nuys and
      Arleta routes — drive time is rarely more than 20-30 minutes from
      wherever we're finishing a prior job. Street parking on most residential
      blocks here isn't an issue for a service van. Call (660) 999-9960 and
      we'll confirm a two-hour arrival window; evening weekday slots are
      available too if daytime doesn't work. Most jobs wrap up in 60-90
      minutes once we're on-site.

  - q: "What does ice maker repair in Panorama City typically cost?"
    a: |
      Most repairs fall between $110 and $220, covering the common failures:
      fill valve swap, frozen water line, module replacement, or auger motor.
      What pushes cost higher is access — pulling a refrigerator from a
      tight apartment kitchen alcove with no clearance takes more time than
      an open garage layout. Unusual parts for older GE or Frigidaire models
      sometimes need to be ordered, which adds a day. The quote is firm
      before any work starts — no estimates that balloon mid-job. Call
      (660) 999-9960 for a same-day diagnosis and exact price.

  - q: "Do I need a permit for ice maker water line repair in Panorama City?"
    a: |
      Replacing an ice maker water line connection — swapping a failing saddle
      valve for a proper compression tee, for instance — falls under
      appliance repair scope and doesn't require a permit under LA City code.
      If the work expands into a full supply line reroute behind finished
      walls, that changes the picture, but 90% of what we handle stays
      well inside the appliance-scope boundary. Our contractor license
      covers appliance repair work across LA County jurisdictions, including
      Panorama City. Landlords and property managers can request a detailed
      service report — we issue one on every call.

  - q: "Can you repair ice makers in apartment units, not just houses?"
    a: |
      Apartment calls make up a large share of the Panorama City work.
      The 1960s and 70s-era complexes off Van Nuys Boulevard and near the
      Panorama Mall area have compact kitchens where pulling a refrigerator
      requires moving pads and appliance sliders to avoid tearing vinyl
      flooring or scraping cabinet surrounds — we bring both. Tenants and
      landlords both book us; if building management runs a maintenance
      request process or needs to be looped in before access, we're used
      to working within that. Just mention the situation when you call
      (660) 999-9960 and we'll coordinate accordingly.

  - q: "How long will an ice maker repair last in this climate?"
    a: |
      A fill valve or harvest module replacement on an otherwise solid machine
      should hold 5-8 years — assuming the hard water issue gets addressed.
      Changing the fridge water filter every six months or installing an
      inline filter on the supply line makes a real difference for longevity.
      Every repair comes with a 90-day parts and labor warranty. On a
      Whirlpool or Kenmore side-by-side that's 15-plus years old and already
      had multiple repairs, honest advice usually points toward replacement
      rather than stacking another $175 fix — we'll tell you which situation
      you're actually in before you commit to anything.

  - q: "Do you cover nearby cities outside Panorama City?"
    a: |
      From 91402 we regularly run calls to Arleta, Pacoima, North Hills,
      Van Nuys, Sun Valley, and east into Sylmar — the whole 91402, 91331,
      and 91405 corridor is regular territory. Scheduling is usually
      same-day or next morning; the booking window is two hours, not
      a vague "sometime between 8 and 5." Call (660) 999-9960 or schedule
      online and we confirm the window within a few minutes during business

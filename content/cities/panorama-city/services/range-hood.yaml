title: "Panorama City Range Hood Repair — Valley Heat Demands More"

intro: |
  The post-WWII tract homes packed between Roscoe Boulevard and Parthenia
  Street weren't designed for the cooking loads people put on them today. A
  lot of these kitchens in 91402 are running GE or Kenmore range hoods that
  went in during a remodel 15 years ago — and the blower wheel inside hasn't
  been cleaned once since. Grease accumulates on the baffle filter, then
  migrates into the motor housing, and eventually the fan either seizes or
  starts making a noise like a card stuck in a bicycle spoke. Near the
  Panorama City Shopping Center corridor, we see this constantly in the rental
  units — landlords patch and move on, tenants deal with the smoke. Over in
  Arleta, homeowners tend to hold onto appliances longer, which means we're
  servicing range hoods that are 20-plus years deep and running on borrowed
  time. Either way, the fix usually takes one visit.

localContext: |
  Most of the housing in Panorama City proper dates from the late 1940s
  through the mid-1960s — single-story stucco homes, some duplexes, and a
  stretch of garden-style apartments along Van Nuys Boulevard. The original
  ductwork in these builds was sized for smaller hoods with lower CFM ratings;
  swap in a modern 400-CFM unit without upsizing the duct and you've got
  turbulence noise and backpressure that kills motors early. Zip code 91402
  has the densest concentration of these narrow duct runs, and 91331 (Arleta,
  just east) has a nearly identical profile — lots of 1950s homes where the
  vent terminates through the soffit rather than through the roof, creating
  short-run restrictions that choke airflow. The Valley's hard water doesn't
  hit range hoods as directly as it hits dishwashers, but steam and grease
  combined in these compact kitchens accelerate filter clogging faster than
  any manufacturer's cleaning schedule assumes. High-heat gas cooking — very
  common throughout this corridor — puts the baffle filter and blower wheel
  under more sustained stress than most hoods are rated to handle long-term.

commonProblems:
  - title: "Blower Wheel Seized from Grease Buildup — Fan Stops Moving Air"
    description: |
      The blower wheel is the part that actually moves air, and it's the first
      casualty of a neglected grease filter. Once the filter saturates, grease
      bypasses it and coats the wheel fins — the imbalance causes vibration,
      the motor overheats, and eventually the wheel locks entirely. On older
      Kenmore and GE over-the-range units common in Panorama City's rental
      stock, this repair runs $150–$220 parts and labor. We pull the wheel,
      degrease it if the fins aren't warped, or replace it with an OEM
      equivalent if they are. Most jobs run about 90 minutes on a standard
      over-the-range mount. If the motor seized and burned out alongside the
      wheel, add another $80–$120 for the motor assembly — we carry both on
      the van and can usually close it out same day.

  - title: "Grinding and Rattling Fan — Worn Motor Bearings or Loose Damper"
    description: |
      A grinding or rattling range hood is almost always one of three things:
      worn motor bearings, a blower wheel that's backed off its shaft set
      screw, or a spring-loaded damper flap vibrating in the duct collar.
      Whirlpool and Frigidaire models throughout the apartments near Kaiser
      Permanente Panorama City develop motor bearing failure that shows up as a
      high-pitched whine that climbs with fan speed. That fix is a motor
      replacement — roughly $130–$180 installed. A loose blower wheel is
      cheaper: usually a single set screw that backed out, $75–$95 including
      the service call. Damper rattle is the quickest repair — grease makes
      the flap sticky so it doesn't seat cleanly; clean or replace the damper
      assembly and the noise is gone in 30 minutes.

  - title: "Duct Disconnected or Undersized — Hood Runs But Vents Nothing"
    description: |
      Older homes in 91402 regularly have 3.25-inch oval duct runs sized for
      the low-power range hoods of the 1960s. Put a modern Samsung or
      Whirlpool unit on that duct and backpressure undercuts everything — the
      hood sounds like it's working but barely moves smoke out of the room.
      We've also found fully disconnected duct sections in attic crawlspaces
      where prior work was done sloppily and nobody followed up. Upgrading to
      6-inch round or 3.25×10 rectangular duct usually runs $200–$350
      depending on run length and attic access. Any duct modification in the
      City of Los Angeles that changes the termination point requires a
      building permit through LADBS — we handle the filing under contractor
      license #1136541 and schedule the inspection so you're not coordinating
      it yourself.

  - title: "Grease Filter Completely Blocked — Airflow Collapses, Cabinets Suffer"
    description: |
      Baffle filters on Amana and GE units in Panorama City's owner-occupied
      homes often go 6–12 months between cleanings when the manufacturer
      recommends monthly. A fully saturated filter drops airflow 60–70%, and
      the grease that can't make it into the filter ends up coating cabinet
      faces and walls instead. Replacement baffle filters run $25–$55
      depending on hood model; mesh filters cost less but need more frequent
      attention. For units where the filter is past cleaning, we stock common
      sizes for same-day swap. The bigger cost driver is when accumulated
      grease has migrated into the duct itself — a contaminated duct adds
      $95–$145 to the job. Households doing high-heat cooking on gas ranges
      should clean filters every 3–4 weeks, not monthly — the standard
      interval assumes lighter use than most of these kitchens see.

  - title: "Range Hood Lights Dead — Corroded Sockets and Failed LED Boards"
    description: |
      Steam and airborne grease corrode light sockets faster on range hoods
      than on almost any other kitchen fixture. On older Frigidaire and Kenmore
      hoods, the socket contacts oxidize and the light stops making contact
      even with a brand-new bulb — you swap it in, it flickers once, then
      nothing. The socket assembly itself needs replacing, which runs $45–$85
      in parts plus about 45 minutes of labor. Newer Samsung over-the-range
      microwave-hood combos use LED arrays instead of individual sockets; when
      those fail, the whole light board replaces as a unit at $95–$160. If the
      hood is past 15 years and both the light and blower are failing in the
      same visit, full replacement usually makes more financial sense than
      stacking repairs — we'll give you a straight read on that while we're
      on-site.

faq:
  - q: "How fast can you get to Panorama City for Range Hood repair?"
    a: |
      From our Valley base, Panorama City is a 15–25 minute drive depending
      on traffic on the 405 or 170 interchange. Same-day appointments are
      available most days — call (660) 999-9960 before noon and we can
      typically have a technician there by early afternoon. For apartment
      buildings along Van Nuys Boulevard, we factor in parking logistics
      upfront; service vans need street parking or a loading zone and we
      confirm that when you book. Estimate to completed repair is usually one
      visit, two hours or less for the most common range hood failures.

  - q: "What does range hood repair typically cost in Panorama City?"
    a: |
      Diagnostic visit is $75, which applies toward any repair we do.
      Most repairs land between $120 and $280 all-in — blower wheel service,
      motor replacement, damper work, filter swap, or duct correction.
      Full unit replacement, supply and install, runs $350–$650 depending on
      the model and whether the existing duct needs modification to match.
      Exact pricing is given before we touch anything. Call (660) 999-9960
      or schedule online and we'll set up a same-day estimate with no
      surprise line items after the fact.

  - q: "Do I need a permit to replace or relocate a range hood in Panorama City?"
    a: |
      A straight like-for-like swap — same hood position, same duct
      termination point — generally does not require a permit in the City
      of Los Angeles. Changing the duct routing, adding exterior venting
      where none existed, or upgrading to a significantly larger hood that
      requires bigger duct does trigger a mechanical permit through LADBS.
      We pull those permits under contractor license #1136541 and handle
      the filing. A straightforward mechanical permit through LADBS online
      typically clears in 1–3 business days. We schedule the inspection
      directly — you don't need to take time off to coordinate it.

  - q: "Can you repair ductless recirculating range hoods, or only vented models?"
    a: |
      Both. Ductless hoods that recirculate through charcoal filters are
      common in Panorama City apartments where running duct to an exterior
      wall isn't practical. The motor, blower wheel, light assembly, and
      control board fail the same way regardless of venting type. The key
      difference is the charcoal filter — those need replacement every
      3–6 months and can't be cleaned the way a baffle filter can. We
      stock charcoal filter cartridges for common GE, Whirlpool, and
      Samsung ductless models. Poor recirculation performance is almost
      always a saturated charcoal filter or a failing blower wheel — both
      are quick, affordable fixes.

  - q: "How long should a range hood last, and when does repair stop making sense?"
    a: |
      A properly maintained range hood runs 15–20 years. In practice, the
      units we see in Panorama City's older housing usually have 10–12 years
      on them with no maintenance history, and the call is case-by-case.
      Motor and blower wheel repair on a 10-year-old Kenmore or Frigidaire
      makes sense when the unit is otherwise solid and the duct is clean.
      Stacking repairs — motor plus control board plus light assembly in
      a single visit — on a 15-year-old hood rarely pencils out. We'll
      tell you straight which way the math goes. Labor on repairs is
      warranted for 90 days; replacement units carry the full manufacturer
      warranty from day one.

  - q: "Do you cover Arleta and nearby neighborhoods around Panorama City?"
    a: |
      Yes — Arleta (91331), Van Nuys, North Hollywood, Sun Valley, and
      Pacoima are all regular stops. Coverage runs from Santa Clarita down
      to the 101, so nothing near Panorama City is out of range. Evening
      slots are available Tuesday through Saturday for households where
      daytime appointments don't work. Call (660) 999-9960 to check
      same-day availability, or book online for next-day scheduling.
      Most Panorama City and Arleta jobs are confirmed within 24 hours
      of first contact.
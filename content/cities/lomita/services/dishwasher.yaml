title: "Lomita Dishwasher Repair — Hard Water South Bay Same Day"

intro: |
  Hard water off the LADWP tap runs 350-400 ppm in Lomita — enough mineral load
  to choke spray arm nozzles before a unit hits its third birthday. The post-war
  bungalows and 1960s ranch homes around Veterans Memorial Park weren't designed
  for modern full-size dishwashers, which means tight cabinet clearances and aging
  stub-out plumbing are part of every service call here. That Bosch 500-series
  installed during the last kitchen remodel is already building scale in places
  the manufacturer's maintenance guide doesn't mention.

  South Bay tap water is genuinely harsh on appliances. Mineral deposits aren't
  just a cosmetic issue — they restrict water flow, stress the heating element,
  and accelerate wear on the control board's pressure sensors. Most homeowners
  don't realize the damage until the machine starts leaving dishes wet or throwing
  a fault code.

localContext: |
  Most of 90717's housing stock dates to the 1950s and early 1960s. Dishwashers
  were retrofitted into kitchens that never had dedicated drain runs or proper
  high-loop setups — and it shows. Closer to the Rolling Hills Estates border
  you'll find some newer builds, but the core residential streets near Lomita
  Blvd are mid-century originals. Cabinet openings run tight, shutoff valves are
  buried behind old cabinetry, and the float switch housing is usually crusted
  with mineral deposits by the time we get the call.

  Access matters here. The older homes along Cypress Ave and around the 190th St
  corridor have under-sink plumbing that was last touched in the 1980s. Getting
  a dishwasher out for service means working around original cabinetry that wasn't
  built with serviceability in mind. We carry a shorter pry bar specifically for
  these jobs — it's a small thing, but it keeps us from gouging fifty-year-old
  hardwood floors. Newer installs on the north side near Narbonne High are more
  cooperative, but the water quality hits them just as hard.

commonProblems:
  - title: "Spray Arm Clogged — Top Rack Won't Come Clean"
    description: |
      At 350+ ppm, calcium deposits pack the spray arm nozzles within a year or
      two of normal use. Samsung units see the upper spray arm seize on its
      mounting post; LG dishwashers tend to crack the arm near the collar instead
      of clogging outright. Either way, the top rack runs through a full cycle
      with almost no water pressure hitting it. Replacement fixes the immediate
      problem, but we also flush the inlet valve screen — skip that step and
      scale migrates back within months.

      The inlet valve screen is the part most shops skip. It's a 10-minute job,
      but ignoring it means the same clog returns in six months and the customer
      thinks the repair didn't hold. Scale debris from the municipal line is
      what's doing it, not a defective part.

  - title: "Standing Water Left After Every Cycle"
    description: |
      Drain pump failures in these older Lomita kitchens usually trace back to
      debris — bone chips, glass fragments, broken plastic clips — working past
      the filter and jamming the impeller. GE and Whirlpool models from before
      2015 run a smaller impeller that degrades faster than the rest of the unit.
      The float switch often triggers a fault code alongside it. One visit
      typically handles both: clear the obstruction, swap the pump, verify the
      drain line pitch.

      Whirlpool's F8 E1 code and GE's C4 both point here. If the unit is also
      humming on drain cycles without actually moving water, the impeller is
      likely jammed rather than burned out — that's a cheaper fix if caught early.

  - title: "Detergent Dispenser Door Stays Shut Mid-Wash"
    description: |
      Mineral crust from local tap water seizes the spring latch inside the
      detergent dispenser door. KitchenAid dishwashers — common in Lomita
      kitchen renovations from the 2010s — are especially prone to this failure
      mode. The pod drops into the tub but the door never opens, so the machine
      runs a complete cycle with no detergent released. New dispenser assembly,
      20 minutes on the bench, problem solved.

      This one gets misdiagnosed constantly. Homeowners blame the detergent brand
      or switch to liquid pods thinking it's a pod-size issue. It's the latch.
      A quick visual check — look for white residue crusting around the door
      hinge — confirms it before we even pull the unit out.

faq:
  - q: "How fast can you get to Lomita for dishwasher repair?"
    a: |
      South Bay routes run daily — down the 110 or cutting across from Torrance.
      Dispatch to Lomita is typically 30-45 minutes. Call (323) 870-4790 to lock
      in a same-day window, or book online. Evening slots are open most weekdays
      if daytime doesn't work.

  - q: "Do you repair Samsung and Bosch dishwashers in Lomita?"
    a: |
      Both show up constantly in this area. Samsung units regularly throw the OE
      or 5C drain error — usually a pump or float switch issue. Bosch dishwashers
      develop door latch assembly failures and heating element faults around year
      six. The E24 drain error on Bosch is almost always a partially blocked
      filter or a failing drain pump solenoid — not the control board, despite
      what the error code screen implies. KitchenAid and Whirlpool are in the
      mix too; parts for all four ride on the van.

  - q: "What does dishwasher repair typically run in the South Bay?"
    a: |
      Drain pump and spray arm replacements usually land between $150-$250 all
      in. Control board repairs run higher — Bosch boards in particular. Diagnostic
      fee is flat-rate and applies toward the repair. Call (323) 870-4790 — same-day
      emergency service is available if the unit is leaking or throwing a
      flood-detection error.
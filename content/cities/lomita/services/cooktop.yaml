title: "Lomita Cooktop Repair — South Bay 90717 Gas & Electric"

intro: |
  Gas cooktops in the 90717 zip deal with two things most other areas don't: LA hard water
  that clogs burner ports with calcium scale, and houses that haven't had a kitchen update
  since the original installation. The blocks around Narbonne Avenue and near the Lomita
  Railroad Museum on Woodward Avenue are full of GE and Whirlpool gas ranges pushing
  30-40 years old — and when that igniter starts clicking but nothing lights, the spark
  electrode is almost always the culprit. Newer owners have been swapping in Samsung and
  KitchenAid smooth-tops, but the kitchen clearances are still tight, and getting a van
  parked on these residential streets during the day takes planning.

localContext: |
  Lomita's 90717 housing stock is mostly 1950s and 1960s single-family homes with compact
  galley kitchens — tile countertops, tight clearances, four-burner gas cooktops bolted in
  flush. The blocks between Narbonne and Western Avenue are typical: original gas lines,
  older ventilation, and modest cabinet space around the range.

  That changes once you get closer to the Torrance border on Crenshaw Boulevard. Those
  homes have seen more recent kitchen remodels — Bosch five-burner slide-ins where a
  Whirlpool used to be, Samsung smooth-tops on Corian counters. The appliances are newer
  but the gas lines and cabinet cutouts are still original 1960s dimensions, which means
  fitting a replacement unit still involves some creative shimming.

  Hard water is the constant. Lomita draws from the same Metropolitan Water District
  supply that runs around 300-400 ppm total dissolved solids — above the threshold where
  calcium builds fast. Burner caps scale up inside the ports, the ice maker assembly in
  any freestanding range with a water line gets mineral-choked, and dishwasher spray arms
  in these older kitchens need clearing every couple of years. On a cooktop that hasn't
  been serviced, the igniter ports can be half-blocked from scale alone.

  Some of these postwar bungalows on streets like Oakwood Avenue and Eshelman Avenue
  still run the same gas cooktop from the early 1980s. Forty-plus years on one gas valve
  is not unusual here.

commonProblems:
  - title: "Burner Won't Light — Clogged Ports and Corroded Spark Electrodes"
    description: |
      LA hard water leaves calcium deposits around the burner cap and inside the burner
      ports fast — sometimes within two years of installation. The spark electrode tip
      corrodes or gets coated in grease, and the spark module fires but nothing ignites.
      On older GE and Whirlpool gas cooktops in these 90717 homes, the spark module
      itself often goes intermittent before the electrode fully fails.

      You'll hear it clearly — four or five clicks, then silence, then the cycle repeats.
      That pattern means voltage is reaching the igniter but the electrode gap is too
      fouled to arc. Clearing the burner ports and swapping the electrode tip resolves it
      in most cases. If the igniter board tests bad on the multimeter, the module itself
      comes out too.

  - title: "Cracked Ceramic Glass — Smooth-Top Electric Surface Damage"
    description: |
      Samsung and LG glass-top electric cooktops are popular upgrades in Lomita, but the
      ceramic surface panel is fragile. Thermal shock — cold water on a hot surface, or
      a cast-iron skillet dropped at the wrong angle — cracks it.

      Surface damage isn't cosmetic. A cracked glass-top is a shock and fire risk, and
      the ceramic panel needs full replacement before the unit is safe to use again. On
      Samsung models, the control board sometimes throws an error code (SE or C-d0) after
      impact even if the glass looks intact — that's the touch panel losing calibration
      from the vibration. Both issues get diagnosed on the same visit.

  - title: "Uneven Flame or Low Heat — Gas Valve and Burner Cap Problems"
    description: |
      One burner simmering when you want high heat usually points to a partially clogged
      burner cap or a gas valve that's sticking open just far enough to feed a weak flame.
      Bosch five-burner cooktops — increasingly common in remodeled South Bay kitchens —
      develop sticky gas valves around the 8-10 year mark. The valve body itself needs
      replacement, not cleaning.

      On KitchenAid gas models, a failing igniter switch can also cause a burner to run
      lean. Those units route both spark and gas flow control through the same switch
      assembly, so a partially failed switch reads like a pressure issue until you pull
      the switch and test it directly. Straightforward swap once diagnosed — parts are
      stocked for KitchenAid gas models.

faq:
  - q: "How fast can you get to Lomita for cooktop repair?"
    a: |
      South Bay routes run daily — Lomita sits about 20-30 minutes from our service hub
      depending on PCH and 110 traffic. Same-day slots are available most mornings.
      Call (323) 870-4790 before noon and we can usually be there within 2 hours.
      Evening appointments are also available for residents who can't take time off work —
      mention it when you call and we'll find a slot.

  - q: "Do you repair Samsung and LG cooktops in this area?"
    a: |
      Yes — Samsung smooth-top and LG glass-surface electric units are two of the most
      common cooktops we see in 90717. Also repair Bosch, KitchenAid, GE, and Whirlpool
      gas models. Cracked ceramic panels, failed spark modules, control board errors —
      most repairs happen same visit with parts already on the van. Samsung error codes
      like SE or C-d0 on touch-panel units get diagnosed on-site; the control board is
      usually the issue, not the glass.

  - q: "What does a cooktop repair typically cost in Lomita?"
    a: |
      Diagnostic fee is flat, applied toward the repair if you proceed. A thermocouple
      swap or burner cap replacement usually runs $100-180. Gas valve or control board
      replacements on mid-range brands cost more but still land well under replacement
      price. Evening slots available — just mention it when you book at (323) 870-4790.
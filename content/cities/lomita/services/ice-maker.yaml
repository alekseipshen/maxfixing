title: "Lomita Ice Maker Repair — Hard Water Kills Ice in 90717"

intro: |
  Hard water from the LA municipal supply hits South Bay appliances relentlessly — and
  Lomita's 90717 homes are squarely in the crossfire. The older ranch houses along
  Narbonne Avenue and the updated properties near Lomita Park see ice makers fail faster
  than most areas, because LA water runs well above 300 mg/L dissolved minerals. That LG
  french-door you installed a few years back? The water inlet valve is likely half-clogged
  already. Not a lemon. Just what hard water does to fill valves and ice maker components
  over time.

localContext: |
  Most of Lomita is 1950s and 1960s construction — post-WWII single-family homes with
  original copper supply lines and kitchens that weren't built to fit today's 36-inch
  refrigerators. Zip code 90717 runs right between Torrance and Harbor City, and the
  mineral-heavy municipal water deposits calcium scale into ice maker fill lines with every
  fill cycle, year after year. Some renovated properties near Eshelman Avenue have newer
  KitchenAid or Bosch French-door units squeezed into undersized openings. Pulling the
  fridge out to reach the ice maker assembly from the rear takes extra care, but it's
  routine for us.

commonProblems:
  - title: "Mineral Scale Blocking the Water Inlet Valve"
    description: |
      LA's hard water doesn't spare ice makers. The water inlet valve takes the worst of
      it — mineral deposits narrow the opening until flow drops below what the ice maker
      needs to form a full cube. Samsung french-door models with dual ice systems are hit
      especially hard; the upper fill valve for the in-door dispenser blocks first. We
      keep replacement valves for Samsung and LG in the service van. Most valve swaps
      close out in a single visit, usually within two hours of arrival.

  - title: "Frozen Fill Tube Inside the Freezer — Even in the South Bay"
    description: |
      South Bay doesn't freeze outdoors, but the water line inside the freezer compartment
      absolutely can. When a Whirlpool side-by-side's defrost timer starts to fail, the
      freezer runs too cold and ices over the fill tube that feeds the ice maker assembly.
      Ice production stops. Water sometimes pools at the base of the freezer section.
      Clearing the frozen fill tube without replacing the defrost timer just means it
      refreezes again in a week.

  - title: "Sensor Failure Telling the Ice Maker the Bin Is Full"
    description: |
      The optical sensor — or the mechanical bail arm on older units — signals when the
      bin needs to stop filling. When that sensor fails, the ice maker either thinks the
      bin is full when it's empty, or keeps producing and jams the whole mechanism.
      GE Profile refrigerators from around 2018–2020 had a notable run of flaky sensor
      wiring that causes exactly this. On LG units, a dying control board often flashes an
      IE or 1F error code before ice production goes completely silent. Both are diagnosable
      fixes — not refrigerator replacements.

faq:
  - q: "How fast can you get to Lomita for ice maker repair?"
    a: |
      Torrance is literally next door, so we're typically in 90717 within 45–60 minutes
      of your call on weekdays. Most Lomita homes have driveways — parking is nowhere near
      the headache it gets in Santa Monica or West LA. Call (323) 870-4790 and we'll check
      what same-day slots are open; most mornings and early afternoons are available.

  - q: "Do you repair Samsung and LG ice makers in Lomita?"
    a: |
      Yes — Samsung and LG are probably half our South Bay ice maker calls. We stock fill
      valves and full ice maker assembly kits for both brands in the van. Whirlpool, GE,
      and KitchenAid side-by-sides are also very common in 90717. Got an older Kenmore?
      Those are usually Whirlpool under the hood. If it's flashing an error code or
      grinding and stopping, we've seen it before.

  - q: "What does ice maker repair cost in Lomita, and is same-day service available?"
    a: |
      Diagnostic visit is $75, credited toward the repair if you move forward. Most ice
      maker jobs — inlet valve swap, frozen fill tube, sensor or control board replacement
      — run $150–$300 total depending on parts. Same-day service is available most
      weekdays. Evening slots on request. Call (323) 870-4790 to see what's open today.
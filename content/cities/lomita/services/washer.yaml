title: "Lomita Washer Repair — Hard Water, Old Hookups, Fast Fixes"

intro: |
  Post-WWII bungalows off Narbonne Avenue pack laundry rooms into spaces barely
  big enough to swing a drain hose. That Samsung front-loader or LG top-load unit
  is fighting the same hard municipal water that leaves chalky scale on every faucet
  in 90717 — mineral buildup clogs inlet valves fast here. South Bay is on our
  daily route and we usually reach Lomita within two hours of your call.

localContext: |
  Most of 90717 is single-family homes built between the late 1940s and early 1970s,
  with a handful of apartment clusters near Lomita Boulevard and Walnut Avenue. Older
  construction means original laundry hookups — 3-prong outlets, narrow utility closets,
  and doorframes that just barely clear a standard machine. On blocks east of the 110,
  we routinely bring a hand truck just to reposition the unit without gouging the floor.

  LA's water hardness runs 270–350 ppm in this part of the South Bay. That's well above
  the 120 ppm threshold where scale starts causing real damage to inlet valve screens and
  detergent dispensers. Most residents don't know their water inlet valve is half-blocked
  until the machine starts taking 20 minutes to fill or throws an E1 or 4C error. Bosch
  and KitchenAid front-loaders are especially sensitive — the inlet valve orifice is
  narrower than on budget units. A descale or valve swap clears it, but waiting turns
  that into a control board issue.

  The mix of machines in Lomita skews older Whirlpool and GE top-loaders in the
  established family homes, with Samsung and LG units in the rentals and in households
  that upgraded in the last decade. Both have their quirks in these older laundry closets —
  tight clearances mean pulling the machine out for a rear-access repair requires care
  on linoleum floors that are original to the house.

commonProblems:
  - title: "Drum Won't Spin — Drive Belt and Bearing Wear in Older Units"
    description: |
      A snapped drive belt or seized drum bearing in a Whirlpool top-loader will stop
      the spin cycle cold — laundry soaking, drum locked, no error code displayed.
      Hard water accelerates bearing wear, and Lomita's 1960s homes often have machines
      that have never had a belt inspection. Both parts are on the van; most spin repairs
      wrap up the same visit.

      On Samsung front-loaders the symptom looks different: the drum turns slowly but
      won't reach spin speed, and you'll often hear a grinding from the rear bearing
      assembly before it quits entirely. The tachometer sensor on the motor can also
      throw an E3 code that looks like a control board fault but is actually a worn
      drive belt slipping. Worth diagnosing correctly before replacing a $200 board
      for a $35 belt.
  - title: "Standing Water After the Cycle — Drain Pump Failures"
    description: |
      Standing water at cycle end almost always points to the drain pump — a coin, lint
      clump, or debris lodged in the impeller stalls the motor. Samsung and GE front-loaders
      in South Bay rentals accumulate this faster when residents skip the filter. Running
      more cycles with a blocked pump burns out the motor entirely, turning a $120 fix
      into a $300 one.

      LG units in 90717 frequently throw an OE error alongside the standing water —
      that's the machine confirming it can't drain. The access panel is at the lower
      front; clearing the filter takes five minutes, but if the pump motor has already
      seized from running dry, the whole assembly needs replacement. Either way, call
      before running another cycle.
  - title: "Machine Shaking Hard Enough to Walk Across the Floor"
    description: |
      An LG front-loader banging against the wall mid-cycle is usually worn shock
      absorbers or a cracked suspension rod — not just an unbalanced load. On Lomita's
      wood-frame subfloors the vibration travels far and sounds catastrophic. Replacing
      the shock absorbers takes about an hour and costs a fraction of what a flooring
      repair would run if the machine keeps going unchecked.

      Whirlpool top-loaders develop the same problem from broken suspension springs —
      four plastic hooks holding the spin basket centered, and once one snaps the tub
      contacts the cabinet on every cycle. The UL error code flags it, but plenty of
      machines in older homes don't have a display to show it. The fix is the same
      regardless: new springs, rebalance, done.

faq:
  - q: "How fast can you get to Lomita for washer repair?"
    a: |
      Same-day slots are standard for Lomita — the South Bay loop through Torrance and
      Harbor City puts us in the area most mornings. Call to arrival is usually under two
      hours. Reach us at (323) 870-4790 or schedule online and we'll lock in a window.
  - q: "Do you repair Samsung and LG washers in this area?"
    a: |
      Both are the most common calls we get in 90717. Samsung's door lock assembly and
      LG's drain pump fail on a predictable schedule here. Whirlpool and KitchenAid
      top-loaders too — water inlet valve and lid switch replacements especially.
      Parts are stocked on the van for all three.
  - q: "What does washer repair cost, and can you come after work hours?"
    a: |
      Diagnosis runs $65 and applies toward the repair. Most jobs — drain pump swap,
      drive belt, water inlet valve — land between $150 and $280 parts and labor combined.
      Evening slots are available most weekdays. Call (323) 870-4790 if you need
      a next-day appointment before 8 a.m.
  - q: "Is hard water actually damaging my washer, or is that just a sales pitch?"
    a: |
      It's real, and 90717 tap water is among the harder supplies in the South Bay.
      Mineral deposits coat the water inlet valve screen, narrow the flow, and force
      the pump to work harder on every fill cycle. A Bosch or KitchenAid will show it
      faster than a budget unit because the tolerances are tighter. Running a monthly
      citric acid cycle helps slow it down. If your fill time has crept up or you're
      seeing white residue inside the drum, call us at (323) 870-4790 — a valve
      inspection is quick and often catches the problem before it cascades.
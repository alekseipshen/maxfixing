title: "Lomita Refrigerator Repair — Hard Water, Old Kitchens, Fast Service"

intro: |
  Narbonne Avenue cuts through the heart of 90717 past blocks of 1950s and
  early-60s tract homes — kitchens sized for a basic top-freezer, now holding
  Samsung french-door units or LG bottom-freezers that barely clear the cabinetry
  above. South Bay tap water runs at 270–300 mg/L mineral hardness, and that
  calcium load destroys ice maker assemblies faster than most people realize.
  Throw in Lomita's July heat and refrigerators here work twice as hard as the
  manufacturer ever planned. This zip runs hotter and harder on appliances than
  most people account for when they buy.

localContext: |
  Almost all residential blocks in Lomita's 90717 zip date from 1952 to 1965 —
  single-family homes with compact kitchens where there's maybe two inches of
  clearance between the refrigerator coils and the cabinet wall behind. That
  tight fit chokes condenser fan airflow and accelerates overheating. Older
  Whirlpool and GE side-by-sides that have sat in those spots for ten-plus years
  tend to show seal failure first — door gaskets dry out from the heat radiating
  off the motor, and the warm-cabinet complaint usually starts right there.

  The streets east of Western Avenue toward the Torrance border are especially
  dense with these original tract kitchens — Eshelman Avenue, Walnut Street,
  the blocks around Lomita Park. Homeowners on those streets have been buying
  mid-range replacements like KitchenAid and Bosch, but sliding a 36-inch unit
  into a 35.5-inch opening means calling us back six months later because the
  condenser coil never had room to breathe. Parking a service van on those
  narrow residential streets means we walk tools in from the curb — standard
  procedure for this part of the South Bay. The Lomita Railroad Museum sits a
  few blocks off Narbonne; neighbors there know us from word of mouth as much
  as from any search.

commonProblems:
  - title: "Ice Maker Locked Up by Mineral Scale"
    description: >
      LADWP water in the South Bay is some of the hardest in LA County, and the
      water inlet valve inside most Samsung and LG french-door models takes the
      full brunt of it. Calcium deposits calcify the valve seat within 18–24
      months, starving the ice maker assembly of flow until it stops producing
      entirely. The Samsung error code 40 or 41 on the display panel is usually
      the first sign — residents often assume it's the ice maker itself, but the
      valve is the culprit nine times out of ten. Replacing the inlet valve and
      flushing the supply line clears it — parts are usually on the van, done
      same visit.

  - title: "Refrigerator Not Cooling Through Lomita Summers"
    description: >
      Inland heat in July and August routinely hits the upper 80s in Lomita,
      and a refrigerator fighting that ambient temperature runs its compressor
      without a break. On Whirlpool and Maytag units from the mid-2000s, the
      condenser coils underneath collect years of dust and hair until the
      compressor overheats and locks up. A coil cleaning plus a thermostat check
      costs a fraction of what a compressor replacement runs — and usually solves
      it completely. If the evaporator coil has already iced over, there's a
      defrost timer or defrost heater failure underneath it — that's a different
      fix, but still straightforward.

  - title: "Water Pooling Under the Unit"
    description: >
      Standing water on the kitchen floor under a KitchenAid or GE refrigerator
      almost always points to a blocked defrost drain. The drain tube runs from
      the evaporator coil in the freezer floor down to a pan near the compressor
      at the back — food debris and ice dam it shut over time. Left alone, water
      migrates under the flooring and causes real damage. Takes about 45 minutes
      to clear properly and it stays clear. Bosch counter-depth models in the
      newer Lomita remodels have a slightly different drain path — same diagnosis,
      slightly more disassembly to reach it.

faq:
  - q: "How fast can you get to Lomita for refrigerator repair?"
    a: >
      South Bay is on our daily route — Torrance, Harbor City, San Pedro, all of
      it. Lomita off the 110 is a straight 15-minute shot from our home base.
      Call (323) 870-4790 and we'll lock in a same-day window, usually 2 hours
      out. Evening slots available if daytime is tight.

  - q: "Do you repair Samsung and LG refrigerators in Lomita?"
    a: >
      Both are our most frequent service calls in 90717. Samsung french-doors
      mostly come in with ice maker assembly failures or a dead water inlet valve
      from hard water. LG bottom-freezers usually need a linear compressor swap —
      that design has a documented failure rate after 5–7 years and we stock the
      replacement units. Bosch and KitchenAid are regulars too.

  - q: "What does refrigerator repair cost and how does the visit work?"
    a: >
      Diagnostic fee covers the inspection and applies toward the repair if you
      proceed on-site. Most fixes — door gasket, thermostat, inlet valve — land
      between $150 and $280 parts and labor combined. Compressor replacements run
      higher but usually still beat buying new. Schedule at (323) 870-4790;
      same-day and emergency slots open most days.
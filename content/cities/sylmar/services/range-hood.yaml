title: "Sylmar Range Hood Repair — Fast Fix for Valley Kitchen Vents"

intro: |
  The grease filters in Sylmar kitchens don't lie. Ranch houses along Hubbard Street and
  the stucco homes near El Cariso Park run their stoves hard — multiple burners going,
  tortillas warming on the grates, pots simmering low for hours. Range hoods doing that
  kind of daily work pack the baffle filter with residue faster than any manufacturer
  schedule accounts for. That Kenmore or GE hood above your range might sound like it's
  running, but a filter packed solid cuts airflow to almost nothing — smoke drifts toward
  the ceiling instead of out the duct. The 91342 zip has a lot of original 1970s tract
  homes where ductwork was never sized correctly to begin with, compounding airflow
  problems from day one. A clogged baffle filter combined with undersized duct diameter
  forces the blower motor to work overtime, overheat, and fail early. Getting the
  system cleaned out, the motor tested, and the damper flapper checked usually wraps
  up in under two hours.

localContext: |
  Sylmar sits at the northern tip of the San Fernando Valley, pressed against the
  foothills, and summer heat here is not subtle — the 91342 zip regularly hits 105°F+
  on bad August days, putting real thermal stress on appliances running continuously
  under a hot cooktop. The stretch along Foothill Boulevard has a dense corridor of
  1960s and 1970s ranch-style homes with original kitchen setups, meaning range hoods
  that were installed during the Ford administration and haven't been serviced since.
  El Cariso neighborhood and the Olive View area have mixed housing stock: some homes
  updated with newer Samsung or Whirlpool undercabinet hoods, others still running
  original ducted units with seized cast-aluminum blower wheels from decades of grease
  and heat cycling. Homes in 91342 and the adjacent 91340 (San Fernando city) share
  the same hard water problem — mineral deposits form inside control board housings
  and corrode the electrical contacts that run the fan speed switches. Ductwork in
  these tract homes was often routed through tight ceiling cavities that were never
  meant for range hood exhaust, creating back-pressure that burns motors out early.

commonProblems:
  - title: "Blower Motor Failure Triggered by Summer Heat and a Bad Run Capacitor"
    description: |
      When a range hood fan stops moving air completely, the blower motor is usually the
      first thing to check — specifically the run capacitor that helps the motor start
      under load. In Sylmar's 105°F summer heat, capacitors fail faster than in cooler
      climates because thermal cycling degrades the dielectric material inside them. A
      Whirlpool undercabinet hood in a 1970s kitchen on Hubbard Street might run fine
      all winter, then stop dead in July when the capacitor gives out. The fix: pull the
      hood, test the capacitor with a multimeter — residential units typically use 2–5 µF
      ratings — and replace it. Capacitors run $8–15 from appliance supply houses; the
      labor is straightforward. If the motor itself is seized or the windings are burned,
      a replacement motor for a standard 30"–36" hood runs $45–90 depending on CFM
      rating. Call (323) 870-4790 for same-day diagnosis.

  - title: "Rattling and Grinding Noise — Almost Always the Blower Wheel"
    description: |
      A grinding or rattling range hood usually has grease buildup on the blower wheel —
      the squirrel-cage fan that spins inside the housing. When grease accumulates on the
      wheel blades unevenly, the rotating balance goes off, and you get vibration that
      sounds like a dying washing machine. On Samsung and Frigidaire hoods common in
      El Cariso neighborhood apartments, this shows up fast because compact undercabinet
      units have tighter blower wheel clearances than full-size chimney hoods. Disassembling
      the housing, soaking the blower wheel in hot degreaser solution, and checking the
      motor shaft for bearing wear takes about 90 minutes on a standard visit. If the
      motor bearing is worn — you'll hear a metallic squeal even after the wheel is clean
      — replacement is the right call. Bearing failures don't stabilize on their own, and
      a seized blower wheel will eventually burn out an otherwise-good motor. Parts for
      most common brands are available next-day.

  - title: "Range Hood Lights Dead — Not Always Just a Burned Bulb"
    description: |
      Range hood lights that stop working aren't always a bulb problem. The socket itself
      corrodes from heat and grease vapor — contacts oxidize and stop conducting even when
      a new bulb is installed. On older GE and Kenmore hoods (pre-2010 models common in
      91342 tract homes), the light circuit runs through a shared control board, and a
      failed triac on that board kills the lights while leaving the fan running normally.
      Testing it takes 10 minutes with a continuity tester. Replacement control boards
      for mid-range hoods run $35–80 depending on model; socket assemblies are typically
      $12–20. One specific flag: if your hood runs halogen bulbs and the light flickers
      before dying, the thermal cutout fuse on the light fixture is tripping from heat
      buildup. Switching to LED appliance-rated bulbs runs significantly cooler and
      eliminates that thermal cycling permanently. No permit required for this type of
      repair — just a service call.

  - title: "Grease Baffle Filter Blockage Choking Airflow to Near Zero"
    description: |
      Baffle filters — the corrugated metal inserts sitting directly above the cooktop —
      are the first line of defense stopping grease from reaching the blower motor.
      In Sylmar households cooking daily on gas ranges, those baffles can clog completely
      within 60–90 days. Fully clogged, airflow drops 70–80%: the fan runs normally but
      exhausts almost nothing, and grease starts migrating past the filter into the
      ductwork and motor housing. Cleaning aluminum baffles is straightforward — hot water,
      dish soap, and a stiff brush, or a short dishwasher cycle. But if the filters have
      been ignored for two or three years, the grease inside the duct itself needs
      attention. Duct grease accumulation is a fire risk, not just an efficiency issue.
      For standard residential hoods we clean the filters and do an interior duct wipe-down
      in about an hour. Replacement baffle filters for most 30"–36" units run $25–50 a
      pair — Whirlpool and GE replacements are typically off-the-shelf.

  - title: "Back-Draft Damper Stuck Open — Outside Air Flowing Back Through the Duct"
    description: |
      The back-draft damper is a small hinged flapper at the duct termination point on the
      exterior wall or roof — it closes when the fan shuts off, blocking outside air from
      flowing back through. In many Sylmar homes near the foothills, these dampers are
      either missing, warped open from years of dry heat, or plugged with debris blown in
      from the surrounding hillside terrain. A stuck-open damper means the hood never fully
      exhausts and can create a flapping or whistling noise when wind hits it. Replacing
      a damper is inexpensive — $15–30 for the part — but accessing the duct termination
      on a two-story home or flat-roof kitchen vent requires a ladder and some planning.
      We also check duct diameter on older installs: original 1960s-era range hoods often
      used 3.25" oval flex duct, which dramatically restricts modern fan CFM output and
      causes blower motors to run hot. Upgrading to a properly sized 6" round duct
      connection often fixes noise and airflow problems simultaneously.

faq:
  - q: "How fast can you get to Sylmar for range hood repair?"
    a: |
      From our San Fernando Valley coverage zone, Sylmar is typically a 20–30 minute
      drive depending on traffic on the 210 or I-5. Parking at residential addresses in
      91342 is generally straightforward — most calls are single-family homes with
      driveway access, which makes van parking easy. After you describe the issue over
      the phone, we can usually confirm a same-day slot if you call before noon. Evening
      appointments are available Tuesday through Saturday for range hood calls that
      aren't a hard block on cooking. Call (323) 870-4790 and we'll give you a firm
      2-hour arrival window.

  - q: "What does range hood repair typically cost in Sylmar?"
    a: |
      Most range hood repairs in Sylmar run $85–180 for common problems — blower motor
      replacement, control board swap, damper repair, or light circuit fix. The diagnostic
      visit is $65, which applies toward the repair if you move forward. Grease baffle
      filter cleaning and duct wipe-down is a flat $45 add-on. Full ductwork cleaning
      on longer duct runs (10 ft+) goes $95–150 depending on access difficulty. Parts
      for GE, Kenmore, Frigidaire, and Whirlpool hoods are usually in stock or available
      next-day from local supply. You get a firm price before anything gets touched —
      no surprise line items after the fact.

  - q: "Do you need a city permit to replace a range hood in Sylmar?"
    a: |
      Swapping a range hood for a same-size replacement in an existing duct location
      doesn't require a permit under the City of Los Angeles Municipal Code, which
      governs Sylmar. If you're modifying the duct routing, cutting a new exterior wall
      or roof penetration, or converting from a recirculating unit to a ducted
      configuration, that does trigger an LADBS permit. We handle the paperwork when
      a permit is required and coordinate the inspection. For the most common job —
      old hood out, new hood in, same duct path — expect a half-day install with
      no permit delay.

  - q: "What if my range hood runs but doesn't actually pull smoke out?"
    a: |
      This is a common call. The fan motor is spinning, but effective airflow is close
      to zero. Three likely causes: the grease baffle filter is completely blocked,
      a duct section downstream has collapsed or crimped and is choking the exhaust
      path, or the blower wheel has sheared off the motor shaft and is spinning freely
      without moving any air. We'll pull the filter, check static pressure in the duct,
      and inspect the blower assembly directly. A fully clogged filter with no duct
      damage is a same-visit fix. A collapsed duct section takes a bit longer but
      is still typically resolved in one trip. Call (323) 870-4790 — we can usually
      diagnose it the same day you call.

  - q: "What warranty do you offer on range hood repairs?"
    a: |
      Parts we supply carry a 90-day warranty against defect — if a blower motor or
      control board fails within 90 days of install, we replace it at no charge.
      Labor is warranted for 30 days: same issue returns within 30 days, we come back
      free. Motor replacements and control board swaps typically last 5–10 years under
      normal residential use. Grease baffle filters and dampers are maintenance items
      — no warranty on consumables, but we'll tell you exactly how often to clean them
      based on your cooking frequency. For households cooking daily on gas, plan on
      cleaning the baffles every 60–90 days to keep the blower motor running cool.


title: "Sylmar Cooktop Repair — Fast Fixes Near the 210 Freeway"

intro: |
  Hansen Dam sits about two miles east of some of the oldest residential blocks in Sylmar —
  ranch-style homes from the early 1970s, many rebuilt or heavily renovated after the 1971
  Sylmar earthquake. Those kitchens got outfitted with whatever was affordable at the time:
  usually a Kenmore or Frigidaire drop-in gas cooktop, sometimes a GE freestanding range.
  Fifty years on, those same units are still cooking, and they're starting to show it.
  Igniters fail first — you hear the clicking, smell the gas, but the burner won't catch.
  Around Foothill Boulevard and Bledsoe Street, we see a lot of older Whirlpool and Amana
  slide-in models with knobs so worn the set-point markings have rubbed off completely.
  Call us at (323) 870-4790 and we can usually get a technician to Sylmar the same day,
  often within two hours of your call.

localContext: |
  The housing stock in zip code 91342 leans heavily toward single-family homes built between
  1960 and 1985, with a secondary layer of 1990s apartment complexes along San Fernando Road.
  That mix matters for cooktop work. Single-family ranch homes typically have gas connections
  with enough clearance to pull out a drop-in cooktop without major teardown — but the older
  1970s builds sometimes have non-standard cutout dimensions that don't fit modern replacement
  units without a transition bracket. The apartment stock is a different problem entirely:
  tight galley kitchens where a 30-inch slide-in barely fits, and parking on San Fernando Road
  means we sometimes stage parts from the van at the curb. Near Olive View Drive and in the
  blocks approaching Pacoima, we also see a fair number of electric coil cooktops in units
  that were never plumbed for gas — those have their own failure modes, mostly around the
  receptacle block and burner element connections. LA's hard water compounds the issue on
  gas units too, leaving mineral deposits that clog sealed burner ports and choke ignition.

commonProblems:
  - title: "Igniter clicks but burner won't light on gas cooktop"
    description: |
      Gas cooktops in Sylmar's older homes develop igniter problems after years of grease
      buildup and moisture exposure. The spark igniter module sits directly below the burner
      cap, and once the ceramic electrode tip cracks or gets coated in carbon, it either won't
      spark or sparks without catching the gas. On Kenmore and Frigidaire four-burner models,
      this is the number-one call we get in the 91342 area. The fix usually means replacing
      the igniter electrode assembly — a $35–$60 part — plus clearing the burner ports with
      a pin to remove any mineral or food blockage restricting gas flow. Total repair runs
      $120–$180 depending on how many burners are affected. If it's just one igniter and
      the others are original, we typically recommend replacing all four at once since they
      age at the same rate and the labor cost is the same either way.

  - title: "Cracked ceramic glass surface on electric smooth-top"
    description: |
      A dropped cast-iron skillet can crack a ceramic-glass cooktop surface in under a second.
      The glass-ceramic panel isn't just cosmetic — it's structural on most Samsung and GE
      smooth-top models, acting as both the cooking surface and the seal keeping spills away
      from the heating elements underneath. Sylmar's older 1980s and 1990s homes often have
      GE Profile or early Samsung electric ranges that still work fine mechanically, but a
      cracked top turns them into a safety hazard with exposed wiring risk. Replacement panels
      for these models run $200–$350 for the part alone; our labor on a Sylmar service call
      adds another $90–$120. In some cases — especially if the control board is also acting
      up — we'll walk you through the honest numbers on repair versus replacement so you're
      not sinking $300 into a 20-year-old unit.

  - title: "One burner has no heat or heats unevenly on electric cooktop"
    description: |
      Electric cooktops with coil or radiant elements develop uneven heat for a few different
      reasons. Most commonly, the infinite switch — the component that modulates power to the
      burner element — wears out and starts delivering inconsistent voltage. On Whirlpool and
      Amana slide-in models from the mid-2000s, this shows up as a burner that only gets hot
      on high, or one that cycles off before the pan is even warm. Sometimes the burner element
      itself develops a cold spot where the nichrome resistance wire inside has partially broken.
      We carry common infinite switches and replacement coil elements in the van for Whirlpool
      and GE units, which means same-day repair for most of these calls in Sylmar. An infinite
      switch replacement runs about $95–$140 total on a standard Whirlpool unit — parts and
      labor combined.

  - title: "Cooktop tripping breaker or losing power intermittently"
    description: |
      Homes near Foothill Boulevard in the 91342 zip code still have a surprising number of
      older electrical panels — some original 100-amp services with aluminum branch wiring from
      the 1970s. When a 240V cooktop starts tripping its breaker repeatedly, the problem is
      often the terminal block connection where aluminum and copper conductors meet. Corrosion
      at that junction creates resistance, which generates heat, which trips the breaker or
      eventually melts the terminal block itself. This isn't a quick fix — we inspect the
      terminal block, check the power cord connection, and verify the breaker rating matches
      the cooktop's actual amperage draw. On a Samsung or GE glass-top electric, that
      diagnostic and repair runs $150–$220. If the issue is upstream in the panel, we'll refer
      you to a licensed electrician before we touch anything else — the appliance repair is
      pointless if the wiring is the root cause.

  - title: "Knob spins freely or won't turn — gas valve control failure"
    description: |
      Knobs on gas cooktops take more abuse than almost any other component. The D-shaft or
      keyway wears down, especially on Frigidaire and GE models where the plastic insert meets
      the brass valve stem. Once that interface strips, the knob turns freely without rotating
      the gas valve — meaning you think you're adjusting the flame, but you're not. That's a
      real safety issue, not a cosmetic one. Replacement knob sets for common Frigidaire
      Gallery and GE Café models run $20–$60 for a full set of four; if the valve stem itself
      is damaged, parts run $80–$120 per valve and the repair is more involved. We stock knob
      sets for the most common models in the service van. Scheduling a Sylmar appointment for
      a knob-only call is straightforward — call (323) 870-4790 and we can usually fit it
      into an afternoon slot within 24 to 48 hours of your call.

faq:
  - q: "How fast can you get to Sylmar for a cooktop repair?"
    a: |
      Sylmar is reachable from the 210 Freeway at the Hubbard/Polk exit or from the 5 via
      Roxford Street. Coming from the LA basin, morning traffic on the 210 adds about 20
      minutes, but midday runs clean. For most calls in the 91342 zip code, we can be on-site
      within two hours of booking if you call before noon. Same-day appointments are available
      most weekdays; evening slots until 7pm open up Tuesday and Thursday. Call (323) 870-4790
      to check what's available — we give you a one-hour arrival window, not a vague
      "morning or afternoon" block that wastes your whole day.

  - q: "What does a cooktop repair cost in Sylmar?"
    a: |
      The diagnostic visit is $75, which applies toward the repair cost if you move forward.
      From there, common repairs range from $95 for a single infinite switch replacement on a
      Whirlpool or Amana electric, up to $220–$280 for a glass-ceramic panel replacement on
      a Samsung or GE smooth-top. Gas igniter electrode assembly replacement typically lands
      between $120–$180 for one to two burners. Price goes up when parts need to be ordered
      (add 2–4 business days), when older models have discontinued OEM components, or when
      electrical connection issues require extended diagnostics. You get a written quote before
      any work starts — no surprise charges at the end.

  - q: "Do I need a permit to replace or repair a cooktop in Sylmar?"
    a: |
      Sylmar falls under City of Los Angeles jurisdiction — specifically LADBS (LA Department
      of Building and Safety). A like-for-like repair, replacing a broken component in an
      existing cooktop, doesn't require a permit. Swapping the entire cooktop for a different
      model of the same fuel type usually doesn't either if the cutout dimensions match.
      Changing fuel type — say, going from electric to gas — does require a permit and
      inspection, plus a licensed plumber for the gas line work. We handle the appliance
      installation side; for permit-required scope we'll connect you with the right licensed
      contractors and coordinate the scheduling so you're not managing three separate
      trades on your own.

  - q: "Can you repair sealed-burner gas cooktops, or only open-burner models?"
    a: |
      Sealed burner cooktops are actually easier in some ways — the burner assembly is a
      discrete unit that lifts out without disassembling the whole cooktop. Kenmore Elite,
      GE Profile, and Frigidaire Gallery all use sealed burner designs where the burner head,
      cap, and igniter are individually serviceable. The most common failure on these is a
      clogged burner port from boil-overs (worsened by LA's hard water mineral buildup)
      combined with a fouled igniter tip — we clean both as part of the same service call.
      If the sealed burner orifice itself is corroded, the replacement part is usually under
      $25, and the swap takes about 30 minutes on the bench. We carry common orifice sizes
      for GE and Frigidaire sealed burner assemblies in the van for most Sylmar calls.

  - q: "What warranty covers the cooktop repair work?"
    a: |
      Parts carry the manufacturer warranty — typically 90 days on electrical components,
      one year on mechanical parts like infinite switches, valve assemblies, and burner
      components. Our labor is warrantied for 90 days: if the same failure recurs within
      that window, we return at no additional labor charge. Glass-ceramic panels carry a
      90-day parts warranty, but post-installation impact breakage isn't covered — that's
      a manufacturer position, not ours. For Sylmar calls specifically, if a repair doesn't
      hold and we need to return, we prioritize same-day or next-morning scheduling rather
      than putting you back in the general booking queue.

  - q: "What other cities near Sylmar do you cover, and can I schedule a next-day visit?"
    a: |
      Sylmar is our northernmost regular coverage point in the San Fernando Valley. From there
      we run south through Pacoima (91331), San Fernando (91340), Mission Hills (91345),
      Granada Hills (91344), and all the way down to Van Nuys and Burbank. Two routes run
      daily — north Valley in the morning, south Valley in the afternoon — so Sylmar
      appointments slot into the first run. Next-day scheduling is almost always available;
      same-day depends on what's already booked. Call (323) 870-4790 before 9am to get
      the best morning window — those slots fill by mid-morning most weekdays.
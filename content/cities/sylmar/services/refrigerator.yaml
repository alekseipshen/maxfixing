title: "Sylmar Refrigerator Repair — Valley Heat Takes a Toll"

intro: |
  Summers in the 91342 are no joke — air temps hit 100°F along Glenoaks Boulevard, and the garage-adjacent kitchens in Sylmar's 1960s tract homes trap even more heat than that. A Whirlpool or Samsung side-by-side sitting in one of those kitchens runs its compressor harder than the same unit would on the coast. Near Veterans Memorial Park, we've pulled apart plenty of Frigidaire top-freezers where the condenser coils were absolutely caked in dust because the clearance between the back of the unit and the wall was maybe two inches. Combine that with LA's notoriously hard water — mineral content here is genuinely high, calcium deposits form fast in ice maker lines and door dispensers — and you get a refrigerator that fails in three or four places at once. We cover all of Sylmar, from the homes off Bledsoe Street to the apartments near the 210 and 5 interchange. Call us at (323) 870-4790 and we can usually be there within 2 hours.

localContext: |
  Most of Sylmar falls under zip code 91342, with addresses along the eastern edge bleeding into 91340 (San Fernando city limits). The housing stock is predominantly postwar single-family — 1950s and 1960s ranch-style homes with original floor plans designed around a 24-inch refrigerator. A lot of current owners have upgraded to a 30- or 33-inch unit, which means the kitchen was modified at some point, and ventilation around the appliance is usually an afterthought. Apartment buildings along Roxford Street tend to have compact over-under units or smaller 18-cubic-foot models — tighter to access and different failure patterns than full-size models. The San Fernando Valley's summer heat load is a real issue here; ambient temps in garages and south-facing kitchens regularly hit 85–90°F, which forces condenser fans to cycle almost constantly. That kind of sustained workload shortens the lifespan of components like the defrost timer, door gasket seals, and the compressor start relay faster than manufacturers' rated specs assume.

commonProblems:
  - title: "Refrigerator Running Warm During Sylmar's Summer Heat"
    description: |
      This is the most common call we get from 91342 between June and September. The unit is running — you can hear it — but the inside temperature climbs above 45°F and food starts going bad. Nine times out of ten, it's a condenser fan motor that's seized or a condenser coil buried under a year of dust and pet hair. On a GE side-by-side or Whirlpool bottom-freezer, that coil sits under the unit behind a kick plate, and pulling it out in a tight kitchen usually means rolling the fridge into the hallway. A blocked or failed condenser fan can also cause the compressor to overheat and trip thermal protection — the unit shuts down for 20-30 minutes, restarts, then cycles again. Replacing a condenser fan motor runs $85–$150 in parts. A full coil cleaning plus fan swap is typically a $180–$250 job. We carry the most common fan assemblies for GE and Whirlpool on the van.

  - title: "Ice Maker Failure from Hard Water Mineral Buildup"
    description: |
      LA's water supply averages around 300–400 mg/L of total dissolved solids — technically within safe limits, but high enough to leave visible calcium scale inside ice maker assemblies and water inlet valves within 18–24 months. On a Samsung french-door unit with an in-door ice maker, scale buildup in the fill tube eventually blocks water flow entirely. The ice maker assembly stops producing, and if you ignore it long enough, the fill valve starts dripping past the mineral deposits and water pools inside the freezer compartment. The fix involves descaling or replacing the water inlet valve ($40–$80 part), flushing the fill tube, and inspecting the ejector mechanism for scale bridges. In hard-water households, a refrigerator water filter should be swapped every 4–6 months, not the 12 months most manuals suggest. We've seen two-year-old Samsung units in Sylmar with ice makers that look like they've never been serviced.

  - title: "Frost and Ice Buildup Covering the Freezer Back Wall"
    description: |
      A thick layer of frost across the back wall of the freezer means the defrost system has stopped working. On most Kenmore and Amana models sold through big-box stores in the Valley, the defrost heater or defrost thermostat is the culprit — occasionally it's the defrost timer on older units without a control board. A failed defrost thermostat is a $20–$40 part; the defrost heater itself runs $30–$80 depending on the model. Left unaddressed, the evaporator coil behind the back panel ices over completely, airflow stops, and the refrigerator section warms up even though the freezer feels cold. The full repair — manually defrosting the coil, testing each component, replacing the failed part — takes 2–3 hours. We stock defrost kits for the most common Kenmore and Amana configurations in the van, so most of these calls are same-visit fixes.

  - title: "Water Pooling Under or Behind the Refrigerator"
    description: |
      Puddles under the unit are almost always a drain issue or a cracked evaporator drain pan — not a refrigerant leak, which is what most people assume first. The defrost drain inside the freezer compartment collects condensation and routes it to a pan under the unit where it evaporates from ambient heat. When that drain clogs with food debris or ice, or the pan cracks, water ends up on the floor. On Frigidaire and GE bottom-mount models, accessing the defrost drain requires removing the freezer drawer and back panel — it's a 90-minute job even for a tech who's done it fifty times. Clearing and flushing a clogged drain runs around $120–$160. If the pan itself is cracked, replacement pans run $30–$60 in parts. Neither repair involves refrigerant handling, so cost stays predictable. Door gasket failure can also cause condensation overflow — worth checking the seal compression while we're in there.

  - title: "Compressor Noise and Vibration — Repair or Replace?"
    description: |
      A clicking, knocking, or loud sustained hum from the bottom of the unit usually means the compressor is laboring. On a Whirlpool or GE that's 8–12 years old, full compressor replacement sometimes isn't worth it — parts alone run $400–$600, and total cost can push $700–$800 on a unit with a retail replacement price of $600–$900. On a newer Samsung or LG (3–5 years old) still within a reasonable service life, compressor replacement makes sense. We diagnose with a hard-start test and amperage draw reading before recommending anything. Worth knowing: a failed compressor start relay mimics the same clicking sound and is a $15 part with a 10-minute swap. We stock start relays for Whirlpool, GE, Frigidaire, and Samsung on every van. If it turns out to be the relay, you'll be out $80 total for the service call and part — not $800.


title: "Yorba Linda Refrigerator Repair — Premium Brands, Hard Water"

intro: |
  Hard water readings in Yorba Linda regularly hit 350–400 ppm — some of the highest in Orange County. That mineral load destroys ice maker assemblies, clogs water inlet valves, and leaves scale on Sub-Zero evaporator coils that looks invisible until the unit stops holding temp. The custom homes and newer tract developments off Yorba Linda Boulevard in 92886 take the worst of it, especially any built-in panel-ready unit that hasn't had its water filter changed on schedule.

localContext: |
  Most of Yorba Linda's housing stock went up between 1975 and 1995. Kitchen footprints in the 92887 zip code — the newer East Lake area especially — were built large enough for 36-inch french-door and built-in counter-depth models. Thermador and KitchenAid column refrigerators show up constantly in the custom builds near Carbon Canyon Road. Older homes closer to Lakeview Avenue have tighter alcoves, which means getting to the condenser fan or pulling a compressor requires working around cabinetry that wasn't designed for service access.

commonProblems:
  - title: "Mineral Buildup Blocking Ice Production"
    description: "Yorba Linda's water supply comes through the MWDOC grid and consistently tests hard. Calcium and magnesium deposits collect inside the ice maker assembly and eventually seal off the water inlet valve entirely. Sub-Zero and Bosch units with narrow supply lines are especially prone — the valve orifice is smaller, so it clogs faster. Most homeowners notice it as a slow drop in ice output months before the maker stops completely."
  - title: "Compressor Running Hot in Summer"
    description: "San Gabriel Valley heat rolls into Yorba Linda from June through September, pushing ambient garage and kitchen temps past 90°F on bad days. A refrigerator's compressor wasn't designed to reject heat into a 92-degree room — it runs longer, harder, and hotter. Thermador and Viking column units in poorly ventilated cabinetry show error codes (E1, F3) that trace back to thermal overload, not a failed part. Condenser coil cleaning and clearance checks fix it most of the time."
  - title: "Evaporator Coil Ice Buildup Cutting Airflow"
    description: "French-door KitchenAid and Samsung models from the late 2010s have a known issue with defrost timer cycling — the evaporator coil ices over completely and air stops moving between the freezer and fresh food compartment. Your fridge section reads 50°F while the freezer stays fine. That's almost always a failed defrost heater or the thermal fuse on the defrost circuit, not the compressor. Call us at (323) 870-4790 before assuming the unit is dead."

faq:
  - q: "How fast can you get to Yorba Linda for refrigerator repair?"
    a: "We run routes from Anaheim Hills and Brea daily, so Yorba Linda is a straight shot — usually there within 2 hours on same-day calls. Schedule online or call (323) 870-4790. Evening slots are available Tuesday through Saturday."
  - q: "Do you repair Sub-Zero and Thermador refrigerators in Yorba Linda?"
    a: "Yes, those are the most common calls in this area. Sub-Zero built-ins need factory-spec refrigerant handling and sealed-system tools most shops don't carry. Thermador column units require specific door hinge calibration after compressor work. Bosch panel-ready models too — we stock the common control boards."
  - q: "What does a refrigerator repair typically cost in Yorba Linda?"
    a: "Diagnostic is $75 and gets applied toward the repair. Most jobs — drain pump replacement, water inlet valve, thermal fuse — run $150–$350 parts and labor. Compressor work on premium units is higher. Same-day emergency service is available; call to confirm same-day availability before booking."

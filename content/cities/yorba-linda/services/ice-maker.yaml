title: "Yorba Linda Ice Maker — Hard Water & Built-In Unit Repair"

intro: |
  Carbon Canyon Road carries some of the hardest tap water in the county straight into
  every kitchen in 92886. Orange County MWD water regularly tests above 300 mg/L total
  dissolved solids — enough to calcify fill valves and supply lines in under two years.
  Sub-Zero built-ins framed into island cabinetry in Vista Del Verde neighborhoods take
  the worst of it.

  The fill valve goes first.

  That's the pattern in nearly every Yorba Linda call we run. Hard water, premium
  appliances, and tight cabinet installations add up to repairs that take longer than
  average and require parts you won't find at a hardware store. Having the right
  components on the truck matters here more than in most Orange County zip codes.

localContext: |
  Most of Yorba Linda's housing went up between 1975 and 2005 — split-level plans and
  large custom builds on the hillsides around 92887 running KitchenAid column
  refrigerators and Thermador built-in refrigeration. Cabinet installations are tight.
  Reaching the ice maker assembly often means partial disassembly of surrounding panels,
  especially in the older tracts near Lakeview Avenue where plumbing sediment compounds
  the mineral load already coming through the supply line.

  Sub-Zero units installed in the early 2000s are hitting the age window where water
  inlet valves and ice mold thermostats start failing together. A valve that might last
  eight years in a cooler coastal climate lasts five in 92886. The heat and the water
  quality work against these appliances simultaneously — and the failure rarely announces
  itself with a clear error code on the display.

  Newer construction in the Fairlynn and Country Club neighborhoods runs panel-ready
  Bosch and Miele refrigerators. These stop cycling quietly, with no alarm, no blinking
  light. Homeowners call two weeks after the problem started because nothing obvious
  flagged it earlier.

commonProblems:
  - title: "Clogged Fill Valve From Mineral Buildup — Most Common Call in 92886"
    description: "Yorba Linda tap water deposits calcium carbonate directly into the fill
      valve orifice — it's the first component to fail on nearly every brand we service
      here. On KitchenAid column freezers, a blocked valve reads like a control board
      fault. It isn't. Homeowners sometimes get quoted $400 for a board replacement when
      the actual fix is a $40 valve swap. Symptoms: no ice cycles, cubes come out
      undersized and hollow, or the unit runs through a full cycle but never fills the
      mold. We stock KitchenAid and Thermador fill valves on the truck, so most of these
      calls in Yorba Linda get resolved on the first visit without a parts delay."
  - title: "Frozen Water Supply Tube Behind the Refrigerator Panel"
    description: "Hot summers push refrigerators into longer duty cycles, which
      paradoxically over-chills the supply tube feeding the ice maker assembly. Sub-Zero
      and Thermador built-ins in the 92887 hillside homes are especially prone — the line
      routes through a panel zone that can drop below freezing when the compressor runs
      continuously through a July heat spike. Result: no water reaches the mold. Zero
      production, no error code. The refrigerator section stays cold so nothing looks
      wrong from the outside. Thawing the line and wrapping the supply tube routing with
      foam insulation usually prevents the same failure from recurring the following
      summer in these Yorba Linda homes."
  - title: "Optical Sensor Failure on Bosch and Miele Panel-Ready Units"
    description: "Panel-ready Bosch and Miele refrigerators in Yorba Linda's newer
      construction develop ice maker sensor failures around the 5–7 year mark. Mineral
      film — the same calcium deposit coating everything downstream of a 92886 tap —
      coats the optical sensor lens and sends a false 'bin full' signal to the control
      board. The ejector motor stops running. Ice fills the mold but never gets pushed
      out. Cleaning the sensor lens and testing the ejector motor resolves most of these
      without a full part replacement. If the ejector arm is seized from mineral buildup,
      that assembly swaps out directly — a 30-minute repair once the panel comes off in
      homes with accessible cabinetry."


  - q: "Do you repair Sub-Zero, Thermador, and Bosch built-in ice makers?"
    a: "Yes — Sub-Zero, Thermador, Bosch, and Miele are the brands we see most in Yorba
      Linda's hillside homes. Fill valves, complete ice maker assemblies, and optical
      sensors for all of them stay stocked on the truck. Diagnostic fee applies toward
      the repair if you move forward."
  - q: "What does ice maker repair usually cost, and can you fix it the same day?"
    a: "Most repairs land between $150–$350. Fill valve swaps and sensor cleanings sit at
      the lower end; control board replacements push higher. Same-day parts cover roughly
      80% of common failures in Yorba Linda. Evening slots are available — call
      (323) 870-4790 if afternoon doesn't work."
  - q: "Does Yorba Linda's hard water actually shorten how long the ice maker lasts?"
    a: "Directly, yes. At 300+ mg/L TDS, calcium deposits accumulate in the fill valve,
      the water inlet line, and around the ice mold thermostat faster than in most of
      Orange County. An inline filter installed on the refrigerator supply line can push
      fill valve life from 3–4 years to 6–8. The cartridge costs about $20 annually —
      worth doing on Sub-Zero and Thermador units especially before the next failure hits.
      Ask about the right filter spec for your model when you call (323) 870-4790."
title: "Yorba Linda Dishwasher Repair — Hard Water Takes Its Toll"

intro: |
  The 92886 zip runs on Metropolitan Water District supply — same mineral-heavy
  water that calcifies Miele spray arms and clogs inlet valves on Bosch
  panel-ready units faster than most homeowners expect. Yorba Linda's tract
  homes along Bastanchury Road were mostly built in the 1980s and 1990s, and
  those kitchens are now showing it in the dishwasher department. Call us at
  (323) 870-4790 — we run this corridor regularly.

localContext: |
  Eastern Yorba Linda — the 92887 side near Carbon Canyon Regional Park —
  skews toward custom-built homes from the late 1980s and early 1990s with
  panel-ready dishwashers recessed under granite countertops. Pulling one of
  those units for a drain pump replacement takes twice as long as a standard
  freestanding job. Across Fairmont Boulevard and into the older blocks off
  Imperial Highway, you'll find more standard-install KitchenAid and Bosch
  600-series units — different repair profile, but same hard water problems.

commonProblems:
  - title: "Calcium buildup blocking spray arms and float switches"
    description: "Metropolitan Water District supply into Yorba Linda runs hard —
      calcium deposits pack into the spray arm jets and jam the float switch
      that tells the machine water level is correct. That Bosch Silence Plus
      you bought three years ago starts leaving grit on glasses. The fix is
      clearing the spray arm ports and testing the float switch assembly, not
      replacing the unit."

  - title: "Drain pump failures in 1980s-era kitchen configurations"
    description: "Older installs under low-clearance cabinets trap heat around the
      drain pump motor. The pump runs hot, the impeller wears out, and you get
      standing water at the bottom of the tub after every cycle. Miele and
      KitchenAid units both use proprietary pump housings — a generic part
      won't seat correctly. Getting the right OEM component matters here."

  - title: "Detergent dispenser door sticking on Thermador and built-in units"
    description: "Built-in Thermador dishwashers installed in Yorba Linda's higher-end
      homes off Lakeview Avenue commonly develop a detergent dispenser latch
      failure after a few years of hard-water mineral spray hitting the
      mechanism. The spring-loaded door stops popping open mid-cycle. Dishes
      come out greasy. It's usually the dispenser actuator or the wax motor
      behind it — a $40 part, not a new appliance."

faq:
  - q: "How fast can you get to Yorba Linda for dishwasher repair?"
    a: "We're usually in the area same-day — running routes from Anaheim Hills
      through Placentia into Yorba Linda regularly. Travel time from our
      closest tech is typically under 45 minutes. Call (323) 870-4790 to
      confirm an AM or PM slot, or book online if same-day works."

  - q: "Do you repair Miele and Thermador dishwashers?"
    a: "Yes — Miele, Thermador, and Bosch are the three we see most often in
      Yorba Linda's newer custom homes. Common issues: Miele drain pump
      failures, Thermador dispenser actuators, Bosch E24 drain error codes.
      We carry parts for all three."

  - q: "What does a dishwasher repair typically cost here, and is same-day available?"
    a: "Diagnostic visit is flat-rate, credited toward any repair. Most jobs —
      drain pump swap, spray arm replacement, control board reset — run
      $150–$320 parts and labor. Same-day slots open most weekdays;
      evening appointments available Tuesday and Thursday."

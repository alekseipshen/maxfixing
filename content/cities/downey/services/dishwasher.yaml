title: "Downey Dishwasher Repair — Hard Water Hits These Units Hard"

intro: |
  Post-war tracts south of Firestone Boulevard have been running LA County tap water
  through their kitchen appliances since the 1950s — and the mineral load is relentless.
  Downey's supply consistently tests above 350 ppm hardness. That's the kind of water
  that coats a Samsung DW80-series spray arm in scale within 18 months and jams the
  detergent dispenser door shut before the unit hits its third year.

localContext: |
  The 90241 and 90242 zip codes are mostly original ranch-style homes and 1970s tract
  housing — tight under-counter installs with almost zero clearance.

  Stonewood-adjacent streets see a lot of builder-grade GE and Whirlpool units that
  were never swapped out when the homes were flipped. Some blocks off Firestone have
  three different dishwasher generations running side by side — a 2003 GE next door to
  a 2019 Samsung next door to a Bosch that came with a 2015 kitchen remodel. We've
  serviced units in the Apollo Park corridor, along Lakewood Boulevard between Firestone
  and Imperial Highway, and deep into the Rives Avenue neighborhoods where homes sit on
  narrow lots with carport access only. Getting a dishwasher out of one of these Downey
  ranch kitchens sometimes means pulling the lower cabinet panel just to reach the drain
  pump. Parking the service van, routing the drain hose, working in a galley kitchen
  with the pantry door swinging into you — that's just how it goes out here.

  Downey Landing changes things.

  The 90240 zip — newer condos and townhomes near the old Rockwell aerospace site off
  Lakewood Boulevard — runs compact 18-inch dishwashers squeezed into European-style
  cabinetry. Bosch 300 and 500 Series models dominate there, totally different repair
  profile from the full-size Whirlpools across town. The Columbia Memorial Space Center
  sits a few blocks from streets where we've pulled out three-decade-old GE dishwashers
  still limping along on original drain pumps. Stewart and Gray Road side streets mix
  owner-occupied ranch homes with recently flipped rentals — half the calls we get from
  that corridor involve a dishwasher the new tenant has never touched and has no service
  history at all.

commonProblems:
  - title: "Clogged Spray Arms from Downey's Hard Tap Water"
    description: |
      The calcification builds slowly — you notice it when the top rack stops getting
      clean and the bottom rack still comes out fine. That's the upper spray arm nozzles
      closing off from mineral deposits. On Bosch 500 Series units, the middle spray arm
      rotor also seizes. Cleaning helps short-term, but once the arm's internal channels
      are scored, replacement is the only fix.

  - title: "Standing Water After Every Cycle — Drain Pump Failure"
    description: |
      Most common call we get from the 90240 zip.

      On older GE Profile and Whirlpool units, food debris bypasses a worn filter screen
      and kills the pump motor. The float switch gets stuck too — triggers error codes
      like F2 or E1 and shuts the cycle down mid-run. Most people assume it's the control
      board. Usually it isn't. Drain pump replacement runs $120–$170 in parts and labor.
      Control board replacement runs three times that and fixes nothing.

  - title: "Door Won't Latch — KitchenAid Plastic Housing Cracks"
    description: |
      KitchenAid dishwashers in Downey's older homes cycle through a lot of heat.
      The door latch assembly housing cracks from thermal fatigue, and once it does,
      the control board won't initiate a cycle at all — reads as a no-start fault.
      Homeowners replace the control board chasing a ghost. The latch is a $45 part,
      not a $300 board.

faq:
  - q: "How fast can you get to Downey for dishwasher repair?"
    a: |
      We run the I-5 and 710 corridors daily — Downey is typically a 20-30 minute drive
      from our nearest tech. Call before noon at (323) 870-4790 and same-day service is
      usually doable. Street parking around Stonewood and the Rives Avenue side streets
      is easy for the van — no delays on that end.

  - q: "Do you repair Samsung and LG dishwashers in Downey?"
    a: |
      Yes — Samsung and LG make up a big chunk of our calls here. On Samsung units we
      mostly see drain pump blockages and inlet valve failures. LG calls are usually
      control board faults or spray arm issues. We carry parts for both on the van.
      Bosch, Whirlpool, and GE too.

  - q: "What does a dishwasher repair cost in Downey, and how does the process work?"
    a: |
      Flat diagnostic fee upfront — we tell you the failed part and total cost before
      anything is touched. Most drain pump and spray arm jobs land between $150–$260
      including labor. Evening and weekend emergency slots are available. Schedule at
      (323) 870-4790 or book online — we're usually out within 2 hours on urgent calls.


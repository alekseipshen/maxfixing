    a: "Usually within 2 hours of your call. We run the southeast LA corridor daily — Downey, Bellflower, Norwalk, Compton, Lynwood. Call (323) 870-4790 and we'll give you a real arrival window, not a four-hour guess."
  - q: "Do you repair Samsung and LG washers in Downey?"
    a: "Yes — front-load and top-load both. Samsung OE error codes, LG UE balance faults, drain pump swaps. Also handle Whirlpool and GE top-loaders, which are still all over Downey's older housing stock."
  - q: "What does washer repair cost, and is same-day service actually available?"

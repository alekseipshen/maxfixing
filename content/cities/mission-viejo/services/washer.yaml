title: "Mission Viejo Washer — Mineral Scale Kills Inlet Valves Fast"

intro: |
  The planned streets off Marguerite Parkway were laid out in the early 1970s, and those original homes have seen three generations of washers. Moulton Niguel Water District serves 92691 and 92692 with supply that tests around 380 ppm hardness — enough to calcify a Bosch Serie 6 water inlet valve within five years. Most owners assume it's the control board. Usually it isn't.

localContext: |
  Mission Viejo's housing stock runs almost entirely from 1972 to 1990, which means laundry alcoves were dimensioned for freestanding top-loaders — not the front-loading pairs now wedged into those same spaces. Around Olympiad Road and the Casta del Sol neighborhood (92691), stacked Miele and LG units sit in tight utility closets where access for service is tight. Aging supply lines in these homes compound the problem: mineral deposits narrow them over time, cutting water pressure before it even reaches the inlet valve.

commonProblems:
  - title: "Water Inlet Valve Calcification from Moulton Niguel Supply"
    description: "At 350-400 ppm hardness, this water is aggressive on solenoid screens. A Bosch 500 series front-loader develops calcium blockage on the inlet valve within 3-5 years — fill cycle slows, then the machine throws an E17 fault and stops mid-load. Replacing the valve runs $45-90 in parts. Ignore it and you risk a warped door gasket from standing water."
  - title: "Drum Bearing Failure in 1980s Top-Loaders"
    description: "The ranch homes near Trabuco Road still run Maytag Bravos and older Kenmore 700-series machines. Drum bearings on those units last 8-12 years before the grinding starts on spin cycles. Once the bearing goes, it takes the spin basket seal with it and water hits the floor. Continued use accelerates damage to the drive belt and control board — what starts as a bearing job becomes a much bigger bill."
  - title: "Drain Pump Clogs Locking Samsung Front-Loaders"
    description: "Samsung WF45R6100AW machines — common in Mission Viejo's newer developments near La Paz Road — throw 5E or OE codes when the drain pump filter backs up with lint, hard water sediment, and small debris. Door stays locked. Water sits. Most owners don't know the filter access panel exists on the lower front fascia. It needs cleaning every 3-4 months in Southern California water conditions."

faq:
  - q: "How fast can you get to Mission Viejo for a washer repair?"
    a: "From our South OC route, we reach 92691 and 92692 same-day — usually within 2 hours of your call. The 5 freeway is the variable. Early morning slots fill fastest. Call (323) 870-4790 before noon and we can almost always get there the same day."
  - q: "Do you repair Miele and Bosch front-load washers in this area?"
    a: "Yes. Miele W1 series and Bosch 500/800 series are both common throughout Mission Viejo. We stock inlet valves, drain pump assemblies, and door latch components for both. Miele diagnostics require brand-specific tools that most shops don't carry — we do."
  - q: "What does a washer repair typically cost, and do you offer emergency visits?"
    a: "Diagnostic fee is $75, credited toward the repair if you proceed. Drain pump and inlet valve jobs typically run $150-280 total — quote given before any work starts. Evening slots available Thursday through Friday. Same-day emergency service is available if the drum is flooded or you've got a slow leak onto hardwood."
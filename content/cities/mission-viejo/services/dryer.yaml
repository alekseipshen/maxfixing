title: "Mission Viejo Dryer — Vent-Choked 70s Homes, Fixed Fast"

intro: |
  Planned communities like Mission Viejo age in a specific way — the Spanish-tile roofs
  and cul-de-sacs look fine, but inside those 1970s laundry closets, dryer vents take
  routes that made sense to a builder in 1974 and nobody since. A Bosch or Miele dryer
  running two full cycles to dry one load isn't dying — it's choking. We're in the
  92692 zip regularly and can usually reach you same day.

localContext: |
  Most of the housing stock in 92691 and 92692 was built between 1970 and 1990 as part
  of the original Mission Viejo master plan. That means laundry rooms tucked against
  interior walls, with vent runs that travel up through attics before exiting the roofline
  — sometimes 15 feet or more. Near the Oso Viejo Park corridor, we see a lot of
  side-by-side laundry pairs in hallway niches where lint traps are rarely fully cleaned
  and the flex duct behind the unit has been kinked since the Clinton administration.

commonProblems:
  - title: "Long vent runs triggering thermal fuse failures in older ranch homes"
    description: "A dryer that starts and stops after a few minutes, or won't heat at all,
      has often blown its thermal fuse — a one-time safety cutout that trips when exhaust
      temp spikes. In Mission Viejo's 1970s-era homes, the culprit is almost always a
      partially blocked vent run. That KitchenAid electric dryer isn't defective; the
      blower wheel is fighting 14 feet of lint-narrowed duct. We replace the fuse and
      clear the line in the same visit."
  - title: "Drum not spinning — drive belt and roller wear on high-mileage machines"
    description: "Dryers in master-planned neighborhoods like this often go 10-12 years
      before a family touches them. By then the drive belt has stretched or snapped, and
      drum rollers are worn flat, producing a low grinding sound before the drum stops
      entirely. Miele and Bosch units develop this differently than Whirlpool — the
      tensioner pulley geometry is tighter, and sourcing OEM parts matters if you want
      it to run quietly again."
  - title: "Gas valve igniter failure — dryer runs but produces no heat"
    description: "South OC gets natural gas dryers in probably 60% of the homes we visit
      in Mission Viejo. The gas valve igniter glows orange to open the valve, and when it
      fails you get a drum that spins but air that never gets above room temperature.
      Maytag and Whirlpool gas units from the mid-2000s are the most common offenders here.
      We carry igniter kits in the van for these models."

faq:
  - q: "How fast can you get to Mission Viejo for a dryer repair?"
    a: "We run a regular route down the 5 from Irvine — Mission Viejo is a straight shot.
      Same-day slots fill up, so call (323) 870-4790 before noon if you need us today.
      Evening appointments are available Tuesday through Saturday."
  - q: "Do you repair Bosch and Miele dryers, or just the standard brands?"
    a: "Yes — Bosch heat-pump dryers and Miele T1 condensation units are both in our
      regular rotation. We also handle KitchenAid, Whirlpool, Maytag, LG, and Samsung.
      Bosch's E:18 error code and Miele's F138 fault are calls we get weekly."
  - q: "What does a dryer repair usually cost, and how do you handle diagnostics?"
    a: "Diagnostic visit is a flat fee — applied toward the repair if you proceed. Parts
      and labor depend on what's failed, but a thermal fuse swap or belt replacement
      usually lands well under the cost of a new machine. We quote before touching anything,
      and carry most common parts. Same-day turnaround on most jobs."

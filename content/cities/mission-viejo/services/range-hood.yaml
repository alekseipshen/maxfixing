title: "Mission Viejo Range Hood — Fix Fans, Dampers & Vent Ducts"

intro: |
  Kitchens near Lake Mission Viejo run hot — literally. The Wolf and Thermador
  chimney hoods above gas ranges in these 92692 homes see daily cooking, and
  when the blower wheel seizes or the grease baffle stops drawing, smoke backs
  into open-plan living rooms fast. Built-in hoods in this neighborhood are
  rarely quick swaps; the ductwork and the unit both need a proper look before
  any part gets ordered.

  Mission Viejo kitchens are not interchangeable. Homes in Aegean Hills and
  Pacific Hills — the planned tracts north of Alicia Parkway built through the
  late 1970s — have completely different duct configurations than the semi-custom
  builds in the Casta del Sol corridor near Marguerite Parkway. Casta del Sol's
  older ranch-style homes in 92691 often have original aluminum flex duct that
  was never meant to handle the 600-CFM Bosch or KitchenAid inserts owners
  dropped in during kitchen refreshes. The homes off Jeronimo Road tell a
  different story again — larger footprints, larger hoods, larger problems when
  something quits mid-dinner.

localContext: |
  Mission Viejo was built out mostly between 1971 and 1990 — solidly
  constructed, but ductwork from that era was sized for cheap builder-grade
  hoods, not the high-CFM Bosch or KitchenAid inserts homeowners have since
  upgraded to. The 92691 side, particularly the tracts off Marguerite Parkway
  near Oso Creek Trail, frequently has 4-inch vent runs where modern hoods
  require 6-inch minimum. That mismatch shows up as backpressure, motor
  strain, and noise — symptoms that look like a bad motor but aren't.

  The 92692 zip runs along the eastern edge of the city toward Trabuco Road
  and up toward the Saddleback Valley corridor. Homes here tend to be larger
  — more of the custom builds and semi-custom tract models with Thermador and
  Wolf range hoods installed during kitchen remodels in the 2000s and 2010s.
  Those remodels sometimes brought new hoods without bringing new ductwork,
  which means we still find undersized flex runs stuffed into original chases
  behind cabinets that haven't been opened since Clinton was in office.

  La Paz Road splits the two zip codes roughly down the middle. South of
  La Paz near the Oso Parkway interchange, the homes run smaller and older —
  that's where original dampers and original motors are most likely still
  in service. North of it toward the 241 corridor, kitchens got remodeled
  and upgraded. Different problems, different parts, same general duct
  headaches.

commonProblems:
  - title: "Blower motor failure in Wolf and Thermador inserts — capacitor goes first"
    description: "South Orange County afternoons get hot, and west-facing Mission Viejo
      kitchens bake by 3 PM. Sustained heat degrades the motor capacitor inside
      Wolf and Thermador hood inserts faster than manufacturers expect. The hood
      hums but the blower wheel won't spin. Nine times out of ten it's the
      capacitor, not the full motor — a $90 part versus a $400 one. Wolf
      inserts on the 36-inch gas ranges common in 92692 are especially prone
      to this; the motor sits closer to the cooking surface than most homeowners
      realize. In Pacific Hills and the larger Aegean Hills builds, the
      Thermador chimney-style hoods have a secondary issue: the LED driver
      board and the capacitor are on the same thermal path, so when one goes
      the other usually follows within six months. Diagnose both before
      ordering parts."
  - title: "Grease-packed baffle filters throwing the blower wheel off-balance"
    description: "Viking and Bosch hoods in 92691 commonly go 18 months between filter
      cleanings. By then grease isn't just coating the baffle — it's migrated
      into the blower wheel housing, building up unevenly and creating the
      low-frequency rattle homeowners blame on loose ductwork. Cleaning the
      filter at that point isn't enough; the blower wheel itself needs
      inspection and usually replacement. Miele hood owners in the newer
      Stoneridge and Canyon Crest tracts near Trabuco Road see this pattern
      too — premium filters on these units still clog if cooking is heavy.
      The blower wheel on a Miele DA 6996 W is a two-hour job that most shops
      won't touch in-home. We do."
  - title: "Seized wall-cap damper — the hood runs but vents nothing outside"
    description: "Homes off Felipe Road and around the older Oso Creek tracts, and
      especially in Casta del Sol's 1970s-era ranch stock, often still have
      original aluminum wall-cap dampers. Grease and age lock the flapper
      closed. A KitchenAid or Miele hood appears completely functional — light
      on, motor spinning — but all that exhaust recirculates inside. It shows
      up as persistent cooking smell and greasy film on cabinet faces above
      the hood. Swapping the exterior damper assembly takes under an hour and
      costs a fraction of what people expect. Call (323) 870-4790 before
      assuming the hood itself needs replacing — this fix runs well under
      $200 in most cases."


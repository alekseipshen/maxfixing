    a: "We run regular routes down the 5 corridor through South Orange County.
      Mission Viejo is typically a same-day call — usually on-site within 2
      hours of booking. Call (323) 870-4790 to check today's open slots or
      schedule online. Evening appointments are available for urgent cases."
  - q: "Do you repair Wolf, Thermador, and Viking range hoods?"
    a: "Those are the three we see most in this part of OC. Wolf inserts
      typically need a blower motor or control board. Thermador chimney hoods
      commonly have LED driver board failures. Viking wall-mounts usually need
      blower wheel replacement or a new motor capacitor. All diagnosed in-home."
  - q: "What does range hood repair cost in Mission Viejo, and how does it work?"
    a: "Flat-rate diagnostic visit — no surprise fees. Common repairs like damper

title: "Mission Viejo Range Repair — Built for Planned-Community Kitchens"

intro: |
  Lake Mission Viejo's neighborhoods — the 1970s ranch-styles near Olympiad Road, the
  larger homes tucked around Casta del Sol — were plumbed for gas when the city was
  built in the early 1970s, and that original infrastructure is still running Thermador
  and Wolf ranges daily. Forty-plus years of cooking leaves its mark on igniter
  assemblies and gas valve seats. Hard water from Orange County's municipal supply also
  accelerates mineral buildup inside burner ports and around control panel connections —
  usually the first thing we address on a call here.

localContext: |
  Mission Viejo's housing stock is almost entirely single-family homes built between
  1970 and 1985 — a master-planned layout that gave each house a dedicated gas line and
  a full kitchen footprint. The 92692 zip, near Oso Creek Trail and Marguerite Parkway,
  skews toward six-burner Wolf or Viking freestanding ranges. In 92691, KitchenAid and
  Bosch slide-ins are more common. Service vans get easy driveway access throughout the
  city — none of the apartment loading-dock situations or residential permit zones you
  deal with in denser LA neighborhoods. Parking at the curb, tools to the door in one
  trip — it keeps jobs moving.

commonProblems:
  - title: "Igniter Clicks Constantly But the Burner Won't Light"
    description: |
      Carbon buildup around the spark electrode gap is almost always the culprit —
      grease splatter bakes onto the burner cap over years of use and breaks the arc
      path entirely. On Wolf and Viking ranges, the igniter module itself can weaken
      past the point where cleaning helps, especially on models installed in the 1990s.
      Sometimes burner port cleaning solves it in 20 minutes; other calls need a full
      spark electrode replacement and igniter module swap. Wolf dual-fuel models
      occasionally throw an F1 lockout when the control board stops seeing spark
      confirmation — that's a module issue, not just a dirty electrode, and it needs
      a different fix.
  - title: "Oven Runs Too Hot or Too Cold — Bake Element and Thermostat Drift"
    description: |
      Thermador double ovens in Mission Viejo's larger homes start showing oven
      thermostat drift after 10 to 15 years of daily use — the calibration slips, and
      you'll notice one rack burning while another undercooks in the same session. A
      weakening convection fan motor compounds this by creating rotating hot spots the
      thermostat can't compensate for. The bake element develops internal failures long
      before it fully quits and trips a visible error code.
  - title: "Faint Gas Smell During Cooking — Valve and Seal Wear"
    description: |
      A gas odor when a burner is running usually points to a worn burner seal or a gas
      valve that's not fully seating at the o-ring. KitchenAid and Bosch slide-in
      models show this pattern at the internal gas valve assembly first — the seat wears
      unevenly after years of thermal cycling and allows trace amounts of gas past the
      shutoff. Older Viking ranges in Mission Viejo develop the same issue at the brass
      valve body itself after extended use in homes with high cooking frequency.
      Turn the range off, ventilate the kitchen, and call for same-day service.

faq:
  - q: "How fast can you get to Mission Viejo for Range repair?"
    a: |
      Most Mission Viejo calls get a technician on-site within 2 hours of booking — we
      run regular routes through the 241 or Alicia Parkway depending on traffic from
      Irvine. Evening slots are open most weekdays for homeowners who can't step away
      from work. Call (323) 870-4790 or book online and we'll confirm a window same
      day, often within the hour.
  - q: "Do you repair Thermador, Wolf, and Viking ranges in Mission Viejo?"
    a: |
      Yes — those three are the most common premium brands we see in Mission Viejo
      homes, and we keep parts on hand for both. We stock igniter modules for Wolf
      dual-fuel ranges and Thermador Star Burner spark assemblies specifically. KitchenAid
      and Bosch slide-ins are also frequent calls throughout 92692 and fully within our
      regular scope. Viking freestanding ranges in the 92691 zip tend to need gas valve
      body service around the 15-year mark — we carry the common valve assemblies for
      those models on the truck.
  - q: "How does pricing and the repair process work for Range service?"
    a: |
      Diagnostic visit runs $75 to $95, credited toward the repair if you move forward.
      Parts on premium brands go higher — a gas valve assembly or control board on a
      Viking or Thermador typically runs $150 to $300 in parts alone, labor separate. We
      give a full quote before touching anything. Same-day repair is available on most
      calls if the part is already on the truck.


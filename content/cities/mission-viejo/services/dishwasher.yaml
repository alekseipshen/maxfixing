title: "Mission Viejo Dishwasher — Hard Water & Panel Unit Repairs"

intro: |
  South Orange County tap water runs hard — Metropolitan Water District supply through 92691 and 92692 carries enough dissolved calcium to coat spray arms and heating elements inside 18 months. That Miele or Bosch panel-ready unit built into the kitchen near Lake Mission Viejo looks clean on the outside. Inside the sump, mineral scale tells a different story. Most "not cleaning right" calls here aren't about the machine failing — they're about water chemistry winning.

localContext: |
  Mission Viejo is a planned community, built out from the late 1960s through the mid-1980s. The cul-de-sacs off Marguerite Parkway, the hillside tracts in the 92692 zip — kitchens in these homes were renovated in waves through the 2000s and early 2010s, which is when panel-ready and built-in dishwashers became the standard upgrade. KitchenAid and Bosch installations are everywhere. Custom cabinetry around these units leaves almost no clearance, so pulling the machine for a drain pump or inlet valve repair takes patience and the right low-profile tools.

commonProblems:
  - title: "Spray Arm Clogging from South OC Hard Water"
    description: "Dissolved minerals from MWD supply collect inside the spray arm nozzles over time, cutting water pressure to almost nothing. The float switch reads a full tub, water heats up, the cycle runs — dishes come out spotted and greasy anyway. Bosch 500 Series units installed during the 2010s renovation wave are showing this pattern regularly now. Deliming helps temporarily, but a cracked or permanently clogged spray arm needs replacing."

  - title: "Drain Pump Failure on Aging Built-In Units"
    description: "Standing water at the bottom of the tub after a cycle points to a drain pump that's seized or packed with debris. Miele and KitchenAid built-ins in 92691 homes are hitting the 12-15 year mark — drain pump bearings have a lifespan. F24 or E24 error codes are the most common signals we see. Left alone, a failed drain pump will eventually back up into the door gasket seal and cause secondary damage."

  - title: "Door Latch Assembly Misalignment on Panel-Ready Models"
    description: "Integrated door panels add dead weight the factory latch mechanism wasn't always rated for long-term. Thermador and Miele panel-ready units in Mission Viejo's higher-end kitchen builds develop latch misalignment after years of use — the control board reads a faulty door signal and refuses to start. The fix is usually the latch assembly itself, not the board, but getting the diagnosis right saves a $400 misfire on electronics."

faq:
  - q: "How fast can you get to Mission Viejo for dishwasher repair?"
    a: "We run South OC calls regularly — off the 5 or 241, Mission Viejo is direct. Call (323) 870-4790 before noon and same-day service is usually available. Parking in the residential tracts here is straightforward, so we're not fighting apartment logistics."

  - q: "Do you repair Miele and Thermador dishwashers?"
    a: "Yes, both are common in Mission Viejo's remodeled kitchens. Miele drain pump replacements, Thermador detergent dispenser failures, KitchenAid control board resets — these are regular jobs for us. Bosch 300 and 500 Series too."

  - q: "What does dishwasher repair typically cost in Mission Viejo?"
    a: "Diagnosis is $75, applied toward the repair. Most jobs — drain pump, inlet valve, heating element swap — land between $150 and $350 parts and labor. Common parts ride on the van, so one trip usually closes it. Evening slots available if daytime doesn't work."

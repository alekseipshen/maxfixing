title: "La Habra Dryer — Thermal Fuses, Long Vents, and Valley Heat"

intro: |
  Harbor Boulevard splits La Habra right down the middle, and the neighborhoods east toward Brea
  run a lot of LG and Samsung laundry pairs in homes built between 1965 and 1982. That Samsung
  electric that stopped heating mid-load? Usually a blown thermal fuse — cooked by a long exhaust
  vent that hasn't been cleaned in years. Garage temps here hit 105°F in July. That ambient heat
  is exactly what pushes a marginal fuse over the edge.

localContext: |
  The 90631 zip covers most of La Habra's residential grid, and a big share of that housing stock
  dates to the late-60s through early-80s tract build-out. Dryer vents in these homes often run
  15 to 20 feet horizontally through a garage ceiling before exiting the wall — well above what
  most manufacturers spec. Lambert Road and Imperial Highway-area homes see this layout constantly.
  That extra duct length creates back-pressure the blower wheel fights on every single cycle.

commonProblems:
  - title: "Thermal Fuse Failures in Hot, Unventilated Garages"
    description: |
      La Habra garages hit 100°F+ in summer, and a dryer already fighting a long exhaust run has
      no margin left — the thermal fuse trips permanently. Fix means replacing the fuse, cleaning
      the full vent path, and checking the blower wheel for lint caking. Skip any one of those
      and it blows again inside two months. Samsung and LG electric models are the most common
      victims of this exact sequence.

  - title: "Drum Not Spinning — Drive Belt and Drum Roller Wear"
    description: |
      Older homes here often run the same dryer 12-15 years without a service call. At that age
      the drive belt gets brittle and drum roller bearings wear down. LG front-loaders signal the
      problem early — a squealing thump on every rotation before the drum stops entirely. Belt
      replacement takes about an hour, but always swap the idler pulley at the same time. They
      go together.

  - title: "Long Dry Times on Bosch Condensation Units"
    description: |
      Some newer La Habra homes near the 57 freeway run Bosch condensation dryers — no external
      vent at all. These use a heat exchanger that collects lint and mineral scale from OC's
      notoriously hard water supply. Coated condenser fins drop drying efficiency 30-40%. The
      moisture sensor on the drum wall also gets fouled, cutting cycles short before clothes are
      actually dry.

faq:
  - q: "How fast can you get to La Habra for dryer repair?"
    a: |
      Most weekday mornings we can reach 90631 within 2 hours — Harbor Boulevard traffic is
      manageable before noon. Call (323) 870-4790 to check same-day slots. Evening appointments
      available most weekdays if mornings don't work.

  - q: "Do you repair LG and Samsung dryers specifically?"
    a: |
      Yes — LG and Samsung are the bulk of what we see in La Habra. LG typically needs drum
      rollers, drive belts, or moisture sensor swaps. Samsung gas models often come in needing a
      gas valve igniter replacement. Standard parts for both brands stay on the van.

  - q: "What does dryer repair usually cost, and is same-day service available?"
    a: |
      Most La Habra repairs run $150-$280 depending on parts. Thermal fuse jobs land on the lower
      end. Same-day service is usually available if you call before 2pm — schedule online or reach
      us at (323) 870-4790. Emergency evening slots are open most weekdays.

title: "La Habra Dishwasher Repair — Hard Water Kills Spray Arms Fast"

intro: |
  Carbon Canyon Regional Park sits less than two miles from some of the oldest residential streets in La Habra, where 1960s ranch-style homes have been steadily updated — often with a Bosch 500 Series or KitchenAid dishwasher as the centerpiece of a remodeled kitchen. MWD hard water running through the 90631 zip hits those machines hard. Spray arm jets and inlet valves clog faster than most homeowners expect, especially if nobody has run a descaler in years.

localContext: |
  Most of the 90631 housing stock dates from the 1950s through the early 1970s — slab-foundation ranchers and two-story colonials on streets like Euclid and Palm. Kitchens in these homes were built tight. A full-size Samsung or LG dishwasher squeezed into an original 24-inch cabinet opening can be tricky to service — pulling the unit often means removing the toe kick and sometimes the adjacent cabinet panel just to reach the drain pump connection.

commonProblems:
  - title: "Clogged Spray Arms from La Habra's Hard Water Supply"
    description: "La Habra's MWD supply tests close to 350-400 ppm TDS. That mineral load coats spray arm jets over months of normal use — Bosch lower spray arms are especially prone since the holes are narrower than most other brands. Once blocked, dishes on the bottom rack come out gritty or still dirty. The inlet valve screen usually needs cleaning at the same time. Catching it early means a soak and rinse; left too long, the arm just gets replaced."
  - title: "Standing Water After the Cycle — Drain Pump Failure"
    description: "A pool of dirty water sitting in the tub after a full cycle typically points to a jammed or burned-out drain pump. KitchenAid and Whirlpool-platform machines often throw an F8 E4 code when this happens. Food debris and grease can lock the impeller solid. A kinked drain hose or blocked sink air gap produces the exact same symptom — worth checking first before replacing anything."
  - title: "Detergent Dispenser Won't Open Mid-Cycle"
    description: "Samsung and LG dishwashers see a lot of dispenser failures. The wax motor inside the assembly fails, or mineral buildup from hard water seizes the spring-loaded door latch. End result: the tablet sits undissolved at the bottom and dishes come out greasy with a soapy film. Replacing the dispenser assembly usually runs under an hour as long as the control board wiring harness is undamaged."

faq:
  - q: "How fast can you get to La Habra for a dishwasher repair?"
    a: "La Habra sits right on the LA/OC county line — we come down from the 605 corridor or up from the Anaheim area depending on availability. Same-day calls typically arrive within 1-2 hours. Call (323) 870-4790 to check today's schedule and lock in a slot."
  - q: "Do you repair Bosch and KitchenAid dishwashers in the 90631 area?"
    a: "Bosch is probably 40% of what we see in La Habra — circulation pump, control module, and door latch assembly are the usual suspects. KitchenAid and Samsung come up constantly too. LG drain pump failures are their own regular category. Parts for all of these stay on the truck."
  - q: "What does a dishwasher repair typically cost in La Habra?"
    a: "Diagnostic visit is $85, applied toward the repair if you move forward. Most jobs — drain pump swap, heating element replacement, spray arm fix — land between $150 and $350 total. Same-day and next-morning slots are available, evening appointments Tuesday through Friday. Call (323) 870-4790 to book."

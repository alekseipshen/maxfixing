  - q: "Do you repair KitchenAid and Bosch ranges in La Habra?"
    a: |
      Both are common in this part of Orange County. KitchenAid slide-ins with ignition board failures and persistent igniter problems on Bosch gas ranges are regular calls. Also service LG, Samsung, Thermador, and Frigidaire — gas, electric, and dual-fuel models. Stock parts for most of these brands come with us on the van, so the first visit typically ends with a completed repair rather than a parts order.
  - q: "What does range repair typically cost in La Habra, and how does the process work?"
    a: |
      Diagnostic fee is $75, credited toward the repair when you proceed. Igniter swaps and RTD sensor replacements typically run $150-$280 all-in for parts and labor. Control board replacements on KitchenAid or Bosch models land higher — usually $280-$450 depending on the part. Same-day emergency service is available. Majority of range jobs close on the first visit when the part is in stock, which covers most common failures.
  - q: "Do you repair KitchenAid and Bosch double ovens in La Habra?"
    a: "Both are common in La Habra kitchens and we carry parts for the models we see most often. KitchenAid work typically means heating element swaps or door hinge assembly repairs. Bosch usually comes down to a temperature sensor replacement or control board diagnostic on the HBL and HBN series. We also see Thermador double wall units in the La Habra Heights corridor — those require brand-specific tools and OEM parts, but we stock the common ones. Evening appointments are available if weekday mornings don't work."

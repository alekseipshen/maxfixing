title: "La Habra Ice Maker — Hard Water Scale & Same-Day Repair"

intro: |
  Mineral-heavy water from the Municipal Water District of Orange County arrives in 90631 carrying enough dissolved calcium to seal a fill valve within two years of regular use — faster than most cities in LA County see it. The KitchenAid built-ins common in the older ranch homes south of Portola Park tend to show this first: undersized cubes for a few weeks, then nothing at all.

  La Habra sits right on our daily Orange County route. Most calls get a same-day visit, usually there within 2-3 hours of booking.

localContext: |
  La Habra's residential grid tells two distinct stories. The stretch between Whittier Boulevard and Lambert Road — bungalows and ranch houses built between 1958 and 1972 — has floor plans sized for appliances of that era, before built-in refrigeration was standard. Supply lines here often run from under-sink taps across tight kitchens, giving dissolved minerals more pipe to deposit on. Frozen fill tube failures behind cabinetry in these older layouts are a regular call in 90631.

  North of Imperial Highway, the housing stock shifts.

  Larger lots near La Habra Heights and the hillside streets off Harbor Boulevard mean larger kitchens and appliances to match — Bosch column refrigerators, KitchenAid built-ins, occasional Sub-Zero units in the custom homes. Those require brand-specific tooling most local shops don't stock on the truck. Meanwhile, the mid-2010s Samsung and LG french-door refrigerators that landed in the Lambert Road corridor are now hitting the 8-10 year mark where sensor module failures start clustering — a predictable pattern for that appliance generation.

commonProblems:
  - title: "Calcium-Sealed Fill Valve — La Habra's Most Common Failure"
    description: |
      La Habra tap water consistently tests around 350 ppm total dissolved solids. That hardness gradually seals the water inlet valve — the solenoid that opens to deliver water to the ice mold — until flow drops to a trickle and cubes come out undersized before stopping entirely.

      KitchenAid and Bosch units are most susceptible. Their fill valves carry narrower orifices than mass-market brands, so mineral buildup chokes them faster. Catching this early means a 45-minute valve swap. Wait too long and scale migrates into the module itself, tripling the repair cost.

  - title: "Frozen Fill Tube — No Ice, No Error Code on the Display"
    description: |
      The small tube routing water from the supply line to the mold can freeze completely solid — and the refrigerator won't throw any error code when it does. La Habra homes where the fridge sits against a north-facing wall or near an exterior door are most prone in winter.

      LG door-mounted units are especially vulnerable because their fill tube runs a longer path up to the upper-door module. Defrosting the line takes about 20 minutes. More important is checking the module thermostat calibration on-site — a misset thermostat is usually what caused the freeze in the first place, and skipping that step means a repeat call in six weeks.

  - title: "Samsung and LG Sensor Malfunctions — Bin Logic Breaks Down"
    description: |
      Samsung french-door refrigerators showing error code 5E or PC ER, and LG units displaying error 1F, are flagging a failed optical sensor inside the ice-making module. That sensor tells the machine when the bin is full.

      Once it drifts out of spec or burns out, the appliance either floods the bin until it jams the door or stops producing entirely. Both brands require proprietary sensor assemblies — ordering the wrong part generation wastes an entire service call. We stock the common modules for 2013-2020 models, which cover most of what's running in La Habra's 90631 zip right now.


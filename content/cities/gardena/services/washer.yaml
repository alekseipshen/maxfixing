title: "Gardena Washer Repair — Hard Water & Post-War Appliance Fixes"

intro: |
  Alondra Park-area homes in the 90247 zip run a lot of LG and Whirlpool
  top-loaders — many sitting in tight utility closets of houses built right
  after the war. South Bay municipal water comes in around 250-300 ppm
  hardness, which quietly kills the water inlet valve faster than most
  homeowners realize. That mineral buildup accounts for more service calls
  here than any other single cause. Gardena's housing stock is old enough
  that a lot of these machines are working harder than they were designed to.

localContext: |
  The 90248 side of Gardena along Vermont Avenue has a lot of 1950s ranch
  houses with original laundry setups — sometimes just a converted garage
  or a narrow hall closet barely wider than the machine. Stacking
  configurations show up constantly in the older duplexes near Western and
  Rosecrans. Getting a drum out for a bearing replacement often means
  rolling the machine into the driveway. The streets are fine to park on,
  but the laundry spaces inside are another matter.

commonProblems:
  - title: "Scale-Clogged Water Inlet Valves from South Bay Hard Water"
    description: "Gardena's municipal supply runs hard — 250+ ppm isn't unusual in
      90247. That mineral scale builds inside the water inlet valve until flow
      drops to a trickle or stops entirely. LG top-loaders and Whirlpool
      front-loaders both show this as a fill error or an unusually long fill
      cycle. Replacing the valve fixes it, but we also clear the inlet screens
      and check the supply hoses on the same visit."

  - title: "Drum Bearing Failure Amplified by Uneven Floors"
    description: "Post-war houses in Gardena frequently have washers sitting on
      original hardwood or cracked concrete pads with a slight lean. That angle
      stresses the drum bearing over thousands of spin cycles — eventually
      you hear grinding or a low rumble at high speed. Samsung front-loaders
      are particularly prone once the bearing seal goes. It's a full drum
      disassembly, but still cheaper than a replacement unit."

  - title: "Drain Pump Blockages in Compact Rental Units"
    description: "GE and Bosch stackable units in Gardena's older rental duplexes see
      a lot of drain pump failures. Lint, small items, and mineral deposits
      combine to jam the pump impeller — the machine fills normally but sits
      full and throws an F21 or E:24 error. We clear the pump, check the drain
      hose routing for kinks, and test before we leave. Usually done in one
      visit."

faq:
  - q: "How fast can you get to Gardena for washer repair?"
    a: "South Bay is straightforward for us — down the 405 or the 110,
      we're usually in Gardena within 2 hours of your call. Evening slots are
      open most weekdays. Call (323) 870-4790 and we'll confirm same-day
      availability on the spot."

  - q: "Do you repair Samsung and LG washers in Gardena?"
    a: "Both brands make up probably half our South Bay calls. On Samsung
      front-loaders we see a lot of door lock assembly failures and control
      board errors. LG top-loaders tend to come in with worn drive belts or
      a failed lid switch. All model years, both brands."

  - q: "What does washer repair cost, and how does the process work?"
    a: "We diagnose on-site and quote before touching anything — no surprise
      charges. Most drain pump or inlet valve jobs land between $150-250 in
      parts and labor. Drum bearing replacements run higher. Same-day service
      is the norm. Schedule online or call (323) 870-4790 and we'll confirm
      a window within the hour."

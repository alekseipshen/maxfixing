title: "Gardena Range Hood Repair — South Bay Kitchens, Same-Day Fix"

intro: |
  Post-war bungalows on Budlong Avenue and the 1960s ranch tracts near El Camino College give
  Gardena some of the tightest original galley kitchens in the South Bay — and those kitchens
  get real use. That GE or Samsung under-cabinet hood above a gas range collects grease at the
  blower wheel, the filter housing, and every seam in the old ductwork faster than most people
  expect. By the time the fan sounds wrong or the lights stop working, the fix is usually more
  than a filter rinse.

localContext: |
  Most single-family homes in 90247 and 90248 were built between 1947 and 1965, so the ductwork
  behind those range hoods has been rerouted, re-taped, and forgotten more than once. Near Rowley
  Park on Vermont Avenue, it's common to find hoods vented through undersized 3-inch round duct —
  half what the appliance actually needs — which forces the blower motor to fight constant
  backpressure. That strain accelerates wear on the motor windings and makes grease accumulation
  worse at every point in the duct path.

  Gas ranges are the norm in these homes, and gas combustion throws significantly more airborne
  grease than an electric cooktop does at the same heat level. Streets like Marine Avenue and
  Denker Avenue run through blocks where this combination — undersized duct, original tile-enclosed
  runs, gas range — shows up house after house. The ductwork hasn't changed. The cooking hasn't
  slowed down. The hood absorbs all of it.

commonProblems:
  - title: "Blower Motor Failure From Heat and Grease Restriction"
    description: "That grinding tone or dead silence when you hit the fan switch almost always traces to the
      blower motor — either the windings have failed or the capacitor has burned out after years of heat
      cycling in a compact kitchen. KitchenAid and GE under-cabinet hoods in Gardena's 1960s homes show
      this failure most. Grease coating the fan blades forces the motor to draw more current than it's
      rated for, and it quits well before its rated lifespan. A failed capacitor is usually a $40-60 fix.
      Failed motor windings mean a full blower assembly swap — two very different repair bills, which is
      why the diagnostic step matters."
  - title: "Saturated Grease Filter Backing Up Into the Blower Wheel"
    description: "Baffle filters on Bosch and Samsung hoods are meant to be pulled and washed monthly — but
      in 90248, most of them haven't been touched in years. Once a filter fully saturates, grease migrates
      past the housing and coats the blower wheel, throwing it out of balance and causing that rattling
      noise homeowners usually mistake for a loose panel. At that stage, a filter swap alone won't fix it —
      the blower wheel needs to come out and be cleaned or replaced."
  - title: "Duct Damper Stuck Closed — Smoke Backing Up Into the Kitchen"
    description: "The duct damper is a spring-loaded metal flap at the exterior vent cap that should open
      when the hood runs and seal when it stops. Grease hardening around the hinge — or heat warping the
      sheet metal housing — leaves it permanently jammed in Gardena's older installations. LG and Whirlpool
      hoods running against a blocked damper just recirculate smoke right back into the room, and the
      original galvanized ductwork in these homes makes damper replacement trickier than on modern installs.
      Cutting access through finished drywall is sometimes unavoidable. We photograph the run before and
      after so you can see exactly what was done."

faq:
  - q: "How fast can you get to Gardena for range hood repair?"
    a: "South Bay is our primary coverage zone — zip codes 90247, 90248, and 90249 are typically 20
      minutes from our dispatch point. Same-day slots are usually open on weekdays, and we carry evening
      appointments Tuesday through Thursday. Call us at (323) 870-4790 and we'll confirm the earliest
      available window."
  - q: "Do you repair KitchenAid and Bosch range hoods?"
    a: "Both show up constantly in Gardena kitchens. On KitchenAid, the most common jobs are blower motor
      assembly replacements and control board swaps. Bosch under-cabinet units usually need a new grease
      filter housing or a damper seal. We also handle Samsung, GE, LG, and Whirlpool — whatever's
      mounted above your cooktop."
  - q: "What does range hood repair cost in Gardena, and how does the process work?"
    a: "The diagnostic visit is $75, applied toward the repair if you move forward. A blower motor swap or
      lighting assembly fix typically runs $130 to $185 all-in. Control board work on newer Samsung or LG
      hoods costs more — parts pricing varies by model, so we confirm the quote before touching anything.
      Same-day service is available most weekdays. Call (323) 870-4790 or schedule online if smoke is
      already backing up into your kitchen."
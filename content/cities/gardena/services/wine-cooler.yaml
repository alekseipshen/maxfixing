title: "Gardena Wine Cooler Repair — South Bay Same-Day Fix"

intro: |
  Compact kitchens in Gardena's post-war ranch homes — the kind built through the late
  1950s along Marine Avenue and 162nd Street — weren't designed with wine cooler
  ventilation in mind. A KitchenAid undercounter unit crammed into a 24-inch cabinet
  cavity with two inches of rear clearance runs its compressor hard just to hold 55°F.
  Add South Bay summer heat and the occasional Santa Ana pushing inland temps past 90°F,
  and compressor burnout follows within a few years.

localContext: |
  Most of Gardena 90247 is 1950s and early 1960s single-family homes — 1,100 to
  1,400 square feet, original galley kitchens, no built-in cabinetry designed for
  modern appliances. Homeowners who added wine storage over the last decade usually
  went freestanding: an LG or Samsung unit tucked into a converted garage or a room
  addition near the dining area. Those garage placements are rough on cooling
  equipment — ambient temps push 95°F by July near Alondra Park, and the condenser
  coil takes the full brunt without relief.

commonProblems:
  - title: "Compressor Overheating from Inadequate Cabinet Clearance"
    description: >-
      Undercounter wine coolers need 4-6 inches of rear clearance to exhaust heat —
      in Gardena's original 1950s cabinetry, that gap rarely exists. The compressor
      overheats, trips its thermal protection cutoff, and the unit shuts down
      mid-cycle. We pull the unit, test compressor winding resistance with a
      multimeter, and confirm the cabinet can support airflow before reinstalling.
      Many calls come from 90248 homes where kitchen layouts haven't been touched
      since the houses were built. Sometimes repositioning and adding a rear vent
      panel is enough. Other times the compressor relay has already burned out.

  - title: "Temperature Swings from Scale-Clogged Evaporator Coils"
    description: >-
      LA hard water doesn't spare wine coolers. Units with internal drain lines
      accumulate calcium deposits on the evaporator coil over time — heat exchange
      efficiency drops and the cabinet swings 8-12°F between cycles instead of
      holding steady. Bosch dual-zone models show this failure pattern regularly in
      South Bay installs, and Samsung units aren't far behind. Cleaning the
      evaporator coil and recalibrating the thermostat usually stabilizes the unit.
      We also flush any calcium-blocked drain lines while we're in there. Temperature
      is logged after the repair — not estimated.

  - title: "Cracked Door Gasket Forcing Non-Stop Compressor Cycling"
    description: >-
      A warped or brittle door seal on a GE or Whirlpool freestanding unit lets warm
      air bleed in continuously — the compressor runs without stopping to compensate.
      In a garage install in 90249 where summer ambient temps exceed 90°F, that's a
      fast path to compressor failure. The unit won't throw an error code. It just
      runs constantly while your electric bill quietly climbs. Door gasket replacement
      runs $120-$180 and takes about an hour. Skip it and you're looking at a $400+
      compressor replacement within a season. We stock common gasket profiles for GE,
      LG, and Whirlpool units.


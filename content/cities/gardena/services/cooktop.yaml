    a: "Gardena sits on our regular South Bay service loop — usually there within two hours of your call. Call (323) 870-4790 to lock in a slot. Same-day openings fill up fast, so morning calls have the best shot."
  - q: "Do you repair Samsung and LG induction cooktops in Gardena?"
    a: "Samsung and LG are two of the most common induction brands we see in South Bay — LG's F7 error code and Samsung's SE fault are practically routine calls in the 90247 area. We also handle Whirlpool, GE, KitchenAid, and Bosch. Gas or electric, sealed-burner or induction, the van is stocked for Gardena service without waiting on back-orders."
  - q: "What does a cooktop repair cost in Gardena, and how does the process work?"
    a: "Diagnosis is $75, applied toward the repair if you proceed. Most cooktop jobs — igniter electrode swap, burner cap fix, heating element replacement, gas valve repair — run between $150 and $320 depending on parts. Induction panel replacements on LG or Samsung models run higher, but we quote before touching anything. Evening slots are open for urgent situations. Call (323) 870-4790 and we'll usually get you on the schedule same day."
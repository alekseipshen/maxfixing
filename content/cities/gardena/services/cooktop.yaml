title: "Gardena Cooktop Repair — Gas & Induction Service | South Bay 90247"

intro: |
  Western Avenue runs through the heart of 90247, and the kitchens in those blocks tell a clear story — Whirlpool gas cooktops from the early 2000s sitting next to Samsung induction units dropped in during last year's remodels. Many of these homes went up right after the war, with gas stub-outs not sized for modern BTU loads. Pressure swings on older supply lines — common through the 90249 corridor — mess with igniter timing in ways that can look electrical at first glance. Cooktop issues in this part of South Bay almost always have a local angle. South Bay is on our regular route, and Gardena calls land on the schedule fast.

localContext: |
  The housing stock around zip codes 90247 and 90249 skews heavily toward 1940s and 1950s post-war bungalows with compact galley kitchens. Cabinet cutouts were sized for 30-inch freestanding ranges, not the wider slide-in cooktops homeowners are dropping in now — tight clearances make some repairs more involved than they first appear. Garden apartments along Normandie Avenue run GE and LG electrics hard through large households. South Bay summers push kitchens past the thermal tolerance manufacturers design for — particularly glass-top units that have no ventilation clearance overhead. Many of these older homes also share a single gas supply line between the range, water heater, and dryer; when cooktop pressure drops mid-use, the answer sometimes starts at the meter shutoff on the side of the house, not the burner head.

commonProblems:
  - title: "Gas Burner Won't Ignite — Common in Gardena's Post-War Homes"
    description: "The igniter electrode is a ceramic pin that sparks each burner. Grease and food debris coat the tip over time and sparking stops — you hear clicking but nothing lights. On Whirlpool and GE gas cooktops, the spark module powering all burners can also fail outright; these units run every igniter off a single module, so one shorted electrode can kill ignition across the whole cooktop. Replacing the faulty electrode, cleaning the remaining tips, and bench-testing the module together in one visit is smarter than scheduling a second callback."
  - title: "Cracked Ceramic Glass Surface on Induction Units"
    description: "Samsung and LG induction cooktops use tempered ceramic glass that cracks when a heavy pan drops from counter height. The glass bonds directly over the heating element assembly beneath — there's no patching ceramic. We keep common 30-inch and 36-inch surface panels in the van for South Bay calls."
  - title: "Uneven Heat Across Burners — Warped Burner Cap or Clogged Orifice Port"
    description: "A shifted or warped burner cap forces the flame off-center — one side of the pan scorches while the other barely heats. Bosch and KitchenAid five-burner cooktops installed during Gardena kitchen renovations develop this after cleaning with excess water, which warps the cap or blocks the orifice port beneath it. The orifice itself is a small brass fitting; mineral deposits from South Bay's notoriously hard tap water can partially block gas flow and create the same uneven flame pattern even on a cap that looks undamaged. Clearing the deposit and reseating the cap correctly takes about twenty minutes on-site. If the orifice is beyond cleaning, replacement parts are standard stock on the van."

faq:

  - q: "Do you repair Samsung and LG dryers in Gardena?"
    a: "Yes, and they're probably half our South Bay calls. Samsung moisture sensor failures
      and LG drum bearing replacements are the two most common. We also handle Whirlpool,
      GE, and KitchenAid regularly — both electric and gas configurations."
  - q: "What does a dryer repair usually cost, and can you come the same day?"
    a: "Most repairs land between $150-$280 parts and labor. We diagnose on the first visit

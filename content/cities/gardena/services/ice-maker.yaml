title: "Gardena Ice Maker Repair — Hard Water Kills Fill Valves Fast"

intro: |
  Rowley Park sits in the middle of a neighborhood where a lot of refrigerators are pushing 15 to 20 years old — GE side-by-sides, older Whirlpool top-freezers, the kind that got installed during a kitchen remodel and nobody ever replaced. Gardena's tap water runs hard, consistently around 280 to 310 mg/L of total dissolved solids, and that mineral load takes out water inlet valves faster than most residents expect. The ice maker slows, then stops. By the time the call comes in, the valve screen is usually packed solid.

localContext: |
  The 90247 zip is mostly 1950s and early 1960s single-family homes — narrow kitchen layouts, appliance alcoves sized for refrigerators two inches shallower than what's standard today, and copper supply lines that haven't been touched in decades. Over in 90249, along Crenshaw and around the Marine Avenue corridor, there's a steady mix of post-war bungalows and duplex rentals where landlords swapped in mid-range Samsung or LG units that weren't configured for Gardena's water hardness. The ice maker assembly in those models starts failing within three or four years. Residents in 90248 near Chester Washington Golf Course tend to have slightly newer KitchenAid and Bosch units, but even those show accelerated mineral scaling on the fill valve after a couple of summers running through Gardena's municipal supply.

commonProblems:
  - title: "Water Inlet Valve Calcified by Gardena's Hard Municipal Supply"
    description: "Gardena's water consistently tests around 280 to 310 mg/L of dissolved solids — enough to calcify the water inlet valve screen in under two years of regular use. That Samsung french-door starts making thin, cloudy cubes and then nothing at all. Swapping the valve requires pulling the fridge, shutting the supply line, and confirming water pressure sits within the 20 to 120 PSI range the fill valve needs to seat and seal correctly. On LG models, the dual water inlet valve has two solenoid ports — one for the ice maker, one for the door dispenser — and only one port may be blocked, which makes diagnosis trickier than a straight swap."
  - title: "Frozen Fill Tube Blocking the Ice Maker Assembly"
    description: "KitchenAid and LG french-door models with the ice maker mounted high in the freezer compartment are particularly prone to a frozen fill tube. Water sits in the line between fill cycles and freezes solid, especially when the freezer thermostat runs a degree or two below setpoint. The ice maker assembly cranks through its full cycle — but nothing drops into the bin. We clear the blockage and calibrate the thermostat before leaving. If the fill tube keeps refreezing after that, the issue is usually a failing defrost heater near the ice maker housing, not the thermostat itself — worth checking the defrost cycle timing before calling the job done."
  - title: "Ice Level Sensor Locked in the Full Position on GE and Whirlpool Units"
    description: "Older GE Adora and Whirlpool side-by-sides throughout 90248 have a common failure: the ice level sensor arm or optical sensor locks in the full position even when the bin is completely empty, so production stops with no error code on the display. The sensor or switch assembly typically runs $25 to $60 in parts, but there are multiple variants by model year — the wrong one won't calibrate and the problem comes right back."

faq:
  - q: "How fast can you get to Gardena for ice maker repair?"
    a: "We run regular routes through Torrance and Hawthorne, which puts Gardena right in the middle of South Bay coverage. Most bookings land a same-day slot, and we're usually there within 2 hours of the call. Street parking on residential blocks in 90247 and 90248 is generally fine for a service van. Call (323) 870-4790 to confirm a window."
  - q: "Do you repair Samsung and LG refrigerator ice makers in Gardena?"
    a: "Yes — Samsung french-doors with the dual ice maker system and LG InstaView models make up a big share of South Bay calls. We also handle Whirlpool and KitchenAid units, which are common in the older homes throughout 90248 and 90249. Common replacement parts for all of those are stocked in the van so we're not waiting on a parts run."
  - q: "How much does ice maker repair typically cost, and is same-day available?"
    a: "Most repairs fall between $120 and $280. A water inlet valve swap sits on the lower end; a full ice maker assembly replacement runs higher. The diagnostic visit includes a full check of the fill tube, the water inlet valve, and the ice level sensor — not just the obvious symptom. Same-day appointments are open most weekdays, with evening slots available Tuesdays and Thursdays. If the timing is urgent, call (323) 870-4790 and we'll fit you into the route."
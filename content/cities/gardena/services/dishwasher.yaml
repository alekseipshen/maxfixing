title: "Gardena Dishwasher Repair — Hard Water & Aging Kitchens Fixed"

intro: |
  South of the 105, Gardena's tap water runs around 300 ppm hardness — enough to
  calcify a dishwasher spray arm in under two years. A Samsung unit in a remodeled
  bungalow near Veterans Park can accumulate enough mineral scale in the water inlet
  valve to drop wash pressure by half before the homeowner notices anything beyond
  cloudy glasses. That's the most common call we get in the 90247 zip.

localContext: |
  Most of Gardena's single-family stock dates from the 1950s and early 1960s —
  compact kitchens, original cabinet cutouts built for narrower appliances. The
  90248 zip mixes light industrial and residential blocks, and a lot of residents
  are still running older Whirlpool or GE units because the opening won't take a
  standard 24-inch replacement without cabinet modifications. Tight access also
  means a tech has to disconnect and reinstall without pulling countertops, which
  takes a different approach than a straightforward swap in a newer build.

commonProblems:
  - title: "Spray Arm Calcification from South Bay Hard Water"
    description: "LA's Municipal Water supply hits South Bay homes with minerals that plug
      the tiny jets inside a dishwasher spray arm within 18 months of regular use.
      Bosch 300 Series units especially suffer — the precision-drilled arm holes clog
      before the machine shows any error code. Once the water inlet valve also scales
      up, pressure drops far enough that nothing on the upper rack gets clean, just
      rinsed."
  - title: "Drain Pump Failures in Older GE and Whirlpool Units"
    description: "Standing water at the bottom after a cycle points straight to a failed
      drain pump — either a cracked impeller blade or a burned-out motor. GE Profile
      models from the mid-2000s, which turn up constantly in Gardena's older kitchen
      remodels, have a pump housing that cracks with age. Sometimes a blocked float
      switch is the real culprit, throwing a false fault that stops drainage without
      any mechanical failure at all."
  - title: "Detergent Dispenser Latch Stuck Shut on Samsung Units"
    description: "Pod never dissolved, dishes still greasy — that's almost always a
      failed bi-metal actuator or a broken dispenser door spring inside the door panel.
      Samsung dishwashers installed during Gardena's mid-2010s kitchen refresh wave,
      especially along the Normandie Ave corridor, have a documented spring fatigue
      issue in the dispenser assembly. Accessing it means pulling the inner door panel,
      but the fix itself is quick once you're in."


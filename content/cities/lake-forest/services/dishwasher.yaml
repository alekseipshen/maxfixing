title: "Lake Forest Dishwasher Repair — OC Hard Water & Built-In Specialists"

intro: |
  The tract homes off Bake Parkway and through the Foothill Ranch corridors (92610) were
  built in the late 1980s and 90s — kitchens sized for standard appliances, tile grout that
  traps mineral dust, and tap water running 250–280 ppm TDS. That calcium load is why the
  Bosch Series 800 in a Lake Forest home calcifies its spray arm nozzles faster than the
  same unit in a lower-hardness county. Dishes come out cloudy first. Then the drain slows.
  Then it stops mid-cycle.

localContext: |
  Most of Lake Forest's residential streets — from the Arbor neighborhood near El Toro Road
  to the cul-de-sacs along Rancho Santa Margarita Parkway in 92630 — are 1980s and 90s
  builder construction. That means standard under-counter dishwasher bays with cabinets
  flush on both sides, sometimes only two inches of clearance to slide a unit out. Newer
  developments in Portola Hills (also 92610) run tighter kitchens with KitchenAid and
  Samsung built-ins that need panel removal before you can reach the control board or drain
  pump housing.

commonProblems:
  - title: "OC Hard Water Calcifying Spray Arms and Inlet Valves"
    description: |
      At 250–280 ppm, Lake Forest municipal water deposits calcium carbonate inside spray
      arm nozzles in roughly 18 months of daily use. Top-rack dishes stop getting clean
      first — that's the classic symptom. Once the inlet valve screen is coated, water
      pressure into the tub drops noticeably. Bosch and Miele units handle scale better
      than most, but no dishwasher is immune to it at this water hardness.

  - title: "Door Latch Assembly Failures in Aging Foothill Ranch Homes"
    description: |
      KitchenAid dishwashers from the mid-2000s — common in homes that got a kitchen
      refresh a decade ago — fail at the door latch assembly after years of thermal cycling.
      The plastic striker tab cracks, the unit reads the door as open, and you get a
      flashing cancel light with no cycle start. Latch replacement takes under an hour
      if the door gasket is still seated correctly and the wiring harness hasn't frayed.

  - title: "Drain Pump Stalls on Samsung and LG Units"
    description: |
      Samsung and LG dishwashers position the drain pump low in the tub where it catches
      mineral-hardened debris the filter misses. The impeller seizes, water backs up, and
      the unit throws an OE or 5E error code. Clearing the filter monthly delays this, but
      once the impeller is damaged, the whole pump assembly needs swapping. It's a 60-minute
      repair if you have the right pump on the van — which we carry for both brands.

faq:
  - q: "How fast can you get to Lake Forest for dishwasher repair?"
    a: |
      We run regular routes through the Irvine–Lake Forest corridor and can usually reach
      92630 or 92610 the same day, often within 2 hours of your call. Dial (323) 870-4790
      or schedule online — we'll confirm the arrival window before we head out.

  - q: "Do you repair Bosch, KitchenAid, and Miele dishwashers?"
    a: |
      Yes on all three. Bosch is the most common call in Lake Forest — usually spray arm
      blockage or an E24 drain error tied to a clogged pump. KitchenAid calls almost always
      involve the control board or a latch assembly. Miele units need brand-specific parts,
      which we stock for the G-series models common in the 92610 custom builds.

  - q: "What does dishwasher repair cost in Lake Forest, and how does the process work?"
    a: |
      Diagnosis happens on-site; we quote the repair before touching anything. Most jobs
      run $150–$350 depending on the part — drain pump replacements are on the lower end,
      control board swaps run higher. Same-day and evening slots are available. Call
      (323) 870-4790 if it's urgent.

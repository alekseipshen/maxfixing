title: "Torrance Refrigerator — Salt Air, Hard Water, Fixed Fast"

intro: |
  South Bay salt air accelerates condenser coil corrosion faster than most homeowners expect —
  and in South Torrance, where streets west of Hawthorne Boulevard sit just miles from the
  coast, we see it knock out compressors years ahead of schedule. That KitchenAid french-door
  model in a 90505 kitchen usually isn't failing because it's old. Coastal humidity combined
  with LA's hard tap water is doing the real damage. Torrance is a daily stop on our South
  Bay route.

localContext: |
  Most of Torrance's residential housing dates to the 1950s and 1960s — postwar ranch homes
  built for aerospace workers near what was then North American Aviation. Kitchens in 90501
  and 90503 are tight; accessing a built-in refrigerator sometimes means moving cabinetry or
  pulling the unit out into a narrow hallway. South Torrance near the Hollywood Riviera
  neighborhood is different — newer construction, larger footprints, and Sub-Zero or Thermador
  built-ins that require specialized tools most generalist shops don't stock.

commonProblems:
  - title: "Hard Water Destroying Ice Maker Assemblies"
    description: >
      Torrance tap water tests around 300–400 ppm hardness. That mineral load clogs the ice
      maker assembly's water inlet valve within 18 months of heavy use. Samsung french-door
      models are especially vulnerable — the fill tube freezes solid and ice production stops
      entirely. We flush the valve, clear mineral deposits from the saddle fitting, and replace
      the filter housing if scale has reached it.

  - title: "Compressor Burnout From North Torrance Heat"
    description: >
      North Torrance, away from the coastal marine layer, regularly hits 90°F+ through summer.
      A refrigerator running in a hot garage or a south-facing kitchen with poor ventilation
      burns out its compressor 2–3 years early. LG side-by-side units with linear compressors
      are everywhere in this zip code — error code ER FF or CO usually means either a board
      reset or a full compressor swap, depending on how far the failure has progressed.

  - title: "Evaporator Coil Iced Over in Secondary Units"
    description: >
      A defrost timer that stops cycling lets the evaporator coil ice over completely. The
      refrigerator section warms up; the freezer holds temperature. Classic symptom in older
      Whirlpool and Kenmore units that Torrance homeowners keep running in garages as second
      refrigerators. Accessing the coil means pulling the freezer's interior back panel — we
      carry standard replacement defrost timers and defrost thermostats on the van.

faq:
  - q: "How fast can you get to Torrance for refrigerator repair?"
    a: >
      South Bay routes run through Torrance daily. From our coverage area, arrival is usually
      45–60 minutes — same-day if you call before noon. Parking on most residential streets
      in Old Torrance and South Torrance is easy to find for a service van. Call
      (323) 870-4790 to check today's open slots.

  - q: "Do you repair KitchinAid, Bosch, and Sub-Zero refrigerators?"
    a: >
      All three show up constantly in Torrance service calls. KitchenAid units come in
      mostly for ice maker and door gasket problems. Bosch counter-depth models tend to fail
      at the drain pump. Sub-Zero calls are typically compressor or evaporator coil work —
      those units need specific evacuation equipment that we bring on every South Bay run.

  - q: "What does a refrigerator repair visit in Torrance actually cost?"
    a: >
      Diagnostic is flat-rate, applied toward the repair if you proceed. Most common fixes —
      inlet valve replacement, defrost timer swap, condenser fan motor — land between $150
      and $350 parts and labor combined. Same-day and evening slots are available most days.
      Schedule online or call (323) 870-4790 and you'll get a firm estimate before any
      work starts.

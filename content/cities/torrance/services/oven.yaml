    a: "Most Torrance calls land a same-day appointment — we run the South Bay corridor daily, from Hawthorne through Torrance to Lomita. Traffic at the 405/Hawthorne Blvd interchange pushes afternoon arrival times, so morning calls book more reliably. Call (323) 870-4790 and we'll give you a two-hour window, not a vague four-hour block. Evening slots available on request."
  - q: "Do you repair Bosch and Thermador ovens in Torrance?"
    a: "Yes. Bosch and Thermador both need OEM parts and different diagnostic workflows than mass-market ranges. Thermador's Pro-Harmony series and Bosch's wall oven error sequences each have failure patterns we've seen repeatedly. We also work on KitchenAid, Samsung, LG, and GE. Can't find the model number? It's usually on a sticker inside the door frame — call (323) 870-4790 and describe the symptom."
  - q: "What does oven repair typically cost in Torrance?"
    a: "Diagnostic visit is $75, credited toward the repair if you proceed. Bake element replacement — the most common fix — runs $150 to $250 total including parts and labor. Control board replacement on Samsung or LG lands at $300–$400 depending on availability. Self-clean lock repairs usually fall in the middle. Same-day service available most weekdays — call (323) 870-4790 or book at maxfixing.com for a morning slot."
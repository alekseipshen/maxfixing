  - q: "Can you repair thermoelectric wine coolers, not just compressor-based units?"
    a: |
      Thermoelectric units are actually simpler mechanically, though the failure modes
      differ. Instead of a compressor and refrigerant circuit, these use a Peltier module
      to transfer heat. Cooling failures usually trace to the Peltier module itself or the
      small fan that pulls heat off the hot side. We service thermoelectric models from
      Frigidaire, Ivation, and Kalamera regularly. Peltier module replacement runs
      $70–$130 depending on the module wattage. One honest caveat for Northridge: these
      units are typically rated for ambient temps below 80°F, and Valley kitchens blow
      past that threshold for months at a stretch — which means thermoelectric coolers
      struggle here more than a compressor-based unit would.

  - q: "What warranty do you offer on wine cooler repairs in Northridge?"
    a: |
      Parts carry a 90-day warranty, and labor is guaranteed for 30 days — same issue
      comes back in that window, we return at no charge. Compressor replacements use
      OEM-matched or manufacturer-approved components that often carry a one-year parts
      warranty directly from the supplier. Parts are sourced through established
      distributor channels for GE, Frigidaire, Kenmore, and Samsung — not third-party
      gray market suppliers. That matters more than it sounds: counterfeit compressor
      grommets and thermistors are common in the aftermarket, and they fail fast in
      Valley heat conditions. Cutting corners on parts here costs more in the long run.

  - q: "Do you cover cities near Northridge, and how do I schedule?"
    a: |

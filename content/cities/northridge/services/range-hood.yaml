title: "Northridge Range Hood — Valley Heat, Grease, and Failing Fans"

intro: |
  Summer in Northridge means gas ranges running hard and kitchens that trap
  heat even with the windows open — and a range hood that's lost half its
  airflow makes that situation noticeably worse. A lot of the housing near
  Reseda Boulevard and the Devonshire Street corridor was built in the 1960s
  and early 1970s, which means the hoods up there are either original units
  or were swapped for the cheapest replacement at some point and then
  forgotten. GE and Frigidaire hoods from that era are everywhere in this
  zip, and their blower wheels and mesh grease filters often haven't seen
  real maintenance since installation. When the fan stops pulling smoke or
  starts cycling on and off under load, it's usually a failed motor
  capacitor or a grease filter so saturated it's cutting airflow to almost
  nothing. The duplexes and apartments around Zelzah Avenue near CSUN have
  the same issue — undersized recirculating hoods with charcoal filters that
  were overdue for replacement a year ago. We fix these fast, same-day in
  most cases.

localContext: |
  ZIP code 91325 covers the residential blocks directly south of CSUN, and
  those streets are dense with 1960s ranch homes that still have their
  original duct runs — narrow sheet-metal lined with decades of grease
  residue that no one has touched. ZIP 91324 runs through the Reseda
  Boulevard commercial strip but also covers the rebuilt blocks between
  Plummer Street and Parthenia Street, where post-1994 earthquake kitchen
  repairs were done quickly and on the cheap. A lot of those vent duct
  connections were patched rather than replaced, so backdraft damper
  assemblies in that area are frequently cracked or missing their flap
  entirely. Santa Ana wind events compound this — a damper that doesn't seal
  lets hot outside air push back through the duct, which accelerates grease
  condensation inside the hood cavity and speeds up motor wear. Apartment
  complexes near the Northridge Fashion Center on Corbin Avenue often have
  compact under-cabinet hoods with 3.25-inch rectangular duct runs —
  non-standard sizing that most repair shops don't stock parts for. We do.

commonProblems:
  - title: "Blower Motor Dead — Capacitor Failure in 1960s Tract Home Hoods"
    description: |
      The most common call from the 91324 zip is a range hood that powers on
      — lights respond, the control panel registers input — but the fan does
      absolutely nothing. That's almost always the blower motor's run
      capacitor giving out. On the Frigidaire and GE hoods installed in
      Northridge tract homes during that era, capacitors were rated for
      roughly 15 years and most have been running for 35 to 40. Swapping the
      capacitor runs $85–$140 including labor. If the motor shaft has seized
      from grease intrusion into the bearing housing, a full motor
      replacement is $160–$220 depending on the unit. We stock capacitors
      for common Frigidaire and GE hood motors and can usually get this done
      same-day once the diagnosis is confirmed.

  - title: "Fan Rattles and Vibrates — Loose Blower Wheel or Worn Bearings"
    description: |
      A range hood that rattles loud enough to be heard from the living room
      almost always has one of two things happening: the blower wheel has
      come loose from the motor shaft, or the motor bearings have worn out
      enough to let the wheel wobble under load. In the older apartment
      complexes near Nordhoff Street in the 91325 area, hoods get constant
      heavy use and the vibration from a loose wheel gradually backs the
      mounting screws out of the sheet-metal cabinet. Kenmore and Whirlpool
      under-cabinet hoods show up most often with this problem. Tightening
      or replacing the blower wheel assembly runs $75–$120. If the bearings
      are gone, a motor replacement at $150–$200 is the right call — running
      a noisy motor with worn bearings will burn out the windings inside of
      a few months.

  - title: "Clogged Baffle and Mesh Grease Filters Killing Airflow"
    description: |
      Northridge households that cook daily on gas ranges — frying, roasting,
      anything that generates heavy aerosol — load up grease filters fast. A
      mesh grease filter that should be cleaned monthly easily goes six months
      or more without attention in a busy kitchen. Once it's fully saturated,
      airflow drops sharply and the blower motor works harder to compensate,
      shortening its lifespan. Samsung and GE hoods with stainless baffle
      filters can often be restored with a thorough on-site cleaning. When
      the baffle frame itself has corroded from acidic grease buildup or the
      filter media is warped, replacement sections run $30–$60 each. We
      carry standard sizes for 30-inch and 36-inch hoods and can order
      non-standard sizes within one to two days.

  - title: "Range Hood Light Out — Socket Corrosion, LED Module, or Control Board"
    description: |
      A dead range hood light sounds simple but the diagnosis matters before
      ordering parts. On older Kenmore and Amana hoods, the bulb socket
      corrodes from steam and grease exposure, and the contact loses
      continuity — a replacement socket runs $20–$40. On newer Samsung hoods
      with integrated LED strip lighting, the LED module connects directly to
      the control board, and if the LED driver circuit has failed, you're
      looking at a $90–$160 board replacement. The symptom is usually
      intermittent flickering before the light stops responding entirely. We
      test the socket, the wiring harness, and the board independently before
      recommending any parts — so you're not buying a control board when the
      actual failure is a $12 socket contact. The diagnostic is included in
      the service call fee.

  - title: "Vent Duct Blockages and Broken Backdraft Dampers Letting Odors Back In"
    description: |
      Duct problems get misdiagnosed as motor problems because the hood sounds
      like it's running — fan spins, motor hums — but smoke and cooking odors
      still hang in the kitchen. The usual culprit in Northridge homes is a
      backdraft damper that's stuck open or has lost its sealing flap. Grease
      condenses on the flap over years of use, and eventually it stops closing
      fully, letting outside air and pests enter the duct when the hood isn't
      running. In Reseda-area homes with original 1960s ductwork, we
      frequently find the duct has collapsed at a joint or is packed with
      compacted grease residue. Clearing a duct blockage or replacing a
      damper assembly runs $100–$180 depending on access. Attic duct runs in
      split-level homes add inspection time and sometimes additional cost.

faq:
  - q: "How fast can you get to Northridge for range hood repair?"
    a: |
      From our base in the Valley, Northridge is a straightforward run up
      the 405 or surface streets on Reseda Boulevard — typically 45 minutes
      to an hour from booking confirmation to arrival at a 91324 or 91325
      address. Same-day slots are available most days, and we try to hold
      morning openings for calls that come in before 10 a.m. Evening
      appointments run Tuesday through Saturday for households where daytime
      doesn't work. Call us at (660) 999-9960 to check same-day
      availability. We give a two-hour arrival window and send a text
      message when we're about 20 minutes out.

  - q: "What does range hood repair cost in Northridge?"
    a: |
      Most repairs fall between $85 and $220. A run capacitor swap is
      typically $85–$140. A full blower motor replacement runs $150–$220.
      Control board work on a Samsung or GE unit comes to $90–$180
      depending on the board. The diagnostic visit is $65 and applies toward
      the repair cost if you book the work. Sometimes the fix is just a
      grease filter cleaning or a replacement filter section, which runs
      $30–$80 including labor. We quote the full job before touching any
      parts — no surprise totals at the end. Call (660) 999-9960 or book
      online for a same-day estimate.

  - q: "Do I need a permit for range hood replacement or duct work in Northridge?"
    a: |
      Swapping a hood in-kind — same duct size, same wall or ceiling
      penetration — typically doesn't require a permit under City of Los
      Angeles jurisdiction, which covers Northridge. Changing duct routing,
      cutting a new exterior wall penetration, or converting from a
      recirculating hood to a fully ducted system does require a mechanical
      permit from LADBS (Los Angeles Department of Building and Safety).
      Mechanical permit fees for this scope typically run $150–$300. All
      permitted work is filed under contractor license #1136541, and we
      handle the application and inspection scheduling directly so you don't
      have to navigate the LADBS portal.

  - q: "Can you repair range hoods that vent through the roof instead of the wall?"
    a: |
      Yes — roof-vented hoods are common in Northridge homes where the
      kitchen sits on an interior wall with no direct path to an exterior
      surface. The hood unit repair process is identical, but duct
      inspections for roof runs require attic access. We carry both flexible
      aluminum duct and rigid galvanized duct in standard 6-inch and 7-inch
      round for repairs or full replacements. In the 91326 zip near the
      foothill areas, weather caps at the roof exit frequently crack or get
      blocked by bird nesting — we replace those as part of the duct service.
      Attic access adds $40–$60 to the call depending on the setup.

  - q: "How long should a repaired range hood last, and what's covered under warranty?"
    a: |
      Parts we install carry a 90-day warranty on the component, and our
      labor is warranted 90 days on that specific repair. A motor or control
      board replacement done on a structurally sound hood should give another
      8–12 years of reliable use. If the hood is a 30-year-old Kenmore or
      Amana with multiple components starting to fail together, we'll say so
      directly — a new Whirlpool or GE under-cabinet unit retails for
      $150–$300, and we can install it the same visit we diagnose the old
      one. We don't recommend repairs on units where replacement is clearly
      the better value.

  - q: "What other cities near Northridge do you cover?"
    a: |
      Northridge sits near the center of our Valley coverage area. Regular
      runs go to Reseda, Granada Hills, Chatsworth, Canoga Park, and
      Panorama City — all within 20–30 minutes of a Northridge job. To the
      south, Sherman Oaks, Van Nuys, and North Hollywood are easy adds on
      the same day. Santa Clarita is reachable with a bit more lead time.
      If you're scheduling for a rental property or coordinating multiple
      stops in the area, call (660) 999-9960 early — we can often combine
      nearby addresses on the same run and shrink your wait window. Evening
      slots fill quickly on weekdays, so same-week booking works better than
      same-day for those.
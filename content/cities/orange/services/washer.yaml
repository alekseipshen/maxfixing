title: "Orange NJ Washer — Old Buildings, Hard Water, Fast Fixes"

intro: |
  The pre-war brick apartment buildings along Day Street and the postwar two-families
  off Main Street tell you a lot about how laundry gets done in Orange. Older galvanized
  supply lines push mineral-heavy Essex County water straight into your washer's inlet
  valve — and that Whirlpool top-loader starts acting up sooner than it should. We
  cover 07050 regularly and can usually be there within 2 hours of your call.

localContext: |
  Much of Orange's housing stock in zip code 07050 runs from 1920s–1940s walk-up
  apartments to mid-century two-families near Colby Park. Stackable laundry closets
  are common in the older buildings off Central Avenue — tight enough that pulling
  a Samsung front-loader for a drum bearing job means maneuvering it through a
  narrow hallway first. Parking for service vans on the residential side streets
  takes planning, but we know the area.

commonProblems:
  - title: "Mineral buildup killing the water inlet valve — slower fill, then no fill"
    description: |
      Essex County tap water runs moderately hard. Over two or three years, calcium
      deposits clog the mesh screens in the water inlet valve, and the machine starts
      filling slowly — then not at all. LG front-loaders throw an IE error code at
      that point. Replacing the valve costs $80–120 in parts and takes about an hour.
      Happens constantly in older Orange apartments where the supply lines add extra
      sediment.

  - title: "Drain pump clogged — standing water after the cycle"
    description: |
      That sudsy water sitting cold in the drum is almost always the drain pump.
      Lint, coins, and small items jam the impeller. Samsung front-loaders from
      the 2019–2022 range are especially prone to it — the filter access panel is
      buried low on the front, and most people don't know it exists. Call
      (323) 870-4790 and we can usually get to Orange same day. Cleaning the
      filter takes 20 minutes; a failed pump motor is a 45-minute swap.

  - title: "Excessive vibration and banging on spin — shock absorbers giving out"
    description: |
      A top-loader that rocks hard enough to walk across the floor usually has
      worn shock absorbers, not a balance issue. Bosch and Whirlpool top-loaders
      in their 5–8 year range hit this failure regularly. The machine throws an
      UL (unbalanced load) code, cancels spin, and repeats. Two new shock absorbers
      run $60–90 in parts. Ignoring it long enough cracks the drum mount — then
      the repair cost triples.

faq:
  - q: "How fast can you get to Orange for washer repair?"
    a: |
      From our nearest route we typically reach Orange (07050) within 2 hours.
      Day Street to Central Avenue is a quick run; side-street parking is tighter
      near the apartment blocks but we account for it. Evening slots available
      Tuesday through Friday. Call (323) 870-4790 or schedule online.

  - q: "Do you repair Samsung and LG washers in Orange, NJ?"
    a: |
      Yes — Samsung and LG are the two we see most in this area, along with
      Whirlpool. Common Samsung fixes: drain pump blockages, door boot seal
      tears, control board error codes (5C, 4C). On LG: door latch assemblies,
      drum bearing failures on front-loaders, IE inlet valve codes on top-loaders.

  - q: "What does a washer repair visit cost, and can you come same day?"
    a: |
      Diagnostic fee is $75, credited toward the repair if you proceed. Most
      washer jobs run $150–280 parts and labor. Same-day availability most
      weekdays — if it's a drain pump or shock absorber, we usually carry
      the part. Emergency slots available; call (323) 870-4790 to check
      current openings.
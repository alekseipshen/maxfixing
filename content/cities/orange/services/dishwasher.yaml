title: "Orange NJ Dishwasher Repair — Hard Water & Old Pipes"

intro: |
  Essex County water is hard. The mineral content running through 07050 supply lines clogs spray arms and coats heating elements within a year or two — sometimes faster in older homes. The renovated Victorians along Park Avenue in Orange are a good example: Bosch 800 Series units installed in kitchens built circa 1915, dealing with pipe sediment and scale that a newer subdivision house never sees.

localContext: |
  Most of Orange's housing was built between 1900 and 1950 — rowhouses, two-families, brick colonials with undersized cabinet openings that made adding a dishwasher an afterthought. Zip code 07050 sees a lot of tight installs where pulling a KitchenAid or LG unit for service means careful work around cabinetry that wasn't designed with appliance access in mind. Areas near Orange Park have seen recent gut renovations — newer appliances, same aging plumbing underneath.

commonProblems:
  - title: "Spray arm blockage from Essex County mineral deposits"
    description: "Hard local water leaves calcium scale inside spray arm nozzles — sometimes within 18 months of a new install. The dishwasher sounds like it's running fine, but nothing's actually getting clean. Bosch 300 and 500 Series units are particularly sensitive because their spray arm tolerances are tight; once a nozzle clogs, water pressure drops across the whole wash cycle."
  - title: "Drain pump failure tied to undersized drain hookups"
    description: "Older homes in the 07050 area often have undersized drain hookups that don't flow cleanly. The drain pump works harder than it should on every cycle and eventually burns out. Samsung dishwasher models throw an OC or 5C error code when this happens — standing water sitting in the tub is usually the first sign a homeowner notices."
  - title: "Door latch and control board failures on KitchenAid units"
    description: "Frequent open-and-close cycles wear down door latch assemblies faster than most people expect. KitchenAid units in Orange's renovated colonials often show an E1 or F8 error code when the latch stops signaling properly to the control board. Replacing just the latch fixes it about 60% of the time — the rest need a control board swap."

faq:
  - q: "How fast can you get to Orange for dishwasher repair?"
    a: "Usually within 2 hours for calls placed before noon. We run Essex County routes regularly, and 07050 is a straightforward shot off I-280. Call (323) 870-4790 to check availability — same-day slots fill up fast on weekdays."
  - q: "Do you repair Bosch and KitchenAid dishwashers in Orange NJ?"
    a: "Yes — Bosch, KitchenAid, LG, and Samsung are the four brands we see most often in this area. Common repairs include spray arm replacements, drain pump swaps, and door latch assembly work. We carry parts for Bosch 300, 500, and 800 Series on the van."
  - q: "What does a dishwasher repair typically cost in Orange?"
    a: "Drain pump replacement usually runs $150–$250 in parts and labor. Control board jobs go higher — $200–$350 depending on the model. We diagnose on-site and quote a fixed price before touching anything. Evening slots available for households where nobody's home during the day."

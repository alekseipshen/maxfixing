title: "Orange NJ Dryer — Pre-War Homes, Hard Water, Real Fixes"

intro: |
  Essex County hard water does a number on dryer components over time —
  especially in Orange's older two- and three-family homes clustered near
  Park Avenue and the Highland neighborhood. That LG gas dryer running
  90-minute cycles on towels that still come out damp? Nine times out of
  ten it's a clogged exhaust vent or a failing moisture sensor, not a
  catastrophic breakdown. Call (323) 870-4790 and we're usually on-site
  within 2 hours.

localContext: |
  The 07050 zip code holds a dense mix of Victorian-era row houses, 1920s
  brick apartment buildings, and post-war two-families — most built before
  modern laundry room ventilation was a consideration. Dryer exhaust in
  these structures often runs long horizontal stretches through interior
  walls, trapping lint and cutting airflow fast. The Hillside section
  especially has tight utility closets where reaching a dryer's blower
  wheel means pulling the entire unit away from the wall before the repair
  even starts.

commonProblems:
  - title: "Lint Buildup Killing Airflow in Pre-War Wall Venting"
    description: |
      Long vent runs through Orange's pre-war walls trap lint fast —
      sometimes blocking 70% of airflow before a homeowner notices anything
      wrong. The blower wheel strains against the restriction, the dryer
      overheats, and eventually the thermal fuse blows as a safety cutoff.
      Samsung front-loaders throw 'HC' or 'HE' error codes when this
      happens; Bosch units just quietly stretch cycle times by 20-30
      minutes until someone finally calls.

  - title: "Gas Valve Igniter Failures in Basement Utility Rooms"
    description: |
      Gas dryers in Orange's older homes — many on lines running through
      07050 basement utility rooms untouched for decades — blow thermal
      fuses more often than expected. The gas valve igniter weakens over
      time: sparks, catches briefly, then cuts out, leaving clothes cold
      and wet after a full cycle. GE and Maytag units with this fault
      usually misfire two or three times before the fuse blows completely.

  - title: "Drum Roller Wear from Heavy Daily Use"
    description: |
      KitchenAid dryers in Essex County homes running multiple loads daily
      wear down drum rollers within 5-7 years — sometimes less with large
      families. The thumping starts subtle, gets progressively louder over
      weeks. Ignore it and the belt tensioner goes next, then the drum
      bearing housing is at risk. Catch it at the thumping stage and it's
      a straightforward fix; wait too long and the repair cost triples.

faq:

title: "Placentia Washer Repair — OC Hard Water Eats Parts Fast"

intro: |
  Orange County Municipal Water District supplies Placentia at 300+ ppm hardness
  — and that mineral load quietly destroys water inlet valves and door gaskets on
  Bosch and LG front-loaders inside of three years. The Chapman Avenue corridor
  in 92870 is full of those machines. Call us at (323) 870-4790 and we're usually
  in Placentia within 2 hours.

localContext: |
  Most Placentia housing stock dates from the late 1960s through the 1990s —
  single-story ranch homes with dedicated laundry rooms off the garage, which
  means good van access and no tight apartment-stack logistics. The 92871 zip,
  especially east of Kraemer Boulevard near the newer Savi Ranch-adjacent
  subdivisions, runs a lot of Samsung and LG high-efficiency front-loaders.
  Older blocks closer to downtown still have Maytag and Kenmore top-loaders
  pushing 15 years of hard-water wear.

commonProblems:
  - title: "Mineral buildup blocking the water inlet valve — machine won't fill"
    description: |
      Placentia tap water deposits calcium scale inside the inlet valve screens
      within a few years. The machine starts taking 20 minutes to fill a load,
      then eventually throws an error and stops. On LG front-loaders this usually
      shows as an IE code. Replacing the valve clears it — cleaning rarely works
      once the buildup is inside the valve body itself.
  - title: "Drum bearing failure — grinding noise on every spin cycle"
    description: |
      Bosch 500 Series front-loaders in 92870 homes built in the '90s see this
      constantly after 8-10 years. The drum bearing wears out, you hear a low
      metal grind that gets worse at high spin speeds. Left alone, it destroys
      the rear drum seal and the shaft. Catching it early — just the bearing
      and spider arm — keeps the repair cost reasonable.
  - title: "Drain pump failure — standing water, won't spin out"
    description: |
      Samsung front-loaders throw an ND or 5E code when the drain pump impeller
      gets jammed or burns out. Socks, coins, and the occasional LG lint filter
      cap end up in there. Sometimes it's just debris — but after 7+ years the
      pump motor itself fails and needs swapping. Either way, same-day fix.

faq:
  - q: "How fast can you get to Placentia for a washer repair?"
    a: |
      Coming from the 57/91 interchange area, Placentia is a straight shot —
      usually 20-30 minutes. Same-day slots are available most weekdays, and
      evening appointments after 5pm work for the Chapman Hills crowd. Call
      (323) 870-4790 or schedule online to grab a window.
  - q: "Do you work on Bosch and LG front-loaders specifically?"
    a: |
      Yes — both are the most common machines we see in Placentia. On Bosch we
      mostly handle drum bearing replacements, door latch assemblies, and control
      board resets. LG calls are usually drain pump failures, water inlet valves,
      or spin basket issues after the drive belt stretches out.
  - q: "What does a washer repair typically run in this area?"
    a: |
      Diagnosis is $75, applied toward the repair. Most drain pump or inlet valve
      jobs land between $180-$280 parts and labor. Drum bearing replacements on
      front-loaders are heavier — $300-$450 depending on the model. Emergency
      same-day service carries no extra surcharge.

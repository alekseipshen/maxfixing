title: "Placentia Refrigerator Repair — Inland Heat & Hard Water Issues"

intro: |
  Tract homes along Yorba Linda Boulevard in the 92870 zip were built in the late 1960s,
  and a lot of them still have kitchen footprints that weren't designed for French-door
  refrigerators. That KitchenAid or LG you squeezed into a tight cabinet cutout is working
  harder than it should — especially when summer temps push past 97°F in inland Orange County.
  Municipal Water District of OC delivers calcium-heavy water that accelerates mineral scale
  inside ice maker assemblies and water inlet valves faster than most homeowners notice until
  the ice stops dropping.

localContext: |
  Placentia's housing stock in the 92870 and 92871 zip codes runs from 1960s ranch-style
  homes near Kraemer Boulevard to newer townhomes off State College Boulevard. Older kitchens
  often have gas appliances alongside refrigerators shoved into undersized cabinet openings —
  tight access is genuinely common, and pulling a unit out for a compressor check can require
  removing a lower cabinet panel. The inland location means no coastal buffer; condensers run
  longer cycles here in July and August than comparable units in Huntington Beach or Newport.

commonProblems:
  - title: "Ice Maker Failures Caused by OC Mineral Buildup"
    description: |
      Orange County tap water carries enough calcium to clog a water inlet valve within 18-24
      months of regular use. Samsung French-door models and KitchenAid built-ins in Placentia
      both show this pattern — the ice maker assembly stops producing cubes, and scale is
      usually the culprit rather than the electronics. Flushing the valve and inspecting the
      supply line clears it in most cases. Ignored too long, the scale migrates to the fill
      tube and freezes it solid.
  - title: "Compressor Overheating During Inland Summer Heat"
    description: |
      Garage refrigerators and units in south-facing Placentia kitchens work overtime from
      June through September. The condenser fan motor usually fails first — it can't move
      enough air to keep the compressor cool, and the unit starts cycling on thermal
      protection. LG compressors throw an FF or Er dH error code before shutting down.
      Catching it at the fan motor stage is a $150 fix; waiting until the compressor
      seizes is significantly more.
  - title: "Evaporator Coil Frost Blocking Airflow in Tight Cabinets"
    description: |
      Bosch and Thermador counter-depth units installed in cabinets without proper clearance
      develop frost on the evaporator coil faster than intended. The defrost heater or defrost
      timer stops cycling correctly, ice accumulates on the coil, and airflow drops until the
      fresh food section warms while the freezer still feels fine. It's a deceiving failure
      mode — homeowners often assume the thermostat is the problem and replace it first.


title: "Placentia Ice Maker Repair — Hard Water Kills Fill Valves Fast"

intro: |
  Orange County's hard water hits ice makers particularly hard across Placentia's residential streets — mineral buildup on water inlet valves and ice maker assemblies is the most common call we get from the 92870 zip. That LG french-door you bought a few years back? The fill valve is probably caked in calcium scale by now if you haven't had it serviced. Homeowners near Kraemer Park know the pattern well.

localContext: |
  Most of Placentia's housing stock dates from the 1960s through the 1980s — ranch-style homes and tract developments along Placentia Avenue and Kraemer Boulevard. A lot of these kitchens have been remodeled since, which is when KitchenAid and Samsung refrigerators moved in. The water lines feeding those units, though, are often still original copper from the build. In the 92871 zip especially, corroded supply lines restrict flow enough to starve a unit into a full shutdown.

  Hard water is genuinely bad in this part of Orange County — local hardness runs around 300 to 400 ppm in parts of Placentia, well above the threshold where mineral deposits become a real maintenance issue. At that level, a water inlet valve can accumulate enough calcium scale within 18 months to drop flow below the sensor threshold. Bosch and Thermador refrigerators are unforgiving about low-flow conditions; their control boards interpret restricted supply as a fault state and lock the module out entirely until the valve is replaced and the line is flushed clean. That's not a firmware bug — it's a safety behavior that leaves Placentia homeowners staring at an empty ice bin with no obvious explanation.

commonProblems:
  - title: "Mineral-Clogged Water Inlet Valves from Placentia's Hard Water"
    description: |
      Calcium from Orange County water narrows fill valve openings gradually until flow drops below the sensor threshold — and the unit just stops producing ice. Samsung and LG models are especially sensitive; their sensors read low flow as a completed fill cycle and quit entirely. Replacing the water inlet valve and clearing the supply line is typically a same-day fix. On Samsung french-door models, the secondary valve solenoid is a separate failure point that often gets overlooked on the first service call — worth checking both while the access panel is already off.
  - title: "Frozen Fill Tubes During Placentia's Aggressive Summer Heat Cycles"
    description: |
      Summer heat forces refrigerators to run hard, and that extra compressor activity can throw off the defrost timer cycle — sometimes enough for the fill tube to ice over completely. KitchenAid french-door models in the 92870 area show this pattern from July through September. A malfunctioning defrost timer or an overworked condenser fan is usually driving it. On KitchenAid units built after 2018, a failed defrost thermostat throws the whole cycle off without triggering a clear error code on the display — so the symptom looks random until you pull the diagnostics.
  - title: "Ice Maker Assembly Failures in Placentia's Renovated Kitchens"
    description: |
      Placentia homeowners who upgraded to Sub-Zero or Thermador built-ins during 2010s kitchen renovations are now hitting the age where assembly components start failing. The ice level sensor and the module itself are the common failure points on these units. Sub-Zero parts require OEM sourcing — a step many local shops skip, which leads to repeat failures within a year. The Sub-Zero 650 and 700 series machines common in upper Placentia homes use a dedicated module that's not interchangeable with aftermarket parts without recalibration. Cutting that corner costs more long-term than just sourcing the correct part from the start.


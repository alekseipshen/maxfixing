title: "Placentia Ice Maker Repair — Fill Valves, Sensors & Hard Water"

intro: |
  Kraemer Ranch and the older tracts off Bradford Avenue sit on some of the harder water in
  Orange County — 300-plus ppm calcium is common, and that mineral load quietly destroys ice
  maker fill valves over two to three seasons. That KitchenAid or Bosch refrigerator you
  installed during a kitchen remodel will stop dropping ice long before anything else fails
  on the unit. We run Orange County routes daily and can reach the 92870 zip same-day.

localContext: |
  Placentia's housing is mostly 1960s and 1970s ranch-style with a layer of 1990s tract homes
  east of Kraemer Boulevard. Refrigerators in these kitchens are typically full-size built-ins
  or french-door models — plenty of clearance to work, which is a relief compared to the
  cramped installs you see in coastal cities. The 92871 zip skews newer and has more
  Sub-Zero and Thermador built-ins in renovated kitchens, requiring OEM parts and brand-specific
  diagnostic tools rather than generic repair kits.

  The neighborhoods around Alta Vista Country Club see a fair number of KitchenAid and Bosch
  french-door units — homeowners who invested in quality appliances during kitchen renovations
  and now want them fixed properly, not swapped out. That means correct part sourcing matters.
  A KitchenAid W10408179 water inlet valve is not interchangeable with the LG version even
  when both fit physically. Getting that wrong shows up as slow fill cycles, erratic ice cube
  size, or a freeze-up within a month of the repair.

commonProblems:
  - title: "Fill Valve Failure from Placentia's Mineral-Heavy Tap Water"
    description: |
      Calcium carbonate deposits coat the interior of a water inlet valve in months, not years,
      when local hardness runs this high. The valve solenoid still fires — the plunger just
      can't open fully anymore. LG and Samsung french-door models read the restricted flow as
      a completed fill cycle and stop calling for more water, so the ice bin empties and stays
      empty. A valve swap and line flush usually closes the call in one visit.

      Bosch units throw an E24 or a persistent "ice maker off" indicator when flow drops below
      threshold. On those machines the water inlet valve sits behind the lower kick panel, not
      at the back — easy to miss if you haven't worked that model before. Replacing the valve
      without clearing the supply line of sediment just moves the blockage downstream.
  - title: "Frozen Fill Tube During Peak Summer Cooling Demand"
    description: |
      Placentia summers push refrigerators hard. When the condenser fan runs overtime keeping
      the compressor cool, freezer temps can spike and dip unpredictably — and a fill tube
      sitting in a fluctuating freezer section will eventually ice over. KitchenAid models
      built between 2015 and 2020 show this pattern frequently; the defrost thermostat on
      those machines starts drifting after five or six years and lets freezer temps drop far
      enough overnight to block the fill tube solid.

      Thawing the tube is the easy part. The real fix is verifying defrost cycle timing with
      a temperature logger and replacing the defrost thermostat if it's reading outside spec.
      Skip that step and the tube freezes again within two weeks.
  - title: "Ice Level Sensor Faults on Sub-Zero and Bosch Built-Ins"
    description: |
      Sub-Zero 648 and 700 series refrigerators, common in upper Placentia's renovated
      kitchens near Yorba Linda Boulevard, use an optical ice level sensor that coats with
      frost if the door seal lets in any warm air. The ice maker assembly reads "bin full"
      and shuts off production entirely. Cleaning the sensor and testing the door gasket for
      seal failure usually resolves it — though if the gasket is compromised, that needs
      replacing first or the sensor problem comes back within weeks.

      Sub-Zero door gaskets are model-specific and must be OEM — aftermarket versions compress
      differently and leave micro-gaps at the corners. Schedule the repair before summer heat
      arrives and the unit starts working harder to maintain temperature; a failing gasket
      under that load can spike energy draw and stress the compressor.

faq:
  - q: "How fast can you get to Placentia for ice maker repair?"
    a: |
      Placentia is right off the 57 freeway — from our Orange County route, that's typically
      under 45 minutes. Same-day service is available most days. Call (323) 870-4790 to
      confirm a morning or afternoon window, or evening if that works better.
  - q: "Do you work on KitchenAid, Bosch, and Sub-Zero ice makers?"
    a: |
      Yes — KitchenAid and Bosch ice maker assemblies are the most common calls in Placentia.
      Sub-Zero requires OEM parts (no aftermarket substitutes on those modules), which we
      source directly. LG and Samsung fill valve and control board repairs we stock on the van.
  - q: "Is it worth repairing or should I just replace the ice maker module?"
    a: |
      Most issues here — fill valve blockage, frozen tube, sensor fault — run $120 to $280
      to fix. Full module replacement on a Sub-Zero or KitchenAid can hit $400-$600 but still
      beats a new refrigerator. We diagnose on-site the same day you call; you'll get a
      firm number before we touch anything. Call (323) 870-4790 for same-day availability.
commonProblems:
  - title: "Thermal Fuse Failure During Summer Heat Spikes"
    description: "Placentia's inland heat pushes dryer exhaust temps past safe thresholds,
      especially in garages with poor ventilation. The thermal fuse — a one-shot safety
      cutoff on the exhaust duct — blows and the dryer runs but produces zero heat.
      Samsung and LG both use non-resettable fuses; replacement is straightforward, but
      the root cause is usually restricted airflow that has to be cleared at the same time."

  - title: "Noisy Tumbling From Worn Drum Rollers in Older Units"
    description: "A thumping or squealing drum almost always points to worn drum rollers
      or a failing belt tensioner — common in Bosch and KitchenAid units that are 8+
      years old. The noise is loud and gets worse fast. Ignoring it long enough usually
      means a cracked drum shell, which turns a $150 roller swap into a much larger
      repair bill."

  - title: "Long Dry Times Caused by Hard-Water Scale on Moisture Sensors"
    description: "Placentia's tap water is high in calcium and magnesium. Over months,
      mineral film coats the moisture sensor strips inside the drum — the dryer thinks
      clothes are dry when they're not, or keeps running indefinitely. LG front-loaders
      are especially prone to this. A sensor clean-out and a fresh calibration cycle
      usually restores normal 45-minute dry times."


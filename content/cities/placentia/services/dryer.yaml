localContext: |
  Most of the housing stock here was built between 1968 and 1985 — subdivisions
  off Chapman Avenue and the tracts near Craig Regional Park typically run laundry
  closets with original duct work still in place. Zip codes 92870 and 92871 both
  skew heavily toward gas hookups. Forty-year-old exhaust vent runs accumulate lint

title: "Placentia Dishwasher Repair — Fast Service for OC Homes"

intro: |
  Tract homes along Placentia Avenue, built mostly in the late 1960s and
  1970s, were plumbed for appliances that no longer exist. A Bosch 500 Series
  installed in a remodeled kitchen near Bradford Avenue runs on supply lines
  that are pushing 50 years old — and when the inlet valve starts giving out,
  it looks like a control board failure. Orange County water averages around
  230 ppm hardness. Spray arms calcify quietly. Call us at (323) 870-4790
  and we'll usually be there the same day.

localContext: |
  Most of the 92870 zip is single-family homes from the 1960s–1980s, with
  standard under-counter dishwasher cutouts. Older kitchens in the Tuffree
  and Golden Hills areas sometimes have slightly non-standard cabinet depths
  that complicate door latch alignment on full-height models. The 92871 side
  has newer construction — some KitchenAid and LG built-ins that need
  brand-specific diagnostic tools. Not every repair shop carries those.

commonProblems:
  - title: "Mineral Buildup Killing Wash Performance in Older OC Homes"
    description: "At 230+ ppm, Placentia tap water coats spray arm nozzles and
      float switch components within 18–24 months. A Bosch that throws E24
      or E25 error codes usually has a partially blocked drain pump impeller,
      not a failed pump. Descaling the inlet valve and clearing the filter
      basket resolves it 70% of the time without part replacement."
  - title: "Door Latch Failures on 1970s Kitchen Cabinet Cutouts"
    description: "Off-spec cabinet openings — common in homes near Craig Regional
      Park built before 1980 — put lateral stress on the door latch assembly
      over thousands of cycles. KitchenAid and Samsung models both use a
      plastic latch bracket that cracks under uneven door pressure. The fix
      is realigning the door first, then replacing the latch — skipping
      alignment means the new latch breaks in six months."
  - title: "Detergent Dispenser Stuck or Not Releasing"
    description: "Hard water deposits jam the dispenser door spring on LG and
      Samsung units, especially in homes that skip rinse aid. The detergent
      dispenser wax motor — the small actuator that pops the door open
      mid-cycle — burns out when it fights mineral crust repeatedly.
      Replacing just the motor without cleaning the dispenser housing is
      a short-term fix."

faq:
  - q: "How fast can you get to Placentia for dishwasher repair?"
    a: "We run routes through Orange County daily — from the 57 corridor
      we're typically in Placentia within 90 minutes of your call. Same-day
      slots available most days. Call (323) 870-4790 or schedule online.
      Evening appointments available Tuesday through Saturday."
  - q: "Do you repair Bosch and KitchenAid dishwashers specifically?"
    a: "Yes. Bosch (300, 500, 800 Series) and KitchenAid both require
      brand-specific diagnostic adapters for error codes — we carry them.
      Also handle LG ThinQ units with the NE or AE error codes, and Samsung
      LC/LC1 leak sensor faults. Parts stocked for all three."
  - q: "What does a dishwasher repair typically cost in Placentia?"
    a: "Drain pump replacement runs $180–$240 in parts and labor. Control
      board swaps on a Bosch 500 are closer to $300–$380. We diagnose on
      the first visit — no separate trip charge — and quote before touching
      anything. Emergency same-day service available; no premium for evening
      slots."

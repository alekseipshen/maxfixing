title: "Claremont Freezer Repair — Inland Heat, College-Town Homes"

intro: |
  College-town neighborhoods around the Claremont Colleges see a surprising mix
  of appliances — older bungalows on College Avenue running basic Whirlpool chest
  freezers, renovated homes on Indian Hill Boulevard with KitchenAid column units.
  Inland SGV heat is real here.

  A freezer that held temp fine in March starts struggling by the Fourth of July,
  especially once the compressor is past its fifth year. The 91711 zip code sits
  roughly 1,200 feet above sea level and 30 miles from any marine layer — the
  thermal stress on refrigeration equipment is genuinely different from West LA
  or Pasadena. Add the temperature swings near the San Gabriel foothills, where
  nights drop 30 degrees below afternoon highs, and you get gaskets that crack
  prematurely and compressors that cycle constantly just to keep up.

  Claremont homeowners also tend to keep appliances longer than average. A
  KitchenAid column freezer bought when the kids were in middle school is now
  a 12-year-old machine trying to survive a 102°F August afternoon.

localContext: |
  Most of the homes within the 91711 zip code's college-core streets date to the
  1920s through 1950s — tight utility spaces, older electrical layouts, and
  kitchens that weren't built for today's larger column freezers. Doorways on
  some of the Craftsman bungalows off Bonita Avenue are narrow enough that a
  standard 36-inch built-in column requires a partial panel removal just to get
  a technician in for diagnosis. That's not unusual. We plan for it.

  North Claremont, where 1980s and 1990s tract homes sit near Baseline Road,
  runs bigger side-by-side and built-in units. Different era, different failure
  modes entirely.

  The newer construction along Mountain Avenue and near the Village shopping
  district includes townhomes and condos with stacked laundry and compact
  European-style kitchen appliances — Bosch and Thermador column units that
  require different tools and calibration than the domestic brands. Residents
  in those areas typically call us when they're seeing an E24 or E20 error
  code and the manual offers zero clarity on what it actually means.

commonProblems:
  - title: "Freezer stops holding temp when summer inland heat spikes"
    description: |
      Claremont sits about 30 miles from the coast — July and August regularly hit
      98°F. That's brutal on a compressor already a decade old. Condenser coils on
      KitchenAid column freezers accumulate dust fast in this climate, restricting
      airflow until the unit overheats and stops freezing within 24 hours.

      The condenser fan motor is usually next. Once airflow is restricted, the fan
      runs hotter than spec and the bearings wear out within a season. By the time
      the homeowner notices the freezer compartment sitting at 20°F instead of 0°F,
      the repair is a condenser cleaning plus a fan motor swap — straightforward,
      but only if caught before the compressor itself overloads. A compressor
      replacement on a KitchenAid column is a $600–$900 job. The fan motor is $180.

  - title: "Ice wall buildup inside the cabinet, drawer won't close"
    description: |
      Frost accumulates when the defrost timer or defrost heater fails — the
      evaporator coil ices over and blocks cold air circulation entirely. Samsung
      french-door models with bottom freezer drawers get this constantly: once the
      defrost cycle stops running, you'll see error codes like 22E or 24E before
      the drawer jams solid.

      The fix on Samsung units is usually a defrost heater replacement and a manual
      defrost to clear the ice wall. Takes about 90 minutes on-site. LG bottom-freezer
      models throw an Er FF code for the same root problem — frozen evaporator fan.
      Same diagnosis, slightly different part number.

  - title: "Door gasket cracking and leaking warm air"
    description: |
      A failed door gasket on a Sub-Zero or Thermador built-in isn't obvious at
      first. The unit just runs constantly and your electricity bill climbs. Claremont's
      day-to-night temperature swings near the foothills accelerate gasket hardening
      and cracking. Left too long, the compressor burns out from the extra load.

      Sub-Zero gaskets are brand-specific and take 2–4 days to source. If you're
      seeing condensation pooling inside the door frame, or the seal fails the
      dollar-bill test — place a bill in the door, close it, tug — that's your
      answer. Call before it becomes a compressor job.

faq:
  - q: "How fast can you get to Claremont for a freezer repair?"
    a: |
      From our San Gabriel Valley dispatch we're typically 25–35 minutes out,
      running routes along the 210 and Foothill Boulevard daily. Same-day slots
      are usually open — call (323) 870-4790 before noon and we can generally
      arrive by early afternoon.

      Evening appointments are available for urgent situations. If your freezer
      is full and you're worried about food loss, mention that when you call —
      we prioritize those.

  - q: "Do you repair KitchenAid and Sub-Zero freezers in Claremont?"
    a: |
      Both are common here, especially in renovated homes north of Foothill. On
      KitchenAid column units we most often replace the evaporator fan motor or
      ice maker assembly. Sub-Zero work usually comes down to the condenser fan
      or a failed door gasket. LG and Samsung units come through regularly too.

      Bosch and Thermador column freezers are becoming more common in Claremont's
      newer townhome developments — we carry parts for those as well and can usually
      pull the repair history by serial number before arriving.

  - q: "What does freezer repair typically cost, and how does the visit work?"
    a: |
      Diagnosis runs $85 — waived if you book the repair same visit. Most jobs
      land between $150–$350 parts and labor. If your freezer is full of food,
      emergency evening slots are available. Call (323) 870-4790 or schedule online;
      we usually respond within 2 hours on weekday requests.
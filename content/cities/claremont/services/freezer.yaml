title: "Claremont Freezer — Repair When Valley Heat Turns Up"

intro: |
  The older Craftsman homes north of Foothill Boulevard and the 1960s ranches
  clustered around the Claremont Colleges pack a lot of freezer-dependent
  households into 91711. A KitchenAid upright working overtime through a July
  heat wave in a south-facing garage is a repair call waiting to happen.

  Compressors in chest units out here hit their thermal limits faster than
  manufacturers account for — the San Gabriel Valley doesn't cool off at night
  the way coastal LA does. Daytime highs near the base of the San Gabriel
  Mountains regularly sit 8–12 degrees above what the Westside sees in the
  same heat wave.

  That temperature gap matters a lot to a freezer compressor.

localContext: |
  Claremont's housing runs from pre-war bungalows near the Village to
  mid-century ranches on streets east of Indian Hill Boulevard. Zip code 91711
  carries a lot of owner-occupied homes where appliances stay in service until
  something breaks.

  Anything built before 1975 often has a chest freezer in a detached garage or
  poorly ventilated utility room — conditions that grind down compressors years
  ahead of schedule. Tight kitchens in the older bungalow stock also mean
  limited clearance when a technician needs to pull a unit out for access.
  We've learned to park on side streets near the Village rather than block
  narrow driveways.

  Homes closer to the Padua Hills area tend toward newer construction with
  built-in configurations — Sub-Zero column freezers behind cabinetry panels,
  Thermador drawer units set into islands. Those require a different service
  approach entirely.

commonProblems:
  - title: "Compressor Overheating in Garage-Stored Chest Freezers"
    description: "Garage ambient temps in Claremont push past 95°F regularly by July.
      The compressor runs near-constant under that thermal load, and once the
      condenser fan motor starts to drag, internal temps climb from 0°F toward
      20°F before anyone notices.

      Samsung and LG units throw fault codes early — the LG ER FF error is
      almost always the condenser fan before it's anything else. Older Whirlpool
      and Frigidaire chest freezers just quietly stop holding temperature, no
      warning at all. A failed condenser fan motor is usually a same-day fix
      when we have the part on hand — and for those two brands, we usually do.

      Moving the unit indoors isn't always an option. We carry thermal spacers
      that improve airflow clearance for garage installations when repositioning
      isn't feasible."

  - title: "Frost Buildup Choking the Evaporator Fan"
    description: "Heavy ice accumulation on the evaporator coil is one of the most
      common freezer complaints we get from Claremont homeowners. A worn door
      gasket is the usual culprit — humid summer air leaks in, freezes on the
      coil, and eventually blocks the evaporator fan completely.

      Sub-Zero column freezers and KitchenAid uprights both develop this.
      When the defrost heater also fails to cycle, the frost builds unchecked
      until the unit reads 25°F and the homeowner pulls out everything to check.
      The KitchenAid KUFX25RHBL is particularly prone to defrost heater failure
      around the 7-year mark — the bimetal thermostat loses calibration before
      the heater element itself goes.

      Door gasket replacement on most uprights takes under an hour."

  - title: "Control Board Failures After Peak-Demand Brownouts"
    description: "SCE holds steady most of the year, but summer demand on the San
      Gabriel Valley grid brings voltage sags that hit sensitive electronics hard.
      Thermador and Bosch freezers run sophisticated digital control boards — a
      brownout at the wrong moment can corrupt the firmware or blow an internal
      relay.

      Classic symptoms: erratic temperature display, or the compressor cycling
      every few minutes without stabilizing. Sometimes the unit shows E1 or
      E3 fault codes that clear on reset, then return.

      The board swap itself is straightforward once diagnosed. Getting the right
      board for a panel-ready Thermador model takes a day to source, but that's
      the only delay — labor on board replacement runs under 90 minutes."

faq:
  - q: "How fast can you get to Claremont for a freezer repair?"
    a: "Same-day service is standard for Claremont. We run the 210 corridor
      regularly — the Indian Hill Boulevard exit puts us into most neighborhoods
      in under 20 minutes from Pomona. Street parking is easy on residential
      blocks near the Village and along Foothill. Call (323) 870-4790 in the
      morning and we can usually lock in a same-day window, evening slots
      included."

  - q: "Do you repair Sub-Zero and Thermador freezers, or just the common brands?"
    a: "Both. Sub-Zero column freezers are common in the larger homes north of
      Foothill near the Padua Hills area — they need specific tooling to access
      the evaporator compartment without damaging the cabinet surround.
      Thermador drawer units have a proprietary drain pump setup that generic
      parts won't fit. We stock the right components for both.

      For everyday brands — Whirlpool, LG, KitchenAid, Samsung — most
      91711 households are covered same-day."

  - q: "What does freezer repair cost, and what does the process look like?"
    a: "Flat-rate diagnostic visit first. We check the compressor, door gasket
      seal, defrost circuit, and control board before quoting anything. Common
      parts — door gasket or defrost heater on an LG or Whirlpool — run
      $80–$160 installed. Premium brands cost more for parts, not more for
      labor.

      Schedule online or call (323) 870-4790. Emergency and evening slots
      are available, and we're usually there within 2 hours for same-day calls
      booked before noon."
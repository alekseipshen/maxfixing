title: "Claremont Refrigerator — Foothill Heat, Hard Water, Real Repairs"

intro: |
  Faculty housing around the Claremont Colleges consortium — the blocks off
  College Avenue and Harrison — tends to be 1940s and 50s construction. Tight
  kitchens, sometimes only 24 inches of clearance behind the unit. That's a
  problem for condenser airflow, especially in a summer where temps near the
  foothills crack 100°F for days at a stretch. A KitchenAid french-door
  running in those conditions will cycle its compressor almost continuously.
  Add the SGV's notoriously hard tap water and you've got two failure vectors
  working at once.

localContext: |
  Most of 91711 splits between 1940s–1960s homes near The Claremont Village
  and newer builds north of Foothill Boulevard toward the base of the San
  Gabriel Mountains. The older blocks have shallow kitchen alcoves — built
  before 36-inch counter-depth refrigerators existed — so condenser clearance
  is often inadequate and heat accumulates behind the unit year-round. Newer
  homes have better layouts but connect to the same mineral-heavy municipal
  water supply, which means ice maker and valve issues show up across both
  housing types equally.

commonProblems:
  - title: "Ice Maker Failure From Mineral Deposits in 91711 Water"
    description: |
      SGV tap water in Claremont consistently tests high for dissolved calcium
      and magnesium. That buildup calcifies the water inlet valve over time —
      sometimes completely blocking flow — and scales up the ice maker assembly
      itself until output drops to near zero. Samsung and LG french-door models
      are hit hardest because their water lines route through the door hinge,
      trapping deposits in a narrow passage that's awkward to flush.
  - title: "Compressor Overload During Foothill-Area Heat Events"
    description: |
      North Claremont homes near the mountain base trap heat differently than
      Valley-floor properties — less coastal breeze, radiant heat off the
      hillside in late afternoon. That pushes ambient kitchen temps high enough
      to force the compressor into near-constant cycling. A Bosch or Sub-Zero
      that starts making a low grinding hum on hot days is usually telling you
      the compressor is thermally stressed, not mechanically broken — yet. Catching
      it early matters.
  - title: "Frost on the Evaporator Coil in Older Craftsman Homes"
    description: |
      Pre-1960s homes near Harrison Avenue and The Village often have door and
      window sealing that lets humid air infiltrate the refrigerator compartment.
      That humidity accelerates ice formation on the evaporator coil until
      airflow through the freezer section shuts down almost entirely. A
      KitchenAid showing a warm fresh-food compartment while the freezer holds
      temperature is almost always a failed defrost timer letting ice pack
      around the evaporator fan — not a refrigerant leak.

faq:
  - q: "How fast can you get to Claremont for refrigerator repair?"
    a: |
      The eastern SGV corridor runs through our regular daily route. From
      base, Claremont is 40–50 minutes depending on the 210. Parking near
      the college blocks and Village-adjacent streets is straightforward.
      Same-day appointments are usually available — call (323) 870-4790
      and we can often be there within two hours.
  - q: "Do you repair Bosch and KitchenAid refrigerators in Claremont?"
    a: |
      Both are common in 91711 homes. Bosch counter-depth units frequently
      come in with drain pump clogs and door gasket wear. KitchenAid
      french-doors tend toward defrost timer failures and ice maker assembly
      issues. Sub-Zero built-ins — more common in the larger foothill homes —
      require specialized tools we carry. LG and Samsung get handled too.
  - q: "What's the repair process and is same-day service available?"
    a: |
      Diagnosis runs the same visit — we check the compressor, evaporator
      coil, and water inlet valve on arrival and give you a price before
      touching anything. Most parts for Bosch, KitchenAid, and Samsung arrive
      next business day. Emergency same-day repair slots are open; evening
      availability exists most weeks. Call (323) 870-4790 or schedule online
      to lock in a time.
title: "Claremont Dishwasher Repair — Hard Water & Bosch Specialists"

intro: |
  Craftsman bungalows near the Claremont Colleges and the '80s tract homes off Monte Vista Avenue share one problem: San Gabriel Valley tap water running somewhere between 350 and 400 ppm calcium carbonate. That mineral load wrecks dishwasher spray arms and heating elements faster than most homeowners expect. A Bosch 300 Series that's been running six years in 91711 has probably accumulated enough scale in the inlet valve screen to drop wash pressure noticeably.

localContext: |
  Homes in the North Village — the older pre-WWII blocks around Yale Avenue — often have original cabinetry with tighter-than-standard dishwasher openings, which complicates pull-out repairs. The 91711 zip spans 1920s Craftsman kitchens all the way to 2000s remodels with KitchenAid or Bosch built-ins, and each era brings a different set of repair challenges. Mid-century ranches south of Foothill Boulevard typically have more accessible under-counter space, which helps when replacing a drain pump or float switch assembly.

commonProblems:
  - title: "Dishes Coming Out Gritty — Spray Arm Clogged With Mineral Scale"
    description: |
      Hard water deposits in the San Gabriel Valley are relentless. Calcium builds up inside spray arm nozzles and the float switch chamber until water pressure drops and the bottom rack barely gets rinsed. On Bosch and KitchenAid units, the upper spray arm is especially prone — its narrow holes clog faster than the main wash arm and are easy to miss until wash quality tanks.
  - title: "Standing Water After the Cycle — Drain Pump Failure"
    description: |
      Pooled water at the bottom of the tub almost always points to the drain pump or a clogged drain hose. Samsung dishwashers throw a 5C or OC error code when the pump motor starts failing. The fix usually means pulling the lower basket, removing the filter assembly, and either clearing a blockage or swapping the pump motor — a 45-minute job if the cabinetry gives you room.
  - title: "Detergent Tab Still Sitting There — Dispenser Door Stuck"
    description: |
      That spring-loaded dispenser door takes hundreds of heat cycles over its life. On LG and Bosch models, the actuator arm wears out and the door stops popping open mid-wash — so the whole load runs without soap. Small part, but reaching the detergent dispenser assembly requires removing the inner door panel, which most homeowners aren't set up to do safely.

faq:
  - q: "How fast can you get to Claremont for dishwasher repair?"
    a: |
      Claremont is on our regular San Gabriel Valley route — most morning calls get a same-day visit, usually within 2 hours of booking. Call (323) 870-4790 to check today's availability or schedule online. Evening slots open up most weekdays too.
  - q: "Do you repair Bosch and KitchenAid dishwashers in Claremont?"
    a: |
      Both are among the most common brands we see in 91711 homes. Bosch E24 and E25 drain errors, KitchenAid control board failures, LG AE error codes — we stock parts for all three on the truck, which means most repairs close on the first visit.
  - q: "What does a dishwasher repair call typically cost in Claremont?"
    a: |
      The service call fee is flat and applies toward the repair if you proceed. Most fixes — drain pump swap, dispenser replacement, spray arm cleaning — run $150–$280 depending on parts. Same-day completion is standard on common failures since we stock the high-frequency parts.
title: "Claremont Cooktop Repair — College Heights Kitchens, Fast Diagnosis"

intro: |
  Faculty housing along College Avenue and the Craftsman blocks near The Village tend to have KitchenAid and Bosch gas cooktops installed during kitchen remodels 8-12 years ago — right at the age when spark igniters start misfiring and burner valves get sticky. A burner that clicks endlessly without catching a flame isn't always a dirty electrode. Sometimes the spark module board itself is the culprit. Most calls from the 91711 zip follow a predictable pattern, and we carry the common parts.

localContext: |
  The streets between Foothill Boulevard and the Claremont Colleges are packed with 1950s and early '60s ranch-style homes where drop-in cooktops replaced originals during the remodel wave of the 2000s. Many of those installations are now 15-plus years old. Zip 91711 also includes newer custom builds on the hillside roads west of Padua Avenue, where Thermador and Sub-Zero packages are standard.

  Same Claremont water supply feeds both neighborhoods — and that hard water leaves mineral deposits that slowly choke burner orifices on Bosch, KitchenAid, and Thermador alike. Calcium carbonate doesn't discriminate by brand. We see clogged orifice fittings on a $600 LG and a $4,000 Thermador Star-Burner within the same week. The buildup timeline depends mostly on how long the house has been on Claremont's municipal supply and whether anyone runs a water softener.

commonProblems:
  - title: "Gas Burner Clicks But Won't Light — Spark Igniter Failure"
    description: "KitchenAid 30- and 36-inch gas cooktops from the mid-2010s have a recurring failure point in the spark igniter assembly — the ceramic insulator at the tip cracks from repeated heat cycling, breaking the spark gap. Mineral deposits on the electrode cap compound the problem over time. Replacing the igniter tip usually fixes it; if three or more burners stop simultaneously, the spark module board itself has likely shorted out. We stock ceramic igniter tips and module boards for the most common KitchenAid configurations — no waiting a week for a part to ship."
  - title: "Cracked Ceramic Glass on Induction Cooktops"
    description: "Bosch 500-series and 800-series induction units are a popular choice in Claremont's remodeled kitchens, but the ceramic glass surface is fragile — a heavy cast iron skillet dropped from countertop height can crack it cleanly, sometimes without a visible chip. A fracture near the heating element zone is an electrical safety issue, not just cosmetic. Full glass panel replacement requires complete disassembly and recalibration of the underlying element sensors. On Bosch 800-series units specifically, the element-to-glass contact gaskets must also be inspected during reassembly — skipping that step causes localized overheating within a few months."
  - title: "One Burner Running Too Hot or Too Cold — Gas Orifice Blockage"
    description: "Thermador Star-Burner cooktops occasionally show uneven heat across the grate — one burner maxing out while another barely simmers even on high. Nine times out of ten it's a partially blocked gas orifice, a small brass fitting that meters fuel flow to the burner head. Mineral deposits from Claremont's hard water, or residue from a boilover, can partially plug it. Cleaning or replacing the orifice is far cheaper than swapping the entire gas valve assembly. Call (323) 870-4790 if you're seeing this — it's usually a same-visit fix once we confirm the gas valve itself is intact."

faq:
  - q: "How fast can you get to Claremont for a cooktop repair?"
    a: "From our service area hub, Claremont is 35-45 minutes on the 210. Same-day visits are available most days — call (323) 870-4790 before noon and we can usually arrive that afternoon. Street parking near the college neighborhood is generally easy, no issues getting the van close."
  - q: "Do you work on Bosch and Thermador cooktops specifically?"
    a: "Both are regular jobs in 91711. Bosch induction panels and Thermador gas cooktops are the two most common premium brands we service in this area. KitchenAid, Samsung, and LG gas and electric units are also familiar. Thermador Star-Burner orifice kits and Bosch glass panels are parts we can source quickly. For Samsung and LG induction models, we carry the control board and heating element assemblies that cover the most common error codes — E1 and E2 lockout errors on LG units in particular."
  - q: "What does the repair process look like, and how urgent can you get here?"
    a: "Diagnostic fee applies toward the repair if you proceed. Igniter and orifice issues are usually same-visit fixes — parts on the truck or sourced next day. Cracked glass panels take 2-3 days to order. Evening and weekend slots are open for urgent calls. Schedule online or call (323) 870-4790."
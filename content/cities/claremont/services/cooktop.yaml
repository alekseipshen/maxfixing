title: "Claremont Cooktop Repair — Pomona Valley Hard Water Fixes"

intro: |
  Pomona Valley Water District water runs hard — consistently above 300 mg/L TDS — and
  that mineral load hits cooktop components fast. Burner ports scale up, igniter tips
  corrode, and the spark electrode on that Bosch five-burner stops firing cleanly.

  The neighborhoods east of the Claremont Colleges, especially along College Avenue toward
  Harrison, have seen a wave of kitchen upgrades over the past decade. Those premium
  installs need technicians who know the equipment, not someone guessing. A Thermador or
  Sub-Zero cooktop isn't something you want a generalist poking at with no service manual.

  Call (323) 870-4790 if you're dealing with a burner that won't light or a cracked
  induction surface — same-day service is usually available in 91711.

localContext: |
  Residential housing in 91711 skews toward 1950s-1960s ranch-style and craftsman homes,
  many of which had coil-top electrics until owners renovated and dropped in slide-in gas
  or induction units. The blocks between Foothill Boulevard and 8th Street are full of
  these — original tract homes where the kitchen was clearly an afterthought until someone
  gutted it and installed a $3,000 KitchenAid induction cooktop into a cabinet opening
  that was never designed for it.

  Counter cutouts in those older builds near the Claremont Village often weren't widened
  to spec. That traps heat under sealed ceramic cooktops and accelerates control board
  failure. Getting access to the underside of a built-in in these kitchens takes time.

  Parking a service van on the narrower residential streets off Indian Hill Boulevard adds
  10-15 minutes to every job. It's a known logistic in this part of Claremont.

  A handful of newer builds closer to the 210 — particularly in the Padua Hills area and
  along Mountain Avenue — have full built-in Thermador and KitchenAid ranges with
  integrated cooktops requiring factory-level diagnostics. Those units pull manufacturer
  error codes that generic repair shops can't read without dedicated service tools. We
  carry them. The Claremont zip code 91711 also covers several HOA developments near
  the 71 interchange where remodeled kitchens frequently feature Samsung slide-in gas
  ranges or LG induction tops — different failure modes entirely from the Thermador
  units up the hill, but we see both.

commonProblems:
  - title: "Clogged Burner Ports and Dead Igniters — Claremont's Water Hardness Is the Cause"
    description: |
      Hard water deposits accumulate inside burner ports and around the spark electrode on
      gas cooktops faster here than in coastal neighborhoods. The igniter tip corrodes, the
      burner cap gets coated, and the spark module has to cycle repeatedly before ignition —
      if it fires at all.

      On a Bosch gas cooktop, this usually shows up as a clicking burner that won't catch.

      Sometimes the control board logs a fault and cuts the igniter circuit entirely — at
      that point the clicking stops too, and the homeowner thinks the whole unit is dead.
      Cleaning the electrode and replacing the spark module resolves it in most cases.
      Occasionally the burner cap itself needs replacing if mineral deposit has eaten into
      the port edges past the point where a wire brush does anything useful. That's a
      30-minute swap on a Bosch, about 45 minutes on a Thermador star-burner because the
      cap retention system is different.

  - title: "Cracked Ceramic Glass From Summer Heat Cycling in San Gabriel Valley"
    description: |
      Claremont summers regularly hit 95°F-plus, and that ambient heat stresses induction
      cooktop glass in ways coastal kitchens don't see. Setting a cold cast-iron pan on a
      KitchenAid ceramic surface that's already warm from a hot kitchen creates micro-fractures
      near the heating zone edge.

      Those hairline cracks spread. Fast.

      The glass panel is a replaceable component — the induction coil underneath is usually
      fine — but the surface can't be ignored once cracked. Moisture gets under the glass
      and reaches the electronics. Some homeowners run the unit for weeks after spotting a
      hairline crack, which turns a $200 glass replacement into a $500 control board job.
      If your KitchenAid or LG induction unit is showing an E6 or F7 error code alongside
      visible surface damage, that moisture migration has probably already started.

  - title: "Knob Valve Stem Wear on Thermador and KitchenAid Units in Remodeled Homes"
    description: |
      Thermador star-burner cooktops installed during the 2013-2018 remodel wave in Claremont
      are now 8-12 years old. The knob valve stem — the part that physically meters gas flow
      — develops play over time. The burner no longer shuts off at the marked position.

      That's a gas safety issue, not a cosmetic one.

      Valve stem replacement runs about $90-160 in parts and takes roughly an hour on-site.
      On older KitchenAid dual-fuel units, the valve o-rings tend to fail before the stem
      itself — a cheaper fix, but only if caught before the stem wears into the valve body
      and requires full assembly replacement. We see this pattern a lot in the 91711 homes
      along Baseline Road where Thermador installs from that remodel era are now due for
      their first major service.

faq:
  - q: "How fast can you get to Claremont for cooktop repair?"
    a: "We route off the 210 at Baseline — Claremont is 25-35 minutes from our coverage
      center. Same-day service is usually available; call (323) 870-4790 and we can
      typically be there within 2-3 hours. Evening slots are open most weekdays."
  - q: "Do you repair Bosch and Thermador cooktops in this area?"
    a: "Yes — Bosch induction and gas, Thermador star-burner units, and KitchenAid
      five-burner cooktops are the most common brands we see in 91711. On Bosch induction,
      it's usually the control board or cracked ceramic glass. Thermador calls are almost
      always igniter or valve stem issues. We stock the most common Thermador and Bosch
      parts on the van, so most jobs don't require a return visit for parts."
  - q: "What does a cooktop repair typically cost, and how does the visit work?"
    a: "Flat-rate diagnostic: we identify the fault and quote parts and labor before
      touching anything. Most repairs finish same-day. If a specific Thermador or Bosch

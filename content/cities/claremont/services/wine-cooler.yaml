title: "Claremont Wine Cooler Repair — College Town Heat Wrecks Compressors"

intro: |
  The Claremont Colleges faculty housing corridor along College Avenue and Mountain
  Avenue runs through 91711 packed with Bosch dual-zone built-ins and KitchenAid
  undercounter units — academics who made real investments in proper wine storage and
  expect them to hold 55°F reliably. Inland heat changes the math. Claremont
  regularly clocks 100°F and above from June through September, and a wine cooler
  compressor fighting that ambient temperature through a full summer takes years off
  its rated lifespan. The symptom is almost always the same: unit running constantly,
  temperature climbing, wine warming faster than it should.

localContext: |
  ZIP 91711 carries two distinct housing eras. Closest to the Colleges, 1920s and
  1930s craftsman bungalows along Harrison Avenue and Bonita Avenue have tighter
  kitchens — original cabinetry, low clearances, wine coolers retrofitted into spaces
  that were never designed for them. Further north toward the Padua Hills area, 1960s
  ranch-style homes are the dominant stock, with larger kitchens but the same
  retrofit problem: units pushed into cabinetry with one inch of clearance on each
  side instead of the two inches the manufacturer specifies. Both situations produce
  the same failure: restricted airflow around the condenser coil, compressor running
  hot, and a cooling system that slowly loses capacity through the summer.

commonProblems:
  - title: "Compressor Overheating in Cabinet Retrofits — Claremont's Most Common Call"
    description: |
      Faculty homes near College Avenue and the 1960s ranches throughout 91711 share
      the same installation problem: wine coolers shoved into cabinetry with
      insufficient rear and side clearance. Bosch and KitchenAid both specify minimum
      two-inch clearance on all sides for the condenser to exhaust heat. Cut that to
      an inch and a half, add August temperatures pushing past 100°F in Claremont's
      inland climate, and the thermal overload protector starts tripping within a
      season. The compressor isn't defective — it's being cooked by its own exhaust.
      Repositioning the unit fixes it; ignoring it means a compressor replacement at
      four times the cost.

  - title: "Temperature Swings from Door Gasket Failure in Dry Inland Heat"
    description: |
      Rubber door gaskets on wine coolers degrade faster in Claremont's low-humidity
      inland climate than they do at the coast. A cracked gasket on a KitchenAid
      undercounter unit allows warm air infiltration continuously — the thermostat
      overcorrects, and cabinet temperature swings 8 to 12 degrees instead of holding
      the target. You might see an E3 or temperature-alarm error before the control
      board burns out trying to compensate. New gasket installation is a one-visit
      repair. Once the seal is seated correctly, temperature stability returns within
      a few hours.

  - title: "Vibration Noise from Worn Compressor Mounts in LG Units"
    description: |
      A low-frequency rattle coming from the base of a wine cooler — especially
      pronounced in the quiet neighborhoods around Padua Hills — usually means worn
      compressor mounting grommets. LG's bottom-mount compressor configuration is
      particularly prone to grommet failure between years five and seven of service.
      The grommet set itself costs under $20. Left unaddressed, the vibration
      transfers stress to the refrigerant lines, which eventually crack at the solder
      joints. At that point, a $20 fix becomes a refrigerant recovery and recharge job
      at $250 minimum.

faq:
  - q: "How fast can you get to Claremont for wine cooler repair?"
    a: |
      Claremont is on our regular San Gabriel Valley route via the 210 — typically
      25 to 40 minutes from dispatch. Same-day slots are available most weekdays, and
      evening appointments open most weeks. Call (323) 870-4790 to confirm a window.
      Residential streets throughout 91711 are easy for a service van — no parking
      coordination needed.

  - q: "Do you service Bosch and KitchenAid wine coolers, or just the big brands?"
    a: |
      Bosch dual-zone built-ins and KitchenAid undercounter units are the two we see
      most often in Claremont. Bosch frequently needs condenser fan motor replacements;
      KitchenAid models in the 2013–2018 range come in for thermostat and door gasket
      failures. LG and Samsung freestanding coolers are also in regular rotation —
      compressor mount and control board issues mostly.

  - q: "What does wine cooler repair cost, and do you charge for the diagnostic?"
    a: |
      Diagnostic visit runs $75 to $95 and gets credited toward the repair if you
      proceed. Most compressor or fan motor jobs land between $150 and $300. Common
      parts travel in the van, so one-visit repairs are standard — no waiting a week
      on a parts order. Same-day emergency slots are available if your unit is warming
      up ahead of an event. Book at (323) 870-4790.
  - q: "Do you repair Samsung and LG front-load washers in Lawndale?"
    a: "Yes — Samsung and LG are probably half our washer calls. Common jobs:
      drain pump failures, door lock assembly replacements, and control board
      error codes. Bosch front-loaders come up occasionally too, and we stock
      parts for those. Whirlpool and GE top-loaders round out most of the rest.
      KitchenAid stackables show up in the newer remodels around 90260 —
      we service those as well."

  - q: "What does a washer repair call cost, and how does it work?"
    a: "Diagnostic visit is $75, credited toward the repair if you move forward.

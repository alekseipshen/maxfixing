title: "Lawndale Washer Repair — Postwar Homes, Hard Water, Real Fixes"

intro: |
  Compact utility closets in Lawndale's postwar bungalows were built for
  top-loaders — not the Samsung or LG front-loaders most households run today.
  Tight access, older drain hookups, and 90260's notoriously hard municipal
  water are a rough combination for any washer. A machine that worked fine
  somewhere newer can start throwing error codes here within a year or two.
  Mineral scale hits the drain pump filter first, then the water inlet valve.
  Hard water deposits also shorten the life of door gaskets on front-loaders —
  the rubber stiffens, cracks, and starts leaking onto the floor. Most
  homeowners don't connect those two things until they call us.

localContext: |
  Most of the housing stock in 90260 dates from the 1950s and 1960s — smaller
  square footage, laundry tucked into converted garages or stacked in hallway
  closets off the kitchen. Stackable units are common, and older plumbing
  connections reduce drain flow over time. Cramped installs make drum bearing
  swaps and drain pump jobs more involved than on a freestanding unit with
  room around it. The apartment buildings along Prairie Ave add another layer —
  shared laundry hookups, multiple machines on one line.

  Garages converted to laundry rooms are particularly common near the Lawndale
  Recreation Center side of 90260. The venting on those setups is often
  undersized — not a washer problem directly, but moisture buildup accelerates
  control board corrosion over time. A GE or Whirlpool that starts throwing
  intermittent error codes in a garage install is usually dealing with that
  exact issue. Worth mentioning when you call us so we bring the right diagnostic
  equipment.

commonProblems:
  - title: "Drain Pump Clogging from Hard Water Mineral Scale"
    description: "LA's tap water is legitimately hard — mineral deposits build up inside
      the drain pump filter and impeller over time, especially when machines
      skip regular maintenance cleans. A Whirlpool top-loader throwing F9 E1
      or standing water after a spin cycle is almost always a clogged or
      failing drain pump. Samsung front-loaders show it as a 5E or SC code.
      LG models throw OE. Same root cause regardless of brand — the impeller
      gets coated and can't move water fast enough. Replacing the pump and
      clearing the filter runs about an hour on most models, and we carry
      drain pump assemblies for all three on the van."

  - title: "Drum Bearing Wear in Stackable Front-Loaders"
    description: "Stackable LG or Samsung units crammed into hallway closets tend to
      run unbalanced loads more often — there's simply less room to sort by
      weight. That constant imbalance accelerates drum bearing wear fast. A
      grinding or roaring noise during the spin cycle is the giveaway. Ignore
      it long enough and a bad bearing destroys the drum seal, turning a
      $180 job into a $400 one. On Samsung front-loaders, a worn bearing
      also puts stress on the spider arm — that's the cast bracket connecting
      the drum to the shaft. Once the spider cracks, the repair cost starts
      approaching replacement cost, so catching the bearing noise early
      matters here."

  - title: "Water Inlet Valve Failure on Mid-2000s GE and Maytag Models"
    description: "Plenty of Lawndale homes still have a GE or Maytag top-loader from
      15 years ago sitting in the garage. The water inlet valve on these
      machines eventually calcifies shut or starts weeping onto the floor
      mid-cycle — you'll see it as a slow fill, no fill at all, or a puddle
      under the machine. On GE models the solenoid screens inside the valve
      body clog first; on Maytag it's usually the diaphragm that gives. New
      valve plus a supply line flush, and it's usually resolved in a single
      visit. Call (323) 870-4790 to get on the schedule — same-day is
      available most weekdays."


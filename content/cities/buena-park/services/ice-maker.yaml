title: "Buena Park Ice Maker Repair — Hard Water & Aging Lines"

intro: |
  Tap water in 90620 runs hard — the Orange County Water District blend regularly measures above
  250 mg/L total dissolved solids, and that mineral load quietly destroys water inlet valves and
  ice maker components without warning. Most no-ice calls in Buena Park trace back to scale, not
  mechanical failure. That LG french-door in your kitchen, or the KitchenAid built-in in a newer
  Stanton Avenue build, wasn't designed for California mineral water without some ongoing upkeep.
  The symptom is always the same: fridge runs fine, you reach for ice, the bin is empty. Call
  (323) 870-4790 — same-day slots are usually open.

localContext: |
  Buena Park's residential tracts were built mostly between 1955 and 1975, filling in the land
  around Knott's Berry Farm as Orange County suburbanized after the war. Homes in the 90621 zip,
  particularly on streets north of Lincoln Avenue toward the La Palma corridor, often still run the
  original copper supply lines that feed the refrigerator. Those lines tap into the ice maker's
  water inlet valve through a saddle-valve connection — notorious for mineral sediment buildup
  over time. Tight galley kitchens in these mid-century ranchers also make pulling a full-size
  refrigerator a bigger job than homeowners expect.

commonProblems:
  - title: "Calcium Scale Blocking the Water Inlet Valve"
    description: |
      Hard OC tap water deposits calcium carbonate directly onto the water inlet valve screen until
      flow drops below the threshold needed to trigger the ice maker cycle. The ice maker assembly
      goes silent — fridge cools fine, no error code appears, and the problem only surfaces when
      the bin runs dry. In 90620 and 90621 homes, scale blockage is by far the most common cause
      of sudden no-ice complaints in units three or more years old. A valve swap and supply line
      flush usually resolves it in a single visit.

  - title: "Frozen Fill Tube on Older Refrigerator Models"
    description: |
      On older Whirlpool and GE units, the plastic fill tube routing water into the ice mold can
      freeze solid when the freezer thermostat drifts colder than design spec — something that
      creeps up gradually with age. The ice maker arm locks in the raised position, production
      stops, the bin stays empty. Thawing the fill tube and recalibrating or replacing the
      thermostat typically resolves it. Common pattern in Buena Park's older ranch-style homes,
      where gradual thermostat drift goes unnoticed for months until someone actually needs ice.

  - title: "Optical Sensor Failure in Samsung and LG French-Door Units"
    description: |
      Samsung and LG french-door refrigerators rely on an infrared optical sensor to track ice bin
      fill level. Frost buildup or a film of dust on the sensor eye tells the unit the bin is full
      when it's empty — production shuts off completely. Samsung models sometimes log a specific
      error code; LG units typically just stop silently. Cleaning the lens helps temporarily, but
      a faulty sensor board needs replacement. We stock these for the most common french-door
      configurations sold in Orange County.

faq:
  - q: "How fast can you get to Buena Park for an ice maker repair?"
    a: |
      The 91 and 5 corridors run through our daily service route, so Buena Park is easy to reach
      from either direction. Most calls in 90620 and 90621 get same-day scheduling. Call
      (323) 870-4790 before noon and we can usually put a technician on-site that afternoon
      or evening.

  - q: "Do you repair LG and Samsung ice makers in Buena Park?"
    a: |
      Yes — those are two of the most frequent ice maker calls we see here. LG french-door models
      often need full ice maker assembly replacement or fill tube work. Samsung units tend to fail
      at the water inlet valve or optical sensor board. We stock parts for both and typically close
      the repair in one visit.

  - q: "What does an ice maker repair cost, and how quickly can you respond?"
    a: |
      A water inlet valve replacement typically runs $150–$220 parts and labor. Full ice maker
      assembly replacement on a KitchenAid or Bosch lands between $250–$380. We always diagnose
      on-site before quoting — the same symptom often has multiple root causes. Same-day and
      evening appointments are available for Buena Park calls.
  positioned on the second floor. That upstairs placement matters in Rancho
  Santa Margarita. A worn drum bearing on a Miele or KitchenAid machine vibrates
  through the whole ceiling below and gets misdiagnosed as a structural problem
  half the time.

  Dove Canyon and Melinda Heights tend to have the largest floor plans — bigger
  capacity machines, more complex drivetrains, more to go wrong after 25+ years.
  Homes along Dove Canyon Drive backing up to the private golf course run Bosch
  500 Series and Miele W1 units almost exclusively; panel-ready installations
  behind cabinet fronts mean you need to know exactly what you're pulling before
  you start disassembling anything.

  Trabuco Highlands and Robinson Ranch have a slightly older stock — mid-90s
  builds where the original washer hookups were plumbed for top-loaders, then
  later retrofitted for front-loaders without upgrading the drain standpipe
  height. That mismatch causes phantom drain errors that look like pump failures
  but aren't. Tijeras Creek area homes near the golf club tend toward larger
  utility rooms, which gives us better van access and easier part staging during
  a washer repair.

  Rancho Cielo and the streets just north of Lago Santa Margarita are mostly
  townhomes and attached condos — shared walls mean a vibrating spin cycle in
  unit 4 becomes everyone's problem in Rancho Santa Margarita's denser
  neighborhoods. Shock absorber and drum bearing jobs in these buildings account
  for a disproportionate share of our RSM calls.

commonProblems:
  - title: "Drain Pump Failures from Mineral Accumulation"
    description: "RSM's hard water deposits calcium inside the drain pump filter
      until the motor stalls mid-cycle. The machine stops, displays an E17 or
      F21 error, and leaves clothes soaking. Bosch's drain pump assembly sits
      low in the chassis and requires full front-panel removal to access — we
      keep the part stocked in the van for same-day washer repairs in Rancho
      Santa Margarita."
  - title: "Excessive Spin Vibration — Worn Shock Absorbers"
    description: "Second-floor laundry rooms amplify any drum imbalance. Worn
      shock absorbers on a Samsung or KitchenAid top-loader let the spin basket
      slam the cabinet walls hard enough to crack drywall. Replacing the shock
      absorber pair usually runs under $200 total — and the problem stops
      completely the first spin cycle after the repair."
  - title: "Door Lock Assembly Failures on Miele W1 Series"
    description: "The door lock mechanism on Miele W1 front-loaders — common in
      Dove Canyon and Melinda Heights homes — wears out around year seven or
      eight. The machine displays F138 or simply won't start a cycle. It's a
      Miele-specific part; we source it through our parts network faster than
      ordering retail and usually avoid the 3–5 day standard lead time."


  Margarita are full of Bosch and Miele front-loaders — machines that come
  standard in higher-end RSM homes but need specific diagnostic tools when the
  control board throws a fault code. Santa Margarita Water District delivers
  water in the 250–300 ppm hardness range, which accelerates mineral buildup
  inside water inlet valves faster than most homeowners expect. Call
  (323) 870-4790 — we're usually in the 92688 zip code the same day.

localContext: |
  Most homes in 92688 were developed between 1987 and 1995 as part of a single

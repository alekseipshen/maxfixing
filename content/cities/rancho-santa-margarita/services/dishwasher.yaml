title: "Rancho Santa Margarita Dishwasher — Hard Water, Fast Fix"

intro: |
  The master-planned neighborhoods fanning out from Lake RSM look immaculate — and
  the Bosch and Miele units built into those late-'90s kitchens are quietly
  accumulating mineral scale every single cycle. Rancho Santa Margarita sits on
  some of Orange County's hardest tap water, consistently above 280 ppm calcium
  carbonate. That scale coats the spray arm first, then the inlet valve screen,
  then the detergent dispenser — until one day nothing rinses clean.

localContext: |
  Most of RSM's housing stock went up between 1988 and 2002, meaning appliances
  are either original and overdue or mid-range replacements that didn't account
  for hard-water abuse. The 92688 zip covers everything from Melinda Heights
  condos to larger single-family homes near the Tijeras Creek Golf Club — very
  different installation footprints. Built-in panel-ready dishwashers in
  higher-end remodels here often require custom door-panel removal before any
  diagnostic work can even begin.

commonProblems:
  - title: "Spray Arm Clogging from Mineral Scale — 92688 Water Is Relentless"
    description: "Hard water deposits plug the spray arm ports faster here than most of
      LA County. That Bosch 500 or 800 Series starts leaving gritty residue on
      glasses — not dirty dishes, calcified ports restricting water pressure. The
      fix involves descaling the spray arm assembly and inspecting the inlet valve
      screen, which usually needs replacement at the same visit."
  - title: "Standing Water After the Cycle — Drain Pump Failure"
    description: "An inch of cloudy water sitting at the bottom after the cycle ends
      almost always points to the drain pump. KitchenAid and Miele units in RSM
      develop this when food debris combines with mineral buildup and blocks the
      pump impeller. The float switch may also trigger a false 'full' reading,
      preventing the final drain sequence from starting at all."
  - title: "Detergent Dispenser Won't Open Mid-Cycle"
    description: "The dispenser door relies on a wax motor actuator that fails from heat
      cycling and hard-water residue around the latch. Bosch units throw an E24
      or E25 error code when this happens — dishes come out still soapy, or the
      pod sits there untouched. Replacing the dispenser assembly, not just
      cleaning it, is the permanent fix on units over five years old."

faq:
  - q: "How fast can you get to Rancho Santa Margarita for dishwasher repair?"
    a: "We cover 92688 out of South Orange County — typically same day, usually
      within 2 hours of your call. Tijeras Creek and Melinda Heights are both on
      our regular route. Call (323) 870-4790 or schedule online to lock in a slot."
  - q: "Do you repair Miele and Bosch dishwashers in Rancho Santa Margarita?"
    a: "Yes — Bosch (including panel-ready 500 and 800 Series), Miele, and
      KitchenAid are the three we see most in RSM. On Bosch units we commonly
      replace drain pumps, door latch assemblies, and control boards. Miele
      diagnostics require a specific dealer tool, which we carry."
  - q: "What does a dishwasher repair typically cost out here?"
    a: "Most repairs in Rancho Santa Margarita run $150–$350 depending on the
      part. Drain pump swap on a Bosch is on the lower end; control board
      replacement on a panel-ready Miele is higher. We diagnose on-site, quote
      before touching anything, and stock common parts — same-day completion is
      the norm."
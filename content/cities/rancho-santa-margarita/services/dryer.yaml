title: "Rancho Santa Margarita Dryer — 90s Builds, Same-Day Repair"

intro: |
  Planned lot by lot starting in 1987, RSM's residential tracts off Melinda Road and
  around the lake in 92688 are hitting that 30-to-35-year mark — right when gas dryer
  igniter assemblies and drum rollers start failing. A Miele heat-pump unit in one of
  the newer Plano Trabuco condos is a completely different repair than a Whirlpool
  stacked pair in an older townhome off Avenida Empresa. Both show up on our service
  calendar regularly. Call us at (323) 870-4790 for same-day availability.

localContext: |
  The 92688 zip covers most of RSM's single-family tracts — built between 1988 and 1998
  during the master-planned buildout. Laundry setups range from dedicated utility rooms
  in the larger Rancho Cielo homes to stacked pairs crammed into hallway closets near
  Oso Parkway. Both present different access challenges. Thermal fuse and belt tensioner
  replacements on stacked units often take twice as long when you're working on your
  knees inside a 30-inch alcove with a panel door in the way.

commonProblems:
  - title: "Thermal Fuse Blown — Degraded Vent Runs in 90s Construction"
    description: "RSM's original build spec'd short, straight exhaust runs — but 30 years of
      foil flex duct collapsing inside the wall changes the math. Restricted exhaust
      pushes temperatures up until the thermal fuse opens the circuit and the dryer stops
      heating completely. Standard Maytag and Whirlpool gas models take this hard. We
      replace the fuse and clear the duct section in the same visit."
  - title: "Noisy Tumbling and Drum Not Spinning — Worn Rollers and Bearings"
    description: "Drum rollers on a mid-90s GE or Kenmore wear quietly for months before
      the grinding starts. By then the drum bearing is often already scored, and the drive
      belt is carrying load it wasn't designed for. We stock roller kits for GE and
      Whirlpool platforms on the van — most of these are same-day repairs without
      waiting on parts."
  - title: "Too Long to Dry — Moisture Sensor Fouling on Premium Units"
    description: "Bosch and Miele heat-pump dryers use a moisture sensor strip inside the drum
      to judge dryness. Fabric softener residue coats the sensor over time, tricking the
      machine into running extra-long cycles — or shutting off too early. A clogged
      blower wheel causes the same symptom but takes longer to fix. Both failures are
      common in the denser condo clusters near Las Flores Drive."

faq:

  - title: "Thermal Fuse Failures from Restricted Exhaust Runs"
    description: "Long, kinked vent runs in older Hawthorne colonials trap heat — the dryer can't exhaust fast enough, temperatures spike, and the thermal fuse blows as a safety cutoff. Once it goes, the machine runs but produces no heat at all. GE and Whirlpool models from the early 2010s show up most often with this pattern. Swapping the fuse without clearing the vent restriction just sets up the next failure."

  - title: "Drive Belt Snapping on Worn LG Front-Loaders"
    description: "Drum not spinning at all is almost always a snapped drive belt. LG front-load units go through belts faster once the drum bearings start to degrade — more friction, more load, belt gives out sooner. Hawthorne's humidity swings between January and August don't help rubber components age. Belt replacement usually wraps in under an hour if the rear panel is accessible without moving the unit into a hallway."

  - title: "Blower Wheel Lint Buildup in Older Whirlpool Units"
    description: "Ranches and split-levels with short, elbow-heavy exhaust runs accumulate lint inside the blower wheel housing rather than pushing it clear. Whirlpool dryers are frequent repeat visitors for this exact issue — when the blower wheel fills up, drying cycles stretch past 90 minutes and the motor starts running hot. Cleaning the wheel and straightening the exhaust path usually fixes both symptoms in one visit."


title: "Hawthorne Cooktop Repair — South Bay Gas & Electric, Same Day"

intro: |
  Postwar bungalows throughout the 90250 zip were built for gas ranges —
  then somebody swapped in a Samsung or GE glass-ceramic cooktop during a
  2010s kitchen update and cut a new hole in the laminate counter. That
  worked fine for a while. After enough thermal cycles, the mounting
  brackets stress the ceramic edge, burner igniters gum up from LA's
  dusty air, and knobs start sticking or snapping off entirely. We run
  the South Bay corridor daily and can usually reach Hawthorne within
  two hours. Call (323) 870-4790 to get on the schedule.

localContext: |
  Most of Hawthorne's residential blocks were built between 1948 and 1968,
  and plenty of those kitchens have only been updated once — usually in
  the late 1990s or early 2000s. The stretch between Prairie Avenue and
  Inglewood Avenue has a high density of rental units where cooktops are
  mid-range or older-budget stock: Whirlpool, GE, or Frigidaire freestanding
  ranges that have been running hard for fifteen years. In the 90250 zip's
  newer owner-occupied blocks, KitchenAid and Bosch five-burner gas cooktops
  are common — installed during kitchen flips and now hitting the age where
  spark igniters and gas valves start showing wear.

commonProblems:
  - title: "Gas Burner Clicks but Won't Light — Igniter Electrode Fouled"
    description: "LA's dusty air plus cooking grease is a reliable recipe for
      a clogged igniter electrode. The ceramic tip oxidizes, the spark module
      fires normally but the arc can't jump the gap consistently. On Whirlpool
      and GE gas cooktops common in Hawthorne rentals, this usually shows as
      one or two burners clicking without catching while the others light fine.
      Cleaning the electrode tip sometimes resolves it; more often the igniter
      assembly needs replacing. On units over eight years old, the spark module
      itself frequently goes out at the same time."

  - title: "Cracked Ceramic Glass Surface — Thermal Stress, Not Just Impact"
    description: "Samsung and LG glass-ceramic cooktops crack from thermal
      stress as often as from drops. A cold pan placed on a hot surface, or
      uneven contact from a warped pan bottom, creates a temperature differential
      the tempered glass can't absorb — the fracture starts underneath and works
      outward. Once the surface is cracked, the heating element beneath can arc
      through the break during operation. It's a safety issue. The glass panel
      on most Samsung models is a full-surface replacement; partial patches
      don't hold."

  - title: "One Zone Dead — Surface Burner Switch or Control Board Failure"
    description: "On electric cooktops, a single dead zone almost always
      points to either a failed surface burner switch or a control board
      that's dropped that zone's signal. GE and Frigidaire models that are
      ten-plus years old — a lot of those still running in 90250 rentals —
      show this pattern. The surface burner switch wears out mechanically
      from repeated dial movement. Replacing the switch is a straightforward
      fix; if the control board has failed, the diagnostic will show multiple
      zones affected or erratic behavior across the surface."

faq:
  - q: "How fast can you get to Hawthorne for cooktop repair?"
    a: "Hawthorne is on our regular South Bay route — we're in the 90250
      corridor most days and can usually arrive within two hours of your
      call. Street parking on residential blocks is generally fine for the
      service van. Call (323) 870-4790 for same-day availability; morning
      slots go fast but evening appointments are usually open."

  - q: "Do you repair Samsung, LG, and KitchenAid cooktops?"
    a: "All three are common in Hawthorne. Samsung glass-ceramic units
      typically come in for surface panel replacement or heating element
      failure. LG cooktops usually need igniter module or control board
      work. KitchenAid five-burner gas cooktops here mostly show burner
      cap buildup and gas valve issues. We also handle GE, Whirlpool,
      Frigidaire, and Bosch — most common parts ride on the truck."

  - q: "What does a cooktop repair visit cost, and can you come the same day?"
    a: "Diagnostic fee is $65, credited toward the repair. Most igniter
      electrode and heating element jobs run $120–$185 parts and labor.
      Control board replacements go higher depending on the model. You
      get a firm written quote before we start anything. Same-day
      emergency slots are available — call (323) 870-4790 and we'll
      give you a window."
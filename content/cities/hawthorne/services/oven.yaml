commonProblems:
  - title: "Oven Not Heating or Heating Unevenly"
    description: |
      The most common call from Hawthorne homeowners: the oven takes 45 minutes
      to reach 350°F, or never gets there at all. On gas ranges, the bake
      igniter is usually the problem. A healthy igniter draws 3.2–3.6 amps —
      once it drops below that threshold, the gas valve won't open and the
      burner won't light. We test current draw with a clamp meter on-site,
      right in your kitchen. No guessing.

      Electric ovens fail differently. The lower bake element on a GE Profile
      or Samsung NE series often cracks or burns through, sometimes leaving a
      visible blister on the coil. That's a 20-minute swap if the part is in
      stock — and for common models, it usually is.

  - title: "Broiler Works but Bake Doesn't (or the Reverse)"
    description: |
      Separate failure points. In KitchenAid dual-fuel models, the bake element
      and broil element run through independent relays on the control board. One
      relay can fail completely while the other keeps working. Samsung units
      frequently throw an F-3 or SE error code when the oven temperature sensor
      drifts out of spec — that's typically a $35–$40 sensor, not a reason to
      replace the range. LG units show F-9 when the door latch assembly fails
      to confirm the door is closed, which prevents the bake cycle from starting
      at all.

  - title: "Oven Door Won't Seal or Latch"
    description: |
      Worn hinges and a degraded door gasket are the usual culprits. Self-
      cleaning cycles push oven temps past 800°F, and that warps door latch
      hardware over time. A Bosch single wall oven with a loose-fitting door
      loses significant heat — you'll notice longer preheat times and uneven
      baking before the door problem is obvious. We stock replacement hinge kits
      and door gaskets for Bosch, LG, KitchenAid, and Samsung and can usually
      complete the repair in a single visit.

  - title: "Gas Smell or Delayed Ignition"
    description: |
      Delayed ignition — where the surface burner clicks repeatedly before
      catching — usually points to a fouled igniter electrode or a partially
      blocked burner port. Residue from spills is a common cause, but the
      electrode can also corrode and need replacing. Don't brush off a faint gas
      odor. Shut off the appliance, open a window, and call. We carry
      combustible gas detectors and test the supply line and all connections on
      every gas oven service call in Hawthorne.

faq:
  - question: "How quickly can you get to Hawthorne, NJ?"
    answer: |
      Most calls in the 07506 zip code get same-day service — usually within
      two hours of booking during weekday hours. Evening slots are available
      Monday through Friday. Call (323) 870-4790 and we'll give you an actual
      arrival window, not a four-hour block.

  - question: "Do you service Thermador or Bosch wall ovens?"
    answer: |
      Yes. Thermador wall ovens need a specific recalibration procedure after
      any thermostat or control board replacement — the generic steps in the
      service manual don't produce accurate results without brand-specific
      tooling. We've handled Thermador, Bosch, and KitchenAid built-ins in
      Hawthorne and nearby Wyckoff. Have your model number ready when you call
      and we'll confirm part availability before showing up.

  - question: "Is repairing an older oven actually worth it?"
    answer: |
      Depends entirely on the failure. A bake igniter replacement or heating
      element swap runs $150–$250 all-in — easy yes on any oven under 12 years
      old. A control board replacement on a Bosch or Thermador can reach
      $450–$600, and at that point age matters. We give you a straight
      cost-versus-replace assessment before touching anything. No pressure.

  - question: "The oven is showing an error code — what does that tell you?"
    answer: |
      A lot, actually. Samsung commonly throws SE (shorted control panel) or
      F-3 (temperature sensor out of range). LG's F-9 points to the door latch
      assembly. KitchenAid's F2-E0 flags a keypad fault. These codes are
      diagnostic signals — most don't mean the oven is done. Describe the code
      when you call and we can often narrow down the part before arriving, which
      speeds up the repair.


title: "Hawthorne Washer Repair — Hard Water & Aging Pipe Issues"

intro: |
  Goffle Road splits Hawthorne right down the middle, and on both sides you'll
  find 1950s and 60s split-levels still running on original supply lines.
  Passaic Valley Water Commission water is notoriously hard — that mineral load
  wrecks LG front-loaders faster than you'd expect. Water inlet valves scale
  up, detergent dispensers clog, and suddenly the machine just stops filling.
  This neighborhood's water chemistry is something we account for on every call.

localContext: |
  Most of 07506 is postwar residential — ranches, cape cods, and two-stories
  from the late 1950s and early 60s, with laundry tucked into basements or back
  utility rooms. That tight basement access makes diagnosis trickier. Newer
  townhomes near Diamond Bridge Avenue often have stacked Bosch or Samsung units
  stuffed into closets barely wider than the machines themselves. Older homes
  sometimes have galvanized supply lines that accelerate mineral buildup inside
  water inlet valves and internal hoses.

commonProblems:
  - title: "Hard Water Deposits Blocking Drainage in 07506 Basements"
    description: >
      Passaic County's hard water leaves calcium scale inside drain pumps and
      filter housings. On LG and Samsung front-loaders, a partially blocked
      drain pump shows up as a 5E or OE error code — water just sits cold in
      the drum. Clearing the filter and replacing the pump usually takes under
      an hour on-site.
  - title: "Excessive Vibration in Postwar Split-Level Laundry Rooms"
    description: >
      Older basement floors aren't always level, and worn shock absorbers on a
      Bosch front-loader will rattle the whole utility room during spin. Shock
      absorber wear and drum bearing wear tend to happen together — replacing
      one without checking the other just brings the same noise back in two
      months. Both need to be evaluated in the same visit.
  - title: "Door Lock Failures on Front-Loading Machines"
    description: >
      KitchenAid and Bosch front-loaders are common in Hawthorne's
      upper-middle homes, and the door latch assembly on both fails the same
      way — machine locks, won't start, throws an error code. A worn door
      interlock relay or faulty lid switch is usually the culprit. Right part
      on the van, 45-minute fix most of the time.

faq:
  - q: "How fast can you get to Hawthorne for washer repair?"
    a: >
      Service routes through Passaic County run daily. From Route 208 we reach
      most of 07506 in under 30 minutes. Same-day slots fill fast — call
      (323) 870-4790 before noon and a tech is usually there that afternoon.
  - q: "Do you repair Bosch and Samsung washers in Hawthorne?"
    a: >
      Yes — Bosch front-loaders come in regularly with drain pump failures and
      door latch issues. Samsung and LG too, including stacked units in those
      Diamond Bridge Avenue townhomes. KitchenAid as well. Most common parts
      for these brands travel on the van.
  - q: "What does washer repair cost, and do you do same-day calls?"
    a: >
      Flat-rate diagnostic, applied toward the repair if you proceed. Most
      fixes run $150–$350 depending on the part. Evening and emergency slots
      are available — call (323) 870-4790 or schedule online. Urgent calls
      usually get a tech on-site within 2 hours.
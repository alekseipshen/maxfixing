title: "Hawthorne Refrigerator — Hard Water & Aging Housing Stock"

intro: |
  Passaic County tap water is notoriously hard — and inside a refrigerator's ice maker
  assembly or inlet valve, that mineral load shows up within a year. Homes along Goffle
  Road and the older colonials off Memorial Drive run Samsung and LG french-door units
  that shipped with decent water filtration but weren't built for what comes out of
  Hawthorne's municipal supply. The damage is slow, then sudden.

localContext: |
  Much of Hawthorne's housing stock dates to the 1940s through 1960s — compact kitchens,
  tight clearances, refrigerators shoved into spaces that weren't designed for modern
  counter-depth models. In the 07506 zip, we regularly work on units near the Riverside
  Drive area where older GE and Whirlpool side-by-sides have been running for 15-plus
  years. Narrower doorways in these older homes also complicate getting a replacement
  unit in — another reason repair often makes more sense than replacement here.

commonProblems:
  - title: "Mineral deposits blocking ice maker assembly and water inlet valve"
    description: |
      Hard water deposits accumulate inside the ice maker assembly and clog the water
      inlet valve solenoid over time. The unit stops producing ice, or starts dispensing
      cloudy chunks. Samsung's RF-series french-door design is especially vulnerable —
      the fill tube ices over completely when mineral-heavy water refreezes between
      cycles. Flushing the valve and clearing the fill tube usually resolves it without
      replacing the whole assembly.

  - title: "Compressor running nonstop but not holding temperature"
    description: |
      A compressor that cycles constantly without maintaining temp is usually signaling
      a failing condenser fan motor or refrigerant loss. In Hawthorne's older homes,
      condenser coils under the unit go uncleaned for years — dust and pet hair restrict
      airflow until the compressor overheats. Older GE side-by-sides and Whirlpool
      top-freezer models that have been in the same kitchen for a decade are the most
      common offenders.

  - title: "Evaporator coil icing over, warm refrigerator compartment"
    description: |
      Ice accumulating behind the rear freezer panel is almost always a defrost system
      failure — the defrost heater or defrost timer stops cycling, frost builds up, and
      airflow into the fridge section chokes off. KitchenAid and LG models with adaptive
      defrost control boards are common culprits; the board misreads the cycle and
      defrost never kicks in. Fridge side reads 50°F while freezer seems fine.

faq:

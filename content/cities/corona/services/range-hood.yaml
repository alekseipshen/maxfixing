title: "Corona Range Hood Repair — Inland Heat, Heavy Cooking, Real Fixes"

intro: |
  Kitchens in Corona work hard. The 92882 corridor through Chase Ranch and South Corona
  has a lot of households doing serious cooking — high-heat stir fry, weekend carnitas,
  daily use that loads up a hood's baffle filters faster than any manufacturer spec
  anticipates. That KitchenAid chimney hood above a gas range wasn't built for years
  of grease-laden smoke without maintenance, and when the blower wheel finally seizes,
  the whole kitchen fills with smoke before anyone notices it's broken.

localContext: |
  Most of Corona's housing stock in 92882 and 92883 is post-2000 tract construction —
  Shea, KB, Taylor Morrison — with standard 6-inch round duct runs that were often
  undersized for the hood's actual CFM rating. Chase Ranch kitchens tend to be open-plan
  with taller ceilings, which sounds like more airflow, but doesn't help when the duct
  itself is clogged solid. Inland Empire water hardness (some areas test above 400 mg/L)
  also accelerates mineral scaling inside recirculating hoods, restricting the carbon
  filter housing and choking airflow from the inside out.

commonProblems:
  - title: "Blower Motor Burnout from Grease-Saturated Filters"
    description: "When baffle filters go uncleaned for 6-12 months, grease backs up into the
      blower wheel housing. The motor runs hotter, draws more current, and eventually
      the thermal fuse blows — or the motor windings fail entirely. Bosch and KitchenAid
      hoods use brushless DC blower motors that are expensive to replace but usually
      repairable if caught before the windings are damaged. A clogged filter is the
      root cause every time."
  - title: "Duct Restriction Causing Noise and Backdraft"
    description: "Corona's newer tract homes often have duct runs with too many 90-degree
      elbows to fit inside the cabinet stack. Each elbow cuts effective CFM significantly,
      and once grease starts coating the duct interior, the blower wheel has to spin
      harder to push air through — which is when that grinding or rattling starts.
      Samsung's higher-CFM hood models are particularly sensitive to back-pressure and
      will trigger the speed limiter, making the fan sound like it's surging."
  - title: "Control Board and Sensor Failures on Electronic Hoods"
    description: "LG and Bosch hoods with touch controls and auto-sensing modes have
      a moisture sensor near the front panel that can fail after steam exposure — the
      hood either runs constantly or won't turn on at all. The control board itself
      is usually a $90-140 part, not the full assembly. Most of the time that's the
      fix, not a new hood. Call us at (323) 870-4790 before replacing the whole unit."


title: "Corona Cooktop Repair — Inland Heat, Hard Water, Fixed Fast"

intro: |
  Summers along the 91 corridor push Inland Empire kitchens into serious heat, and a
  cooktop with a failing igniter or a cracked ceramic surface stops being an
  inconvenience quickly. Around zip 92880 — the newer subdivisions near Eagle Glen —
  Bosch induction cooktops and KitchenAid five-burners are standard equipment, and
  both take a beating from Corona's mineral-heavy municipal water. Call us at
  (323) 870-4790 and we can usually have a technician there same-day.

localContext: |
  Corona's single-family housing stock across 92880, 92882, and 92883 runs mostly
  1995–2010 tract builds — south-facing neighborhoods where hard water and Inland
  Valley heat do real damage to cooktop components over time. Standard 30-inch and
  36-inch cutouts are the norm in these homes, and that makes cooktop swap access
  cleaner than older LA kitchens. Earlier builds near McKinley Street weren't always
  roughed in for larger formats, so moving from a 30" to a 36" gas unit means checking
  the gas line run and verifying the existing cutout dimensions before pulling anything
  out.

  South Corona off Temescal Canyon Road — Hidden Valley, Dos Lagos adjacent, and the
  streets feeding into 92883 — tends to run Thermador and Bosch induction more than
  the older tracts do. Homes near Green River Road in 92882 skew toward KitchenAid
  and LG. That split matters: induction service requires a different parts inventory
  than gas, and we stock accordingly.

  Corona's water hardness runs around 300–400 ppm depending on the district — one of
  the harder municipal supplies in the region. That accelerates mineral deposits inside
  burner ports, around electrode tips, and inside any water-cooled induction
  components. A cooktop that's two years old can show fouling you'd expect at five
  years in a softer-water area like coastal Orange County. July and August put
  refrigerators and cooktops both under extended load, and that's when deferred
  maintenance shows up as a failed igniter module or a thermal cutout tripping on a
  gas burner.

commonProblems:
  - title: "Igniter clicks constantly but the burner won't catch — mineral-coated spark electrode"
    description: |
      Corona's water tests high in dissolved calcium, and that buildup coats the spark
      electrode tip over time. The igniter module fires, but the electrode can't bridge
      the gap reliably. On KitchenAid and Bosch gas cooktops, clearing the burner cap
      ports and replacing a fouled electrode fixes the problem in a single visit — no
      parts wait, stock is common. If the clicking persists after cleaning, the igniter
      switch itself may be shorting — a $40 part that most homeowners misdiagnose as a
      gas line issue.
  - title: "Cracked ceramic glass on induction or electric cooktops after impact"
    description: |
      A cast iron skillet dropped six inches can spider-crack an induction cooktop's
      ceramic glass even if the induction coil underneath is still working. Samsung and
      LG glass-ceramic tops need exact OEM replacement panels — the sensor grid and
      touch control board calibration are tied to the original glass dimensions. Generic
      aftermarket cuts cause false error codes and dead zones. LG sometimes throws an
      F9 or CE code after impact even without visible cracking — that usually points to
      a sensor lead knocked loose at the ribbon connector, not a failed control board.
  - title: "Burners running low or uneven — thermocouple and gas valve issues on premium units"
    description: |
      Uneven heat on a gas cooktop usually points to a clogged orifice or a warped
      burner cap disrupting the flame pattern. In Sycamore Creek homes where Thermador
      and Wolf cooktops are more common, a degraded thermocouple or partially restricted
      gas valve is the likelier culprit — the igniter lights fine, but output stays stuck
      below what the burner should produce. Wolf dual-fuel units in 92883 occasionally
      develop a weak simmer valve after five or six years; the fix is a valve seat
      replacement, not a full valve swap, which keeps the repair cost reasonable.

faq:
  - q: "How fast can you get to Corona for cooktop repair?"
    a: |
      Routes off the 15/91 interchange put most of 92879 through 92883 within a 90-minute
      window. Evening slots run Tuesday through Saturday. Call (323) 870-4790 to check
      today's availability — same-day bookings are common on weekdays.
  - q: "Do you repair Bosch and KitchenAid cooktops in Corona?"
    a: |
      Yes — those are the two we see most in this area. Bosch induction units throwing
      E-series fault codes, KitchenAid gas cooktops with igniter or burner cap wear.
      Samsung and LG glass-ceramic tops, Thermador gas, and Wolf dual-fuel are all
      in regular rotation too.
  - q: "What does cooktop repair typically cost, and do you charge for the diagnosis?"
    a: |
      The diagnostic fee is $85 and it applies toward the repair total. Most gas cooktop
      fixes — spark electrode, burner cap, gas valve — run $120 to $230 parts included.
      Ceramic glass replacement varies by brand and panel size. Bosch induction panels
      tend to run higher than Samsung or LG because OEM glass sourcing is slower. Schedule
      online or call (323) 870-4790 for a same-day appointment.
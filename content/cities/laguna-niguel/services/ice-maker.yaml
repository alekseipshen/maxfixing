title: "Laguna Niguel Ice Maker Repair — Crown Valley Hard Water Fix"

intro: |
  Homes built along Crown Valley Parkway and Bear Brand Ranch Road through the late 1980s still
  run their original built-in refrigerators — KitchenAid and Sub-Zero units now pushing 30 years.
  The ice maker assembly wears out long before the compressor does. South OC tap water feeding
  92677 tests consistently above 300 mg/L total dissolved solids. That mineral load quietly packs
  calcium scale inside the water inlet valve until ice production drops to nothing — and the only
  symptom is an empty bin with no error code on the display. Laguna Niguel's tap water ranks
  among the hardest in Orange County, which makes routine maintenance more critical here than in
  coastal communities closer to the coast.

localContext: |
  Most of 92677 developed between 1985 and 2005 as master-planned tracts — two-story stucco homes
  with recessed kitchen alcoves built specifically for integrated refrigerator units. Pulling a
  Sub-Zero or Thermador column for service usually means removing trim panels and partially
  clearing the enclosure, which adds real time to the job. The Marina Hills neighborhood in
  Laguna Niguel has a high concentration of these built-in configurations — homeowners here
  invested in premium appliances and expect technicians who actually know the difference between
  a Sub-Zero 700 series and a 600. Condos near Pacific Island Drive tend toward LG and Samsung
  side-by-sides, different failure modes, same hard water problem.

commonProblems:
  - title: "Mineral Scale Seizes the Water Inlet Valve — Ice Stops With No Warning"
    description: |
      Hard water deposits are the number one failure mode in south Orange County. Calcium and
      magnesium accumulate inside the water inlet valve solenoid until the orifice can't pass
      enough flow. KitchenAid french-door models are especially prone here — the valve sits behind
      the lower kick plate in a cramped spot that needs specific tools to reach. Water flow drops
      below the threshold, the unit cycles but produces nothing, and no fault code appears on the
      control board. Laguna Niguel homes built before 2000 rarely have whole-house filtration
      installed, so this repair shows up on our schedule multiple times a week in 92677 alone.

  - title: "Water Line Freezes Inside the Door Panel or Behind the Wall"
    description: |
      A frozen water line is easy to overlook — the refrigerator cools normally, but production
      stops and you might hear a faint hissing when the door seals shut. Usually the cause is a
      thermostat calibrated too cold, or a worn door gasket letting warm humid air in and driving
      freeze-thaw cycles right at the feed line connection. Sub-Zero built-ins in Bear Brand Ranch
      are the most common call we get for this in Laguna Niguel — frequently misdiagnosed as a
      dead ice maker module when the actual fix is far simpler and considerably cheaper.

  - title: "Sensor and Harvest Module Failures on Samsung and LG"
    description: |
      Samsung french-door units — the RF28 series in particular, which shows up in a lot of
      Laguna Niguel homes — will stop cycling entirely when the harvest sensor inside the ice maker
      assembly fails. Test before condemning: sometimes it's just the sensor reading incorrectly,
      not a full mechanical failure. LG's LRMVS column fridges have a near-identical pattern with
      the optical level sensor in the storage bin. Both brands are repairable same-day if the
      part is stocked on the van.

faq:
  - q: "How fast can you get to Laguna Niguel for ice maker repair?"
    a: |
      Usually within 2 hours from when you call. We run daily routes between Irvine and Dana Point
      — Laguna Niguel sits right in the middle of that corridor, and the 73 toll road makes the
      drive from either direction fast. Call (323) 870-4790 or book online. Evening slots are
      available most days.

  - q: "Do you repair Sub-Zero and Thermador units in Laguna Niguel?"
    a: |
      Yes. Sub-Zero built-ins and Thermador column units require specific diagnostic equipment and
      OEM-grade parts — generic substitutes cause calibration problems on these machines. We
      regularly handle Sub-Zero ice maker assembly replacements, Thermador water inlet valves, and
      KitchenAid module jobs throughout 92677. Call before assuming a full unit replacement is
      the only option.

  - q: "What does ice maker repair typically cost in Laguna Niguel?"
    a: |
      Flat diagnostic fee, credited toward the repair. Most water inlet valve and sensor
      replacements run $150–$280 parts and labor combined. Full ice maker module replacement on a
      Sub-Zero or Thermador runs higher depending on part sourcing. Same-day appointments
      available — call (323) 870-4790 and we can usually be there the same day.
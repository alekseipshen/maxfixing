    a: "South OC routes run daily — Crown Valley Parkway corridor through to Aliso Creek Road. Most Laguna Niguel calls get same-day service, usually within 2 hours of your call. Dial (323) 870-4790 and we'll confirm a firm arrival window. Evening slots are available most days."
  - q: "Do you repair Bosch and Sub-Zero units in Laguna Niguel?"
    a: "Bosch, Sub-Zero, and Thermador are the three brands we see most often in Crown Valley and Bear Brand Ranch. Sub-Zero's modular assembly requires proprietary tools — we keep them stocked on the truck, not back at a shop. KitchenAid and Samsung we handle just as regularly. If the display is showing an error code or a blinking cube icon, note it before the call — that alone can cut diagnosis time in half."
  - q: "What does a repair typically cost, and how long does the visit take?"
    a: "Most Laguna Niguel repairs run $150–$350 — fill valve and sensor swaps land on the lower end, full assembly replacements higher. Diagnosis happens on the first visit and we carry common parts for the brands most common in 92677. Evening slots available; call (323) 870-4790 or schedule online for next-day."
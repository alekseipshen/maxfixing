title: "Laguna Niguel Refrigerator — South OC Hard Water Fixes"

intro: |
  The 92677 zip is packed with 1980s and early-'90s master-planned homes where kitchens have been renovated at least once — and that usually means a KitchenAid counter-depth or Sub-Zero built-in sitting on South OC tap water that runs around 250 ppm total dissolved solids. That mineral load quietly packs into ice maker assemblies and water inlet valves for years. By the time the ice stops, the valve is already half-clogged.

localContext: |
  Laguna Niguel was largely built out between 1975 and 1995. Neighborhoods like Niguel Hills and the streets off Crown Valley Parkway have a mix of tract homes and custom builds — some with original appliances, plenty with full kitchen renovations. Addresses in the 92677 area near Aliso Creek Road often have tighter kitchen layouts where pulling a refrigerator for condenser coil access takes an extra 20 minutes and gets factored into the estimate.

commonProblems:
  - title: "Ice Maker Assembly Clogged by Mineral Scale"
    description: "South OC tap water sits around 250 ppm — enough to scale up a water inlet valve within two to three years of steady ice production. Samsung french-door models are especially prone in this area. Most homeowners assume the ice maker assembly failed, but the inlet valve is usually the culprit and costs far less to replace."
  - title: "Condenser Fan Burnout in Garage-Stored Units"
    description: "A lot of secondary fridges in 92677 live in garages that hit 85–90°F by August. The condenser fan motor runs nonstop trying to shed that heat, and the bearings wear out fast. Bosch and LG units in these conditions often throw a temperature alarm before the fan fully seizes — that's your window to call before the compressor takes the load."
  - title: "Compressor Problems in Aging Built-Ins"
    description: "Sub-Zero built-ins installed in early-2000s custom homes around Bear Brand Ranch are now past the 20-year mark. A knocking compressor on these units usually means failed mounts or low refrigerant — not a standard swap. Sub-Zero requires specific refrigerant specs and torque procedures that differ from mass-market units, so generic repair shops often quote it wrong."

faq:

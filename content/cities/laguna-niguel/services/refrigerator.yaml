    a: "Same-day coverage in the 92677 area is standard. Most calls get a tech out within 2 hours. Crown Valley Parkway and Aliso Creek Road are both on the regular South OC route. Call (323) 870-4790 to check today's availability."
  - q: "Do you repair Sub-Zero and KitchenAid refrigerators in Laguna Niguel?"
    a: "Sub-Zero built-ins, KitchenAid counter-depth, and Samsung french-door are the three we see most in this zip. Sub-Zero work needs specific tools and refrigerant specs — we carry both. LG and Bosch units are also common here and common parts ship same-day."
  - q: "What does a refrigerator diagnosis cost, and do you give a price before starting work?"
    a: "Diagnosis happens on-site and the price is quoted before anything gets touched. Most repairs run $150–$350 depending on the part. Door gaskets, defrost timers, and water inlet valves usually ride in the van, so same-day repair is typical for standard jobs. Evening slots are available if daytime doesn't work."


      Call (323) 870-4790 or schedule online — we'll confirm the window when you reach us."

  - q: "Do you repair Bosch and Thermador range hoods in Laguna Niguel?"
    a: "Both are common in this area. Bosch hood calls typically involve the electronic
      control board or a failed inlet damper motor — both are serviceable parts, not
      unit replacements. Thermador and Wolf issues tend to be blower wheel wear or a
      capacitor failure after extended high-heat cooking. Parts for both brands are stocked
      on the van and most repairs complete same day."

  - q: "What does range hood repair cost, and is emergency service available in Laguna Niguel?"
    a: "Service call is a flat diagnostic fee — full repair cost confirmed before any work

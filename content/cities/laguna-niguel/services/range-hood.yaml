title: "Laguna Niguel Range Hood — 30-Year-Old Built-Ins Failing Fast in 92677"

intro: |
  Planned communities built along Crown Valley Parkway through the late 1980s and early
  90s put nearly identical KitchenAid wall-mount hoods above practically every gas range
  in 92677. Those units are now 30-plus years old — blower motors, grease filter housings,
  and backdraft dampers are starting to fail in clusters across the neighborhood. Southern
  California's hard water accelerates the timeline: mineral deposits form on the filter
  mesh year-round, bonding with grease into a coating that standard cleaning won't touch.
  By the time smoke pools above the cooktop instead of exhausting outside, the restriction
  is usually already significant.

localContext: |
  Beacon Hill and Marina Hills homes were built between 1985 and 1998, most with duct
  chases routed through interior walls before exiting through the roofline — not the most
  direct path. In zip code 92677, that routing typically means 14–18 feet of ductwork
  and two or three 90-degree elbows before air reaches outside. Remodeled kitchens in
  Laguna Niguel frequently upgraded to island-style or flush-ceiling inserts over the past
  decade. Both configurations require partial cabinet removal to access the blower wheel
  assembly, which adds an hour or more to the service window and should factor into the
  estimate before you book.

commonProblems:
  - title: "Blower Motor Bearing Failure in Late-80s KitchenAid Hood Units"
    description: "The squirrel-cage blower motors in 1987–1995 KitchenAid wall-mount hoods
      were solid — until cooking grease migrated through the shaft seal into the motor
      housing and dried out the bearing assembly. First sign is grinding on startup. Then
      fan speed drops during cooking. Then airflow stops entirely and smoke backs up into
      the kitchen. Replacing the motor alone — without pulling the whole hood — typically
      costs $150–280 in parts and spares a full cabinet repaint job."

  - title: "Hard Water Scale Locking Up the Aluminum Grease Filter Mesh"
    description: "Laguna Niguel municipal water carries elevated calcium carbonate levels
      year-round. Cooking steam deposits those minerals directly onto the aluminum mesh
      grease filter, where they bond with grease residue and cure into a hard, lacquer-like
      coating that a dishwasher cycle won't dissolve. Most homeowners assume the filter
      is just dirty — it's actually scaled solid and restricting 40–60% of airflow through
      the blower housing. Citric acid soaks help with mild buildup; heavily blocked filters
      need full replacement."

  - title: "Undersized Duct Runs Wearing Out Thermador and Wolf Blower Wheels"
    description: "Thermador and Wolf hoods installed during 92677 kitchen remodels routinely
      push 600–900 CFM through duct runs originally sized for a 350 CFM builder-grade
      unit. Six-inch oval duct can't move that volume — backpressure builds at every elbow
      joint, grease pools at the low spots, and the blower wheel wears down faster than
      the motor was rated for. Upsizing to 8-inch round duct at the first elbow, combined
      with a blower wheel swap, usually resolves it permanently."


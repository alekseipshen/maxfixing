title: "Laguna Niguel Dryer — Same-Day Repair in 92677"

intro: |
  Crown Valley Parkway corridor homes run a lot of LG and Samsung laundry pairs — and
  that LG not heating mid-load almost always traces back to a thermal fuse that cooked
  itself trying to push air through a packed exhaust vent. These 1980s and early-90s
  planned-community builds have duct runs longer than most people expect. Lint accumulates
  quietly until the dryer runs too hot to survive it. That failure pattern accounts for
  roughly two-thirds of the no-heat calls we get in this zip.

localContext: |
  Most of Laguna Niguel was developed between 1975 and 1995 as master-planned tracts —
  Bear Brand Ranch, Marina Hills, Beacon Hill — with laundry rooms tucked in hallways
  or behind louvered doors. Vent paths in these layouts frequently run 15–20 feet before
  hitting an exterior wall. Zip 92677 sits far enough inland that summer heat pushes dryers
  harder than coastal neighbors. Bear Brand homes with gas dryers and long duct routes are
  exactly where blower wheel strain shows up first.

commonProblems:
  - title: "Thermal fuse failures from long, partially blocked vent runs"
    description: "Marina Hills and Beacon Hill floor plans trap lint at every elbow in the
      exhaust duct. The heating element keeps cycling, airflow drops, internal temps spike,
      and the thermal fuse blows. It's a quick fix — but the duct needs cleaning at the
      same time, or that fuse is gone again in three months."
  - title: "Drum stops turning — worn drive belt or seized drum rollers"
    description: "KitchenAid and Bosch condensing dryers in 92677 take heavy regular loads.
      When the drum stops turning but the motor still hums, a snapped drive belt or cracked
      drum roller is usually responsible. Bosch drum roller assemblies in particular tend to
      flatten after five to seven years, causing loud thumping before full seizure."
  - title: "Gas dryer won't ignite on the first attempt"
    description: "A lot of homes here run gas dryers, and a weakening gas valve igniter is
      the most common reason a Samsung or LG gas unit lights on the second try but not the
      first. The coil loses heat output over time — it glows but can't hold the temperature
      needed to open the valve consistently. Intermittent ignition is worth fixing fast."


title: "Compton Dryer Repair — Gas Units, Tight Vents, Same Day"

intro: |
  Hard stops in 90220 usually aren't the motor — it's a blown thermal fuse from
  airflow that's been choking out for months. Tract homes off Willowbrook Avenue
  were built in the late 1950s with vent runs that turn three or four corners
  before hitting the exterior wall. That Samsung electric unit sitting in a
  converted garage is working twice as hard as it should. Call (323) 870-4790
  and we're typically out the same day.

localContext: |
  Most of the housing stock in 90220 and 90221 was built between 1950 and 1970 —
  single-family homes with laundry tucked into garages or added-on service
  porches where vent clearance is tight. Short, kinked flex ducts are standard
  in these layouts.

  Zip code 90222, north of Rosecrans Avenue toward the Compton Creek corridor,
  has a higher share of duplexes and small apartment buildings where stacked
  units share a single exhaust path. Lint accumulates across both floors
  simultaneously. Residents on Wilmington Avenue and Central Avenue call us
  regularly for thermal fuse replacements that trace back to shared-duct
  configurations nobody has cleaned in years.

  The 91 and 710 freeways run diesel trucks around the clock through the eastern
  and northern edges of Compton. That constant vibration shakes drum rollers
  loose faster in homes near Long Beach Boulevard — it's something we notice
  when the thumping starts well before the typical mileage on LG front-loaders.
  Probably not a coincidence.

  Income here runs middle-range — households mix five-year-old Samsung and LG
  units with decade-old Whirlpool and GE machines that were bought new and
  never serviced. The older Whirlpool gas dryers on 240V circuits in these
  garages are still repairable; parts availability is good. The LG WM and DLGX
  series that replaced them have more board complexity but are still worth fixing
  at the repair-versus-replace math that applies at this price point.

commonProblems:
  - title: "Thermal Fuse Failures from Blocked Exhaust Vents"
    description: "The thermal fuse on most GE and Whirlpool dryers sits inline
      with the heating element and trips around 250°F — a temperature that's
      easy to hit when the exhaust vent is partially blocked. In Compton's older
      garages, accordion-style flex duct gets crushed against walls or kinked at
      corners. Once the fuse blows, the drum still spins but produces zero heat.
      Replacing the fuse without clearing the vent just means it blows again in
      a few weeks."
  - title: "Drum Roller Wear on High-Use LG Front-Loaders"
    description: "That rhythmic thumping mid-cycle is almost always worn drum
      rollers, not a belt issue. LG front-loaders go through rollers faster when
      lint bypasses the filter and settles on the axles. The noise starts as a
      low squeak, then turns into a grinding thud. Replacing the full roller set
      — usually four — fixes it cleanly without needing to pull the blower wheel
      or belt tensioner."
  - title: "Gas Valve Coil Failures in Samsung Gas Dryers"
    description: "Samsung gas dryers where the igniter glows but won't sustain
      flame usually have a failed gas valve coil, not the igniter itself. The
      coils are cheap parts but get misdiagnosed constantly. If the unit lights
      for 30 seconds then cuts out repeatedly, the coil pack is almost certainly
      the problem. A full igniter-and-coil swap runs about 45 minutes on most
      Samsung gas models."

faq:
  - q: "How fast can you get to Compton for dryer repair?"
    a: "Routes from the South Bay run through Compton daily — from Torrance or
      Hawthorne we're usually there within 90 minutes. Call (323) 870-4790 to
      check morning availability. Evening slots are open Tuesday through
      Saturday, and same-day booking is usually possible before noon."
  - q: "Do you repair Samsung and LG dryers in Compton?"
    a: "Samsung and LG are probably half of what we see in 90220 and 90221.
      Common jobs: drum bearing noise on LG, heating element burnout on Samsung
      electrics, gas valve coil replacement on Samsung gas units. Parts for both
      brands are stocked on the van."
  - q: "What does dryer repair cost, and is there a diagnostic fee?"
    a: "Diagnostic is $65, credited toward the repair if you move forward. Most
      heating element and thermal fuse jobs land between $120 and $190 parts and
      labor. Same-day service is available — call (323) 870-4790 or schedule

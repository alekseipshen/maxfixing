title: "Compton Refrigerator — South Bay Heat Wrecks Compressors Fast"

intro: |
  Summer temps in Compton regularly hit 95°F, and that turns a borderline compressor problem into a full breakdown by August. The postwar ranch homes around 90220 weren't designed for modern Samsung french-door units running double-duty in a hot, tight kitchen. If your fridge is struggling — warm shelves, loud cycling, water under the crisper — call (323) 870-4790. We're usually in Compton within 2 hours.

localContext: |
  Most of the housing stock in 90221 and 90222 dates from the 1950s-60s construction boom — compact kitchens, appliances wedged between cabinets and walls, not much clearance behind the unit. Getting to the condenser coils means real disassembly. Older GE side-by-sides from the late 90s are still running in plenty of these homes, and in some apartment buildings near Compton Creek, the electrical setups haven't been updated since the original build.

commonProblems:
  - title: "Compressor Cycling Out From Extreme Summer Heat"
    description: "Ambient heat above 90°F forces the compressor to run nearly nonstop — especially on Whirlpool and GE units over 10 years old. Clogged condenser coils make the problem worse. A unit that starts short-cycling in July is a compressor failure waiting to happen by September. Clean coils and a pressure test catch this early."
  - title: "Ice Maker Assembly Failing From LA Hard Water"
    description: "Municipal water in 90220 is genuinely hard — calcium deposits clog the water inlet valve and freeze up the fill tube inside the ice maker assembly. Samsung french-door models are the worst offenders. The fix is usually a new inlet valve plus a fill tube defrost, running $150-200 if caught before the auger motor seizes."
  - title: "Evaporator Coil Ice Buildup — Warm Fridge, Normal Freezer"
    description: "A failed defrost thermostat or bad defrost timer lets ice accumulate on the evaporator coil until airflow to the fresh food section stops completely. LG bottom-freezer units show this pattern constantly. The symptom is obvious: freezer stays cold, everything above 40°F in the fridge. Usually a defrost thermostat swap and manual defrost cycle fixes it."

faq:
  - q: "How fast can you get to Compton for refrigerator repair?"
    a: "South Bay is a daily route for us — Long Beach, Compton, Inglewood, same circuit. Calls in 90220-90222 before noon usually get a same-day afternoon slot. Evening appointments also available. Call (323) 870-4790 or schedule online to lock in a time."
  - q: "Do you work on Samsung and LG refrigerators specifically?"
    a: "Samsung and LG are the two brands we see most in Compton. Samsung: ice maker assembly failures, water inlet valves, door gasket replacements. LG: linear compressor issues (the class-action models), evaporator fan failures. We stock common parts for both, which cuts turnaround time significantly."
  - q: "What does refrigerator repair typically cost in Compton?"
    a: "Diagnostic is $85 and applies toward the repair. Door gasket: $120-150. Defrost thermostat: $95-130. Compressor replacement on a Whirlpool or GE runs $350-500. For food-at-risk emergencies, same-day slots are available — call (323) 870-4790 and we'll prioritize."

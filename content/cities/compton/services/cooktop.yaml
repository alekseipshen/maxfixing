title: "Compton Cooktop Repair — Gas Lines & Hard Water Since the '50s"

intro: |
  Richland Farms sits dead-center in Compton — ranch homes, horses, and kitchens
  that haven't seen a remodel since Eisenhower was president. Those original gas
  lines running through 90221 can drop pressure unpredictably, and a GE gas
  cooktop starts misfiring long before anything else on the stove gives out.
  Mineral buildup from Compton's notoriously hard tap water chokes burner ports
  on Samsung and LG units too — even relatively new ones. Compton sits in one
  of the harder water zones in LA County, regularly testing above 300 mg/L
  total dissolved solids. That number matters when you're trying to figure out
  why a two-year-old KitchenAid cooktop is already misfiring.

localContext: |
  Most of the housing stock in the 90220 and 90222 zip codes dates to the 1940s
  through 1960s. Kitchens in those homes were built around basic four-burner
  ranges, not slide-in Bosch or KitchenAid cooktops homeowners drop in during
  renovations. Counter cutouts run narrow, gas connections sit low, and on some
  of the tighter residential blocks near Central Compton, parking a service van
  requires a quick call ahead.

  East Compton — the stretch running toward the 710 corridor near Oleander Avenue —
  has a mix of original single-family homes and 1970s duplexes. Kitchens in the
  duplexes run small. Getting a cooktop out of a tight counter cutout in one of
  those units means removing adjacent drawers first. We've done it enough times to
  know which blocks on Willowbrook Ave have the narrowest driveways.

  The blocks closest to Compton College on Artesia Blvd tend to have more recent
  appliance upgrades — landlords dropping in mid-range Samsung or LG glass-tops
  to attract tenants. Further south toward Alondra, near the Compton Airport area,
  the homes skew older and so do the appliances. Whirlpool and GE gas ranges from
  the '90s are still running in plenty of those kitchens. Old doesn't mean
  unrepairable — it usually means worn igniter electrodes and corroded gas valve
  orifices, both straightforward fixes.

  The Sunny Cove neighborhood off South Central Ave falls under the 90221 zip.
  Homes there were mostly built in the 1950s, and a lot still have the original
  gas supply lines. Pressure inconsistency is real — enough to cause intermittent
  flame-outs on a burner that tests fine on its own but drops out under load.

  The pocket of single-family homes around Acacia Ave and West Compton Blvd —
  just north of the Compton Courthouse — is one of the quieter residential
  stretches in the 90220 zip. Lot sizes are larger there, houses are mostly
  post-WWII construction, and a fair number still have the original cast-iron
  gas manifolds feeding the kitchen. Remodels in these homes often drop a Bosch
  or KitchenAid slide-in into a counter that was cut for a freestanding range,
  which means the gas stub-out ends up an inch off-center. Not a problem until
  the flex connector fatigues and starts leaking at the fitting — something we
  check on every gas cooktop call in this part of Compton.

commonProblems:
  - title: "Burner Won't Light — Spark Igniter Choked by Mineral Scale"
    description: "Compton's water tests high for calcium and magnesium. That scale coats
      the spark igniter electrode and the burner ports over time, blocking the
      entire spark path. On GE and Whirlpool gas cooktops — common in the older
      90220 and 90222 homes off Wilmington Ave — the spark module keeps clicking
      without ever catching. Classic blocked igniter, not a gas supply problem.
      A thorough port cleaning plus igniter swap usually fixes it in one visit.
      On Samsung gas cooktops, the SE error code sometimes appears alongside
      igniter failure — the control board detects an open circuit at the electrode
      and throws the fault before the burner even tries to light."
  - title: "Cracked Ceramic Glass Surface After Thermal Shock"
    description: "Samsung glass-top cooktops crack more often here in summer. Setting a
      cold pan on a hot surface element — or putting a wet pot on a still-hot
      burner zone — causes thermal stress fractures that radiate outward from the
      element center. The surface element itself may still function, but a cracked
      glass top is a safety hazard and can't wait. On LG smooth-top models common
      in the rental duplexes near Compton College, the F9 or TE error codes appear
      after a crack — the thermistor under the glass loses contact and the board
      can't read surface temp correctly. Glass replacement on these units is a
      same-day job when we have the panel in stock."
  - title: "One Burner Running Weak or Throwing Uneven Flame"
    description: "On LG and KitchenAid gas models, a partially clogged burner cap
      produces a lopsided flame — full heat on one side, barely a flicker on the
      other. Cleaning the ports helps short-term. But if the gas valve orifice
      has corroded inside, no amount of cleaning gets it right — the valve itself
      needs to come out and get replaced. In older homes around 90220 with aging
      flex connectors, low gas pressure compounds the problem. Richland Farms
      properties with original 1950s iron supply lines are especially prone to
      this — pressure at the manifold can run noticeably lower than the street
      supply. Always worth checking supply pressure at the manifold before
      condemning the valve."

faq:
  - q: "How fast can you get to Compton for cooktop repair?"
    a: "Running the 91 and 710 corridors daily puts Compton 20-30 minutes from our
      South Bay base. Same-day appointments are open most weekdays. Call
      (323) 870-4790 and we can usually get there within 2 hours of your call."
  - q: "Do you repair Samsung and LG cooktops in Compton?"
    a: "Both are bread-and-butter for us here. Samsung glass-top units typically need
      surface element or control board work. LG gas cooktops come in mostly with
      igniter failure or burner cap issues. Bosch and GE are common too — we
      carry parts for all four."
  - q: "What does a cooktop repair visit actually cost?"
    a: "Diagnosis is flat-rate. The tech checks the spark module, burner cap, gas
      valve, and igniter before quoting parts — no surprise add-ons. Most repairs
      land between $120 and $280. Evening and emergency slots are available;
      call (323) 870-4790 to lock in a time."
  - q: "Can you work on older gas cooktops in Compton's vintage homes?"
    a: "That's most of what we see in 90221 and 90220. A Whirlpool or GE gas cooktop
      from 1998 is usually worth repairing — burner valves, igniter switches, and
      spark modules are still available for most models from that era. The one
      exception is when the gas manifold itself has corroded through; at that
      point replacement makes more sense. The older blocks in Sunny Cove and
      near Compton Courthouse hit this more than anywhere else in the city —
      original plumbing, decades of hard water, and no remodel since the '70s.
      We'll tell you straight which way it goes after the diagnosis. Schedule a
      same-day visit at (323) 870-4790."
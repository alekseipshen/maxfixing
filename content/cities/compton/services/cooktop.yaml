title: "Compton Cooktop Repair — Gas & Electric, Same-Day 90220"

intro: |
  Kitchens in 90220 and 90221 tend to be compact — built for basic four-burner
  ranges back in the '60s and '70s, then upgraded over the decades as families
  swapped in Samsung gas slide-ins or LG electric cooktops. Those upgrades hold
  up for years. Then one morning a burner won't click, or a cast iron skillet
  cracks the ceramic surface, and the whole cooktop's out of commission. We run
  service routes through Compton regularly and can usually be there the same day.

localContext: |
  The residential blocks around Richland Farms — the horse-property neighborhood
  in southeast Compton near Central Avenue and Oleander Street — have larger lot
  kitchens, but even those were plumbed with 1970s gas infrastructure that wasn't
  designed for modern five-burner cooktops. Farther north in the 90222 zip, the
  mid-1950s tract homes along Myrrh Street and Oris Street still have original
  3/4-inch gas supply lines that occasionally cause pressure issues with high-BTU
  burners. Most of the housing stock across 90220, 90221, and 90222 is 50 to 70
  years old, and that age shows up in how appliances wear.

  Along the Compton Blvd and Long Beach Blvd corridors, you'll find a lot of
  duplexes and multi-unit conversions — landlord-grade GE or Whirlpool cooktops
  that get heavy use and minimal maintenance until something breaks. The 90221
  pocket near Compton Creek and the Martin Luther King Jr. Recreation Center has
  a mix of single-family homes from the '40s and newer infill construction from
  the 2010s. Those newer builds sometimes have induction cooktops — Bosch and
  KitchenAid mostly — that need a completely different diagnostic approach than
  the older gas units a block away.

  Down toward Greenleaf Boulevard near the Compton Airport, the housing shifts to
  slightly larger postwar ranch-styles. Gas cooktops there tend to be mid-range
  Samsung or Whirlpool installs from the early 2000s — old enough now that igniter
  modules and gas valves are starting to fail. LA's notoriously hard water also
  plays into it: mineral deposits clog burner ports and scale up the inside of any
  steam vent on electric units faster here than in coastal zip codes like 90277
  or 90266.

commonProblems:
  - title: "Gas Burner Won't Light — Usually the Spark Igniter or Burner Cap"
    description: "A burner that clicks constantly but never flames usually has a
      cracked ceramic spark igniter, or a clogged burner cap blocking the electrode
      gap. Samsung gas cooktops are especially prone to this after boilovers coat
      the igniter in burned residue. Cleaning the burner cap fixes it sometimes —
      but if the igniter itself is cracked or corroded, it needs to be swapped out."
  - title: "Cracked Ceramic Glass After Impact — Common on GE and KitchenAid Units"
    description: "Dropping a heavy pot on a glass-ceramic surface cracks it straight
      through. Beyond cosmetics, a cracked surface lets grease and liquid reach the
      heating element underneath, which creates a short-circuit risk. GE and
      KitchenAid both use model-specific glass panels — we stock the most common
      sizes and can usually source others within a day or two without a second visit.
      In the older Compton homes with tight galley kitchens, we also check the
      mounting brackets and trim ring while the glass is out — those corrode fast
      in kitchens that run hot year-round."
  - title: "Uneven Heat Across Burners — Often a Thermocouple or Orifice Problem"
    description: "One burner running much hotter or weaker than the others usually
      points to a worn thermocouple misreading flame temperature, or a partially
      blocked burner orifice restricting gas flow. Whirlpool gas cooktops from the
      2005–2015 range see this regularly after years of heavy use. Hard water
      mineral buildup inside the orifice is common in Compton and the broader South
      Bay — a partially blocked orifice looks identical to a bad gas valve until
      you pull it and inspect. If the gas valve itself is failing, that's a more
      involved repair — but still fixable without replacing the whole unit."

faq:
  - q: "How fast can you get to Compton for cooktop repair?"
    a: "Most calls in the 90220 and 90221 area get a tech out within 2 hours. We
      route through the 710 and 91 corridors from adjacent service zones. Call
      (323) 870-4790 to check same-day availability — Saturday mornings usually
      have open slots, and weekday evenings can work too."
  - q: "Do you repair Samsung and LG cooktops in Compton?"
    a: "Yes — both are among the most common brands we see here. Samsung gas models
      frequently need spark module or burner cap work; LG induction units sometimes
      throw fault codes tied to the control board or surface sensor. We also
      service Bosch and GE cooktops regularly throughout this area."
  - q: "What does a cooktop repair cost, and how does the visit work?"
    a: "Diagnostic fee is $75, credited toward the repair if you approve the work.
      Parts vary — a spark igniter runs $40–90, a replacement ceramic glass surface
      is $150–350 depending on the model. Same-day emergency slots are available.
      Most cooktop repairs finish in one visit, no return trip needed."
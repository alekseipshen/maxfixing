title: "Lakewood Ice Maker Repair — 1950s Homes, Hard Water, Same Day"

intro: |
  Stamped out of orange groves in under three years, Lakewood became one of
  America's first mass-produced suburbs — and those 1953 ranch-style kitchens
  on streets like Hayter Avenue have been quietly upgraded ever since. Today
  most of them run LG French-door refrigerators or KitchenAid counter-depth
  units. LA County water feeding 90712 and 90713 tests 200–240 ppm dissolved
  solids. That mineral load is slow and invisible — until the ice stops.
  Bosch counter-depth models — increasingly common in the remodeled kitchens
  south of Del Amo Boulevard — add another wrinkle: their ice makers run
  through a separate module that sits deeper in the freezer cavity than most
  techs expect, so a simple inlet valve swap often isn't the whole job.

localContext: |
  Single-story ranch homes dominate the 90712 and 90713 zip codes. Kitchen
  access is generally clean — no parking nightmares like Santa Monica, no
  narrow hallways like older Long Beach apartments. That changes in remodeled
  homes near Heartwell Park, where Sub-Zero and Thermador column units show up
  flush-mounted behind custom cabinet panels. Reaching the ice maker assembly
  on those installs requires panel removal before any diagnosis begins.
  We carry the tools for it — many techs don't bother. The newer construction
  along South Street near the 91 freeway corridor skews toward Samsung and
  Bosch installations — tighter refrigerators with different access angles,
  but straightforward once you know the model series.

commonProblems:
  - title: "Mineral Scale Throttling the Water Inlet Valve"
    description: |
      LA County supply through 90712 consistently tests above 200 ppm. Calcium
      deposits accumulate inside the water inlet valve over two to four years,
      cutting flow until cubes come out hollow or undersized. On LG refrigerators
      this triggers the AE error code. Samsung French-door models throw 1F or 14E.
      Swapping the valve solves the immediate failure; we also flush the fill line
      and inspect the full ice maker assembly for downstream buildup before leaving.
      LG's dual ice maker units — the ones with both an upper and lower assembly —
      tend to show scale failure in the upper maker first. Homeowners keep getting
      some ice from the lower unit and don't realize how long the problem has
      been building. Catching it at the upper assembly usually saves the lower
      inlet valve from the same fate.

  - title: "Frozen Fill Tube After Cold January Nights"
    description: |
      Lakewood rarely freezes, but a refrigerator calibrated a degree too cold
      paired with a 40-degree night can ice up the fill tube completely. Water
      left sitting in the tube after the inlet valve closes has nowhere to go.
      Thawing is quick. Staying fixed takes longer — we check the defrost timer
      and thermostat calibration every time, because if either is off, the tube
      refreezes within the week and you're calling again. LG's LRFX-series
      models are particularly prone to this: the fill tube position creates a
      warm-air pocket that other designs don't have, and the freeze risk runs
      higher than you'd expect for a Southern California refrigerator. A
      misreading defrost heater is usually the root cause on those units.

  - title: "Optical Sensor Failure on KitchenAid and Samsung Models"
    description: |
      KitchenAid counter-depth refrigerators and Samsung French-door units —
      both common in Lakewood's higher-income blocks — use an optical sensor to
      detect a full ice bin. When frost coats the sensor or the sensor module
      fails outright, two opposite things happen: the ice maker either runs
      nonstop and jams the auger motor, or shuts off entirely and won't cycle
      even after a manual reset. KitchenAid's built-in diagnostic mode — hold
      the door switch and water dispenser simultaneously — pulls a service code
      that identifies whether the sensor, module, or control board is the actual
      failure point. That step alone prevents swapping the wrong part.
      OEM boards only on these platforms. Aftermarket sensor modules fail fast
      and we've stopped stocking them.

faq:
  - q: "How fast can you get to Lakewood for ice maker repair?"
    a: |
      Usually 90 minutes or less to the 90712–90715 area. The 605 cuts straight
      through and Carson Street gives clean east-west access from both sides.
      Same-day slots are open most mornings — call (323) 870-4790 to check
      availability, or book an evening appointment online.

  - q: "Do you repair LG and Samsung ice maker systems specifically?"
    a: |
      Yes — these are the most common calls we get in this part of LA County.
      LG's dual ice maker assembly and Samsung's ice room design have well-known
      failure patterns: inlet valve clogs, auger motor failures, sensor board
      shorts. Common OEM parts ride on the truck, and most repairs close on
      the first visit. LG's dual-maker setup fails in sequence — upper assembly
      first, lower following months later — so catching it early avoids a
      second service call.

  - q: "What does ice maker repair cost, and can I get same-day service?"
    a: |
      Most repairs fall between $150 and $350. A clogged water inlet valve sits
      toward the lower end; replacing a full ice maker assembly runs higher.
      Sub-Zero ice maker modules typically run $300–$500 because of OEM part
      costs and the access time required inside a built-in cabinet installation.
      If your unit has stopped entirely or you're seeing water pooling at the
      base, don't wait — call (323) 870-4790 today. Evening slots available
      most weekdays in 90712 and 90713.
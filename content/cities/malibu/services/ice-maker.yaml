title: "Malibu Ice Maker — Sub-Zero & Built-In Units, 90265"

intro: |
  Point Dume estates and the canyon homes off Malibu Canyon Road both draw from Las Virgenes
  Municipal Water District — water hard enough to calcify a fill valve in under a year. That
  Sub-Zero integrated column looks pristine right up until it stops making ice and the display
  panel offers nothing useful.

  Malibu runs about 27 miles of coastline with almost no flat land. The kitchens up Encinal
  Canyon or Decker Canyon sit at elevations where temperature swings are steeper than down on
  PCH — and those swings stress refrigeration components in ways that beach-level homes don't
  see as often. Two technicians cover the corridor from Zuma Beach down to the 23 junction.
  Call (323) 870-4790 to check same-day availability.

localContext: |
  Zip 90265 spans a wide range: Carbon Beach compounds, Malibu Colony bungalows renovated in
  the 1980s and 90s, newer ridge-top builds above Latigo Canyon Road. Older beach-adjacent
  kitchens often have tight layouts and aging plumbing runs that complicate access for service work.

  Newer Malibu construction leans heavily on panel-ready Sub-Zero and Thermador columns set into
  custom millwork — units requiring careful removal technique to avoid damaging surrounding
  cabinetry. A mishandled extraction can crack a door panel or strip hinge hardware, and on a
  $6,000-$10,000 column refrigerator that's not a mistake anyone wants.

  The Colony and Serra Retreat properties frequently have secondary outdoor kitchens with separate
  under-counter units — usually a KitchenAid or a standalone Scotsman — exposed to salt air and
  temperature variance that accelerates component wear faster than any inland zip code we cover.
  Salt corrodes solenoid valve contacts. It fouls drain pump impellers. Malibu outdoor units need
  a different inspection checklist than a Bosch tucked into a West Hollywood condo.

commonProblems:
  - title: "Frozen fill tubes in glass-heavy beachfront kitchens"
    description: |
      Temperature swings hit hard in open-plan PCH homes — the fill tube ices over inside the
      housing and the unit stops cycling entirely. Sub-Zero routes its internal water line behind
      the liner, so clearing a freeze requires disassembly, not just a reset.

      Carbon Beach and Serra Retreat properties are where we see this most often, particularly
      after overnight cold snaps in winter. The fix is straightforward once you're inside — but
      getting there on a built-in column without scratching the millwork takes patience.
      Malibu service calls for this failure usually run 60-90 minutes on-site.

  - title: "Water inlet valve restricted by LVMWD mineral buildup"
    description: |
      Las Virgenes water tests around 340-360 ppm TDS — aggressive enough to restrict a water
      inlet valve within 12-18 months of regular use. Thermador and Wolf integrated refrigerators
      show this as progressively slower fill cycles before production stops entirely.

      Swapping the valve and flushing the supply line typically closes the job in a single visit.
      Malibu homeowners who've had the valve replaced once often ask about inline filters —
      worth considering if your unit needed a second valve in less than two years. We stock
      OEM-spec valves for Sub-Zero and Thermador in the van, so most 90265 calls don't need
      a parts-order delay.

  - title: "Optical sensor failure in Miele and Sub-Zero column freezers"
    description: |
      Miele's module uses an optical ice level sensor that fogs with mineral film over time —
      the unit reads the bin as full when it's nearly empty, so it never triggers a new cycle.
      The fault doesn't always surface as a readable error code.

      Cleaning or replacing the sensor restores full production without pulling the column from
      the cabinetry. On Sub-Zero integrated models, the harvest arm sensor also mis-calibrates
      after power fluctuations — Malibu's grid gets hit by wind events often enough that this
      shows up more in 90265 than in any inland area we service. If your Sub-Zero is cycling
      but dropping undersized cubes, that's usually the harvest arm position, not the
      fill valve.

faq:
  - q: "How fast can you get to Malibu for an ice maker call?"
    a: "PCH congestion is a real variable, so we schedule Malibu calls in morning slots when
      heading up from Santa Monica. Most 90265 calls get same-day or next-morning service.
      Call (323) 870-4790 to check today's openings — emergency and evening slots do come
      available."

  - q: "Do you service Sub-Zero and Thermador units out here?"
    a: "Yes — Sub-Zero and Thermador make up the majority of calls we handle in 90265. We also
      work on Wolf, Miele, and KitchenAid built-ins. Common fixes include fill valve
      replacements, full assembly swaps, and optical sensor cleaning on Sub-Zero integrated
      columns. Parts for these brands travel in the van."

  - q: "What does a diagnostic and repair typically cost?"
    a: "Diagnostic visit is $85, credited toward the repair if you proceed. Most jobs close in
      one trip — valve and sensor work runs $150-$280 parts and labor combined. Frozen fill
      tube calls usually resolve same-visit. Book at (323) 870-4790; morning slots fill fast
      once summer heat hits and units start working overtime."

  - q: "What about units in outdoor kitchens or cabanas?"
    a: "Salt air off the Pacific accelerates corrosion on condenser components and water inlet
      solenoids faster than anything we see inland. Outdoor Malibu kitchens — especially those
      in the Colony or on the bluff above Broad Beach Road — put extra stress on seals and
      electrical connections. We check the solenoid valve and drain pump closely on first visit
      and bring a corrosion inhibitor treatment for outdoor installs."
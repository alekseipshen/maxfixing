title: "Malibu Ice Maker — Hard Water Scale & Luxury Built-In Repairs"

intro: |
  Point Dume estates and the Malibu Colony homes strung along Pacific Coast Highway keep
  Sub-Zero integrated refrigerators running year-round — and the LA municipal water supply
  works against that constantly. Mineral deposits accumulate inside the fill valve and ice
  maker assembly faster than most homeowners expect, especially with coastal humidity
  compounding the buildup. Most no-ice calls from 90265 trace back to either scale in the
  water inlet valve or a failed sensor — both fixable same-day. Salt air here corrodes
  wiring connectors in ways you just don't see in Burbank or Glendale. Malibu's combination
  of hard water and ocean exposure is genuinely one of the worst environments for these units.

localContext: |
  Malibu's housing runs the full spectrum: 1960s beach cottages along Malibu Road, contemporary
  glass-and-steel builds above PCH, and gated estates in the Colony with panel-ready Thermador
  and Viking refrigerators recessed flush into custom cabinetry. Getting to the ice maker module
  in those built-in units means removing cabinet panels first, not just rolling the fridge out.
  Zip code 90265 covers the whole coastal stretch, and the salt air corrodes sensor wiring
  and water inlet valve fittings faster than anything we see inland. A lot of newer Malibu
  construction along Kanan Dume Road has gone with Bosch or KitchenAid column refrigerators —
  more accessible than true built-ins, but still a tight fit when pulling the unit for a drain
  inspection. Parking a service van on PCH during midday hours adds 20-30 minutes to every
  call; early-morning slots work best. For Malibu addresses we prioritize morning dispatch.

commonProblems:
  - title: "Fill Valve Choked by Mineral Scale"
    description: "LA water is genuinely hard, and in Malibu Colony homes with Sub-Zero built-ins,
      calcium carbonate narrows the water inlet valve orifice over 18-24 months of unfiltered use.
      Flow drops below the threshold needed to fill the ice mold, so you get undersized cubes first,
      then nothing. Descaling sometimes restores flow on newer valves, but a pitted valve seat
      usually means full replacement. Swapping the fill valve resolves it in under an hour,
      and we stock common Sub-Zero and Thermador valve specs on the truck. No waiting on a
      parts order for the most common Malibu failure."

  - title: "Ice Level Sensor Misreading the Bin Fill"
    description: "Thermador column refrigerators and Viking side-by-sides use an optical sensor to
      detect bin fill level. Coastal condensation fogs the lens, and Malibu's salt air corrodes
      the wiring harness behind it. The machine halts production even with an empty bin, and it
      rarely throws an error code — so the ice maker assembly gets blamed when the real issue is a
      corroded sensor connector. On Viking units this sometimes surfaces as the module cycling on
      and off every few minutes. Cleaning the optical path and reseating the harness connector
      fixes it most of the time; the sensor itself only needs replacing if corrosion has
      pitted the contacts beyond cleaning."

  - title: "Supply Line Frozen Inside an Uninsulated Cabinet Cavity"
    description: "Hillside homes above PCH sometimes route the refrigerator water line through an
      exterior wall section or uninsulated cabinet run. On the rare cold Malibu overnight, that
      line freezes solid — no water reaches the unit, but the fill valve and assembly are
      both fine. Locating the freeze point without damaging high-end custom cabinetry is where
      the job gets technical. A heat gun on low setting and patience beats tearing out panels.
      Adding foam pipe insulation to the exposed run takes maybe 20 minutes and prevents the
      same service call next winter."

faq:
  - q: "How fast can you get to Malibu for ice maker service?"
    a: "PCH timing dictates arrival more than distance. Morning runs before 10 AM move fastest;
      midday Malibu traffic adds 30-40 minutes each way. Generally on-site within 2-3 hours of
      your call. Dial (323) 870-4790 and we'll give you a real window, not a vague 4-hour block.
      Evening slots are open most weekdays for calls placed before 3 PM — useful if the morning
      slots are already gone."

  - q: "Do you repair Sub-Zero and Thermador built-in ice makers specifically?"
    a: "Those two are the majority of what we see in Malibu's 90265. Sub-Zero's integrated module
      needs factory-spec tooling — the service access sequence alone differs from every other brand.
      Thermador column freezers run proprietary control board diagnostics that require reading the
      error history before touching components. Bosch and KitchenAid units — common in newer Malibu
      builds along Kanan Dume Road — are fully covered as well. Same-day availability applies to
      all of these brands."

  - q: "What does ice maker repair typically cost in Malibu?"
    a: "Most jobs — fill valve replacement, sensor swap, supply line thaw — run $150-$350 in parts
      and labor. Sub-Zero and Thermador parts cost more than Whirlpool or GE equivalents, so budget
      toward the higher end for luxury built-ins. Call (323) 870-4790 to check same-day openings;
      emergency appointments are available when a unit is completely down. Malibu addresses get
      priority booking given the drive, so early calls get first pick of the day's slots."
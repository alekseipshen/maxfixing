title: "Huntington Beach Dryer — Surf City Homes, Salt Air, Real Repairs"

intro: |
  Salt air off the Pacific moves inland fast in 92648, and it doesn't just corrode deck furniture. Those 1960s
  tract homes near Goldenwest Street often have laundry rooms with minimal ventilation — tight wall cavities,
  short exhaust runs, and LG gas dryers collecting lint faster than homeowners expect. A clogged blower wheel
  in that environment isn't a maybe. It's a when. We know these houses.

localContext: |
  Huntington Beach housing runs from beachside condos off Pacific Coast Highway to sprawling 1970s ranch homes
  in the Huntington Harbour area — zip codes 92646 and 92649 have both. The older stock, built between 1958
  and 1975, often has dryer vents that were never updated: interior wall runs with multiple bends, sometimes
  15 feet before the exhaust exits the structure. That's where we find most of the lint buildup, restricted
  airflow, and thermal fuse failures in this city.

commonProblems:
  - title: "Thermal fuse keeps blowing — restricted exhaust in older ranch homes"
    description: |
      In 92646 ranches, the dryer vent sometimes travels through an interior wall before it exits outside.
      Samsung DV-series gas dryers shut down and stop heating when airflow drops below threshold — the thermal
      fuse trips to prevent a fire. We clear the vent blockage, replace the fuse, and measure static pressure
      before signing off. Skipping the vent cleaning just means it blows again in three months.

  - title: "Drum stops mid-cycle — worn drum rollers and drive belt failure"
    description: |
      Bosch condensation dryers in the beach condos near PCH already run longer cycles than vented units.
      Add a worn drum roller or a cracked drive belt tensioner, and the drum quits mid-load. The motor hums,
      clothes stay wet, nothing moves. Usually a straightforward fix — belt and rollers are stock parts —
      but the tight laundry closets in those condo stacks take extra time to access properly.

  - title: "No heat at all — gas valve igniter or heating element gone"
    description: |
      Gas dryers dominate in Huntington Beach, and the igniter is often the first component to fail on older
      KitchenAid and Maytag units. Drum spins, timer runs, clothes come out cold and damp after a full cycle.
      Sometimes it's the gas valve igniter, sometimes a burned-out heating element — we carry both on the
      truck. Diagnosis takes about 20 minutes on-site.

faq:
  - q: "How fast can you get to Huntington Beach for dryer repair?"
    a: |
      We run Orange County routes daily. Residential streets in 92648 and 92646 are easy — no permit
      parking headaches, van fits curbside. Call (323) 870-4790 and we can usually get there same day.
      Evening slots available if daytime doesn't work.

  - q: "Do you repair LG and Samsung dryers in this area?"
    a: |
      LG and Samsung are our most common calls in Huntington Beach. On LG units we frequently replace
      moisture sensors and control boards. Samsung gas dryers usually need thermal fuse kits or drum
      roller sets. Bosch condenser models too — all three, no problem.

  - q: "What does dryer repair cost, and how does same-day service work?"
    a: |
      Most repairs run $120–$260 depending on parts. A thermal fuse swap is on the low end; a control
      board on a Bosch or KitchenAid unit runs higher. We quote on-site after diagnosis — nothing gets
      replaced without your approval. Schedule at (323) 870-4790, and same-day slots are usually open
      if you call before noon.

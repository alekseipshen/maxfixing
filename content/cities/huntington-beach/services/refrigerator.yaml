title: "Huntington Beach Refrigerator — Coastal Air, Hard Water Fixes"

intro: |
  Salt air from PCH corrodes condenser coils faster than most homeowners realize — the blocks between
  the pier and Brookhurst Street see this constantly. That KitchenAid counter-depth you paid good money
  for is fighting Orange County hard water AND coastal humidity every single day. Mineral scale clogs
  the ice maker assembly, the condenser fan labors harder, and suddenly the unit that cost $2,400 is
  sitting at 48°F and warming up your groceries.

localContext: |
  Most of the housing stock around zip 92648 and 92649 runs from mid-1960s tract homes near Newland
  Street to the tighter beach cottages closer to downtown. Kitchens in those older builds weren't
  designed for today's 36-inch column refrigerators — ventilation clearances are tight, and the
  compressor runs hotter for it. Huntington Harbour homes are a different story: bigger kitchens,
  Sub-Zero built-ins, and owners who notice the moment the unit makes a noise it didn't make yesterday.

commonProblems:
  - title: "Ice Maker Failure From Hard Water Mineral Buildup"
    description: "Orange County water regularly tests above 300 ppm hardness. That scale accumulates
      in the water inlet valve and clogs the fill tube going into the ice maker assembly. Samsung
      french-door models are particularly vulnerable — the dual ice maker design has two separate
      valve circuits that both clog independently. A full flush and valve replacement usually runs
      under two hours."
  - title: "Compressor Noise and Warm Temperatures in Summer Heat"
    description: "Huntington Beach summers push ambient garage temps past 90°F. The compressor on a
      standard refrigerator isn't rated for sustained heat at that level — especially in garages with
      poor airflow. LG's linear compressor gives a distinct clicking or humming when it starts
      struggling. Catching it early means a compressor reset or refrigerant recharge; ignoring it
      means full compressor replacement."
  - title: "Water Pooling Under the Unit — Defrost Drain Issues"
    description: "A clogged defrost drain is the most common reason water appears on the floor under
      a Bosch or KitchenAid refrigerator. The evaporator coil defrosts on a timer cycle, and the
      meltwater runs down a channel to the drain pan. That channel gets blocked by ice or debris,
      and water overflows instead. Coastal humidity makes this worse — the coil sees more moisture
      cycling through it than a unit sitting in a dryer inland climate."


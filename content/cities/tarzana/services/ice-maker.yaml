title: "Tarzana Ice Maker Repair — Valley Heat Breaks These First"

intro: |
  Summers along Ventura Boulevard in 91356 push indoor refrigerator temps hard — ambient
  kitchen heat regularly climbs past 100°F, and the appliances working inside those
  1960s-era homes weren't engineered for decades of that punishment. The GE Profile
  side-by-side is everywhere in this zip code, and the most common failure call MaxFixing
  gets from Tarzana homeowners is simple: the ice maker stopped completely. Nine times out
  of ten, the water inlet valve is clogged with mineral scale. LA's municipal water runs at
  roughly 350 mg/L total dissolved solids, which is aggressive enough to coat the valve's
  internal screen and solenoid winding within three to five years. Walk down Yolanda Avenue
  and there's a good chance half the refrigerators on the block have a fill valve that's
  running at reduced pressure or has failed silently. MaxFixing handles these calls
  regularly across 91356 and can usually be on-site the same day. Call (323) 870-4790.

localContext: |
  The housing stock in 91356 is mostly single-story ranch homes built between 1960 and
  1975 — kitchens that weren't designed for today's french-door refrigerators and often
  have supply lines running through uninsulated exterior wall cavities. Residents in the
  91357 hillside parcels north of Ventura Boulevard tend to have larger homes with premium
  appliances; KitchenAid and Samsung french-door units are common up there. Along the
  Reseda Boulevard corridor, apartment complexes cycle through Frigidaire Gallery and Amana
  side-by-sides at a higher rate — tenant use and deferred maintenance accelerate failures.
  Valley summers hitting 105°F force the ice maker's harvest cycle to run constantly,
  stressing the mold heater and evaporator plate in ways that cooler coastal climates never
  see. Older galvanized and copper plumbing — still present in many of the original 91356
  ranch homes — sheds sediment that travels straight to the fill valve and shortens its
  life. These aren't manufacturer defects. They're Tarzana-specific wear patterns.

commonProblems:
  - title: "Hard Water Kills Tarzana Fill Valves — Ice Stops First"
    description: |
      At 350 mg/L total dissolved solids, LA water coats the internal screen and solenoid
      winding inside a water inlet valve within three to five years. Production stops
      completely — no water reaches the ice mold. Whirlpool side-by-side and GE Profile
      refrigerators in 91356 are the most frequent callers on this problem. The fix is a
      valve swap, not a cleaning; mineral deposits inside the solenoid winding can't be
      fully reversed once hardened. On a Kenmore Elite 795 series, the fill valve is
      accessed from the lower rear panel — about a 45-minute job with the right connectors
      on hand. Total cost runs $120–150 parts and labor, and MaxFixing carries common
      Whirlpool and GE inlet valves on the van for same-visit repair. Call (323) 870-4790.

  - title: "Cloudy or Misshapen Ice Points to the Evaporator Plate or Ice Mold Thermostat"
    description: |
      Small, hollow, or cloudy cubes usually mean the harvest cycle is releasing ice before
      it's fully formed. The ice mold thermostat is supposed to signal the mold heater to
      fire at a precise temperature — when that bimetal thermostat drifts after five to
      seven years of Valley heat cycles, timing goes wrong. Samsung DA97 ice maker
      assemblies in the RF28 series are the most common scenario for this in Tarzana; the
      full DA97 kit replaces the evaporator plate, thermostat, and ejector arm as a unit,
      running $85–120 for the part and about one hour of labor. On Frigidaire Gallery or GE
      units with mineral buildup on the evaporator plate, a citric acid flush sometimes
      restores performance before a full swap is needed. Full assembly replacement runs
      $95–180 depending on model and parts sourcing.

  - title: "Frozen Water Lines Behind the Fridge — an Installation Problem, Not Just a Repair"
    description: |
      Supply lines routed through an exterior wall cavity can freeze during a rare cold snap
      or, more often, when a refrigerator sits against an uninsulated exterior wall in a
      91356 ranch home with poor airflow behind the unit. Plastic supply lines crack under
      repeated thermal cycling; braided stainless steel lines handle the movement better and
      last far longer. Rerouting a line through a wall is plumbing work done under CA
      license — not something a tech should improvise without proper documentation.
      Material cost for a braided stainless line and fittings runs under $25. Labor is one
      to two hours depending on access. Most Tarzana homes have cabinet configurations that
      make the reroute straightforward from inside the kitchen without opening drywall.

  - title: "What Ice Maker Repairs Actually Cost in Tarzana — and When to Stop Repairing"
    description: |
      Fill valve replacement runs $120–150. A full ice maker assembly swap — the module
      including ejector arm, control board interface, and mold heater — lands at $180–260.
      Control board replacement, which Samsung RF28 and RS series units sometimes need when
      PC ER or 41E error codes appear, runs $280–350. Frigidaire Gallery parts stock fast
      and tend to be cost-effective to repair; Kenmore Elite 795 series parts are similarly
      available for same-day service. MaxFixing carries common Whirlpool and GE assemblies
      on the van. For any refrigerator over 12 years old showing signs of compressor
      problems alongside ice maker failure, repair costs should be weighed against
      replacement value — that's a conversation worth having honestly before authorizing a
      $300 control board on a unit that may not last.

  - title: "Bail Arm and Optical Sensor Failures — Annual Maintenance Beats a Mid-July Breakdown"
    description: |
      The bail arm — also called the ice level arm — shuts off production when the bin is
      full. On Amana and Maytag side-by-sides, the bail arm plastic gets brittle over years
      of thermal cycling and can lodge in the raised position, making the refrigerator think
      the bin is always full. A replacement arm runs $12–20 and takes 20 minutes to swap.
      On Samsung units with an optical harvest sensor, a frosted lens sends a false "bin
      full" signal and stops production entirely — isopropyl alcohol on a cotton swab clears
      most of these in 20 minutes, or the sensor replaces for $30–55 if the lens is cracked.
      Scheduling a quick annual check before June keeps both problems from surfacing during
      the hottest stretch of the San Fernando Valley summer. Call (323) 870-4790.

faq:
  - q: "How fast can you get to Tarzana for an ice maker repair?"
    a: |
      Tarzana sits right off the 101 Freeway at Topanga Canyon Boulevard — from dispatch,
      that's a 20–30 minute drive in normal Valley traffic. Same-day service is standard,
      with most calls reached within two hours of booking. Common parts — fill valves, bail
      arms, Samsung DA97 assemblies, Whirlpool inlet valves — ride on the van, so most
      repairs finish in a single visit. Residential streets in Tarzana are easy to park on,
      which cuts the logistics compared to a dense West LA call. Evening slots are available.
      Call (323) 870-4790 and dispatch can usually give a same-day window immediately.

  - q: "What does ice maker repair cost in Tarzana?"
    a: |
      Most Tarzana ice maker repairs fall between $120 and $280. A fill valve on a Whirlpool
      or GE unit runs $120–150 total. Full assembly replacement lands at $180–260 depending
      on the model. Control board work — most often Samsung or LG — runs $280–350. The
      diagnostic fee is $65 and applies toward the repair if you proceed. Frigidaire Gallery
      and Kenmore parts are typically available same day. Samsung DA97 assemblies are usually
      stocked on the van; some Samsung models may require a next-day order. A firm quote
      comes after the diagnostic — not before — because the real failure is often different
      from the symptom.

  - q: "Do you need a permit to replace an ice maker in Tarzana?"
    a: |
      Replacing the ice maker module itself — the assembly, fill valve, optical harvest
      sensor, or control board — does not require a permit in LA. No LA Department of
      Building and Safety permit is needed for appliance component repairs. Permits apply
      when the water supply line is physically rerouted through a wall cavity, which triggers
      an LA DBS plumbing permit. Most Tarzana calls don't involve that. If rerouting is
      necessary, MaxFixing pulls the permit under CA license, and the process
      typically takes one to two days — not weeks. Homeowners don't need to manage that
      paperwork.

  - q: "Can you fix Samsung and LG french-door ice maker problems?"
    a: |
      Yes. Samsung DA97 ice maker assemblies are common throughout the Valley, especially in
      the RF28 and RS series refrigerators. Those units frequently throw PC ER or 41E error
      codes tied to the ice maker assembly or the optical harvest sensor. LG LMXS dual ice
      maker models have a separate door-mounted ice unit that fails earlier than the lower
      unit — condensation and hinge wear are the usual causes. Common Samsung and LG
      assemblies ride on the van. Single-visit repair is typical when the error code is
      reported before the technician arrives, which allows pre-staging the right part. Call
      (323) 870-4790 and describe the error code on the display.

  - q: "What warranty do you offer on ice maker repairs in Tarzana?"
    a: |
      All repairs carry a 90-day parts and labor warranty. Replacement Whirlpool and GE
      assemblies typically include a one-year manufacturer warranty on the part itself,
      separate from the labor coverage. A second, unrelated failure on a different component
      isn't covered — that's a new diagnostic, not a warranty call. Ice makers that get
      regular water filter changes last 10–15 years in Southern California conditions.
      Skipping filter replacements is the single most common accelerator of early fill valve
      and evaporator plate failure seen on Tarzana service calls — more than brand, more
      than age.


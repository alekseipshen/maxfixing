title: "Tarzana Dishwasher Repair — Hard Water & Fast Turnaround"

intro: |
  Ventura Boulevard splits Tarzana right down the middle, and on both sides of it — from
  the older ranch homes near Reseda Boulevard to the newer condos tucked off Corbin Avenue —
  GE dishwashers are sitting in kitchens full of calcium deposits. LADWP water in 91356
  routinely tests above 280 mg/L total dissolved solids. That level of hardness doesn't just
  leave white film on glasses; it clogs spray arms, seizes float switches, and eventually
  kills drain pumps. Most calls from Tarzana aren't dramatic failures — the machine just stops
  cleaning right. Load after load comes out with grit on the bottom rack, cloudy glasses, food
  stuck to the door frame. By the time a homeowner calls, the spray arm ports are half-blocked
  and the heating element is coated in scale. Two-hour response time, same-day parts on most
  GE and Whirlpool models, and the side streets here are familiar enough to dodge the Ventura
  Freeway backup at Reseda.

localContext: |
  The housing mix in Tarzana runs from 1960s and 1970s single-family ranch homes — three-bedroom
  stucco builds with original cabinet layouts — to the newer apartment complexes strung along
  Reseda Boulevard near the 101 corridor. Zip code 91356 covers the denser residential core:
  tighter kitchens, under-counter dishwashers, sometimes installed in awkward spots with limited
  pull-out clearance for service access. The 91357 pocket sits further north and west toward
  Woodland Hills, with larger lot homes and more counter space — but those kitchens often have
  Kenmore or Frigidaire units that haven't been serviced in a decade. Braemar Country Club area
  homes on the south end skew toward slightly newer appliances, but the water hardness hits every
  machine equally. Calcium builds in every dishwasher regardless of vintage or price point.
  Service vans typically park in driveways or curbside — the side streets off Vanalden Avenue
  have consistent access, so there's no time wasted before the toolbox opens.

commonProblems:
  - title: "Mineral-Clogged Spray Arms Leaving Dishes Dirty After Every Cycle"
    description: |
      Hard water at 280-plus mg/L TDS — standard for LADWP supply in 91356 — deposits calcium
      carbonate inside spray arm ports faster than most homeowners expect. A Whirlpool or GE
      dishwasher running daily will start showing reduced cleaning within 18 months if the spray
      arms aren't periodically cleared. The fix isn't always a full arm replacement; sometimes a
      descaling flush and a port reaming tool restores pressure completely. But if the spray arm
      has cracked near the mounting hub — a failure common on older Whirlpool WDT series units —
      the arm needs to come out. Replacement spray arms run $25–$55 depending on the model. Full
      cleaning restoration, including spray arm swap and a citric acid descaling cycle, typically
      runs $95–$145. Same-day service is available for most Tarzana addresses — call (660) 999-9960
      and a window can usually be confirmed within the hour.

  - title: "Standing Water in the Tub — Drain Pump Failures in Tarzana Kitchens"
    description: |
      A puddle of grey water sitting at the tub bottom after a full cycle points straight at the
      drain pump or a kinked drain hose loop. On Samsung and LG models — both popular in Tarzana's
      newer builds — the drain pump assembly sits behind the lower access panel and requires removing
      the door liner to reach cleanly. The impeller inside the pump jams from food debris and calcium
      scale, particularly when the filter hasn't been cleaned in a few months. An E24 error code on a
      Bosch, or the equivalent OE code on an LG, confirms drain blockage before the unit even comes
      apart. Pump replacements run $120–$200 for parts and labor on most mid-range units. Common
      Samsung and LG drain pump assemblies are stocked on the van, so a same-day repair is realistic
      for most Tarzana households without a return visit.

  - title: "Door Latch Won't Catch — Dishwasher Stops Mid-Cycle or Won't Start"
    description: |
      A dishwasher that won't initiate, or drops out partway through a cycle, often traces back to a
      failed door latch assembly rather than the control board — which is usually the expensive fear.
      The latch mechanism includes a strike plate, a latch hook, and a micro-switch that signals the
      control board the door is properly sealed. On Frigidaire and GE models built between 2010 and
      2020, the plastic latch hook cracks under repeated use and loses the spring tension needed to
      trigger that micro-switch. Direct latch assembly replacement runs $40–$80 in parts depending on
      model. Contractor license #1136541 handles these repairs with genuine OEM parts rather than
      aftermarket substitutes that wear out in six months. Total on-site repair time is usually under
      an hour for a standard undercounter latch swap — the most common Frigidaire and GE
      configurations are kept in stock.

  - title: "Detergent Dispenser Stuck Shut — Repair vs. Replace Math in Tarzana"
    description: |
      The detergent dispenser door is spring-loaded and operated by a wax motor or bi-metal actuator
      that fires when water temperature hits a threshold mid-cycle. Hard water residue seals the
      dispenser door closed over time — calcium builds in the hinge recess and the door fails to pop
      open at the right moment. The cycle finishes with a full pod sitting unused in the tub. On
      Kenmore and Amana units, the dispenser assembly is a single replaceable component, running
      $35–$65 for the part. Labor for a dispenser swap runs $75–$100, putting total repair cost at
      roughly $110–$165 — versus $400–$700 for a new unit. For a machine under ten years old with a
      working pump and intact control board, repair is the obvious call. Kenmore-compatible dispenser
      assemblies are carried in stock for same-day turnaround.

  - title: "Calcium on the Float Switch and Heating Element — When a Deep Clean Fixes Everything"
    description: |
      Tarzana's water hardness accelerates two problems most dishwasher manuals barely mention. The
      float switch gets encrusted and sticks in the raised position — triggering overfill protection
      and stopping the fill cycle entirely. Separately, the heating element develops a thick calcium
      jacket that drops wash temperatures and stretches cycle times noticeably. Both issues respond
      well to a professional descaling service: citric acid soak, filter pull and clean, float switch
      manual inspection and reset — $85–$120 for the full procedure. Machines under eight years old
      on solid chassis like a KitchenAid KDTE254ESS or a mid-range Bosch 500 Series are worth
      maintaining this way. After twelve years on an entry-level Kenmore or Frigidaire unit that has
      already had a few prior repairs, the math shifts toward replacement. A technician opening the
      machine can give an honest read on whether the control board and pump show enough additional
      wear to make another repair unwise.

faq:
  - q: "How fast can you get to Tarzana for a dishwasher repair?"
    a: |
      Tarzana sits right off the 101 at Reseda Boulevard — from the central Valley staging point,
      on-site arrival typically runs 90 minutes to 2 hours during business hours. The side streets
      between Vanalden and Corbin Avenue are easy to navigate, and most residential driveways give
      the van direct pull-in access without blocking traffic. Parking on the north side streets off
      Ventura Boulevard can get tight during midday hours, but the layout here is familiar enough
      not to waste time circling. Evening appointment slots are available Tuesday through Thursday
      for households that can't do midday. Call (660) 999-9960 to confirm a same-day or
      next-morning window — most diagnostic-to-repair visits wrap in a single appointment when
      parts are already on the van.

  - q: "What does dishwasher repair in Tarzana typically cost?"
    a: |
      Most repairs in Tarzana fall between $95 and $250 for parts and labor combined. A drain pump
      swap on a Samsung or LG runs toward the higher end — $150–$220 — because the assembly sits
      deeper in the unit and takes longer to access cleanly. Spray arm replacements and detergent
      dispenser swaps are faster jobs, landing at $90–$145 total. A door latch fix usually comes in
      at $100–$140. What pushes cost higher is parts availability — some older Kenmore models use
      discontinued components that require sourcing from secondary suppliers. A firm quote is given
      on-site after the diagnostic, with no surprise charges added at invoice. Call (660) 999-9960
      to book — the diagnostic visit includes a full machine assessment at no hidden add-on cost.

  - q: "Do I need a permit to replace a dishwasher in Tarzana?"
    a: |
      Tarzana falls under City of Los Angeles jurisdiction — the LA Department of Building and Safety
      handles permits here, not a separate municipal office. A like-for-like dishwasher replacement
      in the same cabinet opening, on the same electrical circuit and existing water supply
      connections, generally doesn't require a permit under LADBS guidelines. New electrical work, a
      relocated drain connection, or moving the appliance to a different kitchen position does trigger
      permit requirements. Contractor license #1136541 is on file with LADBS, and paperwork
      submission for permitted work is handled in-house. Most homeowners doing a standard cabinet
      swap are permit-exempt, but the specifics can be confirmed during the diagnostic visit before
      any work begins.

  - q: "Can you diagnose and fix Samsung and LG error codes on-site in Tarzana?"
    a: |
      Samsung and LG generate most of the error code calls from Tarzana. Samsung throws E3 and LC
      codes for drain and leak sensor issues; LG displays OE for drain blockages and AE for water
      detected in the door sump. Both code sets can look alarming but usually trace back to a jammed
      drain pump impeller, a kinked drain hose, or a float switch coated in calcium from the LADWP
      supply. Diagnostic tools specific to both platforms are carried on the van — fault code readers
      that pull the full error log, not just the current active fault. Common Samsung drain pump
      assemblies and LG water inlet valve assemblies are stocked for same-day swap. An on-site fix
      without a return visit is the target on most error code calls.

  - q: "What warranty do you offer on dishwasher repairs in Tarzana?"
    a: |
      Parts carry a 90-day manufacturer warranty minimum; most OEM components used carry a full
      one-year warranty from the part manufacturer. Labor is warranted for 30 days — if the same
      failure recurs within that window, the return visit is at no charge. SoCal's hard water means
      calcium-related failures can come back if the root cause isn't fully addressed, so a descaling
      service on top of the part swap is usually recommended for machines in 91356 and 91357. Premium
      components — a KitchenAid control board, for example — often carry a two-year part warranty
      from the manufacturer. Coverage specifics are confirmed at time of repair so there's no
      ambiguity when the invoice is signed.


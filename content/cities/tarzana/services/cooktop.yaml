title: "Tarzana Cooktop — Ranch Kitchen Gas & Electric Repairs"

intro: |
  Ranch homes on Etiwanda Avenue and the streets spreading north toward Tarzana Park were
  mostly built between 1958 and 1978 — and a surprising number of those kitchens still run
  on the original gas cooktop rough-in, even if the surface unit has been swapped once or
  twice since. Kenmore four-burner models from that era turn up on service calls constantly,
  usually with a failed igniter electrode or a burner cap so caked with grease it won't seat
  properly anymore. The LADWP water feeding 91356 runs notoriously hard — around 280-320 ppm
  — which pushes mineral deposits into igniter ports and venturi tubes over time, especially
  on units near the sink or with tight under-cooktop clearance. Lindley Avenue to Reseda
  Boulevard, this stretch of western Valley residential housing generates steady cooktop
  repair volume. Gas ignition problems, pilot failures on older units, cracked ceramic on
  newer Samsung smoothtops — it's a full mix out here.

localContext: |
  The two main zip codes — 91356 (the core residential grid south and east of Ventura) and
  91357 (the hillside streets and newer development running north toward Oxnard Street) —
  have meaningfully different kitchen profiles. Homes in 91356, particularly the 1960s and
  70s ranch stock along Mecca Avenue and Vanalden Avenue, typically have freestanding gas
  ranges or drop-in gas cooktops with exposed burner grates, older gas valves, and spark
  module wiring that degrades after repeated wet cleaning. Up in 91357, more 1990s and
  early-2000s renovations bring electric smoothtop and ceramic glass cooktops into the mix
  — Frigidaire and GE Profile models are common in that tier. Both zones run on LADWP water
  hard enough to leave visible calcium scale around burner ports within a year of a deep
  clean. Valley summer heat also stresses electronics in induction and electric models —
  control board failures spike in July and August when ambient kitchen temps climb past 90°F
  with the windows closed.

commonProblems:
  - title: "Igniter Clicks But Won't Light — Hard Water Scale in 91356 Gas Cooktops"
    description: |
      That constant clicking after the burner should have lit is almost always one of three
      things: a fouled igniter electrode, a blocked venturi tube, or a cracked burner cap
      that's letting gas spread wrong. In Tarzana's 91356 zip, LADWP water hardness
      accelerates calcium buildup inside igniter ports, and that white chalky crust breaks
      the spark gap reliably over 2-3 years without cleaning. On Kenmore and GE gas cooktops
      from the late 1990s through early 2010s, the igniter electrode itself is a $15-25 part,
      but the spark module — the control box mounted under the cooktop that generates the
      voltage — runs $45-90 depending on the model. A full igniter system repair, including
      cleaning the venturi tubes and reseating the burner caps, takes 45-60 minutes and
      typically runs $120-185 in parts and labor combined. Call (660) 999-9960 for same-day
      availability on most Valley cooktop calls.

  - title: "Cracked Ceramic Glass on Smoothtops — Thermal Stress in Inland Valley Kitchens"
    description: |
      A hairline crack in a ceramic glass cooktop surface is not cosmetic. A cracked radiant
      element cover can let moisture into the heating element below, and on a Samsung or
      Frigidaire smoothtop with a crack running through or near a burner zone, that's a
      genuine safety issue. In Tarzana's inland summer heat, thermal cycling stress on ceramic
      glass runs higher than coastal LA. Kitchens in 91356 and 91357 regularly hit 85-90°F
      ambient before the cooktop even turns on, and rapid temperature swings accelerate
      micro-fracture growth. Replacing the ceramic glass panel on most 30-inch smoothtop
      models runs $200-350 for the glass alone; labor adds $80-120. GE Profile and Frigidaire
      Gallery replacement glass is generally in stock at LA-area distributors within 3-5
      business days. The radiant element underneath should be inspected at the same time —
      a scorched infinite switch or a warped coil element are common secondary findings when
      the glass cracks.

  - title: "Drop-In Cooktop Replacement — Cutout Sizing and Gas Permits Through LADBS"
    description: |
      Swapping out a drop-in gas cooktop in one of Tarzana's 1960s ranch kitchens is not
      always straightforward. Original cutout dimensions (typically 30x21 inches for older
      units) often don't match current cooktop footprints exactly, and the gas line stub-out
      location may need to move. Any new gas appliance installation in the City of Los Angeles
      requires a permit through LADBS (Los Angeles Department of Building and Safety), and a
      licensed contractor must pull it — contractor license #1136541 covers that
      documentation. The permit process for a standard residential gas cooktop replacement
      runs about 10-15 business days for inspection scheduling; in many cases, installation
      can begin the same day while the permit is pending if the scope is limited to appliance
      swap only. Material costs for a new Whirlpool or GE drop-in gas cooktop in the 30-inch
      range run $380-650; installation with permit adds $180-280 depending on whether gas
      line modification is required.

  - title: "Repair vs. Replace — Making the Math Work on a 10-Year-Old Tarzana Cooktop"
    description: |
      A practical threshold: if the repair exceeds 50% of replacement cost, replacement often
      makes more financial sense. A basic Amana or Whirlpool four-burner gas cooktop runs
      $320-450 new; a Samsung smoothtop in that footprint runs $400-550. Common repairs —
      replacing a gas valve ($80-140 parts), swapping a control board on an electric model
      ($90-180), or fixing the full burner igniter system ($120-185 total) — usually pencil
      out to repair, especially on units under 12 years old with no other issues. For older
      GE and Kenmore units from the late 1990s, parts availability thins after 15 years —
      sourcing an OEM gas valve or original spark module can add 1-2 weeks to the timeline.
      Budget $150-250 for most single-component repairs; full igniter replacement across all
      four burners on a gas cooktop typically runs $220-320. Free on-site estimates available
      — call (660) 999-9960 to get one scheduled.

  - title: "Knob Malfunction and Gas Valve Wear — What Gets Ignored Until It Fails"
    description: |
      Knob failure on a gas cooktop usually comes down to one of two parts: a broken D-shaft
      adapter (the plastic piece connecting the knob to the valve stem) or an actual gas valve
      stem seized from years of grease intrusion around the base. On Kenmore and Whirlpool
      four-burner units, the D-shaft adapter is a $10-20 fix; a seized gas valve runs $80-140
      to replace. Beyond knobs, the maintenance items most often skipped in Valley kitchens
      are the burner grates (clean monthly in hard-water zones like Tarzana), the igniter
      electrodes (wipe clean with a dry toothbrush every 6 months), and the exhaust clearance
      under the cooktop on integrated units. Gas cooktops typically run 15-20 years with
      functional valves and clean burner assemblies. At the 12-15 year mark, an inspection
      for gas valve wear and igniter module condition is worth scheduling — especially before
      listing a home anywhere along the Ventura Boulevard corridor.

faq:
  - q: "How fast can you get to Tarzana for cooktop repair?"
    a: |
      From the Valley, Tarzana is a straightforward run — 20-35 minutes depending on whether
      we're coming off the 101 or the 405. Morning call slots book fastest, but same-day
      availability on cooktop calls is the norm, and evening slots open up most weekdays after
      4pm. Parking on residential streets off Ventura Boulevard and Reseda Boulevard is
      generally not a problem for the service van. Call (660) 999-9960 before noon and we can
      almost always route a technician out the same day — have the model number ready if you
      can find it, it speeds up the parts check before arrival.

  - q: "What does cooktop repair typically cost in Tarzana?"
    a: |
      Most single-component repairs — igniter replacement, burner cap swap, gas valve, or a
      control board on an electric model — run $120 to $280 depending on the part and brand.
      Ceramic glass replacement on a smoothtop costs more: typically $280-470 all-in for
      parts and labor on a standard 30-inch unit. GE and Frigidaire parts tend to be cheaper
      and faster to source than Samsung components, where certain control boards run $150-200
      on their own. On-site estimates are free — call (660) 999-9960 and you'll get exact
      numbers after we look at the unit in person, not a phone estimate that shifts when
      we show up.

  - q: "Do cooktop replacements in Tarzana require a city permit?"
    a: |
      Yes — in the City of Los Angeles, any new gas appliance installation requires a permit
      through LADBS (Los Angeles Department of Building and Safety). Straight appliance-swap
      replacements fall into the simplest permit category: we file the paperwork, inspection
      scheduling typically runs 10-15 business days, and in most cases the cooktop is
      operational the same day we install it pending final sign-off. For condo or HOA-managed
      properties in Tarzana — several complexes along Reseda Boulevard and the Vanalden
      corridor have active HOA boards — board review for any work touching gas lines or
      cabinetry generally runs 2-4 weeks. Contractor license #1136541 covers all required
      permit documentation and inspection coordination.

  - q: "Can you repair both gas and electric cooktops in Tarzana, including induction models?"
    a: |
      Gas and electric smoothtop repairs are both routine — the diagnostic approach differs
      but neither is complicated. Gas calls typically involve igniter systems, burner caps,
      venturi tubes, or gas valves; electric and induction calls involve infinite switches,
      radiant or induction elements, and control boards. Induction cooktops — Bosch and
      Samsung induction models are showing up more frequently in renovated Tarzana kitchens
      — require capacitor and IGBT module testing, which not every Valley repair shop handles.
      Common parts for Frigidaire, GE, Kenmore, and Samsung smoothtop models including
      heating elements and spark modules are stocked on the van for most calls. Call
      (660) 999-9960 to confirm part availability before scheduling.

  - q: "What warranty do you offer on cooktop repairs in Tarzana?"
    a: |
      Parts carry the manufacturer's warranty — typically 90 days to one year depending on
      the component and brand. Labor is warranted for 90 days on any completed repair. If a
      part fails within that window, we return and replace it at no additional labor charge.
      For lifespan context: a properly maintained gas cooktop in a San Fernando Valley home
      should run 15-20 years without major component replacement beyond the igniter system and
      burner caps. Ceramic smoothtop glass is more vulnerable to thermal shock and impact, and
      the Valley's temperature swings do shorten that lifespan compared to coastal areas. For
      higher-end installations, OEM parts are sourced directly rather than aftermarket, which
      protects both the warranty and long-term repair quality.

  - q: "What neighborhoods near Tarzana do you cover for cooktop repair?"
    a: |
      Coverage runs from Woodland Hills and Calabasas to the west, through Tarzana and
      Reseda, east to Encino and Sherman Oaks, and north to Northridge and Granada Hills.
      The broader service territory stretches from Irvine up to Santa Clarita, but Tarzana
      and the surrounding Valley zips get faster response times since there's usually a
      technician already in the area. Same-day or next-morning scheduling is available for
      cooktop calls that come in before 11am. Call (660) 999-9960 — if a tech is wrapping a
      job in Reseda or Encino, rerouting to Tarzana the same afternoon is often possible.
title: "Costa Mesa Dishwasher Repair — Hard OC Water, Real Fixes"

intro: |
  Mesa Verde's 1960s-era kitchens are still running hard Orange County water through pipes
  that were never designed for modern appliances. That mineral load is brutal on spray arms —
  a Bosch 500 Series unit installed in 92626 can start showing blocked jets and cloudy glasses
  within two years. Costa Mesa sits in one of the harder water zones in the county, and your
  dishwasher feels it first.

localContext: |
  The 92626 zip covers Mesa Verde and College Park — tract homes built between 1962 and 1975,
  with kitchens retrofitted for dishwashers over the decades. Cabinet cutouts in these houses
  sometimes run narrow, which makes pulling a KitchenAid unit more involved than a standard swap.
  Over in 92627, Eastside Costa Mesa has a mix of older bungalows and 1980s condos near
  Newport Boulevard — tighter access, and plumbing that dates back far enough to leave mineral
  residue in the water inlet valve before the machine even gets warm.

commonProblems:
  - title: "Mineral Scale Blocking Spray Arms and Float Switches"
    description: "Orange County water hardness averages around 300–400 mg/L in this area. That calcium
      deposits fast inside the upper and lower spray arms, restricting water pressure enough that dishes
      come out greasy even on a full cycle. The float switch can also crust over and trigger false
      overflow signals. Bosch 300 and 500 Series units — common throughout Mesa Verde — show this
      pattern more than most because of their fine spray nozzles."
  - title: "Drain Pump Failures from Food Debris in Older Kitchens"
    description: "Homes in the 92626 tract neighborhoods often have older garbage disposals that push
      fine debris back into the dishwasher drain line. The drain pump impeller gets fouled, and you
      end up with standing water at the bottom after every cycle. LG units throw an OE error code
      when this happens. Sometimes it's a clog in the filter basket, sometimes the pump itself needs
      replacement — either way, it's a fast diagnosis."
  - title: "Door Latch Assembly Failures on Thermador and KitchenAid Built-ins"
    description: "A handful of homes in the South Coast Metro corridor near Anton Boulevard have
      been renovated with Thermador or KitchenAid built-in panel-ready units. The door latch
      assembly on these models takes more torque stress than standard freestanding dishwashers —
      the panel adds weight. Latch mechanism failure shows up as a door that won't fully engage,
      causing the machine to stop mid-cycle or not start at all."

faq:
  - q: "How fast can you get to Costa Mesa for dishwasher repair?"
    a: "From our South Bay coverage point, Costa Mesa runs about 20–30 minutes depending on the
      55 freeway. Same-day slots are available most days — call (323) 870-4790 before noon and
      we can usually get a technician out to Mesa Verde or Eastside by late afternoon. Evening
      appointments available Tuesday through Saturday."
  - q: "Do you repair Bosch and KitchenAid dishwashers?"
    a: "Both, regularly. Bosch 300/500 Series repairs in this area usually involve spray arm
      replacement or control board resets after hard water trips the sensors. KitchenAid 24-inch
      built-ins often need detergent dispenser actuators or heating element replacements. Samsung
      and LG are also common here — we stock OE and OEM-equivalent parts for all four brands."
  - q: "What does a dishwasher repair typically cost, and is same-day service available?"
    a: "Diagnostic fee is flat — applied toward the repair if you proceed. Most drain pump or
      door latch fixes land in the $120–$220 range depending on parts. Heating element or control
      board jobs run higher. Same-day and emergency slots exist — schedule at (323) 870-4790 or
      online. We cover Costa Mesa, Irvine, and up through Santa Clarita."

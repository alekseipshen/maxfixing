title: "Costa Mesa Refrigerator Repair — Mesa Verde Ranch Kitchens & Beyond"

intro: |
  Mesa Verde's 1960s ranch layouts look spacious until you try pulling a KitchenAid
  french-door away from the wall to diagnose a compressor issue. The cabinetry is flush,
  the tile is original, and there's maybe 14 inches of clearance behind the unit.
  Coastal humidity off Newport Bay adds another variable — door gaskets soften and seal
  poorly faster here than in the Valley. These are the real conditions we work in
  across Costa Mesa every week.

localContext: |
  The 92626 zip covers Mesa Verde's post-war ranch stock — homes built between
  1955 and 1972 with kitchens that were designed around appliances a fraction of the
  size of today's Bosch and Samsung models. Over on the Eastside near 19th Street,
  you get tighter lots and more rentals, which means older, harder-used refrigerators
  with deferred maintenance. South Coast Metro area has seen condo conversions where
  built-in Sub-Zero units are common — those require specialized tooling most
  generalists don't carry.

commonProblems:
  - title: "Evaporator Coil Icing Over — Especially in Older Units Running Hard in Summer"
    description: |
      August in Costa Mesa means refrigerators cycle almost continuously. When the
      defrost timer or defrost heater fails, ice accumulates on the evaporator coil
      and the unit stops cooling even though the compressor runs. Samsung french-door
      models — extremely common in the 92626 area — are known for this failure pattern
      around the 4-6 year mark. The fix involves manual defrost, part replacement, and
      checking the control board logic that governs the defrost cycle.

  - title: "Ice Maker Assembly Failures from Costa Mesa's Mineral Load"
    description: |
      Orange County tap water runs between 250-400 ppm total dissolved solids depending
      on the season and source blending. That mineral content calcifies the water inlet
      valve and clogs the ice maker fill tube within 2-3 years on LG and KitchenAid
      units without a dedicated filter. Scale buildup in the ice maker assembly is
      the single most common service call we run in this zip. A replacement inlet valve
      is about a 45-minute job once we have access.

  - title: "Compressor Noise and Warm Spots in Built-In Sub-Zero Units"
    description: |
      The South Coast Metro condos and newer Eastside rebuilds often feature
      Sub-Zero 700-series built-ins. When the condenser fan motor starts grinding or
      the compressor runs loud and the fresh food compartment hits 48°F, it's usually
      the condenser fan or a refrigerant charge issue — not the compressor itself.
      Misdiagnosing that costs homeowners thousands in unnecessary compressor replacements.
      We carry the tools specific to Sub-Zero's dual-compressor architecture.

faq:
  - q: "How fast can you get to Costa Mesa for refrigerator repair?"
    a: |
      Usually within 2 hours from our South Bay and Irvine-area coverage zones.
      Costa Mesa sits right off the 405 and 55 interchange — straightforward access
      from most directions. Same-day slots are available most weekdays. Call us at
      (323) 870-4790 to check morning availability.

  - q: "Do you service Bosch and LG refrigerators specifically?"
    a: |
      Yes — Bosch french-door and counter-depth units are common in Mesa Verde renovations,
      and we stock the door gasket and drain pump components they fail on most often.
      LG linear compressor models have their own diagnostic process we run regularly.
      Samsung, KitchenAid, and Sub-Zero are also in regular rotation for us in Costa Mesa.

  - q: "What does a refrigerator diagnostic visit cost, and can you fix it the same day?"
    a: |
      Diagnostic is a flat fee applied toward the repair if you proceed. Most compressor,
      thermostat, and ice maker jobs get resolved same visit — we carry common parts
      for LG, Samsung, and KitchenAid in the van. Evening slots are available for
      working households. Schedule online or call (323) 870-4790 for same-day booking.

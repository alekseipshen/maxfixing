title: "Duarte Ice Maker Repair — Hard Water Kills Ice Faster Here"

intro: |
  Ranch homes along Buena Vista Street and the newer builds near Royal Oaks Park run the gamut of refrigeration — Samsung french-doors, KitchenAid built-ins, the occasional Sub-Zero on the larger lots near the Bradbury city line. Hard to miss what they all share, though. San Gabriel Valley tap water in 91010 regularly tests above 300 mg/L hardness. That mineral content clogs the fill valve and coats the ice maker assembly faster than most of LA County. Cloudy cubes come first. Then smaller ones. Then nothing at all.

localContext: |
  Housing throughout 91010 is mostly 1960s and 1970s ranch-style, with galley kitchens that weren't designed around today's counter-depth built-ins or French-door refrigerators. Getting a service van onto the narrower side streets off Huntington Drive and pulling a refrigerator out of a flush-mounted cabinet slot takes extra planning — that's just part of working in Duarte. On the east side of zip 91010, newer condo and townhome developments near the Duarte Community Center add a different wrinkle: compact under-counter ice makers where the drain pump sits behind a toe-kick panel and there's almost no working room.

commonProblems:
  - title: "Calcified Fill Valve From SGV Hard Water"
    description: |
      San Gabriel Valley hard water leaves calcium scale on the water inlet valve until it either fails to open — cutting off ice production entirely — or fails to close, flooding the ice bin overnight. Samsung and LG French-door models show this failure mode early: cube output shrinks and cubes come out misshapen before the valve stops working altogether. Swapping the water inlet valve is a clean one-hour job that restores full cycle times without touching anything else in the system.
  - title: "Frozen Fill Tube During Summer Heat Cycles"
    description: |
      Valley heat pushes refrigerator compressors into long, aggressive cycles. When the freezer side overshoots, the water fill tube feeding the ice maker mold freezes solid — you get one icy clump blocking the chute instead of individual cubes dropping. KitchenAid built-in units hit this problem most when the condenser fan motor starts to drag or the condenser coils are overdue for a cleaning. Clearing the frozen fill tube and checking fan speed usually resolves it without replacing the full ice maker assembly.
  - title: "Sensor Errors on LG ThinQ and Bosch Models"
    description: |
      LG ThinQ refrigerators throw an IE or CF error code when the optical ice level sensor can't read the bin correctly — the unit stops producing ice even with the bin nearly empty. Bosch French-door models have the same failure mode: condensation gradually fogs the sensor lens until it misreads bin level entirely. Cleaning or replacing the sensor board runs about 45 minutes on-site and doesn't require opening the refrigerant system.

faq:
  - q: "How fast can you get to Duarte for ice maker repair?"
    a: |
      From our Pasadena-area dispatch point, Duarte is a straight shot east on the 210 — typically 25 to 35 minutes depending on traffic at the 605 interchange. Same-day slots are available most weekdays and occasional Saturdays. Call (323) 870-4790 and we can usually have a technician there within 2 hours. Evening appointments are open too — just mention it when you book.
  - q: "Do you repair Samsung, LG, and KitchenAid ice makers in Duarte?"
    a: |
      Samsung, LG, and KitchenAid make up roughly 65% of what we service in the Duarte area. Typical repairs: water inlet valve replacement, ice maker assembly swap, optical sensor board reset, control board diagnostics. Bosch, Sub-Zero, and Thermador built-ins are in our wheelhouse as well. Sub-Zero ice makers need brand-specific tooling — mention the model number when you call so we arrive with the right parts.
  - q: "What does ice maker repair cost in Duarte, and how long does it take?"
    a: |
      Most ice maker repairs in Duarte run between $120 and $280 for parts and labor combined. A water inlet valve swap lands on the lower end; a full ice maker assembly replacement on a KitchenAid or Thermador built-in runs higher. Simple jobs take under an hour on-site. Call (323) 870-4790 or schedule online — same-day service is available most weekdays, and emergency evening slots open up regularly.
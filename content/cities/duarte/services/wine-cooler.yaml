title: "Duarte Wine Cooler Repair — SGV Heat Kills Compressors"

intro: |
  Ranch homes along Huntington Drive — the stretch that traces Historic Route 66
  right through Duarte — were built in the 1950s for families with one refrigerator
  and zero wine storage. Today those same kitchens are squeezing KitchenAid
  dual-zone coolers into pantry nooks with barely two inches of clearance on either
  side.

  Summer in the 91010 zip code regularly hits 95°F, and a compressor already
  running in a poorly ventilated cabinet does not last long. We've pulled units
  out of built-ins near the City of Hope campus where the ambient garage temp
  was pushing 102°F at noon. The cooler had been running continuously for eleven
  weeks before it finally quit.

  Same-day service is usually available for Duarte. Call (323) 870-4790 and we'll
  confirm a window.

localContext: |
  Most of Duarte's housing stock dates from the postwar era through the mid-1970s —
  single-story ranch layouts with shallow cabinet depth and kitchens that were never
  planned around dedicated wine storage.

  The neighborhoods east of Highland Avenue toward Encanto Parkway have seen heavy
  remodeling over the last decade. That's where we're finding Bosch and Sub-Zero
  under-counter units retrofitted into original cabinetry. Tight fits block
  condenser airflow and wear out the compressor far faster than the manufacturer
  rates assume.

  Up near the 91010 border with Bradbury — the wealthier pocket where lot sizes
  jump and the homes sit back from Foothill Boulevard — the installs are newer but
  the problem shifts. Thermador and Sub-Zero columns in those larger kitchens often
  develop evaporator icing issues when the door gasket starts failing. Temperature
  swings show up before anything visible does. The unit reads 55°F on the panel;
  your Pinot is sitting at 63°F. That gap is the first sign something is wrong.

  Hard water is the other constant. Duarte's municipal supply pulls from the same
  San Gabriel Basin that serves most of the eastern San Gabriel Valley — calcium
  hardness regularly tests above 300 mg/L. That accumulation gets into drain
  channels and coils faster than most homeowners expect.

commonProblems:
  - title: "Compressor Overheating from Valley Heat and Zero Ventilation Gap"
    description: |
      A KitchenAid wine cooler jammed under a 1960s cabinet with no clearance is
      going to run its compressor continuously. In Duarte summers that means the
      motor runs hot for months straight. The compressor itself eventually locks up —
      or the condenser fan fails first, which produces the same result.

      Either way, the unit stops cooling and the bottles hit room temperature fast.
      On newer KitchenAid dual-zone models, the control board throws an E5 or
      high-temp error before full shutdown. If you're seeing that code, the condenser
      fan is usually the first thing to check before assuming compressor failure.
      Fan replacement runs a fraction of what a full compressor swap costs.

  - title: "Hard Water Mineral Buildup Clogging the Evaporator Coil"
    description: |
      Duarte sits in one of the harder-water zones in LA County. Calcium deposits
      accumulate on the evaporator coil and inside drain channels, restricting heat
      exchange.

      On LG and Bosch units this appears as temperature fluctuation — the display
      reads 54°F but the bottles are closer to 62°F. Descaling the exterior won't
      reach a coil that's already partially blocked inside. The fix involves
      pulling the unit, accessing the evaporator housing, and doing a proper
      chemical flush. It's a two-hour job but it restores cooling capacity without
      replacing any major components.

  - title: "Door Gasket Hardening on Older Sub-Zero Wine Columns"
    description: |
      Sub-Zero wine columns installed during early-2000s kitchen remodels throughout
      the Royal Oaks neighborhood develop gasket brittleness after 15 or more years.
      A cracked door seal lets warm room air infiltrate continuously, forcing the
      unit to cycle harder.

      You'll see temperature swings of 8–10 degrees and a compressor that never
      fully shuts off — classic door gasket leak pattern. Sub-Zero uses a magnetic
      compression gasket that's model-specific; generic replacements don't seal
      correctly and the problem comes back within months. We stock the correct
      gasket profiles for the most common 700 and 400 series wine column models
      so the fix holds.

faq:
  - q: "How fast can you get to Duarte for wine cooler repair?"
    a: |
      We run a San Gabriel Valley route that covers 91010 directly — usually
      on-site within 2 hours on weekdays. Evening slots are frequently available
      for Duarte calls. Dial (323) 870-4790 and we'll confirm same-day
      availability right then.

  - q: "Do you repair Bosch and Sub-Zero wine coolers specifically?"
    a: |
      Yes. Bosch under-counter units are common in the remodeled homes east of
      Highland Avenue — we frequently replace their drain pump assemblies and
      faulty control boards. The 500 series units sometimes develop inlet valve
      issues that mimic a compressor problem; the diagnostic matters before
      ordering parts.

      Sub-Zero wine columns require brand-specific tooling. We stock door gaskets,
      thermostats, and compressor parts for the most common residential models.
      For the columns installed in the larger Bradbury-adjacent homes, bring
      the model number when you call — Sub-Zero part availability varies and
      we'll check inventory before scheduling.

  - q: "What does a wine cooler diagnostic cost, and how does the repair process work?"
    a: |
      Flat-rate diagnostic, credited toward the repair if you proceed. Most fixes —
      compressor swap, evaporator coil cleaning, door seal replacement — run
      $150–$380 depending on brand and part.

      Same-day scheduling is usually open for Duarte. Call (323) 870-4790 or
      book online; we'll get there the same day in most cases, or first thing
      the next morning if you call after 4 PM.

  - q: "My wine cooler is running but the temperature won't stabilize — what's wrong?"
    a: |
      Three common causes: failing door gasket, partially blocked evaporator coil
      from mineral buildup, or a thermostat going out. In Duarte specifically,
      the hard water issue is behind more of these calls than anything else.

      Pull the unit out from the cabinet if you can safely do so — check whether
      the condenser coils on the back are coated with dust. That alone can cause
      temperature instability in summer. If the coils look clear and the door
      seal feels soft or cracked, that's your answer. Either way, call
      (323) 870-4790 and describe what the display is reading — we can usually
      narrow it down before the visit.
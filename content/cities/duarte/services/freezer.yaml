title: "Duarte Freezer Repair — 91010 Heat and Hard Water Fixes"

intro: |
  City of Hope sits just north of Huntington Drive in 91010, and the
  surrounding residential blocks are full of 1960s ranch homes where
  homeowners have since upgraded to Bosch counter-depth refrigerators, LG
  French-door units, and the occasional KitchenAid built-in column freezer.
  Inland San Gabriel Valley summers don't let up — freezers in Duarte cycle
  hard from May through October, and the combination of triple-digit garage
  temps and notoriously hard local water accelerates parts failures faster
  than most manufacturers' service intervals assume.

localContext: |
  Zip 91010 covers nearly all of Duarte's residential streets — Royal Oak
  Avenue, Buena Vista Street, the corridors running north of Huntington Drive
  where post-war ranch homes from the late 1950s sit on wide lots. Kitchens
  in those houses were designed around 24-inch freestanding units, not the
  36-inch French-door or panel-ready column freezers that homeowners have
  installed during remodels. That means tight installation clearances and, in
  some cases, modified cabinet openings that slow down service access
  considerably.

  The northern edge of the city, toward the foothills near Encanto Park, has
  newer construction mixed in — but even there, the water hardness issue is
  constant. SGV municipal water blends Metropolitan Water District imports
  with local groundwater, and the resulting mineral content sits high enough
  to coat evaporator coils and clog defrost drain tubes on any freezer brand,
  Sub-Zero or Frigidaire, it doesn't matter.

commonProblems:
  - title: "Hard Water Destroying Defrost Systems in SGV Homes"
    description: |
      San Gabriel Valley tap water runs consistently hard — mineral deposits
      clog defrost drain tubes and coat the evaporator coil faster than most
      homeowners expect. Calcium builds up on the coil surface, cutting heat
      transfer until frost accumulates thick enough to block airflow entirely.
      LG French-door units are especially susceptible because the defrost
      drain path winds through the rear panel before reaching the drip tray.

      A thermal fuse failure often follows severe ice buildup — once that
      blows, the defrost circuit goes dead and the coil ices solid within
      48 hours. LG units displaying error codes FF or ER FF are almost always
      showing this exact fault chain. Clearing the drain, replacing the fuse,
      and confirming the defrost heater fires on schedule usually puts the
      unit back in service in a single visit.

  - title: "Compressor Stress from Sealed Garage Temps"
    description: |
      August afternoons in Duarte push garage interiors past 100°F. A freezer
      in a poorly ventilated side garage runs its compressor almost
      continuously under those conditions — and the condenser fan motor burns
      out first, since it can't pull enough ambient air across the condenser
      coil to keep refrigerant temps in range. Samsung chest freezers stored
      in side garages off Buena Vista Street show this failure pattern
      regularly.

      Dirty condenser coils make the problem significantly worse. Dust and
      pet hair clog the coil and cut airflow to near zero. A condenser fan
      motor swap plus a thorough coil cleaning typically brings these units
      back. If the compressor itself has seized — you'll hear a clicking relay
      trying to restart it — that's a repair-vs-replace conversation, and
      we'll give you that answer on the same visit.

  - title: "Door Gasket Failure on Aging Ranch-Home Appliances"
    description: |
      Freezers hitting 12–15 years in these 1960s-era Duarte homes are
      showing door gasket failures at a steady rate — KitchenAid and Bosch
      bottom-freezer drawers especially. The gasket hardens and pulls away
      from the frame in low-humidity indoor conditions, letting warm air seep
      in continuously. Temperature fluctuation shows up first: the unit cycles
      more often, can't hold a stable setting, and frost accumulates unevenly
      on the interior walls.

      The dollar-bill test is fast: close the freezer door on a bill at each
      corner. If it slides out without resistance, the gasket is gone.
      KitchenAid and Bosch replacement gaskets run $40–80 in parts; reseating
      them correctly takes about 30 minutes of labor. Catch it before the
      evaporator coil ices solid and the repair stays simple.

faq:
  - q: "How fast can you get to Duarte for freezer repair?"
    a: |
      The 210 Freeway makes 91010 easy to reach from both our Pasadena and
      Azusa service areas — Duarte sits squarely in the middle of our San
      Gabriel Valley route. Most calls get same-day confirmation within the
      hour. Call (323) 870-4790 and we'll give you an arrival window the same
      morning.

  - q: "Do you repair KitchenAid and LG freezers in Duarte?"
    a: |
      Both are among our most common calls in the SGV. LG French-door freezer
      sections regularly need ice maker assembly replacement or defrost drain
      clearing. KitchenAid column freezers have documented control board and
      door gasket issues we see constantly. Bosch, Samsung, and Sub-Zero
      built-ins too — we carry parts for all of them.

  - q: "What does freezer repair cost in Duarte, and can you come the same day?"
    a: |
      Most repairs in 91010 run $150–$350 depending on the fault. A gasket
      swap or drain pump clearing sits at the low end; compressor diagnosis
      runs higher. If food is at risk overnight, that's an emergency — call
      (323) 870-4790 and we'll confirm same-day availability within 20
      minutes. Evening slots are open most weekdays.
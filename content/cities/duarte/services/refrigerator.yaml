title: "Duarte Refrigerator Repair — SGV Heat and Hard Water Fixes"

intro: |
  Huntington Drive runs east through Duarte past the City of Hope campus, flanked by ranch-style
  homes from the 1960s where kitchens were sized for a basic Kenmore top-freezer — not the
  KitchenAid french-door unit the current owners installed five years ago. July and August in the
  San Gabriel Valley push ambient kitchen temps past 95°F regularly. Refrigerators crammed into
  south-facing kitchens or enclosed alcoves run near their thermal limits all afternoon. That
  strain accumulates quietly. By late August, compressors start announcing themselves — usually
  at 11 PM when the house finally cools down and the temperature delta hits hardest.

localContext: |
  The 91010 zip code is almost entirely single-story residential — ranches and some newer infill
  builds along Royal Oaks Drive and Buena Vista Street that went up between 1960 and 1980. Those
  kitchens were designed around freestanding 30-inch models. Nobody built clearance for a
  Sub-Zero column or a counter-depth LG. Homeowners who've since upgraded often have restricted
  condenser ventilation they're completely unaware of, quietly shortening the compressor's
  service life. Older homes near Duarte Road and Mountain Avenue sometimes still have the
  original cabinet layout intact, which makes installation-day decisions matter years later.

commonProblems:
  - title: "Condenser Overload During San Gabriel Valley Summers"
    description: |
      Valley summers push your refrigerator's condenser fan and compressor harder than the
      manufacturer's rated operating range allows. Duarte's dry summer air moves enough fine
      particulate to coat condenser coils within a few months, dropping cooling efficiency by
      20-30%. A KitchenAid or LG counter-depth unit running warm in August is usually suffering
      from restricted airflow at the condenser — not a failed compressor. Cleaning the coils and
      bench-testing the condenser fan motor often resolves the problem without touching the
      refrigerant circuit at all. Misdiagnosis here is expensive and unnecessary.

  - title: "Ice Maker Failures From Hard Water Mineral Buildup"
    description: |
      Duarte water tests in the 350-400 ppm hardness range — well above the soft-water threshold
      and one of the harder sections of the San Gabriel Valley. Calcium scale coats the interior
      of the water inlet valve, plugs ice maker fill tubes, and causes water to pool beneath
      crisper drawers. Samsung and LG french-door models with in-door ice makers hit this
      failure pattern most often, usually around year four or five. Replacing the inlet valve and
      flushing the ice maker assembly typically resolves both the leak and the ice production
      drop in a single visit.

  - title: "Short-Cycling Compressor and Thermostat Error Codes"
    description: |
      A compressor kicking on for two minutes, off for one, then back on again is short-cycling —
      typically a failing start relay, fouled condenser coils, or low refrigerant pressure. Bosch
      built-in columns in the newer construction near Encanto Parkway show thermostat malfunction
      differently: a blinking control display or an E1 error code rather than noise. The thermostat
      assembly directly governs when the compressor runs. Misreading cabinet temperature by even
      three or four degrees causes exactly this repetitive cycling pattern, and sustained
      short-cycling will burn out a compressor that otherwise had years left in it.

faq:
  - q: "How fast can you get to Duarte for refrigerator repair?"
    a: |
      Straight east run on the 210 puts us in 91010 fast — most calls get a same-day slot, usually
      within two hours of booking. Call (323) 870-4790 to check morning availability; slots open
      by 8 AM most days, and we can route around traffic on Huntington Drive if needed.

  - q: "Do you repair LG, Samsung, and KitchenAid refrigerators in Duarte?"
    a: |
      Those three brands are the majority of what we see in this part of the valley. LG linear
      compressor replacements, Samsung ice maker rebuilds, KitchenAid drain pump and water inlet
      valve jobs — all standard. Sub-Zero and Bosch built-ins need specific tooling; we carry what
      those units require. Most brand diagnostics run 30-45 minutes on-site.

  - q: "What does refrigerator repair typically cost, and how does scheduling work?"
    a: |
      Diagnosis is $75-90 and credits toward the repair. Door gasket replacement runs $130-180
      depending on the model. Compressor or control board work on LG or KitchenAid typically
      lands between $350-600. Same-day and emergency slots are available most days — call
      (323) 870-4790 or schedule online. Evening appointments are also an option.
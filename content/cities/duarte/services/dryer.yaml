title: "Duarte Dryer Repair — SGV Heat Accelerates Part Failure"

intro: |
  Summer afternoons in Duarte regularly hit 100°F on the thermometer — and dryers
  on the back porches and utility closets along Royal Oaks Avenue are running inside
  already-warm homes. That thermal stress lands hardest on the heating element and
  thermal fuse. The Samsung front-load units popular in 91010 tract homes see thermal
  fuse failures at a higher rate than the same model running in coastal Torrance or
  Redondo Beach. Heat compounds heat.

  City of Hope sits two miles from the center of Duarte. A lot of hospital staff
  and medical researchers live in the neighborhoods between Huntington Drive and
  Buena Vista — dual-income households that run laundry daily and can't wait a week
  for a repair window. Same-day slots in 91010 are available most days; call before
  9 AM at (323) 870-4790 and we can usually be there before lunch.

localContext: |
  Duarte's housing stock is mostly post-war construction — 1950s and 1960s ranch
  homes throughout the Huntington Drive corridor and newer infill between Buena Vista
  Street and Bradbourne Avenue. Utility closets in the older stock are narrow,
  sometimes 28 inches wide, which makes service access tricky and allows lint to
  pack around the blower wheel for years unnoticed.

  Royal Oaks properties and a handful of 1980s two-story builds near the City of
  Hope campus run full-size pairs where the drum rollers take heavy loads — family
  households running 10 to 14 loads a week, not singles. Further east toward Azusa
  Avenue, some of the larger lots have detached garages converted into laundry rooms
  with undersized exhaust runs — a setup that kills moisture sensors and thermal
  fuses faster than anything else we see in this part of the San Gabriel Valley.
  Those improvised utility spaces almost never have adequate duct routing, and the
  blower wheel ends up fighting a full column of lint-packed flex hose.

commonProblems:
  - title: "Thermal Fuse Blows in Summer — SGV Homes Run Hot"
    description: |
      A dryer in a closed utility closet in 91010 in August is pushing against
      ambient air that's already 85°F indoors. The thermal fuse, designed to cut
      power when exhaust temp climbs too high, trips well before it should. LG
      electric dryers throw a d80 or d90 restricted airflow code before the fuse
      goes entirely — that code is the machine telling you the exhaust run is
      blocked, not that the fuse itself is defective.

      Replacing the fuse without cleaning the full exhaust run fixes nothing. It
      blows again in two weeks. Every thermal fuse call we do in Duarte includes
      a full duct inspection: length, bend count, and condition of the termination
      cap. A single 90° elbow packed with lint adds the same backpressure as five
      extra feet of duct.

  - title: "Drum Won't Spin — Worn Rollers in Aging Ranch-Style Homes"
    description: |
      The drum rollers in a Whirlpool or Maytag dryer that's been running in a
      single-family Duarte home since the Clinton administration are well past their
      design life. The symptom is a grinding noise at startup, then the drum stops
      rotating mid-cycle. The drive belt usually survives — it's the rollers and
      the belt tensioner pulley that wear first.

      About 90 minutes to swap on-site. Roller kits for the most common Whirlpool,
      Maytag, and Samsung platforms ride on the van already, so there's no waiting
      on a parts order. If the drum bearing is also worn, that adds another 30
      minutes and a separate part — but it's worth doing at the same visit rather
      than two trips.

  - title: "Long Dry Times — Lint and Hard Water Kill Moisture Sensors"
    description: |
      SGV water is aggressive — mineral deposits coat the moisture sensor strips
      inside the drum on KitchenAid and Bosch condenser dryers after a year or
      two of use. The machine reads 'dry' before the load actually is, ending
      the cycle early. Cleaning the sensor strips sometimes fixes it; if the control
      board has logged too many bad readings, the sensor assembly needs replacement.

      Either way, the dryer stops guessing correctly. Long dry times — two full
      cycles to get a load to come out dry — are the first signal. That symptom
      points to the moisture sensor before the heating element. Misdiagnosing it
      means replacing a part that wasn't the problem.

faq:
  - q: "How fast can you get to Duarte for dryer repair?"
    a: |
      Routing daily out of the San Gabriel Valley — from Monrovia, Duarte is under
      15 minutes. Same-day slots are usually open if you call before 9 AM at
      (323) 870-4790. Evening appointments exist for anyone who can't leave work
      mid-day. Parking is straightforward on most residential streets in 91010;
      none of the van-access issues that come up in denser West LA neighborhoods
      near the 405.

  - q: "Do you repair LG and Samsung dryers in Duarte?"
    a: |
      Yes — LG and Samsung are the two most common brands we see in 91010. On LG
      units the drum roller assembly and moisture sensor are the frequent failures.
      Samsung front-loaders often need the heating element replaced after the
      thermal fuse blows from restricted airflow. Both parts ride on the van.

  - q: "What does a dryer repair cost, and do you do same-day service?"
    a: |
      Most repairs land between $120 and $260 depending on parts. Thermal fuse
      replacement is on the lower end; control board swaps push toward the top.
      Same-day service is available most days — call (323) 870-4790 and we'll
      confirm the window before heading out. Evening slots exist if daytime
      doesn't work.
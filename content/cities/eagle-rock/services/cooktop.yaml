title: "Eagle Rock Cooktop Repair — Old Kitchens, Real Gas Lines"

intro: |
  Colorado Boulevard cuts right through Eagle Rock, and on either side of it you've got
  decades of residential kitchens — Craftsman bungalows near Yosemite Drive, Spanish Colonial
  Revival houses closer to Figueroa, a lot of them still running the same GE or Kenmore
  drop-in gas cooktops they came with when the house was remodeled back in the 80s or 90s.
  Those units work fine until they don't. A cracked ceramic surface on a GE gas cooktop
  means the burner can't seal around the cap properly — gas pools beneath the head instead
  of igniting clean. Calls come in constantly about burners that click endlessly but won't
  light, or one side of a four-burner Whirlpool that suddenly stopped heating evenly.
  Rental units near Occidental College get heavy daily use with zero maintenance attention,
  which accelerates the wear on every moving part. If your cooktop's acting up, call us at
  (323) 870-4790 — same-day service is usually available, and we'll give you a straight
  answer before touching anything.

localContext: |
  Most of Eagle Rock sits in the 90041 zip code, with the eastern fringe of the neighborhood
  bleeding into 90065 near the Cypress Park boundary. The housing stock is older than many
  people expect — the densest residential blocks between Caspar Avenue and Eagle Rock
  Boulevard date mostly to the 1930s through the 1950s, and kitchen layouts in those homes
  are genuinely tight. Drop-in cooktops in older cabinetry often don't meet current
  clearance standards, which creates real access problems when a technician needs to pull
  the unit to reach the wiring harness or inspect the gas valve from underneath. Rental
  properties north of Colorado near Figueroa Street — a lot of them converted from single-
  family to multi-unit in the 1970s — tend to have surface cooktops that haven't seen a
  service call since installation. LA's hard water compounds everything here: mineral
  deposits clog sealed burner ports and trigger ignition misfires that look identical to a
  failed spark module, when the actual fix is cleaning the burner cap and clearing the
  orifice ports. Knowing the difference saves homeowners a $200 part they don't need.

commonProblems:
  - title: "Igniter Clicks Endlessly But Nothing Lights — Eagle Rock Gas Cooktops"
    description: |
      The cooktop clicks, sometimes for 10 or 15 seconds straight, and the burner never
      catches. This is the most common call from 90041 households, and the culprit is almost
      never the gas supply line. On sealed-burner Kenmore and GE gas cooktops, the spark
      igniter electrode sits millimeters from the burner head — if it's cracked, or coated
      with cooking grease and mineral buildup from Eagle Rock's hard tap water, the spark
      won't bridge the gap cleanly. Sometimes the spark module itself fails, which means
      none of the burners will respond even when you hold the knob down and listen to the
      clicking. Replacing a spark module on a GE Profile gas cooktop runs $120–$160 in
      parts; a single igniter electrode is usually under $40. Both parts travel on the
      service truck, so this is typically resolved in one visit. Call (323) 870-4790 to
      schedule a same-day appointment.

  - title: "Cracked Ceramic Glass Surface on Electric Cooktops"
    description: |
      Ceramic glass cooktop surfaces — Samsung and Frigidaire are the two brands showing up
      most often in Eagle Rock's apartment conversions along Figueroa — crack from thermal
      shock or a dropped cast-iron pan. A hairline crack isn't just cosmetic. If it runs
      across or near a radiant element, heat distribution goes uneven across the cooking
      zone, and liquid spills can reach the wiring harness beneath the glass. That's a
      legitimate fire risk, not something to cover with tape and ignore. Replacing the
      ceramic glass panel on a Samsung NE-series electric cooktop typically runs $200–$350
      for the panel alone, plus labor. If the surface element switch underneath took heat
      damage too, add another $80–$120. Units under 8 years old almost always make more
      financial sense to repair than to replace outright — we'll tell you which category
      yours falls into before we quote anything.

  - title: "Uneven Heat and Burner Output Dropping Mid-Cook"
    description: |
      A burner that runs hot on one side or drops unexpectedly to a low simmer usually
      points to a failing surface element switch or a partially blocked burner orifice port.
      On gas cooktops — the Whirlpool WCG97US0H is a common unit in Eagle Rock rentals —
      the orifice can clog from grease and mineral scale over time, starving the burner of
      consistent gas flow. The fix involves pulling the burner cap, soaking the port
      assembly, and verifying gas pressure at the valve. On electric models, the surface
      element switch controls current delivery to the coil; when it starts failing, it
      sticks between power settings. Any gas valve or line work in Eagle Rock falls under
      LADBS jurisdiction — the City of Los Angeles — and requires a licensed contractor.
      MaxFixing operates under contractor license and pulls required permits before
      any gas connection work. A full burner service call runs 1–2 hours on site.

  - title: "Knob Spins Freely Without Controlling the Burner"
    description: |
      Knobs crack, strip internally, or start spinning without resistance — it sounds like
      a minor annoyance until you realize the burner isn't actually responding to what your
      hand is doing. The control knob assembly on Amana and Frigidaire freestanding cooktops
      connects through a D-shaft fitting to a gas valve stem; when the knob's interior
      sleeve wears down, you lose physical control of gas flow entirely. That's a hazard,
      not just an inconvenience. OEM replacement knobs run $15–$35 each, but some
      discontinued Kenmore models require aftermarket alternatives that we stock in the van.
      If the valve stem itself is damaged — which happens when a worn knob gets forced —
      a full knob-and-valve assembly replacement runs $180–$260 including labor. Evening
      appointment slots are available for 90041 residents who can't rearrange a work day
      around a service call.

  - title: "Electrical Connections Overheating on Electric Cooktops"
    description: |
      Electric cooktops in Eagle Rock's pre-1960 homes sometimes share circuits that
      weren't designed for modern appliance load. A Frigidaire or GE electric cooktop
      running on an undersized circuit will trip breakers repeatedly, or cause the terminal
      block to overheat under load. Scorch marks around the connection point and a faint
      burning-plastic smell when the burner is on high are the giveaways. The terminal
      block is a common failure point: screw connections loosen over time, arc, and damage
      the wiring harness. Replacing a terminal block runs $60–$100 in parts; if the harness
      is compromised, figure $150–$220 total for the repair. The underlying circuit capacity
      issue is separate and needs a licensed electrician to address — we're straight about
      that. Fixing the cooktop doesn't help if the wiring problem will burn out the next
      unit inside two years.

faq:
  - q: "How fast can you get to Eagle Rock for cooktop repair?"
    a: |
      Eagle Rock is about 20 minutes from our base on a clean traffic run — via the 2
      Freeway or surface streets up York Boulevard, depending on time of day. Same-day
      appointments are generally available if you call before noon at (323) 870-4790.
      Parking on the residential blocks off Colorado and up into the hillside streets near
      the Eagle Rock Reservoir runs tight, but we're accustomed to working from a standard
      service van in close quarters. A typical cooktop repair — igniter swap, burner
      cleaning, knob replacement — takes 1–2 hours on site. The estimate is free and
      confirmed before any work starts.

  - q: "What does cooktop repair typically cost in Eagle Rock?"
    a: |
      It depends on what failed. A single igniter electrode swap runs $85–$120 all in.
      Spark module replacement lands around $160–$220. Ceramic glass surface replacement
      on an electric cooktop is $280–$450 depending on the model and sourcing. Gas valve
      and knob assembly work comes in at $180–$300. Call (323) 870-4790 and describe what
      your cooktop is doing — igniter clicking, no heat, cracked glass, knob spinning free
      — and we can usually rough-quote it over the phone before the visit. On-site
      estimates are free, and you'll see the exact price before we touch anything.

  - q: "Do cooktop repairs in Eagle Rock require permits from the city?"
    a: |
      Eagle Rock is inside the City of Los Angeles, so permits go through LADBS — the
      LA Department of Building and Safety — not a separate municipal office. Simple part
      swaps like igniter electrodes, knobs, and surface elements don't require a permit.
      Gas valve replacements and any modification to the gas supply connection do require
      one. MaxFixing holds contractor license and prepares all permit paperwork
      when the job calls for it. LADBS processes most minor appliance gas permits online
      within 1–3 business days. We'll flag upfront if your specific repair crosses into
      permit territory so there are no surprises.

  - q: "Do you repair both gas and electric cooktops in Eagle Rock?"
    a: |
      Both types, yes. Gas cooktops dominate the older housing stock in 90041 — Kenmore,
      GE, and Whirlpool are the most common units in the Craftsman and Spanish Colonial
      homes around Yosemite Drive and Glen Arbor. We carry igniter electrodes, spark
      modules, gas valves, and burner components for all three brands on the truck. Electric
      cooktops — Samsung and Frigidaire mostly — require different diagnostics: surface
      element resistance testing, switch continuity checks, terminal block inspection.
      Induction cooktops are less common in this neighborhood but we service those too.
      A model number off the interior frame is all we need to pull the right parts before
      the visit.

  - q: "How long will a repaired cooktop last in Eagle Rock's conditions?"
    a: |
      A properly replaced igniter or gas valve should run another 5–8 years under normal
      household use. Ceramic glass panels, once swapped, are as durable as the original —
      thermal shock and blunt impact are the only real threats to them. The ongoing variable
      in Eagle Rock is hard water: mineral buildup in burner ports shortens igniter life and
      causes misfires that cost more to fix each time they recur. An annual burner port
      cleaning — a 30-minute service call — prevents the $150-plus igniter replacement from
      becoming a recurring expense every couple of years. Parts we install come with a
      90-day labor warranty, and we source components to OEM specification or better.

  - q: "What other areas near Eagle Rock do you service for cooktop repair?"
    a: |
      Coverage runs from Eagle Rock west into Glassell Park and Atwater Village, north up
      to La Cañada Flintridge, and east through Pasadena into Arcadia. Neighboring zip codes
      like 90065 and 91103 are on our regular rotation. Scheduling for Eagle Rock and
      adjacent neighborhoods is typically same-day or next morning. Evening appointments
      are available Tuesday through Friday for homeowners who can't take time off work.
      Call (323) 870-4790 — if you're within 15 minutes of Occidental College, you're
      comfortably inside our service area, and we can usually confirm a window within
      a few hours of your call.
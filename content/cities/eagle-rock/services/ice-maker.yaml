  - q: "What does ice maker repair typically cost in Eagle Rock?"
    a: |
      Repairs range from about $115 for a sensor cleaning and recalibration up to $260-$280 for a full
      OEM assembly replacement on a GE or Whirlpool unit. The most common jobs — inlet valve swap, frozen
      fill tube fix, thermostat replacement — land between $140 and $200 all-in, parts and labor. Hard
      water damage that has spread into the supply line or clogged the water filter housing can push the
      total higher. Exact pricing comes after the on-site diagnostic inspection. No hourly billing, no
      surprise charges — you approve a flat quote before we touch anything.

  - q: "Do Eagle Rock landlords or property managers need to authorize ice maker repairs?"
    a: |
      For rental units — and there are many near Occidental College in 90042 — we need authorization from
      whoever owns the appliance before starting work. A quick phone call or email from the property
      management company is sufficient. Tenants handle the scheduling logistics on their end; we just need
      that authorization documented. Same-day repair windows are easier for tenants and property managers
      to coordinate than multi-day waits, and we work to keep turnaround tight. Call (323) 870-4790 and
      let us know upfront if the unit is a rental — we'll handle the paperwork to keep everyone covered.

  - q: "Can you repair standalone countertop ice makers, not just fridge-integrated units?"
    a: |
      Yes. Countertop and portable units operate differently from refrigerator-integrated ice makers — they
      use a self-contained refrigerant circuit rather than borrowing the fridge's compressor. Common
      failures on portable units like the Frigidaire EFIC117 or GE Profile Opal nugget ice maker include
      water pump failure, condenser fan seizure, and sensor board malfunctions. Those repairs typically
      run $80-$160 depending on the part. We stock components for the most common portable models and can
      order OEM parts for less common units within one to two business days, then return to complete the
      repair.

  - q: "How long should an ice maker last, and what warranty do you offer on repairs?"
    a: |
      A refrigerator ice maker module typically lasts 8-12 years before repair economics tip toward
      replacement. LA's hard water shortens that window to 6-9 years on units without periodic descaling
      or filter maintenance — a real factor in Eagle Rock's 90041 zip where older homes rarely had water
      softeners installed. OEM replacement parts we install carry the manufacturer's warranty, generally
      90 days on the component itself. Our labor carries a 30-day guarantee: if the same failure recurs
      within 30 days of the repair, we return at no charge. For Samsung or GE units still under
      manufacturer warranty, we'll flag that upfront so you can file correctly instead of paying out of
      pocket.


title: "Eagle Rock Ice Maker — Hard Water Kills Fill Valves Fast Here"

intro: |
  Colorado Boulevard cuts through 90041 lined with craftsman bungalows from the 1920s and 1930s — most
  retrofitted with modern refrigerators crammed into original kitchen layouts that were never designed for
  today's appliance footprints. That GE side-by-side wedged under a low cabinet works harder than the
  manufacturer intended. Eagle Rock's municipal water supply tests around 280 mg/L total dissolved solids,
  enough calcium to clog a water inlet valve in under 18 months on a heavy-use household. Up near
  Occidental College in 90042, rental properties frequently run older Frigidaire or Kenmore units with ice
  makers nobody has serviced since installation — fill tubes ice over, the ice level sensor reads a phantom
  full bin, and suddenly there's no ice and no obvious reason why. Most of the time it's an $80-$140 repair.
  MaxFixing covers Eagle Rock daily and stocks the OEM fill valves and thermostats for the GE and Samsung
  models we see constantly on this side of the 134. Call (323) 870-4790 and we can usually have someone
  there the same day.

localContext: |
  The housing stock between Yosemite Drive and the Eagle Rock Recreation Center (90041) leans heavily
  1940s and 1950s — original galley kitchens with 30-inch cabinet openings that make pulling a refrigerator
  for service genuinely awkward. Compact GE or Whirlpool models dominate here because they fit. Over in
  the Eagledale corridor and along Delevan Drive (90042), you get more 1960s ranch homes with side-by-side
  configurations and built-in ice makers running 15-plus years. Hard water is the consistent thread across
  both zip codes. Mineral deposits accumulate inside the fill tube and water inlet valve faster than most
  homeowners expect — especially during summer when ice demand doubles and the unit cycles constantly.
  Rental units near Occidental College often have nobody tracking appliance health until the ice maker quits
  entirely. That deferred maintenance usually means a fouled ice mold thermostat or a completely seized
  ejector arm, both of which are straightforward fixes if caught before the control board gets stressed into
  a secondary failure.

commonProblems:
  - title: "Water Inlet Valve Clogged — No Ice Production in 90041 Homes"
    description: |
      The water inlet valve is a solenoid-controlled gate that lets water flow into the ice mold on each
      cycle. Eagle Rock's hard water deposits calcium scale on the valve's internal screen until flow drops
      below the minimum the ice maker needs to form a complete cube. GE Profile and Samsung french-door
      models are especially susceptible because their valves run a smaller orifice diameter than older
      designs — less room for mineral buildup before the unit stops producing. You'll notice a creeping
      pattern: ice slows over a few weeks, then stops entirely. The fix is swapping the inlet valve — a
      $45-$75 OEM part — plus flushing the supply line. Labor runs $95-$120. Total repair lands around
      $140-$195 and is typically finished the same visit. Ignoring it risks the fill tube freezing solid
      behind the valve, which adds another component to the job and another $50-$80 to the bill.

  - title: "Frozen Fill Tube — Ice Jams That Clear and Come Right Back"
    description: |
      The fill tube is a small plastic sleeve channeling water from the inlet valve into the ice mold.
      During Eagle Rock summers, the freezer door gets opened constantly — cold air escapes, the fill tube's
      exterior warms slightly, then refreezes around standing water still inside. That ice dam blocks the
      next fill cycle completely. Samsung and Whirlpool top-freezer units see this more than French-door
      models because of where the fill tube sits relative to the door gasket. A hair dryer clears it
      temporarily, but the real fix involves checking the door gasket seal and setting freezer temperature
      to 0°F, where the tube stays cold enough not to partial-thaw between cycles. A cracked or shrunk
      gasket — common on units over 10 years old — runs $55-$80 to replace. A tech can diagnose and fix
      the entire problem in about 90 minutes.

  - title: "Optical Ice Level Sensor Failure — Bin Empty, Maker Won't Run"
    description: |
      Most refrigerators built after 2005 use an optical ice level sensor: two small infrared emitters
      mounted on the ice maker assembly that detect when the bin is full. Mineral deposits from Eagle Rock's
      hard water coat the sensor faces over time, blocking the beam. The ice maker reads "bin full" even
      when you're down to three cubes, and stops producing. Kenmore and LG units in the 90042 rental
      stock are notorious for this exact failure. Cleaning the sensor faces with a vinegar-dampened cloth
      resolves it about half the time. If the sensor has cracked from thermal cycling, replacement runs
      $30-$60 for the part plus $85-$110 labor — total $115-$170. This is one of the fastest repairs we
      do. Call (323) 870-4790 and we can usually have a tech at your Eagle Rock address within two hours
      of booking.

  - title: "Ice Mold Thermostat Drift — Hollow Cubes or Cubes Frozen to the Tray"
    description: |
      The ice mold thermostat monitors temperature inside the freezing tray and signals the ejector arm
      to harvest cubes once they've solidified. A failing thermostat either harvests too early — producing
      hollow or half-formed cubes — or too late, bonding cubes to the mold and jamming the ejector arm
      under load. On older Frigidaire and Amana units common in Eagle Rock's 1950s-era homes, these
      thermostats drift out of calibration well before they fail outright. Replacement thermostat: $20-$40.
      Labor: $85-$110. Total repair under $160, finished in under an hour in most cases. If the ejector
      arm bent from fighting stuck cubes, add $25-$50 for that part. Skipping the repair strains the ice
      maker motor until it burns out — converting a $160 job into a $280-$300 full assembly replacement.

  - title: "Full Ice Maker Assembly Swap — When Chasing Parts One at a Time Stops Making Sense"
    description: |
      Sometimes the math favors replacing the entire ice maker module rather than addressing individual
      component failures sequentially. A GE or Whirlpool OEM assembly typically runs $85-$140 for the
      part; installation adds $90-$120 in labor — total around $175-$260, often with a 90-day parts
      warranty included. That's the right call when the ice mold, ejector arm, and thermostat have all
      started showing wear at the same time. For refrigerators under five years old, assembly replacement
      usually beats piecemeal repairs because the module is engineered to be swapped as a single unit.
      For units over 12 years old, the calculation shifts toward evaluating whether the refrigerator is
      nearing the end of its service life. A diagnostic visit settles that question fast — we'll give you
      a straight repair-vs-replace recommendation, not a parts-upselling pitch.

faq:
  - q: "How fast can you get to Eagle Rock for ice maker repair?"

title: "Eagle Rock Dishwasher — Hard Water Is Killing Your Unit"

intro: |
  Colorado Boulevard cuts through Eagle Rock with blocks of 1920s Craftsman bungalows and 1950s ranch homes, nearly all of them on LADWP supply lines that deliver notoriously hard water to 90041. Mineral concentrations in this part of Northeast LA routinely push past 250 mg/L calcium carbonate — enough to plug spray arm holes, choke inlet valves, and turn a functional Kenmore into a machine that leaves dishes cloudy and smells like a wet basement.

  Near Occidental College, student rentals and converted duplexes run GE and Kenmore dishwashers that nobody's serviced since the previous tenant moved out. Glassware film shows up first. Then water starts pooling at the bottom of the tub.

  By that point, the float switch and drain pump are usually both compromised, and what would have been a $90 descaling call has turned into a $280 repair. Catching mineral buildup before it takes out a second component is the single most common conversation we have on this block.

localContext: |
  The split between zip codes 90041 and 90042 creates genuinely different service conditions.

  In 90042, along Figueroa Street toward Glassell Park, older apartment buildings stack compact 18-inch under-counter dishwashers in cabinet runs with almost no clearance — accessing a drain pump in one of those adds 30-40 minutes compared to a standard job. The bungalows north of Colorado Boulevard in 90041 mostly date from the 1920s through the 1940s: original cabinetry, narrower base openings, and sometimes no dedicated 20-amp circuit for the dishwasher.

  South of York Boulevard, 1960s-era homes frequently run Whirlpool and Frigidaire units approaching the edge of their control board lifespan.

  Eagle Rock doesn't get the sustained August heat of the San Fernando Valley, but older kitchens with poor ventilation still run hot enough to accelerate door gasket cracking and shorten thermal fuse life. Street parking on residential blocks off Eagle Rock Boulevard is generally workable, though sweeping days on Tuesdays and Fridays occasionally push a van around the corner.

commonProblems:
  - title: "Mineral Scale Blocking Spray Arms — The Most Common Eagle Rock Complaint"
    description: |
      The spray arm on a standard Kenmore dishwasher has water jets roughly 1.5mm wide. Eagle Rock's LADWP supply deposits calcium at a rate that can plug those holes completely within 18-24 months of regular use with no descaling.

      Once the spray arm is blocked, dishes come out with food still attached — the machine runs a full cycle and accomplishes almost nothing. The inlet valve strainer catches the same scale; partial blockage drops water pressure and triggers false error codes or extended fill times. A professional descaling service plus spray arm replacement runs $85-$150 depending on whether the inlet valve strainer also needs swapping.

      Waiting until the spray arm cracks under mineral stress turns a $45 part into a $180 job once you factor in pulling the lower rack and accessing the circulation manifold below.

  - title: "Standing Water After Every Cycle — Drain Pump Failure in 90042 Rentals"
    description: |
      A puddle sitting at the bottom of the tub after a completed cycle points to one of two things: a clogged filter assembly or a failed drain pump motor.

      Samsung dishwashers — common in newer Eagle Rock rentals along Figueroa Street — display an OC or 5C error code when the pump can't clear the tub. The drain pump impeller on a Samsung DW-series unit runs roughly 90 seconds per cycle; over 10 years of daily loads with no filter maintenance, impeller wear is nearly guaranteed. Replacement drain pump motors run $60-$90 for the part; total repair with labor lands between $150-$250.

      In the tight under-counter installations common in 90042 apartment kitchens, add another 30-45 minutes for appliance removal — that affects the final bill. Same-day service is available for active drainage failures; call (323) 870-4790.

  - title: "Door Won't Latch or Pops Open Mid-Cycle — GE Profile Latch Failures"
    description: |
      The door latch assembly on GE Profile and Adora dishwashers — both extremely common in 90041 bungalows — uses plastic strike tabs that wear through after five to eight years of daily use. A failed latch means the door won't hold closed, the cycle won't initiate, or the machine cuts out mid-wash and leaves everything sitting in dirty water.

      GE's two-part system includes a door strike on the tub frame and a spring-loaded latch hook on the door panel; either piece can crack. The control board reads an open-door signal and shuts the unit down, sometimes with an error code, sometimes with total silence.

      Replacement door latch assemblies run $25-$45 for GE-compatible parts; adding labor and a door switch continuity test puts the total at $80-$120. This repair doesn't require a permit and takes under 90 minutes. Our contractor license is on file with the CSLB for any job requiring documentation.

  - title: "Detergent Dispenser Stuck Shut — Frigidaire's Bimetal Actuator Problem"
    description: |
      Frigidaire dishwashers use a bimetal actuator — a heat-triggered metal spring — to pop the detergent dispenser door open at the correct point in the wash cycle. Scale buildup around the dispenser door seal, or a fatigued actuator spring, keeps the door closed. Soap pods sit undissolved at the bottom of the tub; dishes come out greasy and smell wrong.

      In Eagle Rock kitchens with hard supply water, mineral deposits accumulate inside the dispenser hinge within two to three years of normal use.

      The fix involves descaling the dispenser cavity, replacing the actuator if the spring tension is gone, and reseating the hinge mechanism. A Frigidaire actuator kit runs $15-$30 for parts; total repair comes in at $65-$110 with labor. If the rinse aid dispenser is also scaled up — common on the same units — add roughly 20 minutes and $20 to the estimate.

  - title: "Error Codes Flashing — When to Repair and When to Replace"
    description: |
      Samsung dishwashers use specific error codes that map directly to failed components: 4C means the water inlet valve isn't filling, OC and 5C mean the drain pump can't clear the tub, and LC means the moisture sensor at the unit's base has detected a leak — usually a cracked door gasket or a loose drain hose clamp. Most of those are single-part repairs.

      The harder call is a failed control board. On Samsung and GE units, boards run $120-$200 for the part alone, and an eight-year-old dishwasher with a bad board and a worn door gasket is borderline economically. Total repair on that scenario can hit $300-$350, which starts to approach entry-level replacement cost.

      A 10-year-old Whirlpool in the same condition is often better replaced than repaired. The honest answer depends on the specific model and what else is worn — and that assessment costs nothing up front.

faq:

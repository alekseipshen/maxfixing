title: "Eagle Rock Range Repair — Gas Lines, Igniters, Real Fixes"

intro: |
  The Craftsman bungalows tucked off Figueroa Street and the stucco rental duplexes along
  Colorado Boulevard share one thing in common: original gas hookups from the 1940s feeding
  freestanding ranges that have outlasted three or four different tenants. A lot of them are
  Frigidaire or Kenmore units — solid enough, but the spark module and burner cap assemblies
  are wearing out. That clicking sound that never catches, or the burner that lights on one
  side but stays cold on the other — those are textbook signs of a cracked electrode or a
  blocked burner port packed with grease. Eagle Rock kitchens near Occidental College,
  particularly in the 90041 zip, see these calls constantly in fall when people start cooking
  more and realize the range has been half-functional all summer. Getting it diagnosed fast
  matters, especially with gas involved.

localContext: |
  Eagle Rock's housing stock is unusually varied for a neighborhood its size. The blocks
  closest to the 2 Freeway interchange near Yosemite Drive are dense with 1950s and '60s
  apartment buildings — compact kitchens, tight clearances, ranges that often haven't been
  serviced since install. Zip code 90041 covers most of the central neighborhood, including
  older Craftsman homes along Hermosa Avenue where gas lines run under the house in cast iron
  that occasionally needs a pressure check before we can confirm the range itself is the
  problem. Over in the 90065 boundary near Glassell Park, the housing shifts to earlier
  builds — some pre-war bungalows — and those kitchens often have standing-pilot setups or
  original range connections untouched for decades. The high-mineral content in LA's water
  supply causes calcium deposits in appliance water lines throughout the area, but for ranges
  the bigger issue is grease accumulation inside burner ports and the effect of occasional
  seismic movement loosening gas flex connectors behind the unit.

commonProblems:
  - title: "Igniter Clicks But Won't Light — Spark Module Failure in Eagle Rock Gas Ranges"
    description: |
      Frigidaire and GE freestanding gas ranges in Eagle Rock's older rentals handle this
      failure constantly. The igniter electrode gets coated in grease or physically cracks,
      which means the spark either shorts out or misfires entirely. Sometimes it's the spark
      module itself — the control board component that sends current to each burner's igniter
      — and when one channel on the module dies, you lose ignition on that burner while the
      others still click. Replacing the spark module on a GE 30-inch freestanding runs $85
      to $140 in parts depending on model year; labor is typically an hour. We stock common
      GE and Frigidaire igniter assemblies, so most of these get fixed on the first visit
      without a parts delay.

  - title: "Uneven Flame or Weak Burner Output — Blocked Burner Cap and Orifice"
    description: |
      A burner running lopsided — strong on the left, barely a flicker on the right — usually
      has blocked ports in the burner cap or a cap sitting off-center after cleaning. Eagle
      Rock's older Kenmore and Whirlpool gas ranges accumulate significant grease in the
      burner orifice over time, and a clogged port restricts gas flow unevenly across the
      ring. The fix is a thorough port cleaning with a stiff wire pick and sometimes replacing
      the burner cap entirely if it's warped from heat cycling. Replacement burner caps for
      Kenmore and Whirlpool run $15 to $40 each. Clearing a clogged burner and testing flame
      output takes under 45 minutes during a standard service call — no need to leave the
      range disassembled overnight.

  - title: "Oven Not Reaching Temperature — Glow Bar Igniter and Gas Valve Failure"
    description: |
      This one shows up two ways: electric ranges with a burned-out bake element (you can
      often see the visible break or char mark on the coil), and gas ranges where the glow
      bar igniter has weakened. A gas oven igniter draws current to heat up and trigger the
      gas valve — when it degrades, it glows orange but doesn't get hot enough to open the
      valve, so the oven never lights. On Samsung and GE gas ranges in Eagle Rock's mid-century
      apartment buildings, this is one of the most common repair calls we run. Replacement
      glow bar igniters for GE or Samsung gas ranges run $40 to $80 in parts. For new gas
      appliance connections in the City of Los Angeles, LADBS requires a permit — contractor
      license #1136541 covers those filings when needed.

  - title: "Gas Smell Near the Range — Flex Connector and Valve Inspection"
    description: |
      Any gas odor near the range is a same-day call — not something to schedule for next
      week. The most common source in Eagle Rock is the flexible gas connector behind the
      unit, especially in kitchens where the range has been pulled out and pushed back
      repeatedly over the years. Those corrugated connectors have a service life, and the
      older uncoated brass versions still found behind some Kenmore and Whirlpool ranges in
      90041 rentals can develop micro-cracks over time. The pressure regulator and gas valve
      on the range itself can also leak at the valve stem. We arrive with a calibrated gas
      leak detector, check the full supply line from shutoff to burner, and replace the flex
      connector on-site — typically a $75 to $120 parts job. Call us immediately at
      (660) 999-9960 if you smell gas near your range.

  - title: "Control Panel Errors and Dead Burner Switches — When Electronics Fail"
    description: |
      Digital control boards in Samsung and GE slide-in ranges fail more often in kitchens
      that run hot — and Eagle Rock summers, especially on the inland-facing blocks near the
      134 Freeway, push ambient kitchen temperatures higher than most of LA. A dead surface
      burner knob or an oven throwing an F3 error code usually points to a failed oven sensor
      or a degraded thermistor rather than the full control board. The oven sensor itself is
      inexpensive: $20 to $50 and straightforward to swap. A full control board replacement
      runs $150 to $300 depending on the model. For a Samsung range showing persistent error
      codes, we can usually confirm the diagnosis within the first 20 minutes on-site and
      order the exact part if it's not already on the van — most arrive within one to two
      business days.

faq:
  - q: "How fast can you get to Eagle Rock for range repair?"
    a: |
      Eagle Rock sits right off the 2 Freeway, which puts us 20 to 30 minutes out depending
      on whether we're coming from the Glendale side or cutting through Pasadena. Same-day
      service is available most weekdays, and evening slots exist for people who can't be
      home until after 5 p.m. Parking on the residential streets near Colorado Boulevard can
      be tight — our technician calls ahead to coordinate. Dial (660) 999-9960 to book, and
      we'll confirm a two-hour arrival window so you're not sitting around all day waiting.

  - q: "What does range repair in Eagle Rock typically cost?"
    a: |
      Diagnostic visit runs $65 to $85, applied toward the repair if you proceed. A simple
      igniter electrode or burner cap swap lands at $95 to $175 total including labor. Bake
      element or oven sensor replacement: $120 to $200. Control board replacement on a
      Samsung or GE range: $250 to $400 depending on parts availability and model year. Gas
      valve work or flex connector replacement adds $75 to $120 in parts on top of labor.
      Exact pricing comes after the diagnostic — call (660) 999-9960 or book online to lock
      in a same-day slot.

  - q: "Do I need a permit to replace or install a gas range in Eagle Rock?"
    a: |
      Eagle Rock falls under City of Los Angeles jurisdiction, so permits run through the LA
      Department of Building and Safety (LADBS). Swapping a like-for-like range on an existing
      gas hookup typically skips the permit requirement. Adding a new gas line, relocating the
      connection, or converting from electric to gas does require one. We hold contractor
      license #1136541 and handle the LADBS filing when the job calls for it — residential
      gas permit approval in LA typically runs one to three weeks. We'll tell you upfront
      whether your specific situation needs a permit before any work starts.

  - q: "Can you repair both gas and electric ranges in Eagle Rock?"
    a: |
      Both types, and slide-in versus freestanding configurations. Gas range work includes
      igniter systems, gas valve replacement, burner cap and orifice cleaning, flex connector
      swap, and pressure regulator checks. Electric range work covers bake and broil element
      replacement, surface burner switch repair, and control board diagnostics. Common parts
      for GE, Whirlpool, Frigidaire, Samsung, and Kenmore ride in the van, which covers most
      of what we find in Eagle Rock's older housing stock. Specialty parts for less common
      models typically ship in one to two business days.

  - q: "How long should a gas range last, and when does repair stop making sense?"
    a: |
      A well-maintained gas range runs 15 to 20 years. Frigidaire and Whirlpool units from
      the mid-2000s now sitting in Eagle Rock rentals are hitting that window. The rough
      rule: if the repair cost exceeds 50 percent of what a comparable new unit costs,
      replacement makes more sense financially. A control board replacement on a 14-year-old
      Kenmore is a harder call than the same repair on a five-year-old GE. Cosmetic wear —
      scratched surface, bent grates — doesn't affect function and isn't a reason to replace.
      We'll give you an honest read on whether your unit is worth fixing when we're on-site.

  - q: "Do you cover nearby neighborhoods, and how do I schedule quickly?"
    a: |
      Eagle Rock is regular territory, and we also run calls to Glassell Park, Highland Park,
      Atwater Village, Glendale, and Pasadena with the same response times. Scheduling is by
      phone or online — (660) 999-9960 — and same-day appointments are available most
      weekdays. By 9 a.m. on the day of service, we'll confirm your two-hour arrival window.
      If the range has a gas smell or the oven is completely out, mention that when you call
      and we'll bump it up in the queue.
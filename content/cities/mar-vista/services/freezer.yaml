title: "Mar Vista Freezer Repair — Coastal Air Ruins Seals Faster"

intro: |
  The marine layer that settles over 90066 most mornings is relentless — and that coastal
  moisture goes straight to work on your freezer's door gasket. A KitchenAid upright in a
  bungalow near Grand View Boulevard sees more humidity cycling through its seals than the
  same model sitting in Glendale ever will. Once that gasket loses compression, the
  evaporator coil buries itself in frost and the compressor runs without stopping.

  Mar Vista homes west of Centinela Avenue feel this harder than blocks closer to the 405
  — the marine layer stalls there longer most mornings before it burns off. That sustained
  moisture exposure is why freezer gaskets here fail 30 to 40 percent sooner than inland.
  Call (323) 870-4790 before the food loss starts.

localContext: |
  Post-war bungalows from the late 1940s and early '50s make up a lot of 90066 — compact
  kitchens, tight clearances, appliances pushed into corners. Chest freezers migrate to
  converted garages on streets like Beethoven, Wasatch, and Coolidge, where concrete slabs
  absorb daytime heat and release it overnight while cool marine air moves in. That
  temperature swing is harder on a freezer than stable indoor conditions. Older Whirlpool
  and GE units running in those garages show the strain in their compressors first.

  Venice Boulevard cuts right through the neighborhood, and the denser apartment buildings
  running along it tend to have older stacked refrigerator-freezers crammed into small
  kitchen alcoves or shared laundry rooms. Access for repairs means tight hallways,
  sometimes no alley parking. Palms, directly east of Mar Vista, has nearly identical
  housing stock and the same coastal-air problems — we run that loop daily.

  Hard water hits this zip code the same as the rest of West LA. Mineral buildup in ice
  maker assemblies is one of the most common calls we get in 90066. Samsung french-door
  refrigerator-freezers are especially prone to calcium deposits clogging the water inlet
  valve that feeds the ice maker — it looks like an ice maker failure but it's actually a
  clogged valve and a straightforward clean-out job. Worth diagnosing before assuming the
  whole assembly needs replacing.

  The Mar Vista Recreation Center area, along Palms Boulevard, has a concentration of
  1960s-era duplexes with original kitchen layouts — narrow spaces where getting a chest
  freezer out requires partial disassembly just to navigate the hallway. We carry the right
  tools for that. It adds 15 minutes, not 2 hours.

commonProblems:
  - title: "Door Gasket Breakdown from Constant Coastal Humidity"
    description: "Rubber door seals absorb moisture relentlessly in coastal 90066. The marine layer
      that parks over Mar Vista west of Centinela Avenue is the main culprit — it keeps
      ambient humidity elevated for hours each morning. Once the gasket loses its grip, warm
      humid air gets in, the evaporator coil ices over solid, and the unit runs nonstop
      trying to compensate. Samsung french-door models with bottom-mount freezer drawers are
      especially vulnerable — the lower gasket sits at floor level where humidity concentrates,
      particularly in the slab-floor bungalows on Beethoven and Wasatch. Fix is typically
      gasket replacement plus a complete manual defrost, not a new appliance. If your freezer
      is showing frost along the back interior wall and the door feels even slightly loose,
      that's the sequence already in progress."

  - title: "Frost Buildup Caused by a Dead Defrost Heater or Timer"
    description: "Ice slowly colonizing the back wall of your freezer is almost always a defrost
      heater or defrost timer that's quit. Airflow drops, internal temperature rises, food
      at the edges starts to soften. LG models manufactured between 2015 and 2019 have a
      well-documented defrost control board failure that triggers this exact sequence — the
      unit throws an FF or ER FF error code and never fully defrosts. That board runs
      $100–$140 — we carry it on the van and usually swap it the same visit. This is
      especially common in the apartment buildings along Venice Boulevard near Inglewood
      Avenue in Mar Vista, where units run continuously in poorly ventilated kitchen alcoves."

  - title: "Compressor Running Loud or Cycling Without Stopping"
    description: "A freezer you can suddenly hear from the next room usually has a seized condenser
      fan motor, which forces the compressor to overwork and overheat. GE and Whirlpool
      top-freezer units from the early 2010s hit this pattern regularly, especially in
      converted garages on 90066's residential streets where ambient temperatures don't drop
      much overnight — Coolidge Avenue garages and the alleys off Beethoven Street are repeat
      locations for this call. Caught early, it's a fan motor swap. Left alone, the compressor
      fails outright and the repair cost climbs fast. Bosch upright freezers sometimes display
      an E2 temperature sensor code alongside the noise — but the root cause is usually the
      same overload from restricted airflow, not the sensor itself."


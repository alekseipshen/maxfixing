title: "Mar Vista Dryer Repair — Long Vents, Gas Lines, Fast Fix"

intro: |
  The 1950s ranch houses clustered around Centinela Avenue and north of Venice
  Boulevard have a recurring dryer problem — exhaust runs added as retrofits,
  traveling 15+ feet through interior walls before finally exiting near the
  roofline. A Samsung gas dryer in one of these setups can look perfectly fine
  while a restricted vent quietly pushes drying cycles from 45 minutes to over
  an hour. That's usually the first clue something's wrong, not the machine dying
  outright.

localContext: |
  Most of the housing stock in 90066 dates from the 1950s and '60s — single-story
  stucco homes with laundry hookups shoehorned into hallway closets or converted
  garages. The marine layer rolling in off the Pacific keeps ambient humidity just
  high enough to slow drying noticeably. Add the apartment complexes along
  Beethoven Street — stacked washer/dryer combos in tight alcoves — and you get
  a neighborhood where cramped access and long exhaust runs are the norm, not
  the exception.

commonProblems:
  - title: "Thermal Fuse Failures From Restricted Exhaust Runs"
    description: "Single-story ranch layouts mean dryer vents often travel further before
      reaching an exterior wall, sometimes with a bend or two along the way. That
      restriction builds heat. The thermal fuse trips to protect the machine —
      suddenly your Whirlpool tumbles but blows cold air. Replacing the fuse without
      clearing the vent blockage means it blows again in three weeks."

  - title: "Drum Bearing Wear on LG Units Running Oversized Loads"
    description: "LG front-loaders are common throughout this neighborhood, and the drum
      bearing takes serious abuse when machines get consistently overstuffed — king
      comforters, heavy denim, the full haul. A low scraping or grinding during the
      tumble cycle is the tell. Ignore it and the worn drum roller assembly eventually
      locks up entirely. What costs $140 now becomes considerably more later."

  - title: "Gas Valve Igniter Failures in Older GE and Maytag Machines"
    description: "Mar Vista stays cooler than the Valley, but summer temps still push into
      the high 80s, and the gas valve igniter on older GE and Maytag units shows
      intermittent failures — heats for a cycle or two, then goes cold. The igniter
      isn't always fully dead; it just can't sustain a consistent flame. Confirming
      whether the flame sensor or the igniter itself is the culprit is the first
      diagnostic step."

faq:
  - q: "How fast can you get to Mar Vista for a dryer repair?"
    a: "Most calls in the 90066 area get same-day service. We run the Westside daily
      — Venice Boulevard and Lincoln are our standard routes in. Parking on the
      residential streets near Mar Vista Recreation Center is usually fine. Call us
      at (323) 870-4790 and we'll lock in a window for today."

  - q: "Do you repair Samsung and LG dryers specifically?"
    a: "Both are among the most common brands we see out here. On Samsung electric
      models, heating element and moisture sensor failures are typical. LG gas units
      usually come in with drum roller or control board issues. Bosch and Whirlpool
      too — we carry parts for all of them."

  - q: "What does a dryer repair typically cost and how quickly can you diagnose it?"
    a: "Diagnosis happens the same visit — we carry thermal fuses, heating elements,
      and drum rollers for the common brands on the van. A fuse or element swap runs
      $100–$180 all-in. Drum bearing jobs take longer but are still same-day in most
      cases. Evening slots available most weekdays — call (323) 870-4790 or schedule
      online."
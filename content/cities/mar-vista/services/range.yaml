title: "Mar Vista Range Repair — Gas & Electric, Same-Day"

intro: |
  The 1950s bungalows along Beethoven Street and the postwar duplexes tucked near the
  Mar Vista Recreation Center were all plumbed for gas decades ago — and most still run
  on the same basic igniter assemblies they shipped with. That GE or Whirlpool freestanding
  range in your kitchen has probably outlasted two refrigerators. A burner that clicks without
  lighting or an oven stuck 50°F cold is usually a straightforward fix if you catch it before
  the gas valve seizes up completely. The stretch of Mar Vista between Centinela and Beethoven
  has more aging gas appliances per block than almost anywhere else in West LA.

localContext: |
  Most of the housing stock in 90066 dates from the 1940s through the late 1970s — galley
  kitchens, original gas lines, and ranges wedged against cabinetry with barely an inch to
  spare on either side. The newer condos and mixed-use buildings along Venice Boulevard lean
  toward 240V electric slide-ins. Older single-family homes on the east side of Mar Vista,
  closer to Palms and Culver City, still run on 30-amp gas setups where line pressure can
  affect burner performance before any part even fails.

  The blocks between Braddock Drive and Washington Boulevard are especially dense with 1960s
  construction — kitchens remodeled once, maybe in the early 1990s, with a new Samsung or GE
  freestanding unit dropped in but no changes to the original gas risers. Over near the Mar Vista
  Farmers Market on Venice, many rentals still have aging cooktops fed through iron pipes installed
  when the neighborhood was brand new. Newer builds closer to Marina del Rey (90292) and the
  Lincoln Boulevard corridor lean electric, but the core residential streets of 90066 are
  overwhelmingly gas.

  The transition zone along Inglewood Boulevard — where 90066 bleeds into Venice (90291) toward
  the west and into Palms (90034) toward the east — tells the full story of Mar Vista's appliance
  mix. Landlords managing 1960s duplexes near the Douglas Park area replaced original O'Keefe &
  Merritt cooktops with whatever Whirlpool or LG freestanding was on sale at Home Depot. Those
  units are now 15-plus years old themselves. Meanwhile, the renovated bungalows closer to the
  Mar Vista Greenway trail corridor — the stretch running roughly parallel to Walgrove Avenue —
  often got KitchenAid or Bosch slide-ins during gut renovations, sitting on original gas risers
  that were never upsized. That mismatch between a modern range and a 1955 gas line shows up as
  weak flame output and burner regulation problems that look like valve failure but are really
  a supply pressure issue. It's a common Mar Vista-specific scenario that requires checking the
  meter pressure before condemning any part.

commonProblems:
  - title: "Spark Igniter Failure in Older Mar Vista Gas Ranges"
    description: "Food debris is the usual suspect. It packs into the igniter ports over months
      of cooking, the ceramic tip cracks, and the burner clicks endlessly without catching a
      flame. On a Whirlpool or GE freestanding model, a new igniter module plus a thorough
      cleaning of the burner caps typically runs under $150 in parts. Ignoring it long enough
      means the igniter wire shorts against the burner bowl and you're into a bigger fix.
      The F9 or F2 error codes on GE models usually point here — don't clear the code without
      inspecting the igniter harness first."

  - title: "Oven Won't Hold Temperature — Bake Element or Gas Safety Valve"
    description: "An oven running 40-50°F cold shows up as pale cookies on one side and
      burned on the other. Electric KitchenAid and Bosch ranges usually have a failing bake
      element — the coil develops a hairline crack and trips the thermal fuse on its way out.
      Gas models point to a degraded safety valve that partially restricts the burner even
      when the thermostat calls for full heat. A calibration offset is worth checking too —
      on KitchenAid dual-fuel models, the oven sensor (RTD probe) drifts over time and reads
      30-40°F warmer than the actual cavity temperature, which looks exactly like a valve problem
      but costs $40 to fix instead of $200."

  - title: "Control Panel Lockout on Samsung and LG Slide-Ins"
    description: "Power surges on the Mar Vista grid — especially after summer storm events
      — knock out the control board on Samsung and LG slide-in ranges. The touch panel goes
      dark or flashes error codes like SE or C-d0. Usually it's the control board itself,
      not the display glass. A loose ribbon connector is worth checking first; that's a
      $0 fix versus $200-$300 for a full board swap."

  - title: "Gas Burner Venturi Tube and Valve Wear on High-Use Ranges"
    description: "On ranges that get heavy daily use — which describes most Mar Vista households
      cooking on Bosch or GE Café models — the venturi tubes clog with grease and mineral
      deposits. The flame goes yellow-orange instead of blue, burns unevenly, or only fires
      on high. This is distinct from an igniter problem: the burner lights fine, it just won't
      regulate properly. Cleaning or replacing the venturi tube and checking the valve orifice
      typically runs $80-$120 and resolves it entirely. Left alone, a venturi problem can
      stress the gas valve and turn a $100 service call into a $300 one."

faq:
  - q: "How fast can you get to Mar Vista for Range repair?"
    a: "We run a regular route through Culver City and West LA — Mar Vista is usually
      15-20 minutes out. Street parking on the residential blocks off Centinela Ave is
      generally fine for the van. Call (323) 870-4790 before noon and same-day service
      is very likely, sometimes within 2 hours."

  - q: "Do you work on KitchenAid and Bosch ranges, or just the basic brands?"
    a: "KitchenAid, Bosch, and GE are actually the most common brands we pull calls for
      in this neighborhood. KitchenAid dual-fuel models frequently need oven thermostat
      or igniter module work. Bosch slide-ins tend to have door latch assembly issues
      and the occasional control board failure."

  - q: "What does a typical range repair cost in Mar Vista, and do you quote upfront?"
    a: "Diagnosis happens on-site, and we quote the full price before touching anything —
      parts plus labor. Most repairs land between $120 and $280. Evening slots are
      available if daytime doesn't work. Schedule online or call (323) 870-4790 for
      emergency same-day availability."
title: "Mar Vista Refrigerator Repair — 90066 Same-Day Service"

intro: |
  Venice Boulevard through 90066 is lined with renovated 1950s bungalows and newer condo
  conversions — and LA municipal water doesn't care which one you live in. The mineral load
  off the city supply hits LG ice maker assemblies hard, usually around year four or five.
  Mar Vista Park homeowners call us about this more than almost anything else, often after
  the ice maker's been dead for weeks and the water dispenser has been dispensing nothing.

localContext: |
  Most of Mar Vista's housing stock is postwar — 1950s and 1960s ranch-style builds with
  galley kitchens that haven't grown since the Eisenhower administration. Pulling a
  refrigerator out for compressor access in one of these layouts takes some maneuvering.
  Street parking on residential blocks off Beethoven Street can complicate van access too.
  The newer condo clusters closer to the 405 run Samsung and KitchenAid counter-depth
  models — different footprint, different tooling.

commonProblems:
  - title: "Ice Maker Dead — Mineral Buildup from LA Hard Water"
    description: "LA's municipal water supply runs hard, and 90066 is no exception. Calcium
    deposits accumulate in the water inlet valve and fill tube until flow stops completely.
    That LG french-door model will throw an error and stop making ice before the valve
    motor actually burns out — catch it early and it's a $120 fix. Let it sit, and you're
    replacing the whole ice maker assembly."

  - title: "Warm Fridge in a Kitchen That Gets No Cross-Breeze"
    description: "Westside summer afternoons push kitchen temps past 85°F in homes without
    central air. The condenser fan and compressor in older Whirlpool and GE units from the
    early 2000s can't compensate forever. Condenser fan motor failure is usually first —
    the compressor follows if nobody catches it. Symptom: fridge runs constantly but stays
    at 45-50°F instead of 37."

  - title: "Door Gasket Worn Down — More Common in Tight Kitchen Layouts"
    description: "In Mar Vista's narrow galley kitchens, refrigerators get bumped and the
    door swings hard against cabinets. Bosch and KitchenAid counter-depth units handle it
    better than budget brands, but the door gasket seal wears regardless. Once the seal
    gaps, the evaporator coil frosts up compensating for the leak — electricity bill climbs
    before the food even starts to go off."

faq:
  - q: "How fast can you get to Mar Vista for refrigerator repair?"
    a: "The 405/Venice Boulevard route is a regular run for us — Mar Vista is usually
    a 30-45 minute drive from our nearest tech. Call (323) 870-4790 and we can typically
    get there the same day, often within 2 hours. Evening slots available if daytime
    doesn't work."

  - q: "Do you repair Samsung and LG refrigerators in Mar Vista?"
    a: "Yes — Samsung and LG units are a big chunk of calls in 90066. Common issues:
    ice maker assembly clogs, water inlet valve failure, control board errors (Samsung's
    40E and 8E codes come up often). Whirlpool french-door seals too. Most parts
    stocked on the van."

  - q: "What does refrigerator repair cost, and do you do same-day?"
    a: "Diagnostic is $75 and applies toward the repair. Most fixes — thermostat,
    condenser fan motor, door gasket swap — land between $150 and $350 parts and
    labor combined. Same-day service is available most days. Call (323) 870-4790
    or schedule online to confirm the slot."

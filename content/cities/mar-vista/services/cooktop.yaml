title: "Mar Vista Cooktop Repair — Gas Supply, Ceramic Glass, Fast Fixes"

intro: |
  Post-WWII bungalows packed along Beethoven Street and Inglewood Boulevard weren't designed for five-burner Bosch gas cooktops. Owners swap them in during kitchen renovations, but the aging 3/4-inch supply lines running under 90066 homes sometimes can't deliver consistent pressure to high-BTU sealed burners — so what presents as a dead spark igniter is actually a gas delivery shortfall. Misread that diagnosis and you're swapping parts that didn't fail. We trace the actual fault before ordering anything, which saves most customers a second service call.

localContext: |
  Mar Vista's housing runs mostly 1940s-1960s construction — compact kitchens, aging cast-iron gas pipes, and in the denser apartment blocks near Venice Boulevard and Centinela Avenue, parking a service van close enough to haul tools takes real planning. The 90066 zip has a solid share of 1970s condo conversions where the cooktop sits inside a peninsula island flanked on three sides by cabinetry. Removing one means clearing those surrounding cabinets before the unit will lift free. On original tile-counter builds, that job adds time — we factor it into the upfront estimate, not after. The stretch along Grandview Boulevard near the Mar Vista Recreation Center has a lot of these layouts, and they require a different approach than a straightforward drop-in swap on a newer kitchen renovation.

commonProblems:
  - title: "Burner Won't Light After a Boilover"
    description: |
      Pasta water overflows and soaks the igniter port — a daily hazard in working kitchens. On sealed-burner GE and Samsung gas cooktops, the spark electrode absorbs the spill and the spark module keeps clicking long after the surface looks dry. Cleaning the electrode tip and burner cap orifice resolves most of these calls. If the spark module itself shorted from sustained moisture exposure, that board needs complete replacement — a common second-stage failure on units more than five years old. Samsung units from 2017-2019 in particular had an igniter wire harness design that routes close to the drip bowl, making them especially vulnerable to repeat moisture failures.
  - title: "Cracked Ceramic Glass on a Smooth-Top Electric"
    description: |
      KitchenAid and LG electric smooth-tops take real punishment. A cast-iron skillet dropped six inches onto the ceramic glass surface will spider-crack it — and once cracked, the heating element underneath can arc against the cooktop frame. That's a fire hazard, not a cosmetic complaint. Replacement glass panels are model-specific, require full disassembly of the cooktop chassis, and can't be patched or epoxied safely. We stock panels for the most common 30-inch configurations found throughout Mar Vista.
  - title: "Uneven Flame — One Burner Runs Cold or Yellow"
    description: |
      On Bosch and GE gas cooktops, a partially blocked brass burner orifice produces uneven heat — one side of the flame ring burns clean blue while the other goes yellow and weak. The fix is cleaning or replacing the orifice insert. Straightforward 20-minute job when the burner head retaining screw isn't corroded. In Mar Vista rentals that have cycled through multiple tenants without maintenance, that screw is almost always seized, which sometimes means drilling it out entirely. Yellow flame also signals an air-to-gas mixture issue worth checking — on older Whirlpool gas cooktops, the air shutter adjustment screw drifts out of spec and needs resetting alongside the orifice clean.

faq:
  - q: "How fast can you get to Mar Vista for a cooktop repair?"
    a: |
      From the West LA corridor, Mar Vista is usually 15-20 minutes depending on Venice Boulevard or Lincoln traffic. Same-day slots open most weekdays — call (323) 870-4790 before noon and we can typically get there that afternoon. Street parking near Beethoven Street and Inglewood Boulevard is generally manageable for the service van.
  - q: "Do you repair Bosch and KitchenAid cooktops in Mar Vista?"
    a: |
      Both come through regularly here. Bosch most often comes in for spark igniter module failures and burner gas valve malfunctions. KitchenAid smooth-tops usually need cracked ceramic glass panel replacements or a burned-out heating element. LG and Samsung are frequent too — mostly knob assemblies failing and spark modules shorting after a boilover. We stock parts for all four brands and carry common components on the van.
  - q: "What does a cooktop repair typically cost, and can you come the same day?"
    a: |
      Diagnostic visit is $65, credited toward the repair if you move forward. Single-component fixes — spark igniter, gas valve, thermocouple — typically run $120-220 parts and labor combined. Full price quoted before we touch anything. Same-day and evening slots are available throughout 90066 — call (323) 870-4790 to confirm availability. Most cooktop calls get resolved in one visit.


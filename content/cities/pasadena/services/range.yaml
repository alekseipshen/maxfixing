title: "Pasadena Range Repair — Historic Homes, Real Gas Expertise"

intro: |
  Craftsman bungalows in the Bungalow Heaven district sit alongside post-war ranches and 
  newer construction — and nearly all of them run gas. A KitchenAid six-burner or Thermador 
  slide-in that stops igniting in 91104 isn't a minor inconvenience; it's dinner. We run 
  service routes through Pasadena regularly and carry parts for the brands most common in 
  these kitchens.

localContext: |
  The older stock in 91103 and 91105 — Spanish Colonials near Garfield Avenue, 1920s 
  Craftsmans off Marengo — tends to have gas lines that predate modern pressure specs. 
  Remodeled kitchens often have Bosch or KitchenAid ranges retrofitted into original cabinet 
  cutouts with almost no clearance. Tight access behind a slide-in range in a 1930s kitchen 
  is a real job, not a showroom install.

  Hastings Ranch in 91107 is different — those 1950s and 1960s tract homes were built with 
  wider kitchens, but they've been through multiple owners and multiple appliance generations. 
  Samsung and LG freestanding ranges are common there. Madison Heights, just south of the 
  210 off Hill Avenue, runs toward KitchenAid and Bosch — mid-century homes with remodeled 
  kitchens and owners who actually use the stove.

  Near Caltech and along the south end of Lake Avenue in 91101, you get a mixed bag: rental 
  units with builder-grade Frigidaire or GE ranges, and owner-occupied homes with full 
  Thermador Pro suites. The Rose Bowl neighborhood and the Arroyo Seco corridor skew older 
  construction — meaning older gas supply lines, older shutoffs, and sometimes corroded 
  burner valve connections we find nowhere else in the LA basin. Hard water affects 
  Pasadena appliances harder than most LA neighborhoods; the municipal water supply pulls 
  from the San Gabriel Valley groundwater basin, which runs 300–400 mg/L hardness regularly. 
  That buildup is visible on burner caps, inside dishwashers, and on electrode tips after 
  just a couple of years.

commonProblems:
  - title: "Igniter Clicks but Burner Won't Light"
    description: |
      That clicking sound with no flame usually means the spark electrode or gas valve isn't 
      cooperating even though the igniter module is firing. On Thermador Pro Harmony ranges 
      in the San Rafael Hills area, mineral deposits from Pasadena's notoriously hard water 
      block the electrode tip. The ceramic around the electrode cracks from thermal cycling 
      too — common on ranges that see heavy daily cooking. Clean it or replace the igniter 
      assembly — most jobs finished same visit. We carry Thermador-specific electrode kits 
      and don't need to order them in.
  - title: "Oven Stalls Below Target Temperature"
    description: |
      A gas oven that plateaus at 300°F when you've set 375°F often has a failing gas valve 
      igniter — the component that glows to open the bake burner valve. Bosch ranges show 
      this as a consistent low-heat symptom without throwing an error code. The igniter draws 
      too little current to fully open the valve; you need to measure amp draw to confirm, not 
      just eyeball the glow. Swap the igniter; problem solved. On KitchenAid dual-fuel models, 
      the same symptom sometimes traces back to a failing oven control board — different fix, 
      same diagnostic starting point. Either way, the diagnosis happens on-site and we quote 
      before ordering anything.
  - title: "Gas Smell Near the Range — Don't Ignore This"
    description: |
      A faint gas odor around a Samsung or LG freestanding range in 91106 is usually a worn 
      burner valve seal or a loose connection at the manifold. In older Pasadena homes with 
      original flex connectors behind the range, the connector itself sometimes develops 
      micro-cracks — especially if the range has been pulled out and pushed back in a few 
      times over the years. Not a DIY fix. We carry replacement valve assemblies and 
      pressure-test the gas supply line after every gas repair before we leave. Call 
      (323) 870-4790 immediately if you smell gas — don't run the range until it's inspected.

faq:
  - q: "How fast can you get to Pasadena for range repair?"
    a: |
      Coming off the 210 corridor, we typically reach Pasadena within 90 minutes of booking. 
      Colorado Boulevard through Old Town and the surface streets off Lake Avenue are both 
      reliable routes. Call (323) 870-4790 or schedule online — same-day slots available 
      most weekdays, evening appointments open up regularly for Hastings Ranch and 
      East Pasadena stops.
  - q: "Do you repair Thermador and KitchenAid ranges?"
    a: |
      Both are among the most common brands we see in Pasadena — especially in the larger 
      homes off Oak Knoll and up in Linda Vista. We also handle Bosch, Viking, and LG. For 
      Thermador specifically, we stock proprietary igniter assemblies and control board 
      connectors in the van. KitchenAid dual-fuel models are a regular stop on our route 
      through 91103 and 91105, so parts for those aren't a wait-and-order situation.
  - q: "What does a range repair cost and how does the process work?"
    a: |
      Diagnosis happens on-site; we quote before touching anything. Most single-component 
      repairs — igniter, control board, gas valve — run $150–$350 parts and labor combined. 
      A gas valve replacement on a Thermador Pro range sits toward the higher end of that 
      range; a standard igniter swap on a Samsung or Bosch is usually at the lower end. 
      Same-day Pasadena appointments are available most mornings, and evening slots open up 
      regularly too.
  - q: "Can you service built-in ranges in tight spaces?"
    a: |
      Yes — and Pasadena specifically is full of them. Remodeled Craftsman kitchens in 91104 
      often have ranges sitting inside original 1920s cabinet cutouts with two inches of 
      clearance on each side. We work in those spaces regularly and don't need extra access 
      time to figure it out. Gas shutoffs in older homes aren't always where you'd expect 
      them either; we locate those first before any repair starts.
title: "Pasadena Dishwasher — Hard Water, Tight Kitchens, Fast Fixes"

intro: |
  Bungalow Heaven's 1920s Craftsman kitchens were retrofitted for dishwashers
  decades after the houses went up — tight clearances, odd cabinet angles, and
  original plumbing that makes pulling a Bosch 800 Series a two-person job.
  Pasadena's municipal supply runs notoriously hard out of the San Gabriel Valley
  system, and that calcium builds on spray arms and heating elements faster than
  most homeowners expect. One call usually gets a tech out the same day.

localContext: |
  Homes in the 91103 zip — the Garfield neighborhood heading north toward
  Altadena — run older galvanized water lines that accelerate mineral deposits
  inside the dishwasher tub and drain pump housing. Mid-century ranches in
  Hastings Ranch (91107) frequently have built-in units from the late 1980s and
  early 90s where control boards are the first thing to go. East of Lake Avenue,
  newer construction runs Bosch and Thermador built-ins — different problems,
  mostly door latch assemblies and dispenser issues.

commonProblems:
  - title: "Spray Arm Clogs from Pasadena Hard Water"
    description: |
      San Gabriel Valley water tests around 300–400 ppm hardness in many
      Pasadena neighborhoods. That calcium pastes directly into spray arm nozzles
      — on Bosch 500 Series units, the holes are narrow enough that partial
      blockage shows up as cloudy glasses within weeks. A thorough descale helps
      short-term, but once the spray arm itself is deformed from mineral buildup,
      replacement is the cleaner fix.
  - title: "Standing Water After the Cycle Ends"
    description: |
      Drain pump failures are the most common call we get for LG and Samsung
      dishwashers in the 91105 and 91106 zips. Food debris coats the pump
      impeller and filter over time, especially with Pasadena's hard water leaving
      residue on every surface. Sometimes it's just a clogged filter — other
      times the drain pump motor is burned and needs a full swap. We carry both
      in the van.
  - title: "Detergent Dispenser Stuck Shut Mid-Cycle"
    description: |
      KitchenAid dishwashers show up frequently for this: the bi-metal actuator
      inside the dispenser door latch fatigues after a few years and stops
      triggering the door at the right point in the cycle. Dishes come out with
      greasy film even though the wash ran. The dispenser door latch assembly
      on most KitchenAid models is a straightforward part — we stock them and
      can swap on the first visit.

faq:
  - q: "How fast can you get to Pasadena for a dishwasher repair?"
    a: |
      From our San Gabriel Valley route we can usually reach most Pasadena
      addresses within 2 hours. Colorado Boulevard to Lake Avenue is a
      straightforward run. Call (323) 870-4790 or schedule online — same-day
      slots open most weekdays, and evening appointments are available.
  - q: "Do you repair Bosch and Thermador dishwashers in Pasadena?"
    a: |
      Bosch is probably the single most common brand we service here — 300,
      500, and 800 Series. Thermador built-ins appear regularly in the Oak
      Knoll and San Rafael Hills areas. KitchenAid and LG round out most of
      our calls. Control board failures, door latch assemblies, and drain
      pumps cover about 80% of what we see.
  - q: "What does a typical dishwasher repair cost in Pasadena?"
    a: |
      Most repairs land between $150 and $350 depending on the part. Drain
      pump replacement on an LG usually runs $200–$250 all-in. We diagnose
      on the first visit and quote before any work starts — no surprises.
      Emergency same-day service is available; call (323) 870-4790 to check
      availability now.

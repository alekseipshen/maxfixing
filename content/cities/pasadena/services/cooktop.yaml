title: "Pasadena Cooktop Repair — Craftsman Kitchens, Modern Fixes"

intro: |
  The 1920s Craftsman kitchens in Bungalow Heaven near Mentor Avenue weren't
  designed for five-burner Thermador ranges. Retrofitting premium cooktops into
  those tight footprints is common here — and so are the problems that follow.
  Pasadena's water supply runs hard enough to leave white calcium deposits inside
  burner ports within months, especially on Bosch gas units where the burner cap
  sits flush against the igniter assembly. Most calls we get from 91103 start
  with "it clicks but won't light."

  That calcium issue isn't random. The Foothill Municipal Water District serves
  much of northwest Pasadena with water clocking in above 300 mg/L hardness —
  roughly three times what you'd see in coastal Santa Monica. Gas cooktops take
  the worst of it because condensation from cooking cycles pulls minerals directly
  into the burner ports.

localContext: |
  Zip codes 91103 and 91105 are packed with pre-1940 bungalows and 1960s ranch
  homes where kitchen footprints are tight and original gas lines are narrower
  than current code. Madison Heights and San Rafael Hills see heavy KitchenAid
  and Bosch installations in remodeled kitchens — quality cooktops dropped into
  old cabinetry that wasn't built for the heat output.

  The gas supply situation matters here more than people realize. Original iron
  pipes in older Craftsman homes can restrict BTU delivery to the burners, which
  shows up as low, uneven flames even when the cooktop itself is fine. Before
  diagnosing the appliance, we check supply pressure at the manifold.

  The Foothill Municipal Water District water here registers notably high mineral
  content, which means igniter ports and burner caps need cleaning more often
  than homeowners expect. On Colorado Boulevard corridor homes that have been
  through multiple kitchen remodels, it's common to find Thermador or Wolf
  cooktops installed over electrical configurations that predate current NEC
  standards — that combination creates headaches for any technician who isn't
  familiar with the neighborhood's renovation history.

commonProblems:
  - title: "Calcium Buildup Blocking the Igniter Electrode"
    description: |
      Pasadena's hard water leaves calcium deposits around the igniter electrode
      and inside burner caps — particularly on Bosch five-burner gas cooktops
      where the cap design traps moisture. The spark fires fine, but the gas path
      is partially obstructed, so you hear continuous clicking with no ignition.

      Cleaning the electrode and soaking the cap in white vinegar clears it
      temporarily. But a corroded igniter module needs full replacement to hold.
      The Bosch part number matters here — generic replacements don't seat
      correctly against the sealed burner collar and you end up with the same
      clicking problem six months later. We stock OEM igniter modules for the
      most common Bosch 30" and 36" cooktop configurations.

  - title: "Cracked Glass-Ceramic Surface After Temperature Shock"
    description: |
      A cold splash on a hot KitchenAid or Samsung glass-ceramic surface causes
      thermal fracture — the crack usually runs from a burner ring toward the
      edge. Beyond the obvious hazard, a cracked panel lets moisture reach the
      heating element beneath, eventually causing arcing and a dead zone.

      That means replacing both the heating element and the glass panel as a
      unit, not just the surface. Samsung induction models in particular use a
      two-piece element assembly under the glass that can't be separated without
      risk. On a KitchenAid 36" glass-ceramic, expect the job to run 90 minutes
      minimum just for safe disassembly — the trim ring on those units is
      notoriously easy to crack if you rush the clips.

  - title: "Gas Valve Knob Assembly Worn to Unsafe Tolerance"
    description: |
      On early 2000s Thermador cooktops — common in San Rafael Hills kitchen
      remodels — the knob valve shaft wears down until the burner won't close
      fully. You catch a faint gas smell even with everything turned off.

      Don't ignore that.

      The fix is a valve assembly swap, not just the knob cap. Given it's a
      gas-adjacent repair, this one shouldn't sit on a to-do list. The valve
      shaft on these Thermador units is a proprietary diameter — a hardware
      store replacement won't seal correctly. If you're in the 91105 or 91107
      zip and smell gas near a cooktop that's supposedly off, call us before
      you do anything else. We can usually get there same day.

faq:
  - q: "How fast can you get to Pasadena for cooktop repair?"
    a: |
      Most days we can reach the 91103, 91105, and 91107 zip codes within
      two hours. The 210 is straightforward from our usual route north.
      Same-day slots fill fast — call (323) 870-4790 in the morning to lock
      one in. Evening appointments are available for households that can't do
      a midday window.

  - q: "Do you work on Bosch and Thermador cooktops specifically?"
    a: |
      Both are common here. Bosch gas cooktops use brand-specific igniter module
      part numbers that generic shops often don't stock. Thermador sealed burners
      need a different disassembly approach than standard open-burner units —
      the star-shaped burner caps require a specific torque sequence or you'll
      strip the brass fitting underneath.

      We carry parts for both, plus KitchenAid and Samsung glass-ceramic panels.
      For Sub-Zero and Wolf cooktops, which show up occasionally in the larger
      San Rafael Hills homes near the Arroyo, we can usually source parts
      within 24 hours if we don't have them on the van.

  - q: "What does cooktop repair typically cost, and do you do same-day service?"
    a: |
      A gas igniter switch replacement runs $85–150 installed. A glass-ceramic
      panel on a KitchenAid or Samsung is usually $200–360 depending on the
      model. Thermador valve assembly work runs $175–250 for parts and labor.
      You get a firm quote before any work starts — no surprises after the
      fact. Evening and emergency slots are available. Schedule at
      (323) 870-4790.
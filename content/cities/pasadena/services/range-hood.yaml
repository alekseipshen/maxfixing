title: "Pasadena Range Hood Repair — Craftsman Kitchens Done Right"

intro: |
  The craftsman bungalows along Bellefontaine Street and through the Bungalow Heaven
  historic district weren't designed for modern high-BTU cooking — original ductwork
  runs short, tight, and often terminates in the attic instead of outside. A KitchenAid
  or Bosch hood in one of these 1920s kitchens fights restricted airflow from day one.
  Once the blower wheel slows down or grease filters go months without cleaning, smoke
  and steam have nowhere to go.

localContext: |
  Homes in the 91106 zip code — the stretch from Caltech south toward California Boulevard
  — tend to be 1920s to 1950s construction, most with original or minimally updated kitchen
  ventilation. Tighter cabinet clearances and undersized duct runs are standard in these
  older builds. The Madison Heights neighborhood, roughly between Lake Avenue and Hill
  Avenue, has a concentration of Spanish Colonial revival homes where ductwork often snakes
  through narrow interior walls with multiple 90-degree turns — each bend killing roughly
  10% of your hood's effective CFM. Pasadena's historic preservation overlay (it covers
  most of 91103 and 91104) means homeowners can't easily reroute duct runs through the
  exterior wall without a permit, so you're working with what's there. Newer construction
  in Hastings Ranch (91107) runs larger, but Sub-Zero and Thermador built-ins there
  require specialized service most appliance techs won't attempt. The San Rafael Hills
  corridor on the north end of 91105 skews toward mid-century ranch homes — Bosch and
  LG slide-in ranges are common there, and wall-mount hoods in those kitchens often have
  flimsy sheet-metal duct connectors that crack after a decade of vibration.

commonProblems:
  - title: "Grease Baffle Saturation in Low-Clearance Craftsman Kitchens"
    description: "Metal mesh grease baffles on Bosch and KitchenAid hoods in older Pasadena
    homes accumulate faster than in newer builds — smaller footprints mean the hood sits
    closer to the burners, catching more grease per cook cycle. Clogged baffles starve the
    fan motor of airflow, causing it to overheat and eventually seize. Most homeowners don't
    notice until smoke starts drifting into the dining room. In kitchens near the Playhouse
    District where cabinet depth runs 11 to 12 inches instead of the standard 13, this
    problem shows up faster — sometimes within a year of installation."
  - title: "Blower Wheel Failure from Restricted Duct Runs"
    description: "Older ductwork in 91103 and 91104 homes often runs undersized — less than
    the recommended 6-inch diameter — putting constant back-pressure on the blower wheel.
    That resistance wears the motor bearings down fast. The symptom starts as a grinding
    rattle that worsens over months, until the wheel seizes completely and the hood moves
    no air despite the lights and controls still functioning. Samsung and LG hoods with
    variable-speed motors sometimes throw an error code (E1 or E3 depending on the model)
    before full failure — that code is the motor controller detecting the load spike."
  - title: "Vent Duct Disconnection from Thermal Stress"
    description: "Pasadena attics hit 130°F or more during summer — especially in North
    Pasadena and through the Rose Bowl corridor. Flexible duct connectors between the hood
    body and rigid ductwork loosen from repeated thermal expansion cycles. A Thermador
    wall-mount running at full speed can pull a fitting loose entirely, dumping exhaust
    directly into the attic. The hood appears to work, but grease is silently coating your
    ceiling joists. Gas ranges running at high BTU — common with Viking and Thermador
    in Hastings Ranch homes — accelerate the grease load and make disconnected ducts a
    genuine fire risk, not just an air quality issue."

faq:
  - q: "How fast can you get to Pasadena for range hood repair?"
    a: "We run 626-area routes daily and are usually on-site within 2 hours of your call.
    Parking near Old Town and Caltech can add 10–15 minutes, but we account for it.
    Call (323) 870-4790 or schedule online — same-day slots available most days."
  - q: "Do you repair Thermador and Bosch range hoods specifically?"
    a: "Yes — Thermador wall-mounts and Bosch 500/800 Series are two of the most common
    hoods we service in Pasadena. We carry replacement blower motors, grease baffle
    hardware, and control board components for both lines. KitchenAid and LG hoods too."
  - q: "What does range hood repair typically cost in Pasadena?"
    a: "A fan motor swap or blower wheel replacement usually runs $150–$280 parts and labor.
    Control board failures on premium hoods like Thermador can go higher. We diagnose
    on-site and give a firm quote before touching anything — evening slots available if
    daytime doesn't work."
  - q: "Can you work on range hoods in Pasadena's historic-district homes?"
    a: "Historic overlay doesn't restrict appliance repair — only structural and exterior
    modifications. We service hoods in Bungalow Heaven, Prospect Park, and other
    preservation zones regularly. The challenge in those kitchens is access: low ceilings,
    tight soffits, and original plaster walls that make it hard to reseat a duct
    connection without damaging the finish. We bring the right tools so we're not
    improvising inside a 100-year-old kitchen. Call (323) 870-4790 to describe your
    setup and we'll tell you what to expect before we arrive."
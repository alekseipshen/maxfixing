title: "Pasadena Oven Repair — Craftsman Kitchens to Thermador Wall Ovens"

intro: |
  The Craftsman bungalows along Arroyo Boulevard and the Spanish Colonial revivals near
  Caltech weren't designed for Thermador wall ovens — but that's what's in plenty of them
  now. Pasadena remodels skew premium. When a KitchenAid double wall oven starts throwing
  an F3 error or stops holding temperature past 350°, you need someone who actually
  understands the part, not just the brand. We cover Pasadena same-day, usually there
  within 2 hours of your call to (323) 870-4790.

localContext: |
  The 91103 and 91105 zip codes mix pre-war Craftsman stock with 1950s-60s ranch homes —
  original gas range setups, many converted to dual-fuel when kitchens got updated. The
  Bungalow Heaven Historic District alone has hundreds of kitchens retrofitted with modern
  slide-in ranges dropped into cabinetry built for something far older.

  West of Lake Avenue, the remodels get more serious. Built-in Thermador and Bosch wall
  ovens are standard in those kitchens, and original cabinet depths paired with aging
  electrical panels make every service call more involved than a standard tract-home job.

  Homes on the north side near the Arroyo Seco have seen significant kitchen overhauls in
  recent years — full Thermador cooking suites, sometimes a Sub-Zero column refrigerator
  next to a 36-inch range. Access to those built-in wall ovens often means partially pulling
  the unit out of the cabinet run before the first diagnostic check can even start. Tight
  tolerances, old framing, and a premium appliance that the homeowner paid real money for.
  That combination demands patience and the right tools.

commonProblems:
  - title: "Gas Igniter Failure in Pasadena's Older Kitchen Setups"
    description: |
      Gas ovens in pre-war and mid-century Pasadena homes fail this way constantly: the
      igniter weakens until it glows but can't draw enough current to open the gas valve.

      You hear the click, smell a brief trace of gas, then silence.

      KitchenAid freestanding gas ranges are a repeat offender here, and Bosch slide-ins
      aren't far behind. Resistance testing the igniter tells you quickly whether it's the
      element or the gas valve that needs attention next. Usually an igniter assembly swap
      closes the job on the same visit — if the igniter tests within spec, the valve itself
      gets pulled and inspected before we leave.

  - title: "Self-Clean Cycle Leaves the Oven Locked Shut"
    description: |
      Self-clean pushes the oven cavity past 900°F. That kind of sustained heat destroys
      the door latch assembly faster than years of normal cooking ever would. The latch
      sticks in the locked position after the cycle — or the thermal fuse trips entirely,
      leaving the oven both locked and dead.

      Thermador double wall ovens see this failure more than most. Samsung slide-ins too.
      A control board reset fixes it sometimes; a blown thermal fuse means the part gets
      replaced before anything runs again. If the latch motor itself is seized, that's a
      separate component — we check both before ordering anything.

  - title: "Uneven Baking from a Partially Failed Bake Element"
    description: |
      A crack or burn-through in the bake element creates hot spots — one side of the oven
      runs significantly hotter than the other, and you might not catch it until a whole
      sheet pan comes out half-scorched. LG slide-in ranges typically throw an F9 or heating
      error code. Older Bosch wall ovens often fail silently, no error code at all — the
      oven just bakes badly and the homeowner assumes something's off with their recipe.

      New element, about 45 minutes, and the range is back to normal that same day. No error
      code and the element looks intact? The oven temperature sensor gets tested next — a
      failed sensor reads low and the control board overcompensates, which mimics a bake
      element problem almost perfectly.

faq:
  - q: "How fast can you get to Pasadena for oven repair?"
    a: |
      Pasadena sits on our regular 210 corridor route. Most days we're there within 2 hours
      of your call. Old Town and the blocks around Caltech can be tight for the service van,
      so mention access when you book. Call (323) 870-4790 or schedule online — same-day
      slots are usually open.

  - q: "Do you repair Thermador and Bosch wall ovens in Pasadena?"
    a: |
      Both show up constantly in Pasadena remodels. Thermador wall ovens usually need igniter
      work or convection fan motor replacement — the fan bearings wear out faster than most
      owners expect. Bosch models lean toward control board failures or door latch issues.

      KitchenAid and LG ranges round out most of our calls here. We stock parts for all four,
      so most repairs close on the first visit.

  - q: "What does oven repair cost in Pasadena, and do you charge for the diagnosis?"
    a: |
      Diagnostic fee is $75, applied toward the repair if you move forward. Most common
      fixes — heating element swap, thermal fuse replacement, igniter assembly — run $150
      to $280 in parts and labor. Evening and weekend slots are available most weeks.

      Urgent situation? Call (323) 870-4790 and we'll sort out same-day or emergency
      coverage. If it's a gas issue and the oven isn't safe to use, say so when you call —
      those get prioritized.


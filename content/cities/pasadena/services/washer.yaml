intro: |
  Pasadena washers take a beating. The hard water coming out of LA County taps — routinely above 300 ppm total dissolved solids — leaves calcium scale inside drum bearings, water inlet valves, and pump filters faster than most homeowners expect. A Bosch 500 Series front-loader in a Madison Heights craftsman will start throwing E18 drain errors within three years if the inlet filters aren't cleared. Same story with LG front-loaders around the 91104 zip — the drain pump impeller gets coated with mineral buildup and the machine just sits there humming without draining. We fix these calls every week across the San Gabriel Valley.

commonProblems:
  - title: "Washer Won't Drain"
    description: |
      Usually the drain pump or a clogged pump filter. On Samsung front-loaders, the 5E or SC error code points directly to this. The filter access panel is at the bottom-front — most owners don't know it exists until there's standing water on the laundry room floor. We clear the filter, test the pump motor, replace the pump assembly if it's seized. Done in under an hour most of the time.
  - title: "Loud Banging During Spin"
    description: |
      Drum bearings. A worn bearing on a KitchenAid top-loader sounds like a basketball bouncing inside the cabinet. The spin basket wobbles, the shock absorbers can't compensate, and you start seeing visible drum movement. Replacing bearings on these machines requires pulling the full drum assembly — 2-3 hours of labor, but it extends machine life by years versus buying new.
  - title: "Agitator Stops Mid-Cycle"
    description: |
      Drive belt or lid switch. On older top-loaders — Maytag, Whirlpool, Kenmore — the drive belt snaps and the motor runs but nothing moves. LG direct-drive machines skip the belt entirely but develop rotor position sensor faults instead, which shows as an LE error. The lid switch is the other common culprit: if the machine reads the lid as open, spin won't engage. Simple diagnosis, usually $80-120 all-in.
  - title: "Leaking From Front or Bottom"
    description: |
      Door gasket on front-loaders, water inlet valve on top-loaders. Bosch front-loaders in particular develop tears in the rubber bellows seal after 5-6 years — you notice a wet ring around the base after each cycle. The inlet valve can also crack at the fitting and drip slowly until it soaks the subfloor. Both are same-day repairs with parts we carry on the van.

faq:
  - question: "How fast can you get to Pasadena?"
    answer: |
      Most days we're already working in the 91103-91107 area. Call (323) 870-4790 before noon and we can usually be there the same day, typically within 2-3 hours. Evening slots are available most weekdays for households where someone can't be home during the day.
  - question: "My Bosch washer shows an E17 error — what is that?"
    answer: |
      E17 is a water intake fault. Either the inlet valve is failing, water pressure is low, or the valve screen is packed with mineral scale. Given Pasadena's water hardness, the scale buildup explanation is correct about 70% of the time. We carry replacement inlet valves for common Bosch models on every call — it's that predictable in this area.
  - question: "Is it worth repairing an older LG front-loader?"
    answer: |
      Depends on the failure. LG direct-drive motors are genuinely durable — these machines run 12-15 years with reasonable maintenance. A drain pump replacement on a 7-year-old unit makes sense. A control board failure on a 10-year-old machine is tighter math. We'll tell you honestly which way it goes before we start any work.
  - question: "Do you work on Samsung washers specifically?"
    answer: |
      Yes, and Samsung front-loaders have a few recurring patterns we see constantly — door lock assembly failures, the UE unbalance error from worn shock absorbers, and drain pump clogs. We stock Samsung OEM parts for the most common models. If you're seeing a 4E water supply error or an ND code, call (323) 870-4790 — those are usually 45-minute fixes.

localContext: |
  Pasadena's older housing stock creates specific access challenges. The craftsman bungalows in Bungalow Heaven around Lake Avenue, the larger homes in San Rafael Hills near the 210 freeway — many have tight laundry closets or stacked washer-dryer configurations. Getting a front-loader drum out of a closet on Arroyo Drive is not the same job as a suburban garage install in Chatsworth. We bring the right equipment and know how to work in confined spaces without damaging original hardwood floors or period trim.

  The Rose Bowl neighborhood near 91103 has a mix of multi-unit buildings and single-family homes — we handle building access logistics and coordinate with property managers for occupied rental units when needed. Hard water is the underlying cause of roughly 40% of the washer service calls we get in Pasadena. Caltech-area rentals near 91106, older condos on Colorado Boulevard — mineral buildup hits fast in all of them. If your machine is under five years old and already showing drain or fill problems, that's the first place we look.
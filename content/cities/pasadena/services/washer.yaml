title: "Pasadena Washer Repair — Same-Day SGV Service"

intro: |
  Condos along Arroyo Parkway pack Samsung and LG stacked units into utility
  closets barely wide enough to squeeze past. Drain pump failures on those
  machines — water sitting cold in the drum, door locked, F21 or OE error
  blinking — happen more often than the manufacturers admit. We cover 91105
  daily and can get a tech there within two hours. Call (323) 870-4790 to
  schedule a same-day appointment.

localContext: |
  Pasadena's housing runs from 1910s Craftsman in the 91104 zip to mid-century
  apartment complexes near Caltech in 91106. Older homes in Madison Heights
  often have cramped laundry closets with minimal clearance — which matters
  when a tech needs to pull out a front-loader to access the motor or drum
  bearing. The 1960s apartment buildings off Wilson Avenue were simply not
  designed with front-load service access in mind.

commonProblems:
  - title: "Drain pump blockage from San Gabriel Valley mineral buildup"
    description: "Hard water deposits combine with lint inside drain pump housings
      to form a paste that stalls the impeller — standing water, a faint burning
      smell, and an F21 or 5E code on the display. KitchenAid and Bosch
      front-loaders are especially prone because their pump filters aren't
      user-accessible without pulling the machine. Usually a one-hour fix
      on-site."

  - title: "Drum bearing grinding in high-cycle households"
    description: "LG front-loaders in busy Pasadena homes hit 8-10 loads a week
      and the drum bearing typically starts going around year four — loud
      metal-on-metal noise during spin. Left alone, it wears through the rear
      drum seal and the spider arm follows. Catching it at the bearing stage
      saves roughly $200 versus replacing the full drum assembly."

  - title: "Water inlet valve failure — slow fill or no fill at all"
    description: "Mineral scale slowly narrows the inlet valve screen until the
      machine takes 20 minutes to fill or throws a 4E error and gives up
      entirely. Samsung french-door washer models in 91107 are repeat offenders
      for this. The valve itself is a $35-50 part — fast swap, but the machine
      has to come fully out from the wall to reach the back panel."

faq:
  - q: "How fast can you get to Pasadena for washer repair?"
    a: "We run SGV routes daily and usually park near Old Town or the Caltech
      corridor without trouble. Same-day calls typically land a tech at your
      door within 1-2 hours. Call (323) 870-4790 or schedule online — evening
      slots are available most days."

  - q: "Do you repair Bosch and KitchenAid washers specifically?"
    a: "Yes — both brands show up constantly in the neighborhoods west of Lake
      Avenue. Most common jobs: drain pump cleaning, door latch assembly
      replacement, and control board resets after error loops. We stock
      common Bosch and KitchenAid parts on the van."

  - q: "What does washer repair cost, and can you come out the same day?"
    a: "Diagnosis runs $65-85, credited toward the repair. Most jobs land
      between $150-350 depending on the part and model. Emergency same-day

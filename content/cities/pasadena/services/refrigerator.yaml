title: "Pasadena Refrigerator Repair — Hard Water, Tight Kitchens"

intro: |
  The Craftsman bungalows packed into Bungalow Heaven — those 1910s and '20s
  houses between Washington and Orange Grove — have kitchens that weren't built
  for a 36-inch KitchenAid french-door. Pull the unit out for compressor work
  and you're negotiating original cabinetry, plaster walls, and maybe 34 inches
  of clearance. Pasadena's tap water also runs notoriously hard, and that calcium
  build-up inside an ice maker assembly doesn't announce itself until the freezer
  stops making ice entirely.

localContext: |
  The 91104 and 91103 zips cover a real mix — 1910s bungalows near Washington
  Boulevard, mid-century ranches off Sierra Madre Villa, and newer condos along
  Colorado. Tight galley kitchens in the older stock make refrigerator pulls
  genuinely difficult work. Sub-Zero built-ins show up more frequently once you
  cross into the 91105 zip toward San Marino — those units need specialized
  diagnostic tools that a general appliance tech won't carry on the truck.

commonProblems:
  - title: "Mineral Scale Killing Ice Makers — Pasadena's Hard Water Problem"
    description: |
      Pasadena water ranks among the hardest in the San Gabriel Valley. Calcium
      deposits clog the water inlet valve and coat the ice maker assembly over
      12 to 18 months — LG french-door models are especially vulnerable to this.
      Descaling alone rarely fixes it. Usually the water inlet valve needs
      replacement before the ice maker runs clean again.

  - title: "Compressor Noise and Relay Failures in Summer Heat"
    description: |
      San Gabriel Valley summers push past 95°F, and refrigerators in south-facing
      kitchens or poorly ventilated garages run almost nonstop. The condenser fan
      motor takes the first hit under that load. On Samsung units, a compressor
      that starts rattling then suddenly goes quiet usually means the start relay
      has blown — catch it early and the compressor itself is usually salvageable.

  - title: "Evaporator Coil Ice Buildup in Bosch and KitchenAid Counter-Depths"
    description: |
      Counter-depth Bosch and KitchenAid units in Pasadena's older kitchens
      develop heavy frost on the evaporator coil when the defrost timer or
      defrost heater fails. The fridge section runs warm, the freezer accumulates
      ice slabs, and eventually the evaporator fan gets blocked entirely. A
      diagnostic usually spots this in 15 minutes — defrost timer swaps are
      same-day fixes in most cases.

faq:
  - q: "How fast can you get to Pasadena for refrigerator repair?"
    a: |
      We cover the 91103, 91104, and 91106 zips regularly and can usually
      dispatch within 2 hours. Call (323) 870-4790 — same-day slots fill up
      fast when the Valley heats up, so earlier is better. Evening appointments
      available if daytime doesn't work.

  - q: "Do you work on Sub-Zero and KitchenAid refrigerators in this area?"
    a: |
      Yes to both. KitchenAid ice maker assembly failures and control board
      issues are the most common calls we get in Pasadena. Sub-Zero built-ins
      require specific tools — we carry parts for the 600 and 700 series.
      Also handle LG, Samsung, and Bosch on a daily basis.

  - q: "What does a refrigerator repair visit typically cost in Pasadena?"
    a: |
      Diagnostic runs $75–$95 and gets credited toward the repair if you book
      same-day. For situations where food is actively at risk, mention that
      when you call (323) 870-4790 — we prioritize emergency dispatch and
      usually arrive within 2 hours. Online scheduling also available.
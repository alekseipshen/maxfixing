title: "Altadena Washer Repair — SGV Hard Water & Older Home Fixes"

intro: |
  Hard water off the San Gabriel Mountains hits Altadena appliances hard — mineral
  deposits clog inlet valves and spray jets faster than most LA neighborhoods. That
  LG front-loader running three loads a day in a 1950s craftsman off Mariposa Street
  has different problems than a machine in a new build. Calcium scale builds inside
  the drum bearing housing over time, and most homeowners don't notice until the spin
  cycle starts shaking the whole laundry room.

localContext: |
  Most of 91001 is older residential stock — craftsman bungalows, post-war ranches,
  and mid-century homes built between 1940 and 1965. Laundry closets in these houses
  are tight. A Bosch compact front-loader fits, but pulling it for service means
  navigating narrow hallways and pedestal platforms. The newer construction up near
  Loma Alta Drive leans toward Samsung and LG stacked units — different access
  problem, same hard water issue underneath.

commonProblems:
  - title: "Mineral Buildup Killing the Water Inlet Valve"
    description: "Altadena tap water runs hard — 300+ ppm in parts of 91001. That calcium
      deposits directly onto the water inlet valve screen and solenoid, restricting
      fill and triggering error codes like LE or 4E on Samsung units. The valve
      screens clog before most homeowners ever check them. Replacement is
      straightforward but skipping it leads to control board stress and bigger bills."
  - title: "Drum Bearing Failure in High-Mileage Front-Loaders"
    description: "A loud grinding or rumbling on spin usually means the drum bearing is
      going. Bosch and LG front-loaders in active households hit bearing wear around
      5-7 years, especially with hard water residue accelerating seal degradation.
      The tub has to come apart to replace the bearing and seal — it's a 2-3 hour
      job, not a quick fix. Ignoring it cracks the drum spider arm next."
  - title: "Drain Pump Clogged with Lint and Foreign Objects"
    description: "Coins, hair clips, a forgotten sock — older Altadena homes don't always
      have lint traps before the drain hose, and the pump filter gets skipped for
      years. A blocked drain pump throws an OE or F21 error and leaves clothes
      soaking wet. KitchenAid top-loaders have a different pump housing than LG,
      but the failure symptom is the same: water sitting in the tub after the
      cycle finishes."

faq:
  - q: "How fast can you get to Altadena for washer repair?"
    a: "From Pasadena we're usually in Altadena within 90 minutes, often same-day.
      Most streets off Lake Avenue and Altadena Drive have easy parking for the
      van. Call (323) 870-4790 to check today's availability — we keep evening
      slots open for working households."
  - q: "Do you repair Bosch and LG front-loaders specifically?"
    a: "Yes — those are the two machines we see most in 91001. Bosch drum bearing
      replacements, LG door latch assembly and control board issues, Samsung drain
      pump failures. We stock common parts for all three so most repairs finish
      in one visit."
  - q: "What does a washer repair typically cost in Altadena?"
    a: "Diagnostic visit is $75, applied toward the repair. A drain pump swap runs
      $150-$220 depending on the model; drum bearing jobs are $280-$380 with
      parts. Same-day emergency service is available — call early and we can
      usually get there before the laundry pile gets out of hand."

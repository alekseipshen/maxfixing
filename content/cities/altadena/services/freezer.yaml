title: "Altadena Freezer Repair — Craftsman Homes, High-End Units"

intro: |
  The evaporator coil problem shows up fast in Altadena. Foothill heat plus
  panel-ready freezers is a rough combination.

  Up along Calaveras Avenue and the foothill streets north of Altadena Drive, most
  kitchens in these 1920s-1940s Craftsman bungalows have been renovated — and a lot
  of those renovations included a KitchenAid column freezer or a Bosch integrated
  unit tucked behind cabinet panels. Altadena's summer heat rolling off the San Gabriel
  Mountains accelerates every failure mode: condensers clog with dry foothill dust,
  gaskets soften faster at sustained 90°F+ ambient temps, and compressors that cruise
  at 70°F coastal temps get pushed hard when a Craftsman kitchen hits 95°F with limited
  cross-ventilation. Zip code 91001 sits at about 1,400 feet elevation — the daily
  swings from cool mornings to scorching afternoons put extra cycling stress on
  refrigeration systems that flatland units simply don't see.

localContext: |
  The zip is almost entirely older residential — pre-war bungalows and 1950s-1960s
  ranch-styles on the streets south toward Pasadena, bigger foothill lots as you climb
  toward the mountains. Renovated kitchens in these homes often have panel-ready or
  integrated freezers where the compressor compartment sits tight against finished
  cabinetry. Not a lot of room to work.

  Service vans park on the street near Christmas Tree Lane (Santa Rosa Avenue) without
  issue, but getting inside these integrated units requires care to avoid cabinet damage.
  Altadena doesn't impose the parking enforcement Pasadena does on side streets, so
  scheduling same-day is simpler than in the city. The foothill lots also have long
  driveways and detached garages — relevant when we're pulling a chest freezer for
  condenser access or running a diagnosis on a garage unit that's been baking in summer
  heat since July.

commonProblems:
  - title: "Frost locking up KitchenAid and Bosch integrated columns in renovated kitchens"
    description: "Panel-ready freezers in these Altadena homes run longer duty cycles when the
      door gasket softens from heat exposure — and the gasket channel on KitchenAid
      column units warps over time. Humid air gets in, the evaporator coil frosts
      over solid, airflow collapses, and the unit can't pull down to temp. Homeowners
      usually notice the interior warming before they spot the frost buildup — the
      control panel on KitchenAid columns will sometimes throw a temperature alarm
      before visible ice forms. Replacing the gasket and manually clearing the coil
      usually stops the cycle before any control board diagnostics become necessary.
      Bosch integrated units have a tighter evaporator housing, so the frost blockage
      is often more severe by the time the unit shows symptoms — give it 48 hours after
      defrost to confirm airflow is restored before closing the cabinet panels back up."
  - title: "Compressor running nonstop but freezer section not reaching temperature"
    description: "On LG french-door models with a bottom freezer drawer — common in 91001
      renovations — a failed defrost timer or clogged condenser running in summer
      heat is the usual culprit. The compressor overworks, draws more current than
      the thermal fuse is rated for, and the fuse blows. Replacing just the fuse
      without fixing the defrost timer or cleaning the condenser means the same
      failure repeats within weeks."
  - title: "Temperature swings in garage chest freezers during July and August"
    description: "Detached garages on the older lots near Loma Alta Park regularly hit 105°F
      in peak summer. A Samsung or Whirlpool chest freezer wasn't designed for that
      ambient. Internal temps swinging 10-15 degrees is the first sign — the condenser
      fan motor is usually failing, unable to pull heat off the coils fast enough.
      Ignore it long enough and refrigerant pressure climbs until the compressor
      overloads. At that point you're looking at a compressor replacement on a chest
      freezer — rarely worth it on a unit under $800 retail. If you're seeing those
      swings in late summer, call before the compressor goes."

faq:
  - q: "How fast can you get to Altadena for a freezer repair?"
    a: "The 210 corridor is our regular route, so Pasadena to Altadena runs 20-30
      minutes depending on time of day. Same-day service is available most days —
      morning slots fill fastest because most people call after noticing the freezer
      temperature climbing overnight. Call (323) 870-4790 and we can usually have a
      tech there within 2 hours of your call. Evening appointments available most
      weekdays too."
  - q: "Do you work on KitchenAid and Sub-Zero freezers in Altadena homes?"
    a: "Yes, both are standard for us in this area. KitchenAid column freezers
      come in regularly with ice maker assembly failures and evaporator issues.
      Sub-Zero built-ins need OEM-matched parts — we carry the most common ones
      for LA-area built-ins. Bosch integrated units and LG bottom-freezer drawers
      are also in our regular rotation."
  - q: "What does a freezer repair typically run in Altadena, and how quickly can
      you get it done?"
    a: "Diagnostic is $85, credited to any repair. Most fixes — door gasket,
      defrost timer, condenser fan motor — land between $150 and $350 parts and
      labor. Compressor replacement on a high-end unit like a KitchenAid column
      or Sub-Zero we quote honestly; sometimes a rebuilt compressor makes sense,
      sometimes a new unit does. If the numbers don't work in your favor, we'll
      say so before pulling anything apart. Same-day and evening slots available
      most weekdays — call (323) 870-4790 to check today's schedule."
title: "Altadena Refrigerator — Foothill Heat & Hard Water Repairs"

intro: |
  Sitting at roughly 1,400 feet in the 91001 zip, Altadena gets baking summer heat rolling off the San Gabriel foothills — ambient garage temps push past 95°F by July, and that punishes compressors in KitchenAid French-door models especially hard. Craftsman bungalows along Mariposa Street often have refrigerators wedged into wall alcoves with zero airflow clearance, making the thermal stress worse. MaxFixing covers Altadena seven days a week, usually there within 2 hours.

localContext: |
  Much of Altadena's housing stock dates from the 1920s through the 1950s — craftsman bungalows, Spanish colonial revivals, mid-century ranches. Kitchens in these homes are tight, with appliances pushed into alcoves where condenser fans can't breathe properly. The 91001 zip also draws from a municipal supply blended with hard groundwater, enough calcium to calcify water inlet valves and ice maker assemblies within two to three years of normal use.

commonProblems:
  - title: "Compressor Failure Driven by Foothill Summer Heat"
    description: "July afternoons in Altadena regularly hit 95°F+, pushing refrigerator compressors well past their rated duty cycle. On Samsung and LG French-door units, a failing condenser fan compounds the problem — the compressor runs hot, trips on thermal overload, and the fridge stops cooling entirely. This pattern shows up reliably every summer in the 91001 area, usually June through August."
  - title: "Ice Maker Failure from Hard Water Mineral Deposits"
    description: "Altadena tap water deposits calcium in ice maker assemblies fast. The water inlet valve solenoid clogs first, then ice production drops to nothing or the unit cycles constantly without making ice. Bosch and KitchenAid counter-depth models are frequent victims. Flushing the line doesn't fix it — the valve needs replacement, and the ice tray assembly should be descaled at the same visit."
  - title: "Evaporator Coil Ice Buildup in Older Craftsman Kitchens"
    description: "Poor ventilation in tight 1930s and 1940s Altadena kitchens causes evaporator coils to ice over steadily. A worn defrost timer stops the auto-defrost cycle from clearing the buildup, and airflow drops until the fridge can't maintain temp. Sub-Zero built-ins in the larger homes near Cobb Estate Road have a more complex evaporator compartment — panel removal and specific torx tooling required."

faq:
  - q: "How fast can you get to Altadena for refrigerator repair?"
    a: "Usually within 2 hours from our San Gabriel Valley base — we run up the 210 and reach most of the 91001 zip without much delay. Call us at (323) 870-4790 or schedule online. Same-day slots available most weekdays and Saturdays."
  - q: "Do you repair Bosch and KitchenAid refrigerators in Altadena?"
    a: "Bosch counter-depth and KitchenAid French-door are two of the most common units we see in Altadena. We also handle Sub-Zero and Thermador built-ins in the larger foothill homes. Parts for all four brands are stocked in the van."
  - q: "What does refrigerator repair typically cost in Altadena?"
    a: "A water inlet valve swap runs $120–$180 including labor. Compressor work on LG or Samsung units lands between $300–$450 depending on the model. We diagnose on the first visit and quote before touching anything. Evening and weekend slots available for urgent calls."

title: "Altadena Cooktop Repair — Craftsman Kitchens, Real Fixes"

intro: |
  Craftsman bungalows along Mariposa Street and New York Drive get a lot of
  kitchen gut-renovations. Homeowners pull out the old setup and drop in a
  Bosch five-burner induction unit or a KitchenAid gas cooktop — beautiful
  appliances, but they need a technician who's actually worked on them when
  something goes wrong. Eaton Canyon is two miles up the hill; we cover the
  whole 91001 zip down to the Pasadena border, usually within two hours of
  your call. Altadena's income bracket means these aren't budget-brand kitchens
  — a Thermador gas cooktop or a Bosch induction panel is a real investment, and
  a band-aid fix isn't what the homeowner paid for. Call (323) 870-4790 for
  same-day availability most weekdays.

localContext: |
  Most of Altadena's housing was built between the 1920s and 1960s —
  Craftsman bungalows, Spanish Revival, and post-war ranch homes clustered
  around Loma Alta Drive and Christmas Tree Lane. Kitchens in these older
  properties were designed for freestanding ranges, so retrofitting a
  built-in cooktop means tighter clearances and sometimes undersized gas
  supply lines. The 91001 zip has a high concentration of these renovated
  kitchens; the 91003 area skews newer but still has plenty of mid-century
  builds running on aging electrical panels.

  Induction cooktops expose old wiring fast. A 40-amp dedicated circuit is
  required, and plenty of these homes never had one until the remodel. That
  means the first symptom isn't always the cooktop itself — sometimes it's a
  tripped breaker or a loose neutral in a junction box three feet away. Gas
  supply lines are the same story: older black-iron pipe runs at lower pressure
  than a high-BTU burner wants. We check the supply side before assuming the
  cooktop is the problem.

commonProblems:
  - title: "Gas Igniter Electrode Failures in Renovated Kitchens"
    description: "Retrofitted Craftsman kitchens often leave KitchenAid and Bosch
      gas cooktops with poor ventilation clearance overhead. Moisture from old
      plaster walls settles on the igniter electrode, causing weak or no spark.
      The fix is usually a replacement igniter module — not just cleaning — once
      the ceramic tip has cracked from repeated thermal cycling. Cleaning a
      cracked electrode buys a week, maybe two."

  - title: "Uneven Heat and Cracked Ceramic on Induction Units"
    description: "Bosch induction cooktops are common in higher-end Altadena
      kitchens, and a dropped cast-iron skillet can crack the glass-ceramic
      surface in one shot. Cracks also develop slowly when the heating element
      beneath runs unevenly due to a failing control board. Either way, a surface
      crack compromises the induction coil underneath and becomes a safety issue.
      A hairline crack that doesn't affect performance today will fail the
      cooktop entirely within months."

  - title: "Gas Valve Stem Wear on High-BTU Burners"
    description: "Thermador and KitchenAid gas cooktops with sealed high-BTU
      burners see heavy use in households that actually cook. The knob connects
      directly to a valve stem, and that stem wears out — the knob starts
      spinning freely or won't hold a simmer position. Replacing the valve stem
      assembly fixes it; swapping just the knob cap does not. On Thermador units
      especially, the stem is brand-specific and takes a few days to source if
      we don't have it in stock."

  - title: "Samsung and LG Touchpad Lockouts on Induction Units"
    description: "Samsung and LG induction cooktops show up often in Altadena's
      mid-range kitchen remodels, and both brands have a recurring problem with
      capacitive touchpad failures after three to five years. The panel reads
      touches inconsistently or locks into child-lock mode with no obvious
      trigger — the display shows a key icon or throws an E-01 error. Usually the
      fault is in the touchpad membrane itself, not the main control board.
      Replacing just the membrane assembly runs $120–180 in parts versus $350+
      for a full board swap. Diagnosing it correctly before ordering parts saves
      real money here."

faq:
  - q: "How fast can you get to Altadena for cooktop repair?"
    a: "We're 20-30 minutes from Pasadena and run same-day slots including
      evenings for the 91001 and 91003 zips. Gas smell or a sparking burner
      gets priority — call (323) 870-4790 and we'll move things around to get
      there fast."

  - q: "Do you repair Bosch and Thermador cooktops specifically?"
    a: "Yes, those two come up constantly in this part of the Valley. Bosch
      induction control boards, Thermador gas valve stems, KitchenAid igniter
      assemblies — we carry the common failure parts. No waiting a week for
      a specialist."

  - q: "What does a cooktop repair typically cost here?"
    a: "Diagnostic fee applies toward the repair. Most jobs — igniter module,
      valve stem, heating element swap — land between $150 and $380 parts and
      labor. Same-day availability most weekdays. Schedule online or call
      (323) 870-4790."

  - q: "My induction cooktop shows an error code — does that mean the control board is shot?"
    a: "Not necessarily. Bosch induction units often throw an E9 or a no-zone
      error when the real culprit is a temperature sensor or a loose ribbon cable
      between the touchpad and the main board — parts that run $30–60 rather than
      $300+. Samsung's E-01 lockout is frequently the membrane assembly, not the
      board. A proper diagnostic takes about 20 minutes and tells you exactly
      which component failed. Skipping that step and guessing on parts is how
      a $180 repair turns into a $600 one."
title: "Altadena Range Hood — Old Ducts, New Hoods, Fixed Right"

intro: |
  The Craftsman bungalows along Mariposa Street and the hillside lots climbing toward the San Gabriel foothills were built in an era when range hoods barely existed as a standard feature. Retrofit kitchens in these 1920s-1940s homes often have a Bosch or KitchenAid chimney hood crammed into ductwork that was never sized for modern CFM output. That mismatch between a high-output blower and a restrictive original duct run is exactly where problems start — and it's why range hood jobs in Altadena tend to run deeper than they first appear.

  Tight attic clearance and century-old wall cavities change the job from the moment the first panel comes off.

localContext: |
  Most of the 91001 zip is pre-1960 construction — Craftsman bungalows, Spanish Colonial revivals, and mid-century ranches that received kitchen remodels decades later without anyone touching the ventilation rough-in. Duct runs typically go through attic space or wall cavities using flexible aluminum sections that separate at the seams over time. LA's notoriously hard water accelerates grease-and-mineral buildup inside older plumbing and exhaust ductwork alike, and Altadena's hillside neighborhoods north of Altadena Drive have some of the tightest kitchen layouts we encounter anywhere in the San Gabriel Valley — compact galley setups with limited clearance above the range. East Altadena streets like Maiden Lane near Farnsworth Park require extra parking planning that flat-neighborhood calls don't. The elevation and mature oak canopy in this part of 91001 also mean attic access is trickier than it looks from street level.

commonProblems:
  - title: "Grease Filter Fully Blocked — Fan Runs but Airflow Stops"
    description: |
      LA hard water and daily cooking combine to turn mesh and baffle grease filters into near-solid plaques within months. The blower wheel keeps spinning, but the blocked filter creates back-pressure that overloads the motor windings.

      On Bosch 800 Series hoods — one of the most common installs we see in 91001 — a long-clogged filter eventually burns out the capacitor entirely. That turns what could have been a $40 cleaning into a full motor replacement. Once the hood starts smelling hot during cooking, the motor windings are already stressed past the point of a simple fix.

  - title: "Blower Motor Grinding or Stuck at One Speed"
    description: |
      That low grinding or rattling noise from behind the hood canopy is usually the blower wheel off-balance from grease accumulation, or the motor shaft bearings worn through from heat cycles. Altadena's summer heat pushes well past 95°F in the foothills, and kitchens without working hoods trap radiant heat from the cooktop — wearing out bearings faster than in coastal zip codes.

      The control board on KitchenAid chimney hoods is wired directly into the fan speed circuit. Board failure shows up as a fan locked into one setting, touch controls that stop responding, and sometimes an error code on the panel display.

  - title: "Vent Duct Separated Inside the Wall or Ceiling"
    description: |
      This is the most common range hood call we get from Altadena. Flexible aluminum duct routed through attic space pulls apart at the joints over time — foil tape loses adhesion, and blower motor vibration does the rest.

      The hood sounds completely operational while grease-laden steam exhausts straight into the attic cavity. Samsung and LG under-cabinet units will silently switch into recirculating mode when duct static pressure drops, so homeowners often have no idea the exhaust connection failed months ago. By the time attic insulation shows grease staining, that reconnection job has grown into a cleanup call too.

faq:
  - q: "How fast can you get out to Altadena for range hood repair?"
    a: |
      Altadena sits about 20-30 minutes from our regular San Gabriel Valley routes, and we're in the 91001 zip nearly every weekday. Same-day slots are usually available if you call before noon. Reach us at (323) 870-4790 and we'll route the closest available tech your way.

  - q: "Do you repair Bosch and KitchenAid range hoods, or just standard brands?"
    a: |
      Bosch and KitchenAid are the most common hood brands we service in this neighborhood. Thermador wall-chimney units and Viking island hoods come up regularly in the larger hillside properties above Altadena Drive. Most frequent repairs across all of them: blower wheel rebalancing, motor replacement, control board swap, and duct resealing at disconnected joints.

  - q: "What's the usual process and cost for a range hood repair visit?"
    a: |
      Diagnostic is a flat fee — you know the cost of the visit upfront. Most repairs including motor, control board, or duct work get done same-day if the parts are already on the van. Evening slots are available for homes in 91001. After diagnosis, you get a firm quote before anything is touched.

  - q: "My range hood filter says to clean it monthly — is that realistic?"
    a: |
      Monthly is the manufacturer's target, but most households in 91001 run baffle or mesh filters two to three months before they hit critical saturation. Metal baffle filters on KitchenAid and Thermador hoods handle a dishwasher cycle fine for routine cleaning. The problem is when it gets skipped entirely — grease migrates to the blower wheel, and the motor starts working against itself. Call (323) 870-4790 if the fan sounds labored or airflow has dropped noticeably; evening slots are available.
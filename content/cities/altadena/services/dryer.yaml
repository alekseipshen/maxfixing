  - q: "Do you repair LG, Samsung, and KitchenAid dryers?"
    a: |
      All three show up constantly in this area. LG calls are usually drum bearing
      replacement or a control board reset after error codes. Samsung front-loaders
      often need drive belt or drum roller work. KitchenAid gas units — thermal fuse
      and gas valve igniter are the usual suspects. Same-day parts availability for
      all three brands.

  - q: "How much does dryer repair cost in Altadena, and do you quote upfront?"
    a: |
      Diagnostic is flat-rate; the tech quotes the repair before any work starts.
      Most jobs in the 91001 area run $120–$280 depending on parts — thermal fuse
      replacement is on the lower end, heating element or control board jobs cost

title: "Altadena Dryer Repair — Craftsman Homes, Mountain Heat"

intro: |
  Craftsman bungalows along Mariposa Street and the ranch houses near Lake Avenue
  have laundry setups that were added as afterthoughts — cramped corners, short
  exhaust runs, minimal airflow. That combination is brutal on dryers. Fixed a
  KitchenAid gas dryer off Santa Rosa Avenue last month where the thermal fuse had
  blown twice in three years — not a fuse problem, a venting problem nobody had
  actually diagnosed.

localContext: |
  The 91001 zip runs mostly pre-war craftsman and 1950s-era ranch houses, with
  laundry pushed into garages or enclosed porches. Venting distances are short but
  often kinked — especially in homes along the Altadena Drive corridor. A few newer
  builds up near Loma Alta Drive have proper dedicated laundry rooms, but they're
  the exception. Either way, restricted exhaust paths mean drum rollers and heating
  elements wear out faster than the manufacturer estimates.

commonProblems:
  - title: "Thermal Fuse Keeps Blowing — Heat and Bad Duct Routing"
    description: |
      San Gabriel Valley summer heat pushes gas dryers hard. A thermal fuse on a
      Samsung gas dryer isn't designed to blow repeatedly — when it does, the root
      cause is usually exhaust duct restriction or a failing gas valve igniter
      forcing the burner to run longer. Replacing the fuse without fixing the
      airflow just delays the next failure by a few months.

  - title: "Loud Thumping Mid-Cycle — Drum Roller Breakdown"
    description: |
      Older LG front-load dryers in Altadena's mid-century homes develop a rhythmic
      banging that worsens over time — that's almost always drum rollers or a worn
      drum bearing. Dry heat accelerates wear on the plastic roller supports.
      Usually both front and rear rollers need replacement together; doing just one
      buys maybe six more months before the noise comes back.

  - title: "Clothes Still Damp After a Full Cycle — Blower Wheel Clog"
    description: |
      Lint accumulates inside the blower wheel housing — not the lint trap, the
      internal wheel itself. Bosch condensation dryers and standard vented units
      both suffer this in tighter laundry spaces. Output drops 30–40% before cycle
      time noticeably increases. Cleaning the blower wheel and testing the moisture
      sensor takes about an hour but fully restores drying capacity.

faq:

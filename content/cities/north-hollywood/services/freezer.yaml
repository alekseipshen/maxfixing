title: "North Hollywood Freezer — Valley Heat Wears Units Down Fast"

intro: |
  Garage freezers in North Hollywood get punished. The NoHo Arts District (91601)
  sits dead center in the Valley heat corridor, where afternoon temps in July and
  August regularly hit 105°F in an unshaded detached garage. A Kenmore upright
  sitting out there cycles almost nonstop just to hold 0°F. Compressors burn
  early. Door seals crack. Frost accumulates where it shouldn't.

  These aren't random failures — the climate here creates them. The same heat
  baking the asphalt on Lankershim Boulevard is radiating through your garage wall
  into the condenser coil all afternoon. Stack that on top of a unit that's already
  15 years old, and you've got a repair call waiting to happen.

localContext: |
  North Hollywood's residential side runs mostly 1950s–1970s single-family homes
  and older duplexes, especially in zip 91605 west of Lankershim Boulevard. Rental
  units in these older buildings often have appliances that haven't been swapped
  since the '90s. Kitchen layouts are tight — galley-style with little room for
  ventilation.

  Chest freezers frequently end up in detached garages with southwest-facing walls,
  which creates a heat load no stock condenser fan was built to handle. In the
  blocks around Tujunga Avenue and Victory Boulevard, we see these garage setups
  in nearly every third house we visit.

  One more factor worth naming: North Hollywood has some of the Valley's older
  rental stock. A landlord who bought a duplex in 1988 probably still has the
  original appliances in there. That Frigidaire upright in 91605 could easily be
  pushing 25 years. Parts still exist for most of them — but the failure rate
  accelerates hard once you're past the 15-year mark in this kind of heat exposure.

commonProblems:
  - title: "Compressor Overload From Garage Heat Exposure"
    description: |
      A freezer in a hot, unventilated garage forces the compressor to run
      nearly continuous cycles. On GE and Frigidaire uprights, this eventually causes
      the compressor start relay to fail — the unit clicks on, runs briefly, then
      shuts off without reaching temperature.

      Interior temps drift up to 18–25°F before anyone notices food is soft.
      Catching it early usually means a relay swap, not a full compressor
      replacement. The relay itself costs $15–30. We carry them for GE and
      Frigidaire because it's that common in this zip code. Full compressor
      replacement on an older unit rarely makes financial sense — we'll tell
      you that straight if it gets to that point.

  - title: "Evaporator Coil Icing Over — Blocked Airflow"
    description: |
      This is the most common freezer complaint in 91606. A failed defrost
      heater or defrost timer lets frost accumulate on the evaporator coil until
      air can't circulate. Whirlpool uprights with the coil tucked behind the
      back wall are especially prone.

      You'll hear the unit running but notice one section staying warmer than the
      rest — usually the upper shelf area. Newer Samsung uprights sometimes throw
      an E2 fault code when airflow drops below threshold. Defrost heater
      replacement is usually a same-day fix. On a Whirlpool, the whole job takes
      about 90 minutes once we pull the back panel.

  - title: "Door Gasket Cracking on Older Rental Units"
    description: |
      Amana and Kenmore chest freezers in North Hollywood rental properties
      often have original door gaskets that are 10–15 years old. The rubber dries,
      stiffens, and loses its seal.

      Warm air infiltrates constantly — the compressor compensates by running long
      cycles, and the electric bill climbs before anyone connects the two. Test it
      yourself: close a dollar bill in the door and try to pull it out. Slides out
      easily? The gasket isn't sealing. A replacement gasket on a Kenmore chest
      freezer runs $45–80 in parts — a straightforward swap that doesn't require
      pulling the unit from the wall.

faq:
  - q: "How fast can you get to North Hollywood for freezer repair?"
    a: |
      From our regular route through Burbank and the 170, North Hollywood is
      usually a 30–45 minute drive. Same-day slots are open most days — call
      (323) 870-4790 in the morning and we can typically be there by early
      afternoon.

      Evening appointments are available on request. If it's a full-loss situation —
      a chest freezer packed with food and temps climbing — say that when you call.
      Those get prioritized.

  - q: "Do you repair older Kenmore and GE freezers common in this area?"
    a: |
      Kenmore, GE, Whirlpool, Frigidaire — those four cover probably 80% of
      what we see in North Hollywood. On GE uprights we most often replace defrost
      timers and door gaskets. Kenmore chest freezers tend to need lid hinge work
      and temperature thermostat replacements on the older models.

      Parts availability on early-2000s units is still solid for these brands.
      Samsung is trickier — control boards take 3–5 days to source, so we'll
      flag that upfront if there's a lead time involved.

  - q: "Is it worth repairing a freezer or just buying a new one?"
    a: |
      Depends on the failure. A bad door gasket or defrost heater on a Samsung
      or Frigidaire upright is $90–160 in parts and labor — a new mid-range unit
      runs $400+. Compressor work is the tipping point.

      A 12-year-old Amana with a dead compressor? Replacement makes more sense.
      A 6-year-old GE upright with a failed defrost timer? Fix it every time.
      Schedule a diagnostic call at (323) 870-4790 and we'll give you a straight
      answer — no upselling a repair that doesn't pencil out.
title: "North Hollywood Range — Gas Lines, Old Kitchens, Fast Fixes"

intro: |
  Lankershim Boulevard and the side streets around Camarillo in 91601 are full of gas ranges that
  haven't seen a service call since they were installed. Kenmore four-burner freestanding models are
  everywhere in these kitchens — they work until the spark igniter module cracks and half the cooktop
  stops lighting. North Hollywood apartments pack ranges tight against cabinetry, trapping heat along
  the back panel and accelerating control board damage over time.

  Most calls from this zip are parts jobs on units pushing 18-20 years old.

localContext: |
  The rental stock in 91606 — north of Oxnard Street toward Roscoe — was built in the late 1950s and
  early 1960s. These are two-story stucco courtyard buildings with original gas lines feeding ranges
  that have belonged to three or four sets of tenants. Gas pipe joints that old can develop slow weeps
  around the range connection, and the flexible connector behind the unit is usually overdue for
  replacement too.

  The NoHo Arts District around Lankershim and Magnolia, near the NoHo Metro station, sees fast
  turnover — which means hard use and zero maintenance between renters. Over in 91605, older duplexes
  west of Lankershim run GE and Whirlpool freestanding models almost exclusively. Standard appliances
  in any rental built before 1975. Pre-1980 kitchens in these duplexes often have the range jammed
  into a 30-inch opening with almost no clearance on either side, so removing the unit for certain
  repairs takes longer than the repair itself.

commonProblems:
  - title: "Spark Igniter Failure After Years of Grease and Heat Cycling"
    description: |
      Ceramic spark igniters on Kenmore and Frigidaire gas ranges crack from grease saturating the
      electrode base over time. The burner clicks constantly without lighting — or ignites on one
      side only.

      On most freestanding models, the igniter module and the individual electrode assemblies are
      separate replaceable parts, so swapping just the cracked electrode usually solves it without
      touching the module. Parts typically under $80, about an hour on-site. This is also the most
      common call we get from the apartment buildings along Magnolia in 91605, especially units
      running Samsung slide-in models installed during renovations in the 2010s.

  - title: "Oven Runs Cold or Shuts Off Before Reaching Temperature"
    description: |
      GE and Whirlpool gas ranges show a specific failure pattern in older Valley homes: the hot
      surface igniter weakens, can't draw enough current to open the gas valve, and the oven shuts
      off 10 minutes in. Check if the oven light comes on but no heat builds within 5 minutes —
      that's the hot surface igniter failing, not a thermostat issue. Electric models fail
      differently: the bake element glows red on one end and dark on the other. Both are same-day
      repairs with parts we carry in stock.

  - title: "Gas Smell Near the Burners — Samsung and Amana Models Especially"
    description: |
      A sulfur smell near a Samsung or Amana range almost always points to a cracked burner valve
      seal or a gas valve body starting to weep. These seals dry out faster in San Fernando Valley
      heat — summer temps push the kitchen ambient well past 90°F in apartments without AC.

      Turn off the gas shutoff behind the range, open windows, and call (323) 870-4790 immediately.
      Gas leaks get same-day priority scheduling, and we're usually at a North Hollywood address
      within 90 minutes of the call.

faq:
  - q: "How fast can you get to North Hollywood for a range repair?"
    a: |
      North Hollywood sits right off the 170 and 101, so we route through the Valley cleanly.
      Most calls in 91601 and 91606 get a technician within 90 minutes. Street parking near the
      duplexes and courtyard apartments along Burbank Boulevard is usually available — tight blocks
      but manageable. Call (323) 870-4790 to book same-day or grab an evening slot online —
      weekday evenings tend to fill by noon.

  - q: "Do you repair GE, Kenmore, and Frigidaire gas ranges?"
    a: |
      Those three cover most of what we see in North Hollywood. GE usually needs a bake element
      or hot surface igniter. Kenmore four-burners tend to need spark module or electrode
      assembly work. Frigidaire slide-in models develop control board failures on units over 10
      years old. Parts in stock for all three, and most repairs close the same visit without
      a return trip.

  - q: "What does range repair typically cost in North Hollywood?"
    a: |
      Diagnosis is $65, applied toward the repair if you proceed. Spark igniter and electrode
      work runs $100-150 all-in. Bake element swaps are $120-180. Gas valve repairs go
      $200-300 depending on the model.

      Same-day appointments are open most weekdays and evenings. Slots in 91601 and 91606 fill
      fast — call (323) 870-4790 early if you need it today.
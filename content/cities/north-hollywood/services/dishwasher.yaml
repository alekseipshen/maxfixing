title: "North Hollywood Dishwasher — Hard Water & Drain Pump Repairs"

intro: |
  The apartment blocks along Lankershim and Burbank Blvd — most built between 1960 and 1985 — run dishwashers daily in kitchens that weren't designed for heavy use. Tap water in 91601 and 91606 is notoriously hard, clocking in around 300–350 mg/L of dissolved minerals. That load hits the spray arm first. A Kenmore or GE unit in these older buildings typically starts showing calcium buildup in the inlet valve by year three. By year five, the control board is reading false signals because mineral crust is bridging contacts on the float switch.

localContext: |
  NoHo's residential core west of Lankershim is mostly 1960s-era stucco courtyard buildings and two-story walk-ups. Getting to an under-counter dishwasher in those tight kitchens takes longer — sometimes the fridge moves first. Zip codes 91601 and 91605 have the densest concentration of older multi-unit stock. The buildings near the NoHo Arts District along Magnolia Blvd have been renovated, but the rough-in dimensions are still 1965 vintage — standard 24-inch cavity, but the cabinetry is often warped from decades of steam cycles, which makes pulling the unit out a two-person job.

  Newer condos on the east side near Vineland Ave run higher-end units — occasionally a Bosch 500 series or a Miele — but the bulk of our calls come from the older residential blocks. Gas shutoffs and electrical panels in these buildings are sometimes buried behind appliances, so knowing the layout matters before you touch anything.

commonProblems:
  - title: "Spray arm and float switch clogged by mineral deposits"
    description: "Valley tap water deposits calcium fast inside dishwasher spray arms and inlet valves. A Whirlpool or GE unit running on North Hollywood's supply will usually show reduced wash pressure within two years — dishes come out cloudy, the bottom rack stays dirty while the top rack looks fine. That's a blocked lower spray arm nine times out of ten. Cleaning the arm doesn't help once it's cracked from mineral stress — replacement is the right call. The float switch underneath the tub collects the same residue, sticking in the raised position and triggering a false overflow cutoff. We carry both parts on the truck for GE and Whirlpool models."
  - title: "Standing water after the cycle — drain pump failure"
    description: "Pooling water at the bottom of the tub almost always points to a clogged or failed drain pump. Frigidaire and Samsung units are the ones we pull most in 91606 for this exact issue. Food debris combines with hard water residue to jam the pump impeller — sometimes it's a $40 part, sometimes the housing is cracked and needs full pump replacement. A Samsung unit will throw an OC or 5C error code on the display before the water even settles; a Frigidaire just stops draining silently. Either way, ignoring it for more than a day risks water wicking into the subfloor under these older buildings — a much bigger problem than the dishwasher."
  - title: "Detergent dispenser won't open mid-cycle"
    description: "The dispenser latch assembly on older Kenmore and GE models gets gummed up with detergent residue fast, especially without rinse aid in hard water. When the latch fails, either the door spring is broken or the control board has stopped sending the release signal at the correct point in the wash cycle. Both are fixable without pulling the unit or buying a new dishwasher. On Kenmore 665 series models specifically, the wax motor that drives the dispenser door is a known failure point after about eight years — a $25 part that most technicians skip diagnosing because the control board is easier to blame."
  - title: "Door latch assembly and heating element failures"
    description: "Amana and older Whirlpool dishwashers in NoHo apartments frequently come in with a door that won't latch cleanly — the strike gets bent from years of people pushing it shut with a foot. No latch, no cycle start. The fix is usually a new latch assembly, not a new door. Separately, the heating element at the base of the tub fails on units that run multiple cycles daily in hard water conditions. Dishes stay wet, the dry cycle skips, and energy use climbs. Replacing the element on a Whirlpool or Amana takes about 45 minutes once the unit is out."

faq:
  - q: "How fast can you get to North Hollywood for dishwasher repair?"
    a: "Most North Hollywood calls get same-day service — we run the 101 and 170 freeways and usually reach 91601 or 91606 within 2 hours of booking. Street parking on Lankershim gets tight midday but we work around it. Call (323) 870-4790 to check today's open slots."
  - q: "Do you repair GE and Kenmore dishwashers in North Hollywood apartments?"
    a: "GE, Kenmore, Whirlpool, Frigidaire, and Amana are the brands we see most in NoHo's older apartment stock. Drain pumps, spray arms, detergent dispenser latches, door latch assemblies, heating elements — most parts are stocked on the truck so we're not waiting on a parts order. For Samsung units showing OC or 5C error codes, same deal."
  - q: "What does dishwasher repair cost and how does the process work?"
    a: "Diagnostic visit runs $65, applied toward the repair if you proceed. Most jobs land between $120 and $250 depending on the part. Evening and same-day emergency slots are available — call (323) 870-4790 or schedule online. We quote before touching anything."
  - q: "Is hard water in North Hollywood really that bad for dishwashers?"
    a: "LA's water hardness is among the highest in California. North Hollywood tap water, fed through the Tillman Water Reclamation Plant system, consistently tests hard. That means mineral scale on spray arms, inlet valves, and heating elements builds up roughly twice as fast as in softer-water cities. Running rinse aid every cycle and descaling with citric acid annually extends appliance life significantly — but once the inlet valve screen is fully calcified, cleaning won't restore flow."
title: "North Hollywood Range Hood — Duct, Motor & Grease Buildup"

intro: |
  Apartments along Lankershim and the older fourplexes near the NoHo Arts District get heavy
  cooking use — most of them shipped with a stock Kenmore or GE range hood that was never
  overbuilt. Grease accumulates fast above a gas burner in a small galley kitchen.

  When the blower stops pulling smoke or the light socket dies, it's not cosmetic. That's a real
  ventilation failure that pushes combustion byproducts back into the living space. In a
  600-square-foot apartment, that matters fast.

  Gas ranges are everywhere in North Hollywood — and range hoods paired with gas burners take
  on significantly more grease load than electric setups. The higher BTU output means more
  aerosolized grease hitting the blower wheel every time someone actually cooks. Most tenants
  don't clean the aluminum mesh filters until something fails.

localContext: |
  North Hollywood's 91605 and 91606 zip codes are dense with 1950s and 1960s apartment
  buildings where duct runs are short, kinked, and sometimes partially blocked by decades of
  grease residue. Original builders didn't plan for serious cooking exhaust.

  The San Fernando Valley pushes 95°F in July, meaning range hoods in these units run longer
  hours than anywhere on the coast — motor bearings and blower wheels wear out noticeably
  faster here than in cooler climates. A bearing that might last eight years in Culver City
  can go in five in North Hollywood.

  Access is another real issue. Buildings on Tujunga Avenue and around Magnolia Park have
  narrow kitchen layouts — sometimes the range hood is tucked under a low cabinet with maybe
  four inches of clearance on either side. Getting the motor housing out without damaging
  the cabinet finish takes patience and the right socket extensions. Street parking on the
  residential blocks east of Laurel Canyon can also slow things down, so we call ahead when
  we're en route.

  LA's hard water adds another layer. Even range hoods with recirculating charcoal filters
  pick up mineral deposits around the fan housing when condensation drips back in. Dishwashers
  and ice makers get talked about more, but the same calcium buildup problem hits range hood
  grease traps and internal ductwork in these older buildings.

commonProblems:
  - title: "Motor Hums But Airflow Is Dead — Stripped Blower Wheel"
    description: "Older GE and Kenmore hoods in these 1960s apartment kitchens show this constantly: the
      motor runs, the hum is there, but almost nothing moves at the vent. Usually the blower wheel
      has cracked or stripped from sustained grease loading. Swapping the wheel and degreasing the
      housing restores full airflow without replacing the entire unit.

      On the Kenmore 233 series specifically, the wheel is a press-fit onto the motor shaft — if
      it's slipping rather than spinning true, the fix is a new wheel and a shaft inspection, not
      a full motor swap. Saves about $60 over replacing the motor unnecessarily."

  - title: "Grinding Racket on High Speed — Failed Motor Capacitor"
    description: "Whirlpool and Frigidaire under-cabinet hoods in North Hollywood apartments develop a
      grinding or rattling on high when the run capacitor weakens. The motor can't sustain RPM,
      and the fan blades start vibrating against the housing shroud. A capacitor replacement —
      sometimes combined with a bearing lubrication — clears the noise in a single visit.

      This failure tends to show up first on the highest speed setting. If your hood runs quietly
      on low but shakes the cabinet on high, that's the capacitor, not the motor itself. Replacing
      the wrong part wastes money."

  - title: "Light Stopped Working After Grease Filter Got Ignored"
    description: "Samsung's under-cabinet hoods share a wiring harness between the light circuit and
      the fan assembly. In rental units where aluminum mesh grease filters go months without cleaning,
      grease migrates into the hood cavity and shorts the lamp socket. Cleaning the filters and
      replacing the socket assembly brings both the light and the fan speed control back online.

      Amana hoods in older units have a similar design — one shared harness running both functions.
      The repair is straightforward once you pull the filters and get eyes on the wiring. Most
      technicians quote this as an hour job."

faq:
  - q: "How fast can you get to North Hollywood for Range Hood repair?"
    a: "We cover the Valley from Santa Clarita down to Burbank, so North Hollywood is a short
      run. Usually there within 2 hours of your call — Lankershim, Magnolia, Tujunga Ave, we
      know the parking drill. Call (323) 870-4790 for a same-day window."

  - q: "Do you repair Kenmore and Whirlpool range hoods in apartments?"
    a: "Yes — Kenmore and Whirlpool are the two hoods we pull apart most often in North Hollywood
      apartments. Also handle GE, Frigidaire, Samsung, and Amana regularly. Most common jobs:
      blower motors, failed capacitors, clogged grease filters, wiring harness shorts, and vent
      duct reconnections where the flex duct has detached from the wall cap. Bring the model number
      off the hood's interior label if you have it — speeds up the parts check before we arrive."

  - q: "What does a range hood repair cost, and is same-day available?"
    a: "Most fixes land between $80 and $180 depending on the part. Evening slots available most
      weekdays. If your hood is pulling smoke back into the kitchen instead of out, call
      (323) 870-4790 and we'll get someone out the same day. Waiting on a ventilation failure
      in a small apartment isn't worth it."
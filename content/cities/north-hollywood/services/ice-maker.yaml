title: "North Hollywood Ice Maker — Valley Heat Stops For No One"

intro: |
  Summer in the San Fernando Valley hits triple digits, and that puts every ice maker in 91601 under real strain. That GE side-by-side is cycling its compressor harder than anything on the Westside ever would. North Hollywood's municipal water carries the same heavy mineral load as the rest of the city — calcium deposits quietly narrowing the fill valve until ice production stops completely, usually right before a holiday weekend.

  The 91605 corridor sees the same pattern. Rental units along Lankershim and down toward Burbank Blvd mostly run unfiltered tap water through older Whirlpool and Frigidaire lines. By the time a North Hollywood renter notices the tray is empty, the fill valve has been struggling for months. Call (323) 870-4790 — same-day service is available most days.

localContext: |
  The rental apartments and older single-family homes around the NoHo Arts District and down into 91605 were largely built in the 1960s and early 70s. Galley kitchens are tight, original plumbing is still active, and hard water has had decades to do damage. Whirlpool and Frigidaire refrigerators are everywhere in this part of North Hollywood — workhorses that run 15 years until the ice maker assembly quietly gives out.

  The stretch along Tujunga Ave toward 91606 has owner-occupied bungalows with original 1950s kitchen layouts. Refrigerators get tucked into alcoves with barely any clearance on either side, which means the condenser fan struggles to exhaust heat and every internal component runs hotter than it should. Kenmore fridges from the mid-2000s are still running in a lot of these North Hollywood homes — solid machines, but the harvest sensors and inlet valves are aging into failure mode now.

commonProblems:
  - title: "Mineral Scale Killing the Water Inlet Valve"
    description: |
      LA's hard water — measurably high in dissolved calcium — coats the water inlet valve until flow drops below what the ice maker needs to cycle. On older GE and Whirlpool models in 91601, this is extremely common. The unit is mechanically fine; it just can't push enough water through a calcified valve to form a full cube.

      The early sign is slow production — fewer cubes per hour, smaller than usual, or a white mineral crust on the cube surface. In North Hollywood specifically, where LADWP water regularly tests above 350 ppm of dissolved minerals, a valve that's been running five-plus years without a filter is likely already partially blocked. Replacement runs about 30 minutes and usually costs under $200.

  - title: "Frozen Fill Line During Summer Heat Waves"
    description: |
      Sounds counterintuitive in July, but frozen fill tubes happen. Valley heat waves cause repeated door opening, and the water line feeding the ice maker assembly can ice over solid. Samsung french-door models are especially prone — the fill line runs through a poorly insulated section near the door hinge, and a single blockage stops production completely.

      North Hollywood kitchens that face west or south get brutal afternoon sun in August. On Samsung models, error code 41C or a blinking "OF OF" display often appears when the fill line freezes. Thawing takes about 20 minutes; insulating the fill tube at the same visit usually prevents it from refreezing through the next heat wave.

  - title: "Harvest Sensor Malfunction Producing Small or Hollow Cubes"
    description: |
      The harvest sensor tells the ice maker when to cycle. Corroded or dirty from mineral deposits, it misreads fill levels and releases ice too early. Frigidaire side-by-sides in the 91606 zip code show this failure often — half-formed cubes, or a tray that freezes into one solid block instead of individual pieces. Sensor module replacement runs about 45 minutes.

      Amana and Kenmore units have a near-identical sensor configuration, and they're aging into the same failure pattern now. North Hollywood hard water accelerates sensor corrosion. If the tray keeps producing but the cubes are consistently hollow or misshapen, that's the sensor — not the compressor, not a refrigerant issue.

faq:
  - q: "How fast can you get to North Hollywood for ice maker repair?"
    a: |
      North Hollywood is a regular stop — we're on Lankershim or the 170 within 20 minutes of most calls in 91601 and 91605. Same-day slots are usually open; evening appointments work for most addresses too. Call (323) 870-4790 to check today's availability.

  - q: "Do you fix GE and Samsung refrigerators in North Hollywood?"
    a: |
      GE, Samsung, Whirlpool, Frigidaire — those are the four we see most in this part of the Valley. Common fixes include inlet valves, harvest sensor replacements, and ice maker assembly swaps on Samsung french-door models that freeze up. Parts for all four are stocked on the van. Kenmore and Amana parts come from a supplier on Oxnard St — usually available same-day.

  - q: "What does an ice maker repair cost, and can I get same-day service?"
    a: |
      Diagnosis is $75 and applies toward the repair. Most ice maker jobs — valve replacement, sensor swap, clearing a frozen fill line — run $150–$280 depending on the part. Same-day service is standard; call early and we're usually there by afternoon. Emergency evening slots are available for an added fee.

  - q: "How does North Hollywood hard water affect the ice maker long-term?"
    a: |
      LADWP water in 91601 and 91605 tests consistently above 300 ppm of dissolved calcium and magnesium — that's in the 'very hard' range. For the fill valve, that means noticeable scale buildup within 12–18 months of installation. On GE and Whirlpool models without an inline filter, the water inlet valve is typically the first component to go. A basic $15 inline filter on the supply line buys years of extra valve life — we can add one during any North Hollywood repair visit at no extra labor charge.
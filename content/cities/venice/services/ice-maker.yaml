title: "Venice Ice Maker Repair — Salt Air + Hard Water Is a Bad Combo"

intro: |
  Ocean air rolling in off the boardwalk does something slow but consistent to appliances in 90291 — coastal humidity plus LA's hard municipal water is a particularly rough combination for ice makers. That GE side-by-side sitting in a beach bungalow off Pacific Avenue has been fighting mineral buildup since the day it was installed. Most Venice homeowners don't notice until the bin runs dry on an August afternoon and the unit hasn't cycled in days. The salt-heavy marine layer accelerates corrosion on electrical contacts inside the assembly faster than you'd see in inland neighborhoods. Venice sits in a convergence of worst-case conditions: coastal humidity, hard municipal water, and summer heat spikes — all hitting the same appliance at once.

localContext: |
  Housing near the Venice Canals Historic District and along the streets off Abbot Kinney runs heavily toward 1950s and 60s beach bungalows and converted units — compact kitchens, tight refrigerator clearances, not a lot of room to work. Zip code 90291 has plenty of older Whirlpool and Kenmore refrigerators wedged into spaces that weren't designed for modern appliance dimensions. Parking a service van near Windward Avenue takes planning, but we route through Venice from our West LA coverage regularly and know the neighborhood. South-facing kitchens in Venice bungalows trap afternoon heat, pushing refrigerators to run harder and cycling the ice-making assembly more than it was designed for. Parts for the Frigidaire and GE models that dominate Venice rental stock ride on our van — no waiting a week on a special order.

commonProblems:
  - title: "Fill Valve Calcification from LA Hard Water"
    description: "LA municipal water running through 90291 tests around 300 mg/L total dissolved solids — that mineral load deposits directly into the water inlet valve over time. On GE and Whirlpool refrigerators, the valve can't open fully once calcified, which means the ice maker gets no water to work with. You get thin, misshapen cubes first, then nothing at all. Replacing the fill valve usually solves it, but the supply line needs flushing too or the new valve degrades fast. Venice tap water is aggressive on brass valve seats — we've replaced inlet valves on three-year-old Amana units that looked fifteen years old inside."
  - title: "Frozen Water Supply Tube Behind the Refrigerator Panel"
    description: "Venice's marine layer keeps nights cool while afternoons push into the 80s in summer — that temperature cycling stresses refrigerator systems hard. On Samsung french-door models, the water supply tube running to the ice maker module freezes solid near the back panel. The defrost timer isn't clearing the line, or the thermostat is misreading ambient temperature. Symptom: no production even though the freezer itself seems fine. Venice sees this pattern more than inland areas because the swing between nighttime and afternoon temperatures is sharper here — the defrost cycle timing gets thrown off by the gap."
  - title: "Harvest Sensor Failure on Older Kenmore Units"
    description: "Kenmore refrigerators — which are Whirlpool-built machines — use an optical or mechanical harvest sensor to detect when the bin is full. Mineral deposits foul the sensor lens, or the component fails with age. The machine reads the bin as full when it's completely empty and won't run another cycle. Pull the bin out, nothing there, nothing is dropping. Cleaning or replacing the sensor module fixes it. In Venice's rental units, where refrigerators might be eight or ten years old and never serviced, the harvest sensor is often the first component to go — especially through the humid summer months when kitchen moisture levels climb."


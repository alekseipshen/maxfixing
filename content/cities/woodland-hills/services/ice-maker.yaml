title: "Woodland Hills Ice Maker Repair — Beat the Valley Heat"

intro: |
  Summer highs regularly hit 105°F in the San Fernando Valley, and refrigerators in the 91367 zip code run nearly constant cooling cycles from late June through September. That KitchenAid french-door you upgraded a few years back wasn't sized for that kind of sustained load. Hard water from the LA municipal supply steadily coats the water inlet valve with mineral scale — units in Woodland Hills typically start failing within two to three years without a cleaning cycle. By the time the bin sits empty on a 100-degree afternoon, the valve damage is usually well past a quick flush.

localContext: |
  Woodland Hills spans zip codes 91364 and 91367, mixing 1960s ranch-style homes near Topanga Canyon Boulevard with newer condo and townhome developments around Warner Center. Older ranch kitchens tend to have the refrigerator jammed into a corner with barely six inches of side clearance — pulling the unit out to reach the ice maker assembly is a real job. Parking a service van near Oxnard Street is straightforward; the narrow driveways off Mulholland Drive are another story. A lot of Woodland Hills residents have swapped their original GE or Whirlpool appliances for Samsung or LG upgrades in the last decade, but hard water attacks the fill valve on every brand the same way. The local supply runs consistently hard at 300-plus ppm dissolved solids — above the threshold where annual descaling pays for itself.

commonProblems:
  - title: "Water Inlet Valve Failure from LA Hard Water Scale"
    description: "LA municipal supply through 91364 and 91367 carries enough dissolved calcium to coat the inside of a water inlet valve within 18 to 24 months of regular use. Production slows gradually — smaller cubes, longer fill intervals, hollow centers — before stopping entirely. GE and Whirlpool side-by-side models with older brass valve bodies calcify faster than the plastic-bodied Samsung or LG designs. Catching it early means a valve swap instead of a full ice maker assembly replacement. Woodland Hills homeowners who notice their cubes shrinking should call before the fill line gets fully blocked."
  - title: "Frozen Fill Line in Garage-Stored Refrigerators"
    description: "Ranch homes near Oxnard Street and De Soto Avenue commonly run a secondary refrigerator in the garage. Woodland Hills winter nights drop 35-40°F below afternoon highs — enough to freeze the supply line solid between the wall valve and the ice maker assembly. Thawing with a heat gun usually cracks the plastic tubing rather than clearing it. Proper repair means draining the full line, inspecting the assembly inlet, and pressure-testing before reconnecting the wall supply. Same-day service is available for this — call (323) 870-4790 and we can usually have someone out within 2 hours."
  - title: "Optical Sensor Failure in Post-2019 KitchenAid Models"
    description: "Refrigerators built after 2019 mostly use an infrared optical sensor to read bin fill level instead of a mechanical arm. Hard water deposits a thin mineral film across the sensor lens over time, causing the unit to read full when the bin sits empty — no ice gets made. Cleaning the lens sometimes resolves it. A failed sensor module on a KitchenAid or Bosch refrigerator runs $85-$145 in parts, which is a straightforward fix compared to a full ice maker assembly swap. Samsung french-door models in Woodland Hills show a similar failure as error code 41C or a blinking ice-off indicator on the display panel."


title: "Woodland Hills Washer — Hard Water, Hot Summers, Real Fixes"

intro: |
  Homes off Oxnard Street and up toward Mulholland run a lot of Samsung front-loaders
  and mid-range LG units — and the San Fernando Valley's notoriously hard water (often
  300+ ppm) quietly destroys water inlet valves and detergent dispensers long before the
  machine hits 10 years. Valley summers push everything harder. A washer that's marginal
  in December starts throwing F21 drain errors by August. We cover 91364 and 91367 daily.

localContext: |
  Most of Woodland Hills is 1960s-to-1980s ranch construction — single-family homes with
  dedicated laundry rooms, usually in a hallway closet or attached garage. Garage installs
  in 91367 (near Topanga Canyon Blvd) tend to mean stacked configurations: a GE or Whirlpool
  unit sitting in a tight alcove where access to the rear drain hose requires pulling the
  entire machine. Not complicated, but it adds 20-30 minutes to any service call.

commonProblems:
  - title: "Hard Water Buildup Killing Water Inlet Valves"
    description: >
      Valley water mineral content clogs the mesh screens inside the water inlet valve over
      time — the machine fills slowly, then not at all. Samsung and LG front-loaders in
      Woodland Hills show this pattern constantly. The valve itself is a $40-60 part, but
      if the screens are clogged and ignored long enough, the solenoid coils burn out too.
      Catch it early and it's a quick fix.
  - title: "Drain Pump Failures After Lint and Debris Accumulation"
    description: >
      A clogged or failed drain pump is the most common reason a Whirlpool or GE top-loader
      stops mid-cycle with standing water in the drum. The pump impeller gets jammed by
      coins, hairpins, or lint buildup — you'll hear a low humming with no actual draining.
      Error code F21 or E3 depending on the model. The pump filter on most front-loaders
      is accessible from the front kick panel; cleaning it costs nothing if you catch it first.
  - title: "Drum Bearing Wear in Older Front-Load Units"
    description: >
      Bosch 500 series and KitchenAid front-loaders that have been running since the early
      2010s start showing drum bearing wear around 7-9 years, especially in homes with heavy
      weekly loads. The symptom is a grinding or roaring noise during the spin cycle — not
      the usual vibration, but a mechanical sound that gets louder over time. Left too long,
      a bad bearing damages the drum shaft and turns a $180 repair into something much bigger.

faq:
  - q: "How fast can you get to Woodland Hills for a washer repair?"
    a: >
      Coming from the 101/Ventura corridor, we're usually in Woodland Hills within 90 minutes
      of your call — same-day slots available most days. Evening appointments work too.
      Call (323) 870-4790 to confirm availability and lock in a window.
  - q: "Do you repair Samsung and LG front-loaders in this area?"
    a: >
      Yes — Samsung and LG are the two most common brands we see in 91364 and 91367. Typical
      fixes: door lock assembly failures on LG WashTower units, control board resets on Samsung
      front-loaders, and drain pump clogs on both. Whirlpool top-loaders come up constantly too,
      usually lid switch or drive belt issues.
  - q: "What does a washer repair typically cost, and do you charge to diagnose?"
    a: >
      Diagnosis is included in the service call fee, which gets credited toward the repair if
      you proceed. Most fixes — inlet valve, drain pump, drum belt, shock absorber — run
      $120-280 parts and labor. We stock common parts for Samsung, LG, and Whirlpool, so same-day
      completion is typical. Emergency same-day calls: (323) 870-4790.

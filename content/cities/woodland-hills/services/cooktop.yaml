title: "Woodland Hills Cooktop — Ranch Kitchens Meet Valley Heat"

intro: |
  Dumetz Road and the side streets off Ventura Boulevard are packed with 1960s and 70s ranch
  houses — a lot of them still running original gas cooktops, or early-generation GE electrics
  that have never been replaced. Those units develop igniter problems, specifically the spark
  igniter module going intermittent after decades of grease buildup and heat cycling. Over in
  91367, the Warner Center condo towers tell a different story: Samsung and Bosch glass-ceramic
  surfaces cracking or losing burner calibration entirely.

  Gas or electric, the repair calls in Woodland Hills tend to cluster around the same handful
  of failure modes. Knowing which zip you're in usually tells us the brand before we even arrive.

localContext: |
  Woodland Hills splits pretty cleanly by zip code. The 91364 side — Oxnard Street corridor,
  the hillside streets above Mulholland Drive — is older housing, lots of original or
  once-updated kitchens with gas cooktops going on 40-plus years. The 91367 zip covers the newer
  builds around the Promenade and De Soto Avenue, where smooth-top and induction units dominate.
  Valley summers regularly push past 105°F here, and that sustained ambient heat stresses the
  control electronics on newer glass-ceramic cooktops well beyond what typical specs assume.

  The hillside addresses above Topanga Canyon Boulevard are worth mentioning separately. Kitchens
  up there are often tighter than the main floor plans suggest — cooktops built into islands with
  limited clearance underneath. Getting at the burner valve assembly or the igniter wire harness
  on a flush-mount Bosch or KitchenAid requires pulling the unit out of the countertop cutout
  entirely. It adds time to the job. We account for that in the estimate upfront, not after.

commonProblems:
  - title: "Gas Burner Won't Light — Igniter Module Failure on Older Valley Cooktops"
    description: |
      Most gas cooktops we see in the 91364 zip are Whirlpool and GE units from the late 80s
      and 90s. The spark igniter module fails when cooking residue blocks the electrode tips, or
      the igniter wire harness cracks from years of heat exposure. Classic symptom: you hear
      constant clicking, one burner lights fine, the rest are dead. Replacing the module usually
      runs under two hours on these older frames.

      One quick check before calling: if all four burners click but none ignite, it's sometimes
      the spark igniter switch rather than the module. Press one burner knob and watch whether
      the others spark simultaneously — if they do, the switch on the dead burner is likely the
      culprit, not the module. That's a cheaper fix, and it's something we can confirm on arrival
      without a second trip.

  - title: "Cracked Ceramic Glass on Samsung and LG Smooth-Tops"
    description: |
      The smooth-top units in Warner Center condos take real punishment from daily cooking on
      hard surfaces. Thermal shock — cold pan dropped on a hot surface, or a cast iron skillet
      set down wrong — cracks the glass-ceramic panel cleanly. On Samsung french-door-style
      cooktops, a crack near a radiant heating element almost always means the element warped
      too, so both components need replacement at the same visit.

      LG induction models in the newer 91367 buildings show a different failure pattern: the
      control board throws an error code (usually F3 or Er) when the temperature sensor under
      the glass reads out of range. Sometimes it's the sensor, sometimes the board, sometimes
      a loose ribbon cable. Takes a few minutes to sort out which.

  - title: "Knob Assembly and Infinite Switch Failure on KitchenAid Gas Cooktops"
    description: |
      KitchenAid 5-burner gas cooktops show up constantly in the remodeled kitchens along the
      101 corridor and in the hillside homes near Topanga. The infinite switch behind the burner
      knob wears out — you end up with a burner stuck at full output or completely unresponsive.
      Some of the newer KitchenAid models throw an F-series error on the control board when the
      switch circuit breaks, which can look like a board failure but usually isn't.

      On gas models specifically, a failed switch can allow gas flow without ignition. That's a
      safety issue. Don't try to bypass it by relighting manually on a cycle. The switch itself
      is inexpensive; the labor on a KitchenAid built into a tile surround is the main cost.
      Most of these jobs are done same-day.

faq:
  - q: "How fast can you get to Woodland Hills for a cooktop repair?"
    a: |
      From our regular service route, Woodland Hills is 30-45 minutes depending on 101 traffic
      — we come in off the Ventura Freeway or De Soto. Same-day slots are usually open before
      noon. Call (323) 870-4790 and we'll get you on the schedule. Morning appointments work
      best to beat the afternoon backup on the 101.

  - q: "Do you repair Samsung and Bosch cooktops in the 91367 area?"
    a: |
      Both, regularly. Samsung smooth-tops are common in the Warner Center condo buildings —
      cracked glass panels and failed radiant elements are the usual calls. Bosch gas and
      induction units show up in the remodeled 91364 homes. Also handle GE, Whirlpool, and
      KitchenAid across both zips, including older gas units from the 80s and 90s.

  - q: "What does cooktop repair cost in Woodland Hills, and is same-day available?"
    a: |
      Most repairs fall between $150 and $380. Igniter module replacement on a gas cooktop is
      on the lower end; control board work or glass panel replacement runs higher. Same-day
      service is available most days, evening slots too if you're at work until 5. Book at
      (323) 870-4790 — we confirm arrival windows, not four-hour ranges.
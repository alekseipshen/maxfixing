  - q: "Do you repair KitchenAid and Samsung double wall ovens?"
    a: "Both are common here. KitchenAid double ovens typically need bake element or
      hinge assembly work by year 10. Samsung units run toward RTD sensor drift and
      control board failures — we stock parts for both on the van. Bosch shows up
      regularly too."
  - q: "What does a double oven repair typically cost in Woodland Hills?"
    a: "A bake element swap usually runs $150–250 parts and labor combined. Control board
      replacements on GE or Whirlpool units land in the $280–430 range depending on the
      model. Flat quote before any work starts — no invoice surprises. Evening and Saturday

  - q: "Do you repair Bosch and LG front-loaders?"
    a: "Both are among our most frequent service calls in Culver City. On Bosch,
      it's usually drain pumps, door seals, or control board faults. LG front-
      loaders come in mostly for water inlet valves and door lock assemblies.
      Samsung too — spin basket issues and control board error codes show up
      regularly on those models."
  - q: "What does a washer repair call cost in Culver City?"
    a: "Diagnostic visit is $85, credited toward any repair. Most fixes run
      $150-$350 depending on the part. Drum bearing replacement sits at the

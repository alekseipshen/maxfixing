title: "La Verne Refrigerator Repair — SGV Hard Water & Inland Heat"

intro: |
  Hot July afternoons in La Verne regularly break 100°F — that's inland heat,
  not the coastal breeze keeping Santa Monica refrigerators running easy. A
  KitchenAid counter-depth unit in one of the 1970s ranch homes near Wheeler
  Avenue cycles almost continuously from June through September. Add tap water
  from zip 91750 testing above 350 ppm hardness, and evaporator coil mineral
  scale becomes a predictable problem before year four. That's not bad luck.
  That's just La Verne.

localContext: |
  Most of La Verne's residential housing dates from the 1960s through the
  1980s — single-family ranch homes with kitchen layouts designed around
  narrower appliances. Installing a modern 36-inch french-door refrigerator
  often means tight side clearances and restricted airflow to the condenser
  fan from day one. The older blocks east of D Street near the University
  of La Verne campus run Bosch and LG models we see regularly. Bosch
  counter-depth units in those kitchens often have the condenser mounted
  at the bottom rear — a design that traps dust fast in houses without
  regular HVAC filter changes.

  Newer construction off Baseline Road toward the 91750/91773 boundary
  skews toward Samsung and KitchenAid built-ins. Some of the more recently
  renovated homes near Lordsburg Park have Sub-Zero or Thermador columns —
  those require a different parts inventory and longer diagnosis windows.

  Two technicians cover this corridor. Schedules fill fast on triple-digit weeks.

commonProblems:
  - title: "Mineral Scale Shutting Down Ice Makers — Hard Water in 91750"
    description: |
      San Gabriel Valley municipal water in La Verne runs above 350 ppm total
      dissolved solids — roughly double what appliance manufacturers engineer
      for. That calcium load deposits on the water inlet valve screen first,
      then works into the ice maker fill tube and ice maker assembly. Most
      units start showing reduced output or total stoppage within 18-24 months.
      Bosch refrigerators tolerate this slightly better than average, but
      nothing survives 350 ppm water without periodic valve maintenance.

      Samsung french-door ice makers are a different story. The fill tube
      freezes solid when the inlet valve starts restricting flow — the motor
      keeps cycling but no cubes drop. Looks like an ice maker assembly failure,
      traces back to a clogged valve screen packed with La Verne mineral
      deposits. A $45 part, done in under an hour.

  - title: "Compressor Overload During San Gabriel Valley Heat Waves"
    description: |
      Inland temperatures hit 105°F in La Verne in August — not unusual,
      just the baseline. Refrigerator compressors aren't rated for that
      kind of sustained ambient heat without clean condenser coils and an
      unobstructed condenser fan motor. Dust and pet hair pack the condenser
      fins solid in these older ranch-home kitchens.

      Samsung french-door models show this failure pattern most visibly —
      the unit throws a temperature alarm, the compressor runs hot, and
      cooling capacity drops 10-15°F before anyone calls. LG throws an
      Er FF code. KitchenAid units with blocked condenser fins just run warm
      and the homeowner assumes the thermostat drifted. It hasn't. It's a
      condenser fan that can't move air through clogged fins. Call
      (323) 870-4790 before the compressor overloads completely — that
      repair runs four times the cost of a cleaning call.

  - title: "Evaporator Coil Ice Buildup — The Quiet Failure"
    description: |
      The defrost heater burns out. The defrost timer stops cycling. Either
      way, ice slowly encases the evaporator coil over two to three weeks
      while the unit continues blowing air — cold at first, then
      progressively warmer. By the time the refrigerator section climbs
      above 48°F, the freezer still looks fine, which muddles the diagnosis.
      LG side-by-sides from the 2010-2016 production run are particularly
      prone once the thermal fuse on the defrost circuit weakens.

      The fix is usually 90 minutes on-site. Manual defrost, thermal fuse
      swap, heater continuity test. Done before dinner.

faq:
  - q: "How fast can you get to La Verne for refrigerator repair?"
    a: |
      La Verne is typically 30-40 minutes from our San Gabriel Valley base —
      we run the 210 Freeway and come in from the Claremont side. Same-day
      slots are open most days, including evenings. Call (323) 870-4790 to
      check availability. If food is already at risk, mention it — those
      calls move to the front of the schedule.

  - q: "Do you repair Bosch and LG refrigerators in La Verne?"
    a: |
      Both are common in 91750 and we work on them regularly. Bosch
      french-door models typically come in with door gasket failure and
      drain pump blockages from mineral buildup. LG side-by-sides show up
      with evaporator coil icing and control board error codes — Er IF and
      Er FF are the most frequent in this area. KitchenAid and Samsung make
      up a big share of La Verne service calls too, and we stock common
      parts for all four brands on the van so most repairs finish same visit.

  - q: "What does refrigerator repair typically cost in La Verne?"
    a: |
      Diagnosis runs $65 and applies toward the repair if you proceed. A
      water inlet valve swap or thermostat replacement usually lands between
      $150-$220 total, parts and labor included. Compressor replacement is
      more — $380-$520 depending on the unit. We're usually on-site within
      2 hours of your call. Schedule online or call (323) 870-4790.
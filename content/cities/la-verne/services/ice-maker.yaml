title: "La Verne Ice Maker Repair — Hard Water, Fast Fix"

intro: |
  The Puente Basin aquifer feeds most of 91750, and it delivers water that clocks in around
  400 ppm TDS — one of the harder supplies in all of San Gabriel Valley. That mineral load
  is what quietly kills fill valves and clogs water inlet valves long before the fridge
  itself shows any other symptoms. A KitchenAid or LG french-door unit producing cloudy,
  undersized cubes is usually telling you the scale has already taken hold inside the
  freezing module. At that hardness level, calcium deposits accumulate inside tight valve
  orifices within 18 months of install — faster if the household runs two or three harvest
  cycles a night. La Verne homes on municipal supply get it worse than properties fed by
  private wells further east, because the treatment plant doesn't soften aggressively.
  The result shows up first in restricted flow, then in a dead harvest cycle, then in a
  call to us.

localContext: |
  Ranch-style homes from the 1960s dominate the blocks near Baseline Road and Arrow Highway
  in 91750. Many of those kitchens were retrofitted with ice-making equipment years after
  original construction — longer water line runs, more freeze points, and saddle valves
  tapped into galvanized supply lines that are already 50 years old. Newer builds up toward
  the hillside past Wheeler Avenue tend to have built-in Bosch or KitchenAid refrigerators
  with integrated freezer modules as original equipment, but those units need more
  disassembly to reach the harvest mechanism for service. The Lordsburg and Historic Old
  Town neighborhoods in La Verne sit on some of the oldest residential plumbing in the
  valley — copper lines that predate modern push-fit fittings, which makes a clean water
  line installation more involved than a standard call. Sub-Zero column units showing up
  in the hillside homes off Esperanza Drive require specific disassembly tools that most
  general appliance techs don't carry.

commonProblems:
  - title: "Mineral Scale Choking the Water Inlet Valve"
    description: |
      La Verne's hard water deposits calcium inside the water inlet valve until flow drops
      below the threshold the ice mold needs. The harvest sensor reads a partial fill as
      a fault and kills production entirely — no cubes, no error code, no obvious cause.
      Samsung and LG french-door models run tight tolerances on this valve; even a 30%
      restriction is enough to stop the cycle dead. On LG units, this often triggers an
      ERR blink on the display panel before the module goes quiet. Replacing the valve
      alone without treating the supply line means the same failure repeats inside a year
      in La Verne's water conditions — that's the repair you want to avoid doing twice.
  - title: "Water Line Freezing Between the Wall and the Fridge"
    description: |
      The temperature swing between a hot San Gabriel Valley garage and a 0°F freezer
      compartment creates freeze points wherever the supply line passes through uninsulated
      wall cavities. Thawing it fixes nothing if the underlying routing stays the same.
      Thermador and Sub-Zero column units in the hillside homes above Via Verde Park run
      longer line pulls from the main supply, which multiplies the risk every winter.
      Rerouting the line with a proper insulation sleeve and a shutoff valve at the wall
      is the permanent fix — takes about 90 minutes on most La Verne ranch-home
      configurations where the line enters through the cabinet base.
  - title: "Harvest Mechanism Jamming from Ejector Blade Buildup"
    description: |
      Once scale coats the ejector blades and mold surface inside the freezing module,
      the harvest motor strains to release cubes and eventually seizes. Bosch integrated
      units use a harvesting arm with tight clearances — mineral deposits jam it
      mechanically before any electrical fault shows up. Swapping the module without
      flushing the water line first just repeats the failure six months later. In
      La Verne's older kitchens, the supply line typically runs through a cabinet base
      before reaching the refrigerator — clearing that section is the first step before
      any module replacement makes sense. Skipping it is the reason some homeowners
      are on their third harvest assembly.


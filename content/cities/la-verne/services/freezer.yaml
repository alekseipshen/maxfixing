  - q: "Do you repair Sub-Zero and KitchenAid freezers in La Verne?"
    a: "Yes, both regularly. Sub-Zero column and drawer units show up in the newer builds near
    the University of La Verne, and we stock evaporator fan assemblies and door gaskets for those
    models. KitchenAid uprights are our most frequent call in 91750. Bosch and Thermador

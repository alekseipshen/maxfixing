title: "Brea Range Repair — Gas & Electric, Same-Day OC"

intro: |
  Carbon Canyon Road winds up past the Olinda Village oil leases, and the houses up there are older — compact kitchens, tight cabinet clearances, ranges that have been running hard for thirty years. A KitchenAid in that corridor will eventually throw a weak bake igniter assembly: the glow bar dims, the gas valve stays shut, the oven never reaches temp.

  That's the call we get most from 92821 and 92823. Both zips are on our regular north OC route. Call (323) 870-4790 — same-day slots open most mornings.

localContext: |
  The 1975–1990 tract homes in 92821 were built with 30-inch gas range cutouts as standard. Older Thermador and GE units are still running in some of those kitchens, and the Carbon Canyon hillside properties add a wrinkle: cabinets sit close, the range slides in tight, and pulling a unit for access takes extra time.

  Lambert Road and Brea Boulevard see a different story — newer builds from the late 1990s and 2000s, more electric slide-ins, more Bosch and Samsung. Different failure modes, different parts.

  Olinda Village is its own category entirely. The kitchens are small, the ranges are old, and access is tighter than anything you'll find in the 92823 newer subdivisions near Birch Hills Golf Course. Some of those units haven't been serviced since the Clinton administration. We show up ready for both ends of the spectrum.

commonProblems:
  - title: "Igniter Won't Spark After Heavy Summer Use"
    description: |
      Brea summers push grease and carbon onto burner caps fast. The spark igniter electrode gets coated, the spark gap closes, and clicking stops.

      On KitchenAid four-burner units, we pull the cap, inspect the electrode tip, and check the igniter module for proper amperage draw — a weak module won't fire even with a clean electrode. GE ranges from the same era share this failure. Cap cleaning fixes some. Electrode or module replacement fixes the rest. Usually same-visit.

  - title: "Oven Runs 40–50 Degrees Cold at Full Setting"
    description: |
      Gas ovens: the bake igniter weakens with age and stops drawing enough current to signal the gas valve to open fully. Oven fires briefly, cycles off, never holds temp.

      Electric models split differently — a cracked bake element cuts heat output and leaves visible burn marks or gaps. Bosch slide-ins in the Lambert Road area sometimes throw an E-118 error, which points to a control board thermal sensor fault rather than the element itself. Diagnosis first, then the part.

  - title: "Touch Panel or Control Knobs Stop Responding"
    description: |
      Samsung and LG glass-touch panels collect grease at the bezel edges. It migrates under the glass and reaches the control board. The board shorts, the panel goes dead.

      Replacement boards are model-year specific — a board from the same brand, wrong model year, will not cross-fit. Bring your full model number and serial off the door jamb sticker before calling. That lets us confirm the part before we drive out.

faq:
  - q: "How fast can you get to Brea for range repair?"
    a: |
      From our Placentia base, Brea is 20–30 minutes on the 57 freeway — straightforward run north. Same-day slots are available most days but fill by midday, so morning calls get priority.

      Gas smell is treated as emergency same-day regardless. Call (323) 870-4790 to check what's open. We give a 2-hour arrival window and call when we're en route.

  - q: "Do you repair KitchenAid and Bosch ranges in Brea?"
    a: |
      Both show up regularly in north OC. KitchenAid 30-inch ProLine units hit igniter module and oven temperature sensor failures around the 8–10 year mark — common enough that we stock those parts on the van.

      Bosch slide-ins develop control board faults and burner knob detent wear. Parts for both ride in the van on most calls. One visit usually handles it.

  - q: "What does range repair cost in Brea, and how does the visit work?"
    a: |
      Diagnostic is $85, credited toward the repair. A gas bake igniter swap runs $150–$200 installed. Bake element replacement on electric models is $180–$270 depending on the unit.

      Whirlpool, GE, and Samsung parts come in the van for same-visit completion on common failures. Evening appointments are available in 92821. Call (323) 870-4790 to book.
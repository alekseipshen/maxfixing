title: "Brea Washer Repair — Hard Water Damage & Same-Day Service"

intro: |
  Carbon Canyon Road homeowners in the 92821 zip know the drill — LG and
  Bosch front-loaders running daily loads for families of four, then one morning
  the drum stops mid-cycle and a soggy pile of laundry sits sealed inside.
  Orange County municipal water runs 250-300 ppm hardness in this area, and that
  calcium buildup hits water inlet valves and door seals hard. Call us at
  (323) 870-4790 and we're usually in Brea within 2 hours.

localContext: |
  Most of the housing stock between Brea Boulevard and Lambert Road was built in
  the 1970s and 80s — tract homes with laundry closets sized for stacked units
  or side-by-sides in tight utility alcoves. Getting a washer out to service it
  sometimes means removing a bifold door first. Zip code 92823 picks up the
  newer developments near Carbon Canyon Regional Park — larger lots, more built-in
  laundry rooms, but owners there tend toward higher-end Bosch 500 series and
  KitchenAid top-loaders that need brand-specific diagnostic tools.

commonProblems:
  - title: "Drum Won't Spin — Worn Drive Belt or Failed Bearing"
    description: "A lot of the Samsung and LG top-loaders in these 1980s Brea homes are
      10-plus years old. The drum bearing wears out, you hear a grinding sound during
      spin, then eventually the drum stops entirely. Sometimes it's just the drive belt
      snapping — a 20-minute swap. The bearing job takes longer but it's worth fixing
      before replacing a machine that otherwise runs fine."
  - title: "Water Sitting in the Drum — Drain Pump Clog or Failure"
    description: "Hard water deposits combine with lint to clog the drain pump filter
      over time, especially on front-loaders running in homes with older iron pipes
      off Brea Creek. Bosch units will throw an E18 or E23 error code before they stop
      draining entirely. Clearing the pump housing usually fixes it; if the pump motor
      burned out, we carry replacements on the van."
  - title: "Shaking the Whole Laundry Room — Shock Absorber Wear"
    description: "Brea's tract homes have slab foundations, and a washer with worn shock
      absorbers on a hard concrete floor sounds like a small earthquake during spin
      cycle. KitchenAid front-loaders are notorious for this once the rear shock absorbers
      lose their damping. Replacing both shocks at once (they wear at the same rate)
      stops the walking and the noise immediately."

faq:
  - q: "How fast can you get to Brea for washer repair?"
    a: "We run service routes along the 57 Freeway corridor daily, so Brea is a
      natural stop. Same-day slots are usually available before noon. Call (323) 870-4790
      or schedule online — we'll confirm a 2-hour arrival window within minutes."
  - q: "Do you repair Bosch and KitchenAid washers in Brea?"
    a: "Yes — both are common in the 92821 and 92823 zip codes. On Bosch front-loaders
      we frequently replace the door latch assembly and water inlet valve. KitchenAid
      top-loaders usually need the lid switch or control board. We stock parts for both."
  - q: "What does a washer repair visit in Brea typically cost?"
    a: "Diagnostic is $75, applied toward the repair if you proceed. Most fixes — drain
      pump, drive belt, shock absorbers — run $150-$300 parts and labor. We give a firm
      quote before touching anything. Evening and weekend slots available for working
      households."

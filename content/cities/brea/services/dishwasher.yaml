title: "Brea Dishwasher Repair — Bosch, KitchenAid & Hard Water Fixed"

intro: |
  The 1970s tract homes packed between Brea Boulevard and Imperial Highway were retrofitted with modern kitchens over the decades — and those kitchens now run Bosch 500-series and KitchenAid built-ins through north Orange County's notoriously mineral-heavy water supply. Spray arms clog. Float switches throw false readings. Dishes come out filmy even on the heavy cycle. Call (323) 870-4790 — same-day service available in 92821.

localContext: |
  Most of Brea's residential stock was built between 1965 and 1988, with kitchen plumbing that delivers some of the harder water in OC — calcium levels around 300-380 ppm in parts of 92821. Newer builds near the Brea Hills and Carbon Canyon Road corridor trend toward premium installs: Samsung and Bosch 800-series units sitting in tight cabinet runs that complicate access. Hard water doesn't care how new the machine is.

commonProblems:
  - title: "Spray Arm Blockages From Mineral Buildup"
    description: "Calcium deposits from Brea's water supply bond inside spray arm nozzles within 18-24 months on most machines. A Bosch 500-series that cleaned perfectly last year suddenly leaves white residue on glasses — it's rarely the control board. Usually it's the upper spray arm, sometimes the inlet valve screen behind it. Descaling alone won't fix a fully calcified arm; it needs replacement."
  - title: "Door Latch Assembly Failures on KitchenAid Models"
    description: "Older KitchenAid dishwashers common in Brea's 1980s neighborhoods develop door latch assembly failures that trigger mid-cycle cutoffs. The machine interprets a worn latch as an open door, kills the cycle, and sits with standing water in the basin. Error codes vary by model year, but the fix is straightforward — latch assembly swap, 45-60 minutes on-site."
  - title: "Samsung Drain Pump Clogs and 5E Error Codes"
    description: "Samsung dishwashers in 92821 throw 5E or LC codes when food debris bonds with mineral scale inside the drain pump housing. Rinsing the filter doesn't clear it — the pump impeller itself needs to come out. We stock Samsung-specific pump assemblies on the van. Most drain pump service calls in Brea wrap up in under two hours."

faq:
  - q: "How fast can you get to Brea for dishwasher repair?"
    a: "Usually 25-35 minutes from our Orange County route. Same-day slots most days — call (323) 870-4790 before noon and we can typically get there same afternoon. Evening appointments available. Brea Mall area and Carbon Canyon side both covered."
  - q: "Do you work on Bosch and KitchenAid dishwashers specifically?"
    a: "Yes — Bosch 300, 500, and 800 Series make up roughly 40% of our Brea calls. KitchenAid, LG, and Samsung round out the rest. Common Bosch fixes: E24 drain errors, spray arm replacement, door latch assembly. LG: drain pump and control board issues."
  - q: "What does dishwasher repair cost in Brea, and how urgent can you respond?"
    a: "Most repairs land between $120-280 depending on the part — heating element and drain pump swaps are the most frequent. Diagnosis is on-site, quote before any work starts. Emergency same-day service available. Call (323) 870-4790 — evening slots open most weekdays."


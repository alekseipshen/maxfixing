title: "Brea Refrigerator Repair — OC Heat, Hard Water, Same-Day"

intro: |
  Carbon Canyon Road heats up fast in summer — interior temps in Brea's 92821
  zip hit 103°F some July afternoons, and that means the compressor in your
  KitchenAid or Samsung runs harder than it was designed to. Most "not cooling"
  calls from this area trace back to condenser coils packed solid with dust,
  choked from running nonstop through the heat. Caught early, that's a $150
  fix. Left alone for a full season, the compressor itself goes next.

localContext: |
  Brea's housing stock is mostly 1970s and 1980s tract homes — standard 36-inch
  kitchen openings, freestanding counter-depth units from LG, Whirlpool, or GE.
  The newer Olinda Ranch development in the 92823 zip skews premium: Sub-Zero
  built-ins and Thermador French-door models show up regularly there. Those
  integrated units need a technician who can work around cabinetry — pulling
  panels without scratching custom woodwork takes different tools than a standard
  service call.

commonProblems:
  - title: "Condenser overload during Brea's triple-digit summers"
    description: |
      The condenser coil sits on the bottom rear of most fridges and collects
      dust fast when the unit runs nonstop in July heat. Blocked coils trap
      heat, the refrigerant can't shed it, and the fridge stops cooling even
      though the compressor is still running. Samsung French-door units — the
      RS-series especially — have a compact coil design that fills up faster
      than most homeowners expect. Annual cleaning prevents 80% of these calls.

  - title: "Ice maker failure from Orange County hard water"
    description: |
      OC municipal water runs 300–400 ppm hardness. That calcium scale builds up
      in the water inlet valve and ice maker assembly over 2–4 years, cutting
      flow until the ice maker stops entirely. LG's tall French-door models are
      constant visitors on our Brea routes — the inlet valve screen clogs first.
      Replace the valve before the restricted waterline cracks from back-pressure
      and you've avoided a much bigger job.

  - title: "Evaporator coil ice buildup and defrost failure"
    description: |
      When the defrost timer or defrost heater fails, frost sheets over the
      evaporator coil until airflow stops completely. The symptom is usually a
      warm fresh-food section with a frozen-solid freezer, plus a loud hum from
      the evaporator fan hitting ice. Bosch bottom-freezer units in Brea's
      mid-range homes hit this problem around year six to eight. Straightforward
      fix once you've confirmed the failed component.

faq:
  - q: "How fast can you get to Brea for refrigerator repair?"
    a: |
      From our regular Orange County route, Brea is 20–30 minutes out. We cover
      92821 and 92823 with same-day appointments most weekdays — call
      (323) 870-4790 before noon and we can usually be there that afternoon.
      Evening slots are available for calls that come in later.

  - q: "Do you repair LG and Sub-Zero refrigerators in Brea?"
    a: |
      LG French-door and counter-depth units make up a big part of our Brea
      calls — inlet valves, ice makers, control boards. Sub-Zero built-ins in
      Olinda Ranch need factory-specific tools for evaporator and compressor
      access; we carry them. Bosch, KitchenAid, Samsung, Thermador — all
      covered.

  - q: "What does refrigerator repair cost, and do you offer emergency service?"
    a: |
      Diagnostic visit is flat-rate, applied toward the repair if you proceed.
      Most compressor or inlet valve jobs run $180–$350 parts and labor. Same-day
      emergency calls are available — we're usually there within 2 hours. Schedule
      online or call (323) 870-4790 to confirm a slot.

title: "Beverly Hills Cooktop — Repairs for High-End Kitchens"

intro: |
  Trousdale Estates runs wall-to-wall Thermador and Gaggenau installations —
  36-inch gas cooktops where a dead spark module or cracked igniter electrode
  shuts down a kitchen that cost more to build than most houses. Flats
  homeowners below Sunset call us for the same reason: the manufacturer's
  service queue runs 2-3 weeks, and generic shops don't carry these parts.
  Beverly Hills is on our regular route — 90210 gets same-day coverage most
  weekdays, usually within 2 hours of your call.

localContext: |
  The 90210 zip stacks mid-century modern builds in Trousdale Estates against
  1940s Spanish-Colonial estates in the Flats — and both housing types have
  kitchen layouts never designed for today's 30 or 36-inch induction units.
  Older homes on Loma Vista Drive and Lexington Road often have original gas
  infrastructure that needs pressure-tested before any burner valve work. South
  of Santa Monica Blvd, condo towers run almost entirely on electric or
  induction cooktops. Every call to Beverly Hills gets both gas and electric
  diagnostic gear on the truck — no second trip for the wrong part.

  North of Sunset, the lots are large and the kitchens are serious. Sub-Zero
  refrigerators paired with Thermador or Wolf cooktops are the standard
  configuration in Trousdale — these aren't appliances from a big-box store.
  Parts availability matters. A Thermador PCB5 burner cap is not the same as a
  generic replacement, and using one voids the safety certification on the gas
  valve assembly. We stock OEM parts for the most common configurations in
  this zip, which is the only reason same-day repair is realistic here.

  The Flats are a different situation — smaller footprints, galley kitchens,
  and a lot of KitchenAid and Bosch induction surfaces installed during kitchen
  renovations in the 2010s. Those units are hitting age now. Bosch induction
  coils and power boards are starting to fail in exactly the way the service
  manuals predict: intermittent zone dropouts before the full unit goes dark.

commonProblems:
  - title: "Gas Burner Clicks Endlessly and Won't Catch a Flame"
    description: |
      A Thermador or Wolf gas cooktop that keeps clicking after the knob is
      released usually has a cracked igniter electrode or a waterlogged spark
      module — food spills reach the igniter housing and short it internally.
      Swapping the electrode alone clears it about 60% of the time. If the spark
      module itself shorted, the full assembly replaces. Both parts are stocked
      on the truck for the most common Thermador ProGrand configurations.

      Gas pressure matters too. Older Flats homes with original supply lines
      sometimes show low inlet pressure that mimics an igniter fault — the
      burner lights, then starves out. Quick manifold pressure test rules that
      out before we touch any parts. Two separate diagnoses, one visit.

  - title: "Cracked Ceramic Glass on Smooth-Top or Induction Surface"
    description: |
      A dropped cast iron skillet on a Bosch or KitchenAid smooth-top can
      hairline the ceramic glass even when the surface looks intact from above.
      Those cracks spread under heat cycling. Eventually a spill reaches the
      induction coil underneath and kills the coil — sometimes the control board
      goes with it. Glass panel replacement is model-specific; Bosch 30-inch
      slabs don't swap with their 36-inch versions, so matching before ordering
      matters.

  - title: "Single Induction Zone Dead — Coil or Power Board Failure"
    description: |
      Samsung and LG induction cooktops throw error code C-10 or F7 when one
      zone stops responding — typically a failed induction coil or a burned IGBT
      transistor on the power board. The coil itself runs $90-140 in parts; a
      full power board is $180-260. Pulling a diagnosis before ordering saves a
      week of wait on the wrong component, which is exactly how we approach it
      on-site.

      KitchenAid induction units in Flats condos tend to throw E3 or E6 codes
      first — those often trace back to a thermal cutoff that tripped from
      inadequate ventilation under the countertop. Easy fix, but only if you
      don't replace the coil first chasing a false lead.

faq:
  - q: "How fast can you get to Beverly Hills for a cooktop repair?"
    a: |
      Most days, we reach Beverly Hills within 2 hours — West Hollywood and
      Culver City are both close dispatches. Residential parking in the Flats is
      straightforward; Trousdale adds a few minutes up the hill. Call
      (323) 870-4790 to confirm same-day availability, including evening slots
      on weekdays.

  - q: "Do you repair Thermador and Gaggenau cooktops in Beverly Hills?"
    a: |
      Both are regular calls in this zip. Thermador gas units usually need spark
      modules, burner caps, or gas valve replacements — parts we carry on the
      truck. Gaggenau induction cooktops often require ordered parts, but
      same-day diagnostics happen regardless. Wolf and Miele are on that list
      too.

  - q: "What does a cooktop repair cost, and how long does the job take?"
    a: |
      Igniter and spark module work typically runs $180-280 all-in. Ceramic
      glass surface replacement lands at $300-500 depending on brand and panel
      size. Most single-fault repairs finish in one visit under 90 minutes.
      Emergency and evening appointments are available — call (323) 870-4790 or
      schedule online for a confirmed 2-hour arrival window.
title: "Tustin Cooktop Repair — Same-Day, Tustin Ranch to Old Town"

intro: |
  The 1990s Tustin Ranch neighborhoods around Peters Canyon Regional Park got
  hit hard with kitchen remodels in the 2010s — KitchenAid five-burner gas
  cooktops were the upgrade of choice in 92782. Now those spark igniters are
  clicking without catching, or the rear burner runs cold while the front two
  flame up fine. Hard water from the municipal supply also clogs burner ports
  faster than most homeowners expect.

  Thermador gas cooktops started showing up in the larger Tustin Ranch homes
  after 2015 — the PD range series with cast-iron grates that trap grease
  around the burner base. Clogged ports on those run quieter failures than
  KitchenAid, so homeowners assume the igniter module is gone when it's
  actually a blocked orifice. Two different fixes, very different parts costs.
  Call (323) 870-4790 — we're in Tustin daily and can usually be there the
  same afternoon.

localContext: |
  Old Town Tustin, roughly south of First Street, has homes going back to the
  1920s — drop-in cooktops squeezed into original cabinet cutouts with almost
  no side clearance. The 92780 zip mixes those older properties with 1970s
  tract builds where the kitchen layout was clearly an afterthought. Parking a
  service van on those narrow pre-war streets is its own puzzle.

  Tustin Ranch (92782) is a different world: island cooktops, open-concept floor
  plans, and more Bosch and Thermador installations that require brand-specific
  diagnostic tools to service correctly. The Tustin Legacy area — newer
  construction on the former MCAS Tustin base — adds a third type: 2010s and
  2020s builds with slide-in induction cooktops and smart-home wiring that makes
  control board diagnostics more involved than in a standard setup. Two
  technicians covering Irvine to Santa Clarita means Tustin sits right in the
  middle of our daily routes.

commonProblems:
  - title: "Gas Igniter Clicks Nonstop or Fails to Light at All"
    description: |
      A boil-over puddles water under the burner cap and shorts the spark
      igniter module — that's the clicking that keeps going even with the knob
      off. KitchenAid dual-fuel cooktops in Tustin Ranch homes are the most
      frequent version of this call. Drying it out helps for a day at best; a
      cracked igniter electrode or fully failed igniter module is usually the
      real fix.

      Thermador PD-series units fail differently. The spark fires, you smell
      gas, but no sustained flame comes up — that points to the gas valve
      solenoid not opening fully, not the electrode. Diagnosing those two
      failure modes correctly upfront saves replacing parts that didn't need
      replacing.
  - title: "Induction Surface Throwing Error Codes or Dead Cooking Zones"
    description: |
      Bosch induction cooktops — the 800 Series is common in Tustin Ranch
      remodels — throw an E1 or E3 fault code when the power relay on the
      control board fails. One zone goes completely dead while the others
      keep working. That's a board-level failure, not a cookware compatibility
      issue. The relay or the full control board needs to be swapped out.

      Samsung flex-zone induction models show up in newer 92782 kitchens and
      behave differently: an NE-E error or full zone lockout after a power
      surge usually traces to the flex bridge element driver. Both repairs
      require OEM boards — aftermarket alternatives for these models have a
      poor reliability record and we stopped stocking them.
  - title: "Uneven Heat on Electric Radiant or Coil Cooktops"
    description: |
      On older 92780 homes still running electric coil or radiant units, a
      dying infinite switch — the rotary component sitting directly behind the
      control knob — causes one burner to cycle at max heat regardless of
      where you set it. Frigidaire and GE models from the early 2000s show
      this constantly.

      Infinite switch replacement is about 40 minutes of labor and a
      straightforward same-visit fix. The part itself runs $25–50 depending
      on the model. Scorch marks on the cooktop surface near the affected
      burner mean the switch has been failing for a while — at that point
      the surface element underneath is worth checking too before closing up.

faq:
  - q: "How fast can you get to Tustin for a cooktop repair?"
    a: |
      From our service routes along the 5 and 55 corridors, Tustin is a
      30–40 minute drive. Call (323) 870-4790 before noon and same-day is
      almost always available. Evening slots are open too — useful if you
      can't leave work midday.

      Gas cooktop with burners off but you're still smelling gas — that's
      an emergency call. Don't wait for a scheduled window. Call immediately
      and we'll reroute.
  - q: "Do you repair Bosch and KitchenAid cooktops in Tustin?"
    a: "Yes — Bosch, KitchenAid, and Thermador are the three brands we see
      most in this area. Common jobs: Bosch igniter modules, KitchenAid
      infinite switch and spark electrode replacements, Thermador gas valve
      igniters and solenoids. Parts for all three are stocked on the van."
  - q: "What does a cooktop repair typically cost, and do you charge if you
      can't fix it?"
    a: "Diagnostic fee is $85, applied toward any repair. Most cooktop jobs —
      igniter module, control board swap, infinite switch — get done the same
      visit. No fix means no repair charge, just the diagnostic fee. Schedule
      online or call (323) 870-4790 for same-day or emergency slots."
  - q: "Do you work on gas cooktops, or only electric and induction?"
    a: |
      Gas is the majority of calls in Tustin — the 92782 zip has a lot of
      gas-line homes from the Tustin Ranch buildout era. Igniters, gas valve
      solenoids, burner caps, and spark modules for common KitchenAid,
      Thermador, and Bosch gas configurations are on the van. LG gas
      cooktops are showing up in newer 92780 renovations too — different
      igniter harness layout, but same-day parts are almost always available.
    a: |
      Tustin is on our regular Orange County route — typically 1.5 to 2 hours from when you call to when we're at the door. Ring us at (323) 870-4790, give us the zip and model number, and we'll lock in a real arrival window. Same-day appointments are open most weekdays; evening slots are available too.

  - q: "Do you repair Bosch and KitchenAid ranges in Tustin Ranch?"
    a: |
      Yes — Bosch slide-ins and KitchenAid dual-fuel are the two most common calls from the 92782 area. Samsung and LG freestanding models throughout 92780 are also in our regular rotation. Igniter assemblies, gas valve igniters, control boards, bake elements — we stock those parts for all four brands on the van and usually complete the repair in one visit.

  - q: "What does range repair cost in Tustin, and how does the process work?"
    a: |
      Diagnosis is $75 and applies toward the repair if you proceed. Igniter swaps typically run $150–250 depending on the model. Gas valve replacement on a Thermador or KitchenAid runs higher — call (323) 870-4790 or schedule online for an accurate quote. Emergency visits and evening slots are both available; just mention it when you book.
title: "Tustin Range Repair — Gas & Oven Service, Same Day"

intro: |
  The Tustin Ranch corridor in 92782 has a high density of KitchenAid and Bosch ranges — the slide-in and dual-fuel models people specifically chose for their kitchen remodels. Gas igniter failures are the most common call we field out here. Nine times out of ten it's a cracked burner cap or a worn spark igniter module.

  Oven temperature problems are a close second, and that almost always traces to the RTD temperature sensor probe or a failing gas valve igniter on the bake burner — parts we carry on every van. Some Bosch 800-series models in newer Tustin Ranch builds also develop issues with the simmer burner valve after heavy use, which shows up as low flame or no flame on the left-front position specifically.

localContext: |
  The 92780 zip covers Old Town Tustin and the older residential blocks south toward Edinger Avenue — mostly 1960s and early 1970s tract homes, still on their original gas lines, running Samsung or LG freestanding ranges in narrow galley kitchens.

  East Tustin (92782) is a different story. Tustin Ranch was planned development from the 1990s, and those kitchens got Bosch slide-ins and KitchenAid dual-fuel models built into granite islands. Street parking out here is easy, which helps when we're pulling parts from the van. The newer construction off Jamboree Road runs a different profile entirely — higher-end KitchenAid Pro models and the occasional Thermador range suite.

commonProblems:
  - title: "Burner Won't Ignite or Clicks Without Stopping"
    description: |
      Continuous clicking after you release the knob usually means the spark igniter module is stuck sending voltage — the control board isn't registering that the burner lit. A cracked or wet burner cap breaks the spark path, and the ceramic on those caps takes a beating from heat cycles and spills.

      On Samsung freestanding models common in the older 92780 neighborhoods, the surface burner valve can also gum up from grease and block the gas port entirely, giving you a click with no flame. LG ranges on the same streets sometimes throw an F9 or CL error when the igniter circuit shorts. Cleaning the burner cap helps short-term, but if the igniter electrode is cracked, the fix is replacement — not another cleaning.

  - title: "Oven Won't Reach Temperature or Runs Way Off"
    description: |
      Electric KitchenAid ranges show a failed bake element pretty clearly — a crack or burn spot on the coil, and the oven just won't heat. Gas ovens are trickier.

      A drifting oven temperature almost always comes down to the RTD temperature sensor probe reading the wrong resistance. The control board trusts that reading and keeps cutting the gas valve igniter short. Bosch ovens in Tustin Ranch commonly log E015 or E031 fault codes when the sensor circuit starts failing. A probe replacement is straightforward; a failing control board behind it is a bigger job, but still worth repairing on a Bosch 800-series — those run $2,500 new.

  - title: "Gas Smell Near the Range"
    description: |
      A gas smell anywhere near a range — even faint, even with every burner off — needs a tech visit, not a wait-and-see.

      Worn burner seals and partially stuck gas valves are the usual cause. Thermador and KitchenAid gas ranges use brass valve assemblies that corrode slowly over years of use. The fix is to pressure-test the supply line, check each valve body with a manometer, and replace any valve that isn't seating fully. Call (323) 870-4790 if you're smelling gas — we have same-day availability in Tustin and can usually be there within two hours. Don't run the range until it's been checked.

faq:

title: "Tustin Ice Maker Repair — Hard Water, Fixed Same Day"

intro: |
  The old MCAS Tustin blimp hangars still loom over Red Hill Avenue, but everything
  around them has been rebuilt — Tustin Legacy brought in thousands of new households,
  most kitchens stocked with KitchenAid or Samsung french-door refrigerators. Those
  units run hard. Orange County tap water sits around 230–260 ppm dissolved solids,
  and that mineral load quietly destroys fill valves and ice maker assemblies over
  two to four years of regular use. Add in summer temps that push past 100°F in
  inland Tustin, and refrigerators end up cycling nearly nonstop from June through
  September — real wear on every component inside the freezer compartment, not just
  the one making ice.

localContext: |
  Tustin splits into two distinct zones. The 92780 zip covers Old Town and the central
  grid — mid-century ranch homes from the 1960s and early 1970s with original galvanized
  plumbing that concentrates mineral deposits in appliance water lines faster than newer
  PEX pipe does. On streets like Prospect Avenue and B Street near the Old Town district,
  tight kitchen layouts and dated supply lines mean water line access takes extra work
  before any repair even starts.

  Tustin Ranch (92782) skews newer and larger: 1990s–2000s planned-community homes where
  Sub-Zero built-ins and Thermador columns show up regularly, both requiring specialized
  tooling and OEM parts that most generalist shops don't stock. The corridor around
  Tustin Ranch Road and Pioneer Way has some of the densest concentration of premium
  appliances in Orange County outside Newport Beach. These are not machines you drop off
  at a big-box service counter. Bosch integrated units are increasingly common in
  Tustin Legacy homes as well — the newer builds around Jamboree Road tend to have
  them spec'd in during construction.

commonProblems:
  - title: "Fill Valve Failure from OC Mineral Buildup"
    description: |
      Calcium and magnesium from Tustin tap water pack into the water inlet valve
      until flow drops below the assembly's minimum cycle threshold — and production
      stops completely. On Samsung and LG french-door models, the valve sits behind
      the freezer door liner, adding real time just getting to it. Most homeowners
      assume the whole unit is dead. It usually isn't. A valve swap — DA97-series
      on Samsung, AJU72992601 on LG — plus a thorough line flush clears it in a
      single visit. We stock both for exactly this reason and carry them on every
      Orange County run.
  - title: "Thermistor Sensor Drift After Summer Overrun"
    description: |
      Inland OC heat pushes past 100°F for weeks in Tustin, forcing refrigerators
      — especially KitchenAid side-by-sides — through near-constant cooling cycles.
      The thermistor sensor inside the ice maker assembly can drift out of calibration
      from thermal fatigue, causing false shutoffs or runaway production that jams the
      storage bin. On newer KitchenAid control boards this usually surfaces as an
      error state in the diagnostic cycle — the machine stops mid-harvest and won't
      restart. That's a sensor swap and recalibration, not a full unit replacement.
      Running a fridge at max capacity through three or four Southern California
      summers will do this to most mid-range sensors eventually.
  - title: "Frozen Fill Tube Blocking All Production"
    description: |
      Sub-Zero column refrigerators in 92782 homes develop frozen fill tubes when
      a door gasket loses its seal at one corner — warm air gets into the freezer
      compartment, the tube ices over, and the machine sits idle. Replace the gasket
      first, then defrost the line with a controlled heat source. Skip the gasket
      and the tube refreezes within two to three weeks. This is one of the more
      common calls we get from Tustin Ranch, especially on older Sub-Zero 700 series
      units installed when those developments were first built in the late 1990s.
      The gasket is a $40–$80 part. Ignoring it means a second service visit and
      a second service bill.

faq:
  - q: "How fast can you get to Tustin for ice maker repair?"
    a: |
      Orange County is on our daily route — from central Tustin near El Camino Real
      or out to Tustin Ranch Road, we're typically there within 90 minutes to 2 hours
      of your call. Morning slots fill fastest. Call (323) 870-4790 to lock in a
      same-day appointment before they're gone. Evening slots are available too if
      you can't take time off during the day.
  - q: "Do you repair KitchenAid, Sub-Zero, and Samsung units in Tustin?"
    a: |
      All three, constantly. KitchenAid assemblies and Samsung fill valve failures
      are the most common calls out of both 92780 and 92782. Sub-Zero units in
      Tustin Ranch need specific service tools and OEM parts — we stock components
      for the 36-inch and 48-inch column models and carry them on Orange County
      routes. Bosch integrated refrigerators are becoming standard in Tustin Legacy
      builds, and we handle those as well. Thermador side-by-sides in the older
      Tustin Ranch estates come through periodically too.
  - q: "What does ice maker repair cost in Tustin, and how does the process work?"
    a: |
      Most repairs land between $120 and $280. Fill valves and door gaskets sit on
      the low end; full assembly replacements push higher, especially on Sub-Zero
      and Thermador where OEM parts carry a real premium over generic alternatives.
      Diagnosis happens on-site — we quote before touching anything, no surprise
      charges. Evening and weekend slots are available throughout Tustin.
      Call (323) 870-4790 for emergency same-day scheduling or to book around
      your work schedule.
title: "Tustin Washer Repair — Hard Water Wrecks Machines Fast"

intro: |
  Orange County Municipal Water District supply running through 92780 and 92782 tests consistently hard — calcium deposits start coating water inlet valves and detergent dispensers faster than most homeowners notice. That Bosch 500 Series front-loader in a Tustin Ranch home pushes mineral-laden water through its internals every single cycle. By year three, you're usually staring at restricted fill times, odd error codes, or a drum that won't spin out fully.

localContext: |
  Tustin Ranch (92782) is mostly 1990s and early 2000s tract homes — standard laundry alcoves, enough clearance for full-size front-loaders. Old Town Tustin over in 92780 is a different situation: 1950s and '60s ranch-style bungalows with tighter utility closets and occasionally undersized drain lines that overwork the drain pump on every cycle. The Tustin Legacy development adds newer stacked-unit configurations to the mix, which come with their own access headaches.

commonProblems:
  - title: "Mineral Scale Choking Water Inlet Valves"
    description: "Hard tap water in Tustin coats inlet valve screens with calcium carbonate until flow drops to a trickle — long fill times, then an error code that seems random. LG front-loaders, especially the WM series, show this pattern consistently around year three to four in this zip code. Valve replacement plus a flush of the supply screens usually solves it."

  - title: "Drain Pump Failures in Old Town's Older Plumbing"
    description: "Pre-1970s homes in Old Town Tustin often have partially restricted drain lines that push back-pressure onto the drain pump motor until it burns out. Samsung front-loaders throwing 5E or 5C codes here are almost always pump failures, not internal clogs. The pump itself gives out from fighting the drain stack, not from anything wrong with the machine."

  - title: "Drum Bearing Wear Under Heavy Household Load"
    description: "Bosch and KitchenAid front-loaders in Tustin Ranch families running eight or ten loads a week hit drum bearing failure around year four to six. A grinding noise on the spin cycle — or noticeable wobble in the spin basket when you push it by hand — means the bearing is gone. Catching it early prevents the shaft seal from going next, which turns a $200 repair into a $600 one."


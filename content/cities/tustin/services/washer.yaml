    a: "Those three cover the majority of what we see in Tustin Ranch homes. LG — inlet valve and control board jobs. Bosch — door latch assembly failures and drain pump issues. Samsung — drum bearing replacements and 5E drain errors. Parts for all three are stocked on the van."


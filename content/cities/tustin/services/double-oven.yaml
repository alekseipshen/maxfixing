title: "Tustin Double Oven Repair — Old Town to Tustin Ranch"

intro: |
  The old MCAS Tustin blimp hangars off Edinger Avenue are the landmark everyone
  knows, and the neighborhoods that grew up around that base have been running
  some serious kitchen equipment for decades. Tustin Ranch builds from the 1990s
  commonly spec'd KitchenAid double wall ovens — units now hitting the age where
  the upper cavity heating element quietly fails mid-roast. That's the call we
  get most often out here.

  Bosch and Thermador show up in the newer Tustin Legacy builds. Different brands,
  different failure modes — and knowing which parts to stock before the truck rolls
  makes a real difference on first-visit fix rates.

localContext: |
  Homes in the 92782 zip code — Tustin Ranch, Peters Canyon, and the Columbus
  Square and Greenwood developments in Tustin Legacy — tend to be 1990s-to-2010s
  planned construction with built-in double ovens on original cabinetry. Old Town
  Tustin (92780) tells a different story: pre-war bungalows and 1960s ranch homes
  with tighter kitchen footprints where wall oven cutouts are sometimes undersized
  for modern units. Thermador and Bosch units show up frequently in the Legacy
  new builds.

  Older GE and Frigidaire models still run in apartments near the Tustin Marketplace corridor.

  The Tustin Ranch Road communities — Vidorra, Rancho Verano — were built to a
  standardized kitchen layout across entire tracts. Same cabinet cutout dimensions,
  same rough-in wiring, same 240V circuit configuration. A repair that works on one
  unit in those neighborhoods almost always applies directly to the neighbor's. That
  consistency means we can carry the right parts the first time instead of making a
  second trip for a bracket or a specific harness connector.

commonProblems:
  - title: "Upper oven cavity stops heating while lower still works"
    description: |
      Each cavity runs its own heating element and thermal fuse —
      when one goes dark, those are the two parts we check first. Bosch double
      wall ovens in the 8-12 year range hit this pattern regularly. The thermal
      fuse itself is a $15-40 part; the heating element costs more. Diagnosis
      tells us which one before we order anything.

      On Bosch 800 Series units specifically, a secondary relay on the control board
      can cut power to just one cavity while leaving the other functional. That relay
      failure mimics a dead heating element exactly. We test element continuity with
      a multimeter before assuming it's the board — saves the customer $400 on an
      unnecessary part.
  - title: "Temperature gap — top oven runs 40 degrees off from the bottom"
    description: |
      Set both cavities to 375°F and one bakes at 330°, the other
      at 415°. That spread almost always traces back to a drifting RTD
      temperature sensor, not the control board. KitchenAid Superba double ovens
      in Tustin Ranch see this after the 10-year mark, particularly after summer
      heat cycles push the sensors past their calibration range.

      Sensors run $30-80 depending on the model. After swapping one, we run a
      test bake cycle and verify against a separate calibrated thermometer — that
      confirmation step is what separates a real fix from a guess.
  - title: "Blank display, buttons unresponsive — control board failure"
    description: |
      A dead control board shows up as a blank screen, error codes
      that cycle randomly, or a keypad that registers nothing. Voltage spikes
      during Tustin's summer peak-demand hours are a common trigger on Thermador
      double wall ovens. We verify the door latch assembly and incoming power
      before ordering a $400-600 replacement board.
  - title: "Self-clean cycle locks the door and won't release"
    description: |
      After a self-clean cycle, the door latch assembly is supposed to release
      once the cavity cools below 550°F. Sometimes the latch motor or thermal
      interlock sticks and the oven stays locked even when completely cold.
      Thermador and KitchenAid units in Tustin Ranch see this more in summer —
      ambient kitchen heat slows the cooldown and the interlock doesn't reset correctly.

      Locked oven is a complete loss-of-use situation. Call (323) 870-4790 and
      we prioritize same-day service for this one — usually there within 2 hours.
      The latch motor assembly runs $120-200 in parts if a reset cycle doesn't clear it.

faq:
  - q: "How fast can you get to Tustin for double oven repair?"
    a: "Daily routes run through the 55 and 5 corridors — Tustin is typically
      30-40 minutes from dispatch. Same-day slots are available most weekdays.
      Call (323) 870-4790 to check what's open today."
  - q: "Do you repair KitchenAid and Bosch double wall ovens in Tustin?"
    a: "Yes — KitchenAid (including the Superba series) and Bosch are the two
      we see most in this area. Thermador and Samsung units are also common jobs.
      Brand-specific parts are usually sourced within 24 hours of diagnosis."
  - q: "What does double oven repair typically cost, and how soon can you come?"
    a: "Diagnostic visit runs $75-95 and covers the full assessment. A heating
      element or thermal fuse swap usually lands at $150-280 total. Control board
      replacement can reach $400-700. Same-day and evening appointments available
      — call (323) 870-4790."
  - q: "My Thermador wall oven shows error code E118 — is that a control board issue?"
    a: "E118 on Thermador usually flags a communication fault between the upper
      cavity's control module and the main board. Not always a full board failure
      — sometimes it's a ribbon cable that's worked loose at the connector, which
      costs nothing to fix if caught early. We run a full diagnostic before
      recommending any part replacement. Evening slots available in Tustin
      — call (323) 870-4790."
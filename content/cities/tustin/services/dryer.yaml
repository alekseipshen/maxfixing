commonProblems:
  - title: "Thermal Fuse Failure in High-Heat Summer Months"
    description: "Orange County summers push ambient garage temps into the 90s, and a dryer already running hot becomes a thermal fuse problem waiting to happen. The thermal fuse is a one-shot safety device — once it blows, the heating element gets no power and the drum tumbles cold. LG electric dryers in Tustin Ranch townhomes hit this failure more than most. Replacement takes under an hour."
  - title: "Drum Roller Wear Causing Loud Thumping Mid-Cycle"
    description: "That rhythmic banging inside the drum isn't the load — it's worn drum rollers losing their shape. Bosch and Samsung units in 92782 condos show this after four or five years of daily use, especially in households running back-to-back loads. The drum roller supports the rear of the drum as it spins; when the nylon wears flat, the thump gets worse every cycle until the belt breaks too."
  - title: "Restricted Exhaust Vent Causing Slow Drying"
    description: "Older Tustin homes on short duct runs collect lint at every elbow — a 90-degree bend two feet from the dryer wall is basically a lint trap nobody cleans. Maytag and Whirlpool dryers with a clogged blower wheel path run full cycles and leave clothes damp. Ignore it long enough and the moisture sensor starts reading wrong, adding extra time automatically. A thorough vent cleaning usually solves it without replacing a single part."


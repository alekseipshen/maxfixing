title: "Arcadia Dishwasher — Hard Water Repairs for SGV Homes"

intro: |
  Tap water across the San Gabriel Valley runs notoriously hard — Arcadia sits around 275 ppm mineral content, and that load quietly calcifies spray arm nozzles, clogs inlet valves, and kills wash performance over time. That Bosch 500 Series in a remodeled craftsman off Duarte Road didn't start leaving film on the glasses by accident. MaxFixing covers the 91006 and 91007 zip codes same-day, usually within two hours of your call to (323) 870-4790.

localContext: |
  Arcadia's housing stock mixes post-war ranch homes from the 1950s and 60s with newer construction near the Arboretum and Santa Anita. Older homes often have tight under-counter clearances and original drain lines that complicate drain pump access. The 91007 zip sees a lot of updated kitchens running higher-end KitchenAid and Bosch units — appliances that need brand-specific diagnostic tools to read error codes accurately before any parts get ordered.

commonProblems:
  - title: "Spray Arm Calcification from SGV Hard Water"
    description: "At 275+ ppm, Arcadia tap water deposits calcium carbonate directly onto spray arm nozzles and the inlet valve screen within 18-24 months. A Bosch unit throwing an E24 error is often reacting to restricted water flow, not a true drain pump failure. Descaling the spray arm assembly and replacing the inlet valve filter usually restores full wash pressure without touching the pump."
  - title: "Drain Pump Failures in Older Arcadia Homes"
    description: "The 1960s tract homes in the 91006 zip sometimes still have original narrow drain lines where food debris accumulates faster, burning out the dishwasher drain pump motor. KitchenAid units show a blinking cancel light; LG units throw an OE error code. Both signals point to a clogged or seized pump that needs replacement, not a reset."
  - title: "Door Latch Assembly and Detergent Dispenser Faults"
    description: "Samsung and LG dishwashers in Arcadia's newer builds see frequent door latch assembly failures — the mechanism loosens from daily use and the door stops sealing mid-cycle. A broken latch also keeps the detergent dispenser from opening at the correct moment, leaving the pod sitting untouched at the bottom of the tub. That's typically a $85-100 part swap, not a replacement appliance."

faq:
  - q: "How fast can you get to Arcadia for a dishwasher repair?"
    a: "Arcadia is a 20-30 minute drive from our main coverage route. Call before noon at (323) 870-4790 and same-day service is usually available — we can typically be there by early afternoon. Residential street parking near Santa Anita and the Foothill corridor is never an issue for our van."
  - q: "Do you repair Bosch and KitchenAid dishwashers in Arcadia?"
    a: "Bosch and KitchenAid are the two most common brands we service in this area. Bosch units frequently need drain pump cleaning or inlet valve replacement. KitchenAid models more often have control board faults or broken door latch assemblies. We also service Thermador, LG, and Samsung — all common in Arcadia kitchens."
  - q: "What does a dishwasher repair cost, and how does the process work?"
    a: "Most repairs run $150–$350 depending on the part and labor. We diagnose on-site and give a flat quote before anything gets touched. Evening slots are available — call (323) 870-4790 for same-day emergency service if the unit is actively leaking or completely dead mid-cycle."

title: "Arcadia Refrigerator Repair — Hard Water & High-End Brands"

intro: |
  Hard water in the San Gabriel Valley is genuinely one of the worst things for
  refrigerators. The tap coming through Arcadia's 91006 pipes carries enough
  dissolved minerals to calcify an ice maker assembly or clog an inlet valve
  within two or three years of normal use. That KitchenAid French-door that
  came with the kitchen remodel? If the ice is coming out cloudy or the
  dispenser's barely trickling, mineral deposits are almost always the starting
  point — not the control board, not the thermostat.

localContext: |
  The housing in Arcadia skews toward 1960s and 1970s ranch-style homes along
  the streets east of Santa Anita Avenue, with some newer builds closer to the
  210 freeway corridor. Kitchens in those older homes often have tighter
  footprints — getting a 36-inch Sub-Zero column unit out far enough to access
  the condenser fan or compressor takes planning. Zip code 91007 has a lot of
  built-in configurations from post-2000 renovations, which adds time to any
  job that needs the unit pulled.

commonProblems:
  - title: "Ice Maker Failure from Mineral Buildup"
    description: "SGV water hardness sits well above 200 mg/L in most of Arcadia,
      and it hits ice maker assemblies first. The water inlet valve gets
      restricted by scale, flow drops, and eventually the ice maker stops
      cycling entirely. On LG and Samsung French-door models, a partially
      blocked inlet valve often throws an ER IF or 1F error code before
      full failure. Cleaning or replacing the valve plus flushing the line
      usually resolves it."
  - title: "Compressor Overheating in Summer Heat"
    description: "San Gabriel Valley summers regularly push past 95°F in July
      and August, and poorly ventilated kitchens make it worse. The compressor
      runs near-continuously to hold temperature, which accelerates wear on
      the start relay and condenser fan motor. Thermador column refrigerators
      with condenser coils mounted at the base are especially prone to this —
      dust and pet hair pack into the coils and cut airflow, sending compressor
      temps into the danger zone."
  - title: "Evaporator Coil Ice Buildup Blocking Airflow"
    description: "A frost-covered evaporator coil is one of the most common
      calls we get from Arcadia homeowners. The defrost timer or defrost
      heater stops cycling correctly, ice sheets over the coil, and the fridge
      loses its ability to circulate cold air — the freezer stays frozen but
      the refrigerator section climbs to 50°F. Bosch bottom-freezer units
      are repeat offenders here; the defrost heater assembly on those models
      has a known weak point around the 5-7 year mark."

faq:
  - q: "How fast can you get to Arcadia for refrigerator repair?"
    a: "We cover Arcadia out of our San Gabriel Valley route — most calls in
      the 91006 and 91007 zip codes get a same-day slot, usually within 2
      hours. Parking is generally straightforward on residential streets. Call
      us at (323) 870-4790 to check today's availability."
  - q: "Do you repair Sub-Zero and KitchenAid refrigerators in Arcadia?"
    a: "Yes, and both brands show up constantly in Arcadia homes. Sub-Zero
      built-ins need brand-specific tools for the compressor compartment —
      generic approaches damage the cabinetry. KitchenAid French-door models
      we see most often for ice maker assemblies and door gasket replacements.
      We also handle Bosch, LG, and Samsung."
  - q: "What does a refrigerator repair visit actually involve?"
    a: "We diagnose on the first visit — no 'we'll order the part and come
      back in a week' runaround. Most common parts (inlet valves, thermal
      fuses, drain pumps, door gaskets) are on the truck. Evening slots are
      available if daytime doesn't work. Schedule online or call (323) 870-4790."
title: "Arcadia Freezer Repair — Holding Temperature in SGV Heat"

intro: |
  Ranch homes tucked behind Santa Anita Park and the newer builds along Huntington
  Drive hit the same wall every summer — the freezer in the garage starts struggling
  by mid-July and you don't notice until something's thawed. San Gabriel Valley tap
  water is loaded with calcium, silently clogging ice maker assemblies and inlet
  valves faster than most people expect. That Samsung french-door you bought three
  years ago is already showing signs of it in 91006.

  Arcadia freezers work harder than they should have to. The fix is usually faster
  than you think — if you catch it early.

localContext: |
  Arcadia's 91006 and 91007 zips hold a mix of post-war ranch homes from the 1950s
  and 60s alongside larger two-story builds from the 1990s development wave. Detached
  garages are common throughout the Arcadia Arboretum area — and that's where most
  chest and upright freezers end up.

  Garage placement is hard on compressors and condenser fans when San Gabriel Valley
  afternoons push ambient temps past 100°F. A unit designed for a climate-controlled
  kitchen doesn't last as long out there. The temperature delta between a cool morning
  and a 4pm garage in August is brutal — 40 to 50 degrees of swing in a single day,
  which stresses door gaskets and causes them to warp and crack far sooner than
  normal indoor use would.

  Homes along Baldwin Avenue and the streets near Arcadia High tend to have older
  Whirlpool and Kenmore chest freezers in the garage. Newer builds near the 210
  closer to Monrovia often have KitchenAid or LG uprights that came with the house.
  Different brands, same problem every July.

commonProblems:
  - title: "Compressor Overload from Arcadia Garage Heat"
    description: "An Arcadia garage can hit 105°F by early afternoon in July. A freezer
      compressor fighting that ambient heat runs hot, trips the overload protector
      repeatedly, and eventually stops starting. That LG upright out there may just
      need a new start relay — a $40 part. Or the compressor itself has seized.

      Either way, soft food means the clock is already running. Condenser coils
      caked with dust make the problem worse — airflow drops, the compressor runs
      hotter, and the cycle repeats until something burns out. Cleaning coils alone
      sometimes restores normal operation on units that looked like they needed
      full replacement."

  - title: "Frost Buildup on the Back Wall and Evaporator Coil"
    description: "Frost accumulating behind the rear panel almost always traces back to
      a warped or cracked door gasket — warm humid air leaks in, hits the evaporator
      coil, and freezes solid. Bosch and KitchenAid upright models develop this after
      five or six years, particularly in garages with wide temperature swings. Once
      the coil is blocked, airflow stops and the unit can't hold temperature even if
      the compressor is running fine.

      A defrost heater or defrost thermostat failure can produce the same symptom.
      Before replacing anything, we test the defrost timer and check continuity on
      the heater — sometimes the fix is a $25 thermal fuse, not a new gasket."

  - title: "Ice Maker Failure from Hard Water Mineral Scale"
    description: "Arcadia tap water tests above 300 mg/L dissolved calcium in many
      blocks — that mineral load settles into the ice maker water inlet valve and
      freeze line within two to three years. Samsung and GE french-door models show
      it first as slow production and misshapen cubes, then nothing at all. A vinegar
      flush buys a few weeks at most. By that point, the inlet valve itself needs
      replacement.

      The ice maker assembly on Sub-Zero and Thermador built-ins requires a different
      approach — those units use proprietary freeze cycles and the control board
      sometimes throws an error code before the physical failure is obvious.
      Catching it at the error-code stage is cheaper than waiting for full seizure."

faq:
  - q: "How fast can you get to Arcadia for freezer repair?"
    a: "Arcadia is on our daily San Gabriel Valley route — most calls get a technician
      there within 2 hours. The 210 corridor is straightforward from our side, and
      parking in most Arcadia neighborhoods is easy for a service van. Residential
      streets near the Arboretum or off Live Oak are no problem.

      Call (323) 870-4790 or schedule online — same-day morning and afternoon slots
      are usually open, and we can often squeeze in urgent calls before end of day."

  - q: "Do you repair LG, Samsung, and Bosch freezers in Arcadia?"
    a: "Yes. LG and Samsung are the two most common brands we see in 91006 and 91007.
      On LG units we frequently replace evaporator fan motors and drain pumps. Samsung
      french-door freezer drawers almost always trace to inlet valve or ice maker
      assembly failures. Bosch uprights come in for door gasket replacements and
      control board issues — all stocked on the truck.

      Sub-Zero and Thermador come up less often in Arcadia than in Arcadia's
      neighboring cities, but we carry the tools for those too."

  - q: "What does freezer repair cost, and is emergency service available?"
    a: "Diagnosis runs $75 and applies toward the repair. Most fixes — door gasket
      replacement, thermal fuse, start relay swap, drain pump — land between $150
      and $300 parts included.

      Evening and emergency slots are available. Call (323) 870-4790 directly for
      urgent calls — a thawing freezer full of food is exactly what same-day
      service exists for. We fit those into the schedule when we can, and the
      answer is yes more often than not."
title: "Arcadia Double Oven — Repair for 91006 & 91007 Homes"

intro: |
  Zip codes 91006 and 91007 are packed with 1960s ranch homes that went through
  full kitchen overhauls in the 2000s — that's when KitchenAid and Bosch double
  wall ovens landed in a lot of these kitchens.

  Streets off Baldwin Avenue, near the LA County Arboretum, Hugo Reid Drive, and
  the Foothill Boulevard corridor account for most of our double oven service
  calls. The Highlands neighborhood in 91006 alone generates a disproportionate
  share of Thermador and Sub-Zero tickets each year.

  One cavity stops heating while the other works perfectly. Or the control board
  throws an error code and locks out both.

  Both cavities failing simultaneously is rarer — that almost always points to a
  shared power relay or the main control board, not two coincidental element
  failures. Either scenario needs a proper diagnosis before parts get ordered.
  These don't get better on their own.

localContext: |
  Most of Arcadia's residential stock in 91007 traces back to the 1950s and
  early 60s.

  Solid single-family homes on streets like Santa Anita Avenue, Rodeo Road, and
  the Las Tunas Drive corridor saw major kitchen remodels starting in the early
  2000s. That renovation wave brought built-in double wall ovens into kitchens
  that weren't originally designed for them — tight cabinet cutouts with almost
  no working clearance around the unit. Thermador and KitchenAid installs
  dominate. A lot of the Thermador built-ins in that stretch were installed
  around 2004-2008 and are now hitting the age range where control boards start
  failing from heat cycling — roughly 18-22 years of thermal expansion and
  contraction takes a toll on solder joints and relays.

  Getting a unit out to access the heating element or replace a wiring harness
  takes specific pry tools and patience.

  It's not a one-screwdriver job. The older construction in the 91007 zip code
  especially tends toward narrower cabinet bays built before double wall ovens
  were a standard install. Homes near Camino Real Avenue and the Rancho Santa
  Anita neighborhood often have custom millwork surrounding the oven stack, which
  means extraction requires extra care to avoid damage to cabinetry. Knowing the
  model generation matters before pulling anything apart — a 2005 KitchenAid
  KODE500 has a completely different wiring harness layout than a 2018 unit.

commonProblems:
  - title: "Upper Cavity Dead, Lower Cavity Works Perfectly"
    description: |
      This split-failure pattern almost always points to the heating element in
      the upper cavity — not the control board, because a dead board would take
      both ovens out simultaneously. Bosch double wall ovens develop element
      failures around the 8-10 year mark in regularly used kitchens. That's a
      predictable failure window, not a manufacturing defect. KitchenAid models
      sometimes develop a wiring harness break feeding only the upper cavity
      independently, which mimics a dead element until you run continuity tests.

      Diagnosing which it is takes a multimeter reading before any part gets
      ordered.

      Ordering the wrong part adds a week to the repair. Homes in 91006 near
      the Santa Anita Park boundary tend to have older KitchenAid stacks from
      the 2003-2007 installation wave — those wiring harnesses are a known wear
      point by now.

  - title: "Set 350°, Baking at 400° — Temperature Sensor Drift"
    description: |
      The RTD temperature probe calibrates each cavity to its set point.

      After years of broil cycles, the probe's resistance shifts and it starts
      reading low — so the oven compensates by running hotter than commanded.
      KitchenAid KODE500 units show this pattern regularly past the five-year
      mark, particularly in kitchens that run the broiler frequently. Sub-Zero
      double ovens exhibit the same drift pattern, though their probes tend to
      last slightly longer before the resistance offset becomes noticeable in
      baking results.

      Menu recalibration buys a few weeks of relief.

      A drifted probe needs physical replacement — usually about a 45-minute job
      once the unit is accessed. The part itself is inexpensive relative to the
      diagnostic visit.

  - title: "Control Board Lockout — F3, E1, or a Completely Dark Display"
    description: |
      A failed control board is the most expensive double oven repair.

      Samsung built-in double ovens often display F3 or E1 error codes before
      the board fully dies — but those same codes can indicate a faulty
      temperature sensor, which runs a fraction of a new board. Thermador units
      typically just go silent with no error code at all, which makes them
      harder to self-diagnose. Bosch throws numeric codes that look alarming but
      sometimes resolve to a simple door hinge assembly misalignment triggering
      a safety lockout rather than actual board failure.

      On-site diagnostics confirm the board is actually the problem before
      recommending anything. That step saves Arcadia homeowners from paying for
      an unnecessary board swap when a $80 sensor is the actual culprit.


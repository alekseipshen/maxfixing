  - q: "Do you repair KitchenAid and Thermador double ovens specifically?"
    a: |
      KitchenAid and Thermador are the two most common double oven brands in
      Arcadia's renovated kitchens.

      Bosch built-ins and Samsung wall ovens come up regularly too. Sub-Zero
      double ovens appear in higher-end remodels near the 91006 zip code's
      Foothill section. We stock brand-specific heating elements, temperature
      sensors, and control boards on the van — KitchenAid and Bosch parts
      especially, since those show up on nearly every other service call in this
      area. Most repairs finish in a single visit.

  - q: "What does a double oven repair cost, and is same-day service available?"

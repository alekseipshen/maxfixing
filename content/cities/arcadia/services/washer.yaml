title: "Arcadia Washer Repair — Hard Water & High-End Machines"

intro: |
  Santa Anita Avenue homes in 91006 skew heavily toward Bosch and LG front-loaders
  — and the San Gabriel Valley's notoriously hard water, often hitting 350+ ppm
  through the San Gabriel Valley Water Company's supply, quietly wrecks water inlet
  valves and detergent dispensers over 18-24 months. One clogged inlet valve and
  suddenly your Bosch is half-filling or refusing to start a cycle entirely. We cover
  Arcadia daily — call us at (323) 870-4790.

localContext: |
  The 91007 zip runs a mix of 1950s ranch homes and newer construction off Live Oak
  Avenue, with laundry rooms tucked into converted garages or narrow hallways — tight
  access that slows every job. Homes closer to Baldwin Avenue tend to have newer builds
  with stacked LG WashTower units or pedestal-mounted front-loaders. Older detached
  garages with exposed pipes mean supply hose connections wear faster than in climate-
  controlled utility rooms.

commonProblems:
  - title: "Mineral Buildup Killing Water Inlet Valves on Bosch Units"
    description: "SGV water deposits accumulate inside the water inlet valve screens
      within a year or two on Bosch 500 and 800 series machines. The washer starts a
      cycle, pauses at fill, then throws an E17 or water supply error. Replacing the
      valve assembly clears it — but the underlying hardness means it'll recur without
      a softener or regular descaling."
  - title: "Drain Pump Failures on LG Front-Loaders"
    description: "LG front-loaders in Arcadia show OE error codes — that's a drain
      fault, usually a clogged or failed drain pump. Lint, coins, and hard-water
      sediment pack the pump housing over time. On the WM3900 and similar models, the
      pump is accessible from the front panel — a 45-minute fix when parts are on hand."
  - title: "Drum Bearing Noise on Samsung WashTowers"
    description: "That grinding or rumbling mid-cycle on a Samsung WashTower is almost
      always the drum bearing going out. It's a labor-heavy repair — the tub splits to
      access the rear bearing — but ignoring it leads to a cracked spider arm and a
      much bigger bill. We see this frequently on WashTowers installed 3-5 years back
      in newer Arcadia builds."


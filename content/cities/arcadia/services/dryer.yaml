commonProblems:
  - title: "Thermal Fuse Failures from Valley Summer Heat"
    description: "Arcadia summers push ambient garage temperatures past 95°F for weeks straight. That
      extra heat load causes the thermal fuse on LG electric dryers to blow more frequently —
      sometimes twice in a single season. Replacing the fuse fixes the symptom; cleaning the
      exhaust vent and checking the heating element resistance fixes the cause."
  - title: "Drum Not Spinning — Drive Belt and Idler Pulley Wear"
    description: "Bosch and KitchenAid units in this area often hit the 8-10 year mark with the
      original drive belt still in place. The belt tensioner and idler pulley wear together, so
      when the drum stops, both usually need to go. Skipping the pulley replacement means the new
      belt fails within months."
  - title: "Takes Too Long to Dry — Mineral Buildup in Moisture Sensor"
    description: "Hard water in the San Gabriel Valley leaves calcium deposits on the moisture sensor
      bars inside Samsung front-load dryers. The machine reads 'dry' before the load actually is,
      triggering early shutoff. A quick descale of the sensor strips and a full exhaust vent
      cleanout usually cuts drying time in half."


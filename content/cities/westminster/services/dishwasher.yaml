title: "Westminster Dishwasher — Hard Water Damage in OC Ranch Homes"

intro: |
  Bolsa Avenue cuts through the heart of Little Saigon, and the neighborhoods fanning out from there — toward Sigler Park and into the 92683 zip — share one unglamorous constant: Orange County hard water hammering every dishwasher in those 1960s kitchens. That Bosch 500 Series your neighbor swears by? Mineral deposits are quietly clogging its spray arms right now. We fix this all day across Westminster.

localContext: |
  Most of Westminster's housing stock was built between 1958 and 1978 — compact ranch-style layouts with tight under-counter dishwasher cavities, especially in the older blocks near Newland Street and throughout the 92683 zip. Getting a machine out for a drain pump or control board swap takes the right tools and someone who's done it in these low-clearance kitchens before. The original plumbing in many of these homes adds another wrinkle: corroded water inlet valve connections are practically standard in anything built before 1975.

commonProblems:
  - title: "Spray Arm Blockage From OC's Notoriously Hard Water"
    description: "Orange County water hardness regularly tops 300 ppm — that calcium load coats the spray arm nozzles and the inlet valve screen until pressure drops and dishes come out cloudy and spotted. Samsung and LG machines usually throw a 9E or LE error before you even notice the problem. Descaling the spray arm and swapping the inlet valve screen fixes it cleanly."
  - title: "Drain Pump Failure in Westminster's Older Units"
    description: "Whirlpool and GE dishwashers from the mid-2000s are everywhere in these Westminster homes, and their drain pumps wear out from food debris compacted with hard water sediment. Standing water at the bottom of the tub after a cycle is the tell — the float switch usually checks out fine, but the drain pump impeller is seized or cracked. Same-day fix in most cases."
  - title: "Detergent Dispenser Door Refusing to Latch"
    description: "KitchenAid and Bosch units in the 92684 zip develop dispenser door latch assembly failures faster than you'd expect — the spring mechanism gets packed with detergent residue and mineral scale until the door won't spring open mid-cycle. Dishes come out with clumps of undissolved soap. Replacement latch assemblies are inexpensive, and the job takes under an hour."


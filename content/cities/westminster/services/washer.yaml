commonProblems:
  - title: "Mineral Scale Killing the Water Inlet Valve — 92683's #1 Washer Problem"
    description: "Orange County's hard water deposits calcium and magnesium inside
      the water inlet valve screens within 18-24 months of normal use. The machine
      fills slowly, then stops filling mid-cycle. Whirlpool and GE top-loaders from
      the 2010s are especially prone — the dual solenoid valve design traps scale
      fast. Replacement runs $80-$140 in parts, and it's a same-day fix."

  - title: "Drum Bearing Failure in Front-Loaders — Loud, Gets Worse Fast"
    description: "A grinding roar during the spin cycle isn't just annoying — it
      means the drum bearing is going. Samsung and LG front-loaders (the 27-inch
      models common in Westminster's mid-range homes) both suffer this after 5-7
      years. Ignore it and the spider bracket cracks, turning a $150 bearing job
      into a $400+ repair. Catching it early matters."

  - title: "Drain Pump Clogs and Failures — Standing Water After Every Cycle"
    description: "Westminster's older apartment laundry hookups have 1.5-inch drain
      lines instead of modern 2-inch — any debris makes the drain pump work harder.
      KitchenAid and Bosch front-loaders show F21 or E18 error codes when the pump
      strainer is blocked or the impeller is cracked. Sometimes it's just lint and
      a sock. Other times the pump motor is burned and needs replacement."


title: "Westminster Ice Maker — OC Hard Water Kills Fill Valves Fast"

intro: |
  Bolsa Avenue cuts through Westminster's densest residential stretch, and the water
  flowing into ice makers along that corridor comes loaded. Orange County's Colorado
  River blend runs 280–320 ppm total dissolved solids — enough to calcify a water
  inlet valve or clog a fill tube inside 12 months. That LG InstaView sitting in a
  92683 kitchen isn't necessarily broken; scale on the sensor line tricks the machine
  into thinking the bin is full when it's empty. Most homeowners replace the whole
  unit when a $140 valve swap would have fixed it.

localContext: |
  Westminster's housing stock is mostly 1960s and early 1970s tract homes — the kind
  built before ice makers were factory-standard equipment. Retrofit installations in
  92683 and 92684 kitchens often mean tight water line routing through cramped cabinet
  bases, sometimes with undersized ¼-inch supply tubing that kinks or crimps over
  time.

  The Goldenwest and Newland Street corridors have a high concentration of these
  original-build homes where even a supply line replacement requires pulling the
  refrigerator completely and working in tight quarters. Plenty of Westminster rentals
  also have a saddle valve tap added by a previous tenant — the corroding kind that
  drops flow pressure low enough to cause production failures even when the fill valve
  itself tests fine.

commonProblems:
  - title: "Mineral Scale Shuts Down the Fill Valve Solenoid"
    description: |
      Westminster's hard water leaves calcium deposits inside the water inlet valve
      solenoid coil over time. The coil loses magnetism, can't open fully, and flow
      drops below the minimum threshold the machine needs to cycle. Whirlpool and
      GE side-by-side models throughout 92683 see this constantly — especially units
      that have never had the supply line flushed. The valve itself is a $40–$70
      part. Most homeowners don't realize the ice maker assembly is completely fine.

  - title: "Small or Hollow Cubes from a Scaled Fill Tube"
    description: |
      Mineral buildup inside the fill tube narrows the opening gradually, so water
      distribution across the ice tray becomes uneven. The result is half-moon cubes,
      tiny pellets, or ice that looks normal but hollow inside.

      Samsung french-door refrigerators — extremely common in Westminster's
      mid-income neighborhoods — have a narrow-diameter fill tube that scales faster
      than most. On the RF28 and RF23 series, the tube runs close to the evaporator
      housing; any slow drip from an incomplete defrost cycle also contributes to
      freezing right at the tube mouth. A thorough descale of the water line and fill
      tube usually restores full-size cube production without touching the ice maker
      assembly itself. KitchenAid counter-depths in Westminster's newer builds tend
      to have better-insulated tube routing — still not immune, just slower to clog.
      Bosch integrated units show the same scaling pattern once they hit the
      three-year mark in hard-water zip codes like 92683.

  - title: "Frozen Fill Tube Blocking the Ice Cycle"
    description: |
      A frozen fill tube looks like a plumbing blockage but the cause is usually a
      defrost timer running out of cycle or freezer temps dipping too low overnight.
      LG units installed in garages or against exterior walls in Westminster get this
      in winter months. The real fix is recalibrating the freezer thermostat and
      verifying the defrost heater still draws current — otherwise the line refreezes
      within a week.

faq:
  - q: "How fast can you get to Westminster for ice maker repair?"
    a: |
      Most Westminster calls get same-day service. Coming from Garden Grove or Fountain
      Valley, we're typically 15–20 minutes out. Residential streets off Bolsa and
      Magnolia are easy for the service van — no downtown parking headaches. Call
      (323) 870-4790 and we can usually confirm an arrival window within the hour.
      Evening slots available if daytime doesn't work.

  - q: "Do you repair Samsung and LG ice makers specifically?"
    a: |
      Samsung and LG together are roughly 60% of our Westminster ice maker calls. On
      Samsung french-door units, it's almost always the water inlet valve or a frozen
      fill tube. LG InstaView models frequently have a failed auger motor or a sensor
      line that reads full when it isn't. Both brands are same-day repairs in most
      cases — common parts stay in the van.

  - q: "What does ice maker repair cost, and is it worth fixing vs. buying new?"
    a: |
      Diagnosis runs $75–$95, credited toward the repair. A water inlet valve swap
      is $120–$180. Full ice maker assembly replacement lands at $200–$320 depending
      on the model. On a Whirlpool or GE that's 4–6 years old, repair almost always
      makes financial sense. Call (323) 870-4790 and describe the symptoms — we can
      often diagnose it over the phone before we even show up.
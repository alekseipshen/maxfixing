title: "Westminster Refrigerator Repair — Little Saigon's Hard Water Problem"

intro: |
  Little Saigon sits right in the middle of Westminster's 92683 zip code, and the
  appliance repair calls from this stretch of Bolsa Avenue and the surrounding
  residential streets share a common thread: mineral scale. Orange County's water
  hardness regularly clocks in above 300 mg/L — that's calcium and magnesium
  grinding through ice maker assemblies and inlet valves on Samsung and LG
  french-door models until they stop making ice entirely. Call us at
  (323) 870-4790 and we can usually be there the same day.

localContext: |
  Most of Westminster's housing stock was built between 1960 and 1985 — tract
  homes on streets like Trask Avenue and Newland Street with kitchens that haven't
  always been updated since original construction. The 92683 and 92684 zip codes
  are full of side-by-side and top-freezer Whirlpool and GE units wedged into
  cabinets that make pulling out the fridge a two-person job. Older installs also
  mean older wiring — something worth knowing when a compressor starts cycling
  erratically and you're not sure if it's the refrigerator or the outlet.

commonProblems:
  - title: "Scale buildup killing ice makers — Orange County's hard water signature"
    description: "Calcium deposits block the water inlet valve and coat the ice maker
      assembly until water flow drops to a trickle. On Samsung RF-series models this
      shows up as error code 'Ice Off' even when the ice maker is enabled. Flushing
      the line isn't enough — the valve seat needs to be replaced and the fill tube
      cleared."

  - title: "Warm fridge, frost-packed freezer — defrost system failure in older units"
    description: "A freezer full of ice but a refrigerator compartment sitting at
      50°F is almost always a defrost timer or defrost heater failure. The evaporator
      coil ices over completely, blocking airflow to the fresh food section. Bosch
      and KitchenAid counter-depth models are especially prone to this when the
      defrost cycle control board relay goes bad after 8-10 years."

  - title: "Compressor noise and warm temps during summer heat"
    description: "Westminster summers push ambient garage and kitchen temps into the
      90s, and refrigerators running in those conditions stress the compressor hard.
      A condenser fan motor that's starting to fail — loose blades, worn bearings —
      makes a rattling sound and lets the compressor overheat. LG linear compressor
      units are particularly sensitive to condenser fan issues and will trip into
      protection mode, shutting cooling down entirely."


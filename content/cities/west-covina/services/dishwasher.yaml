title: "West Covina Dishwasher — SGV Hard Water Kills Spray Arms"

intro: |
  San Gabriel Valley tap water consistently tests among the hardest in LA County
  — and in West Covina's 91791 zip, that mineral load does real damage fast.
  A Bosch 500 Series that won't clean right isn't usually failing; the spray arm
  ports are simply packed with calcium. Homes along Cameron Avenue and over near
  Shadow Oak Park call us for exactly this, and it's almost always fixable
  same-day without replacing anything major.

localContext: |
  Most of West Covina's housing stock dates from the 1950s through the 1970s
  — ranch-style homes with original kitchen configurations that weren't built for
  today's integrated dishwashers. The 91792 zip especially shows post-Korean-War
  tract houses where plumbing has been modified across three or four owners. Tighter
  under-counter clearances and older drain line angles make service calls here take
  longer than a newer subdivision, and we account for that on every visit.

commonProblems:
  - title: "Spray Arm Blockage From SGV Mineral Buildup"
    description: "West Covina's hard water deposits calcium directly into spray arm jets
      — fast. A KitchenAid unit leaving cloudy residue on glasses almost always has
      at least two of the eight upper spray arm ports fully blocked. Descaling helps
      temporarily, but a cracked spray arm needs replacement, not soaking. This is
      the single most common call we get from the 91790 area."
  - title: "Drain Pump Failure After Food Debris Accumulation"
    description: "Standing water at the bottom of the tub after a cycle points to the
      drain pump — but in older West Covina homes, a kinked or improperly sloped
      drain hose (patched by a previous owner) is often the real cause. LG dishwashers
      showing the OE error code almost always have debris wrapped around the drain
      pump impeller. Takes about 45 minutes to clear properly."
  - title: "Door Latch Assembly Failure on Bosch Units"
    description: "Bosch dishwashers are common in West Covina's higher-income pockets
      near Amar Road. The door latch assembly on the 500 and 800 Series wears out
      faster than most owners expect — usually around the 4-to-6-year mark. The
      machine simply won't start, and the control board throws no error code because
      it never registers a closed door. Replacement latch is about $35 in parts."

faq:
  - q: "How fast can you get to West Covina for dishwasher repair?"
    a: "West Covina sits right on our regular 10 and 60 freeway routes. Most calls
      in the 91790–91792 zip range get a same-day slot — call (323) 870-4790 before
      noon and we can typically be there that afternoon or early evening."
  - q: "Do you repair Bosch and KitchenAid dishwashers in West Covina?"
    a: "Yes — Bosch, KitchenAid, and Samsung are the three we see most in this area.
      On Bosch, it's usually the door latch assembly or detergent dispenser. KitchenAid
      tends to need the heating element or water inlet valve. Samsung DW80 series
      most often needs the control board or drain pump."
  - q: "What does a dishwasher repair cost, and how quickly can you come out?"
    a: "Diagnosis is $75 and applies toward the repair if you approve it. Most
      common fixes — spray arm, drain pump, door latch — run $120–$250 all-in.
      Evening slots available if daytime doesn't work. Call (323) 870-4790 or
      book online and we'll confirm a two-hour arrival window."

title: "West Covina Cooktop Repair — SGV Heat and Igniter Failures Covered"

intro: |
  Summer highs in West Covina regularly hit 105°F, and that inland San Gabriel Valley heat has real consequences for cooktops. The KitchenAid five-burner and Bosch induction units installed during kitchen remodels of the 2010s are now 10-15 years in — igniter failures, cracked ceramic glass, and sticky gas valves are showing up on schedule. Coverage spans all of West Covina from South Hills down to the 10 freeway corridor, typically same-day.

localContext: |
  The Shadow Oak and South Hills neighborhoods in 91791 sit on the higher ground north of the 10 freeway — homes here are mostly 1960s and 1970s California ranch-style builds with updated kitchens. Many of those renovation projects dropped in Thermador five-burner sealed-burner units or Bosch gas cooktops, and those installs are now well into their service life. Igniter electrodes and spark modules go first, usually around year seven or eight of daily use. South Hills Country Club marks the dividing line — homes east of there along Cameron Avenue tend toward higher-end KitchenAid and Sub-Zero installs from the late 2000s remodel boom.

  The 91790 zip running along Barranca Avenue and the Azusa Avenue commercial corridor has a different kitchen profile. Woodside Village and the blocks near West Covina High School are classic mid-century ranch stock — three-bed, single-story, original gas lines. LG and Samsung glass-top units dominate these kitchens. Newer 1990s tract subdivisions closer to the 10 freeway lean toward builder-grade Whirlpool and Frigidaire cooktops that need element and control board work after about a decade.

  North Hills and the streets near Galster Wilderness Park see more recent construction — induction cooktops are common here, which shifts the failure mode to control board issues rather than ignition. The 91792 zip from Citrus Street toward the 60 freeway mixes mid-century homes with 1990s tract housing, mostly Bosch gas models in the renovated kitchens. Hard water in West Covina accelerates mineral buildup in gas ports and induction coil housings alike — the local supply tests consistently above 300 mg/L calcium carbonate, enough to clog a burner port cap in under two years without regular cleaning. That mineral load hits the older gas infrastructure along Vincent Avenue and Hollencrest Drive especially hard.

commonProblems:
  - title: "Gas burner won't light or spark module clicks non-stop after ignition"
    description: "Grease and food residue pack into the igniter electrode gap and cause either continuous clicking or zero spark response. The spark module — which drives the electrode — is a separate component that fails independently, and it won't display an error code when it goes. Bosch and KitchenAid gas units see this pattern after four to six years of regular use. Cleaning the electrode ports helps short-term; replacing the full igniter assembly is the lasting fix."

  - title: "Cracked ceramic glass surface on Samsung and LG induction cooktops"
    description: "San Gabriel Valley homes deal with more thermal stress fractures than coastal areas — extreme heat cycles, dry air, and cold water hitting a hot glass surface all accelerate cracking. Samsung and LG glass-top units typically fracture near the heating element zones first, then the crack spreads outward over weeks. The ceramic glass panel cannot be safely patched; full replacement is the only option. Parts usually arrive within 2-3 days of ordering."

  - title: "Uneven flame or one burner running dangerously hot on gas cooktops"
    description: "A warped or clogged burner cap disrupts flame distribution and is the first thing to check — usually a straightforward fix. If the problem comes back, the gas valve orifice is likely worn and allowing inconsistent fuel flow. On older Thermador five-burner gas units, the gas valve assembly develops uneven wear over time and needs full replacement rather than cleaning. Persistent uneven combustion also produces elevated carbon monoxide output. That one needs a technician, not a YouTube fix. Homes on the older blocks near Hollencrest Middle School and along Vincent Avenue see this specific failure pattern regularly — the combination of aging gas infrastructure and hard water deposits in the orifice makes it a West Covina staple."


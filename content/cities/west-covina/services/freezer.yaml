title: "West Covina Freezer — SGV Heat Pushes Compressors to the Limit"

intro: |
  Galster Wilderness Park sits on the north edge of town, but the real story
  in West Covina summers is the heat radiating off the 10 Freeway corridor.
  Zip codes 91790 and 91791 regularly see July highs above 100°F — and that
  ambient temperature goes straight into every garage where a chest freezer
  lives next to the water heater. That Samsung upright near the drywall? It's
  running almost continuously by August. Most calls we get start the same way:
  "it's been running all day but nothing's actually frozen."

localContext: |
  The bulk of West Covina's housing stock dates to the 1950s and 1960s —
  ranch-style homes with attached garages that double as heat traps in summer.
  The Merced Avenue and Sunset Avenue corridors in 91791 are typical: original
  builds with tight garage layouts, sometimes a gas dryer and a chest freezer
  sharing the same wall. Newer two-story builds from the 1980s in 91792 tend
  to have built-in refrigerator-freezer combos — KitchenAid and Bosch show up
  frequently in those kitchens.

  Further east, toward the Covina Hills area off Garvey Avenue, the homes are
  larger and the appliances more premium. Sub-Zero and Thermador built-ins are
  common there — units installed during kitchen remodels in the early 2000s
  that are now hitting the 15-to-20-year mark on original compressors. The
  91723 zip sees more of those calls. Parking a service van in those
  neighborhoods is easy; getting to a built-in freezer behind custom cabinetry
  takes an extra 20 minutes of panel work before the actual repair even starts.

  The South Hills neighborhood — the elevated section near Shadow Oak Drive and
  South Hills Drive — runs different appliances than lower West Covina. Houses
  built in the late 1970s through mid-1980s up there often have Viking or
  Thermador refrigerator-freezers that came in during 2000s renovations. Same
  aging-compressor pattern as Covina Hills. Cameron Avenue south of the 10 is
  another cluster we visit regularly — post-war tract homes, tighter kitchens,
  more compact LG and Samsung upright freezers crammed into laundry alcoves off
  the kitchen.

  West Covina's water is consistently hard — the San Gabriel Valley basin pulls
  from groundwater sources with high mineral content. That matters for
  combination refrigerator-freezers with ice makers: mineral scale blocks the
  water inlet valve filter over two or three years, restricts flow, and the
  ice maker assembly stops cycling properly. Homeowners usually think the ice
  maker failed. Often it's just scale buildup on a $12 filter screen.

commonProblems:
  - title: "Compressor Running Nonstop, Freezer Still Won't Hold Temperature"
    description: "SGV summer heat pushes compressors past their design limits. On LG and
      Samsung upright freezers, the condenser fan motor tends to fail first —
      the compressor overheats without airflow, then trips its overload relay.
      Clean the condenser coils, swap the fan motor, and the compressor usually
      recovers. Catch it late — after the relay fails repeatedly — and you're
      looking at a full compressor replacement, which on a 10-year-old LG runs
      $350–500 in parts alone. In garage setups along the 91790 corridor where
      ambient temps hit 110°F by mid-afternoon, that overload relay is often
      the first part we carry on the truck."

  - title: "Thick Frost Packed Around the Evaporator Coil"
    description: "Frost that keeps building even after defrost cycles means the defrost
      timer has stopped signaling the defrost heater — ice accumulates around
      the evaporator coil until airflow is completely blocked and temps climb.
      KitchenAid and Bosch upright freezers in 91792 show this pattern
      regularly on units 8–10 years old. You'll know it's happening when the
      freezer feels warm but the motor is still running loud."

  - title: "Temperature Swings That Ruin Food Quality"
    description: "A freezer that cycles between 5°F and 22°F usually has a cracked door
      gasket letting warm air in repeatedly. The thermostat overcorrects, the
      compressor works overtime, and food gets that frost-burn texture. Sub-Zero
      built-ins, popular in the Covina Hills area, have model-specific door
      gaskets with tight tolerances — a generic replacement won't seat correctly.
      We stock the common Sub-Zero sizes and carry a torque spec sheet for
      the hinge realignment those units often need."

faq:
  - q: "How fast can you get to West Covina for a freezer repair?"
    a: "Regular SGV routes keep us close — usually 20–30 minutes from wherever
      we're working. Same-day slots are open most weekdays, and evening
      appointments are available if you can't be home until after 5. Call
      (323) 870-4790 to check today's availability before the food situation
      gets critical."

  - q: "Do you repair LG, Samsung, and Bosch freezers in West Covina?"
    a: "All three, regularly. LG bottom-freezer units are the most common call
      in this zip code — usually a drain pump clog or a failed ice maker
      assembly. Samsung french-door freezer drawers come in second. Bosch
      and KitchenAid we handle too, though European brand parts can have
      longer lead times on specialty components."

  - q: "How do I know if my freezer is worth repairing or should be replaced?"
    a: "Flat-rate diagnosis first — that fee applies toward repair if you move
      forward. A defrost heater or door gasket swap typically runs $150–$250
      parts and labor. Compressor replacement is the bigger decision, usually
      $400+, and on units over 10 years old we'll give you a straight answer
      on whether the math works. Same-day emergency service is available if
      you have a full chest freezer and no time to wait."
title: "West Covina Refrigerator — Hard Water & Valley Heat Wear Units Down Fast"

intro: |
  San Gabriel Valley tap water is some of the hardest in Southern California — West Covina sits
  right in the thick of it. That calcium load hits ice maker assemblies and water inlet valves
  faster than most homeowners expect. The LG and Samsung french-door models popular in the 91791
  zip code show scale buildup inside the ice maker by year three or four. Most people don't
  notice until the freezer starts building frost ridges along the back wall. By then the
  evaporator coil is already partially blocked.

localContext: |
  West Covina's housing stock runs heavily toward 1960s and 1970s tract homes — galley-style
  kitchens where the refrigerator sits flush against a peninsula with maybe two inches of
  clearance on either side. Pulling a KitchenAid counter-depth unit away from the wall to
  reach the condenser coils requires real planning. The 91792 zip sees a lot of these layouts,
  many with original cabinetry that makes rear-access repairs genuinely awkward. Newer builds
  near South Hills Country Club run larger kitchens with Sub-Zero and Thermador built-ins —
  different problem entirely, since those require proprietary service tools.

commonProblems:
  - title: "Ice Maker Failures Driven by Mineral-Heavy Tap Water"
    description: "West Covina water hardness regularly tests above 300 mg/L. That scale deposits directly
      into the ice maker assembly and the water inlet valve, restricting flow until the ice maker
      stops cycling. Samsung and LG french-door models are the most frequent offenders in this area.
      A valve swap and mineral flush usually resolves it — but ignoring it long enough means
      replacing the full ice maker assembly instead."

  - title: "Compressor Strain During San Gabriel Valley Summer Heat"
    description: "July and August regularly push West Covina into the mid-90s. Refrigerators along
      south-facing walls or in poorly ventilated kitchen corners run their condenser fan and
      compressor nearly nonstop. Bosch and KitchenAid counter-depth units have less thermal
      mass than full-depth models, so they feel the heat first. You'll hear the compressor
      cycling louder and longer before the cooling performance actually drops."

  - title: "Frost Buildup on the Evaporator Coil in Older Side-by-Sides"
    description: "The Whirlpool and Maytag side-by-sides still running in West Covina's older homes off
      Garvey Avenue and Merced Avenue often have failing defrost timers or burned-out defrost
      heaters. Ice accumulates on the evaporator coil until airflow chokes off completely — the
      fresh-food section warms up while the freezer stays cold. That temperature split is
      diagnostic. It's almost always the defrost system, not the compressor."

faq:
  - q: "How fast can you get to West Covina for refrigerator repair?"
    a: "We cover the 10 Freeway corridor regularly — West Covina is typically a 20 to 30 minute
      drive for our nearest tech. Call (323) 870-4790 before noon and we can usually make it
      out same day. Evening slots are available too if the daytime window doesn't work."

  - q: "Do you repair LG and Samsung refrigerators in West Covina?"
    a: "Both are among the top brands we see in the 91791 and 91792 zip codes. On LG units, the
      most common calls are ice maker assembly failures and linear compressor noise — LG throws
      an 'Er IF' or 'Er IS' code when the ice maker circuit goes. Samsung french-doors come in
      for water inlet valve blockages and control board issues. We stock parts for both on the van."

  - q: "What does a refrigerator repair visit actually cost?"
    a: "Diagnostic is $65, credited toward the repair if you move forward. Most common fixes —
      a defrost timer, a water inlet valve, a door gasket swap — run $150 to $280 parts and
      labor combined. Sub-Zero and Thermador repairs run higher due to proprietary parts.
      Same-day repair is common since we carry the frequent-failure parts on the truck.
      Schedule online or call (323) 870-4790."

title: "West Covina Range Hood — Duct Blockage, Motor & Grease Filter Repair"

intro: |
  Gas ranges are standard equipment in most West Covina households, particularly in the subdivisions around South Hills Country Club. Those hoods above the ranges — many of them Bosch or KitchenAid models installed during 2000s kitchen remodels — build up grease faster than homeowners expect. Once that grease bypasses the baffle filter and reaches the blower motor, the fan either gets loud or stops entirely. At that point, cleaning alone won't bring it back.

  Sub-Zero and Thermador wall-mount hoods appear more frequently in the newer construction south of Cameron Avenue and in the gated communities near Walnut Creek Road. Higher CFM ratings on those units mean problems surface faster — a stiff backdraft damper or a failing blower bearing becomes obvious within days of onset, not months.

localContext: |
  Residential blocks in zip codes 91790 and 91791 — running along Hollenbeck Street east toward Cameron Avenue — are mostly 1960s ranch-style homes with original ductwork still in place. Those four-inch or 3.25-by-10 rectangular duct runs were sized for low-CFM exhaust fans, not the 400–600 CFM hoods homeowners install today. That mismatch creates back pressure that strains the blower motor, amplifies operational noise, and shortens the motor's service life considerably.

  Zip 91792, closer to the Eastland Center shopping corridor and the Rowland Heights border, has more post-1990 builds — larger kitchen footprints, updated duct sizing, but still not immune. LA's notoriously hard water leaves calcium and mineral scale on damper blades and inside duct transitions regardless of when the home was built. Scale stiffens damper movement and eventually causes the same symptoms as a seized gasket: exhaust stays trapped, smoke rolls back into the kitchen.

  The South Hills neighborhood is a different story entirely. Split-level homes on Lark Ellen Avenue and up into the hills off Sunset Drive tend to run longer duct paths — sometimes 14 to 18 feet from hood to exterior wall cap — because of how the kitchens sit relative to exterior walls. Every extra foot of duct adds resistance. Bosch and KitchenAid hoods rated at 500 CFM can't push effectively through that kind of run, especially when a 90-degree elbow or two is involved. On top of that, many of these South Hills homes were originally built with galvanized rectangular ducting that has corroded at the joints, creating gaps where grease accumulates and airflow drops.

  The Temple Park area near Shadow Oak Drive has a concentration of 1980s-era townhome clusters and HOA-managed condos. Range hoods in those units are typically built-in under-cabinet models — Samsung, LG, or older Kenmore — that vent through shared wall assemblies. Access is tighter, and the duct path usually runs horizontally through a cabinet chase before turning vertical. That configuration collects grease at the elbow, which is one spot homeowners never think to check.

commonProblems:
  - title: "Blower Motor Failure After Grease Bypasses the Filter"
    description: "Baffle filters in Bosch and KitchenAid hoods trap grease well — but only when cleaned every four to six weeks under real cooking conditions. Skip a few rounds and grease migrates past the filter, coats the blower wheel, and works into the motor housing. Overheating follows, the thermal cutout trips, and the fan goes dead. Cleaning the filter at that stage doesn't restart it. Motor replacement is the only path forward — the blower assembly needs to come out entirely."
  - title: "Grinding or Rattling That Gets Louder Every Week"
    description: "That grinding from an LG or Samsung under-cabinet hood is almost always a cracked blower wheel rubbing the housing, or a motor bearing worn past tolerance. Both fail progressively under daily use. Waiting a month typically turns what was a $110–$120 wheel swap into a full motor assembly replacement — shaft damage accumulates from running metal against metal. Repair cost roughly doubles for every few weeks of delay."
  - title: "Backdraft Damper Seized — Fan Sounds Fine but Exhaust Goes Nowhere"
    description: "West Covina's temperature swings between summer heat and winter nights harden the rubber gaskets around exterior duct caps over time. Dampers then either freeze shut — trapping all exhaust inside the duct run — or freeze open, letting cold air and pests push back through. Thermador and Wolf hoods with 600-plus CFM ratings make this obvious immediately. Smoke stays in the kitchen no matter how high the fan runs. It's not a hood problem — it's the duct system that needs attention."

faq:
  - q: "How fast can you get to West Covina for a range hood repair?"
    a: "Service routes through the San Gabriel Valley run regularly — West Covina off the 10 or 60 Freeway is a straightforward pull from our coverage area. Call (323) 870-4790 before noon and we can usually be there same afternoon. Evening slots are open on most days."
  - q: "Do you repair Bosch and KitchenAid range hoods, or just standard brands?"
    a: "Both come up constantly on West Covina calls. On Bosch, the usual culprits are the control board or the centrifugal blower assembly. KitchenAid wall-mounts tend to fail at the motor mount bracket or grease filter guide rail. Common parts for both are stocked on the van. Samsung and LG under-cabinet models from the 91790–91791 area are frequent too — what looks like a control board fault (fan speed light flashing, no response) often turns out to be a relay or capacitor, not the full board."
  - q: "What does a range hood repair typically cost, and can you handle emergency calls?"
    a: "Diagnostic visit is flat-rate. Blower motor or control board replacements usually run $150–$350 parts and labor, depending on the model. Emergency calls get priority scheduling — call (323) 870-4790 and if a tech is already running SGV jobs that day, we can often arrive within two hours."
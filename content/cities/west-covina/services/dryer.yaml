localContext: |
  Most of the residential stock along Cameron Avenue and Lark Ellen Avenue in
  91790 dates from the late 1950s through the mid-1970s. Builders shoehorned
  laundry areas into hallway closets or converted garages, running short, bent
  exhaust ducts wherever they'd fit. That extra resistance means the heating
  element and drum roller in these homes take more punishment per load than

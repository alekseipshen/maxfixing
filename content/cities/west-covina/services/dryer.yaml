commonProblems:
  - title: "Thermal Fuse Blows Repeatedly — Old Venting Is the Real Culprit"
    description: "Triple-digit San Gabriel Valley summers force dryers to run
      hotter, and any restriction in the exhaust duct tips a marginal situation
      into a blown thermal fuse. Samsung front-loaders are especially sensitive
      — their thermistor stack is positioned close to the heat source. Replacing
      the fuse alone without clearing the duct run is a temporary fix; the fuse
      will blow again within a month."

  - title: "Loud Thumping or Squealing Through the Whole Cycle"
    description: "That rhythmic knock is almost always worn drum rollers or a
      fraying drive belt starting to slip. Bosch condensation dryers — common in
      the newer West Covina condos — have a compact roller assembly that wears
      out around year five or six. Catching it before the belt snaps saves the
      rear drum support from stress fractures, which turns a $110 fix into a
      $300 one."

  - title: "Two Full Cycles and Clothes Are Still Damp"
    description: "Extended drying almost always traces back to a degraded
      heating element or moisture sensor strips caked with dryer sheet residue.
      KitchenAid electric dryers in the 91791 zip see this pattern regularly —
      the sensor bars stop reading accurately and the machine never triggers
      shutoff. Gas models can mimic the same symptom when the igniter starts
      misfiring instead of staying lit through the cycle."


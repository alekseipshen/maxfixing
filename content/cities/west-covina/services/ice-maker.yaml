title: "West Covina Ice Maker — Hard SGV Water Kills Fill Valves Fast"

intro: |
  San Gabriel Valley Municipal Water District delivers water into West Covina at 350-450 ppm hardness — some of the highest readings in LA County. That mineral load hits fill valves relentlessly. A KitchenAid french-door in a 91791 home will start producing cloudy, misshapen cubes within a few years before stopping completely, calcium scale slowly choking the water inlet valve until nothing passes through. Most homeowners assume the unit failed. The real culprit is dissolved minerals from the San Gabriel groundwater basin — and it hits West Covina harder than most of the valley.

localContext: |
  West Covina's housing stock runs mostly 1960s-1980s ranch construction — three-bedroom homes on streets like Azusa Avenue and Cameron Avenue where original plumbing lines carry decades of mineral deposit buildup. Zip code 91790 skews older, with kitchens that often have tighter cabinet clearances complicating service access. Newer builds near Galster Wilderness Park in 91791 tend to run Samsung and LG french-doors with integrated assemblies that need brand-specific diagnostic tools. The south side of West Covina, toward the 60 freeway corridor, has seen more recent construction — Bosch and KitchenAid models show up often in those 2000s builds, and they bring their own quirks. Service vans reach 91792 along Citrus Street without much trouble, usually well within the hour.

commonProblems:
  - title: "Calcium Scale Choking the Water Inlet Valve"
    description: "West Covina's hard water deposits mineral buildup inside the water inlet valve screen faster than most coastal cities see. The screen clogs, pressure to the unit drops, and production slows to a trickle before stopping entirely. LG and Samsung models with dual systems — one in the freezer drawer, one in the door — have two separate valves exposed to this problem, doubling the failure points. On Samsung RF-series refrigerators, the symptom is either an error code on the display or just a completely empty bin after 24 hours with the machine running normally. Pulling the valve and finding the screen packed solid with white calcium deposits — that's a West Covina signature repair."

  - title: "Frozen Fill Line Between Wall Stub-Out and Ice Maker Assembly"
    description: "Refrigerator cycling normally but zero ice dropping — that's usually a frozen water supply line between the wall stub-out and the assembly. Happens in 91792 homes where AC runs hard all summer, creating temperature swings inside wall cavities. Bosch counter-depth models sit flush to the wall, which makes that fill line especially vulnerable to the freeze-thaw cycle. The fix isn't just thawing the line — it's repositioning or adjusting the freezer set point down a degree to prevent refreezing. Skipping that last step means the same call in three months."

  - title: "Harvest Thermostat Failure Stalling the Cycle Mid-Batch"
    description: "Ice forms in the mold but never releases — that's a failed harvest thermostat. This component signals the machine when a batch is frozen solid and ready to drop. Without it, cubes stack against the ejector arm and jam the whole mechanism. KitchenAid and Sub-Zero built-ins both rely on this part, and Sub-Zero's version requires recalibrating the control board after replacement. In West Covina homes where Sub-Zero units are running in warm kitchens through August, this thermostat sees more thermal stress than average."

faq:
  - q: "How fast can you get to West Covina for an ice maker repair?"
    a: "Covering 91790, 91791, and 91792 from the San Gabriel Valley route — usually on-site within 1-2 hours same-day. Residential streets here are easy to navigate with a service van. Call (323) 870-4790 to check today's availability and lock in a slot."

  - q: "Do you repair Samsung and KitchenAid ice makers, or only standard brands?"
    a: "KitchenAid, Samsung, LG, Bosch, and Sub-Zero — all regularly serviced in West Covina. Samsung french-doors most often need a water inlet valve or assembly swap. KitchenAid issues here typically trace to the harvest thermostat or a mineral-packed fill line."

  - q: "What does an ice maker repair cost, and is same-day service available?"
    a: "Most repairs run $150-$350 in West Covina. Water inlet valve replacements land on the lower end; control board swaps run higher. Same-day and evening slots are open — call (323) 870-4790 or schedule online. Diagnosis is included when we complete the repair."

  - q: "Will a whole-house water filter reduce how often my machine breaks down?"
    a: "A standard refrigerator filter slows the buildup but doesn't stop it. At 350-450 ppm hardness, SGV water overwhelms most inline filters within 3-4 months. Homeowners in West Covina's 91791 zip who added a whole-house softener report noticeably fewer repeat fill valve failures. Still, if the valve or inlet screen is already clogged, no filter clears it — the parts need to come out and be serviced. Worth the investment if you've replaced the same component twice in three years."
title: "West Covina Ice Maker — Hard Water, Hot Summers, Dead Ice Makers"

intro: |
  Galster Wilderness Park sits just north of Garvey Avenue. The neighborhoods around it tell a familiar story: 1960s ranch homes now fitted with modern LG french-door refrigerators. Those fridges were never designed for San Gabriel Valley water. Municipal water tests in 91791 regularly hit 230 ppm hardness. That's enough to clog a water inlet valve in under two years. The mineral load hits ice maker parts hard — long before anyone notices the bin running low.

localContext: |
  Most of West Covina's housing went up between 1955 and 1975. Ranch-style and split-level homes off Azusa Avenue and Sunset Avenue fill zip codes 91790 and 91792. Kitchens in those homes were built for 30-inch refrigerators. Squeezing in a modern KitchenAid counter-depth or Samsung french-door unit means tight clearance and longer supply line runs through walls that were never built with refrigerators in mind. Those routing details matter the moment ice production drops.

  Newer builds near Cameron Avenue and Hollenbeck Street are a different story. Bosch integrated columns and KitchenAid french-door units with dedicated ice maker assemblies are common there. More clearance — same hard water problem. Summer in the San Gabriel Valley brings 95°F heat from July through August. Three solid months of near-maximum duty for any ice system. Compressors run hot. Fill valves cycle constantly. Scale that might take two years elsewhere can build up in a single summer here.

commonProblems:
  - title: "Fill Valve Calcification — What 230 ppm Water Does to an Ice Maker"
    description: "San Gabriel Valley water deposits calcium and magnesium inside the water inlet valve. Flow drops to a trickle, then stops. LG models usually throw an IM ERR or 1E code before production halts. Most fill valve failures in West Covina hit between 18 and 36 months after install — right after warranty coverage runs out. Replacing the valve takes about 45 minutes, assuming the supply line itself isn't fouled with scale. On Bosch units, scale also gets into the inlet screen behind the solenoid. Reaching it means pulling the back panel — not a DIY-friendly repair."
  - title: "Frozen Supply Lines Inside Pre-1970 West Covina Walls"
    description: "Older homes in the 91790 zip code often route supply lines through exterior or garage-facing walls with little insulation. Even a mild January cold snap can freeze the tube solid. Samsung french-door models are especially vulnerable — the line threads through the door hinge assembly itself. Thawing it correctly means full door disassembly. Skip a proper reroute and the same freeze comes back next winter. A frozen line also puts back pressure on the water inlet valve solenoid, sometimes cracking the valve body with no visible damage on the outside."
  - title: "Ice Level Sensor Failures on KitchenAid French-Door Units"
    description: "KitchenAid french-door refrigerators in West Covina's newer builds near Big Dalton Avenue show a clear pattern: the optical ice level sensor misreads bin fill and kills production while the bin is still half-empty. Not the fill valve. Not the supply line. It's a sensor module failure. Part numbers vary by production year, and generic replacements usually quit again within a few weeks. OEM KitchenAid sensor modules are the only fix that holds — and they need to be calibrated to the specific ice maker assembly already installed in the unit."

faq:
  - q: "How fast can you get to West Covina for ice maker repair?"
    a: "The 10 freeway makes West Covina a straight shot — usually 30 to 45 minutes from our nearest technician depending on traffic. Same-day slots open most mornings. Call (323) 870-4790 before noon and we can usually be there the same day, sometimes within 2 hours."
  - q: "Do you repair KitchenAid, Samsung, and LG ice makers in West Covina?"
    a: "All three are among our most common calls in the area. KitchenAid sensor module and ice maker assembly swaps, Samsung door-line freeze-ups and fill valve failures, LG water inlet valve calcification — we stock parts for all of them. Bosch units come up too, no problem. Have a Sub-Zero or Thermador with a built-in ice system? Call ahead and we'll confirm part availability before scheduling."
  - q: "What does ice maker diagnosis and repair typically cost?"
    a: "Diagnostic is $75 and applies toward the repair if you proceed. Fill valve replacements run $140–$220 depending on brand. Sensor module swaps on KitchenAid units land closer to $180–$260. If an evaporator coil freeze-up is involved — common when a defrost timer or thermal fuse has also failed — you'll get the full scope before we touch anything. Evening slots available most weekdays. Call (323) 870-4790 to check same-day availability."


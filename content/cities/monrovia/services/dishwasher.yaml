title: "Monrovia Dishwasher Repair — Hard Water & Foothill Service"

intro: |
  Myrtle Avenue's historic storefronts give Monrovia its small-town character,
  but the kitchens in those Craftsman bungalows off Norumbega Drive deal with
  something less charming: San Gabriel Valley hard water. Calcium deposits clog
  spray arms and float switches faster here than in coastal neighborhoods. That
  white film on your glasses isn't weak detergent — it's mineral scale doing
  what it always does in the 91016.

localContext: |
  The 91016 zip spans housing built across six decades — 1920s bungalows near
  the Monrovia Historical Museum on Primrose Avenue, post-war ranches along
  Shamrock Avenue, and 1980s townhomes closer to Huntington Drive near the
  210 freeway. Old Town Monrovia is the most active renovation zone; those
  restored Craftsman kitchens get new Bosch 300-series and KitchenAid built-ins
  dropped into plumbing that was never spec'd for modern dishwasher inlet valve
  pressure. The inlet valve strainer screens clog with sediment, restricting
  fill and triggering false error cycles. North of Foothill Boulevard, closer
  to Monrovia Canyon Park, the homes sit on older copper supply lines with
  even heavier mineral deposits — the float switch in those kitchens sees scale
  buildup at twice the rate. The control board on a Bosch SHPM88Z75N reads
  differently from a KitchenAid KDTM354, and misreading the error code is how
  a repair turns into two visits. Monrovia's Gold Line station at Myrtle and
  Primrose makes this neighborhood a fast service run from our Valley routes —
  we're usually on Foothill Boulevard within 90 minutes of a call.

commonProblems:
  - title: "Spray Arm and Filter Assembly Blocked by Hard Water Scale"
    description: >
      San Gabriel Valley tap water regularly tests above 300 ppm hardness.
      That calcium accumulates inside spray arm nozzles and around the float
      switch, triggering false drain cycles or leaving dishes film-coated after
      a full wash. On Bosch 300-series units, all three spray arm levels —
      upper, middle, and lower — need clearing before an E24 error stops
      coming back. The filter assembly underneath collects the overflow debris;
      skip cleaning it and the spray arm clogs again within weeks. A descaling
      treatment alone rarely holds longer than a few months in the 91016.

  - title: "Drain Pump Burnout in Older Monrovia Plumbing"
    description: >
      Post-war ranches and pre-1940s bungalows near Norumbega Drive sometimes
      have partial undersink blockages that force a dishwasher's drain pump to
      work against back pressure it wasn't built to handle. Samsung DW80-series
      units showing an LC or OC error code are usually the victim of exactly
      this. Swapping the drain pump without inspecting the drain line and the
      check valve is a short-term fix — the replacement drain pump burns out
      the same way within months. We also verify the drain hose high-loop
      routing, which original installers in older 91016 kitchens frequently
      skipped, and test the heating element output while we're already inside.

  - title: "Door Latch Assembly and Detergent Dispenser Failures on KitchenAid"
    description: >
      KitchenAid built-ins in Monrovia's renovated Old Town Craftsman kitchens
      get hard daily use. The door latch assembly typically wears out between
      years five and seven, and when it does, the detergent dispenser solenoid
      often stops firing mid-cycle — dishes come out with soap residue still
      caked in the cup. Both parts usually fail together. Replacing only the
      door latch assembly and leaving a marginal solenoid means a callback in
      two months. One visit, both parts, done.

faq:
  - q: "How fast can you get to Monrovia for dishwasher repair?"
    a: >
      Monrovia is a straight shot down Foothill Boulevard from our San Gabriel
      Valley routes — usually there within 2 hours of your call. Evening
      slots available most weekdays. Call us at (323) 870-4790 or schedule
      online for same-day service.

  - q: "Do you repair Bosch and KitchenAid dishwashers in this area?"
    a: >
      Those are the two we see most in Old Town Monrovia and the surrounding
      91016. Common Bosch jobs: E24/E25 drain errors, clogged spray arms, and
      control board replacements. On KitchenAid, it's usually the door latch
      assembly, heating element, or a stuck detergent dispenser solenoid. LG
      and Samsung units are no problem either — we stock drain pumps and inlet
      valves for the DW80 series on the van.

  - q: "What does dishwasher repair typically cost in Monrovia?"
    a: >
      Diagnosis runs $75, credited toward the repair. Drain pump or heating
      element replacements usually land between $150 and $280 parts and labor.
      Bosch and KitchenAid parts cost more than Whirlpool or GE equivalents —
      we stock the common ones so most repairs finish same-day, no second trip.
      Call (323) 870-4790 to confirm part availability before we head out.
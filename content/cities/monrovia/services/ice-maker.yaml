title: "Monrovia Ice Maker Repair — Hard Water Fixes for 91016"

intro: |
  The 210 Freeway corridor through Monrovia sits right over the San Gabriel
  Basin aquifer — and that water tests 260–320 ppm for dissolved minerals most
  of the year. That's enough calcium to choke a water inlet valve inside 18
  months of daily use. The KitchenAid and LG french-door refrigerators popular
  in the Craftsman neighborhoods off Myrtle Avenue are especially vulnerable:
  production slows, then stops entirely, and most homeowners assume the whole
  unit is failing when it's usually one clogged component.

  Monrovia's older housing stock compounds the issue. A lot of calls from 91016
  involve galvanized supply lines that were never meant to feed a modern
  refrigerator — and the combination of corroded pipe plus hard water accelerates
  part failure faster than any spec sheet accounts for.

localContext: |
  Homes in 91016 — particularly the 1920s–1940s bungalows around Magnolia
  Avenue and the 1960s ranch tracts east toward the Arcadia border — were
  built with supply plumbing that predates modern refrigerator hookups entirely.
  Galvanized segments still feeding newer Samsung and Bosch built-ins introduce
  rust particulates directly into the fill line. That combination of old pipe and
  hard water ages fill valves and ice maker assemblies two to three times faster
  than manufacturer specs assume.

  The hillside streets above Foothill Boulevard tell a different story. Up there,
  Monrovia homes often have Sub-Zero or Thermador built-ins tucked into custom
  cabinetry — appliances that need brand-specific tools to service properly. Tight
  cabinet clearances mean a routine valve swap can take twice as long as the same
  job in a tract home with a freestanding unit. Sub-Zero's modular tray assembly,
  in particular, requires pulling the entire freezer drawer to access — not a quick
  job, but one we've done enough times in this part of Monrovia to do it right
  the first time.

commonProblems:
  - title: "Fill Valve Calcification from San Gabriel Basin Hard Water"
    description: |
      Monrovia tap water deposits calcium carbonate inside the water inlet valve
      faster than almost anywhere else in LA County. On LG InstaView and
      KitchenAid built-in models, the fill valve orifice narrows until water flow
      drops below the threshold the module needs to cycle. You get small, hollow
      cubes first — then nothing. A new OEM fill valve and a line flush usually
      resolves it in one visit. Worth noting: KitchenAid models built before 2018
      use a single-port inlet design that restricts more quickly — homeowners
      with older units in 91016 should expect this repair sooner than the
      appliance age might suggest.
  - title: "Frozen Supply Tube Behind Older 91016 Refrigerators"
    description: |
      In Monrovia's Craftsman-era homes, refrigerators often back against exterior
      walls with minimal insulation. The plastic supply tube feeding the unit passes
      near the evaporator coil and can freeze solid, especially on Samsung
      french-door models where the tube routing runs uncomfortably close to the
      rear evaporator panel. The fix requires pulling the unit, thawing the line,
      and rerouting or insulating the tube before reinstalling the ice maker
      assembly. Usually a two-hour job on-site.
  - title: "Ice-Level Sensor Failure on KitchenAid and Bosch Built-Ins"
    description: |
      Premium refrigerators in the hillside homes near Monrovia Canyon Park often
      run KitchenAid or Bosch built-in columns. Both use optical sensors to detect
      when the bin is full. Hard water vapor inside the freezer leaves a mineral
      film on the sensor lens — the unit reads "full" and stops producing entirely.
      Most of the time the sensor just needs cleaning; occasionally the sensor
      assembly needs replacing outright. Samsung models in this area sometimes
      display error code 14E for the same root cause — mineral film on the optical
      harness rather than an actual component failure.

faq:
  - q: "How fast can you get to Monrovia for ice maker repair?"
    a: |
      From our San Gabriel Valley base, Monrovia is typically 20–30 minutes
      depending on the 210. We cover 91016 and 91017 with same-day slots most
      weekdays — call (323) 870-4790 before noon and we can usually be there that
      afternoon. Evening slots are available for calls that come in after hours.
  - q: "Do you repair KitchenAid, Samsung, and LG ice makers in this area?"
    a: |
      Yes — those three brands make up the bulk of our calls in the 91016 zip.
      We carry fill valves, water inlet valve kits, and sensor assemblies for
      KitchenAid and LG in the van. Samsung french-door modules we typically have
      within 24 hours if not on hand. Bosch built-ins are handled as well. For
      Sub-Zero and Thermador units in Monrovia's newer hillside builds, we stock
      the drain tube heater and inlet valve parts that fail most often in Southern
      California's hard-water conditions.
  - q: "What does ice maker repair usually cost, and how does the process work?"
    a: |
      Diagnostic is done on-site; we quote before any repair starts. Fill valve
      swaps and sensor replacements typically run $130–$220 in Monrovia. Module
      replacements on premium brands run $240–$340. Most repairs wrap in a single
      visit — we'll tell you upfront if a parts order is needed so you're not
      waiting around. Evening and emergency slots are available — schedule online
      or call (323) 870-4790.
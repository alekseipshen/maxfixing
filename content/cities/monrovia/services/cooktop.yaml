title: "Monrovia Cooktop — Foothill Heat, Hard Water, Same-Day Repair"

intro: |
  Foothill heat in Monrovia runs long — June through October, temperatures near
  Myrtle Avenue regularly push past 95°F, and gas cooktops cycle harder than they
  do in coastal neighborhoods. That sustained heat warps burner caps and accelerates
  gas valve wear faster than most homeowners expect. Bosch and KitchenAid units
  hold up better than budget brands, but they still need service. Induction cooktops
  draw steady high current through the summer months, which stresses control boards
  in ways that don't show up until fall. Call (323) 870-4790 — we're in the
  91016 area most weekdays with same-day slots available.

localContext: |
  Zip code 91016 is a mix of 1920s–1930s Craftsman bungalows, post-war ranch
  homes from the 1950s and 1960s, and newer builds pushing up toward the foothills
  near Monrovia Canyon Park. Original electrical panels in those older homes
  weren't designed for high-draw induction cooktops — some kitchens still run
  100-amp service. Gas fittings in pre-1960 houses corrode at the flex connector
  and shut off flow intermittently. Tight galley kitchens in the central
  neighborhoods mean pulling the cooktop for underside access takes planning.
  The hillside streets off Canyon Boulevard tend to have the larger lots and
  kitchen remodels — that's where Thermador and Sub-Zero setups appear. Monrovia's
  water hardness sits above 280 ppm consistently, which accelerates mineral fouling
  on every cooktop type, gas or induction.

commonProblems:
  - title: "Igniter Won't Spark — Mineral Buildup on Electrode Tips"
    description: |
      Monrovia tap water tests above 280 ppm calcium carbonate across most of
      91016. That mineral load coats the igniter electrode on gas cooktops and
      packs the burner ports solid over a few years. A Bosch five-burner starts
      clicking continuously — or stops clicking altogether — and won't catch a
      flame. Electrode cleaning plus a port flush fixes it most of the time.
      If the spark module itself has shorted from prolonged fouling, that's a
      parts replacement. On Samsung gas cooktops we also see the igniter wiring
      harness degrade near the burner box — the connector corrodes and intermittent
      sparking starts, then stops entirely. That's a harness swap, not a module.

  - title: "Cracked Ceramic Glass on Induction Units"
    description: |
      KitchenAid and Samsung induction cooktops use tempered ceramic glass
      bonded directly over the heating element coils. Drop a cast-iron skillet
      from six inches and the panel can crack straight through the active zone —
      sometimes the cooktop still runs, sometimes it throws an error code and
      locks out. Moisture getting under a cracked panel reaches the control board
      fast. We stock replacement glass panels for the KitchenAid 36-inch models
      common in Monrovia kitchens. LG induction units — the slide-in range version
      especially — show a different failure: the power relay on the control board
      burns out and the unit displays an F9 or LE error before shutting off entirely.
      Board replacement on that model runs about 90 minutes on-site.

  - title: "Thermador Star Burner — Weak Flame, Partial Ring Ignition"
    description: |
      Thermador cooktops show up in the hillside homes off Norumbega Drive and
      the larger lots near Canyon Boulevard. When a Star Burner only lights on
      half the ring or runs at low flame on the high setting, the burner cap's
      recessed ports are clogged with grease and mineral scale — or the gas valve
      is partially sticking. Thermador's cap geometry traps debris differently
      than standard grates. A thorough cap clean or valve swap usually runs
      45 minutes on-site. Gas pressure also matters — Monrovia homes with older
      flex connectors occasionally show under-pressure symptoms that mimic a
      dirty cap. We check line pressure at the valve before pulling parts.

faq:
  - q: "How fast can you get to Monrovia for cooktop repair?"
    a: |
      Monrovia is on our regular San Gabriel Valley route — typically 25 to 35
      minutes from dispatch depending on traffic on the 210. Same-day slots open
      most days. Call (323) 870-4790 in the morning and we can usually confirm
      an afternoon window the same day.

  - q: "Do you repair Bosch, KitchenAid, and Thermador cooktops?"
    a: |
      Yes — those three are the most common service calls we run in Monrovia.
      Bosch: spark module replacements and burner valve issues. KitchenAid:
      control board faults and ceramic panel swaps. Thermador: Star Burner
      cleaning and gas valve replacements. Parts for all three ride on the truck.
      LG and Samsung induction units come up frequently too — control board
      failures and cracked glass panels are the usual issues on those.

  - q: "What does a cooktop repair typically cost, and is same-day service available?"
    a: |
      Diagnostic visit is $75, credited toward the repair if you proceed.
      Most cooktop fixes — igniter swap, gas valve replacement, ceramic panel
      install — land between $150 and $380 depending on parts. Evening and
      same-day slots are available most of the week. Reach us at (323) 870-4790
      to check availability for 91016.
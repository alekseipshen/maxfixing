  - q: "Do you repair KitchenAid and Bosch double ovens specifically?"
    a: |
      Those are the two brands we see most in Monrovia kitchens. We also service Samsung and LG double ovens, plus Thermador and Wolf units in the higher-end renovations closer to the Arcadia border. Most common parts for these brands ride along in the van already.


title: "Monrovia Double Oven Repair — Hillside to Old Town, 91016"

intro: |
  Huntington Drive splits Monrovia into two appliance eras. Older blocks near Lemon Ave
  still have basic kitchens or 1990s upgrades. Head north toward Monrovia Canyon Park
  and the story changes — hillside homes gut-renovated between 2012 and 2018, most
  landing KitchenAid and Bosch wall ovens in custom cabinet cutouts. Those units
  are 8-12 years old now — exactly the age when one cavity stops heating or the control
  board starts throwing fault codes mid-roast.

localContext: |
  Zip 91016 covers most of Monrovia's residential grid. There are 1920s Craftsman bungalows near
  Duarte Road, post-war ranch homes along Shamrock Ave, and hillside streets above
  Foothill Boulevard that saw heavy renovation starting around 2010.

  Those renovations pushed Samsung and Thermador wall ovens into tight, custom cabinet cutouts.
  Tight clearance matters when a door hinge snaps or a bake element needs replacing — pulling
  the unit safely takes more care and adds time compared to a freestanding range. Access alone
  can add 20 minutes to a job that's otherwise quick.

commonProblems:
  - title: "Upper Cavity Dead, Lower Oven Still Running"
    description: |
      Each compartment runs its own heating circuit — separate bake element, separate thermal fuse,
      separate temperature monitoring loop.

      Upper cavity stops while the lower keeps running? That's almost always the upper bake element
      burning out, or occasionally a blown thermal fuse on that circuit. Samsung wall units with the
      black glass touchpad hit this failure pattern around year 10-12. Tight cabinet access in
      hillside homes slows extraction by 15-20 minutes, but the repair itself takes under 30 minutes
      once the unit is clear. Common Samsung elements are stocked in the van.

  - title: "50-Degree Variance Between Compartments — Sensor Wearing Out"
    description: |
      Running 50 degrees hotter in one compartment than the other isn't a quirk — it's a sensor
      failing.

      The most common cause is a degraded oven temperature sensor; less often a thermostat that's
      drifted out of calibrated range. Bosch units in 91016 show this pattern around year 8-10. The
      upper cavity sensor wears faster because of its position near the convection fan — tighter
      heat cycling. Recalibrating or replacing that sensor brings both chambers back into spec. No
      need to touch the control board in most cases.

  - title: "F-Code on Display, Touchpad Locked — Control Board Failure"
    description: |
      KitchenAid wall ovens don't fail quietly. F1, F3, and F7 codes on the display all point to
      the main control board starting to give out.

      The glass touchpad stops registering input, or the display cycles errors at startup. Sometimes
      the whole unit locks mid-bake. Thermador ovens show similar patterns when the board fails.
      Diagnosis follows the same sequence: power cycle test, relay continuity check, wiring harness
      inspection, board voltage test. Common control boards for the KitchenAid models prevalent in
      Monrovia are stocked in the van.


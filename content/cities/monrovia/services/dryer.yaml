title: "Monrovia Dryer — Foothills Heat Blows Fuses Fast"

intro: |
  That stretch of craftsman bungalows along Lime Avenue tells you everything about
  Monrovia's laundry situation — 1920s homes with laundry hookups added decades
  later, cramped exhaust runs, and a Samsung or LG gas dryer shoved into a closet
  that was never meant to hold one. Summer temperatures at the base of the San
  Gabriel Mountains push dryers into overdrive. Thermal fuses don't last long in
  those conditions. We're in the 91016 zip most days of the week.

localContext: |
  The older craftsman blocks near Old Town Monrovia (91016) have the tightest laundry
  setups — short flex ducts, minimal clearance, no room to maneuver. Even the
  post-war ranches off Hillcrest Boulevard weren't built with modern full-size dryers
  in mind. Add San Gabriel Valley hard water to the mix, and moisture sensors and
  inlet valves get coated with mineral scale faster than you'd expect. It's a common
  combination: restricted airflow plus hard water, and the dryer starts losing a fight
  on two fronts simultaneously.

commonProblems:
  - title: "Thermal Fuse Keeps Blowing — Venting Is the Real Problem"
    description: "Short or kinked exhaust ducts trap heat inside the drum until the thermal
      fuse trips — and the dryer stops heating entirely. On LG DLG-series gas dryers,
      which are everywhere in 91016, this is the most common call. Replacing the fuse
      alone without fixing the duct just means another blown fuse in three months. We
      address both in the same visit."
  - title: "Drum Not Spinning — Drive Belt and Roller Failure"
    description: "You hear the motor running but the drum sits still. That's a snapped drive
      belt, usually paired with a worn drum roller. Samsung DV electric models are
      prone to this when lint buildup creates drag. In Monrovia's older rentals where
      lint trap maintenance was irregular, we see belt and belt-tensioner failures
      together. Same-day fix with parts on the van."
  - title: "Takes Forever to Dry — Moisture Sensor Coated with Scale"
    description: "Monrovia's hard tap water deposits minerals directly onto the moisture sensor
      bars inside the drum. The dryer misreads humidity and either runs twice as long
      or cuts the cycle short. KitchenAid and Bosch condensation dryers are especially
      sensitive to this. A thorough sensor cleaning restores accurate cycle timing —
      no parts needed, just the right solvent and 15 minutes."


title: "Monrovia Refrigerator — Valley Heat, Hard Water, Fast Fixes"

intro: |
  Tight Craftsman kitchens near Myrtle Avenue in Old Town weren't built for 36-inch
  french-door units — the condenser barely gets airflow, especially in a south-facing
  room. On top of that, SGV tap water running through 91016 pipes tests above 300 mg/L
  hardness, and it grinds through ice maker assemblies in KitchenAid and Samsung models
  faster than most homeowners expect. That combination keeps us busy in Monrovia year-round.

localContext: |
  The 91016 zip has a real mix — 1920s bungalows near downtown Monrovia, postwar
  ranch homes from the 1950s and 60s spreading east into 91017, plus newer builds
  up toward Monrovia Canyon Park. Older kitchens sometimes have original cabinetry
  that makes pulling a counter-depth unit a legitimate job on its own. Sub-Zero and
  Thermador built-ins appear more frequently on the hillside streets where lot sizes
  get bigger. Narrow side-yard access on older parcels means service van parking
  takes planning too.

commonProblems:
  - title: "Ice Maker Assembly Failure from Mineral Deposits"
    description: "San Gabriel Valley water calcifies the water inlet valve screens first,
      then the ejector arm seizes mid-cycle. LG french-door models show an IE error code;
      Samsung units just stop producing ice entirely. Rebuilt inlet valve kits fix most of
      these without needing a full ice maker assembly swap — though sometimes you need both."

  - title: "Compressor Cycling Nonstop Through Summer Heat"
    description: "August highs in Monrovia sit around 97°F, and a refrigerator in a
      warm kitchen runs its compressor nearly nonstop. The condenser fan motor is usually
      the first casualty — it burns out under sustained load before the compressor itself
      fails. A grinding hum from the back of the unit is the giveaway. Catch it early
      and the repair is straightforward."

  - title: "Evaporator Coil Frost Buildup on Pre-2012 Models"
    description: "Older Bosch and KitchenAid units with a failing defrost timer let frost
      accumulate on the evaporator coil until cold air can't circulate. The freezer looks
      normal but the fridge compartment climbs to 50°F. Most homeowners assume the thermostat
      is broken — it's almost always the defrost heater or timer that needs replacing."

faq:
  - q: "How fast can you get to Monrovia for refrigerator repair?"
    a: "The 210 is our main artery — from Pasadena or Arcadia we're typically in Monrovia
      within 60-90 minutes. Call (323) 870-4790 and we'll confirm availability. Same-day
      morning slots fill fast, but afternoon windows are usually open."

  - q: "Do you repair Samsung and LG refrigerators in Monrovia?"
    a: "Samsung and LG are the most common calls in the 91016 zip. Typical fixes: water
      inlet valve on Samsung side-by-sides, ice maker assembly on LG french-doors, and
      control board resets for error codes like 1E or 22E. Parts for both are usually
      on the van."

  - q: "What does refrigerator repair cost in Monrovia, and how urgent can you come?"
    a: "Diagnosis is free when you book a repair. Condenser fan replacement runs
      $130-185 labor and parts combined. Sub-Zero and Thermador built-in work is more —
      call (323) 870-4790 for an honest estimate. Emergency and evening slots are available
      when a full fridge of food is at stake."
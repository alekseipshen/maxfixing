title: "Monrovia Washer Repair — Hard Water Off the San Gabriels"

intro: |
  The Craftsman bungalows near Primrose Avenue sit on aging supply lines that
  funnel some of the hardest mineral water in the San Gabriel Valley straight
  into the inlet valve of your washer. That Samsung front-loader running three
  loads a week in a tight utility closet off the kitchen doesn't stand a chance
  without regular attention. Drain errors, spin failures, door lock faults —
  Monrovia washers work hard and the local water does them no favors.

localContext: |
  The 91016 zip covers a dense belt of 1920s–1940s Craftsman stock plus 1960s
  ranch homes closer to Foothill Boulevard, most with laundry closets that
  weren't designed for today's larger-drum machines. Drum bearing swaps and
  shock absorber replacements take extra disassembly time in these setups —
  tight access, old subfloors that sit slightly uneven. The 91017 side near
  Monrovia Canyon Park runs newer but stack units in townhomes there create
  their own access problems for any serious repair job.

commonProblems:
  - title: "Mineral Scale Destroying the Water Inlet Valve"
    description: >
      San Gabriel Valley water is among the hardest in greater LA, and Monrovia
      is no exception. Calcium deposits clog the water inlet valve screens
      within two to three years in these homes, causing slow-fill cycles or
      complete no-fill errors. Bosch and LG front-loaders are especially
      sensitive — their valves run tighter tolerances and often fail silently
      before any error code appears on the display.
  - title: "Drum Bearing Wear from Uneven Subfloors"
    description: >
      Loud grinding during the spin cycle, or a machine that walks three inches
      across the floor mid-load — that's a worn drum bearing. The 1950s ranch
      homes in 91016 commonly have concrete subfloors that shifted over decades,
      and that slight lean accelerates bearing wear significantly. Samsung HE
      units in these homes routinely need drum bearing replacement inside six to
      eight years of regular use.
  - title: "Drain Pump Clogs From Hard-Water Lint Buildup"
    description: >
      Hard water makes lint clump differently than it does in softer-water
      cities. In Monrovia homes with older supply lines, sediment mixes with
      lint and jams the drain pump impeller mid-cycle, leaving standing water in
      the drum. KitchenAid top-loaders show this as an abrupt stop with no spin.
      The pump itself isn't always dead — a thorough cleaning plus impeller
      inspection solves it more often than not.

faq:
  - q: "How fast can you get to Monrovia for a washer repair?"
    a: >
      From our San Gabriel Valley base, Monrovia runs 20–35 minutes depending
      on the 210 interchange. Same-day slots are open most weekdays — call
      (323) 870-4790 before noon and we can usually be there that afternoon.
      Evening appointments available on request.
  - q: "Do you repair Bosch and LG front-load washers in Monrovia?"
    a: >
      Yes — Bosch, LG, and Samsung are the three we see most in this zip code.
      Typical jobs: LG door lock assembly failures, Bosch drain pump blockages,
      Samsung control board faults after a power surge. Parts for all three are
      on the van.
  - q: "What does a washer repair call cost, and how do same-day visits work?"
    a: >
      Diagnostic is $75, credited toward the repair if you move forward. Most
      drain pump and drum bearing jobs fall between $180–$320 parts and labor.
      Same-day emergency visits carry no premium — just call (323) 870-4790
      or book online and we'll confirm a window within the hour.

title: "Monrovia Range Hood Repair — Old Town Kitchens to Hillside Homes"

intro: |
  That KitchenAid chimney hood over the gas range in your Old Town Monrovia Craftsman was built to move serious CFM — until it can't. Blower wheel seizes, grease filter runs clogged for a season, and suddenly smoke sits at ceiling level after a stir-fry. Monrovia's older kitchen layouts — tight duct runs, walls that were never designed for ventilation retrofits — make these repairs more involved than in a newer tract home. The chimney section on wall-mount hoods also hides wiring connections that corrode faster in kitchens with heavy steam cooking. We pull the canopy, check the junction, and replace what's failed — not just what's obvious. We work through it.

localContext: |
  Most range hoods in 91016 sit in homes built between 1920 and 1965, where original kitchen layouts leave limited clearance above the range and short duct runs that plug up fast. Grease accumulates in horizontal duct sections — a common layout in these older kitchens — and eventually restricts airflow enough that the motor strains on every cycle. North Monrovia, closer to the San Gabriel Mountains foothills, trends newer — island hoods, longer duct routes, more grease accumulation per foot of run. In 91017, Bosch and Thermador ventilation systems show up regularly in remodeled kitchens along Hillcrest Boulevard and the newer builds near Myrtle Avenue, and those brands need the right parts, not generic substitutes. Thermador's telescoping downdraft units in particular require brand-specific blower assemblies — aftermarket parts don't seat correctly and vibrate at high speed.

commonProblems:
  - title: "Blower Motor Burnout in Craftsman-Era Kitchens"
    description: |
      KitchenAid wall-chimney hoods installed during 2000s renovations in Monrovia's Historic District see heavy daily use over gas burners. The blower motor in these units typically burns out after 8-12 years — faster when the baffle filter goes uncleaned for seasons. You'll notice the hood runs louder than usual, then starts cutting out mid-cycle before it stops moving air entirely. Motor replacement takes about 90 minutes in a standard wall-cabinet setup, and we stock the mounting brackets specific to KitchenAid's chimney configurations. The capacitor on the motor circuit also fails on older units — a $25 part that gets skipped in generic repairs and causes the replacement motor to burn out just as fast.
  - title: "Grease Filter Saturation and Blower Wheel Contamination"
    description: |
      Gas cooking in Monrovia homes pushes a lot of airborne grease through the hood. Bosch baffle filters saturate faster than most owners expect, and once they're past dishwasher-cleaning territory, grease migrates into the duct and coats the blower wheel directly. Airflow drops, the motor starts laboring audibly, and you're looking at a filter swap plus full blower cleaning before the unit runs right again. On Bosch 800 Series hoods, a clogged blower wheel also triggers the internal thermal cutout — the hood shuts off and won't restart until it cools down, which homeowners usually mistake for a control board failure. It isn't. Clean the wheel, reset the thermal cutout, and the unit runs fine.
  - title: "Duct Disconnection and Recirculation in Hillside Retrofits"
    description: |
      North Monrovia homes retrofitted with island hoods sometimes have duct transitions that weren't done correctly — flex duct where rigid should be, or a wall cap that's vibrated loose over time. Samsung and LG hoods in these setups run fine electrically but vent straight back into the kitchen. The exhaust smell from gas burners and the persistent grease film on nearby cabinet faces are usually the first signs. Every service call we run includes a full duct inspection from hood collar to exterior termination cap — because repairing the hood without confirming the duct is intact just restores a system that still doesn't work.


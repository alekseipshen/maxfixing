title: "South Pasadena Refrigerator — Craftsman Kitchens, Hard Water, Fast Fix"

intro: |
  Fair Oaks Avenue cuts through South Pasadena's core past 1920s craftsman bungalows where the original kitchens were built for an icebox, not a modern french-door refrigerator. Getting that Bosch counter-depth unit through a 32-inch doorway with the hinges pulled — that's a real job we've done twice on the same block near Meridian Street. San Gabriel Valley tap water runs 280+ ppm calcium hardness in the 91030 zip, silently attacking the ice maker assembly and water inlet valve until a cycle fails. Households here invest in KitchenAid or Sub-Zero, so fixing usually beats replacing — but only if the technician actually knows the difference between them.

localContext: |
  The 91030 zip covers a compact residential grid running from the Mission District near the A Line (Gold Line) station north up to the hillside streets above Fremont Avenue. Most of this housing stock dates 1910 to 1955 — craftsman bungalows, Spanish colonials, some Tudor revivals — with kitchens retrofitted mid-century rather than purpose-built for modern appliances. Counter-depth refrigerators are the norm in these tight layouts, but they restrict condenser coil airflow more than freestanding models. That becomes a real problem once valley temperatures push into the mid-90s from July through September.

commonProblems:
  - title: "Ice Maker Stops — Hard Water Clogs the Inlet Valve First"
    description: "San Gabriel Valley calcium is relentless, and South Pasadena's tap water is no exception at 280+ ppm. Mineral deposits build up inside the water inlet valve screen and coat the ice maker assembly until the unit can't complete a fill cycle. LG french-door models are frequent casualties — the valve partially blocks, output drops to almost nothing, then stops entirely. Catching it early means a valve swap. Waiting means a full assembly replacement."

  - title: "Running Warm or Loud When Valley Summer Heat Hits"
    description: "August temperatures in South Pasadena regularly reach 95°F, and craftsman kitchens with minimal airflow on three sides make it worse. A dusty condenser coil or a failing condenser fan forces the compressor into extended cycles — you'll hear it as a low constant hum even in the middle of the night. Samsung french-door units with bottom-mounted compressors are especially sensitive to this. A coil cleaning and fan check often prevents a compressor failure that costs four times as much to fix."

  - title: "Water Pooling Under the Fridge on Original Hardwood Floors"
    description: "Craftsman-era hardwood floors don't recover well from standing water. The cause is almost always a frozen defrost drain or a worn door gasket letting warm air in and generating excess condensation. KitchenAid side-by-sides see this frequently — the defrost timer runs too aggressively, the drain tube freezes solid, and water finds the path of least resistance straight down. Catching it in the first few days saves the floor."

faq:
  - q: "How fast can you get to South Pasadena for refrigerator repair?"
    a: "The San Gabriel Valley corridor is our daily route, and South Pasadena is right off the 110 — usually 30 to 45 minutes from our closest tech. Parking on the narrow residential streets near Meridian and Fairview is something we navigate every day. Same-day slots available most days. Call (323) 870-4790 and we'll confirm what's open."

  - q: "Do you repair Bosch and KitchenAid refrigerators in South Pasadena?"
    a: "Both, yes — these are the most common brands we see in this neighborhood. Bosch counter-depth units here typically come in with fan motor or control board issues. KitchenAid side-by-sides usually need ice maker assembly or defrost system work. Sub-Zero built-ins show up occasionally too; those require specialized tooling we carry specifically for them."

  - q: "What does refrigerator repair cost, and do you have same-day availability?"
    a: "Diagnostic visit runs $65 to $95, applied toward the repair cost if you proceed. For a refrigerator that's stopped cooling or is actively leaking, don't wait — call (323) 870-4790 and we'll get a tech out same-day or first thing the next morning. Evening appointments are available through the week. Food spoilage adds up fast once the temp climbs past 40°F."
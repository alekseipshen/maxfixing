title: "South Pasadena Ice Maker — Hard Water Repairs for 91030 Homes"

intro: |
  Craftsman bungalows off Monterey Road and the updated colonials near Garfield Park share
  one quiet failure mode: 91030 tap water runs hard, and ice makers are the first appliance
  to show it. A KitchenAid counter-depth that cycled fine last winter starts producing
  hollow shells by July, then nothing. The water inlet valve is usually the culprit — mineral
  scale bridges the seat and chokes flow before the unit can complete a cycle. South Pasadena
  homes have been on this water since the MWD connection went in decades ago; the supply
  infrastructure is old, and the appliances feel it. Call (323) 870-4790 and we can
  typically be there the same day.

localContext: |
  Most of the residential stock in 91030 was built between 1910 and 1960. Craftsman
  bungalows and Colonial Revival homes dominate the blocks near the Mission Street corridor
  and the Hill Historic District. Kitchens have been updated over the decades, but the
  supply connections and copper stub-outs often haven't. Old fittings pick up mineral
  deposits at every joint.

  The blocks north of Fair Oaks Avenue toward the Arroyo tend to have larger lots and
  bigger kitchens — those homes are where we see Sub-Zero and Thermador built-ins, along
  with the tighter access that comes with cabinetry installed around them. South of Mission
  Street the homes run smaller; counter-depth KitchenAid and Bosch 800 Series units are
  the norm there. Either way, the background scale load from South Pasadena tap water ages
  fill valves considerably faster than in newer construction farther out in the Valley.

commonProblems:
  - title: "Scale-Choked Fill Valve — the Most Common Call in This Zip"
    description: "San Gabriel Valley tap water runs between 280 and 380 ppm TDS depending on
      the seasonal MWD import blend, and South Pasadena sits squarely in that zone. Mineral
      deposits bridge the seat inside the water inlet valve until flow drops below the
      threshold the appliance needs to fill the tray. LG InstaView and KitchenAid
      counter-depth models around 91030 get hit hardest — we see this on nearly every other
      call in this zip. When the inlet valve is the issue, the fix is usually straightforward
      and same-day parts are available for both brands."

  - title: "Frozen Supply Line During Summer Heat"
    description: "San Gabriel Valley summers push refrigerators to run longer, harder cycles.
      If the condenser fan motor is underperforming or the door gasket has even a hairline
      gap, the freezer temperature swings enough to freeze the thin water line feeding the
      ice maker solid. Bosch 800 Series built-ins are particularly prone to this — the supply
      tube runs close to the evaporator coil in that design. The appliance looks broken;
      the line is just frozen. Thawing the line alone doesn't fix it if the gasket or fan
      motor is the root cause — that's what we check first."

  - title: "Optical Sensor Failure on Samsung RF and RS Series"
    description: "Samsung french-door refrigerators use an optical sensor on the shutoff arm
      to detect when the ice bin is full. Hard water film coats the sensor surface and throws
      false 'full bin' readings — production stops even though the bin is empty. Full
      ice maker assembly replacement is not always needed. Cleaning the sensor module or
      swapping just that component fixes it in most cases we diagnose in South Pasadena,
      cutting the repair cost significantly. If the Samsung is showing an error code like
      39E or 40E alongside empty-bin behavior, the sensor is where we start."

faq:
  - q: "How fast can you get to South Pasadena for ice maker repair?"
    a: "We run the San Gabriel Valley corridor daily — Pasadena, Alhambra, and South Pasadena
      are all on the same route. Most days we're there within 2 hours of the call. Residential
      street parking is easy on most 91030 blocks. Call (323) 870-4790 or book a slot online;
      same-day availability most weekdays."

  - q: "Do you repair KitchenAid, Bosch, and Sub-Zero refrigerators in South Pasadena?"
    a: "All three, regularly. KitchenAid counter-depth and Bosch 800 Series ice maker jobs
      come up constantly around 91030. Sub-Zero built-ins appear in the larger homes near
      Fremont Avenue and the Hill District — those require specific tooling for the sealed
      system and ice maker assembly. We stock fill valves and sensor modules for all of them."

  - q: "What does ice maker repair typically cost, and how does the process work?"
    a: "Diagnosis happens on-site before any work starts — price first, then you decide.
      Most repairs in South Pasadena land between $120 and $280. Fill valve replacements
      sit toward the lower end; full ice maker assembly swaps run higher, especially on
      Sub-Zero or Thermador units where OEM parts cost more. Evening slots are available
      for customers who can't do daytime. A freezer without ice in July is not a
      can-wait situation."
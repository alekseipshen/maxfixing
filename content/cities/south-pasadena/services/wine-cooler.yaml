title: "South Pasadena Wine Cooler — Hard Water, Tight Craftsman Kitchens"

intro: |
  The Craftsman bungalows lining Marengo Avenue and the blocks off Mission Street were designed for a different kitchen era. Tight galley layouts, pantry nooks, almost no counter clearance to spare. A KitchenAid 46-bottle under-counter wine cooler fits beautifully into a renovated kitchen — until the thermostat control board starts logging errors and internal temps climb past 65°F. These older South Pasadena homes don't give service techs much room to maneuver. We navigate it every week. South Pasadena's 91030 zip runs a mix of original Craftsman cabinetry and modern remodels — and whoever installed your wine cooler probably had to shim it in sideways.

localContext: |
  Most of 91030 is dense residential — blocks of houses built between 1910 and the early 1950s, mostly Craftsman bungalows and Spanish Colonial revivals near the Arroyo Seco corridor. Retrofitted wine coolers here sit in converted pantry cutouts or under kitchen islands added during remodels from the 1990s onward. Bosch 24-inch undercounter units are a frequent sight. Parking on residential streets off Meridian Avenue is fine; the real challenge is working inside kitchens that were never designed for modern appliances. South Pasadena households skew toward serious wine storage — Thermador and Sub-Zero columns in the higher-end remodels along Fremont Avenue, Bosch and KitchenAid undercounters in the smaller bungalow kitchens. That mix means we carry parts for both the budget-friendly 24-inch compressor units and the dual-zone built-ins that cost more to replace than repair.

commonProblems:
  - title: "Calcium Scale Choking the Drain Pan and Evaporator Coil"
    description: |
      San Gabriel Valley tap water runs seriously hard — calcium carbonate deposits build fast inside the drain pan and along the evaporator coil. In undercounter KitchenAid and Bosch units, that mineral buildup leads to pooling water, a musty smell, and eventually temperature instability as the coated evaporator coil loses efficiency. We see this in 91030 constantly. Drain line clearing combined with coil cleaning usually resolves it in a single visit, no parts needed. Left alone, the scale migrates to the fan blades and the condenser fins — at that point you're looking at a full coil replacement instead of a 30-minute cleaning.
  - title: "Compressor Running Nonstop Through South Pasadena's Hot Months"
    description: |
      June through September brings real heat. Ambient temps in un-air-conditioned Craftsman kitchens can hit 85°F or higher, and the compressor compensates by running without stopping. If the condenser fan motor is even slightly worn, the unit overheats and trips into thermal protection — usually at the worst possible moment. Catching it early means a condenser fan motor swap, not a full compressor replacement. The difference in parts cost is roughly $80 versus $400 or more. On LG dual-zone models specifically, a failing fan shows up as an Er dH error code on the display before the compressor ever shuts down — that's your window to fix it cheap.
  - title: "Door Gasket Failure on Sub-Zero and U-Line Columns"
    description: |
      Sub-Zero and U-Line wine columns installed during kitchen remodels 10 to 15 years ago are hitting the age where the door gasket cracks and deforms. A compromised seal lets warm room air in continuously, forces the compressor into overdrive, and causes temperature swings of 8 to 10 degrees. Moisture appears on the exterior glass. On a Sub-Zero unit, swapping the door gasket takes about 45 minutes. Temperature stabilizes immediately after.

faq:
  - q: "How fast can you get to South Pasadena for wine cooler repair?"
    a: |
      Usually 45 to 60 minutes from the call. We work the 110 Freeway corridor regularly — Pasadena, South Pasadena, Alhambra, San Gabriel. Street parking near the Gold Line station and on the residential blocks off Mission Street is no problem. Call (323) 870-4790 to check today's availability — morning same-day slots tend to fill first.
  - q: "Do you repair Bosch and KitchenAid wine coolers in South Pasadena?"
    a: |
      Both are the most common brands we see in these kitchens. Bosch undercounter units frequently need door gasket assembly replacement or thermostat calibration. KitchenAid 24-inch models tend to develop drain pump failures after five or six years of use — the pump motor seizes from the same hard water sediment that clogs the drain pan. Sub-Zero and U-Line wine columns come up regularly too — both require brand-specific gaskets and control board diagnostics. Thermador columns are less common in South Pasadena but we stock the standard parts for those as well.
  - q: "What does wine cooler repair cost, and is same-day service available?"
    a: |
      Diagnosis is $79, credited toward the repair if you move forward. Typical fixes — drain line clearing, door gasket swap, or control board replacement — run $150 to $280. Compressor work on premium brands costs more; we quote before ordering anything. Evening and weekend emergency slots are available if the cooler fails ahead of a planned dinner or gathering.
title: "South Pasadena Freezer — Craftsman Kitchens, Cold Storage Fixed Fast"

intro: |
  Marengo Avenue's 1920s craftsman bungalows weren't built with column freezers in mind, but
  plenty of 91030 households have retrofitted them anyway. A KitchenAid built-in that stops
  reaching temperature in July — with a full stock of bulk groceries inside — is a real problem.
  South Pasadena runs warmer than its tree-lined streets suggest. Old wood-frame walls trap
  afternoon heat, and freezers compensate by running longer, harder cycles until something finally
  gives out. By the time temperature starts creeping up in the drawer section, the compressor has
  usually been struggling for days already.

localContext: |
  Most housing in 91030 dates to 1910–1955 — craftsman bungalows on Fremont Avenue, Spanish
  colonials near Mission Street, mid-century ranches closer to the Alhambra border. Kitchens in
  these homes were designed before appliance depth was standardized, so getting a technician and
  tools into a tight 1930s kitchen without damaging original hardwood floors or trimwork takes
  real planning. LA hard water hits South Pasadena appliances too — mineral scale buildup inside
  ice maker assemblies and water inlet lines is a common secondary issue we find when opening
  these units up. Condenser coil clearance is often below manufacturer spec in older cabinet
  layouts, and that accelerates compressor wear every summer.

commonProblems:
  - title: "Evaporator Coil Icing in Under-Ventilated Cabinet Retrofits"
    description: |
      Tight cabinet retrofits in South Pasadena's older homes choke off airflow around the
      condenser coil. The defrost heater assembly gets overwhelmed, the defrost timer cycles fall
      out of sequence, and ice packs onto the evaporator coil until airflow stops entirely. Once
      that coil is fully iced, the unit runs nonstop but produces no cold — you'll see frost
      inside but nothing stays frozen. Samsung french-door models with bottom-freezer drawers are
      frequent cases here; the defrost drain tube blocks too, and water pools under the crisper
      drawer before long.

  - title: "Compressor Burnout From San Gabriel Valley Summer Heat"
    description: |
      July and August push kitchen ambient temps in 91030 past 90°F by early afternoon,
      especially in south-facing rooms. A compressor already running at capacity hits thermal
      limits fast under that sustained load. Thermador column units in homes off Fair Oaks Avenue
      follow this pattern every summer — the compressor runs continuously, pulls excessive
      amperage, and eventually trips the overload protector or seizes outright. Earliest warning
      sign: loud constant operation, but nothing inside gets below 20°F even after running
      all day.

  - title: "Door Gasket Failure Causing Gradual Temperature Creep"
    description: |
      South Pasadena's seasonal swings — cold wet winters, dry 95°F summers — stress door
      gaskets harder than a stable climate would. Once a gasket cracks or warps, warm air seeps
      in constantly. Power consumption climbs as the freezer tries to compensate, frost crystals
      form on the interior back wall, and temperature fluctuates 15–20 degrees throughout the
      day. Sub-Zero freezer drawers in the higher-income homes near Meridian Avenue typically show
      gasket failure after 8 to 10 years of that kind of thermal cycling — a predictable
      repair in this neighborhood.

faq:
  - q: "How fast can you get to South Pasadena for a freezer repair?"
    a: |
      South Pasadena sits right off the 110 — an easy route from our Alhambra and Pasadena
      service stops. Same-day appointments are available most days. Call (323) 870-4790 in the
      morning and we can usually dispatch within 2 hours. If food is already thawing, we have
      emergency evening slots most weekdays.

  - q: "Do you repair KitchenAid and Sub-Zero freezers in South Pasadena?"
    a: |
      Both are common in 91030 and we stock parts for each. KitchenAid column freezer units
      often need specific evaporator components or control board replacements that most shops
      don't carry. Sub-Zero built-ins require refrigerant calibration and specialized tooling.
      Bosch and LG freezers are also regulars on our South Pasadena routes — parts for all four
      usually come on the truck.

  - q: "What does a freezer repair cost, and is the diagnostic included?"
    a: |
      Diagnostic is included in the service call. Most repairs land between $150 and $400 — a
      thermal fuse or door latch assembly on the lower end, a compressor replacement on the
      higher end. If food is already at risk, call (323) 870-4790 directly; same-day emergency
      slots are sometimes available in the afternoon and we'll tell you upfront what we find
      before starting any work.
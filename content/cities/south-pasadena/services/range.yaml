title: "South Pasadena Range — Pre-War Kitchens, Modern Gas Problems"

intro: |
  Craftsman bungalows along Monterey Road and near Mission Street in 91030 often hold a
  specific contradiction: a KitchenAid or Bosch slide-in fitted into a kitchen where the
  gas stub-out hasn't been touched since Eisenhower. Sediment in old flex connectors causes
  pressure drops that mimic a failing spark module — and misdiagnosing that means an
  unnecessary control board replacement. South Pasadena's pre-war housing stock makes range
  repair genuinely different here than in newer construction.

localContext: |
  Most homes in the 91030 zip code were built between 1910 and 1945 — the original
  Craftsman era — and while kitchens have been renovated, the gas infrastructure underneath
  often hasn't. Near the Fair Oaks Avenue corridor, undersized flex connectors feeding
  slide-in ranges are a consistent find; those ranges need steady pressure to run right.
  Streets like El Centro and Lyndon also show the classic 1920s layout: compact kitchens
  with tight clearance that complicate any service call requiring a full range pull-out.

  South Pasadena High School sits about four blocks from some of the densest concentration
  of pre-war housing in the San Gabriel Valley. Pull off Orange Grove Avenue or Diamond
  Avenue and you're in blocks of bungalows where the original 3/4-inch gas supply line is
  still the main feed. That's undersized for a modern dual-fuel Thermador or a five-burner
  KitchenAid range pulling full BTUs. We see it documented in city permit records and we
  see it in the field: pressure drops that make a perfectly good igniter look broken.

  The Meridian area near the Gold Line station has seen more kitchen renovations in the
  last decade — and that's exactly where we find the mismatch problem most often. A new
  Bosch slide-in dropped into a 1928 kitchen, connected to whatever flex hose was already
  there. The range runs fine until you use all five burners at once, then the back two
  drop to a whisper flame.

commonProblems:
  - title: "Spark Module Failures in Homes with Aging Gas Connections"
    description: |
      KitchenAid and LG ranges in older South Pasadena kitchens often develop ignition clicks
      that just won't fire. Moisture contamination on the spark module is typical in homes where
      the range sits against an exterior-facing wall with condensation issues. Replacing the
      spark module and clearing the burner orifices restores full ignition — misattributing
      this to the control board is an expensive mistake. A failed spark module on a KitchenAid
      KSGG700ESS typically runs under $90 in parts; a control board on that same model is
      closer to $350. The diagnosis matters.
  - title: "Oven Stalling Below Temperature on Gas Ranges"
    description: |
      Gas valve igniters in Bosch and Thermador ranges degrade without warning. The oven climbs
      to 300°F and stops — no error code, just undercooked food. The igniter weakens over time
      and can no longer hold the valve open long enough to sustain a proper flame. Diagnosis
      takes roughly 20 minutes; most repairs are completed same-day. Thermador Pro Harmony
      models in South Pasadena's larger homes on Rollin Street or near the Arroyo Seco
      boundary are a common call for exactly this failure — igniter current drops below the
      threshold and the gas valve closes as a safety measure.
  - title: "Uneven Burner Flame From Clogged Orifices and Pressure Drops"
    description: |
      Narrower side streets in South Pasadena sometimes feed off undersized gas mains, causing
      fluctuating pressure across burner orifices. Samsung and LG slide-in owners report one or
      two burners running visibly low and assume it's the range. Partially clogged orifices
      combined with a marginal pressure reading — both need to be addressed, or the same
      symptom returns within a few months. Checking manifold pressure with a manometer takes
      five minutes and immediately separates an appliance problem from a supply problem.
      That step alone saves a lot of unnecessary part swaps.

faq:
  - q: "How fast can you get to South Pasadena for range repair?"
    a: |
      We run the 626 corridor regularly and can usually reach South Pasadena within 2 hours.
      Parking on residential Craftsman blocks is generally fine for the van. Call us at
      (323) 870-4790 to check same-day availability — morning calls usually land an
      afternoon slot.
  - q: "Do you repair Bosch and Thermador ranges in South Pasadena?"
    a: |
      Yes — both come up constantly in this area. Bosch ignition issues and Thermador spark
      switch failures are regular calls. We also handle KitchenAid, LG, Samsung, and GE
      slide-ins. Most brand-specific parts travel in the van, which keeps return visits rare.
  - q: "What does a range diagnostic cost, and is same-day service available?"
    a: |
      Diagnostic is $75 and goes toward the repair if you proceed. Same-day slots are open
      most weekdays — call (323) 870-4790 before noon and we can typically arrive by late
      afternoon. Evening appointments are available for South Pasadena residents on request.
  - q: "Can you work on ranges in tight Craftsman kitchens without damaging anything?"
    a: |
      That's a real concern in 91030 — original tile backsplashes, narrow cabinets, zero
      extra clearance. Pulling a 30-inch slide-in out of a 1930s kitchen takes patience and
      the right approach. We use furniture sliders and work slowly. Haven't scratched a
      hardwood floor yet. If the kitchen is especially tight, mention it when you call
      (323) 870-4790) and we'll bring the right gear.
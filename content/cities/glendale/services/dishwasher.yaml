      heavy-cycle flooding, and KitchenAid inlet valve failures that cause
      no-fill errors. Parts for all four are stocked on the van for most
      standard repairs."
  - q: "What does dishwasher repair typically cost in Glendale?"
    a: "Drain pump replacement usually runs $120–180. Float switch and inlet

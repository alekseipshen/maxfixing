title: "Glendale Dishwasher Repair — Hard Water Buildup Fix"

intro: |
  Hard Colorado River water flows through every tap in the 91205 zip — and
  dishwashers take the worst of it. That KitchenAid built into a 1960s kitchen
  off Glendale Avenue starts throwing cloudy glassware within months because the
  spray arm nozzles cake up with calcium carbonate. It's not the machine dying;
  it's chemistry, and it's fixable same day. The float switch, inlet valve, and
  heating element all suffer from the same mineral load — Glendale's water
  hardness regularly tests above 300 ppm, which is hard by any measure.

localContext: |
  Housing around Adams Hill and the Chevy Chase Drive corridor was mostly built
  in the 1950s and '60s, so dishwashers often sit in original tight cabinet
  cutouts. Zip code 91206 mixes condos and older single-family homes where the
  drain pump and door latch assembly can't be serviced without pulling the unit
  completely out. Compact kitchens, older plumbing, limited clearance — this
  area has all of it. Parking on Brand Boulevard and the side streets near
  Kenneth Road takes planning; service vans need a real spot, not a red zone.
  Multi-unit buildings near the 134 freeway corridor sometimes have shared
  laundry hookups routed near the kitchen stack, which complicates drain line
  access during a repair.

commonProblems:
  - title: "Mineral Scale Clogging Spray Arms — 91205 Hard Water"
    description: "Calcium deposits from Glendale's tap water pack into spray arm
      nozzles faster than most places in LA County. The heating element gets
      coated too, which leaves dishes wet and drives up the electricity bill.
      Samsung and LG units in this area frequently trigger E1 or LE error codes
      that look like control board failures but are usually just severe mineral
      buildup. A descale of the spray arm and a heating element inspection is
      often all it takes — no parts needed, done in under an hour."
  - title: "Standing Water After Every Cycle"
    description: "Drain pump failure accounts for most dishwasher calls in
      Glendale's denser neighborhoods. Food debris and grease accumulate in the
      pump impeller, especially in multi-generational homes with heavy daily
      cooking. Bosch 300 Series units here frequently throw E24 error codes when
      the drain filter or pump impeller is fully blocked — not a control board
      issue. Clearing the impeller and checking the check valve usually resolves
      it without a full pump replacement."
  - title: "Detergent Dispenser Door Stuck Closed"
    description: "Older GE and Whirlpool models have a dispenser latch that
      fails after years of heat cycling. Dishes come out dirty, owners assume
      the whole machine is shot. Ninety percent of the time it's just the wax
      motor actuator or the spring behind the dispenser door — a minor repair,
      not a replacement. Whirlpool's WDF series and older GE Profile models are
      particularly prone to this after the seven-year mark."


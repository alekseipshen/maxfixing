title: "Glendale Cooktop Repair — Gas & Ceramic Burners Fixed Fast"

intro: |
  Kitchens in the Adams Hill neighborhood were plumbed for gas from the start — most of these houses date to the 1940s and '50s — and those lines still feed KitchenAid and GE cooktops well past their 15-year mark. Spark electrodes clog with grease and mineral residue. Burner ports narrow and stop venting cleanly. Glendale's tap water is hard, and it accelerates every one of these failures without much warning. We cover this area regularly and can usually get there the same afternoon.

localContext: |
  Zip codes 91205 and 91206 are dense with post-war ranch homes and California bungalows, most built between 1945 and 1965. Cooktops in these kitchens are often set into original tile countertops that haven't changed since the 1980s — removing a cracked ceramic surface without damaging the surround takes careful templating and the right tools.

  Along Brand Boulevard, from the Americana at Brand north toward Glendale Community College, apartment complexes installed compact Samsung and LG 30-inch units in the mid-2000s. Those are now 15 to 20 years in, right when control boards start acting up and burner zones go intermittent.

  Glendale's municipal water supply pulls from the Verdugo Mountains watershed and the MWD blend, and routinely tests above 300 ppm total dissolved solids — some blocks in Montrose and La Crescenta run even harder. That mineral load silts up burner ports on gas cooktops and coats induction coil surfaces on electric units faster than most homeowners expect. A GE or Whirlpool that seemed fine six months ago can suddenly have two dead zones.

  The stretch of residential streets east of San Fernando Road — the dense Armenian community neighborhood between Glenoaks and Broadway — has a high concentration of older gas ranges and cooktops in multi-family buildings. Access is often tight: narrow driveways, street parking only, units stacked close together. Our vans are compact enough to work these blocks, and we schedule accordingly so we're not fighting Glendale rush hour on Central Avenue.

commonProblems:
  - title: "Burner won't light — fouled spark electrodes and clogged ports"
    description: "Glendale's municipal water runs well above 300 ppm in mineral content, and those deposits accumulate inside burner ports and coat the spark electrode tip year after year. Once fouled, the igniter clicks but nothing catches — sometimes for weeks before the homeowner calls. KitchenAid and Bosch gas cooktops are the models we see this on most often around 91206. Cleaning the ports and swapping a corroded electrode usually resolves it in one visit."
  - title: "Cracked ceramic glass surface from thermal shock"
    description: "Samsung and LG glass-ceramic tops crack from the same scenario almost every time: a cold cast-iron pan dropped on a hot surface, or cold water splashing during a high-heat cook. The burner underneath may still function, but a cracked surface is a safety issue and the panel needs to come out. Surface replacement is a full swap — we stock common 30-inch sizes for both brands and can usually source less common cuts within a day."
  - title: "Knob spins freely but won't control gas flow"
    description: "On older GE and Whirlpool gas cooktops, the rotary knob wears out at the valve stem connection — it turns but doesn't engage the gas valve properly, so you get no flame or unpredictable flame height. Replacing the knob assembly is usually all that's needed. If the stem itself is stripped underneath, that becomes a more involved repair, but after the diagnostic we'll tell you exactly what you're looking at before any parts are ordered."


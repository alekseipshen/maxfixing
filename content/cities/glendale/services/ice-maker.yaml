  - q: "My Bosch or Whirlpool stopped making ice after a filter change — is that related?"
    a: |
      Almost always yes. Swapping a water filter on a Bosch or Whirlpool can introduce an air lock in the inlet line that starves the tray. On Bosch models, a pressure sensor can misread after a filter swap and prevent the fill cycle from starting altogether. Run two or three dispenser water cycles to purge the air first. Still nothing? That's a 20-minute diagnostic in Glendale — call (323) 870-4790 and we'll walk through it on the phone or schedule a same-day visit.
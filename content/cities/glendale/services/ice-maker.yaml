title: "Glendale Ice Maker Repair — Hard Water Kills Ice Makers Fast"

intro: |
  Hard water running through Glendale's pipes — particularly in the 91205 and 91206 zip codes near the base of the Verdugo Mountains — attacks ice makers in ways that aren't obvious until production stops entirely. Samsung french-door refrigerators in Adams Hill regularly hit fill valve failure inside 24 months from mineral scale buildup alone. That's not a defective unit. That's LA water doing what LA water does.

  Glendale's municipal supply consistently tests between 250 and 300 ppm hardness — among the highest readings in the San Fernando Valley corridor. A budget GE side-by-side in a 91203 rental fights that mineral load the same as a KitchenAid built-in in a Verdugo Woodlands single-family home. Same water, same damage, different price tag on the fridge.

localContext: |
  Glendale's housing mix matters for this kind of service call. Older 1940s and 1950s bungalows in Rossmoyne and Chevy Chase Canyon often have narrow galley kitchens — pulling a refrigerator out to reach the water line behind it adds real time to a call.

  Zip code 91207 is dense with 1960s apartment buildings where side-by-side and french-door refrigerators were retrofitted in, meaning water line routing is improvised and access behind the unit is never straightforward.

  The Brand Boulevard corridor is a different story: newer construction condos with tight kitchen layouts and LG or Samsung stainless installs that look great but pack the plumbing into a corner. Getting to the water inlet valve on a top-freezer LG in one of those 91204 kitchens sometimes means removing lower cabinet panels before you even see the back wall. Glendale technicians unfamiliar with the local building stock waste 45 minutes finding out the hard way.

commonProblems:
  - title: "Mineral Scale Choking the Fill Valve"
    description: |
      Glendale's water hardness deposits calcium directly into the fill valve — the part controlling water flow into the ice maker tray — until nothing gets through. LG InstaView refrigerators are especially prone here; their narrow-bore fill valve orifice scales up faster than older wide-bore designs. No water in means no ice out, simple as that.

      The fix isn't just replacing the valve. Flushing the inlet line and checking the water filter housing for scale prevents the new valve from choking out inside another year. On a Samsung with a secondary inline filter, that housing is often the real culprit — the valve takes the blame because it's easier to see.

  - title: "Frozen Water Supply Line Behind the Unit"
    description: |
      Older Glendale homes with saddle valve taps on copper supply lines see this constantly. The pinhole saddle valve restricts flow just enough that water sits in the thin plastic inlet line and freezes at the connection point.

      Whirlpool side-by-sides backed against exterior walls in 91204 are repeat offenders — the refrigerator runs fine but production stops entirely. Replacing the saddle valve with a proper compression fitting and insulating the line behind the unit solves it for good.

  - title: "Ice Level Sensor Coated by Hard Water Dust"
    description: |
      The optical ice level sensor — a small infrared emitter and receiver pair — gets filmed over by mineral particulate carried in hard water vapor. GE Profile refrigerators with their sensor-based shutoff show this symptom constantly in Glendale: the machine reads a full bin, shuts off, and the bin is half-empty. Cleaning the sensor lens or swapping the sensor module gets production back to normal within the same visit.

      This one gets misdiagnosed constantly. Homeowners call it a control board issue because the display looks normal.

      In Glendale specifically, with water this hard, check the optical sensor before touching the board.


commonProblems:
  - title: "Mineral Scale Blocking Drainage in Older Glendale Units"
    description: "Glendale tap water runs 250–300 ppm hardness — calcium deposits clog
      the drain pump filter and pump housing over time. Samsung front-loaders throw
      an E2 or 5E error when this happens. The pump itself often still works; it's
      the buildup restricting flow. Clean the filter first, but if the pump impeller
      is corroded, the pump needs replacing."
  - title: "Excessive Vibration in Stacked Laundry Setups"
    description: "Stacked LG units in Glendale's denser apartment buildings are notorious
      for shock absorber wear — the machine starts walking across the floor on spin
      cycles. Worn shock absorbers transfer load to the drum spider and bearings,
      which is a much more expensive fix. Catching it early at the absorber stage
      saves $200–300 in downstream damage."
  - title: "Door Lock Failure on Front-Loaders After Hard Water Cycles"
    description: "Mineral residue gets into the door latch assembly on Whirlpool and
      Bosch front-loaders, jamming the interlock solenoid. The machine refuses to
      start, sometimes flashing an F8 or door error code. Replacing the latch
      assembly runs about an hour of labor. Skip the DIY repair here — forcing the
      door on a broken latch cracks the tub seal."

